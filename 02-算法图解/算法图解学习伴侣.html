quot;]\n    op --&gt; L4[&quot;O(n²) 抛物线&quot;]\n    op --&gt; L5[&quot;O(n!) 爆炸&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：五条曲线在 n 小时差别不大，n 一大就天壤之别。选算法就是选曲线的形状。<\/p>\n<h2>详解<\/h2>\n<ul><li>\n<strong>不是秒数<\/strong>：O(n) = &quot;操作数和 n 成正比&quot;，每步 1 毫秒还是 1 秒是常数，大O不关心。\n<\/li><li>\n<strong>是最糟情况<\/strong>：简单查找一次翻中目标是 O(1) 运气，但大O写 O(n)——它给的是&quot;保证不会更差&quot;的上限。\n<\/li><li>\n<strong>忽略常数<\/strong>：O(2n)、O(n/2)、O(n+26) 全简写为 O(n)。第 4 章补刀：大O相同时常数才有意义（快排 vs 合并排序）。\n<\/ul>\n<p><strong>常见档位（从快到慢）<\/strong>：O(log n) &lt; O(n) &lt; O(n log n) &lt; O(n²) &lt; O(n!)。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;n 越大 O(1) 和 O(n) 差距不变&quot;——实际上差距随 n 线性放大。\n<\/li><li>\n别以为&quot;最糟情况没意义&quot;——它是给你的承诺：算法永远不会更慢。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第1章<\/td><td>二分查找 vs 简单查找<\/td><td>O(log n) vs O(n)，n=10 亿时差 3300 万倍<\/td><\/tr><tr><td>第2章<\/td><td>选择排序<\/td><td>找 n 次 × 每次 O(n) = O(n²)，常数 1/2 被省略<\/td><\/tr><tr><td>第4章<\/td><td>快排平均/最糟<\/td><td>平均 O(n log n)，最糟 O(n²)；快排常数比合并排序小<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：无（第 1 章引入）\n<\/li><li>\n后续：递归与调用栈（理解快排栈高为何是 O(log n)）\n<\/ul>", "c02": "<h1>递归与调用栈<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 3、4 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p><strong>递归是函数调用自身；基线条件负责刹车，调用栈（一摞后进先出的便条纸）负责记住每个暂停在半路的函数。<\/strong><\/p>\n<h2>为什么重要<\/h2>\n<p>全书第二个里程碑：第 4 章的快速排序、分而治之，全建立在递归上。理解调用栈，你才能解释&quot;为什么栈高是 O(log n) 而不是 O(n)&quot;。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[&quot;fact(3) 压栈&quot;] --&gt; B[&quot;fact(2) 压栈&quot;]\n    B --&gt; C[&quot;fact(1)=1 命中基线&quot;]\n    C --&gt; D[&quot;弹栈: fact(2)=2×1=2&quot;]\n    D --&gt; E[&quot;弹栈: fact(3)=3×2=6&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：向下递归 = 栈增厚；基线条件触发 = 从最里层往回结算，每个暂停的函数从断点继续。<\/p>\n<h2>详解<\/h2>\n<ul><li>\n<strong>两半缺一不可<\/strong>：递归条件（调自己）+ 基线条件（不再调）。没有基线 = 无限递归 = 栈溢出。\n<\/li><li>\n<strong>每层独立<\/strong>：fact(3) 的 x 和 fact(2) 的 x 是不同变量，互不干扰。\n<\/li><li>\n<strong>代价<\/strong>：每次压栈都占内存。递归太深 → 栈溢出崩溃；解法是改写循环或尾递归。\n<\/li><li>\n<strong>D&amp;C 心法<\/strong>：找最简单到不用干的基线条件（数组题通常是空/单元素数组），再想每次怎么把问题缩小一圈。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为递归&quot;性能更好&quot;——它的价值是思路清晰，内存开销反而更大。\n<\/li><li>\n别以为&quot;递归层数和栈高是一回事&quot;——快排平分时栈高 O(log n)，因为每层同时处理左右两个子问题，串行调用的总次数是 O(n) 但栈的<strong>深度<\/strong>只有 O(log n)。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第3章<\/td><td>factorial/countdown<\/td><td>基线+递归两条件；调用栈压入弹出<\/td><\/tr><tr><td>第4章<\/td><td>快排与 D&amp;C<\/td><td>基线为空/单元素数组；栈高决定平均 O(n log n) vs 最糟 O(n²)<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：大O表示法\n<\/li><li>\n后续：动态规划（递归的另一种落地——自底向上填表）\n<\/ul>", "c03": "<h1>数组与链表<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 2 章（第 5、6 章反复用）\n<\/ul>\n<h2>一句话定义<\/h2>\n<p><strong>数组 = 元素紧挨存放、靠编号直接定位（读取 O(1)、插删 O(n)）；链表 = 元素散落、靠&quot;下一个的地址&quot;串联（插删 O(1)、顺序读 O(n)）。<\/strong><\/p>\n<h2>为什么重要<\/h2>\n<p>它们是全书所有高级数据结构的地基：散列表用数组存储 + 链拉链；图用散列表表示邻接；队列/栈是受限的链表。选错地基，上层算法全错。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph LR\n    subgraph 数组\n      a0[&quot;#0&quot;] --- a1[&quot;#1&quot;] --- a2[&quot;#2&quot;] --- a3[&quot;#3&quot;]\n    end\n    subgraph 链表\n      n1[&quot;元素→地址92&quot;] --&gt; n2[&quot;元素→地址11&quot;] --&gt; n3[&quot;元素→地址55&quot;]\n    end<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：数组一行连坐，知道编号就能跳；链表是寻宝纸条，只能从头顺着摸。<\/p>\n<h2>详解<\/h2>\n<table><thead><tr><th>操作<\/th><th>数组<\/th><th>链表<\/th><\/tr><\/thead><tbody><tr><td>随机读取<\/td><td>O(1)<\/td><td>O(n)<\/td><\/tr><tr><td>开头/结尾插入<\/td><td>O(n)<\/td><td>O(1)<\/td><\/tr><tr><td>删除（已站在旁边）<\/td><td>O(n)<\/td><td>O(1)<\/td><\/tr><\/tbody><\/table>\n<ul><li>\n索引从 0 开始；第 2 个元素在索引 1。\n<\/li><li>\n数组中间插入要整体后移，可能还要整块搬家（预留座位是权宜之计）。\n<\/li><li>\n真实系统常混合：原书 Facebook 例子 = 26 个桶各挂一条链表；第 5 章的散列表也是数组+链表拉链。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;链表更快&quot;——它只在插删场景快；要随机访问（二分查找）必须数组。\n<\/li><li>\n别以为&quot;删除链表元素一定 O(1)&quot;——前提是你已经找到那个元素；光&quot;找&quot;这步可能就是 O(n)。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第2章<\/td><td>选择排序/记账/队列<\/td><td>读取多选数组，插删多选链表<\/td><\/tr><tr><td>第5章<\/td><td>散列表冲突拉链<\/td><td>数组位置挂链表，越长越慢<\/td><\/tr><tr><td>第6章<\/td><td>BFS 队列<\/td><td>deque 实现，队首出队尾进<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：无\n<\/li><li>\n后续：散列表（数组 + 散列函数）\n<\/ul>", "c04": "<h1>散列表<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 5、6 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p><strong>散列表 = 散列函数 + 数组：散列函数把&quot;键&quot;算成数组下标，于是查找/插入/删除平均都 O(1)。<\/strong><\/p>\n<h2>为什么重要<\/h2>\n<p>全书最有用的数据结构：电话簿、投票查重、网页缓存、图的邻接表示、BFS 队列里的搜索表——全是散列表。Python 的 dict 就是它。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph LR\n    key[&quot;键: 商品名&quot;] --&gt; hash[&quot;散列函数&quot;]\n    hash --&gt; idx[&quot;下标 4&quot;]\n    idx --&gt; arr[&quot;数组[4] = 价格&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：没有&quot;查找&quot;这一步——散列函数直接告诉你答案在哪。<\/p>\n<h2>详解<\/h2>\n<ul><li>\n散列函数两要求：一致性（同输入同输出）、均匀性（不同输入尽量不同位置）。\n<\/li><li>\n<strong>冲突<\/strong>：两键撞到一起 → 该位置挂链表；散列函数烂就退化成 O(n)。\n<\/li><li>\n<strong>填装因子<\/strong> = 已占用位置 ÷ 总位置；&gt; 0.7 就扩容（数组翻倍 + 重散列）。\n<\/li><li>\n性能：平均 O(1)，最糟 O(n)（全撞车）。\n<\/ul>\n<p><strong>三大用途<\/strong>：模拟映射（姓名→号码）、防重复（投票名单）、缓存（URL→页面数据）。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;散列表查找不用比较&quot;——它比较的是散列值是否一致，这就是它快的原因。\n<\/li><li>\n别以为&quot;冲突是 bug&quot;——冲突必然发生，好的散列函数只是把它摊薄。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第5章<\/td><td>杂货铺价格本<\/td><td>O(1) 查询；填装因子 &gt;0.7 扩容<\/td><\/tr><tr><td>第6章<\/td><td>图的邻接表示<\/td><td>graph[&quot;you&quot;] = [&quot;alice&quot;,&quot;bob&quot;,&quot;claire&quot;]<\/td><\/tr><tr><td>第7章<\/td><td>狄克斯特拉 costs/parents<\/td><td>三个散列表存图与开销<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：数组与链表\n<\/li><li>\n后续：图与最短路径\n<\/ul>", "c05": "<h1>图与最短路径<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 6、7 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p><strong>图 = 节点 + 边；&quot;最短路径&quot;有两种口径——非加权图用 BFS 找段数最少，加权图用狄克斯特拉找总权重最小。<\/strong><\/p>\n<h2>为什么重要<\/h2>\n<p>原书说图算法是最有用的一类：人际网络、地图导航、任务依赖、网页链接结构，全都是图。选 BFS 还是狄克斯特拉，取决于&quot;每段路有没有权重&quot;。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph TD\n    Q[&quot;要找 A 到 B 的最短路径&quot;] --&gt; W{&quot;边有权重吗?&quot;}\n    W --&gt;|没有, 只数段数| BFS[&quot;BFS: 队列逐层扩展&lt;br/&gt;O(V+E)&quot;]\n    W --&gt;|有, 要总权重最小| DK{&quot;有负权边吗?&quot;}\n    DK --&gt;|没有| DJ[&quot;狄克斯特拉&lt;br/&gt;每步选最便宜节点&quot;]\n    DK --&gt;|有| BF[&quot;贝尔曼-福德&lt;br/&gt;(本书不展开)&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：这是原书第 6、7 章合起来的决策树；选错算法（如在加权图上用 BFS）会得到&quot;段数最少但不是最快&quot;的路径。<\/p>\n<h2>详解<\/h2>\n<ul><li>\n有向图（箭头单向）/ 无向图（双向，本质是环）/ 树（无回边的特殊图）。\n<\/li><li>\nBFS 标配：队列（FIFO）+ 已检查名单（防重复防无限循环）。\n<\/li><li>\n狄克斯特拉四步：选最便宜节点 → 更新邻居开销 → 重复 → 父节点回溯。\n<\/li><li>\n负权边 = 狄克斯特拉红线。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;最短路径就是路程最短&quot;——它可能是换乘最少、费用最少，取决于你给边赋什么权重。\n<\/li><li>\n别以为&quot;狄克斯特拉能处理负权边&quot;——负权会破坏&quot;已处理节点不可能更便宜&quot;的假设。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第6章<\/td><td>芒果销售商/公交换乘<\/td><td>BFS 找一度→二度→三度关系<\/td><\/tr><tr><td>第7章<\/td><td>换钢琴/导航<\/td><td>加权图用狄克斯特拉，负权换贝尔曼-福德<\/td><\/tr><tr><td>第8章<\/td><td>旅行商<\/td><td>途经所有点的最短路径 = NP 完全<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：散列表（表示图）、队列\n<\/li><li>\n后续：贪婪策略与 NP 完全（旅行商是图问题的 NP 完全变体）\n<\/ul>", "c06": "<h1>贪婪策略与 NP 完全<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 8 章（呼应第 1 章旅行商）\n<\/ul>\n<h2>一句话定义<\/h2>\n<p><strong>贪婪 = 每步选眼前最优；NP 完全问题 = 精确解要试遍所有组合（2ⁿ 或 n!）的问题，实战中放弃精确解、用贪婪近似凑合。<\/strong><\/p>\n<h2>为什么重要<\/h2>\n<p>这是原书的&quot;避坑指南&quot;：很多新手在 NP 完全问题上死磕最优解，浪费数周。学会一眼认出这类问题，立刻切换到近似算法，是算法工程师的核心判断力。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph TD\n    P[&quot;遇到难题&quot;] --&gt; S{&quot;n 一大就慢到爆炸?&quot;}\n    S --&gt;|否| OK[&quot;用精确算法&quot;]\n    S --&gt;|是| C{&quot;涉及所有组合/排列?&quot;}\n    C --&gt;|是| NP[&quot;NP 完全&quot;]\n    NP --&gt; G[&quot;贪婪近似: 快+简单+接近最优&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：原书识别 NP 完全的蛛丝马迹——组合爆炸、序列、集合、无法拆成独立子问题。<\/p>\n<h2>详解<\/h2>\n<ul><li>\n贪婪何时精确最优：教室调度（每次选结束最早）。\n<\/li><li>\n贪婪何时只是近似：背包（先偷最贵音响 $3000，输给 $3500 组合）。\n<\/li><li>\n集合覆盖：精确解 O(2ⁿ)；贪婪近似 O(n²)。\n<\/li><li>\n旅行商：路线数 n!；10 城就 360 万条。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;贪婪算法=偷懒&quot;——对某些问题它就是最优解。\n<\/li><li>\n别以为&quot;NP 完全是因为算力不够，升级电脑就能解&quot;——2ⁿ 比任何硬件升级都快。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第1章<\/td><td>旅行商 5 城 120 条路<\/td><td>O(n!) 引入<\/td><\/tr><tr><td>第8章<\/td><td>集合覆盖/背包<\/td><td>贪婪近似 + NP 完全识别清单<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：大O表示法\n<\/li><li>\n后续：动态规划（与贪婪互补——能拆成独立子问题就 DP，不能就贪婪近似）\n<\/ul>", "c07": "<h1>动态规划<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 9 章（承接第 8 章背包问题）\n<\/ul>\n<h2>一句话定义<\/h2>\n<p><strong>动态规划 = 把大问题拆成网格状的小问题，每个格子存&quot;这个子问题的最优解&quot;，填完网格大问题自然现形。<\/strong><\/p>\n<h2>为什么重要<\/h2>\n<p>它和贪婪是处理同一类&quot;约束下求最优&quot;问题的两种武器：子问题能独立拆分时用 DP 拿精确最优（背包 $3500）；子问题互相依赖或要求快时用贪婪拿近似。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph TD\n    P[&quot;原问题: 4磅背包&quot;] --&gt; S[&quot;子问题: 1/2/3磅背包&quot;]\n    S --&gt; G[&quot;网格逐行逐列填最大值&quot;]\n    G --&gt; A[&quot;最后一格 = 全局最优&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：关键不是&quot;递归&quot;，而是&quot;把所有子问题答案存进格子，避免重复算&quot;。<\/p>\n<h2>详解<\/h2>\n<ul><li>\n每格公式：max（不拿当前商品的旧值 / 拿当前商品 + 剩余容量格子的最优值）。\n<\/li><li>\n两个变种公式：\n<ul>\n<li>\n最长公共子串：字母相同 = 左上+1；不同 = 0。\n<\/li><li>\n最长公共子序列：字母相同 = 左上+1；不同 = max（上, 左）。\n<\/li><li>\n适用边界：子问题离散独立；不能偷散装；粒度要对（0.5 磅商品需要更细的列）。\n<\/li><li>\n答案位置：背包在右下角；子串/子序列在网格最大值处。\n<\/ul>\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;动态规划=递归&quot;——它是自底向上填表，和递归方向相反。\n<\/li><li>\n别以为&quot;加新商品要整张表重算&quot;——只需加一行。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第8章<\/td><td>背包贪婪失败<\/td><td>引出&quot;想要精确最优怎么办&quot;<\/td><\/tr><tr><td>第9章<\/td><td>背包网格/公共子串/子序列<\/td><td>网格+递推公式；DNA/git diff 应用<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：贪婪策略与 NP 完全\n<\/li><li>\n后续：无（本书终点；进阶可碰线性规划）\n<\/ul>", "__path__": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：二分查找与大O：建立速度直觉<\/strong><br>阅读：<a href=\"#/chapter/ch01\">第 1 章：算法简介<\/a><br>检查点：通过 ch01 自测题（≥80%）<\/li><li class='path-step' id='path-02'><strong>步骤 02：数组、链表与选择排序<\/strong><br>阅读：<a href=\"#/chapter/ch02\">第 2 章：选择排序<\/a><br>检查点：通过 ch02 自测题<\/li><li class='path-step' id='path-03'><strong>步骤 03：递归与调用栈<\/strong><br>阅读：<a href=\"#/chapter/ch03\">第 3 章：递归<\/a><br>检查点：通过 ch03 自测题<\/li><li class='path-step' id='path-04'><strong>步骤 04：分而治之与快速排序<\/strong><br>阅读：<a href=\"#/chapter/ch04\">第 4 章：快速排序<\/a><br>检查点：通过 ch04 自测题<\/li><li class='path-step' id='path-05'><strong>步骤 05：散列表：O(1) 的魔法<\/strong><br>阅读：<a href=\"#/chapter/ch05\">第 5 章：散列表<\/a><br>检查点：通过 ch05 自测题<\/li><li class='path-step' id='path-06'><strong>步骤 06：图与广度优先搜索<\/strong><br>阅读：<a href=\"#/chapter/ch06\">第 6 章：广度优先搜索<\/a><br>检查点：通过 ch06 自测题<\/li><li class='path-step' id='path-07'><strong>步骤 07：狄克斯特拉算法<\/strong><br>阅读：<a href=\"#/chapter/ch07\">第 7 章：狄克斯特拉算法<\/a><br>检查点：通过 ch07 自测题<\/li><li class='path-step' id='path-08'><strong>步骤 08：贪婪算法与 NP 完全<\/strong><br>阅读：<a href=\"#/chapter/ch08\">第 8 章：贪婪算法<\/a><br>检查点：通过 ch08 自测题<\/li><li class='path-step' id='path-09'><strong>步骤 09：动态规划<\/strong><br>阅读：<a href=\"#/chapter/ch09\">第 9 章：动态规划<\/a><br>检查点：通过 ch09 自测题<\/li><li class='path-step' id='path-10'><strong>步骤 10：K 最近邻与机器学习入门<\/strong><br>阅读：<a href=\"#/chapter/ch10\">第 10 章：K 最近邻算法<\/a><br>检查点：通过 ch10 自测题<\/li><li class='path-step' id='path-11'><strong>步骤 11：算法世界地图<\/strong><br>阅读：<a href=\"#/chapter/ch11\">第 11 章：接下来如何做<\/a><br>检查点：完成 quiz.md 最终检验项目<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "__quiz_all__": "<p>（无综合题）<\/p>", "__quiz_ch01__": "<h1>测验：第 1 章：算法简介<\/h1><div class='quiz-item' data-qid='q01' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 含 256 个元素的有序列表，二分查找最多查几次？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q01' value='0'> 256<\/label><label class='quiz-opt'><input type='radio' name='q01' value='1'> 8<\/label><label class='quiz-opt'><input type='radio' name='q01' value='2'> 16<\/label><label class='quiz-opt'><input type='radio' name='q01' value='3'> 128<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q02' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 在无序列表里按电话号码反查某人，运行时间是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q02' value='0'> O(log n)<\/label><label class='quiz-opt'><input type='radio' name='q02' value='1'> O(n)<\/label><label class='quiz-opt'><input type='radio' name='q02' value='2'> O(n²)<\/label><label class='quiz-opt'><input type='radio' name='q02' value='3'> O(1)<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q03' data-type='blank'><p class='quiz-q'><b>Q3.<\/b> 旅行商问题要试遍所有排列，运行时间为 O(____)。<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch02__": "<h1>测验：第 2 章：选择排序<\/h1><div class='quiz-item' data-qid='q04' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 在链表中读取第 1000 个元素，最快多久？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q04' value='0'> O(1)<\/label><label class='quiz-opt'><input type='radio' name='q04' value='1'> O(log n)<\/label><label class='quiz-opt'><input type='radio' name='q04' value='2'> O(n)<\/label><label class='quiz-opt'><input type='radio' name='q04' value='3'> O(n²)<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q05' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 服务员队尾加菜、厨师队首取菜的点菜单队列用什么实现？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q05' value='0'> 数组<\/label><label class='quiz-opt'><input type='radio' name='q05' value='1'> 链表<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q06' data-type='blank'><p class='quiz-q'><b>Q3.<\/b> 对 n 个元素做选择排序，运行时间是 O(____)。<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch03__": "<h1>测验：第 3 章：递归<\/h1><div class='quiz-item' data-qid='q07' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 递归函数必须包含哪两部分？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q07' value='0'> 循环与判断<\/label><label class='quiz-opt'><input type='radio' name='q07' value='1'> 基线条件与递归条件<\/label><label class='quiz-opt'><input type='radio' name='q07' value='2'> 压入与弹出<\/label><label class='quiz-opt'><input type='radio' name='q07' value='3'> 输入与输出<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q08' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 栈的取出顺序是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q08' value='0'> 先进先出<\/label><label class='quiz-opt'><input type='radio' name='q08' value='1'> 后进先出<\/label><label class='quiz-opt'><input type='radio' name='q08' value='2'> 随机<\/label><label class='quiz-opt'><input type='radio' name='q08' value='3'> 按大小排序<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q09' data-type='blank'><p class='quiz-q'><b>Q3.<\/b> fact(4) = ____。<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch04__": "<h1>测验：第 4 章：快速排序<\/h1><div class='quiz-item' data-qid='q10' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 快速排序的平均运行时间是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q10' value='0'> O(n)<\/label><label class='quiz-opt'><input type='radio' name='q10' value='1'> O(log n)<\/label><label class='quiz-opt'><input type='radio' name='q10' value='2'> O(n log n)<\/label><label class='quiz-opt'><input type='radio' name='q10' value='3'> O(n²)<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q11' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 只把数组第一个元素乘 2，运行时间是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q11' value='0'> O(1)<\/label><label class='quiz-opt'><input type='radio' name='q11' value='1'> O(n)<\/label><label class='quiz-opt'><input type='radio' name='q11' value='2'> O(n log n)<\/label><label class='quiz-opt'><input type='radio' name='q11' value='3'> O(n²)<\/l 'radio' name='q25' value='0'> 音响 $3000<\/label><label class='quiz-opt'><input type='radio' name='q25' value='1'> 吉他+笔记本 $3500<\/label><label class='quiz-opt'><input type='radio' name='q25' value='2'> 吉他+音响 $4500<\/label><label class='quiz-opt'><input type='radio' name='q25' value='3'> 笔记本 $2000<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q26' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 最长公共子串与最长公共子序列的公式区别在哪个分支？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q26' value='0'> 字母相同<\/label><label class='quiz-opt'><input type='radio' name='q26' value='1'> 字母不同<\/label><label class='quiz-opt'><input type='radio' name='q26' value='2'> 初始化<\/label><label class='quiz-opt'><input type='radio' name='q26' value='3'> 无区别<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q27' data-type='blank'><p class='quiz-q'><b>Q3.<\/b> 动态规划每种解法都涉及一张____。<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch10__": "<h1>测验：第 10 章：K 最近邻算法<\/h1><div class='quiz-item' data-qid='q28' data-type='single'><p class='quiz-q'><b>Q1.<\/b> KNN 做回归时输出什么？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q28' value='0'> 投票多数的类别<\/label><label class='quiz-opt'><input type='radio' name='q28' value='1'> 最近 K 个邻居数值的平均值<\/label><label class='quiz-opt'><input type='radio' name='q28' value='2'> 距离公式<\/label><label class='quiz-opt'><input type='radio' name='q28' value='3'> 最大值<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q29' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 原书经验法则：N 个用户时 K 取多少？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q29' value='0'> 1<\/label><label class='quiz-opt'><input type='radio' name='q29' value='1'> √N<\/label><label class='quiz-opt'><input type='radio' name='q29' value='2'> N<\/label><label class='quiz-opt'><input type='radio' name='q29' value='3'> log N<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q30' data-type='blank'><p class='quiz-q'><b>Q3.<\/b> 把物品变成一组可比较的数字，这个动作叫____。<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch11__": "<h1>测验：第 11 章：接下来如何做<\/h1><div class='quiz-item' data-qid='q31' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 判断网页是否抓过、容忍偶发错报、极省内存，用什么？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q31' value='0'> 散列表<\/label><label class='quiz-opt'><input type='radio' name='q31' value='1'> 布隆过滤器<\/label><label class='quiz-opt'><input type='radio' name='q31' value='2'> 数组<\/label><label class='quiz-opt'><input type='radio' name='q31' value='3'> 快速排序<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q32' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 数据库存密码的正确做法是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q32' value='0'> 明文存<\/label><label class='quiz-opt'><input type='radio' name='q32' value='1'> 存密码的 SHA 散列值<\/label><label class='quiz-opt'><input type='radio' name='q32' value='2'> Base64 编码<\/label><label class='quiz-opt'><input type='radio' name='q32' value='3'> 逆向加密存储<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q33' data-type='blank'><p class='quiz-q'><b>Q3.<\/b> MapReduce 的两个核心函数是 map 和 ____。<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__cards__": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "__glossary__": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='二分查找'>二分查找 — 只在有序列表上用，每次猜中间元素砍掉一半范围的查找法 <span class=glossary-ref>（第 1 章：算法简介）<\/span><\/li><li data-term='对数'>对数 — 幂运算的逆运算；log₂n 问几个 2 相乘等于 n <span class=glossary-ref>（第 1 章：算法简介）<\/span><\/li><li data-term='大o表示法'>大O表示法 — 描述算法操作数随 n 增速的记号，看最糟情况、忽略常数 <span class=glossary-ref>（第 1 章：算法简介）<\/span><\/li><li data-term='线性时间 o(n)'>线性时间 O(n) — 操作数与 n 成正比，如简单查找 <span class=glossary-ref>（第 1 章：算法简介）<\/span><\/li><li data-term='对数时间 o(log n)'>对数时间 O(log n) — 每翻倍数据量只多一步，如二分查找 <span class=glossary-ref>（第 1 章：算法简介）<\/span><\/li><li data-term='阶乘时间 o(n!)'>阶乘时间 O(n!) — 试遍所有排列，如旅行商蛮力解 <span class=glossary-ref>（第 1 章：算法简介）<\/span><\/li><li data-term='数组'>数组 — 元素紧挨存放、靠编号直接定位的数据结构 <span class=glossary-ref>（第 2 章：选择排序）<\/span><\/li><li data-term='链表'>链表 — 元素散落、每个元素存下一个地址的串联结构 <span class=glossary-ref>（第 2 章：选择排序）<\/span><\/li><li data-term='索引'>索引 — 数组元素的位置编号，从 0 开始 <span class=glossary-ref>（第 2 章：选择排序）<\/span><\/li><li data-term='随机访问'>随机访问 — 直接跳到任意位置（数组支持） <span class=glossary-ref>（第 2 章：选择排序）<\/span><\/li><li data-term='选择排序'>选择排序 — 反复找最小挪到新列表的排序，O(n²) <span class=glossary-ref>（第 2 章：选择排序）<\/span><\/li><li data-term='递归'>递归 — 调用自身的函数 <span class=glossary-ref>（第 3 章：递归）<\/span><\/li><li data-term='基线条件'>基线条件 — 递归中不再调用自己、直接返回的刹车 <span class=glossary-ref>（第 3 章：递归）<\/span><\/li><li data-term='栈'>栈 — 后进先出（LIFO）的数据结构 <span class=glossary-ref>（第 3 章：递归）<\/span><\/li><li data-term='调用栈'>调用栈 — 计算机用栈记住每个进行到一半的函数 <span class=glossary-ref>（第 3 章：递归）<\/span><\/li><li data-term='栈溢出'>栈溢出 — 递归太深调用栈占满内存导致崩溃 <span class=glossary-ref>（第 3 章：递归）<\/span><\/li><li data-term='分而治之 d&amp;c'>分而治之 D&amp;C — 找最简基线条件、每次递归缩小问题规模 <span class=glossary-ref>（第 4 章：快速排序）<\/span><\/li><li data-term='基准值 pivot'>基准值 pivot — 快速排序中被选为分数线的那个元素 <span class=glossary-ref>（第 4 章：快速排序）<\/span><\/li><li data-term='快速排序'>快速排序 — 选基准值分区后递归排序，平均 O(n log n) <span class=glossary-ref>（第 4 章：快速排序）<\/span><\/li><li data-term='散列函数'>散列函数 — 把任意输入映射为数字；要求一致且均匀 <span class=glossary-ref>（第 5 章：散列表）<\/span><\/li><li data-term='散列表'>散列表 — 散列函数 + 数组，查找/插入/删除平均 O(1) <span class=glossary-ref>（第 5 章：散列表）<\/span><\/li><li data-term='冲突'>冲突 — 两个不同的键被散列到同一数组位置 <span class=glossary-ref>（第 5 章：散列表）<\/span><\/li><li data-term='填装因子'>填装因子 — 已占用位置 ÷ 总位置；&gt;0.7 需扩容 <span class=glossary-ref>（第 5 章：散列表）<\/span><\/li><li data-term='图'>图 — 由节点和边组成的连接结构 <span class=glossary-ref>（第 6 章：广度优先搜索）<\/span><\/li><li data-term='节点'>节点 — 图中的一个点 <span class=glossary-ref>（第 6 章：广度优先搜索）<\/span><\/li><li data-term='边'>边 — 图中两节点之间的连线 <span class=glossary-ref>（第 6 章：广度优先搜索）<\/span><\/li><li data-term='队列'>队列 — 先进先出（FIFO）的数据结构 <span class=glossary-ref>（第 6 章：广度优先搜索）<\/span><\/li><li data-term='广度优先搜索 bfs'>广度优先搜索 BFS — 从起点按圈层向外扩展，找段数最短路径 <span class=glossary-ref>（第 6 章：广度优先搜索）<\/span><\/li><li data-term='拓扑排序'>拓扑排序 — 把依赖图排成被依赖者在前的有序列表 <span class=glossary-ref>（第 6 章：广度优先搜索）<\/span><\/li><li data-term='权重'>权重 — 边上的数字，表示距离/时间/费用 <span class=glossary-ref>（第 7 章：狄克斯特拉算法）<\/span><\/li><li data-term='加权图'>加权图 — 边带权重的图 <span class=glossary-ref>（第 7 章：狄克斯特拉算法）<\/span><\/li><li data-term='狄克斯特拉算法'>狄克斯特拉算法 — 加权图中找总权重最小路径的算法 <span class=glossary-ref>（第 7 章：狄克斯特拉算法）<\/span><\/li><li data-term='负权边'>负权边 — 权重为负的边；狄克斯特拉失效 <span class=glossary-ref>（第 7 章：狄克斯特拉算法）<\/span><\/li><li data-term='贪婪算法'>贪婪算法 — 每步选局部最优、拼全局的简单策略 <span class=glossary-ref>（第 8 章：贪婪算法）<\/span><\/li><li data-term='近似算法'>近似算法 — 精确解太慢时求接近最优的快速解 <span class=glossary-ref>（第 8 章：贪婪算法）<\/span><\/li><li data-term='集合覆盖问题'>集合覆盖问题 — 用最少集合覆盖所有元素的 NP 完全问题 <span class=glossary-ref>（第 8 章：贪婪算法）<\/span><\/li><li data-term='np完全问题'>NP完全问题 — 目前无快速解法、只能近似的难题 <span class=glossary-ref>（第 8 章：贪婪算法）<\/span><\/li><li data-term='动态规划'>动态规划 — 建网格逐格填子问题最优解的方法 <span class=glossary-ref>（第 9 章：动态规划）<\/span><\/li><li data-term='最长公共子串'>最长公共子串 — 两字符串中连续相同的最长片段 <span class=glossary-ref>（第 9 章：动态规划）<\/span><\/li><li data-term='最长公共子序列'>最长公共子序列 — 顺序相同、可跳着取的最长公共序列 <span class=glossary-ref>（第 9 章：动态规划）<\/span><\/li><li data-term='k最近邻 knn'>K最近邻 KNN — 找最近 K 个邻居做分类或回归的算法 <span class=glossary-ref>（第 10 章：K 最近邻算法）<\/span><\/li><li data-term='特征'>特征 — 把物品量化成的一组可比数字 <span class=glossary-ref>（第 10 章：K 最近邻算法）<\/span><\/li><li data-term='分类'>分类 — 把新样本编入已知类别（投票） <span class=glossary-ref>（第 10 章：K 最近邻算法）<\/span><\/li><li data-term='回归'>回归 — 预测一个数值（邻居数值平均） <span class=glossary-ref>（第 10 章：K 最近邻算法）<\/span><\/li><li data-term='二叉查找树'>二叉查找树 — 左小右大的树；查找平均 O(log n) <span class=glossary-ref>（第 11 章：接下来如何做）<\/span><\/li><li data-term='布隆过滤器'>布隆过滤器 — 概率型集合判断：可能错报、绝不漏报 <span class=glossary-ref>（第 11 章：接下来如何做）<\/span><\/li><li data-term='sha'>SHA — 单向安全散列算法，用于比对文件/存密码 <span class=glossary-ref>（第 11 章：接下来如何做）<\/span><\/li><\/ul>", "__patterns__": "<h1>模式与框架库<\/h1>\n<p>本书作者反复使用的思考框架、决策规则与反模式。<\/p>\n<h2>框架 1：算法选型决策树（作者全书骨架）<\/h2>\n<pre><code>拿到一个问题 →\n  是&quot;查找&quot;吗？\n    ├─ 数据有序？ → 二分查找 O(log n)\n    └─ 无序？ → 简单查找 O(n) 或先排序\n  是&quot;排序&quot;吗？\n    └─ 数据量大 → 快速排序 O(n log n)；小规模才用选择排序\n  是&quot;映射/查重/缓存&quot;吗？\n    └─ 散列表 O(1)\n  是&quot;网络里找路&quot;吗？\n    ├─ 边没权重 → BFS（段数最少）\n    └─ 边有权重 → 狄克斯特拉（总权重最小）；有负权 → 贝尔曼-福德\n  是&quot;约束下求最优&quot;吗？\n    ├─ 子问题可独立拆分 → 动态规划（精确最优）\n    └─ 子问题互依赖 / 要快 → 贪婪近似\n  是&quot;预测/分类新东西&quot;吗？\n    └─ KNN：抽特征 → 找最近 K 个邻居<\/code><\/pre>\n<h2>框架 2：D&amp;C 两问（分而治之）<\/h2>\n<p>遇到递归类问题，先问：<\/p>\n<ol><li>\n基线条件是什么？（简单到不用分解的情况；数组题通常是空/单元素数组）\n<\/li><li>\n每次怎么把问题缩小一圈？（去掉第一个元素 / 划掉一半 / 分成两个小同款问题）\n<\/ol>\n<h2>框架 3：大O三问（判断运行时间）<\/h2>\n<ol><li>\n输入规模 n 是什么？\n<\/li><li>\n每一步操作多少次？（打印所有元素 = O(n)；每个元素乘所有元素 = O(n²)）\n<\/li><li>\n常数忽略，最糟情况兜底。\n<\/ol>\n<h2>框架 4：NP 完全识别清单（原书 8.4.2）<\/h2>\n<p>蛛丝马迹，命中多个就该警觉：<\/p>\n<ul><li>\n元素少时很快，n 一大就慢得离谱；\n<\/li><li>\n涉及&quot;所有组合/所有排列&quot;；\n<\/li><li>\n不能拆成独立小问题；\n<\/li><li>\n涉及序列（城市顺序）或集合（广播台集合）；\n<\/li><li>\n能归约成旅行商或集合覆盖问题。\n<\/ul>\n<p>→ 应对：<strong>别找精确解，直接设计贪婪近似算法<\/strong>。<\/p>\n<h2>决策规则（if/else 速查）<\/h2>\n<ul><li>\n<strong>if 需要随机读取<\/strong> → 用数组；<strong>else if 频繁中间插删<\/strong> → 用链表。\n<\/li><li>\n<strong>if 列表有序<\/strong> → 二分查找；<strong>else<\/strong> → 简单查找或先排序。\n<\/li><li>\n<strong>if 要&quot;名字→数据&quot;的快速映射<\/strong> → 散列表。\n<\/li><li>\n<strong>if 边有权重<\/strong> → 狄克斯特拉；<strong>else if 边无权重<\/strong> → BFS。\n<\/li><li>\n<strong>if 有负权边<\/strong> → 不用狄克斯特拉，换贝尔曼-福德。\n<\/li><li>\n<strong>if 子问题独立可拆分<\/strong> → 动态规划；<strong>else<\/strong> → 贪婪近似或别的思路。\n<\/li><li>\n<strong>if 新样本要分类/预测数值<\/strong> → KNN（先把特征选好）。\n<\/ul>\n<h2>反模式（作者明确反对的做法）<\/h2>\n<ol><li>\n<strong>在 n 还小的时候就下结论&quot;这算法够快&quot;<\/strong\n<ul>\n<li>\n例子：Bob 用 100 元素时的 15 倍差距推断火箭算法；实际 10 亿元素时差 3300 万倍。\n<\/li><li>\n替代：看大O曲线形状，不看当前耗时。\n<\/ul>\n<\/ol>\n<ol><li>\n<strong>已排序数组 + 每次插入后重排<\/strong\n<ul>\n<li>\n问题：为了二分查找，每次新用户注册都把数组整体排序。\n<\/li><li>\n替代：用二叉查找树（第11章）或散列表。\n<\/ul>\n<\/ol>\n<ol><li>\n<strong>在 NP 完全问题上死磕精确解<\/strong\n<ul>\n<li>\n问题：试遍 2ⁿ 个子集、n! 条路线。\n<\/li><li>\n替代：贪婪近似，速度快且接近最优。\n<\/ul>\n<\/ol>\n<ol><li>\n<strong>递归不写基线条件<\/strong\n<ul>\n<li>\n后果：无限递归 → 栈溢出。\n<\/li><li>\n替代：每个递归函数先写&quot;什么时候不再调自己&quot;。\n<\/ul>\n<\/ol>\n<ol><li>\n<strong>BFS 不标记已检查节点<\/strong\n<ul>\n<li>\n后果：同一节点入队两次，甚至在&quot;你↔Peggy&quot;间无限循环。\n<\/li><li>\n替代：维护 searched 名单。\n<\/ul>\n<\/ol>\n<ol><li>\n<strong>用狄克斯特拉处理负权边<\/strong\n<ul>\n<li>\n后果：得到错误路径。\n<\/li><li>\n替代：贝尔曼-福德。\n<\/ul>\n<\/ol>\n<ol><li>\n<strong>KNN 随便挑特征<\/strong\n<ul>\n<li>\n后果：给小猫图片打分来推电影，推荐全偏。\n<\/li><li>\n替代：特征必须与目标相关、不偏不倚。\n<\/ul>\n<\/ol>", "__cheatsheet__": "<h1>速查表<\/h1>\n<h2>大O运行时间速查（从快到慢）<\/h2>\n<table><thead><tr><th>大O<\/th><th>名称<\/th><th>n=1024 时操作数<\/th><th>代表算法<\/th><\/tr><\/thead><tbody><tr><td>O(1)<\/td><td>常量时间<\/td><td>1<\/td><td>散列表查找、读数组第 k 个<\/td><\/tr><tr><td>O(log n)<\/td><td>对数时间<\/td><td>10<\/td><td>二分查找<\/td><\/tr><tr><td>O(n)<\/td><td>线性时间<\/td><td>1024<\/td><td>简单查找、打印每个元素<\/td><\/tr><tr><td>O(n log n)<\/td><td>——<\/td><td>~10000<\/td><td>快速排序（平均）、合并排序<\/td><\/tr><tr><td>O(n²)<\/td><td>平方时间<\/td><td>~100万<\/td><td>选择排序、乘法表<\/td><\/tr><tr><td>O(2ⁿ)<\/td><td>指数时间<\/td><td>天文<\/td><td>集合覆盖精确解<\/td><\/tr><tr><td>O(n!)<\/td><td>阶乘时间<\/td><td>天文<\/td><td>旅行商蛮力解<\/td><\/tr><\/tbody><\/table>\n<h2>数据结构操作速查<\/h2>\n<table><thead><tr><th>操作<\/th><th>数组<\/th><th>链表<\/th><th>散列表（平均）<\/th><\/tr><\/thead><tbody><tr><td>随机读取<\/td><td>O(1)<\/td><td>O(n)<\/td><td>——<\/td><\/tr><tr><td>顺序读取全部<\/td><td>O(n)<\/td><td>O(n)<\/td><td>——<\/td><\/tr><tr><td>插入<\/td><td>O(n)<\/td><td>O(1)<\/td><td>O(1)<\/td><\/tr><tr><td>删除（已定位）<\/td><td>O(n)<\/td><td>O(1)<\/td><td>O(1)<\/td><\/tr><tr><td>按键查找<\/td><td>——<\/td><td>——<\/td><td>O(1)<\/td><\/tr><\/tbody><\/table>\n<h2>算法选择速查<\/h2>\n<table><thead><tr><th>问题类型<\/th><th>首选算法<\/th><th>运行时间<\/th><\/tr><\/thead><tbody><tr><td>有序列表查元素<\/td><td>二分查找<\/td><td>O(log n)<\/td><\/tr><tr><td>无序查找<\/td><td>简单查找<\/td><td>O(n)<\/td><\/tr><tr><td>通用排序<\/td><td>快速排序<\/td><td>平均 O(n log n)<\/td><\/tr><tr><td>&quot;键→值&quot;映射/查重/缓存<\/td><td>散列表<\/td><td>O(1)<\/td><\/tr><tr><td>图里段数最少路径<\/td><td>BFS<\/td><td>O(V+E)<\/td><\/tr><tr><td>加权图最短路径（正权）<\/td><td>狄克斯特拉<\/td><td>O(V²) 量级<\/td><\/tr><tr><td>含负权边最短路径<\/td><td>贝尔曼-福德<\/td><td>——<\/td><\/tr><tr><td>NP 完全问题<\/td><td>贪婪近似<\/td><td>O(n log n) ~ O(n²)<\/td><\/tr><tr><td>约束下求最优、子问题独立<\/td><td>动态规划<\/td><td>O(网格大小)<\/td><\/tr><tr><td>新样本分类/数值预测<\/td><td>KNN<\/td><td>找最近 K 个<\/td><\/tr><\/tbody><\/table>\n<h2>Python 代码片段速查<\/h2>\n<pre class=\"lang-python\"><code># 二分查找\ndef binary_search(list, item):\n    low, high = 0, len(list)-1\n    while low &lt;= high:\n        mid = (low + high) // 2\n        if list[mid] == item: return mid\n        if list[mid] &gt; item: high = mid - 1\n        else: low = mid + 1\n    return None\n\n# 快速排序\ndef quicksort(array):\n    if len(array) &lt; 2: return array\n    pivot = array[0]\n    less = [i for i in array[1:] if i &lt;= pivot]\n    greater = [i for i in array[1:] if i &gt; pivot]\n    return quicksort(less) + [pivot] + quicksort(greater)\n\n# BFS（图用 dict 表示）\nfrom collections import deque\ndef search(name):\n    queue = deque(graph[name]); searched = []\n    while queue:\n        person = queue.popleft()\n        if person not in searched:\n            if person_is_seller(person): return True\n            queue += graph[person]; searched.append(person)\n    return False<\/code><\/pre>\n<h2>关键数字记忆点<\/h2>\n<ul><li>\n128 个元素二分查找最多 <strong>7<\/strong> 步；翻倍到 256 → <strong>8<\/strong> 步。\n<\/li><li>\n40 亿元素 → 二分查找约 <strong>32<\/strong> 步；简单查找 = <strong>40 亿步 ≈ 11 天<\/strong>。\n<\/li><li>\n散列表填装因子 <strong>&gt; 0.7<\/strong> 就扩容。\n<\/li><li>\n5 个城市旅行商 = <strong>120<\/strong> 条路线；6 城 = 720；7 城 = 5040。\n<\/li><li>\nKNN 邻居数经验值：<strong>√N<\/strong>。\n<\/ul>"}};
const pages = DATA.rendered;
const manifest = DATA.manifest;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SLUG = manifest.slug || 'book';
const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem(SLUG+':'+k)||'null') }catch(e){ return null } },
  set(k,v){ try{ localStorage.setItem(SLUG+':'+k, JSON.stringify(v)) }catch(e){} }
};
let state = { visited: store.get('visited')||[], quiz: store.get('quiz')||{}, cards: store.get('cards')||{} };

/* ---------- 导航 ---------- */
function renderNav(){
  const nav = $('#nav'); nav.innerHTML='';
  const build = items => items.forEach(it=>{
    if(it.children){
      const sec=document.createElement('div'); sec.className='nav-sec'; sec.textContent=it.label; nav.appendChild(sec);
      it.children.forEach(c=>{
        const a=document.createElement('a'); a.className='nav-item'; a.href=c.href; a.textContent=c.label;
        const id=routeId(c.href);
        if(state.visited.includes(id)) a.innerHTML = esc(c.label)+' <span class="done">✓</span>';
        nav.appendChild(a);
      });
    }else{
      const a=document.createElement('a'); a.className='nav-item'; a.href=it.href; a.textContent=it.label;
      const id=routeId(it.href);
      if(state.visited.includes(id)) a.innerHTML = esc(it.label)+' <span class="done">✓</span>';
      nav.appendChild(a);
    }
  });
  build(DATA.nav);
  updateProgress();
}
function routeId(href){ return href.replace('#/',''); }

/* ---------- 路由 ---------- */
function routeIdFromHash(){
  let h = location.hash.replace(/^#\//,'');
  if(!h) return 'path';
  if(h==='path') return 'path';
  const m = h.match(/^(chapter|concept)\/(.+)$/);
  if(m) return m[1]+'/'+m[2];
  return h; // quiz/all, quiz/ch01, cards, glossary, patterns, cheatsheet
}
function showPage(rid){
  const id = rid==='path' ? '__path__' : rid.startsWith('quiz/') ? '__quiz_'+rid.split('/')[1]+'__' : rid==='cards'?'__cards__':rid==='glossary'?'__glossary__':rid==='patterns'?'__patterns__':rid==='cheatsheet'?'__cheatsheet__':rid.startsWith('chapter/')?rid.split('/')[1]:rid.startsWith('concept/')?rid.split('/')[1]:rid;
  const html = pages[id] || '<div class="empty">页面不存在</div>';
  $('#view').innerHTML = html;
  document.querySelectorAll('.nav-item').forEach(a=>a.classList.toggle('active', routeId(a.getAttribute('href'))===rid));
  if(!state.visited.includes(rid) && (rid.startsWith('chapter/')||rid.startsWith('concept/'))){
    state.visited.push(rid); store.set('visited', state.visited); renderNav();
  }
  window.scrollTo(0,0);
  if(rid==='cards') initCards();
  if(rid==='glossary') initGlossary();
  if(rid.startsWith('quiz')) initQuizzes(rid);
  if(id==='__path__') updatePath();
  renderMermaid();
}

/* ---------- 进度 ---------- */
function updateProgress(){
  const chs = (manifest.chapters||[]).length;
  const done = (manifest.chapters||[]).filter(c=>state.visited.includes('chapter/'+c.id)).length;
  const pct = chs? Math.round(done/chs*100) : 0;
  $('#progress-fill').style.width = pct+'%';
  $('#progress-label').textContent = `进度 ${pct}% · 已学 ${done}/${chs} 章`;
}
function updatePath(){
  document.querySelectorAll('.path-step').forEach(el=>{
    const step = el.id.replace('path-','');
    const s = (manifest.learningPath||[]).find(x=>x.step===step);
    if(s && (s.chapterIds||[]).every(c=>state.visited.includes('chapter/'+c))){
      el.classList.add('passed');
      const lbl = el.querySelector('.checkpoint-ok'); if(!lbl){ const sp=document.createElement('span'); sp.className='done'; sp.textContent=' ✓ 已完成'; el.appendChild(sp); }
    }
  });
}

/* ---------- 测验 ---------- */
function initQuizzes(rid){
  document.querySelectorAll('.quiz-item').forEach(item=>{
    const btn = item.querySelector('.quiz-check');
    if(!btn || item.dataset.inited){ return }
    item.dataset.inited='1';
    btn.addEventListener('click', ()=>{
      const qid = item.dataset.qid; const type = item.dataset.type;
      const q = (manifest.quizzes||[]).find(x=>x.id===qid); if(!q) return;
      let user, correct=false, fb;
      if(type==='single'){
        const sel = item.querySelector('input:checked');
        user = sel? parseInt(sel.value) : null;
        correct = user===q.answer;
        fb = correct?'✓ 正确':'✗ 错误'+(user==null?'（未作答）':'');
      } else if(type==='multi'){
        user = Array.from(item.querySelectorAll('input:checked')).map(i=>parseInt(i.value)).sort();
        const ans = Array.isArray(q.answer)? q.answer.slice().sort(): [q.answer];
        correct = user.length>0 && JSON.stringify(user)===JSON.stringify(ans);
        fb = correct?'✓ 正确':'✗ 错误';
      } else if(type==='blank'){
        const v = (item.querySelector('.quiz-blank').value||'').trim().toLowerCase();
        const a = String(q.answer).trim().toLowerCase();
        correct = v===a;
        fb = correct?'✓ 正确':'✗ 错误'+(v?'':'（未作答）');
      }
      item.querySelectorAll('input:checked').forEach(i=>{
        const val=parseInt(i.value);
        if(Array.isArray(q.answer)? q.answer.includes(val) : val===q.answer) i.parentElement.style.color='var(--ok)';
        else i.parentElement.style.color='var(--bad)';
      });
      const feed = item.querySelector('.quiz-feedback');
      feed.className = 'quiz-feedback '+(correct?'fb-ok':'fb-bad');
      feed.textContent = fb;
      let ex = item.querySelector('.quiz-explain');
      if(!ex){ ex=document.createElement('div'); ex.className='quiz-explain'; item.appendChild(ex); }
      ex.innerHTML = '解析：' + esc(q.explain||'');
      // 记录成绩（按章聚合）
      const ch = q.chapterId||'__all__';
      if(!state.quiz[ch]) state.quiz[ch]={done:0,total:0};
      state.quiz[ch].done = Math.min(state.quiz[ch].total+1, state.quiz[ch].done+1);
      state.quiz[ch].total += 1;
      store.set('quiz', state.quiz);
    });
  });
}

/* ---------- 抽认卡 ---------- */
let cardIdx = 0, cardList = [];
function initCards(){
  const cards = manifest.flashcards||[];
  cardList = cards.slice();
  cardIdx = 0;
  const sel = $('#card-filter');
  sel.innerHTML = '<option value="">全部</option>';
  [...new Set(cards.map(c=>c.chapterId).filter(Boolean))].forEach(c=>{
    const o=document.createElement('option'); o.value=c; o.textContent=manifestChTitle(c); sel.appendChild(o);
  });
  sel.onchange = ()=>{ const v=sel.value; cardList = v? cards.filter(c=>c.chapterId===v): cards.slice(); cardIdx=0; showCard(); };
  $('#flashcard').onclick = ()=>$('#flashcard').classList.toggle('flip');
  $('#card-known-btn').onclick = ()=>{ markCard(true); };
  $('#card-again-btn').onclick = ()=>{ markCard(false); };
  showCard();
}
function showCard(){
  updateCardCounts();
  if(cardIdx>=cardList.length){ $('#card-stage').innerHTML='<div class="empty">本组卡片已全部复习完 🎉</div>'; return; }
  const c = cardList[cardIdx];
  document.querySelector('.fc-front').textContent = c.front;
  document.querySelector('.fc-back').textContent = c.back;
  $('#flashcard').classList.remove('flip');
}
function markCard(known){
  const c = cardList[cardIdx]; if(!c) return;
  state.cards[c.id] = known?'known':'again';
  store.set('cards', state.cards);
  cardIdx++; showCard();
}
function updateCardCounts(){
  const known = Object.values(state.cards).filter(v=>v==='known').length;
  const again = Object.values(state.cards).filter(v=>v==='again').length;
  $('#card-known').textContent = known;
  $('#card-again').textContent = again;
  $('#card-left').textContent = Math.max(0, cardList.length-cardIdx);
}
function manifestChTitle(id){
  const c=(manifest.chapters||[]).find(x=>x.id===id); return c? c.title : id;
}

/* ---------- 术语表 ---------- */
function initGlossary(){
  const input = $('#glossary-filter');
  if(!input || input.dataset.inited) return;
  input.dataset.inited='1';
  input.oninput = ()=>{
    const v = input.value.trim().toLowerCase();
    document.querySelectorAll('#glossary-list li').forEach(li=>{
      li.style.display = (!v || li.dataset.term.includes(v)) ? '' : 'none';
    });
  };
}

/* ---------- 搜索 ---------- */
let searchIndex = null;
function buildSearchIndex(){
  if(searchIndex) return searchIndex;
  searchIndex = [];
  Object.entries(pages).forEach(([id, htmlText])=>{
    if(id.startsWith('__')) return;
    const text = htmlText.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ');
    searchIndex.push({id, text});
  });
  return searchIndex;
}
$('#q').addEventListener('input', e=>{
  const v = e.target.value.trim().toLowerCase();
  if(!v){ showPage(routeIdFromHash()); return; }
  buildSearchIndex();
  const hits = searchIndex.filter(p=>p.text.toLowerCase().includes(v)).slice(0,20);
  const label = id => id.startsWith('chapter/')? ('章节：'+manifestChTitle(id.split('/')[1])) : id.startsWith('concept/')? ('概念：'+id.split('/')[1]) : id;
  $('#view').innerHTML = '<h1>搜索结果：'+esc(v)+'</h1>' +
    (hits.length? hits.map(h=>`<div class="search-hit"><a href="#/${h.id}">${esc(label(h.id))}</a><br><span class="sub">${esc(h.text.slice(0,180))}</span></div>`).join('')
                 : '<div class="empty">未找到相关页面，试试章节名/概念名/术语。</div>');
});

/* ---------- Mermaid 懒加载（联网渲染，离线显示源码） ---------- */
function renderMermaid(){
  if(!document.querySelector('.mermaid')) return;
  const s=document.createElement('script');
  s.src='https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js';
  s.onload=()=>{ try{
    mermaid.initialize({startOnLoad:false, theme: matchMedia('(prefers-color-scheme: dark)').matches?'dark':'default'});
    document.querySelectorAll('.mermaid').forEach(el=>{
      const code=el.textContent;
      mermaid.render('mm'+Math.random().toString(36).slice(2), code)
        .then(({svg})=>{ el.innerHTML=svg; })
        .catch(()=>{ el.textContent=code; });
    });
  }catch(e){} };
  document.head.appendChild(s);
}

/* ---------- 深色模式 ---------- */
const themeBtn=$('#theme-btn');
themeBtn.onclick=()=>{
  const d = document.body.dataset.theme==='dark';
  document.body.dataset.theme = d? '' : 'dark';
  themeBtn.textContent = d? '🌙 深色' : '☀️ 浅色';
};

/* ---------- 启动 ---------- */
renderNav();
window.addEventListener('hashchange', ()=>showPage(routeIdFromHash()));
showPage(routeIdFromHash());
</script>
