O(log n)", "O(n log n)", "O(n²)"], "answer": 2, "explain": "栈高 O(log n) × 每层 O(n)。"}, {"id": "q11", "chapterId": "ch04", "type": "single", "question": "只把数组第一个元素乘 2，运行时间是？", "options": ["O(1)", "O(n)", "O(n log n)", "O(n²)"], "answer": 0, "explain": "只碰一个元素，与 n 无关（原书练习 4.7）。"}, {"id": "q12", "chapterId": "ch04", "type": "multi", "question": "关于快速排序，下列说法正确的有？", "options": ["总拿首元素当基准值且输入已排序时会退化到 O(n²)", "随机选基准值能让平均保持 O(n log n)", "快排和合并排序大O相同，快排常数更小所以实战更快", "快速排序永远是 O(n log n)"], "answer": [0, 1, 2], "explain": "D 错——最糟情况是 O(n²)。"}, {"id": "q13", "chapterId": "ch05", "type": "single", "question": "平均情况下散列表查找一个键的时间是？", "options": ["O(log n)", "O(n)", "O(1)", "O(n²)"], "answer": 2, "explain": "散列函数一步定位下标，与数据量无关。"}, {"id": "q14", "chapterId": "ch05", "type": "single", "question": "投票站要快速判断某人是否投过票，用什么？", "options": ["数组", "链表", "散列表", "栈"], "answer": 2, "explain": "列表查重 O(n)，散列表 get 一下就知道。"}, {"id": "q15", "chapterId": "ch05", "type": "blank", "question": "填装因子超过 ____ 时该给散列表扩容。", "options": [], "answer": "0.7", "explain": "超过后冲突概率明显上升，扩容后因子骤降。"}, {"id": "q16", "chapterId": "ch06", "type": "single", "question": "广度优先搜索使用什么数据结构？", "options": ["栈", "队列", "散列表", "数组"], "answer": 1, "explain": "FIFO 保证一度关系先于二度被检查，找到最短路径。"}, {"id": "q17", "chapterId": "ch06", "type": "single", "question": "BFS 的运行时间通常写作？", "options": ["O(n)", "O(n²)", "O(V + E)", "O(log n)"], "answer": 2, "explain": "每个顶点入队一次 O(V)，每条边走一次 O(E)。"}, {"id": "q18", "chapterId": "ch06", "type": "multi", "question": "关于 BFS，下列说法正确的有？", "options": ["必须标记已检查节点否则可能无限循环", "找到的路径一定是段数最少的", "找到的路径一定是路程最短的", "队列必须按加入顺序取出"], "answer": [0, 1, 3], "explain": "C 错——BFS 只数段数，不管每段权重；权重不同时用狄克斯特拉。"}, {"id": "q19", "chapterId": "ch07", "type": "single", "question": "加权图中找总权重最小路径，用什么？", "options": ["BFS", "选择排序", "狄克斯特拉算法", "快速排序"], "answer": 2, "explain": "BFS 只管段数，不管权重。"}, {"id": "q20", "chapterId": "ch07", "type": "single", "question": "图中出现负权边时怎么办？", "options": ["照常使用狄克斯特拉", "改用贝尔曼-福德算法", "忽略负权边", "用 BFS"], "answer": 1, "explain": "负权边破坏已处理即最优的假设。"}, {"id": "q21", "chapterId": "ch07", "type": "blank", "question": "狄克斯特拉每步先选出____最低的节点处理。", "options": [], "answer": "开销", "explain": "这是它能保证最优的关键——先封死最便宜的节点。"}, {"id": "q22", "chapterId": "ch08", "type": "single", "question": "集合覆盖问题的精确解运行时间是？", "options": ["O(n)", "O(n log n)", "O(2ⁿ)", "O(log n)"], "answer": 2, "explain": "幂集有 2ⁿ 个子集要逐个检查。"}, {"id": "q23", "chapterId": "ch08", "type": "single", "question": "A={1,2,3}, B={2,3,4}，A & B = ?", "options": ["{1,2,3,4}", "{2,3}", "{1,4}", "{1,2,3,2,3,4}"], "answer": 1, "explain": "交集取共有元素。"}, {"id": "q24", "chapterId": "ch08", "type": "multi", "question": "下列哪些是 NP 完全问题的识别线索？", "options": ["n 一大就慢到爆炸", "涉及所有组合或排列", "能拆成独立小问题", "涉及序列或集合且难解"], "answer": [0, 1, 3], "explain": "C 错——能拆成独立小问题的是 D&C/动态规划的菜，不是 NP 完全。"}, {"id": "q25", "chapterId": "ch09", "type": "single", "question": "4 磅背包：吉他(1/$1500)、音响(4/$3000)、笔记本(3/$2000)，最优解是？", "options": ["音响 $3000", "吉他+笔记本 $3500", "吉他+音响 $4500", "笔记本 $2000"], "answer": 1, "explain": "音响占满 4 磅只得 $3000；笔记本 3 磅+吉他 1 磅正好 4 磅，$3500。"}, {"id": "q26", "chapterId": "ch09", "type": "single", "question": "最长公共子串与最长公共子序列的公式区别在哪个分支？", "options": ["字母相同", "字母不同", "初始化", "无区别"], "answer": 1, "explain": "不同时子串归 0，子序列取 max（上格, 左格）。"}, {"id": "q27", "chapterId": "ch09", "type": "blank", "question": "动态规划每种解法都涉及一张____。", "options": [], "answer": "网格", "explain": "每格代表一个子问题的最优值（原书小结原话）。"}, {"id": "q28", "chapterId": "ch10", "type": "single", "question": "KNN 做回归时输出什么？", "options": ["投票多数的类别", "最近 K 个邻居数值的平均值", "距离公式", "最大值"], "answer": 1, "explain": "分类=编组投票，回归=数值平均。"}, {"id": "q29", "chapterId": "ch10", "type": "single", "question": "原书经验法则：N 个用户时 K 取多少？", "options": ["1", "√N", "N", "log N"], "answer": 1, "explain": "太少易被异常带偏，太多引入不相似邻居。"}, {"id": "q30", "chapterId": "ch10", "type": "blank", "question": "把物品变成一组可比较的数字，这个动作叫____。", "options": [], "answer": "特征抽取", "explain": "如水果的个头+颜色、用户的 5 类电影打分。"}, {"id": "q31", "chapterId": "ch11", "type": "single", "question": "判断网页是否抓过、容忍偶发错报、极省内存，用什么？", "options": ["散列表", "布隆过滤器", "数组", "快速排序"], "answer": 1, "explain": "布隆过滤器可能错报但绝不漏报，空间极小。"}, {"id": "q32", "chapterId": "ch11", "type": "single", "question": "数据库存密码的正确做法是？", "options": ["明文存", "存密码的 SHA 散列值", "Base64 编码", "逆向加密存储"], "answer": 1, "explain": "SHA 单向，泄露散列值也反推不出原密码。"}, {"id": "q33", "chapterId": "ch11", "type": "blank", "question": "MapReduce 的两个核心函数是 map 和 ____。", "options": [], "answer": "reduce", "explain": "map 逐元素同样处理，reduce 把数组归并成一个值。"}, {"id": "q34", "chapterId": "ch05", "type": "multi", "question": "你要在 1000 万个用户名里频繁查找且经常有新用户注册。下列哪些是糟糕的选择？", "options": ["散列表", "有序数组+插入后总重排", "链表+简单查找", "二叉查找树"], "answer": [1, 2], "explain": "B 和 C 都痛：有序数组每次插入要重排，链表查找 O(n)。散列表 O(1) 才对。"}, {"id": "q35", "chapterId": "ch07", "type": "single", "question": "导航软件在每条路耗时不同的城市里找最快路线，用什么？", "options": ["BFS", "狄克斯特拉", "KNN", "动态规划"], "answer": 1, "explain": "边带权重→狄克斯特拉；BFS 只数段数。"}, {"id": "q36", "chapterId": "ch08", "type": "multi", "question": "下列哪些是 NP 完全问题？", "options": ["A 点到 B 点的最短路线", "经过指定 20 个点的最短路线（旅行商）", "用最少广播台覆盖 50 个州（集合覆盖）", "有序数组里查一个用户名"], "answer": [1, 2], "explain": "A 和 D 都有快解；B、C 要试遍组合，是 NP 完全。"}, {"id": "q37", "chapterId": "ch06", "type": "blank", "question": "把先刷牙才能吃早餐这类依赖排成有序列表，叫____排序。", "options": [], "answer": "拓扑", "explain": "被依赖者在前，任务 A 依赖 B 则 A 排在 B 后。"}], "flashcards": [{"id": "f01", "chapterId": "ch01", "front": "二分查找对列表有什么硬性前提？", "back": "列表必须有序；无序时只能逐个排查 O(n)。", "tags": ["二分查找"]}, {"id": "f02", "chapterId": "ch01", "front": "含 n 个元素的有序列表二分查找最多几步？", "back": "log₂n 步。128 个元素 7 步，256 个 8 步。", "tags": ["二分查找", "对数"]}, {"id": "f03", "chapterId": "ch01", "front": "大O表示法看最糟还是最佳情况？", "back": "最糟情况——绝不会更差的上限承诺。", "tags": ["大O"]}, {"id": "f04", "chapterId": "ch01", "front": "从快到慢排：O(n) O(log n) O(n!) O(n²) O(n log n)", "back": "O(log n) < O(n) < O(n log n) < O(n²) < O(n!)", "tags": ["大O"]}, {"id": "f05", "chapterId": "ch01", "front": "旅行商 5 个城市有多少种路线？", "back": "5! = 120 种，对应 O(n!)。", "tags": ["旅行商"]}, {"id": "f06", "chapterId": "ch02", "front": "数组和链表各擅长什么？", "back": "数组随机读取 O(1) 快；链表插删 O(1) 快。", "tags": ["数组", "链表"]}, {"id": "f07", "chapterId": "ch02", "front": "数组索引从几开始？", "back": "从 0 开始，第 2 个元素在索引 1。", "tags": ["索引"]}, {"id": "f08", "chapterId": "ch02", "front": "选择排序为什么是 O(n²)？", "back": "每轮找最小 O(n) × 找 n 轮；常数 1/2 被省略。", "tags": ["选择排序"]}, {"id": "f09", "chapterId": "ch03", "front": "递归函数必须有哪两半？", "back": "递归条件（调自己）+ 基线条件（不再调自己）。", "tags": ["递归"]}, {"id": "f10", "chapterId": "ch03", "front": "栈是 FIFO 还是 LIFO？", "back": "LIFO 后进先出；队列才是 FIFO。", "tags": ["栈", "队列"]}, {"id": "f11", "chapterId": "ch03", "front": "无限递归会怎样？", "back": "调用栈无限增厚→栈溢出，程序崩溃。", "tags": ["递归", "调用栈"]}, {"id": "f12", "chapterId": "ch03", "front": "fact(5) = ?", "back": "120（5×4×3×2×1）。", "tags": ["阶乘"]}, {"id": "f13", "chapterId": "ch04", "front": "D&C 分而治之两步是什么？", "back": "①找最简基线条件；②每次递归缩小问题规模。", "tags": ["分而治之"]}, {"id": "f14", "chapterId": "ch04", "front": "快速排序的基线条件？", "back": "数组为空或只有 1 个元素（本来就有序）。", "tags": ["快速排序"]}, {"id": "f15", "chapterId": "ch04", "front": "快排平均/最糟时间？", "back": "平均 O(n log n)；最糟 O(n²)。", "tags": ["快速排序"]}, {"id": "f16", "chapterId": "ch04", "front": "为什么随机选基准值能避开最糟？", "back": "固定取首元素遇已排序输入每次分出空堆；随机选大致平分。", "tags": ["快速排序"]}, {"id": "f17", "chapterId": "ch05", "front": "散列表由哪两样拼成？", "back": "散列函数 + 数组；函数把键算成下标。", "tags": ["散列表"]}, {"id": "f18", "chapterId": "ch05", "front": "散列表平均/最糟操作时间？", "back": "平均 O(1)；最糟 O(n)（全撞车）。", "tags": ["散列表"]}, {"id": "f19", "chapterId": "ch05", "front": "填装因子超过多少要扩容？", "back": "0.7；扩容=数组翻倍+重新散列。", "tags": ["散列表", "填装因子"]}, {"id": "f20", "chapterId": "ch05", "front": "散列表三大用途？", "back": "模拟映射、防止重复、缓存。", "tags": ["散列表"]}, {"id": "f21", "chapterId": "ch05", "front": "两个键撞同一位置怎么办？", "back": "该位置挂链表（拉链法）；链表越短越快。", "tags": ["散列表", "冲突"]}, {"id": "f22", "chapterId": "ch06", "front": "图由哪两种零件组成？", "back": "节点和边；直接相连的互为邻居。", "tags": ["图"]}, {"id": "f23", "chapterId": "ch06", "front": "BFS 为什么必须用队列？", "back": "FIFO 保证一度关系先于二度被检查，找到段数最短。", "tags": ["BFS", "队列"]}, {"id": "f24", "chapterId": "ch06", "front": "BFS 为什么要已检查名单？", "back": "同一节点会被多次指向；不标记可能无限循环。", "tags": ["BFS"]}, {"id": "f25", "chapterId": "ch06", "front": "BFS 运行时间怎么写？", "back": "O(V+E)：V 个顶点各入队一次，E 条边各走一次。", "tags": ["BFS", "大O"]}, {"id": "f26", "chapterId": "ch06", "front": "什么是拓扑排序？", "back": "把依赖图排成被依赖者在前的有序列表。", "tags": ["拓扑排序"]}, {"id": "f27", "chapterId": "ch07", "front": "BFS 和狄克斯特拉各管哪种图？", "back": "BFS 管非加权图数段数；狄克斯特拉管加权图算总权重。", "tags": ["最短路径"]}, {"id": "f28", "chapterId": "ch07", "front": "狄克斯特拉四步？", "back": "选最便宜节点→更新邻居开销→重复→父节点回溯。", "tags": ["狄克斯特拉"]}, {"id": "f29", "chapterId": "ch07", "front": "负权边为什么让狄克斯特拉失效？", "back": "破坏了已处理节点不可能更便宜的假设。", "tags": ["狄克斯特拉"]}, {"id": "f30", "chapterId": "ch07", "front": "含负权边用什么算法？", "back": "贝尔曼-福德算法。", "tags": ["最短路径"]}, {"id": "f31", "chapterId": "ch08", "front": "什么是贪婪算法？", "back": "每步选局部最优，简单快但不保证全局最优。", "tags": ["贪婪算法"]}, {"id": "f32", "chapterId": "ch08", "front": "集合覆盖精确解/贪婪近似大O？", "back": "精确 O(2ⁿ)；贪婪近似 O(n²)。", "tags": ["贪婪算法", "NP完全"]}, {"id": "f33", "chapterId": "ch08", "front": "NP 完全两个经典代表？", "back": "旅行商问题（n!）和集合覆盖问题（2ⁿ）。", "tags": ["NP完全"]}, {"id": "f34", "chapterId": "ch08", "front": "遇到 NP 完全问题怎么应对？", "back": "别死磕精确解，直接设计贪婪近似算法。", "tags": ["贪婪算法"]}, {"id": "f35", "chapterId": "ch09", "front": "动态规划的核心结构？", "back": "一张网格：每行加一个对象，每格填子问题最优值。", "tags": ["动态规划"]}, {"id": "f36", "chapterId": "ch09", "front": "4 磅背包吉他/音响/笔记本最优解？", "back": "吉他+笔记本=4 磅/$3500，不是音响 $3000。", "tags": ["动态规划", "背包"]}, {"id": "f37", "chapterId": "ch09", "front": "动态规划适用前提？", "back": "子问题离散且彼此独立；互相依赖就建不了网格。", "tags": ["动态规划"]}, {"id": "f38", "chapterId": "ch09", "front": "子串和子序列公式在哪分支不同？", "back": "字母不同时：子串归 0；子序列取 max(上,左)。", "tags": ["动态规划"]}, {"id": "f39", "chapterId": "ch10", "front": "KNN 两步流程？", "back": "①抽特征坐标；②找最近 K 个邻居，分类投票/回归平均。", "tags": ["KNN"]}, {"id": "f40", "chapterId": "ch10", "front": "分类和回归的区别？", "back": "分类=编组投票；回归=预测数值（邻居平均）。", "tags": ["KNN"]}, {"id": "f41", "chapterId": "ch10", "front": "K 取多少的经验法则？", "back": "√N 个邻居。", "tags": ["KNN"]}, {"id": "f42", "chapterId": "ch10", "front": "为什么特征选择决定 KNN 成败？", "back": "特征必须与目标相关、不偏不倚；无关特征全是噪声。", "tags": ["KNN", "特征"]}, {"id": "f43", "chapterId": "ch11", "front": "布隆过滤器错报/漏报是什么意思？", "back": "可能错报（说在但不在）；绝不漏报（说不在就肯定不在）。", "tags": ["布隆过滤器"]}, {"id": "f44", "chapterId": "ch11", "front": "SHA 为什么能安全存密码？", "back": "单向：能从密码算散列值，不能反推。", "tags": ["SHA", "安全"]}, {"id": "f45", "chapterId": "ch11", "front": "MapReduce 的 map/reduce 各干什么？", "back": "map=逐元素同样处理；reduce=数组归并成一个值。", "tags": ["MapReduce"]}, {"id": "f46", "chapterId": "ch11", "front": "二叉查找树平均/最糟查找时间？", "back": "平均 O(log n)；不平衡退化 O(n)。", "tags": ["树", "数据结构"]}]}, "pages": {"ch01": {"html": "<h1>第 1 章：算法简介<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★☆☆ | <strong>预估学时<\/strong>：1.5 小时 | <strong>前置<\/strong>：无（只需会基本代数，如 f(x)=x×2，f(5)=10）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说出二分查找比简单查找快在哪里，并解释&quot;每次排除一半&quot;为什么对应 log₂n 步。\n<\/li><li>\n用大O表示法判断一个常见操作的运行时间（O(log n) / O(n) / O(n²) / O(n!) 等）。\n<\/li><li>\n复述&quot;大O表示法描述的是最糟情况下的操作数增速，而不是秒数&quot;。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p><strong>好的算法不是&quot;更快&quot;，而是&quot;当数据变多的时候，耗时涨得慢得多&quot;——二分查找把 n 步变成 log₂n 步，大O表示法就是用来比较这种&quot;涨速&quot;的记号。<\/strong><\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：二分查找（难度：基础）<\/h3>\n<p><strong>二分查找（binary search）<\/strong>：一种只适用于<strong>有序列表<\/strong>的查找算法。你每次猜中间的元素，根据&quot;猜大了还是猜小了&quot;砍掉一半范围，而不是逐个排查。<\/p>\n<p><strong>类比<\/strong>：猜 1~100 的数字。傻办法是从 1 逐个往上猜（最坏要猜 99 次）；聪明办法是先猜 50——如果&quot;小了&quot;，就知道 1~50 全部排除；再猜 75……每次都把范围砍半。<\/p>\n<p><strong>实例（可复核）<\/strong>：在 1~100 中猜数字 99。<\/p>\n<table><thead><tr><th>次数<\/th><th>猜测值<\/th><th>结果<\/th><th>剩余范围<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>50<\/td><td>小了<\/td><td>51~100（砍半）<\/td><\/tr><tr><td>2<\/td><td>75<\/td><td>小了<\/td><td>76~100<\/td><\/tr><tr><td>3<\/td><td>88<\/td><td>小了<\/td><td>89~100<\/td><\/tr><tr><td>4<\/td><td>94<\/td><td>小了<\/td><td>95~100<\/td><\/tr><tr><td>5<\/td><td>97<\/td><td>小了<\/td><td>98~100<\/td><\/tr><tr><td>6<\/td><td>99<\/td><td>对了<\/td><td>——<\/td><\/tr><\/tbody><\/table>\n<p>不管我心里想的是哪个数字，<strong>7 次之内必中<\/strong>，因为 2⁷=128&gt;100。推广：含 n 个元素的有序列表，二分查找最多 <strong>log₂n 步<\/strong>；简单查找最多 n 步。<\/p>\n<p><strong>Python 代码（原书示例，已适配现代 Python）<\/strong>：<\/p>\n<pre class=\"lang-python\"><code>def binary_search(list, item):\n    low = 0                      # 查找范围的下界\n    high = len(list) - 1         # 查找范围的上界\n\n    while low &lt;= high:           # 范围还没缩到只剩一个元素\n        mid = (low + high) // 2  # 中间位置（// 整除，向下圆整）\n        guess = list[mid]        # 猜中间这个元素\n        if guess == item:        # 猜对了，返回位置\n            return mid\n        if guess &gt; item:         # 猜大了，上界收到 mid 左边\n            high = mid - 1\n        else:                    # 猜小了，下界放到 mid 右边\n            low = mid + 1\n    return None                  # 范围耗尽，没找到\n\nmy_list = [1, 3, 5, 7, 9]\nprint(binary_search(my_list, 3))    # =&gt; 1（索引从 0 开始，3 在第 2 个位置）\nprint(binary_search(my_list, -1))  # =&gt; None（None 表示&quot;没有找到&quot;）<\/code><\/pre>\n<h3>概念 2：对数 log（难度：基础）<\/h3>\n<p><strong>对数（logarithm）<\/strong>：幂运算的逆运算。log₂8 问的是&quot;多少个 2 相乘等于 8&quot;，答案是 3，因为 2³=8。本书里 log 一律指 log₂。<\/p>\n<ul><li>\n8 个元素 → 最多查 log₂8 = 3 次\n<\/li><li>\n1024 个元素 → 最多查 log₂1024 = 10 次\n<\/li><li>\n10 亿（40 亿）个元素 → 最多查约 30（32）次\n<\/ul>\n<p><strong>类比<\/strong>：对数像&quot;对折次数&quot;。一张纸对折 10 次有 1024 层——你要从 1024 层里找某一层，只需对折式地定位 10 次。（失效边界：这个类比只解释 2 的幂；非 2 的幂时取向上取整，如 log₂100≈7。）<\/p>\n<h3>概念 3：大O表示法（难度：进阶）<\/h3>\n<p><strong>大O表示法（Big O notation）<\/strong>：一种描述&quot;算法操作数随输入规模 n 如何增长&quot;的记号。它衡量的是<strong>增速<\/strong>，不是秒数；描述的是<strong>最糟情况<\/strong>。<\/p>\n<p>原书 NASA 例子：Bob 以为列表 100 个元素时简单查找（100 毫秒）比二分查找（7 毫秒）只慢 15 倍，于是火箭着陆选了简单查找。实际上列表有 10 亿个元素时，简单查找要 10 亿毫秒 ≈ <strong>11 天<\/strong>，而二分查找只要约 30 毫秒——差 3300 万倍。结论：<strong>只看当前数据量的耗时没用，要看数据变多后耗时涨多快。<\/strong><\/p>\n<p>常见 5 种大O运行时间（从快到慢）：<\/p>\n<table><thead><tr><th>大O<\/th><th>名称<\/th><th>代表算法<\/th><th>n=1024 时的操作数<\/th><\/tr><\/thead><tbody><tr><td>O(log n)<\/td><td>对数时间<\/td><td>二分查找<\/td><td>10<\/td><\/tr><tr><td>O(n)<\/td><td>线性时间<\/td><td>简单查找<\/td><td>1024<\/td><\/tr><tr><td>O(n log n)<\/td><td>——<\/td><td>快速排序（第4章）<\/td><td>~10000<\/td><\/tr><tr><td>O(n²)<\/td><td>平方时间<\/td><td>选择排序（第2章）<\/td><td>~100 万<\/td><\/tr><tr><td>O(n!)<\/td><td>阶乘时间<\/td><td>旅行商问题蛮力解<\/td><td>天文数字<\/td><\/tr><\/tbody><\/table>\n<p><strong>实例（旅行商问题）<\/strong>：5 个城市有 5!=120 种排列；6 个城市 720 种；7 个城市 5040 种；100 个城市时算到太阳熄灭也算不完。这类问题叫 <strong>NP 完全问题<\/strong>（第8章展开）。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph LR\n    A[n 个元素的列表] --&gt;|简单查找 O(n)| B[逐个看, 最多 n 步]\n    A --&gt;|二分查找 O(log n)| C[每次砍半, 最多 log₂n 步]\n    B --&gt; D[n=10亿: 约11天]\n    C --&gt; E[n=10亿: 约30毫秒]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：左边是同一份数据、两种算法；注意底部——n 越大，两条曲线的差距从&quot;15 倍&quot;暴涨到&quot;3300 万倍&quot;。大O表示法就是在比较两条曲线的形状，而不是某个点的高低。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：大O像&quot;堵车的增长趋势&quot;。你问从家到公司要多久，我回答&quot;正常 20 分钟&quot;没意义——该回答&quot;每多 1000 辆车，路程多堵多少分钟&quot;。大O就是后者。\n<ul>\n<li>\n失效边界：大O忽略常数（如每步实际 1 毫秒还是 1 秒）。当两种算法大O相同的时候，常数才有意义（第4章会回到这一点）。\n<\/li><li>\n<strong>实例（可复核）<\/strong>：含 128 个名字的有序列表，二分查找最多几步？log₂128 = 7 步；列表翻倍成 256 个名字，最多 8 步。每翻倍一次，只多 1 步——这就是&quot;对数增速&quot;的手感。\n<\/ul>\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;二分查找更快&quot;是因为写代码优化得好<\/strong>——实际上它快在算法思路：每次排除一半。代码再烂的二分查找，只要思路对，也是 O(log n)。\n<\/li><li>\n<strong>别以为大O表示法说的是秒数<\/strong>——实际上它说的是操作数的增速，连&quot;常数&quot;都忽略（O(2n) 简写为 O(n)）。\n<\/li><li>\n<strong>别以为&quot;找到了 Adit 一次就中，所以简单查找是 O(1)&quot;<\/strong>——实际上大O看最糟情况：找最后一个人得翻完整本电话簿，所以简单查找是 O(n)。O(1) 是&quot;保证不会比这更差&quot;的上限。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n（单选）在含 256 个元素的有序列表中用二分查找，最多需要多少次？A. 256　B. 8　C. 16　D. 128\n<\/li><li>\n（单选）在无序的人名列表里按电话号码反查某人（必须翻遍整本电话簿），运行时间是？A. O(log n)　B. O(n)　C. O(n²)　D. O(1)\n<\/li><li>\n（填空）旅行商问题要试遍所有排列，其运行时间为 O(____)。\n<\/li><li>\n（简答）为什么 Bob 用简单查找引导火箭着陆是错的？\n<p>（答案：B；解析：log₂256 = 8，因为 2⁸ = 256。每翻倍一次只多一步。） （答案：B；解析：这是原书练习 1.4——没有有序前提就用不了二分查找，只能逐个排查，是线性时间 O(n)。） （答案：n!（阶乘）；解析：5 城 120 种、6 城 720 种、7 城 5040 种，每加一城路线数乘上一个更大的数，即 n 的阶乘。） （答案：他在 n=100 时测得只慢 15 倍；但 n=10 亿时简单查找要约 11 天而二分查找只要 30 毫秒。大O不同，常数的小优势在 n 变大后毫无意义。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n有序列表上：简单查找 O(n)，二分查找 O(log n)；每翻倍数据量，二分查找只多一步。\n<\/li><li>\n大O = 操作数的增速（最糟情况），不是秒数；常见档：O(log n) &lt; O(n) &lt; O(n log n) &lt; O(n²) &lt; O(n!)。\n<\/li><li>\nO(n!) 的旅行商问题目前没有快解，只能求近似解（第8章）。\n<\/ul>", "kind": "chapter", "title": "第 1 章：算法简介"}, "ch02": {"html": "<h1>第 2 章：选择排序<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★☆☆ | <strong>预估学时<\/strong>：1.5 小时 | <strong>前置<\/strong>：第 1 章（大O表示法、对数）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说清数组与链表在&quot;读取、插入、删除&quot;三个操作上的速度差异及原因。\n<\/li><li>\n解释什么是索引、随机访问与顺序访问。\n<\/li><li>\n口述选择排序的步骤，并说出它为什么是 O(n²)。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p><strong>数组和链表是存储一串数据的两种基本方式：数组挤在一起所以&quot;随机读取快&quot;，链表散落各处靠地址串起来所以&quot;插删快&quot;；选择排序靠&quot;反复找最小&quot;工作，思路直白但代价是 O(n²)。<\/strong><\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：内存、数组、链表（难度：基础）<\/h3>\n<p><strong>内存<\/strong>像一整排带编号的抽屉，每个抽屉有地址。要存一串数据，有两种基本摆法：<\/p>\n<ul><li>\n<strong>数组（array）<\/strong>：所有元素紧挨在一起存放，像电影院里连坐的座位。\n<\/li><li>\n<strong>链表（linked list）<\/strong>：元素可以散落在内存任何地方，每个元素存一张&quot;小纸条&quot;——记下一个元素的地址，像寻宝游戏：找到第一个 → 按纸条找到第二个 → 再按纸条找到第三个。\n<\/ul>\n<p><strong>类比<\/strong>：和朋友去看电影。数组 = 6 个人必须连坐，满场时找不到 6 个连座就得整队搬家（插入可能要整体复制）；链表 = &quot;我们分开坐&quot;，哪里有空位坐哪里，加人减人都灵活。<\/p>\n<ul><li>\n失效边界：链表灵活是有代价的——你没法直接跳到&quot;第 5 个元素&quot;，只能从第 1 个顺着纸条一路摸过去。\n<\/ul>\n<h3>概念 2：索引、随机访问、顺序访问（难度：基础）<\/h3>\n<p><strong>索引（index）<\/strong>：数组中元素的位置编号。几乎所有语言都<strong>从 0 开始<\/strong>编号：第一个元素在索引 0，第二个在索引 1。<\/p>\n<ul><li>\n<strong>随机访问（random access）<\/strong>：直接跳到任意位置。数组支持——起始地址是 00、每个元素一格，第 5 个元素地址 = 00+4 = 04，一步算出。\n<\/li><li>\n<strong>顺序访问（sequential access）<\/strong>：只能从第一个元素逐个往后读。链表只支持顺序访问。\n<\/ul>\n<p>三种常用操作的运行时间对照（原书结论）：<\/p>\n<table><thead><tr><th>操作<\/th><th>数组<\/th><th>链表<\/th><\/tr><\/thead><tbody><tr><td>读取（随机访问）<\/td><td>O(1)<\/td><td>O(n)<\/td><\/tr><tr><td>在开头/结尾插入<\/td><td>O(n)（数组要整体后移或搬家）<\/td><td>O(1)<\/td><\/tr><tr><td>删除<\/td><td>O(n)（数组后面元素要前移）<\/td><td>O(1)（改纸条即可）<\/td><\/tr><\/tbody><\/table>\n<blockquote>注：链表删除 O(1) 的前提是&quot;你已经站在那个元素旁边&quot;。通常我们只记住链表的头尾，所以删头尾是 O(1)。<\/blockquote>\n<h3>概念 3：选择排序（难度：基础）<\/h3>\n<p><strong>选择排序（selection sort）<\/strong>：每次从未排序部分里找出最小的元素，挪到新列表末尾；重复直到全部排完。<\/p>\n<p><strong>实例（可复核）<\/strong>：对 <code>[5, 3, 6, 2, 10]<\/code> 升序排序。<\/p>\n<ol><li>\n找最小：2（在第 4 位）→ 取出，新列表 <code>[2]<\/code>，余 <code>[5,3,6,10]<\/code>\n<\/li><li>\n找最小：3 → 新列表 <code>[2, 3]<\/code>，余 <code>[5,6,10]<\/code>\n<\/li><li>\n找最小：5 → <code>[2,3,5]<\/code>，余 <code>[6,10]<\/code>\n<\/li><li>\n找最小：6 → <code>[2,3,5,6]<\/code>，余 <code>[10]<\/code>\n<\/li><li>\n剩 10 → <code>[2,3,5,6,10]<\/code>\n<\/ol>\n<p><strong>为什么是 O(n²)<\/strong>：找一次最小要 O(n)（挨个看一遍），要找 n 次，总共 n × O(n) = O(n²)。原书特意解释：有人说&quot;第 2 轮只要看 n−1 个元素，平均是 n/2 个&quot;——对，但大O<strong>省略常数 1/2<\/strong>，所以仍写 O(n²)。<\/p>\n<p><strong>Python 代码（原书示例）<\/strong>：<\/p>\n<pre class=\"lang-python\"><code>def findSmallest(arr):\n    smallest = arr[0]        # 假设第一个最小\n    smallest_index = 0       # 记录最小元素的索引\n    for i in range(1, len(arr)):\n        if arr[i] &lt; smallest:\n            smallest = arr[i]\n            smallest_index = i\n    return smallest_index\n\ndef selectionSort(arr):\n    newArr = []\n    for i in range(len(arr)):\n        smallest = findSmallest(arr)       # 找最小的\n        newArr.append(arr.pop(smallest))   # 取出并追加到新列表\n    return newArr\n\nprint(selectionSort([5, 3, 6, 2, 10]))  # =&gt; [2, 3, 5, 6, 10]<\/code><\/pre>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph TB\n    subgraph 数组[&quot;数组：元素紧挨在一起&quot;]\n        A0[索引0: 10] --- A1[索引1: 20] --- A2[索引2: 30] --- A3[索引3: 40]\n    end\n    subgraph 链表[&quot;链表：散落各处,靠纸条串起&quot;]\n        B1[&quot;地址07: 元素10 →纸条: 地址92&quot;] --&gt; B2[&quot;地址92: 元素20 →纸条: 地址11&quot;] --&gt; B3[&quot;地址11: 元素30 →纸条: 地址55&quot;]\n    end<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：数组一行整齐排开，算地址就能直达任意元素（读取快）；链表每个元素只告诉你&quot;下一个在哪&quot;，要读第 3 个必须先摸过第 1、2 个（顺序访问）。插入新元素时，数组可能要整排搬家，链表只要改一张纸条。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：数组像带抽屉编号的文件柜（找第 5 号抽屉 = 直接拉）；链表像&quot;寻人启事链&quot;——每个人手里只握着下一个人的电话。\n<\/li><li>\n<strong>实例（原书练习 2.1 复核）<\/strong>：记账 App 每天追加一笔支出（插入多），月底才汇总一次（读取少）→ 选<strong>链表<\/strong>；Facebook 登录要频繁按用户名查找，且二分查找要求随机访问中间元素 → 选<strong>数组<\/strong>。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;数组更好/链表更好&quot;有标准答案<\/strong>——实际上要看操作：频繁随机读取选数组，频繁中间插删选链表。原书还举了 Facebook 式混合结构（26 个桶，每个桶一条链表），说明真实系统是混搭的。\n<\/li><li>\n<strong>别以为索引从 1 开始<\/strong>——实际上几乎所有语言都从 0 开始，第 2 个元素在索引 1。\n<\/li><li>\n<strong>别以为&quot;选择排序每次检查的元素越来越少，所以不是 O(n²)&quot;<\/strong>——实际上大O省略常数（这里是 1/2），n × (n/2) 仍写作 O(n²)。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n（单选）要在链表中读取第 1000 个元素，最快需要多久？A. O(1)　B. O(log n)　C. O(n)　D. O(n²)\n<\/li><li>\n（单选）饭店点菜单：服务员总在队尾加菜、厨师总从队首取菜。该用数组还是链表？A. 数组　B. 链表\n<\/li><li>\n（填空）对 n 个元素做选择排序，运行时间是 O(____)。\n<\/li><li>\n（简答）为什么数组插入元素可能很慢？\n<p>（答案：C；解析：链表只能顺序访问，必须从第 1 个顺着纸条摸 1000 次。） （答案：B；解析：全程是队尾插入+队首删除，正是链表擅长的操作；用不到随机访问。） （答案：n²；解析：n 轮 × 每轮 O(n) 找最小。） （答案：数组要求元素紧挨存放，中间插入要把后面所有元素向后挪一位；若空间不够还要整体复制到更大的新位置。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n数组：紧挨存放，随机读取 O(1)，中间插删 O(n)；索引从 0 开始。\n<\/li><li>\n链表：散落存放+地址串联，插删 O(1)，只能顺序访问 O(n)。\n<\/li><li>\n选择排序：反复找最小挪到新列表，O(n²)——能跑通，但快排（第4章）会教你快得多的做法。\n<\/ul>", "kind": "chapter", "title": "第 2 章：选择排序"}, "ch03": {"html": "<h1>第 3 章：递归<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：1.5 小时 | <strong>前置<\/strong>：第 1 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n写出任何递归函数的两半——基线条件与递归条件。\n<\/li><li>\n用纸笔跟踪一个递归函数的调用栈变化。\n<\/li><li>\n解释栈的&quot;压入/弹出&quot;和调用栈为什么可能撑爆内存。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p><strong>递归就是函数自己调自己；要让它停得住，必须有一个&quot;不再调用自己&quot;的基线条件；计算机用一摞叫调用栈的&quot;便条纸&quot;记住每个进行到一半的函数。<\/strong><\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：递归（难度：基础）<\/h3>\n<p><strong>递归（recursion）<\/strong>：调用自身的函数。<\/p>\n<p><strong>类比（原书找钥匙）<\/strong>：阁楼一箱子套一箱子，钥匙在某个盒子里。<\/p>\n<ul><li>\n循环派：建一个&quot;待查盒子堆&quot;，每次从堆里取一个盒子翻，翻到小盒子就丢回堆里。\n<\/li><li>\n递归派：打开当前盒子，每看到一个小盒子，就&quot;打开这个小盒子&quot;（调用自己），每看到钥匙就喊&quot;找到了&quot;。\n<\/ul>\n<p>两种方法结果相同，递归版代码更短更清晰。原书引用 Stack Overflow 一句话：<strong>&quot;用循环性能可能更高，用递归更容易理解。怎么选看你更在乎哪个。&quot;<\/strong><\/p>\n<h3>概念 2：基线条件与递归条件（难度：进阶）<\/h3>\n<p>每个递归函数必须有两部分：<\/p>\n<ul><li>\n<strong>递归条件（recursive case）<\/strong>：函数调用自己。\n<\/li><li>\n<strong>基线条件（base case）<\/strong>：函数不再调用自己，直接返回——防止无限循环。\n<\/ul>\n<p><strong>实例（可复核）<\/strong>：倒数函数。<\/p>\n<pre class=\"lang-python\"><code>def countdown(i):\n    print(i)\n    if i &lt;= 0:        # 基线条件：到 0 就停\n        return\n    else:\n        countdown(i-1) # 递归条件：自己调自己，规模减 1<\/code><\/pre>\n<p>没有基线条件时：<code>countdown(3)<\/code> 会一直数下去：3, 2, 1, 0, −1, −2……（按 Ctrl+C 才能停）。<\/p>\n<h3>概念 3：栈与调用栈（难度：进阶）<\/h3>\n<p><strong>栈（stack）<\/strong>：一种只能在同一端&quot;压入（push）&quot;和&quot;弹出（pop）&quot;的数据结构，后进先出（LIFO）。像一摞便条纸：你只能在最上面加一张、从最上面抽一张。<\/p>\n<p><strong>调用栈（call stack）<\/strong>：计算机内部用栈来记住&quot;每个函数调用进行到哪了&quot;。关键规则：<strong>调用另一个函数时，当前函数暂停并保留全部变量，等被调函数返回后从断点继续。<\/strong><\/p>\n<p><strong>实例（可复核）<\/strong>：计算阶乘 <code>fact(3)<\/code>：<\/p>\n<pre class=\"lang-python\"><code>def fact(x):\n    if x == 1:        # 基线条件\n        return 1\n    else:\n        return x * fact(x-1)  # 递归条件<\/code><\/pre>\n<p>调用栈的演化（栈顶在最上）：<\/p>\n<pre><code>fact(3)            fact(3)            fact(3)            fact(3)=6\n  ↑                  ↑                  ↑\nfact(2)            fact(2)            fact(2)=2          (空)\n  ↑                  ↑\nfact(1)=1          (弹出)\n先压入 fact(3) → 再压 fact(2) → 再压 fact(1) 命中基线\n→ 弹回 fact(2): 2×1=2 → 弹回 fact(3): 3×2=6<\/code><\/pre>\n<p>每个 fact 调用都有自己独立的 x，互不干扰。栈就是那叠&quot;还没干完的活儿&quot;的便条纸。<\/p>\n<p><strong>代价<\/strong>：栈里每个调用都占内存。递归太深 → 栈太高 → <strong>栈溢出（stack overflow）<\/strong>，程序崩溃。两个出路：改写为循环，或用高级技巧&quot;尾递归&quot;（本书不展开，且并非所有语言支持）。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    S[&quot;调用 fact(3)&quot;] --&gt; P1[&quot;压入: fact(3), x=3, 还没干完&quot;]\n    P1 --&gt; P2[&quot;压入: fact(2), x=2, 还没干完&quot;]\n    P2 --&gt; P3[&quot;压入: fact(1), x=1 命中基线条件, 返回 1&quot;]\n    P3 --&gt; U1[&quot;弹出 fact(2): 2×1=2, 返回&quot;]\n    U1 --&gt; U2[&quot;弹出 fact(3): 3×2=6, 返回, 栈清空&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：每向下调一层，栈就厚一张便条；基线条件像&quot;弹仓&quot;，从最里层开始一层层往外结算。注意方向——<strong>先压入的后弹出<\/strong>（LIFO），fact(3) 虽然最先压入，却最后才结算完。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：调用栈 = 摞盘子。你只能从最上面放盘子、从最上面取盘子；想拿底下那个，必须先把上面的全拿掉。\n<ul>\n<li>\n失效边界：摞盘子是物理动作，调用栈是内存记录——递归太深时不是&quot;拿不动&quot;，而是内存被占满导致崩溃。\n<\/li><li>\n<strong>实例（可复核）<\/strong>：fact(5) = 5 × fact(4) = 5 × 4 × 3 × 2 × 1 = 120。用纸笔：先写 5×，再调 fact(4)……直到 fact(1)=1，再一路乘回去。\n<\/ul>\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为递归&quot;更快&quot;<\/strong>——实际上递归通常不比循环快，它的价值是<strong>思路清晰<\/strong>；栈里还多存了每层的变量，反而费内存。\n<\/li><li>\n<strong>别以为&quot;递归函数自己调自己，会把数据搞混&quot;<\/strong>——实际上每次调用都有独立的变量副本，fact(3) 的 x 和 fact(2) 的 x 互不相识。\n<\/li><li>\n<strong>别以为无限递归只是&quot;多跑一会儿&quot;<\/strong>——实际上它会让调用栈无限增厚，最终栈溢出，程序直接被杀掉。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n（单选）递归函数必须包含哪两部分？A. 循环与判断　B. 基线条件与递归条件　C. 压入与弹出　D. 输入与输出\n<\/li><li>\n（单选）栈的取出顺序是？A. 先进先出　B. 后进先出　C. 随机　D. 按大小排序\n<\/li><li>\n（填空）<code>fact(4)<\/code> 的结果是 ____。\n<\/li><li>\n（简答）不小心写出了一个停不下来的递归函数，会发生什么？\n<p>（答案：B；解析：没有基线条件就无限循环；没有递归条件就退化成普通函数。） （答案：B；解析：LIFO，像一摞便条纸，最上面的先抽走。） （答案：24；解析：4×3×2×1 = 24。） （答案：每次调用都在调用栈占一块内存，栈越来越高，直到栈空间耗尽，程序因栈溢出而终止。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n递归 = 函数调自己；必须配基线条件刹车。\n<\/li><li>\n栈 = 压入/弹出、后进先出；所有函数调用都走调用栈。\n<\/li><li>\n递归省思路但费内存；栈太深会栈溢出。下一章用递归解决真正的问题——快速排序。\n<\/ul>", "kind": "chapter", "title": "第 3 章：递归"}, "ch04": {"html": "<h1>第 4 章：快速排序<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：2 小时 | <strong>前置<\/strong>：第 1 章（大O）、第 3 章（递归、调用栈）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n用&quot;找基线条件 → 缩小规模&quot;两步口述分而治之（D&amp;C）的思路。\n<\/li><li>\n手写快速排序代码，并说出基准值、分区的作用。\n<\/li><li>\n解释快速排序为什么平均 O(n log n)、最糟 O(n²)，以及为什么&quot;随机选基准值&quot;能避开最糟。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p><strong>分而治之：先想最简单到不用干的基线条件，再想怎么把问题变小；快速排序就是&quot;选一个基准值，小的甩左边、大的甩右边，再对左右两边递归来一遍&quot;——平均 O(n log n)，比选择排序快一个量级。<\/strong><\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：分而治之 D&amp;C（难度：进阶）<\/h3>\n<p><strong>分而治之（divide and conquer, D&amp;C）<\/strong>：一种递归式解题思路，两步走：<\/p>\n<ol><li>\n<strong>找基线条件<\/strong>：最简单、不用再分解就能直接回答的情况。\n<\/li><li>\n<strong>缩小规模<\/strong>：每次递归都把原问题切到更接近基线条件。\n<\/ol>\n<p><strong>实例 1（分地，可复核）<\/strong>：把 1680m × 640m 的地切成同样大的最大正方形。<\/p>\n<ul><li>\n基线条件：一边是另一边的整数倍（如 25×50，直接切两个 25×25）。\n<\/li><li>\n缩小规模：先划掉两个 640×640，剩下 640×400 这块&quot;小一号的同款问题&quot;→ 再划 400×400，剩 400×240 → 划 240×240，剩 240×160 → 划 160×160，剩 160×80，已是整数倍。\n<\/li><li>\n答案：最大正方形 = <strong>80m × 80m<\/strong>。（这就是欧几里得算法求最大公约数的思路。）\n<\/ul>\n<p><strong>实例 2（递归求和，可复核）<\/strong>：<\/p>\n<pre class=\"lang-python\"><code>def sum(arr):\n    if arr == []:        # 基线条件：空数组和为 0\n        return 0\n    return arr[0] + sum(arr[1:])  # 递归条件：第一个元素 + 剩下的和<\/code><\/pre>\n<p>口诀：<strong>涉及数组的递归，基线条件通常是空数组或只有一个元素的数组。<\/strong><\/p>\n<h3>概念 2：快速排序（难度：高难）<\/h3>\n<p><strong>快速排序（quicksort）<\/strong>：<\/p>\n<ol><li>\n从数组里挑一个元素当<strong>基准值（pivot）<\/strong>。\n<\/li><li>\n<strong>分区（partitioning）<\/strong>：把所有 ≤ 基准值的放一个子数组，所有 &gt; 基准值的放另一个。\n<\/li><li>\n对两个子数组递归地再做快速排序。\n<\/li><li>\n拼接：左子数组 + [基准值] + 右子数组。\n<\/ol>\n<p><strong>实例（可复核）<\/strong>：排序 <code>[33, 10, 15, 7, 33选首元素33]<\/code>——以 33 为基准值：左边 [10,15,7]，右边 []；再对 [10,15,7] 以 10 为基准值：左边 [7]，右边 [15]。拼接 [7] + [10] + [15] = [7,10,15]，最后得 [7,10,15,33]。<\/p>\n<p><strong>Python 代码（原书示例）<\/strong>：<\/p>\n<pre class=\"lang-python\"><code>def quicksort(array):\n    if len(array) &lt; 2:                # 基线条件：空或单元素，本来就有序\n        return array\n    else:\n        pivot = array[0]              # 选第一个元素当基准值\n        less = [i for i in array[1:] if i &lt;= pivot]   # 小于等于基准的\n        greater = [i for i in array[1:] if i &gt; pivot]  # 大于基准的\n        return quicksort(less) + [pivot] + quicksort(greater)\n\nprint(quicksort([10, 5, 2, 3]))   # =&gt; [2, 3, 5, 10]<\/code><\/pre>\n<h3>概念 3：平均情况 vs 最糟情况；常数（难度：高难）<\/h3>\n<ul><li>\n<strong>最糟情况<\/strong>：总拿第一个元素当基准值，而输入恰好已有序。每次分区一边是空的、一边只剩 n−1 个——调用栈高度 O(n)，每层花 O(n)，总共 <strong>O(n²)<\/strong>（和选择排序一样慢）。\n<\/li><li>\n<strong>最佳/平均情况<\/strong>：每次都把数组大致平分，栈高 O(log n)，每层 O(n)，总共 <strong>O(n log n)<\/strong>。\n<\/li><li>\n原书关键结论：<strong>只要随机选基准值，平均运行时间就是 O(n log n)<\/strong>；这也是快速排序实战中比合并排序快的原因——它们大O相同（都是 O(n log n)），但快速排序的<strong>常数<\/strong>更小，且平均情况几乎总撞上。\n<\/ul>\n<blockquote>关于常数：原书用 <code>print_items<\/code>（每秒打一个）vs <code>print_items2<\/code>（每个元素先 sleep 1 秒）说明——两者都是 O(n)，但实际速度差很多。大O不同的算法比常数没意义；大O相同的算法（快排 vs 合并排序）常数才有决定意义。<\/blockquote>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph TD\n    A[&quot;[10,5,2,3] pivot=10&quot;] --&gt; B[&quot;less=[5,2,3]&quot;]\n    A --&gt; C[&quot;greater=[]&quot;]\n    B --&gt; B1[&quot;pivot=5: less=[2,3]&quot;]\n    B1 --&gt; B2[&quot;pivot=2: less=[], greater=[3]&quot;]\n    B2 --&gt; B3[&quot;拼接: []+[2]+[3] = [2,3]&quot;]\n    B1 --&gt; R1[&quot;[2,3]+[5]+[] = [2,3,5]&quot;]\n    R1 --&gt; R2[&quot;[2,3,5]+[10]+[] = [2,3,5,10]&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：每条横线把问题砍成两个小同款问题；递归到最底层只剩 0 或 1 个元素（基线条件，不用排），再沿路拼接回去。看每层处理的元素总数——每层都是 O(n)，层数是 O(log n)，乘起来 O(n log n)。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：快速排序像打扑克分堆——抓起第一张牌当&quot;分数线&quot;，手里牌比它小的放左边、大的放右边，然后对两堆分别重复；最后从左往右一摊就是 sorted。\n<ul>\n<li>\n失效边界：如果你总拿&quot;最极端的一张&quot;当分数线（如已排好序的牌堆每次拿最左那张），就会退化成每次只分出一张——O(n²)。所以实战要随机抽牌。\n<\/li><li>\n<strong>实例（可复核）<\/strong>：打印数组每个元素 = O(n)；每个元素乘 2 = O(n)；只把第一个元素乘 2 = O(1)；用数组做乘法表（每个元素去乘其他所有元素）= O(n²)。\n<\/ul>\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;快速排序永远是 O(n log n)&quot;<\/strong>——实际上它的速度取决于基准值选得好不好，最糟（已排序输入+固定取首元素）会退化到 O(n²)。\n<\/li><li>\n<strong>别以为&quot;大O相同就一样快&quot;<\/strong>——实际上快排和合并排序都是 O(n log n)，但快排常数小、平均情况常见，实战更快。\n<\/li><li>\n<strong>别以为&quot;数组递归求和非用循环不可&quot;<\/strong>——实际上递归版 <code>arr[0] + sum(arr[1:])<\/code> 完全正确，函数式语言（如 Haskell）连循环都没有，全靠递归。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n（单选）快速排序的平均运行时间是？A. O(n)　B. O(log n)　C. O(n log n)　D. O(n²)\n<\/li><li>\n（单选）只把数组第一个元素的值乘 2，运行时间是？A. O(1)　B. O(n)　C. O(n log n)　D. O(n²)\n<\/li><li>\n（填空）快速排序的基线条件是数组为空或只有 ____ 个元素。\n<\/li><li>\n（简答）为什么&quot;随机选基准值&quot;能让快速排序平均变快？\n<p>（答案：C；解析：栈高 O(log n) × 每层 O(n)。） （答案：A；解析：原书练习 4.7——只碰一个元素，与 n 无关。） （答案：一；解析：空数组和单元素数组本来就有序，直接返回。） （答案：固定取首元素遇到已排序输入会退化成 O(n²)；随机选基准值意味着每次大致平分的概率很高，栈高维持在 O(log n)，平均就是 O(n log n)。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\nD&amp;C 两步：找最简单的基线条件；每次递归把问题变小。\n<\/li><li>\n快排 = 选基准值 + 分区 + 递归排序左右两边再拼接；代码 4 行核心。\n<\/li><li>\n平均 O(n log n)、最糟 O(n²)；随机选基准值避开最糟；大O相同时比常数。\n<\/ul>", "kind": "chapter", "title": "第 4 章：快速排序"}, "ch05": {"html": "<h1>第 5 章：散列表<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：2 小时 | <strong>前置<\/strong>：第 1、2 章（数组）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n解释散列表 = 散列函数 + 数组，并说出散列函数的两个要求。\n<\/li><li>\n说出散列表三大用途（映射、防重复、缓存）并各举一个原书例子。\n<\/li><li>\n解释什么是冲突、填装因子，以及为什么填装因子 &gt; 0.7 要扩容。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p><strong>散列表是&quot;给个商品名立刻报出价格&quot;的魔法店员：散列函数把键算成一个数组下标，让查找、插入、删除平均都只要 O(1)——代价是设计不好会撞位置（冲突），要靠好的散列函数和低填装因子避开。<\/strong><\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：散列函数与散列表（难度：基础）<\/h3>\n<p><strong>散列函数（hash function）<\/strong>：给它任意数据，它还你一个数字。两个要求：<\/p>\n<ol><li>\n<strong>一致性<\/strong>：同样的输入永远得到同样的输出（输入 apple 永远得 4）。\n<\/li><li>\n<strong>均匀性<\/strong>：不同输入尽量映射到不同位置。\n<\/ol>\n<p><strong>散列表（hash table）= 散列函数 + 数组<\/strong>。查价格时不用翻本子，直接把商品名喂给散列函数，它给出下标，一步取到价格。Python 里的 <strong>字典（dict）<\/strong> 就是散列表：<\/p>\n<pre class=\"lang-python\"><code>book = {}                    # 等价于 book = dict()\nbook[&quot;apple&quot;] = 0.67         # 键: 商品名; 值: 价格\nbook[&quot;milk&quot;] = 1.49\nbook[&quot;avocado&quot;] = 1.49\nprint(book[&quot;avocado&quot;])       # =&gt; 1.49，一步拿到<\/code><\/pre>\n<h3>概念 2：三大用途（难度：基础）<\/h3>\n<ol><li>\n<strong>模拟映射关系<\/strong>：电话簿（姓名→号码）、DNS 解析（网址→IP 地址）。\n<\/li><li>\n<strong>防止重复<\/strong>：投票站查重。\n<\/ol>\n<pre class=\"lang-python\"><code>   voted = {}\n   def check_voter(name):\n       if voted.get(name):      # get 找不到时返回 None\n           print(&quot;kick them out!&quot;)\n       else:\n           voted[name] = True\n           print(&quot;let them vote!&quot;)<\/code><\/pre>\n<ol><li>\n<strong>做缓存<\/strong>：网站把主页存进散列表，下次同一 URL 直接返回，不再重新计算。\n<\/ol>\n<pre class=\"lang-python\"><code>   cache = {}\n   def get_page(url):\n       if url in cache:\n           return cache[url]\n       data = get_data_from_server(url)\n       cache[url] = data\n       return data<\/code><\/pre>\n<h3>概念 3：冲突、填装因子、性能（难度：进阶）<\/h3>\n<p><strong>冲突（collision）<\/strong>：两个不同的键被散列函数算到了同一个数组位置。解决办法：该位置挂一条<strong>链表<\/strong>（拉链法）。如果散列函数很烂、所有键挤在同一个位置，散列表就退化成一条长链表——O(1) 变 O(n)。<\/p>\n<p><strong>填装因子（load factor）= 已被占用的位置数 ÷ 数组总位置数<\/strong>。<\/p>\n<ul><li>\n因子越低越空、冲突越少。\n<\/li><li>\n原书经验法则：<strong>填装因子超过 0.7 就扩容（通常数组翻倍，再重新散列所有元素）<\/strong>。\n<\/li><li>\n扩容虽贵，但均摊下来散列表操作仍是 O(1)。\n<\/ul>\n<p><strong>性能结论（原书）<\/strong>：<\/p>\n<table><thead><tr><th><\/th><th>平均情况<\/th><th>最糟情况<\/th><\/tr><\/thead><tbody><tr><td>查找/插入/删除<\/td><td>O(1)<\/td><td>O(n)（全撞车）<\/td><\/tr><\/tbody><\/table>\n<p>避开最糟的两件事：<strong>好的散列函数 + 保持低填装因子<\/strong>。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph LR\n    K[&quot;键: &#x27;avocado&#x27;&quot;] --&gt; H[&quot;散列函数 hash()&quot;]\n    H --&gt;|输出下标 4| ARR[&quot;数组&lt;br/&gt;[0]=milk  [1]=?  [2]=?  [3]=apple  [4]=avocado价格&quot;]\n    ARR --&gt; R[&quot;O(1) 直接取到价格&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：关键在中间那步——散列函数把&quot;名字&quot;变成&quot;下标&quot;，所以不用从头找，直接定位。这就是为什么散列表比&quot;翻本子（O(n)）&quot;和&quot;有序本子二分查找（O(log n)）&quot;都快：它连&quot;范围&quot;都不用缩小，一步到位。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：散列表 = 超市里过目不忘的店员 Maggie。不管货架上多少商品，问她&quot;苹果多少钱&quot;她立刻答——O(1)。数组+散列函数就是你雇到 Maggie 的方式。\n<ul>\n<li>\n失效边界：如果 Maggie 记忆力差（烂散列函数），问 A 商品她跑去 B 商品的位置乱答，或者把所有答案堆在一个格子里，她就得逐个翻——魔法失效。\n<\/li><li>\n<strong>实例（可复核）<\/strong>：长度为 10 的数组已放 3 个元素 → 填装因子 3/10 = 0.3，很安全；放 8 个 → 0.8，超过 0.7 红线，该扩容到 20 格再重散列。\n<\/ul>\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;散列表最糟也是 O(1)&quot;<\/strong>——实际上全冲突时就是 O(n)；必须靠好散列函数 + 低填装因子保住平均 O(1)。\n<\/li><li>\n<strong>别以为&quot;散列函数把不同输入映射到不同位置&quot;真能做到<\/strong>——实际上几乎不可能，冲突必然发生，所以才需要拉链法和扩容机制。\n<\/li><li>\n<strong>别以为&quot;扩容很贵所以不要扩容&quot;<\/strong>——实际上扩容后填装因子骤降，均摊下来每次操作仍是 O(1)；不扩容才会被冲突拖垮。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n（单选）平均情况下，散列表查找一个键的时间是？A. O(log n)　B. O(n)　C. O(1)　D. O(n²)\n<\/li><li>\n（单选）投票站要快速判断&quot;这个人投过没有&quot;，最适合用？A. 数组　B. 链表　C. 散列表　D. 栈\n<\/li><li>\n（填空）原书经验法则：填装因子超过 ____ 时就该给散列表扩容。\n<\/li><li>\n（简答）两个键撞到同一个位置（冲突）会怎样？最简单的处理办法是什么？\n<p>（答案：C；解析：不管散列表多大，散列函数一步定位下标。） （答案：C；解析：原书 5.2.2——列表查重是 O(n)，散列表 get 一下就知道。） （答案：0.7；解析：超过后冲突概率明显上升，扩容后因子骤降。） （答案：该位置挂一条链表，把两个键都存在链表里；查询时要在短链表中找一下。链表越短越快，所以散列函数要把键均匀铺开。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n散列表 = 散列函数 + 数组；Python 的 dict 就是它。\n<\/li><li>\n用途：映射、防重复、缓存。\n<\/li><li>\n平均 O(1)、最糟 O(n)；靠好散列函数 + 填装因子 &lt; 0.7 维持性能。\n<\/ul>", "kind": "chapter", "title": "第 5 章：散列表"}, "ch06": {"html": "<h1>第 6 章：广度优先搜索<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：2 小时 | <strong>前置<\/strong>：第 5 章（散列表，用于表示图）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n用&quot;节点 + 边&quot;的语言说清什么是图，并区分有向图与无向图。\n<\/li><li>\n口述广度优先搜索（BFS）的步骤，解释为什么必须用队列、为什么必须标记已检查。\n<\/li><li>\n说出 BFS 能回答的两类问题，及其运行时间 O(V+E)。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p><strong>广度优先搜索：从起点出发，先把所有&quot;一步之遥&quot;的人查完，再查&quot;两步之遥&quot;的，依次往外扩——所以它找到的一定是段数最少的路径；它的标配是队列（先进先出）和一张&quot;已检查&quot;名单。<\/strong><\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：图（难度：基础）<\/h3>\n<p><strong>图（graph）<\/strong>：模拟&quot;谁和谁相连&quot;的结构，由两种零件组成：<\/p>\n<ul><li>\n<strong>节点（node）<\/strong>：一个点，比如一个人、一个地点。\n<\/li><li>\n<strong>边（edge）<\/strong>：两个节点之间的连线。直接相连的节点互为<strong>邻居<\/strong>。\n<\/ul>\n<ul><li>\n<strong>有向图（directed graph）<\/strong>：边带箭头，关系单向（rama → adit 表示 rama 欠 adit 钱，反过来不成立）。\n<\/li><li>\n<strong>无向图（undirected graph）<\/strong>：边不带箭头，关系双向（ross — rachel 互相约会）。\n<\/li><li>\n<strong>树（tree）<\/strong>：一种特殊的图，所有边都朝一个方向指（没有&quot;绕回去&quot;的边），如家谱。\n<\/ul>\n<p>Python 里用<strong>散列表<\/strong>表示图：键是节点，值是它的所有邻居。<\/p>\n<pre class=\"lang-python\"><code>graph = {}\ngraph[&quot;you&quot;] = [&quot;alice&quot;, &quot;bob&quot;, &quot;claire&quot;]\ngraph[&quot;bob&quot;] = [&quot;anuj&quot;, &quot;peggy&quot;]\ngraph[&quot;alice&quot;] = [&quot;peggy&quot;]\ngraph[&quot;claire&quot;] = [&quot;thom&quot;, &quot;jonny&quot;]\ngraph[&quot;anuj&quot;] = []      # 没邻居也要登记，否则 KeyError<\/code><\/pre>\n<h3>概念 2：队列（难度：基础）<\/h3>\n<p><strong>队列（queue）<\/strong>：先进先出（FIFO）的数据结构——像公交站排队，先来的先上车。只支持两种操作：<strong>入队（enqueue）<\/strong>和<strong>出队（dequeue）<\/strong>。<\/p>\n<p>对比：<strong>栈<\/strong>是后进先出（LIFO），像一摞盘子。<\/p>\n<p>BFS 为什么必须用队列？因为要保证&quot;一度关系先于二度关系&quot;被检查：先加入查找名单的人，先被取出检查。若用栈（后入先出），就会一头扎进二度关系，找到的就不是最近的那个人。<\/p>\n<h3>概念 3：广度优先搜索（难度：进阶）<\/h3>\n<p><strong>广度优先搜索（BFS）<\/strong>回答两类问题：<\/p>\n<ol><li>\n从 A 到 B <strong>有路径吗<\/strong>？\n<\/li><li>\n如果有，<strong>哪条路径段数最少<\/strong>（最短路径）？\n<\/ol>\n<p><strong>实例（原书芒果销售商，可复核）<\/strong>：你在 Facebook 人脉网里找芒果销售商。<\/p>\n<pre class=\"lang-python\"><code>from collections import deque\n\ndef person_is_seller(name):\n    return name[-1] == &#x27;m&#x27;     # 原书简化：名字以 m 结尾就算是销售商\n\ndef search(name):\n    search_queue = deque()\n    search_queue += graph[name]   # 第一步：把你的所有邻居入队\n    searched = []                 # 已检查名单，防止重复和无限循环\n    while search_queue:\n        person = search_queue.popleft()   # 取出队首（最早入队的）\n        if person not in searched:\n            if person_is_seller(person):\n                print(person + &quot; is a mango seller!&quot;)\n                return True\n            else:\n                search_queue += graph[person]  # 他的朋友全部入队\n                searched.append(person)\n    return False\n\nsearch(&quot;you&quot;)<\/code><\/pre>\n<p>两个关键细节：<\/p>\n<ul><li>\n<strong>必须标记已检查<\/strong>：Peggy 既是 Alice 的朋友又是 Bob 的朋友，会入队两次；不做标记还可能在&quot;你 ↔ Peggy&quot;之间无限循环。\n<\/li><li>\n<strong>运行时间<\/strong>：沿每条边走一遍 = O(边数 E)，每个人入队一次 = O(人数 V)，合计 <strong>O(V + E)<\/strong>。\n<\/ul>\n<p><strong>拓扑排序<\/strong>：如果任务 A 依赖 B（先刷牙才能吃早餐），把任务排成&quot;B 必须在 A 前面&quot;的有序列表——这叫拓扑排序，用来给依赖图排执行顺序（如婚礼筹备清单）。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph LR\n    you --&gt; alice\n    you --&gt; bob\n    you --&gt; claire\n    bob --&gt; anuj\n    bob --&gt; peggy\n    alice --&gt; peggy\n    claire --&gt; thom\n    claire --&gt; jonny<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：从 you 出发，BFS 按&quot;圈层&quot;扩展——第 1 圈 alice/bob/claire，第 2 圈 anuj/peggy/thom/jonny。如果 thom 是销售商，任何一条到 thom 的路径都不会比 2 段更短（因为第 1 圈没人是）。队列保证了这个圈层顺序。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：BFS 像往水里扔石头的涟漪——从落点一圈一圈往外扩，所以&quot;第一圈碰不到、第二圈碰到&quot;的目标，距离就是 2。\n<ul>\n<li>\n失效边界：BFS 算的是&quot;段数最少&quot;，不是&quot;路程最短&quot;。如果每段路有不同耗时，要用第 7 章的狄克斯特拉算法。\n<\/li><li>\n<strong>实例（可复核）<\/strong>：原书早晨任务图——不能没刷牙就吃早餐，但洗澡和刷牙谁先谁后都行。可行的排法：起床 → 洗澡 → 刷牙 → 吃早餐；或 起床 → 刷牙 → 洗澡 → 吃早餐。两种都满足&quot;吃早餐在刷牙后&quot;。\n<\/ul>\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;BFS 找的是路程最短&quot;<\/strong>——实际上它找的是<strong>经过的节点数最少<\/strong>（段数最少）。每条边权重不同时它会给你快不了的路径。\n<\/li><li>\n<strong>别以为&quot;不标记已检查只是慢一点&quot;<\/strong>——实际上不标记可能无限循环：你不是销售商 → 把你的邻居重新入队 → 循环往复。\n<\/li><li>\n<strong>别以为&quot;链表也能当队列用&quot;<\/strong>——队列要队首出、队尾进；关键是&quot;按加入顺序处理&quot;，数据结构叫什么不重要，重要的是 FIFO 语义。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n（单选）广度优先搜索使用的数据结构是？A. 栈　B. 队列　C. 散列表　D. 数组\n<\/li><li>\n（单选）BFS 的运行时间通常写作？A. O(n)　B. O(n²)　C. O(V + E)　D. O(log n)\n<\/li><li>\n（填空）有向图的边带 ____，表示关系单向；不带箭头的叫 ____ 图。\n<\/li><li>\n（简答）为什么 BFS 找到的一定是最短路径（段数最少）？\n<p>（答案：B；解析：FIFO 保证先加入的一度关系先被检查，找到的才是最短路径。） （答案：C；解析：每个顶点入队一次 O(V)，每条边走一次 O(E)。） （答案：箭头；无向；解析：无向图中两节点互为邻居。） （答案：因为它按圈层扩展——先检查完所有一度关系，再检查二度关系。第一个被找到的目标，必然是在最小的圈层里，即段数最少。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n图 = 节点 + 边；有向（箭头）/无向（双向）；树是特殊的图。\n<\/li><li>\nBFS：队列 + 已检查名单，回答&quot;有路径吗 / 最短路径是哪条&quot;，O(V+E)。\n<\/li><li>\n依赖任务的排序用拓扑排序。第 7 章升级：边带权重时改用狄克斯特拉算法。\n<\/ul>", "kind": "chapter", "title": "第 6 章：广度优先搜索"}, "ch07": {"html": "<h1>第 7 章：狄克斯特拉算法<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：2.5 小时 | <strong>前置<\/strong>：第 6 章（图、BFS）、第 5 章（散列表）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说出 BFS 与狄克斯特拉算法的分工：非加权图 vs 加权图。\n<\/li><li>\n按四步手算一遍狄克斯特拉算法（找最便宜节点 → 更新邻居开销 → 重复 → 回溯路径）。\n<\/li><li>\n解释为什么负权边会让狄克斯特拉失效，以及该用什么替代。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p><strong>狄克斯特拉算法：每次挑&quot;当前已知最便宜（最短）&quot;的节点处理，一旦处理过就封死&quot;不会更便宜了&quot;这个假设——所以它能在加权图里找出总权重最小的路径，但这个假设只在没有负权边时成立。<\/strong><\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：加权图与最短路径（难度：进阶）<\/h3>\n<ul><li>\n<strong>权重（weight）<\/strong>：每条边上的数字，表示距离/时间/费用。\n<\/li><li>\n<strong>加权图（weighted graph）<\/strong>：边带权重的图；反之叫非加权图。\n<\/li><li>\n<strong>分工<\/strong>：非加权图找段数最少 → BFS；加权图找总权重最小 → <strong>狄克斯特拉算法（Dijkstra&#x27;s algorithm）<\/strong>。\n<\/ul>\n<p>原书小图：起点 → A（6 分钟）、起点 → B（2 分钟）、B → A（3）、B → 终点（5）、A → 终点（1）。BFS 会给&quot;两段直达&quot;的 7 分钟路径（起点→B→终点），但狄克斯特拉算出更快的 <strong>6 分钟<\/strong>：起点→B（2）→A（3）→终点（1）。<\/p>\n<h3>概念 2：狄克斯特拉四步法（难度：高难）<\/h3>\n<ol><li>\n找出<strong>最便宜<\/strong>的节点（从起点出发，能在最短时间/最少费用到达的未处理节点）。\n<\/li><li>\n对它的每个邻居，检查&quot;经过本节点是否更近&quot;，更近就<strong>更新开销<\/strong>并记下父节点。\n<\/li><li>\n重复 1~2，直到所有节点都处理过。\n<\/li><li>\n沿父节点<strong>回溯<\/strong>出最终路径。\n<\/ol>\n<p><strong>手算实例（原书换钢琴，可复核）<\/strong>：Rama 用乐谱换钢琴，要求额外花钱最少。<\/p>\n<table><thead><tr><th>步骤<\/th><th>选中节点<\/th><th>更新后的关键开销<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>海报（0 美元，最便宜）<\/td><td>低音吉他 30、架子鼓 35<\/td><\/tr><tr><td>2<\/td><td>黑胶唱片（+5 美元）<\/td><td>架子鼓降到 20、吉他降到 15<\/td><\/tr><tr><td>3<\/td><td>吉他（15）<\/td><td>钢琴 = 15+20 = 35<\/td><\/tr><tr><td>4<\/td><td>架子鼓（20）<\/td><td>钢琴降到 20+15 = <strong>35<\/strong><\/td><\/tr><\/tbody><\/table>\n<p>回溯父节点：钢琴 ← 架子鼓 ← 黑胶唱片 ← 乐谱。<strong>最终答案：最少额外花 35 美元<\/strong>。<\/p>\n<h3>概念 3：三个散列表与代码（难度：高难）<\/h3>\n<p>原书实现用三个散列表：<code>graph<\/code>（图+权重）、<code>costs<\/code>（到每个节点当前已知的最小开销）、<code>parents<\/code>（父节点，用于回溯），外加一个 <code>processed<\/code> 列表。<\/p>\n<pre class=\"lang-python\"><code>infinity = float(&quot;inf&quot;)\ncosts = {&quot;a&quot;: 6, &quot;b&quot;: 2, &quot;fin&quot;: infinity}\nparents = {&quot;a&quot;: &quot;start&quot;, &quot;b&quot;: &quot;start&quot;, &quot;fin&quot;: None}\nprocessed = []\n\ndef find_lowest_cost_node(costs):\n    lowest_cost = float(&quot;inf&quot;)\n    lowest_cost_node = None\n    for node in costs:                       # 遍历所有节点\n        cost = costs[node]\n        if cost &lt; lowest_cost and node not in processed:  # 未处理且更便宜\n            lowest_cost = cost\n            lowest_cost_node = node\n    return lowest_cost_node\n\nnode = find_lowest_cost_node(costs)\nwhile node is not None:\n    cost = costs[node]\n    neighbors = graph[node]\n    for n in neighbors.keys():\n        new_cost = cost + neighbors[n]       # 经过本节点去邻居的开销\n        if costs[n] &gt; new_cost:             # 发现更短路径\n            costs[n] = new_cost\n            parents[n] = node\n    processed.append(node)\n    node = find_lowest_cost_node(costs)<\/code><\/pre>\n<h3>概念 4：负权边与适用边界（难度：高难）<\/h3>\n<ul><li>\n<strong>环（cycle）<\/strong>：从某节点出发绕一圈回到自己。有向图里绕环只会增加总权重，不会是最短路径。\n<\/li><li>\n<strong>负权边<\/strong>：某条边的权重为负（如&quot;换这个还能倒赚 7 美元&quot;）。\n<\/li><li>\n<strong>为什么不能用<\/strong>：狄克斯特拉的核心假设是&quot;节点一旦处理，就不可能有更便宜的路径&quot;。负权边会制造&quot;处理完又变便宜&quot;的矛盾，算法会选错误路径。\n<\/li><li>\n<strong>替代<\/strong>：含负权边的图用<strong>贝尔曼-福德算法（Bellman-Ford）<\/strong>（本书不展开）。\n<\/ul>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph LR\n    start -- 2 --&gt; b\n    start -- 6 --&gt; a\n    b -- 3 --&gt; a\n    b -- 5 --&gt; fin\n    a -- 1 --&gt; fin<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：BFS 数段数会选 start→b→fin（2 段，7 分钟）；但把权重加起来算，start→b→a→fin = 2+3+1 = <strong>6 分钟<\/strong>更短。狄克斯特拉的每一步都在问&quot;这条新路是不是比已知的便宜&quot;，所以能挖出这条绕一下却更快的路。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：狄克斯特拉像导航软件——你从家出发，它先解锁&quot;已知最近&quot;的路口，从那个路口再看能不能拐出更短的路。\n<ul>\n<li>\n失效边界：如果有一条&quot;越走越便宜&quot;的暗道（负权边），导航的&quot;最近路口已封死&quot;假设就错了——得换算法。\n<\/li><li>\n<strong>实例（可复核）<\/strong>：原书练习 7.1 答案：图 A 最短总权重 = 8；图 B = 60；图 C 有负权边，狄克斯特拉<strong>无法<\/strong>找出最短路径。\n<\/ul>\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;狄克斯特拉和 BFS 一样找段数最少&quot;<\/strong>——实际上它找的是<strong>总权重最小<\/strong>，路径可能多绕几段。\n<\/li><li>\n<strong>别以为&quot;负权边只是省钱，算法照样能用&quot;<\/strong>——实际上负权边会破坏&quot;处理过即最优&quot;的假设，得到错误答案，必须换贝尔曼-福德。\n<\/li><li>\n<strong>别以为&quot;环会带来更短路径&quot;<\/strong>——实际上绕环只会累加权重，永远不可能更短，所以算法不用考虑绕环。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n（单选）在加权图中找总权重最小的路径，应使用？A. BFS　B. 选择排序　C. 狄克斯特拉算法　D. 快速排序\n<\/li><li>\n（单选）图中出现负权边时，正确做法是？A. 照常使用狄克斯特拉　B. 改用贝尔曼-福德算法　C. 忽略负权边　D. 用 BFS\n<\/li><li>\n（填空）狄克斯特拉算法每一步都先选出____最低的节点来处理。\n<\/li><li>\n（简答）最终路径是怎么算出来的？\n<p>（答案：C；解析：BFS 只管段数，不管权重。） （答案：B；解析：负权边使狄克斯特拉的&quot;已处理即最优&quot;假设失效。） （答案：开销（成本/代价）；解析：这是它能保证最优的关键——先封死最便宜的节点。） （答案：算法本身只算出每个节点的最小开销；从终点沿父节点一列往回追（钢琴←架子鼓←黑胶唱片←乐谱），追到起点就得到完整路径。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n非加权图最短路径 = BFS；加权图最短路径 = 狄克斯特拉。\n<\/li><li>\n四步：选最便宜节点 → 更新邻居开销 → 重复 → 父节点回溯。\n<\/li><li>\n红线：有负权边就不能用，换贝尔曼-福德。\n<\/ul>", "kind": "chapter", "title": "第 7 章：狄克斯特拉算法"}, "ch08": {"html": "<h1>第 8 章：贪婪算法<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：2 小时 | <strong>前置<\/strong>：第 1 章（O(n!)）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说清什么是贪婪策略（每步选局部最优），并举一个它恰好得到全局最优的例子。\n<\/li><li>\n识别 NP 完全问题，并说明为什么对它该用近似算法。\n<\/li><li>\n用集合运算（并集/交集/差集）读懂原书集合覆盖问题的代码。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p><strong>贪婪算法 = 每一步都选眼前看起来最好的那一个；它不保证全局最优，但胜在简单飞快——遇到 NP 完全问题（旅行商、集合覆盖）时，与其死磕精确解，不如用贪婪近似解凑合。<\/strong><\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：贪婪策略（难度：基础）<\/h3>\n<p><strong>贪婪算法（greedy algorithm）<\/strong>：每一步都做<strong>局部最优选择<\/strong>，指望拼出全局最优。<\/p>\n<p><strong>实例 1（教室调度，贪婪恰好最优）<\/strong>：一间教室要排尽可能多的不冲突课程。做法：每次选<strong>结束最早<\/strong>的课 → 再选它结束后才开始、且结束最早的课……原书结果：美术（10:00 结束）→ 数学 → 音乐，共 3 节。对这个问题，简单贪婪就是最优解。<\/p>\n<p><strong>实例 2（背包，贪婪会翻车）<\/strong>：35 磅背包，音响 30 磅/$3000、笔记本 3 磅/$2000、吉他 1 磅/$1500。贪婪先偷最贵的音响 → 装满，得 $3000；但偷笔记本+吉他 = $3500 更优。<strong>贪婪不保证最优，但&quot;非常接近&quot;<\/strong>。<\/p>\n<h3>概念 2：集合覆盖问题与近似算法（难度：进阶）<\/h3>\n<p><strong>问题<\/strong>：要让全美 50 个州都听到广播，每个广播台覆盖几个州且彼此重叠，求<strong>最少<\/strong>广播台集合。<\/p>\n<p><strong>精确解<\/strong>：列出所有可能的子集（<strong>幂集<\/strong>，2ⁿ 个），逐个检查哪个覆盖全部州且最小——运行时间 <strong>O(2ⁿ)<\/strong>，广播台一多就算到天荒地老。<\/p>\n<p><strong>贪婪近似解<\/strong>（原书代码，O(n²)）：<\/p>\n<pre class=\"lang-python\"><code>states_needed = set([&quot;mt&quot;, &quot;wa&quot;, &quot;or&quot;, &quot;id&quot;, &quot;nv&quot;, &quot;ut&quot;, &quot;ca&quot;, &quot;az&quot;])\nstations = {\n    &quot;kone&quot;:  set([&quot;id&quot;, &quot;nv&quot;, &quot;ut&quot;]),\n    &quot;ktwo&quot;:  set([&quot;wa&quot;, &quot;id&quot;, &quot;mt&quot;]),\n    &quot;kthree&quot;:set([&quot;or&quot;, &quot;nv&quot;, &quot;ca&quot;]),\n    &quot;kfour&quot;: set([&quot;nv&quot;, &quot;ut&quot;]),\n    &quot;kfive&quot;: set([&quot;ca&quot;, &quot;az&quot;]),\n}\nfinal_stations = set()\n\nwhile states_needed:\n    best_station = None\n    states_covered = set()\n    for station, states in stations.items():\n        covered = states_needed &amp; states        # 交集：该台新覆盖多少未覆盖的州\n        if len(covered) &gt; len(states_covered):  # 当前覆盖最多未覆盖州的台\n            best_station = station\n            states_covered = covered\n    states_needed -= states_covered            # 差集：划掉已覆盖的州\n    final_stations.add(best_station)\n\nprint(final_stations)   # 原书结果: {&#x27;ktwo&#x27;,&#x27;kthree&#x27;,&#x27;kone&#x27;,&#x27;kfive&#x27;}<\/code><\/pre>\n<p>每次选&quot;覆盖最多<strong>还没覆盖<\/strong>的州&quot;的广播台，重复直到全覆盖。<strong>近似算法（approximation algorithm）<\/strong>的好坏看两点：速度多快、离最优解多近。<\/p>\n<p><strong>集合三运算<\/strong>：并集 <code>|<\/code>（合并）、交集 <code>&amp;<\/code>（共有元素）、差集 <code>-<\/code>（剔除共有元素）。<\/p>\n<h3>概念 3：NP 完全问题（难度：高难）<\/h3>\n<p><strong>NP 完全问题（NP-complete）<\/strong>：以难解著称、目前没人找到快速解法的问题。两个经典代表：<\/p>\n<ul><li>\n<strong>旅行商问题<\/strong>：n 个城市的路线数 = n!（3 城 6 条、4 城 24 条、10 城 360 万条）。\n<\/li><li>\n<strong>集合覆盖问题<\/strong>：子集数 2ⁿ。\n<\/ul>\n<p><strong>蛛丝马迹（原书识别清单）<\/strong>：<\/p>\n<ul><li>\n元素少时很快，n 一大就慢得离谱；\n<\/li><li>\n涉及&quot;所有组合/所有排列&quot;；\n<\/li><li>\n不能拆成小问题，必须考虑各种可能；\n<\/li><li>\n涉及序列（城市顺序）或集合（广播台集合）且难办；\n<\/li><li>\n能归约成旅行商或集合覆盖问题。\n<\/ul>\n<p><strong>应对<\/strong>：别找精确解，直接上贪婪近似。完美是优秀的敌人。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph TD\n    Q[&quot;遇到问题&quot;] --&gt; Q1{&quot;能快速求解吗?&quot;}\n    Q1 --&gt;|能| OK[&quot;用精确算法&quot;]\n    Q1 --&gt;|不能, 疑似 NP 完全| NP[&quot;检查蛛丝马迹:&lt;br/&gt;所有组合? 序列/集合? n一大就爆?&quot;]\n    NP --&gt; AP[&quot;用贪婪近似算法:&lt;br/&gt;每步选局部最优&quot;]\n    AP --&gt; G[&quot;结果: 简单+快+接近最优&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：这是原书反复用的决策路径——先判断问题&quot;能不能快速解&quot;，不能就别死磕精确解；贪婪算法的价值不在最优，而在&quot;够用、够快、够简单&quot;。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：贪婪算法像收拾行李——每次抓&quot;现在最想要的&quot;塞进背包。对大部分日常打包，这已经够好；只有在精确称重的比赛里才输。\n<ul>\n<li>\n失效边界：遇到&quot;全局组合最优&quot;类问题（背包、覆盖、旅行商），局部最优拼不出全局最优。\n<\/li><li>\n<strong>实例（可复核）<\/strong>：装卡车：每次塞&quot;还能塞进剩余空间的最大箱子&quot;——快，但不保证空间利用率最优（原书练习 8.1）。\n<\/ul>\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;贪婪算法不好所以不用学&quot;<\/strong>——实际上它对教室调度这类问题就是精确最优解；对 NP 完全问题，它是最快的近似方案。\n<\/li><li>\n<strong>别以为&quot;集合覆盖问题可以靠多买几台服务器硬算&quot;<\/strong>——实际上 2ⁿ 增长比硬件快得多，n=60 时子集数已超过宇宙原子量级级别，只能近似。\n<\/li><li>\n<strong>别以为&quot;问题长得像最短路径就有快解&quot;<\/strong>——实际上&quot;A 到 B&quot;有快解，但&quot;途经所有指定点&quot;就是旅行商，NP 完全。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n（单选）下列哪个是贪婪算法？A. 快速排序　B. 广度优先搜索　C. 每次选结束最早的课排进教室　D. 二分查找\n<\/li><li>\n（单选）集合覆盖问题的精确解运行时间是？A. O(n)　B. O(n log n)　C. O(2ⁿ)　D. O(log n)\n<\/li><li>\n（填空）<code>A = {1,2,3}<\/code>，<code>B = {2,3,4}<\/code>，则 <code>A &amp; B<\/code> = ____，<code>A | B<\/code> = ____。\n<\/li><li>\n（简答）邮递员要给 20 个家庭送信并找最短路线，这是 NP 完全问题吗？为什么？\n<p>（答案：C；解析：原书练习 8.3~8.5：快排不是贪婪；BFS 和狄克斯特拉是（每步选当前最优）。） （答案：C；解析：幂集有 2ⁿ 个子集，要逐个检查。） （答案：{2,3}；{1,2,3,4}；解析：交集取共有，并集合并去重。） （答案：是。它就是旅行商问题——要试遍 20 个家庭的排列顺序，20! 是天文数字（原书练习 8.6）。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n贪婪 = 每步局部最优；有时恰好全局最优（教室调度），有时只是近似（背包）。\n<\/li><li>\nNP 完全问题：旅行商 n!、集合覆盖 2ⁿ；识别靠&quot;组合爆炸/序列/集合&quot;等蛛丝马迹。\n<\/li><li>\n对付 NP 完全：放弃精确解，用贪婪近似——简单、快、接近最优。\n<\/ul>", "kind": "chapter", "title": "第 8 章：贪婪算法"}, "ch09": {"html": "<h1>第 9 章：动态规划<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：3 小时 | <strong>前置<\/strong>：第 8 章（背包问题引入）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说出动态规划的核心动作：建网格、逐格填、每格 = 一个子问题的最优值。\n<\/li><li>\n手填背包问题网格，解释&quot;单元格公式&quot;的两部分比较。\n<\/li><li>\n区分最长公共子串与最长公共子序列，并写出它们的递推公式。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p><strong>动态规划：把大问题拆成一排排小问题（子背包），把每个小问题的最优答案填进网格格子里，填到最后一格时，大问题的答案自己跳出来——前提是子问题彼此独立、不互相依赖。<\/strong><\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：背包问题的网格解法（难度：高难）<\/h3>\n<p><strong>问题<\/strong>：背包容量 4 磅，可偷：吉他（1 磅/$1500）、音响（4 磅/$3000）、笔记本电脑（3 磅/$2000）。怎么偷总价值最大？<\/p>\n<p><strong>网格设计<\/strong>：行 = 商品（吉他、音响、笔记本）；列 = 背包容量（1、2、3、4 磅）。每个格子 = &quot;当前行商品 + 当前列容量&quot;下的最大价值。<\/p>\n<p><strong>逐行填（可复核）<\/strong>：<\/p>\n<table><thead><tr><th><\/th><th>1磅<\/th><th>2磅<\/th><th>3磅<\/th><th>4磅<\/th><\/tr><\/thead><tbody><tr><td>吉他<\/td><td>1500<\/td><td>1500<\/td><td>1500<\/td><td>1500<\/td><\/tr><tr><td>音响（4磅）<\/td><td>1500<\/td><td>1500<\/td><td>1500<\/td><td><strong>3000<\/strong><\/td><\/tr><tr><td>笔记本（3磅）<\/td><td>1500<\/td><td>1500<\/td><td>2000<\/td><td><strong>3500<\/strong><\/td><\/tr><\/tbody><\/table>\n<p>关键格（笔记本行 × 4磅）的算法：<\/p>\n<ul><li>\n不偷笔记本：沿用旧最优 3000。\n<\/li><li>\n偷笔记本（占 3 磅）：2000 + 剩余 1 磅格子里的最优（吉他 1500）= 3500。\n<\/li><li>\n取大者：<strong>3500<\/strong>。\n<\/ul>\n<p><strong>答案：吉他 + 笔记本，总价值 $3500<\/strong>（不是最贵的音响 $3000）。<\/p>\n<p><strong>通用格子公式<\/strong>：<code>当前格 = max(上一格的值, 当前商品价值 + 剩余容量对应格子的值)<\/code>。<\/p>\n<p><strong>原书 FAQ 要点<\/strong>：<\/p>\n<ul><li>\n加新商品（iPhone 1 磅/$2000）：只加一行重算，不用推倒重来 → 新答案 iPhone+笔记本 = 4000。\n<\/li><li>\n行的顺序随便换，结果不变。\n<\/li><li>\n商品重量必须是整数粒度（0.5 磅的项链就需要更细的网格）。\n<\/li><li>\n<strong>不能偷商品的一部分<\/strong>（要么整件拿、要么不拿）；想偷散装的（如按斤称米）请用第 8 章贪婪算法。\n<\/li><li>\n子问题必须<strong>彼此独立<\/strong>（去巴黎旅游这种&quot;后面的景点依赖前面的行程&quot;无法建模）。\n<\/ul>\n<h3>概念 2：最长公共子串（难度：高难）<\/h3>\n<p><strong>问题<\/strong>：用户拼错成 <code>hish<\/code>，到底想查 <code>fish<\/code> 还是 <code>vista<\/code>？<\/p>\n<p><strong>网格<\/strong>：行 = 单词 A 的每个字母，列 = 单词 B 的每个字母。格子 (i,j) = &quot;A 前 i 个字母&quot;与&quot;B 前 j 个字母&quot;的<strong>最长公共子串长度<\/strong>。<\/p>\n<p><strong>公式<\/strong>：<\/p>\n<pre class=\"lang-python\"><code>if word_a[i] == word_b[j]:        # 两个字母相同\n    cell[i][j] = cell[i-1][j-1] + 1   # 左上角格子 +1\nelse:                              # 不同\n    cell[i][j] = 0                    # 打断，归零<\/code><\/pre>\n<p>结果：<code>hish<\/code> vs <code>fish<\/code> 公共子串 &quot;ish&quot; = <strong>3<\/strong>；<code>hish<\/code> vs <code>vista<\/code> = <strong>2<\/strong>。所以用户想查的是 <strong>fish<\/strong>。<\/p>\n<blockquote>注意：答案是网格里<strong>最大的数<\/strong>，不一定在右下角！<\/blockquote>\n<h3>概念 3：最长公共子序列（难度：高难）<\/h3>\n<p><strong>子序列<\/strong>：字母不必连续出现，但顺序要对。例：<code>fosh<\/code> 与 <code>fish<\/code> 的公共子序列是 <code>f, s, h<\/code> = 3。<\/p>\n<p><strong>公式<\/strong>（只在 else 分支不同）：<\/p>\n<pre class=\"lang-python\"><code>if word_a[i] == word_b[j]:\n    cell[i][j] = cell[i-1][j-1] + 1\nelse:\n    cell[i][j] = max(cell[i-1][j], cell[i][j-1])  # 取上方或左方较大者<\/code><\/pre>\n<p><strong>用途<\/strong>：DNA 相似性比较、git diff、编辑距离（拼写检查）、Word 断字。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph TD\n    P[&quot;原问题: 4磅背包装什么&quot;] --&gt; S1[&quot;子问题: 1磅/2磅/3磅背包装什么?&quot;]\n    S1 --&gt; G[&quot;网格: 每行加一件商品,逐列算最优&quot;]\n    G --&gt; F[&quot;最后一格 = 原问题最优解&lt;br/&gt;3500美元 = 吉他+笔记本&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：动态规划的精髓在箭头方向——先把子问题（各种小背包）全部算完并存进格子；原问题求解时直接查格子里已算好的答案拼起来，不再重复计算。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：动态规划像爬楼梯——你不用知道怎么从 0 楼到 10 楼，只要知道&quot;站在第 k 楼时怎么到 k+1 楼&quot;（每格公式），再从 1 楼一步步填到 10 楼。\n<ul>\n<li>\n失效边界：如果楼梯的台阶之间互相干扰（子问题不独立，如&quot;先去巴黎才能便宜去卢浮宫&quot;），格子就没法独立填，动态规划失效。\n<\/li><li>\n<strong>实例（可复核）<\/strong>：原书练习 9.2——6 磅露营背包：水（3 磅/价值10）、书（1/3）、食物（2/9）、夹克（2/5）、相机（1/6）。答案：<strong>水 + 食物 + 相机<\/strong>（3+2+1=6 磅，价值 10+9+6=25）。\n<\/ul>\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;动态规划就是把所有组合试一遍&quot;<\/strong>——实际上试所有组合是 O(2ⁿ) 的蛮力；动态规划每格只做一次比较，是多项式时间。\n<\/li><li>\n<strong>别以为&quot;答案总在最后一格&quot;<\/strong>——背包问题是，但最长公共子串问题的答案是网格中的最大值，可能在中间。\n<\/li><li>\n<strong>别以为&quot;动态规划什么问题都能解&quot;<\/strong>——实际上子问题必须离散独立；有依赖关系（去巴黎影响后续景点价格）就建不了网格。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n（单选）背包问题 4 磅、吉他（1/$1500）、音响（4/$3000）、笔记本（3/$2000），最优解是？A. 音响 $3000　B. 吉他+笔记本 $3500　C. 吉他+音响 $4500　D. 笔记本 $2000\n<\/li><li>\n（单选）最长公共子串与最长公共子序列的公式区别在哪个分支？A. 字母相同　B. 字母不同　C. 初始化　D. 无区别\n<\/li><li>\n（填空）动态规划每种解法都涉及一张 ____，每个格子代表一个____ 的最优值。\n<\/li><li>\n（简答）为什么&quot;去巴黎顺便游卢浮宫&quot;这类问题动态规划处理不了？\n<p>（答案：B；解析：音响 4 磅占满；笔记本 3 磅 + 吉他 1 磅 = 4 磅，$3500。） （答案：B；解析：不同时子串归 0，子序列取 max（上/左）。） （答案：网格；子问题；解析：这是原书小结的原话。） （答案：子问题不独立——加了&quot;去巴黎&quot;这件事后，游卢浮宫的成本从 1.5 天变成 1 天，子问题的值互相依赖，没法在网格里独立填格。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n动态规划 = 网格 + 逐格子问题最优值；每格公式：max（不拿 / 拿+剩余格子）。\n<\/li><li>\n适用条件：约束下求最优、子问题离散独立；不适用：可拆分散装、子问题互相依赖。\n<\/li><li>\n子串（连续，不同则归 0）vs 子序列（可跳着取，不同则取 max）。\n<\/ul>", "kind": "chapter", "title": "第 9 章：动态规划"}, "ch10": {"html": "<h1>第 10 章：K 最近邻算法<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★☆☆ | <strong>预估学时<\/strong>：1.5 小时 | <strong>前置<\/strong>：第 1 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说清 KNN 的两步：抽特征 → 找最近的 K 个邻居 → 投票/平均。\n<\/li><li>\n区分<strong>分类<\/strong>（编组）与<strong>回归<\/strong>（预测数值）。\n<\/li><li>\n解释为什么&quot;特征选得好不好&quot;决定 KNN 的成败。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p><strong>K 最近邻：把每个东西变成一组坐标，算它和谁离得最近；分类就看最近 K 个邻居大多是哪类，回归就把这 K 个邻居的数值取平均——简单，但效果完全取决于你抽的特征好不好。<\/strong><\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：特征抽取与距离（难度：基础）<\/h3>\n<p><strong>特征（feature）<\/strong>：把物品量化成几个数字。水果用&quot;个头、颜色&quot;两个数字；Netflix 用户用&quot;对 5 类电影的打分&quot;5 个数字。<\/p>\n<p><strong>距离公式（毕达哥拉斯公式）<\/strong>：<\/p>\n<pre><code>两点 (x1,y1) 与 (x2,y2) 的距离 = √((x1−x2)² + (y1−y2)²)<\/code><\/pre>\n<p>原书实例：Priyanka 与 Justin 兴趣几乎一致，距离 = <strong>1<\/strong>（很近）；Priyanka 与 Morpheus（都爱动作片、讨厌爱情片）距离 = <strong>24<\/strong>（很远）。5 维、100 维也用同一个公式。<\/p>\n<h3>概念 2：分类与回归（难度：基础）<\/h3>\n<p><strong>K 最近邻（KNN, k-nearest neighbours）<\/strong>：<\/p>\n<ul><li>\n<strong>分类（classification）= 编组<\/strong>：新水果是橙子还是柚子？看离它最近的 3 个邻居里橙子多还是柚子多——多数票决定。\n<\/li><li>\n<strong>回归（regression）= 预测数值<\/strong>：Priyanka 会给某电影打几分？取最近 5 个邻居打分的<strong>平均值<\/strong>：(3+4+4+5+5)/5 = <strong>4.2<\/strong>。\n<\/ul>\n<p><strong>实例（面包店，可复核）<\/strong>：用 K=4 邻居的销量平均预测今天烤多少条面包。历史数据里与今天（周末、天气不错）最接近的 4 天销量 A、B、D、E，平均 = <strong>218.75 条<\/strong>，就烤这么多。<\/p>\n<h3>概念 3：特征选择与 K 的选择（难度：进阶）<\/h3>\n<ul><li>\n<strong>好特征<\/strong>：与要预测的目标紧密相关；不偏不倚（不能只让人给喜剧片打分，否则看不出谁喜欢动作片）。\n<\/li><li>\n<strong>K 取多少<\/strong>：原书经验法则——用户数为 N 时，取 <strong>√N<\/strong> 个邻居；K 太小容易被个别异常带偏。\n<\/li><li>\n<strong>打分尺度不一<\/strong>：Yogi 宽松全打 5 星、Pinky 挑剔——先<strong>归一化<\/strong>（按各自平均评分调整）再比较。\n<\/li><li>\n<strong>实际中常用余弦相似度<\/strong>（比较向量夹角而不是直线距离），对&quot;一个人整体打分偏高&quot;更鲁棒。\n<\/li><li>\n<strong>延伸<\/strong>：OCR 字符识别、垃圾邮件过滤（朴素贝叶斯）、语音/人脸识别，都是&quot;先训练、再找最近邻&quot;的套路。\n<\/ul>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph LR\n    NEW[&quot;新样本&lt;br/&gt;未知&quot;] --&gt; D[&quot;算它到所有已知样本的距离&quot;]\n    D --&gt; K[&quot;取最近的 K 个邻居&quot;]\n    K --&gt; C{&quot;要编组还是要数值?&quot;}\n    C --&gt;|编组| V[&quot;少数服从多数投票&lt;br/&gt;→ 分类结果&quot;]\n    C --&gt;|数值| AVG[&quot;取邻居数值的平均&lt;br/&gt;→ 回归结果&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：KNN 没有复杂的&quot;训练&quot;——所有计算都在&quot;来了新样本的那一刻&quot;发生：先算距离，再圈出最近 K 个，最后看任务是投票还是取平均。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：判断一个陌生水果是橙是柚，你不会背诵植物学论文，而是瞟一眼旁边最像的 3 个水果——多数是橙就是橙。KNN 就是&quot;随大流看邻居&quot;的数学版。\n<ul>\n<li>\n失效边界：如果旁边摆的 3 个全是被误标的水果，或者你只看了&quot;颜色&quot;这一个特征而忽略了&quot;个头&quot;，结论就会错——特征质量决定一切。\n<\/li><li>\n<strong>实例（可复核）<\/strong>：推荐系统——找出与你最近的 5 个用户，他们看过而你没看过的电影，推荐给你。你评论越多，坐标越准，推荐越准（这就是 Netflix 反复求你评分的原因）。\n<\/ul>\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;KNN 必须 K=5&quot;<\/strong>——实际上 K 随便取（2、10、10000），名字里的 K 就是这个意思；经验上取 √N。\n<\/li><li>\n<strong>别以为&quot;回归就是再训练一个复杂模型&quot;<\/strong>——实际上原书的回归就是把 K 个邻居的数值求平均，一行算术。\n<\/li><li>\n<strong>别以为&quot;给更多维度打分总是更好&quot;<\/strong>——实际上如果特征与目标无关（让人给小猫图片打分来推电影），维度再多也是噪声。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n（单选）KNN 做&quot;回归&quot;时，最终输出是？A. 投票多数的类别　B. 最近 K 个邻居数值的平均值　C. 距离公式　D. 最大值\n<\/li><li>\n（单选）判断用户品味是否相近，最合适的第一步是？A. 直接比较用户名　B. 把用户对各类电影的打分变成坐标再算距离　C. 让用户自我介绍　D. 用二分查找\n<\/li><li>\n（填空）原书经验法则：N 个用户时，K 取 ____ 个。\n<\/li><li>\n（简答）为什么 Netflix 总催你多给电影打分？\n<p>（答案：B；解析：分类=编组投票，回归=数值平均。） （答案：B；解析：特征抽取——把人变成可比较的数字向量。） （答案：√N（N 的平方根）；解析：太少易被异常带偏，太多会引入不相似的邻居。） （答案：你打分越多，你的特征向量维度越完整、越准确，算法算&quot;谁和你像&quot;就越准，推荐质量越高。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\nKNN 两步：抽特征（量化）→ 找最近 K 个邻居。\n<\/li><li>\n分类 = 投票；回归 = 平均。\n<\/li><li>\n成败在特征：要相关、不偏袒；尺度不一要归一化，实战常用余弦相似度。\n<\/ul>", "kind": "chapter", "title": "第 10 章：K 最近邻算法"}, "ch11": {"html": "<h1>第 11 章：接下来如何做<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★☆☆ | <strong>预估学时<\/strong>：1 小时 | <strong>前置<\/strong>：第 1~10 章全部（本章是地图，不是新课）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说出 10 个进阶主题各自解决什么问题（一句话级别）。\n<\/li><li>\n在自己的兴趣方向（数据结构 / 搜索 / 信号 / 大数据 / 安全 / 最优化）里，选出下一个该深入的主题。\n<\/li><li>\n复述&quot;哈希&quot;与&quot;SHA&quot;的区别、&quot;布隆过滤器&quot;与&quot;散列表&quot;的区别。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p><strong>本章不教新算法，而是给你一张地图：本书只是算法世界的入口，每个方向都有更专深的主题——挑你感兴趣的，一头扎进去。<\/strong><\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：树类数据结构（难度：进阶）<\/h3>\n<p><strong>二叉查找树（binary search tree）<\/strong>：每个节点，左子节点值比它小、右子节点值比它大。查找几乎和二分查找一样：从根开始，目标小就往左、大就往右。<\/p>\n<ul><li>\n平均查找 O(log n)；但<strong>不平衡时退化为 O(n)<\/strong>（树歪成一根棍子）。\n<\/li><li>\n插入/删除比有序数组快得多（数组插完要重排才能二分）。\n<\/li><li>\n平衡变种：<strong>红黑树、B 树<\/strong>（数据库常用）、堆、伸展树。\n<\/ul>\n<h3>概念 2：反向索引（难度：基础）<\/h3>\n<p><strong>反向索引（inverted index）<\/strong>：散列表，键 = 单词，值 = 包含该单词的网页列表。用户搜 &quot;hi&quot; → 查表 → 拿到所有含 hi 的页面。这是搜索引擎的雏形。<\/p>\n<h3>概念 3：信号与并行（难度：进阶）<\/h3>\n<ul><li>\n<strong>傅里叶变换<\/strong>：把混合信号拆成成分——一首歌拆成各种频率，删掉不重要的频率就是 MP3/JPG 压缩；还用于地震预测、DNA 分析、音乐识别（Shazam）。\n<\/li><li>\n<strong>并行算法<\/strong>：多核时代，排序可并行到 O(n)；但提速不是线性的——有管理开销和负载均衡两个坑。\n<\/li><li>\n<strong>MapReduce<\/strong>：分布式并行，map（对每个元素做同样处理，可拆散到多台机器）+ reduce（把数组归并成一个值，如求和）。Hadoop 生态，处理数十亿行数据。\n<\/ul>\n<h3>概念 4：概率型数据结构与安全（难度：进阶）<\/h3>\n<ul><li>\n<strong>布隆过滤器（Bloom filter）<\/strong>：判断&quot;某元素在不在集合里&quot;的概率型结构。<strong>可能错报<\/strong>（说在，其实不在），但<strong>绝不漏报<\/strong>（说不在，就肯定不在）。占用空间极小，适合&quot;网页是否抓过&quot;这类场景。\n<\/li><li>\n<strong>HyperLogLog<\/strong>：近似数出集合里有多少不同元素，内存极小、答案八九不离十。\n<\/li><li>\n<strong>SHA（安全散列算法）<\/strong>：任意字符串 → 一段短散列值。用途：比对大文件是否相同；<strong>存密码只存散列值<\/strong>（单向，反推不出原密码）。密码用 SHA-2/SHA-3，最安全是 bcrypt。\n<\/li><li>\n<strong>Simhash（局部敏感散列）<\/strong>：改一个字符结果就只变一点——用来判相似（查重论文、判断网页是否重复）。\n<\/li><li>\n<strong>Diffie-Hellman / RSA<\/strong>：公钥加密——公钥谁都能拿到用来加密，私钥只有你有用来解密，解决了&quot;没见过面怎么安全通信&quot;的老问题。\n<\/ul>\n<h3>概念 5：线性规划（难度：高难）<\/h3>\n<p><strong>线性规划（linear programming）<\/strong>：在给定约束（布料几米、扣子几粒）下最大化某个指标（利润）。原书说&quot;所有图算法都能装进线性规划这个大框架&quot;，图问题只是它的子集。求解用 Simplex 算法。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">mindmap\n  root((算法世界地图))\n    数据结构\n      二叉查找树/红黑树/B树/堆\n    搜索\n      反向索引 搜索引擎\n    信号\n      傅里叶变换 MP3/JPG\n    大数据\n      并行算法/MapReduce/Hadoop\n    概率结构\n      布隆过滤器/HyperLogLog\n    安全\n      SHA/Simhash/Diffie-Hellman/RSA\n    最优化\n      线性规划 Simplex<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：本书 11 章是地图上的&quot;主城区&quot;（查找、排序、递归、图、动态规划、KNN）；这 10 个主题是向外辐射的卫星城。按兴趣选一个方向深入即可。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：本书像驾校——教会你开车的基本功；本章像地图，告诉你高速公路网通往哪些城市。先学会上路，再挑目的地。\n<\/li><li>\n<strong>实例（可复核）<\/strong>：你上传一张 4GB 电影到云端，朋友也有这文件——不用传整个文件，各算 SHA 散列值对比，相等就是同一文件。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;SHA 就是散列表用的散列函数&quot;<\/strong>——实际上散列表散列函数输出数组下标；SHA 输出另一个短字符串，用于比对和密码安全，目的完全不同。\n<\/li><li>\n<strong>别以为&quot;布隆过滤器答案 100% 可靠&quot;<\/strong>——实际上它可能错报（说在但不在），绝不会漏报；适合&quot;可能恶意请小心&quot;这类容忍误报的场景。\n<\/li><li>\n<strong>别以为&quot;二叉查找树总是 O(log n)&quot;<\/strong>——实际上不平衡时是 O(n)，这才需要红黑树这类平衡变种。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n（单选）判断&quot;这个网页我抓过没有&quot;，且容忍偶发错报、要求极省内存，该用？A. 散列表　B. 布隆过滤器　C. 数组　D. 快速排序\n<\/li><li>\n（单选）数据库存密码，正确做法是？A. 明文存　B. 存密码的 SHA 散列值　C. 用 Base64 编码　D. 存逆向加密的密码\n<\/li><li>\n（填空）MapReduce 的两个核心函数是 ____ 和 ____。\n<\/li><li>\n（简答）反向索引是什么？为什么搜索引擎需要它？\n<p>（答案：B；解析：布隆过滤器可能错报但绝不漏报，空间极小。） （答案：B；解析：SHA 单向，泄露散列值也反推不出原密码。） （答案：map（映射，逐元素同样处理）；reduce（归并，数组压成一个值）；解析：分布式并行的基石。） （答案：一张&quot;单词 → 包含该单词的网页列表&quot;的散列表；用户搜某个词时直接查表拿到候选页面，而不是每次翻遍所有网页。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n二叉查找树：平均 O(log n)，不平衡退化 O(n)；数据库用 B 树。\n<\/li><li>\n概率结构：布隆过滤器（不漏报、可能错报）、HyperLogLog（近似计数）。\n<\/li><li>\n安全：SHA 单向散列存密码；Simhash 判相似；Diffie-Hellman/RSA 公钥加密。\n<\/li><li>\n终点大地图：线性规划 = 图算法的超集框架。\n<\/ul>", "kind": "chapter", "title": "第 11 章：接下来如何做"}, "c01": {"html": "<h1>大O表示法<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 1、2、4 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p><strong>大O表示法是描述&quot;当输入规模 n 变大时，算法操作数涨得多快&quot;的记号，它看最糟情况、忽略常数。<\/strong><\/p>\n<h2>为什么重要<\/h2>\n<p>全书所有算法比较都靠它：没有大O，你只能说&quot;二分查找 7 毫秒、简单查找 100 毫秒&quot;——这是 n=100 时的快照；n=10 亿时结论反转成 11 天 vs 30 毫秒。大O让你预测未来。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph LR\n    n[&quot;输入规模 n&quot;] --&gt; op[&quot;操作数增速&quot;]\n    op --&gt; L1[&quot;O(log n) 几乎平&quot;]\n    op --&gt; L2[&quot;O(n) 直线&quot;]\n    op --&gt; L3[&quot;O(n log n) 缓升&quot;]\n    op --&gt; L4[&quot;O(n²) 抛物线&quot;]\n    op --&gt; L5[&quot;O(n!) 爆炸&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：五条曲线在 n 小时差别不大，n 一大就天壤之别。选算法就是选曲线的形状。<\/p>\n<h2>详解<\/h2>\n<ul><li>\n<strong>不是秒数<\/strong>：O(n) = &quot;操作数和 n 成正比&quot;，每步 1 毫秒还是 1 秒是常数，大O不关心。\n<\/li><li>\n<strong>是最糟情况<\/strong>：简单查找一次翻中目标是 O(1) 运气，但大O写 O(n)——它给的是&quot;保证不会更差&quot;的上限。\n<\/li><li>\n<strong>忽略常数<\/strong>：O(2n)、O(n/2)、O(n+26) 全简写为 O(n)。第 4 章补刀：大O相同时常数才有意义（快排 vs 合并排序）。\n<\/ul>\n<p><strong>常见档位（从快到慢）<\/strong>：O(log n) &lt; O(n) &lt; O(n log n) &lt; O(n²) &lt; O(n!)。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;n 越大 O(1) 和 O(n) 差距不变&quot;——实际上差距随 n 线性放大。\n<\/li><li>\n别以为&quot;最糟情况没意义&quot;——它是给你的承诺：算法永远不会更慢。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第1章<\/td><td>二分查找 vs 简单查找<\/td><td>O(log n) vs O(n)，n=10 亿时差 3300 万倍<\/td><\/tr><tr><td>第2章<\/td><td>选择排序<\/td><td>找 n 次 × 每次 O(n) = O(n²)，常数 1/2 被省略<\/td><\/tr><tr><td>第4章<\/td><td>快排平均/最糟<\/td><td>平均 O(n log n)，最糟 O(n²)；快排常数比合并排序小<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：无（第 1 章引入）\n<\/li><li>\n后续：递归与调用栈（理解快排栈高为何是 O(log n)）\n<\/ul>", "kind": "concept", "title": "大O表示法"}, "c02": {"html": "<h1>递归与调用栈<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 3、4 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p><strong>递归是函数调用自身；基线条件负责刹车，调用栈（一摞后进先出的便条纸）负责记住每个暂停在半路的函数。<\/strong><\/p>\n<h2>为什么重要<\/h2>\n<p>全书第二个里程碑：第 4 章的快速排序、分而治之，全建立在递归上。理解调用栈，你才能解释&quot;为什么栈高是 O(log n) 而不是 O(n)&quot;。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[&quot;fact(3) 压栈&quot;] --&gt; B[&quot;fact(2) 压栈&quot;]\n    B --&gt; C[&quot;fact(1)=1 命中基线&quot;]\n    C --&gt; D[&quot;弹栈: fact(2)=2×1=2&quot;]\n    D --&gt; E[&quot;弹栈: fact(3)=3×2=6&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：向下递归 = 栈增厚；基线条件触发 = 从最里层往回结算，每个暂停的函数从断点继续。<\/p>\n<h2>详解<\/h2>\n<ul><li>\n<strong>两半缺一不可<\/strong>：递归条件（调自己）+ 基线条件（不再调）。没有基线 = 无限递归 = 栈溢出。\n<\/li><li>\n<strong>每层独立<\/strong>：fact(3) 的 x 和 fact(2) 的 x 是不同变量，互不干扰。\n<\/li><li>\n<strong>代价<\/strong>：每次压栈都占内存。递归太深 → 栈溢出崩溃；解法是改写循环或尾递归。\n<\/li><li>\n<strong>D&amp;C 心法<\/strong>：找最简单到不用干的基线条件（数组题通常是空/单元素数组），再想每次怎么把问题缩小一圈。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为递归&quot;性能更好&quot;——它的价值是思路清晰，内存开销反而更大。\n<\/li><li>\n别以为&quot;递归层数和栈高是一回事&quot;——快排平分时栈高 O(log n)，因为每层同时处理左右两个子问题，串行调用的总次数是 O(n) 但栈的<strong>深度<\/strong>只有 O(log n)。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第3章<\/td><td>factorial/countdown<\/td><td>基线+递归两条件；调用栈压入弹出<\/td><\/tr><tr><td>第4章<\/td><td>快排与 D&amp;C<\/td><td>基线为空/单元素数组；栈高决定平均 O(n log n) vs 最糟 O(n²)<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：大O表示法\n<\/li><li>\n后续：动态规划（递归的另一种落地——自底向上填表）\n<\/ul>", "kind": "concept", "title": "递归与调用栈"}, "c03": {"html": "<h1>数组与链表<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 2 章（第 5、6 章反复用）\n<\/ul>\n<h2>一句话定义<\/h2>\n<p><strong>数组 = 元素紧挨存放、靠编号直接定位（读取 O(1)、插删 O(n)）；链表 = 元素散落、靠&quot;下一个的地址&quot;串联（插删 O(1)、顺序读 O(n)）。<\/strong><\/p>\n<h2>为什么重要<\/h2>\n<p>它们是全书所有高级数据结构的地基：散列表用数组存储 + 链拉链；图用散列表表示邻接；队列/栈是受限的链表。选错地基，上层算法全错。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph LR\n    subgraph 数组\n      a0[&quot;#0&quot;] --- a1[&quot;#1&quot;] --- a2[&quot;#2&quot;] --- a3[&quot;#3&quot;]\n    end\n    subgraph 链表\n      n1[&quot;元素→地址92&quot;] --&gt; n2[&quot;元素→地址11&quot;] --&gt; n3[&quot;元素→地址55&quot;]\n    end<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：数组一行连坐，知道编号就能跳；链表是寻宝纸条，只能从头顺着摸。<\/p>\n<h2>详解<\/h2>\n<table><thead><tr><th>操作<\/th><th>数组<\/th><th>链表<\/th><\/tr><\/thead><tbody><tr><td>随机读取<\/td><td>O(1)<\/td><td>O(n)<\/td><\/tr><tr><td>开头/结尾插入<\/td><td>O(n)<\/td><td>O(1)<\/td><\/tr><tr><td>删除（已站在旁边）<\/td><td>O(n)<\/td><td>O(1)<\/td><\/tr><\/tbody><\/table>\n<ul><li>\n索引从 0 开始；第 2 个元素在索引 1。\n<\/li><li>\n数组中间插入要整体后移，可能还要整块搬家（预留座位是权宜之计）。\n<\/li><li>\n真实系统常混合：原书 Facebook 例子 = 26 个桶各挂一条链表；第 5 章的散列表也是数组+链表拉链。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;链表更快&quot;——它只在插删场景快；要随机访问（二分查找）必须数组。\n<\/li><li>\n别以为&quot;删除链表元素一定 O(1)&quot;——前提是你已经找到那个元素；光&quot;找&quot;这步可能就是 O(n)。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第2章<\/td><td>选择排序/记账/队列<\/td><td>读取多选数组，插删多选链表<\/td><\/tr><tr><td>第5章<\/td><td>散列表冲突拉链<\/td><td>数组位置挂链表，越长越慢<\/td><\/tr><tr><td>第6章<\/td><td>BFS 队列<\/td><td>deque 实现，队首出队尾进<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：无\n<\/li><li>\n后续：散列表（数组 + 散列函数）\n<\/ul>", "kind": "concept", "title": "数组与链表"}, "c04": {"html": "<h1>散列表<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 5、6 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p><strong>散列表 = 散列函数 + 数组：散列函数把&quot;键&quot;算成数组下标，于是查找/插入/删除平均都 O(1)。<\/strong><\/p>\n<h2>为什么重要<\/h2>\n<p>全书最有用的数据结构：电话簿、投票查重、网页缓存、图的邻接表示、BFS 队列里的搜索表——全是散列表。Python 的 dict 就是它。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph LR\n    key[&quot;键: 商品名&quot;] --&gt; hash[&quot;散列函数&quot;]\n    hash --&gt; idx[&quot;下标 4&quot;]\n    idx --&gt; arr[&quot;数组[4] = 价格&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：没有&quot;查找&quot;这一步——散列函数直接告诉你答案在哪。<\/p>\n<h2>详解<\/h2>\n<ul><li>\n散列函数两要求：一致性（同输入同输出）、均匀性（不同输入尽量不同位置）。\n<\/li><li>\n<strong>冲突<\/strong>：两键撞到一起 → 该位置挂链表；散列函数烂就退化成 O(n)。\n<\/li><li>\n<strong>填装因子<\/strong> = 已占用位置 ÷ 总位置；&gt; 0.7 就扩容（数组翻倍 + 重散列）。\n<\/li><li>\n性能：平均 O(1)，最糟 O(n)（全撞车）。\n<\/ul>\n<p><strong>三大用途<\/strong>：模拟映射（姓名→号码）、防重复（投票名单）、缓存（URL→页面数据）。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;散列表查找不用比较&quot;——它比较的是散列值是否一致，这就是它快的原因。\n<\/li><li>\n别以为&quot;冲突是 bug&quot;——冲突必然发生，好的散列函数只是把它摊薄。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第5章<\/td><td>杂货铺价格本<\/td><td>O(1) 查询；填装因子 &gt;0.7 扩容<\/td><\/tr><tr><td>第6章<\/td><td>图的邻接表示<\/td><td>graph[&quot;you&quot;] = [&quot;alice&quot;,&quot;bob&quot;,&quot;claire&quot;]<\/td><\/tr><tr><td>第7章<\/td><td>狄克斯特拉 costs/parents<\/td><td>三个散列表存图与开销<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：数组与链表\n<\/li><li>\n后续：图与最短路径\n<\/ul>", "kind": "concept", "title": "散列表"}, "c05": {"html": "<h1>图与最短路径<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 6、7 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p><strong>图 = 节点 + 边；&quot;最短路径&quot;有两种口径——非加权图用 BFS 找段数最少，加权图用狄克斯特拉找总权重最小。<\/strong><\/p>\n<h2>为什么重要<\/h2>\n<p>原书说图算法是最有用的一类：人际网络、地图导航、任务依赖、网页链接结构，全都是图。选 BFS 还是狄克斯特拉，取决于&quot;每段路有没有权重&quot;。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph TD\n    Q[&quot;要找 A 到 B 的最短路径&quot;] --&gt; W{&quot;边有权重吗?&quot;}\n    W --&gt;|没有, 只数段数| BFS[&quot;BFS: 队列逐层扩展&lt;br/&gt;O(V+E)&quot;]\n    W --&gt;|有, 要总权重最小| DK{&quot;有负权边吗?&quot;}\n    DK --&gt;|没有| DJ[&quot;狄克斯特拉&lt;br/&gt;每步选最便宜节点&quot;]\n    DK --&gt;|有| BF[&quot;贝尔曼-福德&lt;br/&gt;(本书不展开)&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：这是原书第 6、7 章合起来的决策树；选错算法（如在加权图上用 BFS）会得到&quot;段数最少但不是最快&quot;的路径。<\/p>\n<h2>详解<\/h2>\n<ul><li>\n有向图（箭头单向）/ 无向图（双向，本质是环）/ 树（无回边的特殊图）。\n<\/li><li>\nBFS 标配：队列（FIFO）+ 已检查名单（防重复防无限循环）。\n<\/li><li>\n狄克斯特拉四步：选最便宜节点 → 更新邻居开销 → 重复 → 父节点回溯。\n<\/li><li>\n负权边 = 狄克斯特拉红线。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;最短路径就是路程最短&quot;——它可能是换乘最少、费用最少，取决于你给边赋什么权重。\n<\/li><li>\n别以为&quot;狄克斯特拉能处理负权边&quot;——负权会破坏&quot;已处理节点不可能更便宜&quot;的假设。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第6章<\/td><td>芒果销售商/公交换乘<\/td><td>BFS 找一度→二度→三度关系<\/td><\/tr><tr><td>第7章<\/td><td>换钢琴/导航<\/td><td>加权图用狄克斯特拉，负权换贝尔曼-福德<\/td><\/tr><tr><td>第8章<\/td><td>旅行商<\/td><td>途经所有点的最短路径 = NP 完全<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：散列表（表示图）、队列\n<\/li><li>\n后续：贪婪策略与 NP 完全（旅行商是图问题的 NP 完全变体）\n<\/ul>", "kind": "concept", "title": "图与最短路径"}, "c06": {"html": "<h1>贪婪策略与 NP 完全<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 8 章（呼应第 1 章旅行商）\n<\/ul>\n<h2>一句话定义<\/h2>\n<p><strong>贪婪 = 每步选眼前最优；NP 完全问题 = 精确解要试遍所有组合（2ⁿ 或 n!）的问题，实战中放弃精确解、用贪婪近似凑合。<\/strong><\/p>\n<h2>为什么重要<\/h2>\n<p>这是原书的&quot;避坑指南&quot;：很多新手在 NP 完全问题上死磕最优解，浪费数周。学会一眼认出这类问题，立刻切换到近似算法，是算法工程师的核心判断力。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph TD\n    P[&quot;遇到难题&quot;] --&gt; S{&quot;n 一大就慢到爆炸?&quot;}\n    S --&gt;|否| OK[&quot;用精确算法&quot;]\n    S --&gt;|是| C{&quot;涉及所有组合/排列?&quot;}\n    C --&gt;|是| NP[&quot;NP 完全&quot;]\n    NP --&gt; G[&quot;贪婪近似: 快+简单+接近最优&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：原书识别 NP 完全的蛛丝马迹——组合爆炸、序列、集合、无法拆成独立子问题。<\/p>\n<h2>详解<\/h2>\n<ul><li>\n贪婪何时精确最优：教室调度（每次选结束最早）。\n<\/li><li>\n贪婪何时只是近似：背包（先偷最贵音响 $3000，输给 $3500 组合）。\n<\/li><li>\n集合覆盖：精确解 O(2ⁿ)；贪婪近似 O(n²)。\n<\/li><li>\n旅行商：路线数 n!；10 城就 360 万条。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;贪婪算法=偷懒&quot;——对某些问题它就是最优解。\n<\/li><li>\n别以为&quot;NP 完全是因为算力不够，升级电脑就能解&quot;——2ⁿ 比任何硬件升级都快。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第1章<\/td><td>旅行商 5 城 120 条路<\/td><td>O(n!) 引入<\/td><\/tr><tr><td>第8章<\/td><td>集合覆盖/背包<\/td><td>贪婪近似 + NP 完全识别清单<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：大O表示法\n<\/li><li>\n后续：动态规划（与贪婪互补——能拆成独立子问题就 DP，不能就贪婪近似）\n<\/ul>", "kind": "concept", "title": "贪婪策略与NP完全"}, "c07": {"html": "<h1>动态规划<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 9 章（承接第 8 章背包问题）\n<\/ul>\n<h2>一句话定义<\/h2>\n<p><strong>动态规划 = 把大问题拆成网格状的小问题，每个格子存&quot;这个子问题的最优解&quot;，填完网格大问题自然现形。<\/strong><\/p>\n<h2>为什么重要<\/h2>\n<p>它和贪婪是处理同一类&quot;约束下求最优&quot;问题的两种武器：子问题能独立拆分时用 DP 拿精确最优（背包 $3500）；子问题互相依赖或要求快时用贪婪拿近似。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph TD\n    P[&quot;原问题: 4磅背包&quot;] --&gt; S[&quot;子问题: 1/2/3磅背包&quot;]\n    S --&gt; G[&quot;网格逐行逐列填最大值&quot;]\n    G --&gt; A[&quot;最后一格 = 全局最优&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：关键不是&quot;递归&quot;，而是&quot;把所有子问题答案存进格子，避免重复算&quot;。<\/p>\n<h2>详解<\/h2>\n<ul><li>\n每格公式：max（不拿当前商品的旧值 / 拿当前商品 + 剩余容量格子的最优值）。\n<\/li><li>\n两个变种公式：\n<ul>\n<li>\n最长公共子串：字母相同 = 左上+1；不同 = 0。\n<\/li><li>\n最长公共子序列：字母相同 = 左上+1；不同 = max（上, 左）。\n<\/li><li>\n适用边界：子问题离散独立；不能偷散装；粒度要对（0.5 磅商品需要更细的列）。\n<\/li><li>\n答案位置：背包在右下角；子串/子序列在网格最大值处。\n<\/ul>\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;动态规划=递归&quot;——它是自底向上填表，和递归方向相反。\n<\/li><li>\n别以为&quot;加新商品要整张表重算&quot;——只需加一行。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第8章<\/td><td>背包贪婪失败<\/td><td>引出&quot;想要精确最优怎么办&quot;<\/td><\/tr><tr><td>第9章<\/td><td>背包网格/公共子串/子序列<\/td><td>网格+递推公式；DNA/git diff 应用<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：贪婪策略与 NP 完全\n<\/li><li>\n后续：无（本书终点；进阶可碰线性规划）\n<\/ul>", "kind": "concept", "title": "动态规划"}, "__path__": {"html": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：二分查找与大O：建立速度直觉<\/strong><br>阅读：<a href=\"#/chapter/ch01\">第 1 章：算法简介<\/a><br>检查点：通过 ch01 自测题（≥80%）<\/li><li class='path-step' id='path-02'><strong>步骤 02：数组、链表与选择排序<\/strong><br>阅读：<a href=\"#/chapter/ch02\">第 2 章：选择排序<\/a><br>检查点：通过 ch02 自测题<\/li><li class='path-step' id='path-03'><strong>步骤 03：递归与调用栈<\/strong><br>阅读：<a href=\"#/chapter/ch03\">第 3 章：递归<\/a><br>检查点：通过 ch03 自测题<\/li><li class='path-step' id='path-04'><strong>步骤 04：分而治之与快速排序<\/strong><br>阅读：<a href=\"#/chapter/ch04\">第 4 章：快速排序<\/a><br>检查点：通过 ch04 自测题<\/li><li class='path-step' id='path-05'><strong>步骤 05：散列表：O(1) 的魔法<\/strong><br>阅读：<a href=\"#/chapter/ch05\">第 5 章：散列表<\/a><br>检查点：通过 ch05 自测题<\/li><li class='path-step' id='path-06'><strong>步骤 06：图与广度优先搜索<\/strong><br>阅读：<a href=\"#/chapter/ch06\">第 6 章：广度优先搜索<\/a><br>检查点：通过 ch06 自测题<\/li><li class='path-step' id='path-07'><strong>步骤 07：狄克斯特拉算法<\/strong><br>阅读：<a href=\"#/chapter/ch07\">第 7 章：狄克斯特拉算法<\/a><br>检查点：通过 ch07 自测题<\/li><li class='path-step' id='path-08'><strong>步骤 08：贪婪算法与 NP 完全<\/strong><br>阅读：<a href=\"#/chapter/ch08\">第 8 章：贪婪算法<\/a><br>检查点：通过 ch08 自测题<\/li><li class='path-step' id='path-09'><strong>步骤 09：动态规划<\/strong><br>阅读：<a href=\"#/chapter/ch09\">第 9 章：动态规划<\/a><br>检查点：通过 ch09 自测题<\/li><li class='path-step' id='path-10'><strong>步骤 10：K 最近邻与机器学习入门<\/strong><br>阅读：<a href=\"#/chapter/ch10\">第 10 章：K 最近邻算法<\/a><br>检查点：通过 ch10 自测题<\/li><li class='path-step' id='path-11'><strong>步骤 11：算法世界地图<\/strong><br>阅读：<a href=\"#/chapter/ch11\">第 11 章：接下来如何做<\/a><br>检查点：完成 quiz.md 最终检验项目<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "kind": "path", "title": "学习路径"}, "__quiz_all__": {"html": "<p>（无综合题）<\/p>", "kind": "quiz", "title": "综合测验"}, "__quiz_ch01__": {"html": "<h1>测验：第 1 章：算法简介<\/h1><div class='quiz-item' data-qid='q01' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 含 256 个元素的有序列表，二分查找最多查几次？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q01' value='0'> 256<\/label><label class='quiz-opt'><input type='radio' name='q01' value='1'> 8<\/label><label class='quiz-opt'><input type='radio' name='q01' value='2'> 16<\/label><label class='quiz-opt'><input type='radio' name='q01' value='3'> 128<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q02' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 在无序列表里按电话号码反查某人，运行时间是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q02' value='0'> O(log n)<\/label><label class='quiz-opt'><input type='radio' name='q02' value='1'> O(n)<\/label><label class='quiz-opt'><input type='radio' name='q02' value='2'> O(n²)<\/label><label class='quiz-opt'><input type='radio' name='q02' value='3'> O(1)<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q03' data-type='blank'><p class='quiz-q'><b>Q3.<\/b> 旅行商问题要试遍所有排列，运行时间为 O(____)。<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch02__": {"html": "<h1>测验：第 2 章：选择排序<\/h1><div class='quiz-item' data-qid='q04' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 在
