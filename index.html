rong>：第 6、7 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p><strong>图 = 节点 + 边；&quot;最短路径&quot;有两种口径——非加权图用 BFS 找段数最少，加权图用狄克斯特拉找总权重最小。<\/strong><\/p>\n<h2>为什么重要<\/h2>\n<p>原书说图算法是最有用的一类：人际网络、地图导航、任务依赖、网页链接结构，全都是图。选 BFS 还是狄克斯特拉，取决于&quot;每段路有没有权重&quot;。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph TD\n    Q[&quot;要找 A 到 B 的最短路径&quot;] --&gt; W{&quot;边有权重吗?&quot;}\n    W --&gt;|没有, 只数段数| BFS[&quot;BFS: 队列逐层扩展&lt;br/&gt;O(V+E)&quot;]\n    W --&gt;|有, 要总权重最小| DK{&quot;有负权边吗?&quot;}\n    DK --&gt;|没有| DJ[&quot;狄克斯特拉&lt;br/&gt;每步选最便宜节点&quot;]\n    DK --&gt;|有| BF[&quot;贝尔曼-福德&lt;br/&gt;(本书不展开)&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：这是原书第 6、7 章合起来的决策树；选错算法（如在加权图上用 BFS）会得到&quot;段数最少但不是最快&quot;的路径。<\/p>\n<h2>详解<\/h2>\n<ul><li>\n有向图（箭头单向）/ 无向图（双向，本质是环）/ 树（无回边的特殊图）。\n<\/li><li>\nBFS 标配：队列（FIFO）+ 已检查名单（防重复防无限循环）。\n<\/li><li>\n狄克斯特拉四步：选最便宜节点 → 更新邻居开销 → 重复 → 父节点回溯。\n<\/li><li>\n负权边 = 狄克斯特拉红线。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;最短路径就是路程最短&quot;——它可能是换乘最少、费用最少，取决于你给边赋什么权重。\n<\/li><li>\n别以为&quot;狄克斯特拉能处理负权边&quot;——负权会破坏&quot;已处理节点不可能更便宜&quot;的假设。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第6章<\/td><td>芒果销售商/公交换乘<\/td><td>BFS 找一度→二度→三度关系<\/td><\/tr><tr><td>第7章<\/td><td>换钢琴/导航<\/td><td>加权图用狄克斯特拉，负权换贝尔曼-福德<\/td><\/tr><tr><td>第8章<\/td><td>旅行商<\/td><td>途经所有点的最短路径 = NP 完全<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：散列表（表示图）、队列\n<\/li><li>\n后续：贪婪策略与 NP 完全（旅行商是图问题的 NP 完全变体）\n<\/ul>", "c06": "<h1>贪婪策略与 NP 完全<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 8 章（呼应第 1 章旅行商）\n<\/ul>\n<h2>一句话定义<\/h2>\n<p><strong>贪婪 = 每步选眼前最优；NP 完全问题 = 精确解要试遍所有组合（2ⁿ 或 n!）的问题，实战中放弃精确解、用贪婪近似凑合。<\/strong><\/p>\n<h2>为什么重要<\/h2>\n<p>这是原书的&quot;避坑指南&quot;：很多新手在 NP 完全问题上死磕最优解，浪费数周。学会一眼认出这类问题，立刻切换到近似算法，是算法工程师的核心判断力。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph TD\n    P[&quot;遇到难题&quot;] --&gt; S{&quot;n 一大就慢到爆炸?&quot;}\n    S --&gt;|否| OK[&quot;用精确算法&quot;]\n    S --&gt;|是| C{&quot;涉及所有组合/排列?&quot;}\n    C --&gt;|是| NP[&quot;NP 完全&quot;]\n    NP --&gt; G[&quot;贪婪近似: 快+简单+接近最优&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：原书识别 NP 完全的蛛丝马迹——组合爆炸、序列、集合、无法拆成独立子问题。<\/p>\n<h2>详解<\/h2>\n<ul><li>\n贪婪何时精确最优：教室调度（每次选结束最早）。\n<\/li><li>\n贪婪何时只是近似：背包（先偷最贵音响 $3000，输给 $3500 组合）。\n<\/li><li>\n集合覆盖：精确解 O(2ⁿ)；贪婪近似 O(n²)。\n<\/li><li>\n旅行商：路线数 n!；10 城就 360 万条。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;贪婪算法=偷懒&quot;——对某些问题它就是最优解。\n<\/li><li>\n别以为&quot;NP 完全是因为算力不够，升级电脑就能解&quot;——2ⁿ 比任何硬件升级都快。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第1章<\/td><td>旅行商 5 城 120 条路<\/td><td>O(n!) 引入<\/td><\/tr><tr><td>第8章<\/td><td>集合覆盖/背包<\/td><td>贪婪近似 + NP 完全识别清单<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：大O表示法\n<\/li><li>\n后续：动态规划（与贪婪互补——能拆成独立子问题就 DP，不能就贪婪近似）\n<\/ul>", "c07": "<h1>动态规划<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 9 章（承接第 8 章背包问题）\n<\/ul>\n<h2>一句话定义<\/h2>\n<p><strong>动态规划 = 把大问题拆成网格状的小问题，每个格子存&quot;这个子问题的最优解&quot;，填完网格大问题自然现形。<\/strong><\/p>\n<h2>为什么重要<\/h2>\n<p>它和贪婪是处理同一类&quot;约束下求最优&quot;问题的两种武器：子问题能独立拆分时用 DP 拿精确最优（背包 $3500）；子问题互相依赖或要求快时用贪婪拿近似。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph TD\n    P[&quot;原问题: 4磅背包&quot;] --&gt; S[&quot;子问题: 1/2/3磅背包&quot;]\n    S --&gt; G[&quot;网格逐行逐列填最大值&quot;]\n    G --&gt; A[&quot;最后一格 = 全局最优&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：关键不是&quot;递归&quot;，而是&quot;把所有子问题答案存进格子，避免重复算&quot;。<\/p>\n<h2>详解<\/h2>\n<ul><li>\n每格公式：max（不拿当前商品的旧值 / 拿当前商品 + 剩余容量格子的最优值）。\n<\/li><li>\n两个变种公式：\n<ul>\n<li>\n最长公共子串：字母相同 = 左上+1；不同 = 0。\n<\/li><li>\n最长公共子序列：字母相同 = 左上+1；不同 = max（上, 左）。\n<\/li><li>\n适用边界：子问题离散独立；不能偷散装；粒度要对（0.5 磅商品需要更细的列）。\n<\/li><li>\n答案位置：背包在右下角；子串/子序列在网格最大值处。\n<\/ul>\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;动态规划=递归&quot;——它是自底向上填表，和递归方向相反。\n<\/li><li>\n别以为&quot;加新商品要整张表重算&quot;——只需加一行。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第8章<\/td><td>背包贪婪失败<\/td><td>引出&quot;想要精确最优怎么办&quot;<\/td><\/tr><tr><td>第9章<\/td><td>背包网格/公共子串/子序列<\/td><td>网格+递推公式；DNA/git diff 应用<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：贪婪策略与 NP 完全\n<\/li><li>\n后续：无（本书终点；进阶可碰线性规划）\n<\/ul>", "__path__": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：二分查找与大O：建立速度直觉<\/strong><br>阅读：<a href=\"#/book/tujie/chapter/ch01\">第 1 章：算法简介<\/a><br>检查点：通过 ch01 自测题（≥80%）<\/li><li class='path-step' id='path-02'><strong>步骤 02：数组、链表与选择排序<\/strong><br>阅读：<a href=\"#/book/tujie/chapter/ch02\">第 2 章：选择排序<\/a><br>检查点：通过 ch02 自测题<\/li><li class='path-step' id='path-03'><strong>步骤 03：递归与调用栈<\/strong><br>阅读：<a href=\"#/book/tujie/chapter/ch03\">第 3 章：递归<\/a><br>检查点：通过 ch03 自测题<\/li><li class='path-step' id='path-04'><strong>步骤 04：分而治之与快速排序<\/strong><br>阅读：<a href=\"#/book/tujie/chapter/ch04\">第 4 章：快速排序<\/a><br>检查点：通过 ch04 自测题<\/li><li class='path-step' id='path-05'><strong>步骤 05：散列表：O(1) 的魔法<\/strong><br>阅读：<a href=\"#/book/tujie/chapter/ch05\">第 5 章：散列表<\/a><br>检查点：通过 ch05 自测题<\/li><li class='path-step' id='path-06'><strong>步骤 06：图与广度优先搜索<\/strong><br>阅读：<a href=\"#/book/tujie/chapter/ch06\">第 6 章：广度优先搜索<\/a><br>检查点：通过 ch06 自测题<\/li><li class='path-step' id='path-07'><strong>步骤 07：狄克斯特拉算法<\/strong><br>阅读：<a href=\"#/book/tujie/chapter/ch07\">第 7 章：狄克斯特拉算法<\/a><br>检查点：通过 ch07 自测题<\/li><li class='path-step' id='path-08'><strong>步骤 08：贪婪算法与 NP 完全<\/strong><br>阅读：<a href=\"#/book/tujie/chapter/ch08\">第 8 章：贪婪算法<\/a><br>检查点：通过 ch08 自测题<\/li><li class='path-step' id='path-09'><strong>步骤 09：动态规划<\/strong><br>阅读：<a href=\"#/book/tujie/chapter/ch09\">第 9 章：动态规划<\/a><br>检查点：通过 ch09 自测题<\/li><li class='path-step' id='path-10'><strong>步骤 10：K 最近邻与机器学习入门<\/strong><br>阅读：<a href=\"#/book/tujie/chapter/ch10\">第 10 章：K 最近邻算法<\/a><br>检查点：通过 ch10 自测题<\/li><li class='path-step' id='path-11'><strong>步骤 11：算法世界地图<\/strong><br>阅读：<a href=\"#/book/tujie/chapter/ch11\">第 11 章：接下来如何做<\/a><br>检查点：完成 quiz.md 最终检验项目<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "__quiz_all__": "<h1>全部测验<\/h1><p>下方为全书各章测验，逐题作答、即时反馈并显示解析。<\/p><h2>测验：第 1 章：算法简介<\/h2><div class='quiz-item' data-qid='ch01-q01' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 含 256 个元素的有序列表，二分查找最多查几次？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q01' value='0'> 256<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='1'> 8<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='2'> 16<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='3'> 128<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch01-q02' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 在无序列表里按电话号码反查某人，运行时间是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q02' value='0'> O(log n)<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='1'> O(n)<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='2'> O(n²)<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='3'> O(1)<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch01-q03' data-type='blank'><p class='quiz-q'><b>Q3.<\/b> 旅行商问题要试遍所有排列，运行时间为 O(____)。<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p><h2>测验：第 2 章：选择排序<\/h2><div class='quiz-item' data-qid='ch02-q04' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 在链表中读取第 1000 个元素，最快多久？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch02-q04' value='0'> O(1)<\/label><label class='quiz-opt'><input type='radio' name='ch02-q04' value='1'> O(log n)<\/label><label class='quiz-opt'><input type='radio' name='ch02-q04' value='2'> O(n)<\/label><label class='quiz-opt'><input type='radio' name='ch02-q04' value='3'> O(n²)<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch02-q05' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 服务员队尾加菜、厨师队首取菜的点菜单队列用什么实现？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch02-q05' value='0'> 数组<\/label><label class='quiz-opt'><input type='radio' name='ch02-q05' value='1'> 链表<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch02-q06' data-type='blank'><p class='quiz-q'><b>Q3.<\/b> 对 n 个元素做选择排序，运行时间是 O(____)。<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p><h2>测验：第 3 章：递归<\/h2><div class='quiz-item' data-qid='ch03-q07' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 递归函数必须包含哪两部分？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch03-q07' value='0'> 循环与判断<\/label><label class='quiz-opt'><input type='radio' name='ch03-q07' value='1'> 基线条件与递归条件<\/label><label class='quiz-opt'><input type='radio' name='ch03-q07' value='2'> 压入与弹出<\/label><label class='quiz-opt'><input type='radio' name='ch03-q07' value='3'> 输入与输出<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch03-q08' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 栈的取出顺序是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch03-q08' value='0'> 先进先出<\/label><label class='quiz-opt'><input type='radio' name='ch03-q08' value='1'> 后进先出<\/label><label class='quiz-opt'><input type='radio' name='ch03-q08' value='2'> 随机<\/label><label class='quiz-opt'><input type='radio' name='ch03-q08' value='3'> 按大小排序<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch03-q09' data-type='blank'><p class='quiz-q'><b>Q3.<\/b> fact(4) = ____。<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p><h2>测验：第 4 章：快速排序<\/h2><div class='quiz-item' data-qid='ch04-q10' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 快速排序的平均运行时间是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch04-q10' value='0'> O(n)<\/label><label class='quiz-opt'><input type='radio' name='ch04-q10' value='1'> O(log n)<\/label><label class='quiz-opt'><input type='radio' name='ch04-q10' value='2'> O(n log n)<\/label><label class='quiz-opt'><input type='radio' name='ch04-q10' value='3'> O(n²)<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch04-q11' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 只把数组第一个元素乘 2，运行时间是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch04-q11' value='0'> O(1)<\/label><label class='quiz-opt'><input type='radio' name='ch04-q11' value='1'> O(n)<\/label><label class='quiz-opt'><input type='radio' name='ch04-q11' value='2'> O(n log n)<\/label><label class='quiz-opt'><input type='radio' name='ch04-q11' value='3'> O(n²)<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch04-q12' data-type='multi'><p class='quiz-q'><b>Q3.<\/b> 关于快速排序，下列说法正确的有？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='checkbox' name='ch04-q12' value='0'> 总拿首元素当基准值且输入已排序时会退化到 O(n²)<\/label><label class='quiz-opt'><input type='checkbox' name='ch04-q12' value='1'> 随机选基准值能让平均保持 O(n log n)<\/label><label class='quiz-opt'><input type='checkbox' name='ch04-q12' value='2'> 快排和合并排序大O相同，快排常数更小所以实战更快<\/label><label class='quiz-opt'><input type='checkbox' name='ch04-q12' value='3'> 快速排序永远是 O(n log n)<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p><h2>测验：第 5 章：散列表<\/h2><div class='quiz-item' data-qid='ch05-q13' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 平均情况下散列表查找一个键的时间是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch05-q13' value='0'> O(log n)<\/label><label class='quiz-opt'><input type='radio' name='ch05-q13' value='1'> O(n)<\/label><label class='quiz-opt'><input type='radio' name='ch05-q13' value='2'> O(1)<\/label><label class='quiz-opt'><input type='radio' name='ch05-q13' value='3'> O(n²)<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch05-q14' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 投票站要快速判断某人是否投过票，用什么？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch05-q14' value='0'> 数组<\/label><label class='quiz-opt'><input type='radio' name='ch05-q14' value='1'> 链表<\/label><label class='quiz-opt'><input type='radio' name='ch05-q14' value='2'> 散列表<\/label><label class='quiz-opt'><input type='radio' name='ch05-q14' value='3'> 栈<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch05-q15' data-type='blank'><p class='quiz-q'><b>Q3.<\/b> 填装因子超过 ____ 时该给散列表扩容。<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch05-q34' data-type='multi'><p class='quiz-q'><b>Q4.<\/b> 你要在 1000 万个用户名里频繁查找且经常有新用户注册。下列哪些是糟糕的选择？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='checkbox' name='ch05-q34' value='0'> 散列表<\/label><label class='quiz-opt'><input type='checkbox' name='ch05-q34' value='1'> 有序数组+插入后总重排<\/label><label class='quiz-opt'><input type='checkbox' name='ch05-q34' value='2'> 链表+简单查找<\/label><label class='quiz-opt'><input type='checkbox' name='ch05-q34' value='3'> 二叉查找树<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p><h2>测验：第 6 章：广度优先搜索<\/h2><div class='quiz-item' data-qid='ch06-q16' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 广度优先搜索使用什么数据结构？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch06-q16' value='0'> 栈<\/label><label class='quiz-opt'><input type='radio' name='ch06-q16' value='1'> 队列<\/label><label class='quiz-opt'><input type='radio' name='ch06-q16' value='2'> 散列表<\/label><label class='quiz-opt'><input type='radio' name='ch06-q16' value='3'> 数组<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch06-q17' data-type='single'><p class='quiz-q'><b>Q2.<\/b> BFS 的运行时间通常写作？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch06-q17' value='0'> O(n)<\/label><label class='quiz-opt'><input type='radio' name='ch06-q17' value='1'> O(n²)<\/label><label class='quiz-opt'><inp mary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch08__": "<h1>测验：第 8 章：贪婪算法<\/h1><div class='quiz-item' data-qid='ch08-q22' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 集合覆盖问题的精确解运行时间是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch08-q22' value='0'> O(n)<\/label><label class='quiz-opt'><input type='radio' name='ch08-q22' value='1'> O(n log n)<\/label><label class='quiz-opt'><input type='radio' name='ch08-q22' value='2'> O(2ⁿ)<\/label><label class='quiz-opt'><input type='radio' name='ch08-q22' value='3'> O(log n)<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch08-q23' data-type='single'><p class='quiz-q'><b>Q2.<\/b> A={1,2,3}, B={2,3,4}，A &amp; B = ?<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch08-q23' value='0'> {1,2,3,4}<\/label><label class='quiz-opt'><input type='radio' name='ch08-q23' value='1'> {2,3}<\/label><label class='quiz-opt'><input type='radio' name='ch08-q23' value='2'> {1,4}<\/label><label class='quiz-opt'><input type='radio' name='ch08-q23' value='3'> {1,2,3,2,3,4}<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch08-q24' data-type='multi'><p class='quiz-q'><b>Q3.<\/b> 下列哪些是 NP 完全问题的识别线索？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='checkbox' name='ch08-q24' value='0'> n 一大就慢到爆炸<\/label><label class='quiz-opt'><input type='checkbox' name='ch08-q24' value='1'> 涉及所有组合或排列<\/label><label class='quiz-opt'><input type='checkbox' name='ch08-q24' value='2'> 能拆成独立小问题<\/label><label class='quiz-opt'><input type='checkbox' name='ch08-q24' value='3'> 涉及序列或集合且难解<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch08-q36' data-type='multi'><p class='quiz-q'><b>Q4.<\/b> 下列哪些是 NP 完全问题？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='checkbox' name='ch08-q36' value='0'> A 点到 B 点的最短路线<\/label><label class='quiz-opt'><input type='checkbox' name='ch08-q36' value='1'> 经过指定 20 个点的最短路线（旅行商）<\/label><label class='quiz-opt'><input type='checkbox' name='ch08-q36' value='2'> 用最少广播台覆盖 50 个州（集合覆盖）<\/label><label class='quiz-opt'><input type='checkbox' name='ch08-q36' value='3'> 有序数组里查一个用户名<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch09__": "<h1>测验：第 9 章：动态规划<\/h1><div class='quiz-item' data-qid='ch09-q25' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 4 磅背包：吉他(1/$1500)、音响(4/$3000)、笔记本(3/$2000)，最优解是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch09-q25' value='0'> 音响 $3000<\/label><label class='quiz-opt'><input type='radio' name='ch09-q25' value='1'> 吉他+笔记本 $3500<\/label><label class='quiz-opt'><input type='radio' name='ch09-q25' value='2'> 吉他+音响 $4500<\/label><label class='quiz-opt'><input type='radio' name='ch09-q25' value='3'> 笔记本 $2000<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch09-q26' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 最长公共子串与最长公共子序列的公式区别在哪个分支？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch09-q26' value='0'> 字母相同<\/label><label class='quiz-opt'><input type='radio' name='ch09-q26' value='1'> 字母不同<\/label><label class='quiz-opt'><input type='radio' name='ch09-q26' value='2'> 初始化<\/label><label class='quiz-opt'><input type='radio' name='ch09-q26' value='3'> 无区别<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch09-q27' data-type='blank'><p class='quiz-q'><b>Q3.<\/b> 动态规划每种解法都涉及一张____。<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch10__": "<h1>测验：第 10 章：K 最近邻算法<\/h1><div class='quiz-item' data-qid='ch10-q28' data-type='single'><p class='quiz-q'><b>Q1.<\/b> KNN 做回归时输出什么？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch10-q28' value='0'> 投票多数的类别<\/label><label class='quiz-opt'><input type='radio' name='ch10-q28' value='1'> 最近 K 个邻居数值的平均值<\/label><label class='quiz-opt'><input type='radio' name='ch10-q28' value='2'> 距离公式<\/label><label class='quiz-opt'><input type='radio' name='ch10-q28' value='3'> 最大值<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch10-q29' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 原书经验法则：N 个用户时 K 取多少？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch10-q29' value='0'> 1<\/label><label class='quiz-opt'><input type='radio' name='ch10-q29' value='1'> √N<\/label><label class='quiz-opt'><input type='radio' name='ch10-q29' value='2'> N<\/label><label class='quiz-opt'><input type='radio' name='ch10-q29' value='3'> log N<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch10-q30' data-type='blank'><p class='quiz-q'><b>Q3.<\/b> 把物品变成一组可比较的数字，这个动作叫____。<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch11__": "<h1>测验：第 11 章：接下来如何做<\/h1><div class='quiz-item' data-qid='ch11-q31' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 判断网页是否抓过、容忍偶发错报、极省内存，用什么？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch11-q31' value='0'> 散列表<\/label><label class='quiz-opt'><input type='radio' name='ch11-q31' value='1'> 布隆过滤器<\/label><label class='quiz-opt'><input type='radio' name='ch11-q31' value='2'> 数组<\/label><label class='quiz-opt'><input type='radio' name='ch11-q31' value='3'> 快速排序<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch11-q32' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 数据库存密码的正确做法是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch11-q32' value='0'> 明文存<\/label><label class='quiz-opt'><input type='radio' name='ch11-q32' value='1'> 存密码的 SHA 散列值<\/label><label class='quiz-opt'><input type='radio' name='ch11-q32' value='2'> Base64 编码<\/label><label class='quiz-opt'><input type='radio' name='ch11-q32' value='3'> 逆向加密存储<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch11-q33' data-type='blank'><p class='quiz-q'><b>Q3.<\/b> MapReduce 的两个核心函数是 map 和 ____。<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__cards__": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "__glossary__": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='二分查找'>二分查找 — 只在有序列表上用，每次猜中间元素砍掉一半范围的查找法 <span class=glossary-ref>（第 1 章：算法简介）<\/span><\/li><li data-term='对数'>对数 — 幂运算的逆运算；log₂n 问几个 2 相乘等于 n <span class=glossary-ref>（第 1 章：算法简介）<\/span><\/li><li data-term='大o表示法'>大O表示法 — 描述算法操作数随 n 增速的记号，看最糟情况、忽略常数 <span class=glossary-ref>（第 1 章：算法简介）<\/span><\/li><li data-term='线性时间 o(n)'>线性时间 O(n) — 操作数与 n 成正比，如简单查找 <span class=glossary-ref>（第 1 章：算法简介）<\/span><\/li><li data-term='对数时间 o(log n)'>对数时间 O(log n) — 每翻倍数据量只多一步，如二分查找 <span class=glossary-ref>（第 1 章：算法简介）<\/span><\/li><li data-term='阶乘时间 o(n!)'>阶乘时间 O(n!) — 试遍所有排列，如旅行商蛮力解 <span class=glossary-ref>（第 1 章：算法简介）<\/span><\/li><li data-term='数组'>数组 — 元素紧挨存放、靠编号直接定位的数据结构 <span class=glossary-ref>（第 2 章：选择排序）<\/span><\/li><li data-term='链表'>链表 — 元素散落、每个元素存下一个地址的串联结构 <span class=glossary-ref>（第 2 章：选择排序）<\/span><\/li><li data-term='索引'>索引 — 数组元素的位置编号，从 0 开始 <span class=glossary-ref>（第 2 章：选择排序）<\/span><\/li><li data-term='随机访问'>随机访问 — 直接跳到任意位置（数组支持） <span class=glossary-ref>（第 2 章：选择排序）<\/span><\/li><li data-term='选择排序'>选择排序 — 反复找最小挪到新列表的排序，O(n²) <span class=glossary-ref>（第 2 章：选择排序）<\/span><\/li><li data-term='递归'>递归 — 调用自身的函数 <span class=glossary-ref>（第 3 章：递归）<\/span><\/li><li data-term='基线条件'>基线条件 — 递归中不再调用自己、直接返回的刹车 <span class=glossary-ref>（第 3 章：递归）<\/span><\/li><li data-term='栈'>栈 — 后进先出（LIFO）的数据结构 <span class=glossary-ref>（第 3 章：递归）<\/span><\/li><li data-term='调用栈'>调用栈 — 计算机用栈记住每个进行到一半的函数 <span class=glossary-ref>（第 3 章：递归）<\/span><\/li><li data-term='栈溢出'>栈溢出 — 递归太深调用栈占满内存导致崩溃 <span class=glossary-ref>（第 3 章：递归）<\/span><\/li><li data-term='分而治之 d&amp;c'>分而治之 D&amp;C — 找最简基线条件、每次递归缩小问题规模 <span class=glossary-ref>（第 4 章：快速排序）<\/span><\/li><li data-term='基准值 pivot'>基准值 pivot — 快速排序中被选为分数线的那个元素 <span class=glossary-ref>（第 4 章：快速排序）<\/span><\/li><li data-term='快速排序'>快速排序 — 选基准值分区后递归排序，平均 O(n log n) <span class=glossary-ref>（第 4 章：快速排序）<\/span><\/li><li data-term='散列函数'>散列函数 — 把任意输入映射为数字；要求一致且均匀 <span class=glossary-ref>（第 5 章：散列表）<\/span><\/li><li data-term='散列表'>散列表 — 散列函数 + 数组，查找/插入/删除平均 O(1) <span class=glossary-ref>（第 5 章：散列表）<\/span><\/li><li data-term='冲突'>冲突 — 两个不同的键被散列到同一数组位置 <span class=glossary-ref>（第 5 章：散列表）<\/span><\/li><li data-term='填装因子'>填装因子 — 已占用位置 ÷ 总位置；&gt;0.7 需扩容 <span class=glossary-ref>（第 5 章：散列表）<\/span><\/li><li data-term='图'>图 — 由节点和边组成的连接结构 <span class=glossary-ref>（第 6 章：广度优先搜索）<\/span><\/li><li data-term='节点'>节点 — 图中的一个点 <span class=glossary-ref>（第 6 章：广度优先搜索）<\/span><\/li><li data-term='边'>边 — 图中两节点之间的连线 <span class=glossary-ref>（第 6 章：广度优先搜索）<\/span><\/li><li data-term='队列'>队列 — 先进先出（FIFO）的数据结构 <span class=glossary-ref>（第 6 章：广度优先搜索）<\/span><\/li><li data-term='广度优先搜索 bfs'>广度优先搜索 BFS — 从起点按圈层向外扩展，找段数最短路径 <span class=glossary-ref>（第 6 章：广度优先搜索）<\/span><\/li><li data-term='拓扑排序'>拓扑排序 — 把依赖图排成被依赖者在前的有序列表 <span class=glossary-ref>（第 6 章：广度优先搜索）<\/span><\/li><li data-term='权重'>权重 — 边上的数字，表示距离/时间/费用 <span class=glossary-ref>（第 7 章：狄克斯特拉算法）<\/span><\/li><li data-term='加权图'>加权图 — 边带权重的图 <span class=glossary-ref>（第 7 章：狄克斯特拉算法）<\/span><\/li><li data-term='狄克斯特拉算法'>狄克斯特拉算法 — 加权图中找总权重最小路径的算法 <span class=glossary-ref>（第 7 章：狄克斯特拉算法）<\/span><\/li><li data-term='负权边'>负权边 — 权重为负的边；狄克斯特拉失效 <span class=glossary-ref>（第 7 章：狄克斯特拉算法）<\/span><\/li><li data-term='贪婪算法'>贪婪算法 — 每步选局部最优、拼全局的简单策略 <span class=glossary-ref>（第 8 章：贪婪算法）<\/span><\/li><li data-term='近似算法'>近似算法 — 精确解太慢时求接近最优的快速解 <span class=glossary-ref>（第 8 章：贪婪算法）<\/span><\/li><li data-term='集合覆盖问题'>集合覆盖问题 — 用最少集合覆盖所有元素的 NP 完全问题 <span class=glossary-ref>（第 8 章：贪婪算法）<\/span><\/li><li data-term='np完全问题'>NP完全问题 — 目前无快速解法、只能近似的难题 <span class=glossary-ref>（第 8 章：贪婪算法）<\/span><\/li><li data-term='动态规划'>动态规划 — 建网格逐格填子问题最优解的方法 <span class=glossary-ref>（第 9 章：动态规划）<\/span><\/li><li data-term='最长公共子串'>最长公共子串 — 两字符串中连续相同的最长片段 <span class=glossary-ref>（第 9 章：动态规划）<\/span><\/li><li data-term='最长公共子序列'>最长公共子序列 — 顺序相同、可跳着取的最长公共序列 <span class=glossary-ref>（第 9 章：动态规划）<\/span><\/li><li data-term='k最近邻 knn'>K最近邻 KNN — 找最近 K 个邻居做分类或回归的算法 <span class=glossary-ref>（第 10 章：K 最近邻算法）<\/span><\/li><li data-term='特征'>特征 — 把物品量化成的一组可比数字 <span class=glossary-ref>（第 10 章：K 最近邻算法）<\/span><\/li><li data-term='分类'>分类 — 把新样本编入已知类别（投票） <span class=glossary-ref>（第 10 章：K 最近邻算法）<\/span><\/li><li data-term='回归'>回归 — 预测一个数值（邻居数值平均） <span class=glossary-ref>（第 10 章：K 最近邻算法）<\/span><\/li><li data-term='二叉查找树'>二叉查找树 — 左小右大的树；查找平均 O(log n) <span class=glossary-ref>（第 11 章：接下来如何做）<\/span><\/li><li data-term='布隆过滤器'>布隆过滤器 — 概率型集合判断：可能错报、绝不漏报 <span class=glossary-ref>（第 11 章：接下来如何做）<\/span><\/li><li data-term='sha'>SHA — 单向安全散列算法，用于比对文件/存密码 <span class=glossary-ref>（第 11 章：接下来如何做）<\/span><\/li><\/ul>", "__patterns__": "<h1>模式与框架库<\/h1>\n<p>本书作者反复使用的思考框架、决策规则与反模式。<\/p>\n<h2>框架 1：算法选型决策树（作者全书骨架）<\/h2>\n<pre><code>拿到一个问题 →\n  是&quot;查找&quot;吗？\n    ├─ 数据有序？ → 二分查找 O(log n)\n    └─ 无序？ → 简单查找 O(n) 或先排序\n  是&quot;排序&quot;吗？\n    └─ 数据量大 → 快速排序 O(n log n)；小规模才用选择排序\n  是&quot;映射/查重/缓存&quot;吗？\n    └─ 散列表 O(1)\n  是&quot;网络里找路&quot;吗？\n    ├─ 边没权重 → BFS（段数最少）\n    └─ 边有权重 → 狄克斯特拉（总权重最小）；有负权 → 贝尔曼-福德\n  是&quot;约束下求最优&quot;吗？\n    ├─ 子问题可独立拆分 → 动态规划（精确最优）\n    └─ 子问题互依赖 / 要快 → 贪婪近似\n  是&quot;预测/分类新东西&quot;吗？\n    └─ KNN：抽特征 → 找最近 K 个邻居<\/code><\/pre>\n<h2>框架 2：D&amp;C 两问（分而治之）<\/h2>\n<p>遇到递归类问题，先问：<\/p>\n<ol><li>\n基线条件是什么？（简单到不用分解的情况；数组题通常是空/单元素数组）\n<\/li><li>\n每次怎么把问题缩小一圈？（去掉第一个元素 / 划掉一半 / 分成两个小同款问题）\n<\/ol>\n<h2>框架 3：大O三问（判断运行时间）<\/h2>\n<ol><li>\n输入规模 n 是什么？\n<\/li><li>\n每一步操作多少次？（打印所有元素 = O(n)；每个元素乘所有元素 = O(n²)）\n<\/li><li>\n常数忽略，最糟情况兜底。\n<\/ol>\n<h2>框架 4：NP 完全识别清单（原书 8.4.2）<\/h2>\n<p>蛛丝马迹，命中多个就该警觉：<\/p>\n<ul><li>\n元素少时很快，n 一大就慢得离谱；\n<\/li><li>\n涉及&quot;所有组合/所有排列&quot;；\n<\/li><li>\n不能拆成独立小问题；\n<\/li><li>\n涉及序列（城市顺序）或集合（广播台集合）；\n<\/li><li>\n能归约成旅行商或集合覆盖问题。\n<\/ul>\n<p>→ 应对：<strong>别找精确解，直接设计贪婪近似算法<\/strong>。<\/p>\n<h2>决策规则（if/else 速查）<\/h2>\n<ul><li>\n<strong>if 需要随机读取<\/strong> → 用数组；<strong>else if 频繁中间插删<\/strong> → 用链表。\n<\/li><li>\n<strong>if 列表有序<\/strong> → 二分查找；<strong>else<\/strong> → 简单查找或先排序。\n<\/li><li>\n<strong>if 要&quot;名字→数据&quot;的快速映射<\/strong> → 散列表。\n<\/li><li>\n<strong>if 边有权重<\/strong> → 狄克斯特拉；<strong>else if 边无权重<\/strong> → BFS。\n<\/li><li>\n<strong>if 有负权边<\/strong> → 不用狄克斯特拉，换贝尔曼-福德。\n<\/li><li>\n<strong>if 子问题独立可拆分<\/strong> → 动态规划；<strong>else<\/strong> → 贪婪近似或别的思路。\n<\/li><li>\n<strong>if 新样本要分类/预测数值<\/strong> → KNN（先把特征选好）。\n<\/ul>\n<h2>反模式（作者明确反对的做法）<\/h2>\n<ol><li>\n<strong>在 n 还小的时候就下结论&quot;这算法够快&quot;<\/strong\n<ul>\n<li>\n例子：Bob 用 100 元素时的 15 倍差距推断火箭算法；实际 10 亿元素时差 3300 万倍。\n<\/li><li>\n替代：看大O曲线形状，不看当前耗时。\n<\/ul>\n<\/ol>\n<ol><li>\n<strong>已排序数组 + 每次插入后重排<\/strong\n<ul>\n<li>\n问题：为了二分查找，每次新用户注册都把数组整体排序。\n<\/li><li>\n替代：用二叉查找树（第11章）或散列表。\n<\/ul>\n<\/ol>\n<ol><li>\n<strong>在 NP 完全问题上死磕精确解<\/strong\n<ul>\n<li>\n问题：试遍 2ⁿ 个子集、n! 条路线。\n<\/li><li>\n替代：贪婪近似，速度快且接近最优。\n<\/ul>\n<\/ol>\n<ol><li>\n<strong>递归不写基线条件<\/strong\n<ul>\n<li>\n后果：无限递归 → 栈溢出。\n<\/li><li>\n替代：每个递归函数先写&quot;什么时候不再调自己&quot;。\n<\/ul>\n<\/ol>\n<ol><li>\n<strong>BFS 不标记已检查节点<\/strong\n<ul>\n<li>\n后果：同一节点入队两次，甚至在&quot;你↔Peggy&quot;间无限循环。\n<\/li><li>\n替代：维护 searched 名单。\n<\/ul>\n<\/ol>\n<ol><li>\n<strong>用狄克斯特拉处理负权边<\/strong\n<ul>\n<li>\n后果：得到错误路径。\n<\/li><li>\n替代：贝尔曼-福德。\n<\/ul>\n<\/ol>\n<ol><li>\n<strong>KNN 随便挑特征<\/strong\n<ul>\n<li>\n后果：给小猫图片打分来推电影，推荐全偏。\n<\/li><li>\n替代：特征必须与目标相关、不偏不倚。\n<\/ul>\n<\/ol>", "__cheatsheet__": "<h1>速查表<\/h1>\n<h2>大O运行时间速查（从快到慢）<\/h2>\n<table><thead><tr><th>大O<\/th><th>名称<\/th><th>n=1024 时操作数<\/th><th>代表算法<\/th><\/tr><\/thead><tbody><tr><td>O(1)<\/td><td>常量时间<\/td><td>1<\/td><td>散列表查找、读数组第 k 个<\/td><\/tr><tr><td>O(log n)<\/td><td>对数时间<\/td><td>10<\/td><td>二分查找<\/td><\/tr><tr><td>O(n)<\/td><td>线性时间<\/td><td>1024<\/td><td>简单查找、打印每个元素<\/td><\/tr><tr><td>O(n log n)<\/td><td>——<\/td><td>~10000<\/td><td>快速排序（平均）、合并排序<\/td><\/tr><tr><td>O(n²)<\/td><td>平方时间<\/td><td>~100万<\/td><td>选择排序、乘法表<\/td><\/tr><tr><td>O(2ⁿ)<\/td><td>指数时间<\/td><td>天文<\/td><td>集合覆盖精确解<\/td><\/tr><tr><td>O(n!)<\/td><td>阶乘时间<\/td><td>天文<\/td><td>旅行商蛮力解<\/td><\/tr><\/tbody><\/table>\n<h2>数据结构操作速查<\/h2>\n<table><thead><tr><th>操作<\/th><th>数组<\/th><th>链表<\/th><th>散列表（平均）<\/th><\/tr><\/thead><tbody><tr><td>随机读取<\/td><td>O(1)<\/td><td>O(n)<\/td><td>——<\/td><\/tr><tr><td>顺序读取全部<\/td><td>O(n)<\/td><td>O(n)<\/td><td>——<\/td><\/tr><tr><td>插入<\/td><td>O(n)<\/td><td>O(1)<\/td><td>O(1)<\/td><\/tr><tr><td>删除（已定位）<\/td><td>O(n)<\/td><td>O(1)<\/td><td>O(1)<\/td><\/tr><tr><td>按键查找<\/td><td>——<\/td><td>——<\/td><td>O(1)<\/td><\/tr><\/tbody><\/table>\n<h2>算法选择速查<\/h2>\n<table><thead><tr><th>问题类型<\/th><th>首选算法<\/th><th>运行时间<\/th><\/tr><\/thead><tbody><tr><td>有序列表查元素<\/td><td>二分查找<\/td><td>O(log n)<\/td><\/tr><tr><td>无序查找<\/td><td>简单查找<\/td><td>O(n)<\/td><\/tr><tr><td>通用排序<\/td><td>快速排序<\/td><td>平均 O(n log n)<\/td><\/tr><tr><td>&quot;键→值&quot;映射/查重/缓存<\/td><td>散列表<\/td><td>O(1)<\/td><\/tr><tr><td>图里段数最少路径<\/td><td>BFS<\/td><td>O(V+E)<\/td><\/tr><tr><td>加权图最短路径（正权）<\/td><td>狄克斯特拉<\/td><td>O(V²) 量级<\/td><\/tr><tr><td>含负权边最短路径<\/td><td>贝尔曼-福德<\/td><td>——<\/td><\/tr><tr><td>NP 完全问题<\/td><td>贪婪近似<\/td><td>O(n log n) ~ O(n²)<\/td><\/tr><tr><td>约束下求最优、子问题独立<\/td><td>动态规划<\/td><td>O(网格大小)<\/td><\/tr><tr><td>新样本分类/数值预测<\/td><td>KNN<\/td><td>找最近 K 个<\/td><\/tr><\/tbody><\/table>\n<h2>Python 代码片段速查<\/h2>\n<pre class=\"lang-python\"><code># 二分查找\ndef binary_search(list, item):\n    low, high = 0, len(list)-1\n    while low &lt;= high:\n        mid = (low + high) // 2\n        if list[mid] == item: return mid\n        if list[mid] &gt; item: high = mid - 1\n        else: low = mid + 1\n    return None\n\n# 快速排序\ndef quicksort(array):\n    if len(array) &lt; 2: return array\n    pivot = array[0]\n    less = [i for i in array[1:] if i &lt;= pivot]\n    greater = [i for i in array[1:] if i &gt; pivot]\n    return quicksort(less) + [pivot] + quicksort(greater)\n\n# BFS（图用 dict 表示）\nfrom collections import deque\ndef search(name):\n    queue = deque(graph[name]); searched = []\n    while queue:\n        person = queue.popleft()\n        if person not in searched:\n            if person_is_seller(person): return True\n            queue += graph[person]; searched.append(person)\n    return False<\/code><\/pre>\n<h2>关键数字记忆点<\/h2>\n<ul><li>\n128 个元素二分查找最多 <strong>7<\/strong> 步；翻倍到 256 → <strong>8<\/strong> 步。\n<\/li><li>\n40 亿元素 → 二分查找约 <strong>32<\/strong> 步；简单查找 = <strong>40 亿步 ≈ 11 天<\/strong>。\n<\/li><li>\n散列表填装因子 <strong>&gt; 0.7<\/strong> 就扩容。\n<\/li><li>\n5 个城市旅行商 = <strong>120<\/strong> 条路线；6 城 = 720；7 城 = 5040。\n<\/li><li>\nKNN 邻居数经验值：<strong>√N<\/strong>。\n<\/ul>"},"nav":[{"label": "学习路径", "href": "#/path"}, {"label": "章节", "children": [{"label": "第 1 章：算法简介", "href": "#/chapter/ch01"}, {"label": "第 2 章：选择排序", "href": "#/chapter/ch02"}, {"label": "第 3 章：递归", "href": "#/chapter/ch03"}, {"label": "第 4 章：快速排序", "href": "#/chapter/ch04"}, {"label": "第 5 章：散列表", "href": "#/chapter/ch05"}, {"label": "第 6 章：广度优先搜索", "href": "#/chapter/ch06"}, {"label": "第 7 章：狄克斯特拉算法", "href": "#/chapter/ch07"}, {"label": "第 8 章：贪婪算法", "href": "#/chapter/ch08"}, {"label": "第 9 章：动态规划", "href": "#/chapter/ch09"}, {"label": "第 10 章：K 最近邻算法", "href": "#/chapter/ch10"}, {"label": "第 11 章：接下来如何做", "href": "#/chapter/ch11"}]}, {"label": "概念", "children": [{"label": "大O表示法", "href": "#/concept/c01"}, {"label": "递归与调用栈", "href": "#/concept/c02"}, {"label": "数组与链表", "href": "#/concept/c03"}, {"label": "散列表", "href": "#/concept/c04"}, {"label": "图与最短路径", "href": "#/concept/c05"}, {"label": "贪婪策略与NP完全", "href": "#/concept/c06"}, {"label": "动态规划", "href": "#/concept/c07"}]}, {"label": "测验", "children": [{"label": "综合测验", "href": "#/quiz/all"}, {"label": "测验：第 1 章：算法简介", "href": "#/quiz/ch01"}, {"label": "测验：第 2 章：选择排序", "href": "#/quiz/ch02"}, {"label": "测验：第 3 章：递归", "href": "#/quiz/ch03"}, {"label": "测验：第 4 章：快速排序", "href": "#/quiz/ch04"}, {"label": "测验：第 5 章：散列表", "href": "#/quiz/ch05"}, {"label": "测验：第 6 章：广度优先搜索", "href": "#/quiz/ch06"}, {"label": "测验：第 7 FA 决定模式指针位置，不回退 i。"}, {"id": "ch05e-q19", "chapterId": "ch05e", "type": "single", "question": "霍夫曼编码中频率高的字符编码？", "options": ["更长", "更短", "相同", "随机"], "answer": 1, "explain": "高频字符离根近，路径短，编码短。"}, {"id": "ch02e-q20", "chapterId": "ch02e", "type": "single", "question": "下列哪种组合能正确描述“先排序再二分查找”？", "options": ["归并排序 O(N log N) + 二分 O(log N)", "快排 O(N²) + 二分 O(N)", "堆排序 O(N) + 二分 O(log N)", "插入 O(N) + 二分 O(1)"], "answer": 0, "explain": "归并 N log N 保证，二分 log N；其余成本配错。"}, {"id": "ch03c-q21", "chapterId": "ch03c", "type": "multi", "question": "下列哪些结构“查找最坏不是 O(log N)”？", "options": ["普通 BST", "红黑树", "散列表(碰撞)", "有序数组"], "answer": [0, 2], "explain": "BST 有序插入退化 O(N)；散列碰撞链 O(N)。红黑树、有序数组有对数保证。"}, {"id": "ch02d-q22", "chapterId": "ch02d", "type": "single", "question": "要在内存极紧的实时系统中排 10^7 个元素且要 O(N log N) 最坏保证，选？", "options": ["快速排序", "堆排序", "归并排序", "选择排序"], "answer": 1, "explain": "堆排序原地 O(1) 额外空间 + O(N log N) 最坏保证。"}], "flashcards": [{"id": "f01", "chapterId": "ch01a", "front": "二分查找的前提和复杂度？", "back": "前提是数组已排序；每次砍一半，最多 ⌊log₂N⌋+1 次比较，O(log N)。", "tags": ["查找", "二分"]}, {"id": "f02", "chapterId": "ch01a", "front": "递归的两条铁律？", "back": "①必须有基准条件；②子问题与父问题不能有交集。", "tags": ["递归"]}, {"id": "f03", "chapterId": "ch01b", "front": "ADT（抽象数据类型）是什么？", "back": "数据+一组允许的操作；只露 API 藏内部表示（封装）。", "tags": ["ADT", "封装"]}, {"id": "f04", "chapterId": "ch01c", "front": "栈和队列的进出规则？", "back": "栈 LIFO（后进先出）；队列 FIFO（先进先出）。", "tags": ["栈", "队列"]}, {"id": "f05", "chapterId": "ch01c", "front": "动态数组为什么满了翻倍、空了缩半？", "back": "平摊成本常数；缩容阈值 1/4 而非 1/2，防抖动。", "tags": ["均摊", "动态数组"]}, {"id": "f06", "chapterId": "ch01d", "front": "增长数量级七兄弟是哪些？", "back": "1 / log N / N / N log N / N² / N³ / 2^N。", "tags": ["复杂度"]}, {"id": "f07", "chapterId": "ch01d", "front": "倍率实验 t(2N)/t(N)→8 说明几阶？", "back": "三阶 O(N³)，因为 2^b=8 → b=3。", "tags": ["复杂度", "倍率"]}, {"id": "f08", "chapterId": "ch01e", "front": "加权 quick-union 的树高保证？", "back": "任意节点深度 ≤ lg N（命题 H）。", "tags": ["并查集"]}, {"id": "f09", "chapterId": "ch01e", "front": "路径压缩在哪一步做？", "back": "find 爬到根后把路径上节点直接指向根。", "tags": ["并查集"]}, {"id": "f10", "chapterId": "ch02a", "front": "插入排序的交换次数等于什么？", "back": "数组中倒置（逆序对）的数量。", "tags": ["排序", "插入"]}, {"id": "f11", "chapterId": "ch02a", "front": "选择排序要多少次交换？", "back": "N-1 次，比较 ~N²/2。", "tags": ["排序", "选择"]}, {"id": "f12", "chapterId": "ch02a", "front": "希尔排序为什么用递减 h？", "back": "大间隔远距离就位，小间隔收尾时已基本有序。", "tags": ["排序", "希尔"]}, {"id": "f13", "chapterId": "ch02b", "front": "归并排序最坏比较次数？", "back": "~N lg N（命题 H），空间 O(N)。", "tags": ["排序", "归并"]}, {"id": "f14", "chapterId": "ch02b", "front": "基于比较的排序下界是？", "back": "~N lg N 次比较（决策树叶子 ≥ N!）。", "tags": ["排序", "下界"]}, {"id": "f15", "chapterId": "ch02c", "front": "快排平均比较次数？", "back": "~2N ln N ≈ 1.39 N lg N。", "tags": ["排序", "快排"]}, {"id": "f16", "chapterId": "ch02c", "front": "快排最坏情况及对策？", "back": "输入已有序时 O(N²)；对策先随机打乱。", "tags": ["排序", "快排"]}, {"id": "f17", "chapterId": "ch02d", "front": "堆的数组下标关系？", "back": "节点 i 父亲 i/2，孩子 2i、2i+1。", "tags": ["堆", "优先队列"]}, {"id": "f18", "chapterId": "ch02d", "front": "堆排序总复杂度？", "back": "O(N log N)，原地 O(1) 额外空间。", "tags": ["排序", "堆排序"]}, {"id": "f19", "chapterId": "ch02e", "front": "Java 对原始类型和引用类型各用什么排序？", "back": "原始类型三向快排；引用类型归并（要稳定）。", "tags": ["排序", "选型"]}, {"id": "f20", "chapterId": "ch03a", "front": "符号表的核心两个操作？", "back": "put(key, value) 存入、get(key) 取值。", "tags": ["符号表"]}, {"id": "f21", "chapterId": "ch03a", "front": "有序数组实现符号表，get/put 各多快？", "back": "get O(log N)；put O(N)（搬移）。", "tags": ["符号表", "二分"]}, {"id": "f22", "chapterId": "ch03b", "front": "BST 的核心性质？", "back": "左子树键<根键<右子树键（中序升序）。", "tags": ["BST"]}, {"id": "f23", "chapterId": "ch03b", "front": "随机 BST 平均查找？", "back": "~2 ln N ≈ 1.39 lg N（命题 C）。", "tags": ["BST"]}, {"id": "f24", "chapterId": "ch03c", "front": "红黑树高度上界？", "back": "≤ 2 lg N（命题 G）。", "tags": ["红黑树"]}, {"id": "f25", "chapterId": "ch03c", "front": "红黑树的红链接代表什么？", "back": "两节点共同构成一个 3-节点（2-3 树的编码）。", "tags": ["红黑树"]}, {"id": "f26", "chapterId": "ch03d", "front": "散列函数理想性质？", "back": "计算快 + 分布均匀。", "tags": ["散列"]}, {"id": "f27", "chapterId": "ch03d", "front": "线性探测装载因子要求？", "back": "α = N/M ≤ 1/2。", "tags": ["散列"]}, {"id": "f28", "chapterId": "ch03d", "front": "散列表为什么不支持 rank？", "back": "散列打乱键顺序，无有序结构。", "tags": ["散列"]}, {"id": "f29", "chapterId": "ch04a", "front": "DFS 和 BFS 各用什么结构？", "back": "DFS 栈（递归）；BFS 队列。", "tags": ["图遍历"]}, {"id": "f30", "chapterId": "ch04a", "front": "为什么 BFS 能求最短路径？", "back": "按距离从小到大访问，首次到达即最短。", "tags": ["图遍历", "最短路"]}, {"id": "f31", "chapterId": "ch04a", "front": "邻接表空间复杂度？", "back": "O(V+E)。", "tags": ["图"]}, {"id": "f32", "chapterId": "ch04b", "front": "拓扑排序适用于什么图？", "back": "DAG（有向无环图）。", "tags": ["有向图", "拓扑"]}, {"id": "f33", "chapterId": "ch04b", "front": "强连通的定义？", "back": "两顶点互相可达（双向）。", "tags": ["有向图"]}, {"id": "f34", "chapterId": "ch04c", "front": "切分定理内容？", "back": "横切边中权重最小的那条必入 MST。", "tags": ["MST"]}, {"id": "f35", "chapterId": "ch04c", "front": "Kruskal 用什么判连通？", "back": "并查集。", "tags": ["MST", "Kruskal"]}, {"id": "f36", "chapterId": "ch04d", "front": "Dijkstra 的前提和复杂度？", "back": "边权非负；E log V（优先队列）。", "tags": ["最短路径"]}, {"id": "f37", "chapterId": "ch04d", "front": "“松弛”一条边做什么？", "back": "若经 v 到 w 更短，更新 distTo[w] 和 edgeTo[w]。", "tags": ["最短路径"]}, {"id": "f38", "chapterId": "ch05a", "front": "键索引计数法复杂度？", "back": "O(N+R)，R 字母表大小，稳定。", "tags": ["字符串排序"]}, {"id": "f39", "chapterId": "ch05a", "front": "LSD 排序要求什么？", "back": "字符串等长，从最右位逐位分桶。", "tags": ["字符串排序"]}, {"id": "f40", "chapterId": "ch05b", "front": "Trie 查找成本取决于？", "back": "键长，与键总数 N 无关。", "tags": ["Trie"]}, {"id": "f41", "chapterId": "ch05c", "front": "KMP 的关键改进？", "back": "失配不回退文本指针，用 DFA 决定模式指针位置，O(N+M)。", "tags": ["KMP", "子串"]}, {"id": "f42", "chapterId": "ch05d", "front": "正则表达式三运算？", "back": "连接、或(|)、闭包(*)。", "tags": ["正则"]}, {"id": "f43", "chapterId": "ch05e", "front": "霍夫曼编码高频字符编码？", "back": "更短（离根近）；要求前缀编码。", "tags": ["压缩", "霍夫曼"]}]},"rendered":{"ch01a": "<h1>第 1 章（1.1）：基础编程模型——用 Java 描述算法的方式<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★☆☆ | <strong>预估学时<\/strong>：2.5 小时 | <strong>前置<\/strong>：无（会用任何一门语言写过循环即可）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本节，你能：<\/p>\n<ol><li>\n说清一段 Java 程序的基本结构（类、<code>main<\/code> 方法、静态方法）；\n<\/li><li>\n看懂本书所有 Java 代码示例的&quot;长相&quot;，知道 <code>StdIn<\/code>/<code>StdOut<\/code> 是干什么的；\n<\/li><li>\n手写<strong>二分查找<\/strong>（binary search），并说清它为什么是对数级别。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>本书不教 Java 语法大全，只借 Java 这门语言把算法&quot;说清楚&quot;；而第一个被讲透的算法就是二分查找——在有序数组里每次猜一半。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：Java 程序的基本结构（难度：基础）<\/h3>\n<p>本书所有代码都长一个样：一个 <code>public class<\/code>，里面有一个 <code>static void main(String[] args)<\/code> 方法作为入口。<strong>静态方法（static method）<\/strong>就是&quot;挂在类身上、不依赖具体对象就能直接调用的函数&quot;，本书用它来演示算法逻辑，省掉面向对象的开销。<\/p>\n<p>本书自带几个工具库（从官网下载 <code>.java<\/code> 文件放同目录即可用）：<\/p>\n<ul><li>\n<code>StdOut.println(x)<\/code>：打印一行；\n<\/li><li>\n<code>StdIn.readInt()<\/code>：从输入读一个整数；\n<\/li><li>\n<code>StdRandom<\/code>：产生随机数；\n<\/li><li>\n<code>Stopwatch<\/code>：秒表，用来测程序跑了多久（第 1.4 节算法分析的关键工具）。\n<\/ul>\n<h3>概念 2：二分查找（难度：基础）<\/h3>\n<p><strong>二分查找（binary search）<\/strong>：在一个<strong>已经排好序<\/strong>的数组里找某个键 <code>key<\/code>，每次和&quot;中间元素&quot;比大小，排除一半，直到找到或区间为空。<\/p>\n<p>本书代码（算法 1.1，保留 Java 原样并加中文注释）：<\/p>\n<pre class=\"lang-java\"><code>public static int rank(int key, int[] a) {\n    // a 必须是有序的。返回 key 的下标；不存在则返回 -1\n    int lo = 0;\n    int hi = a.length - 1;\n    while (lo &lt;= hi) {\n        int mid = lo + (hi - lo) / 2;   // 中间下标（防溢出写法）\n        if      (key &lt; a[mid]) hi = mid - 1;  // key 更小，答案在左半边\n        else if (key &gt; a[mid]) lo = mid + 1;  // key 更大，答案在右半边\n        else return mid;                      // 正好命中\n    }\n    return -1;\n}<\/code><\/pre>\n<p><strong>一步一步可复核的例子<\/strong>：在 <code>[1, 3, 8, 12, 17, 25, 40]<\/code>（下标 0~6）里找 <code>17<\/code>：<\/p>\n<ol><li>\nlo=0, hi=6 → mid=3，<code>a[3]=12<\/code>，<code>17&gt;12<\/code> → lo=4；\n<\/li><li>\nlo=4, hi=6 → mid=5，<code>a[5]=25<\/code>，<code>17&lt;25<\/code> → hi=4；\n<\/li><li>\nlo=4, hi=4 → mid=4，<code>a[4]=17<\/code> → 返回 4。\n<\/ol>\n<p>7 个元素只比了 3 次。N 个元素最多比 <code>⌊log₂N⌋ + 1<\/code> 次，这就是<strong>对数级别（logarithmic）<\/strong>的来源。<\/p>\n<h3>概念 3：递归（难度：基础）<\/h3>\n<p><strong>递归（recursion）<\/strong>：一个方法调用它自己来解决规模更小的同类问题。两个铁律（原书强调）：① 必须有<strong>基准条件<\/strong>（不再自我调用、直接返回）；② 子问题和父问题<strong>不能有交集<\/strong>。本书后面归并排序、树的遍历全靠它。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[&quot;lo=0, hi=N-1&quot;] --&gt; B{&quot;key == a[mid]?&quot;}\n    B -- 是 --&gt; C[&quot;返回 mid&quot;]\n    B -- &quot;key &lt; a[mid]&quot; --&gt; D[&quot;hi = mid-1，砍掉右半边&quot;]\n    B -- &quot;key &gt; a[mid]&quot; --&gt; E[&quot;lo = mid+1，砍掉左半边&quot;]\n    D --&gt; F{&quot;lo &lt;= hi?&quot;}\n    E --&gt; F\n    F -- 是 --&gt; B\n    F -- 否 --&gt; G[&quot;返回 -1（没找到）&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：整个流程就是&quot;每次砍掉一半&quot;。每砍一次区间长度减半，所以 N 个元素最多砍 <code>log₂N<\/code> 次——这就是对数复杂度的直观来源。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：翻字典找&quot;算法&quot;。你不会从第 1 页逐页翻，而是翻开中间，看&quot;这页是 D 开头&quot;，于是只在左半本继续翻。每次砍一半，翻完 1000 页字典最多 10 次。<em>失效边界<\/em>：字典必须按字母排序才成立——无序数组不能用二分查找。\n<\/li><li>\n<strong>实例<\/strong>：上面找 <code>17<\/code> 的 3 步过程已带数字带结果，可拿计算器复核 <code>log₂7 ≈ 2.8<\/code>。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为<\/strong>二分查找适用于任何数组——实际上它<strong>只在有序数组<\/strong>上成立，前提&quot;已排序&quot;必须先满足。\n<\/li><li>\n<strong>别以为<\/strong> <code>mid = (lo+hi)/2<\/code> 和 <code>lo+(hi-lo)/2<\/code> 完全一样——数学上一样，但 <code>lo+hi<\/code> 在极大数组下可能<strong>整数溢出<\/strong>变负数，本书专门用防溢出写法。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n在有序数组 <code>[2, 5, 9, 14, 22, 31, 48]<\/code> 中用二分查找找 <code>31<\/code>，第 2 次比较时 <code>mid<\/code> 指向的值是多少？（答案：22；解析：第 1 次 mid=3→a[3]=14，31&gt;14 故 lo=4；第 2 次 lo=4,hi=6→mid=5→a[5]=31。等等——重新算：第1次 lo=0,hi=6,mid=3,a[3]=14,31&gt;14→lo=4。第2次 lo=4,hi=6,mid=5,a[5]=31 直接命中。所以第 2 次比较 mid 指向 31。）\n<\/li><li>\nN=1024 个元素的有序数组，二分查找最多比较约几次？（答案：10 次；解析：2¹⁰=1024，最多 ⌊log₂1024⌋+1=11，约 10~11 次。）\n<\/li><li>\n二分查找要求输入满足什么前提？（答案：数组必须已经排好序；解析：靠&quot;中间值&quot;排除一半的前提是左边全小、右边全大。）\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n本书所有代码 = 一个 class 里一个 <code>main<\/code>，算法用静态方法写。\n<\/li><li>\n二分查找：有序数组 + 每次砍一半 → 对数级别。\n<\/li><li>\n递归两铁律：有基准条件、子问题不相交。\n<\/ul>", "ch01b": "<h1>第 1 章（1.2）：数据抽象——把&quot;数据&quot;和&quot;操作&quot;打包成类型<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★☆☆ | <strong>预估学时<\/strong>：2 小时 | <strong>前置<\/strong>：ch01a\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本节，你能：<\/p>\n<ol><li>\n说清<strong>抽象数据类型（ADT）<\/strong>是什么、为什么它让算法代码更好懂；\n<\/li><li>\n看懂本书反复使用的&quot;API 表格&quot;阅读法；\n<\/li><li>\n用 Counter/Accumulator 的例子理解&quot;用例—实现&quot;分离。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>数据抽象 = 只暴露&quot;能对数据做什么操作&quot;（API），把&quot;数据内部怎么存&quot;藏起来；学算法时我们站在 API 这一侧用它，偶尔再翻进去看实现。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：抽象数据类型（ADT，难度：基础）<\/h3>\n<p><strong>数据抽象<\/strong>：定义一种新的数据类型时，只规定&quot;它支持哪些操作&quot;，不暴露内部表示。<strong>抽象数据类型（Abstract Data Type, ADT）<\/strong>就是&quot;数据 + 一组允许的操作&quot;这个整体。<\/p>\n<p><strong>类比<\/strong>：微波炉。你只用面板按钮（API：加热/解冻/定时），不需要知道磁控管怎么工作（内部实现）。<em>失效边界<\/em>：当你要调试&quot;为什么不热了&quot;，就得钻进内部——学算法分析时我们经常要钻进去。<\/p>\n<p>本书惯例：用一张 <strong>API 表<\/strong>描述一个数据类型，例如 <code>Counter<\/code>：<\/p>\n<table><thead><tr><th>操作<\/th><th>作用<\/th><\/tr><\/thead><tbody><tr><td><code>Counter(String id)<\/code><\/td><td>创建一个名为 id 的计数器<\/td><\/tr><tr><td><code>void increment()<\/code><\/td><td>计数器 +1<\/td><\/tr><tr><td><code>int tally()<\/code><\/td><td>当前计数<\/td><\/tr><tr><td><code>String toString()<\/code><\/td><td>打印形式<\/td><\/tr><\/tbody><\/table>\n<p><strong>客户端（client）<\/strong>：调用 API 的代码。<strong>实现者（implementor）<\/strong>：写 API 背后代码的人。两者只通过 API 契约沟通。<\/p>\n<h3>概念 2：实例方法与封装（难度：基础）<\/h3>\n<p>和 1.1 的静态方法不同，ADT 里的方法叫<strong>实例方法<\/strong>：它绑在一个具体对象（实例）身上。<code>private<\/code> 修饰的字段表示&quot;外部不许碰&quot;，这叫<strong>封装（encapsulation）<\/strong>——防止用例乱改内部状态。<\/p>\n<pre class=\"lang-java\"><code>public class Counter {\n    private int count;          // 内部状态，外部不可见\n    private final String name;  // 名字\n\n    public Counter(String id) { name = id; }\n    public void increment()    { count++; }   // 只许通过这个方法加\n    public int tally()         { return count; }\n    public String toString()   { return name + &quot;: &quot; + count; }\n}<\/code><\/pre>\n<h3>概念 3：设计数据类型的启示（难度：进阶）<\/h3>\n<p>原书 1.2.5 强调好 ADT 的标准：① 设计要<strong>简洁<\/strong>，操作围绕某种一致的抽象；② 一组操作要足以支持用例；③ 封装让实现可替换。<code>Accumulator<\/code>（累加器）是最小例子：只管 <code>addDataValue(double)<\/code> 和 <code>mean()<\/code>。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n    subgraph 客户端世界\n        U[&quot;main() 用例代码&quot;]\n    end\n    subgraph ADT 边界\n        API[&quot;API 契约：increment / tally / toString&quot;]\n        IMPL[&quot;private 字段 count&lt;br/&gt;实现细节&quot;]\n    end\n    U --&gt;|&quot;只通过 API 调用&quot;| API\n    API --&gt; IMPL<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：客户端箭头只能指向 API，永远不能指向 <code>private<\/code> 字段。这个边界就是&quot;数据抽象&quot;四个字的实体化。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：银行账户。你在 ATM 上只能查询、取款、转账（API），看不到也碰不到银行金库账本（内部表示）。<em>失效边界<\/em>：审计监管就要突破封装——对应调试性能时要看实现。\n<\/li><li>\n<strong>实例<\/strong>：建两个计数器 <code>heads<\/code>、<code>tails<\/code>，抛硬币 1000 次分别 <code>increment()<\/code>，最后打印两个 tally——用例代码完全不关心 count 变量是 <code>int<\/code> 还是 <code>long<\/code>。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为<\/strong> ADT 就是&quot;面向对象&quot;——实际上 ADT 是思想，面向对象是它在 Java 里的一种落地；C 语言也能模拟 ADT。\n<\/li><li>\n<strong>别以为<\/strong> <code>private<\/code> 是安全防线——实际上它是<strong>编译期约定<\/strong>，目的是帮程序员不乱改，不是安全加密。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\nADT 的&quot;封装&quot;要求外部代码通过什么访问对象？（答案：通过公开 API 方法；解析：private 字段外部不可见，只能走约定好的操作。）\n<\/li><li>\n客户端和实现者之间的契约叫什么？（答案：API；解析：它是双方唯一沟通界面。）\n<\/li><li>\nCounter 类里 <code>count<\/code> 为什么声明为 <code>private<\/code>？（答案：防止外部绕过 increment() 直接篡改计数，保证计数规则一致；解析。）\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\nADT = 数据 + 操作集合；只露 API，藏内部。\n<\/li><li>\n本书的 API 表 = 这个类型的&quot;操作说明书&quot;。\n<\/li><li>\n用例与实现分离，是模块化编程的基础。\n<\/ul>", "ch01c": "<h1>第 1 章（1.3）：背包、队列和栈——三种最基础的数据结构<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★☆☆ | <strong>预估学时<\/strong>：3 小时 | <strong>前置<\/strong>：ch01b\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本节，你能：<\/p>\n<ol><li>\n说清<strong>背包（Bag）、队列（Queue）、栈（Stack）<\/strong>三种数据结构的进出规则；\n<\/li><li>\n用<strong>数组<\/strong>和<strong>链表<\/strong>两种方式实现它们，知道&quot;动态调整数组大小&quot;的均摊思想；\n<\/li><li>\n徒手画出链表节点的插入/删除指针操作。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>栈是&quot;后进先出&quot;（像弹夹），队列是&quot;先进先出&quot;（像排队），背包只收不取；它们是后面所有复杂结构（树、图算法）的积木。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：栈（Stack，LIFO，难度：基础）<\/h3>\n<p><strong>栈（stack）<\/strong>：只能在一端（栈顶）压入和弹出。<strong>后进先出（Last In First Out, LIFO）<\/strong>——最后压进去的最先出来。<\/p>\n<p>类比：手枪弹夹，压弹最后进去的最先打出。<em>失效边界<\/em>：你不能从弹夹中间取子弹——栈也不让。<\/p>\n<h3>概念 2：队列（Queue，FIFO，难度：基础）<\/h3>\n<p><strong>队列（queue）<\/strong>：一端入队、另一端出队。<strong>先进先出（First In First Out, FIFO）<\/strong>。类比：食堂打饭排队，先到先服务。<\/p>\n<h3>概念 3：背包（Bag，难度：基础）<\/h3>\n<p><strong>背包（bag）<\/strong>：只能往里加元素、遍历所有元素，不支持取出。用途：收集一批数据后再整体处理（比如累加器收集所有样本再求平均）。<\/p>\n<h3>概念 4：链式实现——链表（linked list，难度：进阶）<\/h3>\n<p><strong>链表（linked list）<\/strong>：一串节点，每个节点含一个数据 + 一个指向下一节点的引用。<\/p>\n<pre class=\"lang-java\"><code>private class Node {\n    Item item;      // 存的数据\n    Node next;      // 指向下一个节点\n}<\/code><\/pre>\n<p><strong>头插法建栈<\/strong>：每次把新节点插在链表最前面——<\/p>\n<pre class=\"lang-java\"><code>Node oldFirst = first;      // 记住旧首节点\nfirst = new Node();\nfirst.item = item;\nfirst.next = oldFirst;      // 新节点指向旧首节点<\/code><\/pre>\n<p>四行完成，不用移动任何已有节点。<strong>链表的杀手锏：插入/删除节点只需改指针，常数时间。<\/strong><\/p>\n<h3>概念 5：动态调整数组大小（均摊成本，难度：高难）<\/h3>\n<p>数组实现栈时，数组满了怎么办？原书做法：<strong>容量翻倍<\/strong>（<code>resize<\/code> 到 2 倍），元素太少（栈大小 &lt; 数组 1/4）时<strong>减半<\/strong>。为什么是 4 而不是 2？防止&quot;频繁入栈出栈导致反复扩容缩容&quot;的抖动。<\/p>\n<p><strong>均摊分析<\/strong>：N 次 <code>push<\/code> 中，只有 <code>resize<\/code> 的那几次贵（要复制整个数组，成本 ~N），其余都是常数。把翻倍的总成本 <code>1+2+4+…+N ≈ 2N<\/code> 平摊到 N 次操作上，每次 <code>push<\/code> 的<strong>均摊成本<\/strong>仍是常数。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n    subgraph 栈 LIFO\n        S3[&quot;顶: c&quot;] --&gt; S2[&quot;b&quot;] --&gt; S1[&quot;底: a&quot;]\n    end\n    subgraph 队列 FIFO\n        Q1[&quot;队头: a&quot;] --&gt; Q2[&quot;b&quot;] --&gt; Q3[&quot;c →出队&quot;]\n    end<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：栈从顶取（c 先出），队列从头取（a 先出）。两个方向相反的进出规则，就是栈与队列的全部区别。<\/p>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n    N1[&quot;(item, next)&quot;] --&gt; N2[&quot;(item, next)&quot;] --&gt; N3[&quot;(item, next)&quot;] --&gt; NIL[&quot;null&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：链表节点像一串回形针——每个回形针扣着下一个。插入/删除 = 改两个&quot;扣环&quot;的指向，不用搬动整串。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比（栈）<\/strong>：浏览器&quot;后退&quot;按钮其实就是一个栈——你点链接压入历史，后退弹出。<em>失效边界<\/em>：栈不支持随机访问第 k 个元素。\n<\/li><li>\n<strong>实例<\/strong>：用链表栈压入 a、b、c：头插后链表是 c→b→a。弹出顺序 c、b、a——后进先出验证通过。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为<\/strong>链表比数组&quot;更快&quot;——实际上链表读第 k 个元素要一路走指针（O(N)），数组 O(1)；链表只在<strong>插入删除<\/strong>上快。\n<\/li><li>\n<strong>别以为<\/strong>动态数组每次 push 都很贵——实际上只有偶尔的翻倍贵，均摊后每次仍是常数。\n<\/li><li>\n<strong>别以为<\/strong>背包和栈一样能取出——实际上背包只进不出，连 pop 都没有。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n依次压入 1、2、3 再弹出一次，弹出的值是几？（答案：3；解析：栈 LIFO，最后压入的 3 最先弹出。）\n<\/li><li>\n队列中依次入队 a、b、c，然后出队两次，队头现在是？（答案：c；解析：FIFO，先出 a、再出 b，剩下 c 在队头。）\n<\/li><li>\n数组实现栈时，栈大小降到数组容量的多少时缩容？为什么不是 1/2？（答案：降到 1/4 时减半；解析：留一倍缓冲，避免在容量边界反复 push/pop 造成扩容缩容抖动。）\n<\/li><li>\n链表头插法需要修改几个指针引用？（答案：2 个；解析：first 指向新节点、新节点 next 指向旧首节点。）\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n栈 LIFO / 队列 FIFO / 背包只进不出。\n<\/li><li>\n链表插入删除常数时间；随机访问慢。\n<\/li><li>\n动态数组：满了翻倍、空了缩半，均摊成本常数。\n<\/ul>", "ch01d": "<h1>第 1 章（1.4）：算法分析——用&quot;增长数量级&quot;比较算法快慢<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：3 小时 | <strong>前置<\/strong>：ch01a、ch01c\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本节，你能：<\/p>\n<ol><li>\n用<strong>大 O / ~ / 增长数量级<\/strong>语言描述一个算法的运行时间；\n<\/li><li>\n背出本书 7 种常见增长量级（常数、对数、线性、N log N、平方、立方、指数）；\n<\/li><li>\n用<strong>倍率实验<\/strong>（doubling ratio）实测一个算法的复杂度；区分最坏情况、最好情况、平均情况。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>比较两个算法不比&quot;跑多少毫秒&quot;，而比&quot;输入翻倍时时间涨几倍&quot;——涨 1 倍是线性，涨平方倍是平方级。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：增长数量级（order of growth，难度：进阶）<\/h3>\n<p><strong>增长数量级<\/strong>：当输入规模 N 越来越大时，运行时间函数里&quot;起决定作用的那一项&quot;的类别。本书用 <code>~<\/code> 表示近似（忽略低阶项和常数因子）。<\/p>\n<p><strong>表 1.4.3 常见增长数量级（原书）<\/strong>：<\/p>\n<table><thead><tr><th>量级<\/th><th>函数<\/th><th>典型算法<\/th><\/tr><\/thead><tbody><tr><td>常数级别<\/td><td>1<\/td><td>普通语句、数组取值<\/td><\/tr><tr><td>对数级别<\/td><td>log N<\/td><td>二分查找<\/td><\/tr><tr><td>线性级别<\/td><td>N<\/td><td>遍历一次数组<\/td><\/tr><tr><td>线性对数级别<\/td><td>N log N<\/td><td>归并排序（后讲）<\/td><\/tr><tr><td>平方级别<\/td><td>N²<\/td><td>双重循环（选择/插入排序）<\/td><\/tr><tr><td>立方级别<\/td><td>N³<\/td><td>三重循环（ThreeSum）<\/td><\/tr><tr><td>指数级别<\/td><td>2^N<\/td><td>第 6 章的穷举（不用作实用算法）<\/td><\/tr><\/tbody><\/table>\n<p><strong>读法<\/strong>：<code>~N²/2<\/code> 和 <code>~N²<\/code> 是同一量级——常数 1/2 在 N 极大时不改变&quot;它是平方级&quot;这个判断。<\/p>\n<h3>概念 2：ThreeSum 与倍率实验（难度：进阶）<\/h3>\n<p><strong>ThreeSum<\/strong>：数出 N 个整数中三数之和为 0 的组合数。三重循环 → <code>~N³/6<\/code>。<\/p>\n<p><strong>倍率实验（doubling experiment）<\/strong>：把输入 N 每次翻倍，记录运行时间 t(N)，看比值 <code>t(2N)/t(N)<\/code>：<\/p>\n<ul><li>\n比值 → 2：线性；\n<\/li><li>\n比值 → 4：平方；\n<\/li><li>\n比值 → 8：立方；\n<\/li><li>\n比值收敛到 2^b，b 就是量级的指数。\n<\/ul>\n<p>实测时用 <code>Stopwatch<\/code> 计 <code>ThreeSum<\/code> 跑 N=1000,2000,4000… 的时间，比值趋近 8 → 验证 <code>N³<\/code>。<\/p>\n<h3>概念 3：最坏/最好/平均情况（难度：进阶）<\/h3>\n<ul><li>\n<strong>最坏情况（worst case）<\/strong>：最倒霉输入下的上界——理论研究者的角度，给<strong>保证<\/strong>。\n<\/li><li>\n<strong>平均情况（average case）<\/strong>：所有输入的期望——告诉我们<strong>典型表现<\/strong>。\n<\/li><li>\n本书名言：随机化（如快排先打乱输入）能让&quot;实际最坏情况&quot;概率小到像被雷劈，当作实用保证。\n<\/ul>\n<h3>概念 4：内循环（难度：基础）<\/h3>\n<p><strong>内循环（inner loop）<\/strong>：被执行最频繁的那层循环。经验法则：<strong>程序总时间由执行最频繁的指令决定<\/strong>——分析时盯着最内层循环数次数即可。<\/p>\n<h3>概念 5：注意事项（难度：高难）<\/h3>\n<p>原书 1.4.7 警告：①大常数可能让&quot;渐近更优&quot;的算法在小 N 时更慢；②不要把&quot;能跑通&quot;当成&quot;够快&quot;；③实验必须独立于硬件（用倍率比值消掉机器常数）。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[&quot;输入规模 N&quot;] --&gt; B[&quot;数最内层循环执行次数&quot;]\n    B --&gt; C[&quot;写出 ~f(N)&quot;]\n    C --&gt; D{&quot;f(N) 类别?&quot;}\n    D --&gt;|&quot;1&quot;| E[&quot;常数&quot;]\n    D --&gt;|&quot;log N&quot;| F[&quot;对数&quot;]\n    D --&gt;|&quot;N&quot;| G[&quot;线性&quot;]\n    D --&gt;|&quot;N log N&quot;| H[&quot;N log N&quot;]\n    D --&gt;|&quot;N²&quot;| I[&quot;平方&quot;]\n    D --&gt;|&quot;N³&quot;| J[&quot;立方&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：分析算法 = 数最内层循环次数 → 套进量级表。这是全书复杂度分析的统一流水线。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：判断&quot;一锅粥熬多久&quot;不看火大火小（硬件常数），而看&quot;米量翻倍要熬多久&quot;（倍率）。<em>失效边界<\/em>：小锅（N 小）时搅拌时间（常数项）反而主导。\n<\/li><li>\n<strong>实例<\/strong>：TwoSum（数两数之和为 0）两层循环 ~N²/2；ThreeSum 三层循环 ~N³/6。N=1000 时后者比前者慢约 500 倍。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为<\/strong> O(N²) 一定比 O(N log N) 慢——实际上当 N 只有几十时，带大常数的 N log N 算法可能更慢；复杂度比较只在 N 很大时才有决定性意义。\n<\/li><li>\n<strong>别以为<\/strong>大 O 是精确运行时间——实际上它<strong>丢掉了所有常数和低阶项<\/strong>，只描述增长趋势。\n<\/li><li>\n<strong>别以为<\/strong>平均情况等于最坏情况——实际上快排最坏 O(N²)，但平均 ~1.39 N lg N，差别巨大。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n一个算法内层循环执行 ~N²/2 次，它的增长数量级是？（答案：平方级别 O(N²)；解析：常数 1/2 不改变量级类别。）\n<\/li><li>\n倍率实验中 t(2N)/t(N) 趋近 4，算法是几阶？（答案：二阶 O(N²)；解析：时间 ∝ N^b，翻倍后比值 2^b=4 → b=2。）\n<\/li><li>\n为什么分析时只盯着内循环？（答案：最频繁指令决定总时间；解析：外层次数乘以内层次数，内层量级最大。）\n<\/li><li>\n二分查找的量级是？（答案：对数级别 O(log N)；解析：每次砍一半。）\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n量级七兄弟：1 / log N / N / N log N / N² / N³ / 2^N。\n<\/li><li>\n倍率实验：t(2N)/t(N) → 2^b，b 即阶数。\n<\/li><li>\n内循环决定总时间；常数项在大 N 时消失。\n<\/ul>", "ch01e": "<h1>第 1 章（1.5）：案例研究——并查集（union-find）<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：3 小时 | <strong>前置<\/strong>：ch01c、ch01d\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本节，你能：<\/p>\n<ol><li>\n说清<strong>动态连通性<\/strong>问题和 union-find 要回答的两个操作；\n<\/li><li>\n讲出 quick-find → quick-union → <strong>加权 quick-union<\/strong> → <strong>路径压缩<\/strong>四步演化，每步改进了什么；\n<\/li><li>\n说出最终版本为什么接近&quot;每操作常数时间&quot;。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>并查集回答&quot;两个点是不是已经连通&quot;，通过&quot;合并小树到大树&quot;（加权）+&quot;顺便把路压短&quot;（路径压缩），把森林操作做到接近常数。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：动态连通性（难度：基础）<\/h3>\n<p><strong>动态连通性（dynamic connectivity）<\/strong>：有 N 个触点，不断读入&quot;p 和 q 连通&quot;的关系对，要随时回答&quot;p 和 q 现在连通吗？&quot;。<strong>连通分量（connected component）<\/strong>：互相连通的一群点。两个约定：连通是<strong>等价关系<\/strong>——自反、对称、传递。<\/p>\n<p>API：<code>union(p,q)<\/code>（连通 p、q）、<code>find(p)<\/code>（p 所在分量标识）、<code>connected(p,q)<\/code>（是否同分量）。<\/p>\n<h3>概念 2：quick-find（难度：基础）<\/h3>\n<p>用数组 <code>id[]<\/code>，<code>id[i]<\/code> 直接存 i 的分量号。<code>connected(p,q)<\/code> 只要比 <code>id[p]==id[q]<\/code>——极快。但 <code>union(p,q)<\/code> 要把所有等于 <code>id[p]<\/code> 的元素全改成 <code>id[q]<\/code>，一次 union 扫整个数组，<strong>O(N)<\/strong>，N 对操作共 O(N²)。<\/p>\n<h3>概念 3：quick-union（难度：进阶）<\/h3>\n<p>数组 <code>id[]<\/code> 存的是<strong>父指针<\/strong>：<code>id[p]<\/code> 是 p 的父亲。find(p) 要一路沿着父指针爬到<strong>根<\/strong>（<code>id[root]==root<\/code> 的节点）。union(p,q) = 把 p 的根挂到 q 的根下，一行 <code>id[rootP]=rootQ<\/code>。<\/p>\n<p><strong>问题<\/strong>：树可能退化成一条链（节点按 0→1→2…顺序 union），find 爬 N 步，又退回 O(N)。<\/p>\n<h3>概念 4：加权 quick-union（难度：进阶）<\/h3>\n<p><strong>加权（weighted）<\/strong>：不只挂根，而是记录每棵树大小 <code>sz[]<\/code>，<strong>总是把小树挂到大树根下<\/strong>——保持树矮。<\/p>\n<p>原书命题 H：N 个触点构造的森林中，任意节点深度最多 <strong>lg N<\/strong>。推论：find/connected/union 最坏 <strong>对数级别<\/strong>。这是三种朴素算法里唯一&quot;能用&quot;的。<\/p>\n<pre class=\"lang-java\"><code>// 核心：union 时比大小\nif (sz[i] &lt; sz[j]) { id[i]=j; sz[j]+=sz[i]; }\nelse               { id[j]=i; sz[i]+=sz[j]; }<\/code><\/pre>\n<h3>概念 5：路径压缩（难度：高难）<\/h3>\n<p><strong>路径压缩（path compression）<\/strong>：find 爬到根之后，顺便把一路上经过的节点直接指向根——下次再找它们一步到位。加了路径压缩的加权 quick-union，任意操作序列<strong>均摊成本接近常数<\/strong>（反阿克曼函数级别，工程上视为常数）。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[&quot;union(p,q) 读入关系对&quot;] --&gt; B[&quot;find(p) 爬根&quot;]\n    B --&gt; C[&quot;find(q) 爬根&quot;]\n    C --&gt; D{&quot;根相同?&quot;}\n    D -- 是 --&gt; E[&quot;已连通，跳过&quot;]\n    D -- 否 --&gt; F[&quot;小树挂大树根下(加权)&quot;]\n    F --&gt; G[&quot;下次 find 顺带路径压缩&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：每一步 union 都先找两边的根，再把矮树接高树。两个优化叠加：树天然矮（加权）+ 被走过的路变短（压缩）。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：氏族族谱。每个村记自己的族长（根）；合并两族时，小族并入大族（加权），避免大族被小族拖长；年轻人每去族长那报到一次，就直接把自己户口本上写族长名（路径压缩）。<em>失效边界<\/em>：连通必须可传递——若 p-q、q-r 连通却不算 p-r 连通，这套模型就不成立。\n<\/li><li>\n<strong>实例<\/strong>：触点 0~9，依次 union(4,3)、union(3,8)、union(6,5)… 加权后树高始终 ≤ lg10≈3.3。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为<\/strong> quick-find 的 <code>connected<\/code> 快就整体快——实际上它的 union 是 O(N)，整体 O(N²)，对大规模输入不可用。\n<\/li><li>\n<strong>别以为<\/strong>加权 quick-union 就是&quot;最快&quot;——它只是对数级；路径压缩才把它推到近似常数。\n<\/li><li>\n<strong>别以为<\/strong>并查集存的是&quot;图&quot;——实际上它故意<strong>不存边的顺序信息<\/strong>，只维护连通关系，这是它轻量的原因。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\nquick-find 的 union 为什么慢？（答案：要扫描整个 id[] 把 p 分量全部改成 q 分量，O(N)；解析。）\n<\/li><li>\n加权 quick-union 中&quot;加权&quot;指什么？（答案：记录树大小，把小树挂到大树根下；解析：防止树退化成链。）\n<\/li><li>\n加权 quick-union 保证任意节点深度不超过？（答案：lg N；解析：命题 H。）\n<\/li><li>\n路径压缩在哪一步&quot;顺便&quot;做？（答案：find 爬到根后把路径上节点直接指向根；解析：不改算法骨架，只加优化。）\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n动态连通性：union / find / connected 三操作。\n<\/li><li>\n演化链：quick-find(N²) → quick-union(可能链) → 加权 QU(lg N) → +路径压缩（近似常数）。\n<\/li><li>\n两个优化口诀：小树挂大树、路过压平。\n<\/ul>", "ch02a": "<h1>第 2 章（2.1）：初级排序算法——选择、插入、希尔<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★☆☆ | <strong>预估学时<\/strong>：2.5 小时 | <strong>前置<\/strong>：ch01d\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本节，你能：<\/p>\n<ol><li>\n说出排序的&quot;游戏规则&quot;（可比较、不可交换性、排序成本=比较+交换）；\n<\/li><li>\n手推<strong>选择排序<\/strong>、<strong>插入排序<\/strong>的过程与成本；\n<\/li><li>\n说清<strong>希尔排序<\/strong>用 h 间隔分组为什么能突破平方级。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>选择排序&quot;每轮挑最小的放前面&quot;，插入排序&quot;像打扑克牌摸牌一张张插对位置&quot;，希尔排序让插入排序先远距离粗调再近距离细调。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：排序的游戏规则（难度：基础）<\/h3>\n<ul><li>\n<strong>比较（compare）<\/strong>：两个元素比大小；<strong>交换（exchange）<\/strong>：互换两个位置。排序总成本 = 比较次数 + 交换次数。\n<\/li><li>\n<strong>倒置（inversion）<\/strong>：数组中一对顺序反了的元素。插入排序的交换次数正好等于倒置数量——这是本章最有用的等式。\n<\/ul>\n<h3>概念 2：选择排序（selection sort，难度：基础）<\/h3>\n<p>每轮从剩余未排部分里<strong>选最小<\/strong>，换到最前面。N 个元素要 N-1 轮，每轮扫一遍剩余元素。<\/p>\n<p><strong>成本<\/strong>：比较 <code>~N²/2<\/code> 次，交换 <code>N-1<\/code> 次（原书结论）。交换最少，但比较省不掉——无论输入如何都是平方级。<\/p>\n<h3>概念 3：插入排序（insertion sort，难度：基础）<\/h3>\n<p>像摸扑克牌：左手牌已排好，摸新牌时从右往左找到自己位置插进去。<\/p>\n<p><strong>成本<\/strong>（原书命题）：平均（随机数组）比较和交换各 <code>~N²/4<\/code>；<strong>对部分有序的数组近乎线性<\/strong>——交换次数=倒置数，倒置少就快。这就是&quot;插入排序近乎线性&quot;的由来。<\/p>\n<h3>概念 4：希尔排序（shellsort，难度：高难）<\/h3>\n<p>插入排序的痛点：元素要一步一步挪到远处，倒置距离大时极慢。<strong>希尔排序<\/strong>先按 <strong>h 间隔<\/strong>分组（h 取 13, 4, 1…递减），每组内部先做插入排序，让元素<strong>远距离<\/strong>快速到位；最后 h=1 时数组已基本有序，插入排序接近线性。<\/p>\n<p>原书结论：用递增序列 1, 4, 13, 40, 121… 时，比较次数不超 N 的若干倍（<strong>突破了平方级<\/strong>），但严格平均次数数学上尚未完全解决。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    subgraph 插入排序摸牌\n        A[&quot;已排: 2 5 9&quot;] --&gt; B[&quot;摸入 7&quot;]\n        B --&gt; C[&quot;7 和 9 比→交换，和 5 比→停&quot;]\n        C --&gt; D[&quot;结果: 2 5 7 9&quot;]\n    end<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：新牌 7 只需向左比较两次就到位——这就是插入排序&quot;从右往左找位置&quot;的全过程。<\/p>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n    A[&quot;h=4 分组粗排&quot;] --&gt; B[&quot;h=13? 反向递减: h=大间隔&quot;] --&gt; C[&quot;h=1 精细插入&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：希尔排序 = 大间隔先把远距离乱序治好，小间隔收尾。避免插入排序&quot;一次只能挪一格&quot;。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比（插入）<\/strong>：打扑克牌摸牌，新牌永远插进左手已有序牌堆的正确位置。<em>失效边界<\/em>：当牌堆完全逆序时，每摸一张都要插到最左，退化为 O(N²)。\n<\/li><li>\n<strong>实例<\/strong>：数组 <code>[5, 2, 7, 1]<\/code>，插入排序过程：5 不动；2 与 5 交换→<code>[2,5,7,1]<\/code>；7 不动；1 依次与 7、5、2 交换→<code>[1,2,5,7]<\/code>。共 4 次交换 = 倒置数（(5,2)(5,1)(2,1)(7,1)）。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为<\/strong>插入排序总是平方级——实际上对<strong>基本有序<\/strong>的数组它是线性的，所以希尔排序收尾时它飞快。\n<\/li><li>\n<strong>别以为<\/strong>选择排序&quot;选最小&quot;听起来聪明所以快——实际上它每轮必扫全部剩余元素，比较次数无论输入都 ~N²/2。\n<\/li><li>\n<strong>别以为<\/strong>希尔排序的复杂度有定论——实际上平均比较次数至今没有简洁准确解，本书只给经验界。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n插入排序的交换次数等于什么？（答案：数组中倒置的数量；解析：每消除一个倒置恰好一次交换。）\n<\/li><li>\n选择排序 N 个元素要多少次交换？（答案：N-1 次；解析：每轮最多换一次，共 N-1 轮。）\n<\/li><li>\n希尔排序为什么用递减 h 序列？（答案：大间隔让元素远距离快速就位，小间隔收尾时数组已基本有序；解析。）\n<\/li><li>\n对&quot;几乎已经有序&quot;的数组，插入排序的成本接近？（答案：线性 O(N)；解析：倒置数少，交换少。）\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n选择排序：选最小放前面，比较 ~N²/2。\n<\/li><li>\n插入排序：摸牌式插入，交换=倒置数，近乎有序时线性。\n<\/li><li>\n希尔：h 间隔分组插入，突破平方级。\n<\/ul>", "ch02b": "<h1>第 2 章（2.2）：归并排序——分治的第一次胜利<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：3 小时 | <strong>前置<\/strong>：ch01a（递归）、ch02a\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本节，你能：<\/p>\n<ol><li>\n说清&quot;归并&quot;（merge）操作：两个有序数组合并成一个有序数组；\n<\/li><li>\n写出自顶向下归并排序的递归骨架，并推导它的比较次数 ~N lg N；\n<\/li><li>\n理解为什么&quot;基于比较的排序&quot;不可能快过 ~N lg N（下界）。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>归并排序 = 把数组劈成两半各自排序，再把两个有序半场&quot;合并&quot;成一个——用 O(N) 合并换 O(N log N) 的总保证。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：归并（merge，难度：基础）<\/h3>\n<p><strong>归并<\/strong>：前提是左右两半<strong>已经各自有序<\/strong>。用三个指针 i、j、k：比 <code>a[i]<\/code> 和 <code>a[j]<\/code>，小的先放进辅助数组，对应指针前进一步，直到半边走完，把另半边尾巴直接接上。<\/p>\n<pre class=\"lang-java\"><code>// 原地归并的抽象方法：a[lo..mid] 和 a[mid+1..hi] 已有序\npublic static void merge(Comparable[] a, int lo, int mid, int hi) {\n    int i = lo, j = mid+1;\n    for (int k = lo; k &lt;= hi; k++) aux[k] = a[k];   // 复制到辅助数组\n    for (int k = lo; k &lt;= hi; k++) {\n        if      (i &gt; mid)        a[k] = aux[j++];   // 左半用完，取右半\n        else if (j &gt; hi)         a[k] = aux[i++];   // 右半用完，取左半\n        else if (less(aux[j], aux[i])) a[k] = aux[j++];\n        else                    a[k] = aux[i++];\n    }\n}<\/code><\/pre>\n<h3>概念 2：自顶向下归并排序（merge sort，难度：进阶）<\/h3>\n<p>递归骨架：<\/p>\n<pre class=\"lang-java\"><code>public static void sort(Comparable[] a, int lo, int hi) {\n    if (hi &lt;= lo) return;                 // 基准条件：单元素已有序\n    int mid = lo + (hi - lo)/2;\n    sort(a, lo, mid);                     // 排左半\n    sort(a, mid+1, hi);                   // 排右半\n    merge(a, lo, mid, hi);                // 合并\n}<\/code><\/pre>\n<p><strong>成本推导（可复核）<\/strong>：设长度 N=2ⁿ。每层递归合并总共处理 N 个元素，共 lg N 层 → 比较次数 <strong>~N lg N<\/strong>（原书命题 H：最坏 ~N lg N）。<\/p>\n<h3>概念 3：下界——为什么不可能更快（难度：高难）<\/h3>\n<p><strong>基于比较的排序<\/strong>每次比较只有&quot;大/小&quot;两个结果，相当于在一棵二叉决策树上走一条路径。N 个元素有 N! 种排列，决策树至少要 N! 个叶子 → 树高至少 log₂(N!) ~ N lg N。这就是原书命题 I：<strong>任何基于比较的排序，最坏比较次数 ≥ ~N lg N<\/strong>。归并排序已顶到这个理论天花板。<\/p>\n<h3>概念 4：自底向上归并（难度：进阶）<\/h3>\n<p>不递归：先两两归并（sz=1），再四、再八……直到整体有序。代码更短，结果一样。<\/p>\n<h3>概念 5：改进（难度：进阶）<\/h3>\n<ul><li>\n小数组改用插入排序（递归到 sz&lt;10 时）；\n<\/li><li>\n若 <code>a[mid] &lt;= a[mid+1]<\/code>，说明两半本已有序，跳过 merge。\n<\/ul>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[&quot;[5,2,7,1]&quot;] --&gt; B[&quot;劈半: [5,2] ｜ [7,1]&quot;]\n    B --&gt; C[&quot;左半排: [2,5]&quot;]\n    B --&gt; D[&quot;右半排: [1,7]&quot;]\n    C --&gt; E[&quot;merge: [1,2,5,7]&quot;]\n    D --&gt; E<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：分治三步——分（劈半）、治（递归排序两半）、合（归并）。每一层合起来共做 N 次比较，共 lg N 层。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：整理一摞试卷。先劈成两摞各整理好，再把两摞已排序的试卷从头比、按顺序合成一摞。<em>失效边界<\/em>：归并要求两半各自有序，乱序合并没意义。\n<\/li><li>\n<strong>实例<\/strong>：<code>[2,5]<\/code> 与 <code>[1,7]<\/code> 归并：比 2 vs 1 → 取 1；比 2 vs 7 → 取 2；比 5 vs 7 → 取 5；左半完，接 7 → <code>[1,2,5,7]<\/code>。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为<\/strong>归并排序是&quot;原地排序&quot;——实际上它需要一个等大的辅助数组 aux[]，空间 O(N)。\n<\/li><li>\n<strong>别以为<\/strong>快排一定比归并好——实际上归并有最坏 O(N log N) 保证，快排最坏 O(N²)；归并胜在稳定保证，快排胜在常数小。\n<\/li><li>\n<strong>别以为<\/strong>归并比较次数是 2N lg N——实际上约 N lg N 量级，每合并层最多 N 次比较。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n归并排序为什么需要辅助数组？（答案：合并时要把左右两半按序写回原数组，直接写会覆盖还没读的元素；解析：故先复制到 aux。）\n<\/li><li>\nN=8 时归并排序大约比较多少次？（答案：~8×3=24 次；解析：lg8=3 层，每层 ~8 次比较。）\n<\/li><li>\n基于比较的排序的理论下界是？（答案：~N lg N 次比较；解析：决策树叶子数 ≥ N!，树高 ≥ log₂N! ~ N lg N。）\n<\/li><li>\n归并排序最坏时间复杂度是？（答案：O(N log N)；解析：命题 H。）\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n归并 = 两个有序半场合并，O(N)。\n<\/li><li>\n分治：劈半→递归排→合并，总 ~N lg N。\n<\/li><li>\n比较排序下界 ~N lg N，归并已触顶。\n<\/ul>", "ch02c": "<h1>第 2 章（2.3）：快速排序——最常用的通用排序<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：3 小时 | <strong>前置<\/strong>：ch02b\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本节，你能：<\/p>\n<ol><li>\n说清<strong>切分（partition）<\/strong>：选一个基准，把小的扔左边、大的扔右边；\n<\/li><li>\n推导快排平均比较次数 ~1.39 N lg N，说出最坏情况为什么是 O(N²)；\n<\/li><li>\n讲出两个经典改进：<strong>随机打乱<\/strong>与<strong>三向切分<\/strong>。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>快排 = 选个基准把数组&quot;分两边&quot;（比它小的左、比它大的右），再对两边递归排序；切分是灵魂。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：切分（partition，难度：进阶）<\/h3>\n<p>选 <code>a[lo]<\/code> 为基准 pivot。从左向右找第一个 ≥ pivot 的，从右向左找第一个 ≤ pivot 的，两者交换；两指针相遇时，pivot 换到相遇点。切分后：左边全 ≤ pivot，右边全 ≥ pivot，且 pivot 已在<strong>最终位置<\/strong>上。<\/p>\n<pre class=\"lang-java\"><code>private static int partition(Comparable[] a, int lo, int hi) {\n    int i = lo, j = hi+1;\n    Comparable v = a[lo];              // 基准\n    while (true) {\n        while (less(a[++i], v)) if (i==hi) break;   // 左找 &gt;=v\n        while (less(v, a[--j])) if (j==lo) break;   // 右找 &lt;=v\n        if (i &gt;= j) break;\n        exch(a, i, j);                 // 交换逆序对\n    }\n    exch(a, lo, j);                    // 基准归位\n    return j;\n}<\/code><\/pre>\n<h3>概念 2：递归骨架与成本（难度：进阶）<\/h3>\n<pre class=\"lang-java\"><code>public static void sort(Comparable[] a, int lo, int hi) {\n    if (hi &lt;= lo) return;\n    int j = partition(a, lo, hi);   // 切分点 j 已就位\n    sort(a, lo, j-1);              // 排左半（不含 j）\n    sort(a, j+1, hi);              // 排右半\n}<\/code><\/pre>\n<p><strong>成本<\/strong>（原书）：平均比较次数 <strong>~2N ln N ≈ 1.39 N lg N<\/strong>——只比最好情况多 39%。但<strong>最坏情况<\/strong>（数组已有序，pivot 永远选到最小/最大）切分极度不均 → O(N²)。<\/p>\n<h3>概念 3：改进 1——随机打乱（难度：基础）<\/h3>\n<p>排序前先把数组随机洗牌。这样&quot;最坏切分&quot;的概率变成像被雷劈，实际等同于概率保证。本书名言：随机化让快排最坏情况概率可忽略。<\/p>\n<h3>概念 4：改进 2——三向切分（Dijkstra，难度：高难）<\/h3>\n<p>大量重复键时普通切分退化。<strong>三向切分<\/strong>：分三区——<code>&lt;v<\/code>、<code>=v<\/code>、<code>&gt;v<\/code>，等于基准的元素一次归位不再参与递归。原书结论：三向切分在含大量重复键时<strong>比归并快得多<\/strong>。Java 系统排序对原始类型用的就是三向切分快排。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[&quot;[5,2,9,1,7]&quot;] --&gt; B[&quot;pivot=5&quot;]\n    B --&gt; C[&quot;切分: 左[2,1] ｜ 5 ｜ 右[9,7]&quot;]\n    C --&gt; D[&quot;递归排左: [1,2]&quot;]\n    C --&gt; E[&quot;递归排右: [7,9]&quot;]\n    D --&gt; F[&quot;合并结果: [1,2,5,7,9]&quot;]\n    E --&gt; F<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：每次切分把基准放到最终位置，左右两边独立递归。理想切分对半分 → N lg N 层。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：运动会分组——选一个身高当&quot;门槛&quot;，比他矮的站左、比他高的站右；左右两组再各自选门槛。<em>失效边界<\/em>：如果每次门槛都选到最矮（已有序数组），分组一边空一边长，退化成 O(N²)。\n<\/li><li>\n<strong>实例<\/strong>：<code>[5,2,9,1,7]<\/code>，pivot=5。切分后 <code>[2,1 | 5 | 9,7]<\/code>，递归左右 → 最终有序。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为<\/strong>快排平均和归并一样快——实际上快排平均 1.39 N lg N，常数比归并小，工程上更快；但它有最坏 O(N²)。\n<\/li><li>\n<strong>别以为<\/strong>三向切分是为了对付随机数据——实际上它专治<strong>大量重复键<\/strong>；无重复时优势不明显。\n<\/li><li>\n<strong>别以为<\/strong>快排是稳定排序——实际上切分交换会跳过相等元素，<strong>不稳定<\/strong>。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n切分后基准元素处于什么状态？（答案：已位于它在最终排好序数组中的正确位置；解析。）\n<\/li><li>\n快排平均比较次数约为？（答案：~1.39 N lg N（即 2N ln N）；解析。）\n<\/li><li>\n快排最坏复杂度及诱因？（答案：O(N²)；当输入已有序导致每次切分极度不均；解析：故先随机打乱。）\n<\/li><li>\n三向切分把数组分成哪三段？（答案：小于 v、等于 v、大于 v；解析：等于段一次归位。）\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n快排灵魂 = partition：小左大右，基准归位。\n<\/li><li>\n平均 1.39 N lg N；最坏 N²（已序输入）。\n<\/li><li>\n两味解药：随机洗牌、三向切分。\n<\/ul>", "ch02d": "<h1>第 2 章（2.4）：优先队列与堆排序<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：3 小时 | <strong>前置<\/strong>：ch01c、ch02b\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本节，你能：<\/p>\n<ol><li>\n说清<strong>优先队列<\/strong>和普通队列的区别（按优先级出队，不是按先后）；\n<\/li><li>\n理解<strong>堆（heap）<\/strong>的数组表示：父下标 i 的孩子是 2i、2i+1；\n<\/li><li>\n写出 swim/sink 两个堆操作，并说出堆排序的 O(N log N)。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>堆是一颗&quot;父总比孩子大&quot;的完全二叉树，存在数组里；优先队列靠它取最值只需 O(log N)，堆排序就是&quot;建堆 + 反复删顶&quot;。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：优先队列（priority queue，难度：基础）<\/h3>\n<p><strong>优先队列<\/strong>：取出的不是最早入队的，而是<strong>优先级最高（最大或最小）<\/strong>的元素。API：<code>insert<\/code>（插入）、<code>delMax<\/code>（删去并返回最大）。<\/p>\n<p>类比：医院急诊——不是挂号先后来，而是重伤员先看。<em>失效边界<\/em>：它不支持&quot;按优先级查找任意元素&quot;，只取极值。<\/p>\n<h3>概念 2：堆的定义（heap，难度：进阶）<\/h3>\n<p><strong>二叉堆（binary heap）<\/strong>：一颗完全二叉树，每个节点 ≥ 它的两个孩子（<strong>堆有序<\/strong>）。用数组表示，根在 <code>a[1]<\/code>（下标 0 留空）：<\/p>\n<ul><li>\n节点 i 的父亲：<code>i/2<\/code>；\n<\/li><li>\n节点 i 的孩子：<code>2i<\/code> 和 <code>2i+1<\/code>。\n<\/ul>\n<p>&quot;完全二叉树&quot;= 每一层都填满，最后一层只靠左填。<\/p>\n<h3>概念 3：swim 与 sink（难度：进阶）<\/h3>\n<ul><li>\n<strong>swim（上浮）<\/strong>：新元素加到末尾，若比父亲大就和父亲交换，一路浮到合适位置。\n<\/ul>\n<pre class=\"lang-java\"><code>private void swim(int k) {\n    while (k &gt; 1 &amp;&amp; less(k/2, k)) { exch(k, k/2); k = k/2; }\n}<\/code><\/pre>\n<ul><li>\n<strong>sink（下沉）<\/strong>：若节点比孩子小，和较大的那个孩子交换，一路沉下去。\n<\/ul>\n<pre class=\"lang-java\"><code>private void sink(int k) {\n    while (2*k &lt;= N) {\n        int j = 2*k;\n        if (j &lt; N &amp;&amp; less(j, j+1)) j++;   // 选较大孩子\n        if (!less(k, j)) break;\n        exch(k, j); k = j;\n    }\n}<\/code><\/pre>\n<p>树高 ≤ lg N，所以 swim/sink 都是 O(log N)。<\/p>\n<h3>概念 4：堆排序（heapsort，难度：高难）<\/h3>\n<p>两步：<\/p>\n<ol><li>\n<strong>建堆<\/strong>：从右半数组开始逐个 sink（<code>for k=N/2 … 1<\/code>），O(N)；\n<\/li><li>\n<strong>排序<\/strong>：把堆顶（最大值）<code>a[1]<\/code> 换到末尾 a[N]，缩小堆大小后 sink(1)，重复——像&quot;选择排序的高效版&quot;。\n<\/ol>\n<p>总成本 <strong>O(N log N)<\/strong>，原地排序（O(1) 额外空间）。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    R[&quot;a[1]=10 根(最大)&quot;] --&gt; L[&quot;a[2]=8&quot;]\n    R --&gt; RR[&quot;a[3]=9&quot;]\n    L --&gt; L1[&quot;a[4]=3&quot;]\n    L --&gt; L2[&quot;a[5]=5&quot;]\n    RR --&gt; R1[&quot;a[6]=2&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：父 ≥ 子。根 10 是全队最大；数组 [_,10,8,9,3,5,2]，下标关系 1→(2,3)、2→(4,5)、3→(6) 一目了然。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：锦标赛赛制。冠军（根）总是最强；淘汰一个冠军后，让亚军&quot;上浮&quot;补位（swim/sink）。<em>失效边界<\/em>：堆只保证根最大，不保证左右子树之间有大小关系。\n<\/li><li>\n<strong>实例<\/strong>：插入 3、1、2。swim 后堆 [_,3,1,2]；delMax 取出 3，把末尾 2 换到根后 sink → [_,2,1]。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为<\/strong>堆是&quot;有序数组&quot;——实际上堆只保证根是最值，兄弟之间无序。\n<\/li><li>\n<strong>别以为<\/strong>优先队列就是排序——实际上它只吐最值，中间元素保持乱序即可，比全排序便宜。\n<\/li><li>\n<strong>别以为<\/strong>堆排序有 O(N) 可能——实际上建堆 O(N)，但 N 次 delMax 每次 O(log N)，总 O(N log N)。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n下标 5 的节点，它的父亲和两个孩子下标是？（答案：父亲 2，孩子 10、11；解析：父=i/2，孩子=2i、2i+1。）\n<\/li><li>\nswim 和 sink 各是什么作用？（答案：swim 把过大的叶子上浮到合规位置；sink 把过小的根下沉；解析。）\n<\/li><li>\n堆排序总时间复杂度？（答案：O(N log N)；解析：N 次 delMax 各 O(log N)。）\n<\/li><li>\n堆是稳定排序吗？（答案：不稳定；解析：交换跨节点会破坏相等元素顺序。）\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n优先队列：按最值出队；堆 = 父 ≥ 子的完全二叉树。\n<\/li><li>\nswim/sink：对数级维护堆有序。\n<\/li><li>\n堆排序：建堆 O(N) + N 次删顶 O(N log N)，原地。\n<\/ul>", "ch02e": "<h1>第 2 章（2.5）：排序应用与&quot;我该用哪种排序&quot;<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★☆☆ | <strong>预估学时<\/strong>：1.5 小时 | <strong>前置<\/strong>：ch02a~ch02d\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本节，你能：<\/p>\n<ol><li>\n说清<strong>Comparable 接口<\/strong>与多种数据排序的方式；\n<\/li><li>\n根据场景选择排序算法（原书 2.5.2 的选型表）；\n<\/li><li>\n理解<strong>问题归约（reduction）<\/strong>思想：把新问题翻译成已解决的问题。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>排序不是目的而是工具——求中位数、去重、二分查找全都先排序；选型口诀：通用快排，稳定用归并，内存紧用堆。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：排序任意数据类型（难度：基础）<\/h3>\n<p>让类实现 <code>Comparable<\/code> 接口的 <code>compareTo<\/code> 方法，排序函数就能对该类数组排序。关键抽象：排序只依赖&quot;能比大小&quot;，与具体数据无关。<\/p>\n<h3>概念 2：选型表（原书 2.5.2，难度：基础）<\/h3>\n<table><thead><tr><th>算法<\/th><th>平均<\/th><th>最坏<\/th><th>额外空间<\/th><th>稳定？<\/th><th>一句话<\/th><\/tr><\/thead><tbody><tr><td>选择排序<\/td><td>N²/2<\/td><td>N²/2<\/td><td>1<\/td><td>否<\/td><td>交换最少，但无论输入都慢<\/td><\/tr><tr><td>插入排序<\/td><td>N²/4<\/td><td>N²<\/td><td>1<\/td><td>是<\/td><td>基本有序时线性<\/td><\/tr><tr><td>希尔排序<\/td><td>N^{?}（突破平方）<\/td><td>？<\/td><td>1<\/td><td>否<\/td><td>中等规模实用<\/td><\/tr><tr><td>归并排序<\/td><td>N lg N<\/td><td>N lg N<\/td><td>N<\/td><td>是<\/td><td>有保证、稳定，代价是空间<\/td><\/tr><tr><td>快速排序<\/td><td>1.39 N lg N<\/td><td>N²<\/td><td>lg N<\/td><td>否<\/td><td>通用最快，需随机化<\/td><\/tr><tr><td>三向快排<\/td><td>N（大量重复键）<\/td><td>N²<\/td><td>lg N<\/td><td>否<\/td><td>Java 原始类型系统排序<\/td><\/tr><tr><td>堆排序<\/td><td>2N lg N<\/td><td>2N lg N<\/td><td>1<\/td><td>否<\/td><td>原地 + 最坏保证<\/td><\/tr><\/tbody><\/table>\n<p><strong>Java 库的选择<\/strong>（原书）：对原始数据类型用三向切分快排，对引用类型用归并排序（因为引用排序要稳定）。<\/p>\n<h3>概念 3：问题归约（reduction，难度：进阶）<\/h3>\n<p><strong>归约<\/strong>：把问题 A 翻译成已有解的问题 B。例：<\/p>\n<ul><li>\n找中位数 → 排序后取中间；\n<\/li><li>\n去重 → 排序后扫一遍删相邻重复；\n<\/li><li>\n二分查找 → 先排序再查找。\n<p>原书强调：归约是算法设计最重要的通用工具之一。<\/p>\n<\/ul>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n    Q[&quot;你的问题&quot;] --&gt; R{&quot;能归约为排序?&quot;}\n    R -- 是 --&gt; S[&quot;先排序再处理&quot;]\n    R -- 否 --&gt; O[&quot;另寻算法&quot;]\n    S --&gt; T[&quot;选型: 通用快排/稳定归并/省内存堆&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：遇到新问题先问&quot;能不能变成排序问题&quot;——这是全书反复出现的思维路径。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：把&quot;算平均工资&quot;归约为&quot;先按工号排序工资表再求均值&quot;——排序是预处理工序。<em>失效边界<\/em>：归约后的解法必须真能反解原问题，不能丢信息。\n<\/li><li>\n<strong>实例<\/strong>：一组成绩求前 K 名——排序取前 K（O(N log N)），或用大小 K 的优先队列（O(N log K)）。后者在 K≪N 时更优。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为<\/strong>Java 内部排序对所有类型都用同一种——实际上原始类型用三向快排、引用类型用归并，差别就在稳定性需求。\n<\/li><li>\n<strong>别以为<\/strong>堆排序没用——实际上它是唯一&quot;原地 + O(N log N) 最坏保证&quot;的排序，对实时系统（不能容忍偶发慢）不可替代。\n<\/li><li>\n<strong>别以为<\/strong>归约只是&quot;偷懒&quot;——实际上它让一个问题的算法进展自动惠及一类问题，是算法理论的核心方法。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\nJava 对 <code>int[]<\/code> 和 <code>String[]<\/code> 分别默认用什么排序？（答案：原始类型 int 用三向快排；引用类型 String 用归并；解析：引用排序要稳定。）\n<\/li><li>\n内存极度紧张且要 O(N log N) 最坏保证，选？（答案：堆排序；解析：原地 O(1) 额外空间。）\n<\/li><li>\n&quot;求数组中第 K 大的数&quot;如何归约？（答案：排序后取倒数第 K 个；解析：或用大小 K 的优先队列更优。）\n<\/li><li>\n哪种排序是稳定的？（答案：插入排序、归并排序；解析：选择、希尔、快排、堆排序不稳定。）\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n选型：通用快排；稳定归并；内存紧堆；近乎有序插排。\n<\/li><li>\n问题归约 = 把新问题翻译成排序问题。\n<\/li><li>\nJava：原始类型三向快排，引用类型归并。\n<\/ul>", "ch03a": "<h1>第 3 章（3.1）：符号表——查找问题的接口与朴素实现<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★☆☆ | <strong>预估学时<\/strong>：2 小时 | <strong>前置<\/strong>：ch01a（二分查找）、ch01c\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本节，你能：<\/p>\n<ol><li>\n说清<strong>符号表（symbol table）<\/strong>的 API：put/get/delete/contains/size/keys；\n<\/li><li>\n区分有序与无序符号表；\n<\/li><li>\n用链表顺序查找和有序数组二分查找两种朴素实现，知道它们的成本。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>符号表就是&quot;键值对字典&quot;：给个 key 取回 value；最朴素的两版是无序链表（O(N)）和有序数组（O(log N) 查找但插入慢）。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：符号表 API（难度：基础）<\/h3>\n<p><strong>符号表<\/strong>：存储一组键值对 (key, value) 的 ADT。核心操作：<\/p>\n<ul><li>\n<code>put(key, value)<\/code>：存入/更新；\n<\/li><li>\n<code>get(key)<\/code>：取值，不存在返回 null；\n<\/li><li>\n<code>delete(key)<\/code>、<code>contains(key)<\/code>、<code>size()<\/code>、<code>keys()<\/code>（所有键）。\n<\/ul>\n<p><strong>约定<\/strong>：键不重复（同键后值覆盖前值）；null 不许作键。<\/p>\n<h3>概念 2：有序 vs 无序（难度：基础）<\/h3>\n<ul><li>\n<strong>无序符号表<\/strong>：键不排序，只支持最基本 get/put。\n<\/li><li>\n<strong>有序符号表<\/strong>：键保持有序，额外支持 <code>min/max<\/code>（最小/最大键）、<code>floor<\/code>（≤ key 的最大键）、<code>rank<\/code>（小于 key 的键数）、<code>select(k)<\/code>（第 k 小）、<code>deleteMin/deleteMax<\/code>、范围查询 <code>keys(lo,hi)<\/code>。\n<\/ul>\n<h3>概念 3：无序链表顺序查找（难度：基础）<\/h3>\n<p>链表存键值对，get 从头逐个比，找到才停；put 也得先扫一遍看键是否已存在。<strong>查找和插入都 O(N)<\/strong>——N 条条目最坏扫到底。<\/p>\n<h3>概念 4：有序数组 + 二分查找（难度：进阶）<\/h3>\n<p>两个平行数组：<code>keys[]<\/code> 有序，<code>vals[]<\/code> 对应。get 用第 1 章的二分查找——<strong>O(log N)<\/strong>。 但 put 要把新键插到正确位置并搬移后面的元素——<strong>O(
