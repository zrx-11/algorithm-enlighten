]\n    B --&gt; C[最优解必在顶点]\n    C --&gt; D[单纯形: 从顶点走到目标更优的相邻顶点]\n    D --&gt; E[找不到更好邻居 ⇒ 最优]\n    A --&gt; F[对偶: min bᵀy, Aᵀy≥c]\n    F --&gt; G[强对偶: 原最优值 = 对偶最优值]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：单纯形法在「面」上爬；对偶从「定价」角度给出同样的最优值，两者互为验证。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：LP 像「用有限预算（约束）安排生产组合（变量）最大化利润（目标）」。可行域是所有「不超预算」的组合构成的多边形；最优解一定在角上。<strong>失效边界<\/strong>：目标或约束一旦非线性（如 x²），就不是 LP 了，要用二次规划等。\n<\/li><li>\n<strong>实例<\/strong>：两种产品 A(利润 $3)、B(利润 $5)，资源约束 2A+B≤10、A+2B≤8。顶点 (0,0)=0、(5,0)=15、(0,4)=20、(4,2)=22 ⇒ 最优 A=4,B=2，利润 22。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为「单纯形法是多项式算法」<\/strong>——它的最坏复杂度是指数的，但实际几乎总是极快；椭球法才是理论多项式算法。\n<\/li><li>\n<strong>别以为「最优解一定在内部」<\/strong>——实际上线性目标在凸多面体上的最优总在某个顶点/边上面。\n<\/li><li>\n<strong>别以为「对偶问题只是附属品」<\/strong>——实际上对偶能给出资源的影子价格，且强对偶是 LP 的核心定理。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n（单选）线性规划的最优解一定在什么位置取到？（答案：C；解析：可行域的某个顶点）\n<ul>\n<li>\nA. 内部任意点   B. 边上中点   C. 顶点   D. 圆心\n<\/li><li>\n（单选）强对偶说的是？（答案：B；解析：原问题与对偶问题最优值相等）\n<\/li><li>\nA. 原问题无解   B. 原对偶最优值相等   C. 目标系数为 0   D. 约束全相等\n<\/li><li>\n（填空）把不等式约束变等式要引入__变量。（答案：松弛；解析：松弛变量≥0 把 ≤ 变等式）\n<\/li><li>\n（简答）单纯形法每一步在做什么？（答案：选一个能改善目标的非基变量进基，按最紧约束确定它的增量让某基变量出基，走到相邻顶点）\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n标准型 max cᵀx s.t. Ax≤b, x≥0；松弛型把不等式变等式。\n<\/li><li>\n单纯形法沿可行域顶点爬坡；最坏指数、实际极快。\n<\/li><li>\n强对偶：原最优值 = 对偶最优值。\n<\/ul>", "ch30": "<h1>第 30 章：多项式与快速傅里叶变换<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：3.5 小时 | <strong>前置<\/strong>：复数幂、附录 A（求和）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说出多项式的「系数表示」与「点值表示」，以及为什么乘积在点值表示下更快。\n<\/li><li>\n写出 FFT 的分治思想（奇偶分组），说出它把 DFT 从 O(n²) 降到 O(n lg n)。\n<\/li><li>\n复述「系数 → 点值 → 乘积点值 → 逆 DFT → 乘积系数」整条流水线。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p><strong>普通多项式乘法是 O(n²)；FFT 把「求 n 个点的取值」这件事从 O(n²) 压到 O(n lg n)，于是整条乘法流水线（系数→点值→点乘→逆变换）只要 O(n lg n)。<\/strong><\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：多项式的两种表示（难度：基础）<\/h3>\n<ul><li>\n<strong>系数表示<\/strong>：A(x)=a₀+a₁x+…+a_{n-1}x^{n-1}，存 n 个系数。\n<\/li><li>\n<strong>点值表示<\/strong>：选 n 个不同点 x₀,…,x_{n-1}，存 (xₖ, A(xₖ)) 对。n 个点值唯一确定一个 n−1 次多项式（插值定理）。\n<p>为什么点值表示好？乘积 C(x)=A(x)B(x) 在点值下就是对应点值直接相乘：C(xₖ)=A(xₖ)·B(xₖ)，O(n) 搞定。<\/p>\n<\/ul>\n<h3>概念 2：DFT 与单位复根（难度：进阶）<\/h3>\n<p><strong>离散傅里叶变换（DFT）<\/strong>：给定系数，求它在 n 个 n 次单位复根 ωₖ = e^{2πik/n} 上的取值。 朴素求每个点值 O(n)，n 个点 O(n²)。但单位复根有个关键性质 ωₖ² = (n/2) 次单位复根——这给了分治的机会。<\/p>\n<h3>概念 3：FFT 分治（难度：高难）<\/h3>\n<p>把 A(x) 按奇偶系数拆开：<\/p>\n<ul><li>\nA⁽⁰⁾(x) = a₀ + a₂x + a₄x²+…（偶次项）\n<\/li><li>\nA⁽¹⁾(x) = a₁ + a₃x + a₅x²+…（奇次项）\n<p>则 A(x) = A⁽⁰⁾(x²) + x·A⁽¹⁾(x²)。 递归求 A⁽⁰⁾、A⁽¹⁾ 在 (ωₖ)² 这些 n/2 次根上的点值，再组合。复杂度递推 T(n)=2T(n/2)+O(n) ⇒ <strong>O(n lg n)<\/strong>。 <strong>逆 DFT<\/strong>：把 ω 换成 ω⁻¹、结果除以 n，同样用 FFT。<\/p>\n<\/ul>\n<h3>概念 4：完整乘法流水线（难度：进阶）<\/h3>\n<pre><code>A、B 系数表示\n  → FFT 求各自在 n 个单位根上的点值（补到 2n 长度）\n  → 对应点值相乘得 C 的点值（O(n)）\n  → 逆 FFT 把 C 的点值变回系数<\/code><\/pre>\n<p>总复杂度 <strong>O(n lg n)<\/strong>，远好于朴素 O(n²)。用途：大整数乘法、信号处理、卷积。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n    A[系数表示 A] --&gt;|FFT O(n lg n)| P1[点值表示]\n    B[系数表示 B] --&gt;|FFT| P2[点值表示]\n    P1 --&gt; M[对应点值相乘 O(n)]\n    P2 --&gt; M\n    M --&gt; C[乘积 C 点值]\n    C --&gt;|逆 FFT O(n lg n)| D[乘积系数 C]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：瓶颈不在「点乘」（O(n)），而在「系数↔点值」的转换；FFT 把这一步从 O(n²) 降到 O(n lg n)，整条流水线就快了。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：系数表示像「给一个人量身高体重」（要算），点值表示像「拍一组照片」（直接看）。乘法在「照片」空间里就是逐张照片相乘，再拍回来。<strong>失效边界<\/strong>：n 必须是 2 的幂（否则补零到最近的 2 的幂）。\n<\/li><li>\n<strong>实例<\/strong>：A(x)=1+2x，B(x)=3+4x。乘积 C=3+10x+8x²。在点值 x=1 处 A(1)=3、B(1)=7，C(1)=21=3+10+8，对得上。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为「FFT 是用来做信号处理的，跟算法课无关」<\/strong>——实际上它的本质是多项式快速乘法，信号处理只是其应用。\n<\/li><li>\n<strong>别以为「任意 n 都能直接 FFT」<\/strong>——标准 Cooley-Tukey FFT 要求 n 是 2 的幂，否则补零。\n<\/li><li>\n<strong>别以为「点值表示比系数表示省空间」<\/strong>——两者都是 n 个数；省的是「乘法」的时间，不是空间。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n（单选）FFT 把 DFT 的复杂度从 O(n²) 降到？（答案：C；解析：分治递推 T(n)=2T(n/2)+O(n)）\n<ul>\n<li>\nA. O(n)   B. O(n lg lg n)   C. O(n lg n)   D. O(n^{1.5})\n<\/li><li>\n（单选）两个多项式乘积在点值表示下怎么算？（答案：A；解析：对应点值直接相乘）\n<\/li><li>\nA. 对应点值相乘   B. 系数相加   C. 求导   D. 积分\n<\/li><li>\n（填空）FFT 分治利用了 ωₖ² 是__次单位复根的性质。（答案：n/2；解析：奇偶分组递归）\n<\/li><li>\n（简答）为什么逆 FFT 也是 FFT？（答案：把变换核 ω 换成 ω⁻¹ 再除以 n，分治结构完全一样）\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n系数表示 ↔ 点值表示；乘积在点值下 O(n)。\n<\/li><li>\nFFT 分治：奇偶拆分，O(n lg n)。\n<\/li><li>\n整条乘法流水线：FFT→点乘→逆 FFT，O(n lg n)。\n<\/ul>", "ch31": "<h1>第 31 章：数论算法<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：4 小时 | <strong>前置<\/strong>：附录 C（概率）、第 4 章（递归）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n用欧几里得算法求 gcd，并用扩展欧几里得求模逆元。\n<\/li><li>\n复述快速幂（反复平方）求 aᵇ mod n，以及中国余数定理。\n<\/li><li>\n说出 RSA 的加密/解密流程，并知道它安全性依赖于「大整数因子分解难」。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p><strong>数论算法的主角是「模运算」：用欧几里得求 gcd、用反复平方快速算 aᵇ mod n、用扩展欧几里得求逆元——RSA 就是把这套工具串起来的公钥加密系统。<\/strong><\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：整除、模与欧几里得算法（难度：基础）<\/h3>\n<ul><li>\n<strong>a 整除 b<\/strong>：存在整数 k 使 b=ka，记 a|b。\n<\/li><li>\n<strong>gcd(a,b)<\/strong>：同时整除 a、b 的最大整数。\n<\/li><li>\n<strong>欧几里得算法<\/strong>：gcd(a,b)=gcd(b, a mod b)，递归到 b=0。复杂度 O(lg a) 步。\n<\/li><li>\n<strong>扩展欧几里得<\/strong>：在求 gcd 的同时求出整数 x,y 使 ax+by=gcd(a,b)。若 gcd(a,n)=1，则 x 就是 a 在模 n 下的<strong>逆元<\/strong>（a·x ≡ 1 mod n）。\n<\/ul>\n<h3>概念 2：模运算与快速幂（难度：进阶）<\/h3>\n<p><strong>模运算<\/strong>：(a+b) mod n、(a·b) mod n 可先取模再算。 <strong>反复平方（exponentiation by squaring）<\/strong>：求 aᵇ mod n：把 b 写成二进制，逐位平方。 例：a¹³ = a⁸·a⁴·a¹（13=1101₂），只需 lg b 次乘法。复杂度 O(lg b) 次模乘。这是 RSA 加密/解密的核心。<\/p>\n<h3>概念 3：中国余数定理（CRT，难度：进阶）<\/h3>\n<p>若 n=n₁n₂…nₖ 且各 nᵢ 两两互素，则「模 n 的整数」与「各模 nᵢ 的整数组」一一对应。 白话：知道一个数除以 3 余 2、除以 5 余 3、除以 7 余 2，就能唯一确定它 mod 105。用途：把大数模运算拆成多个小数模运算并行算。<\/p>\n<h3>概念 4：RSA 与素数测试（难度：高难）<\/h3>\n<p><strong>RSA 公钥系统<\/strong>：<\/p>\n<ol><li>\n选两个大素数 p、q，n=pq，φ(n)=(p−1)(q−1)。\n<\/li><li>\n选 e 与 φ(n) 互素，求 d 使 ed≡1 mod φ(n)（扩展欧几里得）。\n<\/li><li>\n公钥 (e,n)：加密 c = mᵉ mod n；私钥 (d,n)：解密 m = cᵈ mod n。\n<p>安全性：从 (e,n) 求 d 需要先分解 n 得到 p、q——而大整数因子分解目前没有多项式时间算法。 <strong>素数测试<\/strong>：用 Miller-Rabin 随机测试（基于费马小定理），能在多项式时间内高概率判定一个数是否素数。<\/p>\n<\/ol>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[数论工具] --&gt; B[欧几里得: gcd, 扩展版求逆元]\n    A --&gt; C[反复平方: aᵇ mod n, O(lg b)]\n    A --&gt; D[CRT: 拆大数模为小数模]\n    B --&gt; E[RSA: 公钥(e,n)加密, 私钥(d,n)解密]\n    C --&gt; E\n    F[Miller-Rabin 素数测试] --&gt; E\n    G[安全性 = 大整数分解难] -.-&gt; E<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：欧几里得给逆元、快速幂给高效模幂、CRT 给并行加速；三者拼出 RSA。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：模运算像「钟表算术」——13 点就是 1 点（mod 12）。RSA 的公钥像「挂在门口的锁」（谁都能锁上），私钥像「只有你有的钥匙」（解密）。<strong>失效边界<\/strong>：p、q 不够大或选得太接近，因子分解就容易，RSA 被破。\n<\/li><li>\n<strong>实例<\/strong>：gcd(30,21)=gcd(21,9)=gcd(9,3)=gcd(3,0)=3。快速幂：3¹³ mod 7：3²=2, 3⁴=4, 3⁸=2，3¹³=3⁸·3⁴·3=2·4·3=24≡3 mod 7。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为「RSA 的安全来自求逆元难」<\/strong>——实际上求逆元（扩展欧几里得）很容易；安全来自「从 n=pq 反推 p,q 难（因子分解）」。\n<\/li><li>\n<strong>别以为「素数测试要找到因子才算」<\/strong>——实际上 Miller-Rabin 用概率测试，不找因子也能高概率判定素性。\n<\/li><li>\n<strong>别以为「aᵇ mod n 要先算 aᵇ 再取模」<\/strong>——实际上中间结果随时取模，数永远不会超过 n²。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n（单选）欧几里得算法求 gcd 的核心递推是？（答案：B；解析：gcd(a,b)=gcd(b,a mod b)）\n<ul>\n<li>\nA. gcd(a,b)=a−b   B. gcd(a,b)=gcd(b,a mod b)   C. gcd=ab   D. gcd=a+b\n<\/li><li>\n（单选）RSA 加密用的是？（答案：A；解析：公钥 (e,n)，c=mᵉ mod n）\n<\/li><li>\nA. 公钥 e   B. 私钥 d   C. p   D. q\n<\/li><li>\n（填空）反复平方求 aᵇ mod n 只需 O(__) 次模乘。（答案：lg b；解析：b 的二进制位数）\n<\/li><li>\n（简答）扩展欧几里得算法比普通欧几里得多求了什么？（答案：同时求出整数 x,y 使 ax+by=gcd(a,b)，从而当 gcd(a,n)=1 时得到 a 的模 n 逆元）\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n欧几里得 gcd；扩展版求模逆元。\n<\/li><li>\n反复平方 O(lg b) 算 aᵇ mod n。\n<\/li><li>\nRSA：公钥加密、私钥解密，安全依赖大整数分解难。\n<\/ul>", "ch32": "<h1>第 32 章：字符串匹配<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：2.5 小时 | <strong>前置<\/strong>：第 31 章（模运算）、有限状态机直觉\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说出朴素匹配的 O((n−m+1)m) 复杂度，以及它为什么会「重复比较」。\n<\/li><li>\n用 Rabin-Karp 的滚动哈希在 O(n+m) 期望时间内找模式串。\n<\/li><li>\n解释 KMP 的「前缀函数」如何在失配时不回退主串指针。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p><strong>字符串匹配的核心难题是「失配后别傻从头比」：Rabin-Karp 用滚动哈希快速排除不匹配位置，KMP 用预处理出的「前缀函数」让失配时主串指针不回退。<\/strong><\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：问题定义与朴素算法（难度：基础）<\/h3>\n<p><strong>字符串匹配<\/strong>：在文本 T[1..n] 中找模式 P[1..m] 的所有出现位置。 <strong>朴素算法<\/strong>：对每个偏移 s=0..n−m，逐字符比较 T[s+1..s+m] 与 P。最坏 O((n−m+1)m)，失配就把主串指针回退到 s+1 重新来。<\/p>\n<h3>概念 2：Rabin-Karp 算法（难度：进阶）<\/h3>\n<p>把模式 P 看成一个 d 进制数（d=字母表大小），用模 q 散列。<\/p>\n<ul><li>\n先算 P 的散列 h(P)。\n<\/li><li>\n用<strong>滚动哈希<\/strong>：窗口 T[s+1..s+m] 的散列 = (d·(h − d^{m−1}·T[s+1]) + T[s+m+1]) mod q——窗口右移一格时 O(1) 更新。\n<\/li><li>\n散列相等时再逐字符确认（防哈希碰撞）。\n<p>期望 <strong>O(n+m)<\/strong>。白话：先用哈希把绝大多数位置「一眼排除」，只对哈希命中的少数位置做精细比较。<\/p>\n<\/ul>\n<h3>概念 3：有限自动机匹配（难度：进阶）<\/h3>\n<p>预处理一张状态转移表 δ(state, next_char)：当前已匹配前缀长度 = state，读入下一个字符后新 state 是多少。然后扫一遍文本，state 到 m 即匹配成功。预处理 O(m³|Σ|)，匹配 O(n)。<\/p>\n<h3>概念 4：KMP 与前缀函数（难度：高难）<\/h3>\n<p><strong>前缀函数 π[q]<\/strong>：模式 P 的前 q 个字符构成的前缀，其「既是真前缀又是真后缀」的最长长度。 例：P=&quot;ababaca&quot;，π[5]=3（&quot;aba&quot; 既是 &quot;ababa&quot; 的前缀又是后缀）。 KMP：主串指针 i 永远不回退；失配时用 π 把模式指针 j 跳到 π[j−1]，因为「已匹配部分的最长前后缀」保证不用重新比。复杂度 <strong>O(n+m)<\/strong>，无额外哈希。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[在 T 中找模式 P] --&gt; B{用什么加速?}\n    B --&gt;|滚动哈希| C[Rabin-Karp: 哈希不等直接跳过, O(n+m) 期望]\n    B --&gt;|状态机| D[有限自动机: 预处理转移表, 扫一遍 O(n)]\n    B --&gt;|前缀函数| E[KMP: 失配时主串不回退, O(n+m)]\n    C --&gt; F[哈希命中再逐字符确认]\n    E --&gt; G[π[q]: 前 q 字符的最长真前后缀长度]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：三种算法都在解决同一个问题——「失配后别从头比」，只是分别用哈希、状态机、前缀函数实现。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：字符串匹配像在一页长文中搜一个词。朴素法是「逐位置开始逐字比，错了退回去重来」；KMP 像你读文章时眼睛从不后退，只靠「已经对上的部分能复用多少」来调整搜索词的位置。<strong>失效边界<\/strong>：Rabin-Karp 若哈希碰撞多，会退化成逐字符确认。\n<\/li><li>\n<strong>实例<\/strong>：P=&quot;abab&quot;，π=[0,0,1,2]。文本 &quot;ababab&quot;：i=4 时失配，j 从 4 跳到 π[3]=2，继续比 &quot;ab&quot; 命中第二处。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为「Rabin-Karp 的 O(n+m) 是最坏保证」<\/strong>——实际上它是期望时间；精心构造的输入+坏哈希能让它退化。\n<\/li><li>\n<strong>别以为「KMP 比 Rabin-Karp 快是因为不比较字符」<\/strong>——实际上它也逐字符比较，快在「主串指针不回退」。\n<\/li><li>\n<strong>别以为「前缀函数是给文本算的」<\/strong>——实际上 π 只依赖模式 P，与文本无关。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n（单选）Rabin-Karp 期望时间复杂度是？（答案：B；解析：滚动哈希 O(n+m)）\n<ul>\n<li>\nA. O(nm)   B. O(n+m)   C. O(n²)   D. O(m²)\n<\/li><li>\n（单选）KMP 的前缀函数 π[q] 表示？（答案：C；解析：前 q 字符的最长真前后缀长度）\n<\/li><li>\nA. 模式长度   B. 文本位置   C. 最长真前后缀   D. 哈希值\n<\/li><li>\n（填空）Rabin-Karp 中窗口右移一格时，哈希用__更新。（答案：滚动（O(1)）；解析：减最高位、加最低位）\n<\/li><li>\n（简答）KMP 为什么主串指针不回退？（答案：前缀函数保证已匹配部分的最长前后缀已被复用，失配后只需移动模式串，主串 i 继续前进）\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n朴素 O((n−m+1)m)，失配回退。\n<\/li><li>\nRabin-Karp 滚动哈希，期望 O(n+m)。\n<\/li><li>\nKMP 前缀函数，主串不回退，O(n+m)。\n<\/ul>", "ch33": "<h1>第 33 章：计算几何学<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：3 小时 | <strong>前置<\/strong>：向量叉积、排序（第 8 章）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n用叉积判断「两条向量的转向」与「两条线段是否相交」。\n<\/li><li>\n写出 Graham 扫描求凸包的流程与复杂度。\n<\/li><li>\n解释最近点对算法如何用分治在 O(n lg n) 内求解。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p><strong>计算几何的所有判断都化成「叉积的符号」——转向、相交、凸包都靠它；凸包 Graham 扫描 O(n lg n)，最近点对靠分治+带状扫描 O(n lg n)。<\/strong><\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：叉积与转向（难度：基础）<\/h3>\n<p>向量 p₁=(x₁,y₁)、p₂=(x₂,y₂)。<strong>叉积<\/strong> p₁×p₂ = x₁y₂ − x₂y₁（数值，不是向量）。<\/p>\n<ul><li>\n&gt;0：p₁ 在 p₂ 的<strong>顺时针<\/strong>方向（从 p₁ 到 p₂ 左转）\n<\/li><li>\n&lt;0：逆时针（右转）\n<\/li><li>\n=0：共线。\n<p>白话：叉积符号 = 「站在原点，先看 p₁ 再看 p₂，是向左拐还是向右拐」。它是本章所有判断的原子操作。<\/p>\n<\/ul>\n<h3>概念 2：线段相交判定（难度：进阶）<\/h3>\n<p>两条线段 (p₁,p₂)、(p₃,p₄) 相交当且仅当：<\/p>\n<ol><li>\n「跨立」：(p₁,p₂) 两侧分别有 p₃、p₄，且 (p₃,p₄) 两侧分别有 p₁、p₂（用叉积符号相反判断）。\n<\/li><li>\n边界退化：某端点落在另一线段上。\n<p>全部用叉积符号搞定，不需要解联立方程。<\/p>\n<\/ol>\n<h3>概念 3：凸包与 Graham 扫描（难度：进阶）<\/h3>\n<p><strong>凸包（convex hull）<\/strong>：包住所有点的最小凸多边形。 <strong>Graham 扫描<\/strong>：<\/p>\n<ol><li>\n选 y 最小（再 x 最小）的点 p₀ 为基点。\n<\/li><li>\n其余点按「相对 p₀ 的极角」从小到大排序。\n<\/li><li>\n用栈扫描：依次把点压栈；若栈顶两个点与新点构成<strong>非左转<\/strong>（叉积 ≤0），弹栈。\n<p>复杂度 <strong>O(n lg n)<\/strong>（排序是瓶颈）。<\/p>\n<\/ol>\n<h3>概念 4：最近点对（难度：高难）<\/h3>\n<p>经典分治：<\/p>\n<ol><li>\n按 x 排序，二分。\n<\/li><li>\n递归求左半、右半的最近距离 δ。\n<\/li><li>\n合并：只需检查「中线两侧 δ 带内」的点；按 y 排序后每个点只与后面 7 个点比（几何上 δ×2δ 矩形内最多 8 个点）。\n<p>复杂度递推 T(n)=2T(n/2)+O(n) ⇒ <strong>O(n lg n)<\/strong>。<\/p>\n<\/ol>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[几何判断] --&gt; B[叉积符号: 左转/右转/共线]\n    B --&gt; C[线段相交: 跨立测试]\n    B --&gt; D[凸包 Graham: 极角排序 + 栈式弹非左转]\n    B --&gt; E[最近点对: 分治 + δ 带内只比 7 个点]\n    D --&gt; F[O(n lg n)]\n    E --&gt; F<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：所有几何算法都建立在「叉积符号」这一个原子判断上；后续只是排序+分治+栈/带扫描的组合。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：叉积像「站在基点看星星」——先看见 A 再看见 B，它们的相对方位是左是右，一眼分清。凸包像「用一根橡皮筋套住所有钉子」，松开后绷住的那些钉子就是凸包顶点。<strong>失效边界<\/strong>：共线点、三点重合要单独处理（退化情形）。\n<\/li><li>\n<strong>实例<\/strong>：p₁=(2,0)、p₂=(0,2)，叉积 2·2−0·0=4&gt;0 ⇒ 从 p₁ 到 p₂ 是逆时针（左转）。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为「叉积是个向量」<\/strong>——在本章的二维应用里它是个标量，符号才是判断依据。\n<\/li><li>\n<strong>别以为「凸包算法要画多边形」<\/strong>——实际上它只是排序+栈式判断，从不显式画图。\n<\/li><li>\n<strong>别以为「最近点对合并时要比所有跨中线点对」<\/strong>——实际上 δ 带内每个点只需向后比 7 个点（几何上矩形里塞不下 8 个相距 ≥δ 的点）。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n（单选）p₁×p₂ &gt; 0 表示？（答案：B；解析：从 p₁ 到 p₂ 左转/逆时针）\n<ul>\n<li>\nA. 共线   B. 左转   C. 右转   D. 重合\n<\/li><li>\n（单选）Graham 扫描的瓶颈在？（答案：A；解析：按极角排序 O(n lg n)）\n<\/li><li>\nA. 排序   B. 栈操作   C. 叉积   D. 找基点\n<\/li><li>\n（填空）最近点对合并时，δ 带内每个点只需向后比 __ 个点。（答案：7；解析：矩形内最多 8 个相距 ≥δ 的点）\n<\/li><li>\n（简答）为什么线段相交能只用叉积判断？（答案：跨立测试把「两线段互相横跨」翻译成两端点叉积符号相反，退化情形再单独查共线）\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n叉积符号 = 一切几何判断的原子。\n<\/li><li>\nGraham 凸包 O(n lg n)：极角排序+栈。\n<\/li><li>\n最近点对分治 O(n lg n)：δ 带内只比 7 个点。\n<\/ul>", "ch34": "<h1>第 34 章：NP 完全性<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：4 小时 | <strong>前置<\/strong>：第 6 章（复杂度直觉）、图论基础\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说清 P、NP、NPC 三类问题的定义，以及「P=NP？」是什么意思。\n<\/li><li>\n理解「多项式时间归约」为什么能证明「问题 A 不比问题 B 易」。\n<\/li><li>\n说出 Cook-Levin 定理、以及团/顶点覆盖/哈密顿回路/子集和为什么是 NP 完全的。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p><strong>如果一个问题能「猜一个答案然后多项式时间验证」（NP），且能把某个已知难题多项式归约到它，它就是 NP 完全的——这类问题目前没人找到多项式算法，大家都相信 P≠NP。<\/strong><\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：P、NP、NP 完全（难度：基础）<\/h3>\n<ul><li>\n<strong>P<\/strong>：能在多项式时间 O(nᵏ) 内<strong>求解<\/strong>的问题。\n<\/li><li>\n<strong>NP<\/strong>：能在多项式时间内<strong>验证一个给定答案<\/strong>是否正确的问题（即「答案可以猜，验证很快」）。P ⊆ NP。\n<\/li><li>\n<strong>NP 完全（NPC）<\/strong>：NP 中「最难」的那批——任何 NP 问题都能多项式归约到它。若 NPC 里任意一个问题有多项式算法，则 P=NP。\n<\/li><li>\n<strong>P=NP?<\/strong>：理论计算机科学最大未决问题；主流猜想 P≠NP。\n<\/ul>\n<h3>概念 2：多项式时间归约（难度：进阶）<\/h3>\n<p><strong>归约<\/strong>：把问题 A 的输入，在多项式时间内变换成问题 B 的输入，使得 A 的答案能从 B 的答案读出。 白话：「我有一台解 B 的机器，能不能用它来解 A？」若能，说明 A 不比 B 难。 用途：已知 B 是 NPC，若 A 也满足「NP 内 + B 可归约到 A」，则 A 也是 NPC。<\/p>\n<h3>概念 3：Cook-Levin 与基本 NPC 问题（难度：高难）<\/h3>\n<p><strong>Cook-Levin 定理<\/strong>：布尔公式可满足性（SAT）是 NP 完全的——这是第一个被证明的 NPC 问题，其他 NPC 证明都从它归约出来。 经典 NPC 谱系：<\/p>\n<ul><li>\n<strong>3-CNF-SAT<\/strong>：每个子句恰含 3 个文字的布尔公式可满足。\n<\/li><li>\n<strong>团（Clique）<\/strong>：图里是否存在 k 个两两相连的顶点。\n<\/li><li>\n<strong>顶点覆盖<\/strong>：能否用 ≤k 个顶点覆盖所有边。\n<\/li><li>\n<strong>哈密顿回路<\/strong>：是否存在经过每个顶点恰好一次的回路。\n<\/li><li>\n<strong>旅行商（TSP）<\/strong>：在哈密顿回路基础上问「总权 ≤k」。\n<\/li><li>\n<strong>子集和<\/strong>：是否有子集加起来恰好等于目标 t。\n<\/ul>\n<h3>概念 4：怎么判断「这个问题是不是 NPC」（难度：进阶）<\/h3>\n<ol><li>\n先确认问题在 NP 内（给个答案能多项式验证）。\n<\/li><li>\n选一个已知的 NPC 问题（如 3-CNF-SAT、团、顶点覆盖）。\n<\/li><li>\n构造一个多项式归约：把那个问题的任意输入，变换成本问题的输入。\n<\/li><li>\n若变换正确（等价），则本问题是 NPC。\n<p>白话：NPC 证明 = 「我把一个公认难题的输入翻译给你，你的问题能答，就说明你也不简单」。<\/p>\n<\/ol>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[问题在 NP 内? 答案可多项式验证] --&gt;|否| B[不属于 NP, 更难]\n    A --&gt;|是| C[能否把已知 NPC 问题多项式归约到它?]\n    C --&gt;|能| D[它也是 NPC: 最难的一批]\n    C --&gt;|不能| E[可能是 NP 中较易的问题]\n    D --&gt; F[若 P=NP, 所有 NPC 都有多项式算法]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：判定路径是「先看是否 NP，再看能否归约到已知 NPC」；归约是 NPC 证明的唯一钥匙。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：NPC 像「世界七大难题俱乐部」——入门条件是「能把任意一道 NP 难题翻译成你的问题」。Cook-Levin 是第一个拿到会员证的（SAT）。<strong>失效边界<\/strong>：归约必须多项式时间且等价；把输入指数放大就不算数。\n<\/li><li>\n<strong>实例<\/strong>：顶点覆盖 → 团：图 G 的顶点覆盖 V&#x27; 与其补集 V−V&#x27; 在补图 Ḡ 中构成团。因此「G 有 k 顶点覆盖」等价于「Ḡ 有 n−k 团」——归约完成，故顶点覆盖是 NPC。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为「NP 是『非多项式』的缩写」<\/strong>——实际上 NP = Nondeterministic Polynomial（非确定性多项式），指「猜+验证」，不是「难」。\n<\/li><li>\n<strong>别以为「NPC 证明要自己设计多项式算法」<\/strong>——实际上恰恰相反，NPC 证明是「证明它难」，靠归约而不是算法。\n<\/li><li>\n<strong>别以为「P=NP 已被证伪」<\/strong>——实际上它既未被证明也未被证伪，只是主流猜想 P≠NP。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n（单选）NP 类问题指的是？（答案：B；解析：答案可多项式验证的问题类）\n<ul>\n<li>\nA. 非多项式算法   B. 可多项式验证答案   C. 指数时间   D. 不可判定\n<\/li><li>\n（单选）Cook-Levin 定理证明了哪个问题是 NPC？（答案：A；解析：布尔公式可满足性 SAT）\n<\/li><li>\nA. SAT   B. 最短路径   C. 排序   D. 最大流\n<\/li><li>\n（填空）证明新问题是 NPC，需要把已知 NPC 问题__到它。（答案：多项式时间归约；解析：输入变换等价）\n<\/li><li>\n（简答）为什么「若某个 NPC 问题有多项式算法，则 P=NP」？（答案：因为所有 NP 问题都能多项式归约到该 NPC 问题，叠加多项式算法仍多项式，于是所有 NP 问题都有多项式算法）\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\nP=多项式求解；NP=多项式验证；NPC=NP 中最难。\n<\/li><li>\n归约是 NPC 证明的钥匙：已知 NPC → 归约到新问题。\n<\/li><li>\nCook-Levin：SAT 是第一个 NPC；经典成员：3-SAT、团、顶点覆盖、哈密顿、TSP、子集和。\n<\/ul>", "ch35": "<h1>第 35 章：近似算法<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：2.5 小时 | <strong>前置<\/strong>：第 23 章（MST）、第 34 章（NPC）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说出「近似比（approximation ratio）」的定义，以及为什么 NPC 问题要找近似解。\n<\/li><li>\n写出顶点覆盖的 2-近似算法并证明其近似比。\n<\/li><li>\n解释 TSP 在三角不等式下的 2-近似（走 MST 遍历），以及为什么无三角不等式时 TSP 近似是 NPC 的。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p><strong>NPC 问题找不到精确多项式算法时，退而求其次：设计一个算法，保证「解的代价 ≤ α × 最优代价」，α 就是近似比——α 越接近 1 越好。<\/strong><\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：近似算法与近似比（难度：基础）<\/h3>\n<p><strong>近似算法<\/strong>：对优化问题，输出一个不一定最优、但有「质量保证」的解。 <strong>近似比 ρ(n)<\/strong>：对任意输入，算法解的代价 C 与最优代价 C<em> 满足 max(C/C<\/em>, C<em>/C) ≤ ρ(n)（最小化问题看 C/C<\/em>，最大化问题看另一侧）。 ρ=1 就是精确算法；ρ=2 表示「坏到不会超过最优的两倍」。<\/p>\n<h3>概念 2：顶点覆盖的 2-近似（难度：进阶）<\/h3>\n<p>算法：<\/p>\n<ol><li>\n任取一条边 (u,v)。\n<\/li><li>\n把 u、v 都加入覆盖集 C。\n<\/li><li>\n删去所有与 u 或 v 相连的边。\n<\/li><li>\n重复直到无边。\n<p><strong>证明 2-近似<\/strong>：算法选的边两两不相邻（极大匹配），最优解至少要从每条匹配边里选一个顶点 ⇒ |C<em>| ≥ |匹配|；而 |C|=2·|匹配| ⇒ |C| ≤ 2|C<\/em>|。<\/p>\n<\/ol>\n<h3>概念 3：TSP 的 2-近似（三角不等式，难度：进阶）<\/h3>\n<p>前提：距离满足三角不等式 d(a,c) ≤ d(a,b)+d(b,c)。 算法：<\/p>\n<ol><li>\n求图的 MST（第 23 章）。\n<\/li><li>\n对 MST 做一次「前序遍历」，把遇到的顶点依次记下来（重复访问同一顶点时直接跳过，走捷径）。\n<\/li><li>\n这条遍历顺序就是 TSP 回路。\n<p><strong>为什么是 2-近似<\/strong>：MST 总权 ≤ 最优 TSP 回路（回路去掉一条边就是生成树）；前序遍历总路程 ≤ 2·MST 总权（每条 MST 边走两次）。故 C ≤ 2·MST ≤ 2·C*。 <strong>重要反面<\/strong>：若不满足三角不等式，TSP 近似（任意常数比）本身就是 NP 难的——不存在多项式常数近似算法（除非 P=NP）。<\/p>\n<\/ol>\n<h3>概念 4：集合覆盖与子集和 FPTAS（难度：高难）<\/h3>\n<ul><li>\n<strong>集合覆盖的 ln n 近似<\/strong>：贪心每次选「覆盖最多未覆盖元素」的集合，近似比 ≤ ln n。\n<\/li><li>\n<strong>子集和的完全多项式近似方案（FPTAS）<\/strong>：给定 ε，把数值「按尺度取整」压缩状态，得到 (1+ε)-近似算法，运行时间关于 1/ε 和输入规模都是多项式的——这是近似算法的「黄金标准」。\n<\/ul>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[NPC 优化问题] --&gt; B[找不到多项式精确算法]\n    B --&gt; C[设计近似算法, 证明近似比 ρ]\n    C --&gt; D[顶点覆盖: 极大匹配两端点入集, ρ=2]\n    C --&gt; E[TSP+三角不等式: MST 前序遍历, ρ=2]\n    C --&gt; F[集合覆盖: 贪心覆盖最多, ρ=ln n]\n    C --&gt; G[子集和: FPTAS, 任意 (1+ε)-近似]\n    H[无三角不等式的 TSP: 常数近似本身 NPC] -.-&gt; E<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：近似比是「质量保证书」；有些问题能轻易拿到 ρ=2，有些问题（如无三角 TSP）连常数近似都 NPC。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：近似算法像「赶时间吃饭」——找不到全城最优的馆子，但保证「走 10 分钟内一定有吃的，坏也不会比最优贵一倍」。<strong>失效边界<\/strong>：近似比依赖问题结构；有些问题天生没有常数近似（如无三角 TSP）。\n<\/li><li>\n<strong>实例<\/strong>：顶点覆盖图 4 条边 (a,b),(b,c),(c,d),(d,a)。算法取 (a,b)，删边；再取 (c,d)，覆盖 {a,b,c,d}；最优也至少要 2 个顶点（如 b,d），4 ≤ 2·2。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为「近似算法就是随便给个解」<\/strong>——实际上它必须有可证明的近似比，是「有保证的启发式」。\n<\/li><li>\n<strong>别以为「所有 NPC 问题都能拿到常数近似」<\/strong>——实际上无三角 TSP、最大团等问题连常数近似都是 NP 难的。\n<\/li><li>\n<strong>别以为「FPTAS 是精确算法」<\/strong>——它是 (1+ε)-近似，但运行时间对 1/ε 是多项式的，ε 越小越慢。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n（单选）顶点覆盖 2-近似算法选边时把哪两个点加入覆盖集？（答案：B；解析：任取匹配边两端点都加）\n<ul>\n<li>\nA. 只加一端   B. 两端都加   C. 加所有邻居   D. 加度数最大\n<\/li><li>\n（单选）三角不等式下 TSP 的 2-近似基于什么？（答案：A；解析：MST 前序遍历）\n<\/li><li>\nA. MST 前序遍历   B. 贪心选边   C. 动态规划   D. 随机游走\n<\/li><li>\n（填空）FPTAS 表示完全__近似方案，运行时间对 1/ε 也是多项式。（答案：多项式；解析：(1+ε)-近似）\n<\/li><li>\n（简答）为什么无三角不等式的 TSP 不存在多项式常数近似？（答案：若存在，就能用它多项式判定哈密顿回路（NPC），推出 P=NP）\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n近似比 ρ = 算法解/最优解 的最坏比值。\n<\/li><li>\n顶点覆盖 ρ=2（极大匹配）；TSP+三角 ρ=2（MST 遍历）。\n<\/li><li>\n有些问题（无三角 TSP）常数近似本身 NPC；FPTAS 是黄金标准。\n<\/ul>", "ch36": "<h1>第 36 章：附录 A — 求和<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★☆☆ | <strong>预估学时<\/strong>：1 小时 | <strong>前置<\/strong>：第 3 章（渐近记号）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n背出并活用等差、等比、平方和三个常用求和公式。\n<\/li><li>\n用「积分逼近」估计一个单调递增求和的上界与下界。\n<\/li><li>\n用求和公式快速验证递归式的解（如归并排序的 Θ(n lg n)）。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p><strong>算法分析里反复遇到求和——等差、等比、平方和三张表直接查；拿不准时用「积分夹逼」：单调函数的和一定落在两个相邻积分之间。<\/strong><\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：三张常用求和表（难度：基础）<\/h3>\n<ul><li>\n<strong>等差级数<\/strong>：Σ_{k=1}^{n} k = n(n+1)/2 = Θ(n²)。\n<\/li><li>\n<strong>平方和<\/strong>：Σ_{k=1}^{n} k² = n(n+1)(2n+1)/6 = Θ(n³)。\n<\/li><li>\n<strong>等比级数<\/strong>：Σ_{k=0}^{n} xᵏ = (x^{n+1}−1)/(x−1)（x≠1）；当 |x|&lt;1 时无穷和 = 1/(1−x)。\n<p>白话：算法分析中「循环加 n 次」给出 Θ(n)，「双层循环」给出 Θ(n²)，递归树每层减半给出等比级数 O(n)。<\/p>\n<\/ul>\n<h3>概念 2：积分逼近（难度：进阶）<\/h3>\n<p>对单调递增函数 f： ∫_{m}^{n+1} f(x) dx ≤ Σ_{k=m}^{n} f(k) ≤ ∫_{m-1}^{n} f(x) dx。 白话：把每一项 f(k) 想成区间 [k,k+1] 上的小矩形面积，求和 ≈ 曲线下的面积。 例：Σ_{k=1}^{n} 1/k（调和数 Hₙ）≈ ln n + O(1)。<\/p>\n<h3>概念 3：求和与递归树（难度：进阶）<\/h3>\n<p>递归式 T(n)=2T(n/2)+n 的递归树：第 j 层代价 n（每层 n），共 lg n 层 ⇒ 总和 n·lg n = Θ(n lg n)。求和工具让你把「每层代价 × 层数」算清楚。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n    A[循环/递归树产生求和] --&gt; B{能套公式吗?}\n    B --&gt;|等差| C[Σ k = n(n+1)/2]\n    B --&gt;|平方| D[Σ k² = n³/3]\n    B --&gt;|等比| E[Σ xᵏ = (xⁿ⁺¹−1)/(x−1)]\n    B --&gt;|套不上| F[积分夹逼: 上下两个积分]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：先查三张表；套不上就用积分夹逼给出界。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：求和表像「菜谱」——常见菜直接查；积分逼近像「估算」——拿不准就拿积分当尺子量。<strong>失效边界<\/strong>：积分逼近要求 f 单调；剧烈振荡的函数不适用。\n<\/li><li>\n<strong>实例<\/strong>：等比级数 Σ_{j=0}^{lg n} n/2ʲ = n·Σ (1/2)ʲ = n·2 = 2n = O(n)——这是归并排序递归树根层之外的总代价。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为「调和数 Hₙ=Σ1/k 是 Θ(lg n)」需要证明<\/strong>——实际上积分夹逼一步：∫1/x dx = ln n，上下夹出 ln n ± O(1)。\n<\/li><li>\n<strong>别以为「等比级数无穷和一定收敛」<\/strong>——只有 |x|&lt;1 时收敛；x≥1 时无穷和发散。\n<\/li><li>\n<strong>别以为「求和的渐近界和积分完全一样」<\/strong>——它们只差 O(1) 或 O(f(n))，但主项相同。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n（填空）Σ_{k=1}^{n} k = __。（答案：n(n+1)/2；解析：等差级数）\n<\/li><li>\n（单选）等比级数 Σ_{k=0}^{∞} (1/2)ᵏ = ？（答案：B；解析：1/(1−1/2)=2）\n<ul>\n<li>\nA. 1   B. 2   C. 3   D. ∞\n<\/li><li>\n（单选）调和数 Hₙ=Σ1/k 的渐近阶是？（答案：C；解析：积分夹逼 ≈ ln n）\n<\/li><li>\nA. Θ(1)   B. Θ(n)   C. Θ(lg n)   D. Θ(n²)\n<\/li><li>\n（简答）递归树 T(n)=2T(n/2)+n 的总代价怎么算？（答案：共 lg n 层，每层 n，总和 n·lg n = Θ(n lg n)）\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n三表：等差 Θ(n²)、平方 Θ(n³)、等比（|x|&lt;1 收敛）。\n<\/li><li>\n积分夹逼估计任意单调求和的界。\n<\/li><li>\n调和数 Hₙ=Θ(lg n)。\n<\/ul>", "ch37": "<h1>第 37 章：附录 B — 集合、关系、函数、图、树<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★☆☆ | <strong>预估学时<\/strong>：1.5 小时 | <strong>前置<\/strong>：无（全书数学词汇表）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说清集合运算（交/并/补）、关系的自反/对称/传递/等价、函数的单射/满射/双射。\n<\/li><li>\n复述图的有向/无向、邻接表/邻接矩阵表示。\n<\/li><li>\n区分「树」「有根树」「二叉树」的递归定义。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p><strong>这一章是全书的数学词汇表——集合怎么运算、关系有哪几种性质、函数是不是一一对应、图和树怎么递归定义，后面每一章都在复用这些词。<\/strong><\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：集合与关系（难度：基础）<\/h3>\n<ul><li>\n<strong>集合<\/strong>：元素的无序集合。运算：并 ∪、交 ∩、补、差、幂集 2^S（所有子集）。\n<\/li><li>\n<strong>关系 R ⊆ A×A<\/strong>：\n<ul>\n<li>\n<strong>自反<\/strong>：对所有 a，(a,a)∈R。\n<\/li><li>\n<strong>对称<\/strong>：(a,b)∈R ⇒ (b,a)∈R。\n<\/li><li>\n<strong>传递<\/strong>：(a,b),(b,c)∈R ⇒ (a,c)∈R。\n<\/li><li>\n<strong>等价关系<\/strong>：三者同时成立（如「模 n 同余」），按它把元素分成等价类。\n<\/ul>\n<\/ul>\n<h3>概念 2：函数（难度：基础）<\/h3>\n<p>f: A→B 把每个 a∈A 映到唯一 f(a)∈B。<\/p>\n<ul><li>\n<strong>单射<\/strong>：不同 a 映到不同 b。\n<\/li><li>\n<strong>满射<\/strong>：每个 b 都被某个 a 映到。\n<\/li><li>\n<strong>双射<\/strong>：既单又满（一一对应），这时存在逆函数 f⁻¹。\n<p>白话：单射是「不挤号」，满射是「不落下」，双射是「严丝合缝配对」。<\/p>\n<\/ul>\n<h3>概念 3：图（难度：基础）<\/h3>\n<ul><li>\n<strong>有向图<\/strong> G=(V,E)：E 是有序对集合。<strong>无向图<\/strong>：E 是无序对。\n<\/li><li>\n<strong>邻接<\/strong>：(u,v)∈E。<strong>度<\/strong>：无向图中与该点相连的边数；有向图分入度、出度。\n<\/li><li>\n表示：邻接矩阵（|V|×|V| 0/1 矩阵）或邻接表（每个顶点挂一个链表）。\n<\/li><li>\n<strong>路径<\/strong>：顶点序列 v₀,v₁,…,vₖ 使每条相邻边在 E 中。<strong>连通<\/strong>：任意两点间有路径。\n<\/ul>\n<h3>概念 4：树（难度：进阶）<\/h3>\n<ul><li>\n<strong>自由树<\/strong>：连通无环无向图。等价性质：|E|=|V|−1、任意两点唯一路径。\n<\/li><li>\n<strong>有根树<\/strong>：指定一个根 r，每条边从根向外延伸；每个非根顶点有唯一父节点。\n<\/li><li>\n<strong>二叉树<\/strong>：每个结点最多两个子结点（左、右）。<strong>完全二叉树<\/strong>：所有层满、最后一层靠左。\n<\/ul>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[数学词汇] --&gt; B[集合: 交并补差集]\n    A --&gt; C[关系: 自反/对称/传递 ⇒ 等价]\n    A --&gt; D[函数: 单射/满射/双射]\n    A --&gt; E[图: 有向/无向, 邻接表/矩阵]\n    A --&gt; F[树: 自由树→有根树→二叉树]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：这一页是全书反复使用的「基本原子」；后面每个数据结构、算法都是它们的组合。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：关系的三种性质像「社交规则」——自反是「自己认识自己」、对称是「互相认识」、传递是「朋友的朋友」。等价关系就是能把人分成「朋友圈」的规则。<strong>失效边界<\/strong>：偏序关系（如「≤」）不自反对称但传递，不等价于等价。\n<\/li><li>\n<strong>实例<\/strong>：整数集合上的「模 3 同余」是等价关系，把 Z 分成 {…,−3,0,3,…}、{…,−2,1,4,…}、{…,−1,2,5,…} 三个等价类。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为「双射一定有逆函数」需要额外条件<\/strong>——实际上双射定义本身就保证了逆的存在与唯一。\n<\/li><li>\n<strong>别以为「树就是二叉树」<\/strong>——实际上树可以任意分叉；二叉树只是「每个结点最多两子」的特例。\n<\/li><li>\n<strong>别以为「有向图的度只算出去的边」<\/strong>——实际上有向图分入度和出度，两者相加才是总度。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n（单选）同时满足自反、对称、传递的关系叫？（答案：C；解析：等价关系）\n<ul>\n<li>\nA. 偏序   B. 函数   C. 等价关系   D. 空关系\n<\/li><li>\n（单选）自由树恰好有多少条边？（答案：B；解析：|V|−1）\n<\/li><li>\nA. |V|   B. |V|−1   C. 2|V|   D. |V|+1\n<\/li><li>\n（填空）既单射又满射的函数叫__。（答案：双射；解析：一一对应）\n<\/li><li>\n（简答）邻接表和邻接矩阵各自适合什么图？（答案：邻接表适合稀疏图（省空间），邻接矩阵适合稠密图（O(1) 判边是否存在））\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n关系三性质 → 等价关系；函数三性质 → 双射有逆。\n<\/li><li>\n图：有向/无向、邻接表 vs 矩阵。\n<\/li><li>\n树：自由树 |V|−1 边；有根树；二叉树。\n<\/ul>", "ch38": "<h1>第 38 章：附录 C — 计数与概率<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：2 小时 | <strong>前置<\/strong>：第 5 章（概率分析）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n用计数基本法则（乘法/加法）算排列数、组合数。\n<\/li><li>\n写出离散随机变量的期望 E[X] 与方差 Var[X]，并用期望线性性质。\n<\/li><li>\n说出伯努利试验、二项分布 b(k;n,p) 及其尾部界。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p><strong>算法概率分析三件套——计数（多少种情况）、期望（平均表现）、尾部界（多大概率不翻车）；期望的线性性质 E[X+Y]=E[X]+E[Y] 从不要求独立，是最常用的工具。<\/strong><\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：计数基本法则（难度：基础）<\/h3>\n<ul><li>\n<strong>乘法法则<\/strong>：做两件事，第一件 n₁ 种、第二件 n₂ 种 ⇒ 共 n₁n₂ 种搭配。\n<\/li><li>\n<strong>加法法则<\/strong>：两件事互斥，共 n₁+n₂ 种。\n<\/li><li>\n<strong>排列<\/strong>：从 n 个取 k 个有序排 = n!/(n−k)!。\n<\/li><li>\n<strong>组合<\/strong>：从 n 个取 k 个无序 = C(n,k)=n!/(k!(n−k)!)（二项式系数）。\n<\/ul>\n<h3>概念 2：随机变量、期望与方差（难度：进阶）<\/h3>\n<p><strong>随机变量 X<\/strong>：把随机结果映射成数。 <strong>期望<\/strong>：E[X]=Σₓ x·Pr(X=x)。 <strong>期望线性<\/strong>：E[aX+bY]=aE[X]+bE[Y]——<strong>不要求 X、Y 独立<\/strong>！这是算法分析最常用的工具。 <strong>方差<\/strong>：Var[X]=E[X²]−(E[X])²。<\/p>\n<h3>概念 3：伯努利试验与二项分布（难度：进阶）<\/h3>\n<p><strong>伯努利试验<\/strong>：成功概率 p、失败概率 1−p 的独立重复试验。 <strong>二项分布<\/strong>：n 次试验中成功 k 次的概率 b(k;n,p)=C(n,k)pᵏ(1−p)^{n−k}。 期望 E[X]=np，方差 Var[X]=np(1−p)。 <strong>尾部界（Chernoff/Hoeffding）<\/strong>：X 偏离期望超过 ε 的概率指数下降——用来证明「随机化算法大概率很快」。<\/p>\n<h3>概念 4：概率分析在算法中的位置（难度：基础）<\/h3>\n<p>第 5 章的「雇用问题」用指示器随机变量算期望；快速排序的期望 O(n lg n) 用的就是二项分布+期望线性。本章给出所有这些推导的数学底座。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[概率分析] --&gt; B[计数: 乘法/加法/排列/组合]\n    A --&gt; C[随机变量 X]\n    C --&gt; D[期望 E[X] = Σ x·Pr(X=x)]\n    D --&gt; E[期望线性: E[aX+bY]=aE[X]+bE[Y], 不需独立]\n    C --&gt; F[方差 Var=E[X²]-(E[X])²]\n    A --&gt; G[伯努利试验 → 二项分布 b(k;n,p)]\n    G --&gt; H[尾部界: 偏离期望指数小概率]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：期望线性是「万能钥匙」；二项分布与尾部界是「随机化算法为什么大概率好」的根据。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：期望像「平均工资」——不管员工之间是否相关，总平均 = 各人平均的和；方差像「工资波动幅度」。<strong>失效边界<\/strong>：期望线性不要求独立，但「E[XY]=E[X]E[Y]」要求独立，别混用。\n<\/li><li>\n<strong>实例<\/strong>：n 次抛硬币正面次数 X，E[X]=n/2；用期望线性，把 X 写成 n 个 0/1 指示器变量之和，每个期望 1/2 ⇒ E[X]=n/2，不用管独立。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为「期望线性要求变量独立」<\/strong>——实际上它从不要求独立，这正是它强大的原因。\n<\/li><li>\n<strong>别以为「方差就是期望的平方」<\/strong>——实际上 Var[X]=E[X²]−(E[X])²，是「平方的期望减期望的平方」。\n<\/li><li>\n<strong>别以为「二项分布只用于抛硬币」<\/strong>——实际上它是所有「n 次独立成功/失败」模型的通用分布，包括快速排序的期望分析。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n（单选）期望线性 E[X+Y]=E[X]+E[Y] 要求什么？（答案：A；解析：什么都不要求，X、Y 可相关）\n<ul>\n<li>\nA. 无要求   B. X、Y 独立   C. X、Y 同分布   D. X、Y 不相关\n<\/li><li>\n（单选）二项分布 b(k;n,p) 的期望是？（答案：B；解析：np）\n<\/li><li>\nA. n+p   B. np   C. n/p   D. (n−p)²\n<\/li><li>\n（填空）Var[X] = E[X²] − __。（答案：(E[X])²；解析：方差公式）\n<\/li><li>\n（简答）为什么指示器随机变量在算法期望分析中好用？（答案：把复杂事件拆成 0/1 变量之和，用期望线性求 E[总和]=Σ E[指示器]=Σ Pr(事件)，独立不独立都行）\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n计数：乘法/加法、排列、组合。\n<\/li><li>\n期望线性 E[aX+bY]=aE[X]+bE[Y]，不要求独立。\n<\/li><li>\n二项分布 b(k;n,p)：E=np，Var=np(1−p)，尾部指数小。\n<\/ul>", "ch39": "<h1>第 39 章：附录 D — 矩阵<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★☆☆ | <strong>预估学时<\/strong>：1 小时 | <strong>前置<\/strong>：第 28 章（矩阵运算）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说出矩阵加、乘、转置、逆的定义与基本性质。\n<\/li><li>\n用行列式判断矩阵是否可逆。\n<\/li><li>\n复述单位矩阵、对称矩阵、正定矩阵的判别。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p><strong>矩阵是「把一组线性方程打包」的工具——乘是「行乘列」、逆是「反变换」、行列式为 0 就是「信息丢失、不可逆」；第 28 章的 LUP 分解就是把这些操作算快。<\/strong><\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：矩阵运算（难度：基础）<\/h3>\n<ul><li>\n<strong>矩阵加法<\/strong>：同尺寸矩阵对应元素相加。\n<\/li><li>\n<strong>矩阵乘法<\/strong>：C=AB，Cᵢⱼ = Σₖ Aᵢₖ Bₖⱼ（A 的行 × B 的列）。不满足交换律（一般 AB≠BA）。\n<\/li><li>\n<strong>转置 Aᵀ<\/strong>：行变列、列变行。(AB)ᵀ=BᵀAᵀ。\n<\/li><li>\n<strong>单位矩阵 I<\/strong>：对角线为 1、其余为 0；AI=IA=A。\n<\/ul>\n<h3>概念 2：逆与行列式（难度：进阶）<\/h3>\n<p><strong>逆矩阵 A⁻¹<\/strong>：满足 AA⁻¹=A⁻¹A=I。 <strong>可逆 ⇔ det(A)≠0<\/strong>（行列式非零）。 <strong>行列式 det(A)<\/strong>：对 2×2 是 ad−bc；高阶用递归展开。det=0 意味着「A 把空间压成了低维」，信息丢失，无法反变换。<\/p>\n<h3>概念 3：特殊矩阵（难度：进阶）<\/h3>\n<ul><li>\n<strong>对称矩阵<\/strong>：A=Aᵀ。\n<\/li><li>\n<strong>对称正定矩阵<\/strong>：A=Aᵀ 且对任意非零 x 有 xᵀAx&gt;0；可逆、所有主元为正、可 Cholesky 分解 A=LLᵀ（见第 28 章）。\n<\/li><li>\n<strong>对角矩阵<\/strong>：非对角元为 0。\n<\/ul>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n    A[矩阵] --&gt; B[加法: 对应元素]\n    A --&gt; C[乘法: 行乘列, 不交换]\n    A --&gt; D[转置: Aᵀ]\n    A --&gt; E[逆 A⁻¹: AA⁻¹=I]\n    E --&gt; F[det(A)≠0 ⇔ 可逆]\n    A --&gt; G[对称 A=Aᵀ, 正定 xᵀAx&gt;0]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：矩阵运算的「原子」是加法、乘法、转置；逆与行列式绑定；正定是数值稳定的好性质。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：矩阵像「一段剪辑变换」——乘是「先做 B 再做 A」的组合，逆是「倒放」，行列式为 0 是「这段剪辑把画面压扁成一条线，倒不回去了」。<strong>失效边界<\/strong>：矩阵乘法不交换，AB≠BA，顺序很重要。\n<\/li><li>\n<strong>实例<\/strong>：A=[[1,2],[3,4]]，det=1·4−2·3=−2≠0 ⇒ 可逆；A⁻¹ = (−1/2)[[4,−2],[−3,1]]。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为「矩阵乘法交换」<\/strong>——实际上一般 AB≠BA，甚至 AB 与 BA 尺寸不同。\n<\/li><li>\n<strong>别以为「det=0 只是巧合」<\/strong>——实际上它意味着线性相关，是「不可逆」的代数信号。\n<\/li><li>\n<strong>别以为「对称矩阵就是对角矩阵」<\/strong>——实际上对称只要求 A=Aᵀ，非对角元可以非零。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n（单选）矩阵 A 可逆当且仅当？（答案：B；解析：det(A)≠0）\n<ul>\n<li>\nA. A=Aᵀ   B. det(A)≠0   C. A 全为正   D. A 是方阵\n<\/li><li>\n（单选）(AB)ᵀ = ？（答案：C；解析：转置反序）\n<\/li><li>\nA. AᵀBᵀ   B. ABᵀ   C. BᵀAᵀ   D. BA\n<\/li><li>\n（填空）对称正定矩阵对任意非零 x 满足 xᵀAx __ 0。（答案：&gt;；解析：正定定义）\n<\/li><li>\n（简答）为什么 det(A)=0 意味着不可逆？（答案：行列式为 0 表示 A 的列向量线性相关，A 把空间压成低维，不同 x 映到同一像，无法定义逆）\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n矩阵乘 = 行乘列，不交换。\n<\/li><li>\n可逆 ⇔ det≠0。\n<\/li><li>\n对称正定：A=Aᵀ 且 xᵀAx&gt;0，数值稳定、免选主元。\n<\/ul>", "c01": "<h1>渐近记号<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 3、4、7、17 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p><strong>用 O、Ω、Θ、o、ω 这五把「尺子」描述函数在规模 n→∞ 时的增长量级，忽略常数因子和低阶项。<\/strong><\/p>\n<h2>为什么重要<\/h2>\n<p>算法好不好，看的就是「输入翻倍时运行时间翻几倍」。渐近记号把这件事统一成可比较的语言：O 给上界、Ω 给下界、Θ 给上下一致的阶。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n    A[真实运行时间 f(n)] --&gt; B[O: 上界, f≤c·g]\n    A --&gt; C[Ω: 下界, f≥c·g]\n    A --&gt; D[Θ: 上下都是 g, f∈Θg]\n    A --&gt; E[o: 严格小于, f/g→0]\n    A --&gt; F[ω: 严格大于, f/g→∞]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：Θ 是「精确阶」；O 是「最多这样」；o 是「真的比它小得多」。<\/p>\n<h2>详解<\/h2>\n<ul><li>\n<strong>O(g(n))<\/strong>：存在常数 c、n₀，使 n≥n₀ 时 0≤f(n)≤c·g(n)。白话「最坏不会超过 g 的常数倍」。\n<\/li><li>\n<strong>Ω(g(n))<\/strong>：存在 c、n₀，使 f(n)≥c·g(n)。白话「至少是 g 的常数倍」。\n<\/li><li>\n<strong>Θ(g(n))<\/strong>：同时在 O 与 Ω 里。白话「就是这个量级」。\n<\/li><li>\n<strong>o(g(n))<\/strong>：lim f(n)/g(n)=0。白话「比 g 小一个量级」（如 2n=o(n²)）。\n<\/li><li>\n<strong>ω(g(n))<\/strong>：lim f(n)/g(n)=∞。白话「比 g 大一个量级」。\n<\/ul>\n<p>类比：O 像「考试最多 90 分」，Ω 像「至少 60 分」，Θ 像「稳定在 70±5 分」。失效边界：渐近记号只描述大 n 的行为，小 n 时常数可能更重要。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为「O 表示『平均情况』」——实际上 O 是上界，不特指平均；平均/最坏要单独说明。\n<\/li><li>\n别以为「O(g) 和 Θ(g) 一样」——实际上 Θ 是双向夹住，O 只是单侧上界。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>ch03<\/td><td>定义<\/td><td>O/Ω/Θ/o/ω 五记号<\/td><\/tr><tr><td>ch04<\/td><td>主方法<\/td><td>T(n)=aT(n/b)+f(n) 的 Θ 阶<\/td><\/tr><tr><td>ch07<\/td><td>快排<\/td><td>期望 Θ(n lg n)，最坏 Θ(n²)<\/td><\/tr><tr><td>ch17<\/td><td>摊还<\/td><td>用 Θ 描述摊还代价<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：无（全书起点）。\n<\/li><li>\n后续：递归式与分治、摊还分析（都建立在渐近语言上）。\n<\/ul>", "c02": "<h1>递归式与分治<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 2、4、27、30 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p><strong>把大问题切成 k 个规模减半的子问题、合并答案，写出 T(n)=aT(n/b)+f(n)，再用主方法一把算出渐近阶。<\/strong><\/p>\n<h2>为什么重要<\/h2>\n<p>归并排序、二分查找、Strassen、FFT、并行算法都长在同一个骨架上。掌握「写递归式 → 主方法定阶」是分析一切分治算法的万能钥匙。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[分治三步] --&gt; B[Divide: 切成子问题]\n    B --&gt; C[Conquer: 递归解子问题]\n    C --&gt; D[Combine: 合并答案]\n    D --&gt; E[递归式 T(n)=aT(n/b)+f(n)]\n    E --&gt; F{主方法三情况}\n    F --&gt;|f(n) 小于 n^{log_b a}| G[情况1: Θ(n^{log_b a})]\n    F --&gt;|f(n) 等于 n^{log_b a}| H[情况2: Θ(n^{log_b a}·lg n)]\n    F --&gt;|f(n) 大于 n^{log_b a}| I[情况3: Θ(f(n))]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：分治的所有变体最后都归到同一个递归式；主方法按「合并代价 f(n) 与子问题总增长 n^{log_b a} 的大小关系」分三种情况。<\/p>\n<h2>详解<\/h2>\n<ul><li>\n<strong>代入法<\/strong>：猜一个界，用数学归纳法验证。\n<\/li><li>\n<strong>递归树<\/strong>：画出每层代价，求和（用附录 A 的求和表）。\n<\/li><li>\n<strong>主方法<\/strong>：对 T(n)=aT(n/b)+f(n)，比较 f(n) 与 n^{log_b a}：\n<ul>\n<li>\n情况 1：f(n)=O(n^{log_b a−ε}) ⇒ T(n)=Θ(n^{log_b a})。\n<\/li><li>\n情况 2：f(n)=Θ(n^{log_b a}) ⇒ T(n)=Θ(n^{log_b a}·lg n)。\n<\/li><li>\n情况 3：f(n)=Ω(n^{log_b a+ε}) 且满足正则条件 ⇒ T(n)=Θ(f(n))。\n<\/ul>\n<\/ul>\n<p>类比：分治像「切西瓜」——先切两半（Divide）、每半自己挖空（Conquer）、最后把两半的瓤拼起来（Combine）。失效边界：子问题规模不均（如快排最坏切出 1:n−1）时主方法不直接适用。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为「主方法万能」——实际上它只覆盖 aT(n/b)+f(n) 这种规整递归式。\n<\/li><li>\n别以为「合并代价 f(n) 越小算法越快」——实际上总复杂度由「子问题总量 vs 合并代价」的较大者决定。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>ch02<\/td><td>归并排序<\/td><td>T(n)=2T(n/2)+Θ(n) ⇒ Θ(n lg n)<\/td><\/tr><tr><td>ch04<\/td><td>Strassen<\/td><td>T(n)=7T(n/2)+Θ(n²) ⇒ Θ(n^{lg7})<\/td><\/tr><tr><td>ch30<\/td><td>FFT<\/td><td>T(n)=2T(n/2)+Θ(n) ⇒ Θ(n lg n)<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：渐近记号。\n<\/li><li>\n后续：动态规划（分治的子问题重叠版）、多线程算法。\n<\/ul>", "c03": "<h1>摊还分析<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 10、17、19 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p><strong>一整个操作序列的总成本除以操作数，得到「每次的平均代价」——哪怕单次最坏很贵，只要均摊下来便宜就算便宜。<\/strong><\/p>\n<h2>为什么重要<\/h2>\n<p>动态表扩张、斐波那契堆的「减小键值」、栈的「多弹」这些操作单次看很贵，但反复用下来平均很便宜。摊还分析告诉你「真实平均成本是多少」，而不是被最坏单次吓到。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[摊还分析三种方法] --&gt; B[聚合分析: 算 n 次总代价 T(n), 每次=T(n)/n]\n    A --&gt; C[核算法: 给每种操作预收信用, 余额不能负]\n    A --&gt; D[势能法: 定义势能 Φ, 每次摊还代价=实际+ΔΦ]\n    B --&gt; E[动态表扩张: 总 O(n), 每次均摊 O(1)]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：三种方法殊途同归——聚合直接算总账，核算法像「预付充值」，势能法像「给数据结构记一本势能账」。<\/p>\n<h2>详解<\/h2>\n<ul><li>\n<strong>聚合分析<\/strong>：直接算 n 次操作总代价 T(n)，每次摊还 = T(n)/n。例：动态表从 1 开始翻倍扩张，n 次插入总代价 O(n) ⇒ 每次 O(1)。\n<\/li><li>\n<strong>核算法<\/strong>：给便宜操作「多收一点」，存成信用留给贵操作用；全程信用不能为负。\n<\/li><li>\n<strong>势能法<\/strong>：定义数据结构的「势能」Φ（如动态表中已用与容量差），每次操作摊还代价 = 实际代价 + Φ(后)−Φ(前)。\n<\/ul>\n<p>类比：动态表像「搬家」——每次箱子满了就买大一倍的箱子、把东西全搬一次（贵）；但因为箱子翻倍，两次大搬家之间要插很多次，平均下来每次插入几乎免费。失效边界：摊还分析只保证「序列平均便宜」，不保证「任意单次快」。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为「摊还 O(1) 就是每次都 O(1)」——实际上单次仍可能 Θ(n)，只是均摊后便宜。\n<\/li><li>\n别以为「势能法要找物理势能」——实际上 Φ 是人为定义的账，选得合适就行。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>ch17<\/td><td>动态表<\/td><td>扩张/收缩均摊 O(1)<\/td><\/tr><tr><td>ch19<\/td><td>斐波那契堆<\/td><td>减小键值均摊 O(1)<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：渐近记号。\n<\/li><li>\n后续：斐波那契堆（用摊还分析证明其高效）。\n<\/ul>", "c04": "<h1>平衡搜索树（红黑树与 B 树）<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 12、13、14、18、20 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p><strong>普通二叉搜索树可能退化成链表（O(n)）；平衡树通过「旋转+染色」或「多路分叉」保证树高 O(lg n)，让插入/删除/查询都稳定在 O(lg n)。<\/strong><\/p>\n<h2>为什么重要<\/h2>\n<p>几乎所有需要「有序动态集合」的场景——数据库索引、语言标准库的 map/set——都建立在平衡搜索树上。红黑树是内存版代表，B 树是磁盘版代表。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[动态有序集合] --&gt; B{存储介质?}\n    B --&gt;|内存| C[红黑树: 5 条性质, 旋转恢复平衡]\n    B --&gt;|磁盘/块设备| D[B 树: 多路分叉, 高极小]\n    C --&gt; E[查询/插入/删除 O(lg n)]\n    D --&gt; E\n    F[van Emde Boas 树: 整数键, O(lg lg u)] -.-&gt; C<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：红黑树用染色+旋转把最坏树高压到 2 lg n；B 树每个结点存很多关键字、一次读一块磁盘，因此树矮。<\/p>\n<h2>详解<\/h2>\n<ul><li>\n<strong>二叉搜索树（BST）<\/strong>：左子树键 &lt; 根 &lt; 右子树键。但插入有序序列会退化成链。\n<\/li><li>\n<strong>红黑树<\/strong>：给每个结点标红/黑，满足 5 条性质（根黑、叶黑、红父不能有红子、任意结点到叶的黑点数相同）。插入删除后用<strong>旋转<\/strong>+重新染色恢复。树高 ≤ 2 lg(n+1)，所有操作 O(lg n)。\n<\/li><li>\n<strong>B 树<\/strong>：每个结点存多个关键字、有多个孩子；一次 I/O 读一块（几百 KB），树高只有 3~5 层，适合数据库。\n<\/li><li>\n<strong>van Emde Boas 树<\/strong>：对整数键域 [1,u] 递归分组，操作 O(lg lg u)。\n<\/ul>\n<p>类比：BST 像「排队乱排」——人多时排成长龙；红黑树像「保安每隔几个人就调整队形，队伍永远矮胖」；B 树像「公交站」——一辆车塞很多人，站点数很少。失效边界：键必须可比较；整数键小域才有 vEB 的 lg lg 收益。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为「红黑树每次插入都要旋转」——实际上大多数插入只染色，少数才旋转。\n<\/li><li>\n别以为「B 树是二叉树」——实际上 B 树每个结点可以有几十上百个孩子。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>ch13<\/td><td>红黑树<\/td><td>旋转+染色保 O(lg n)<\/td><\/tr><tr><td>ch14<\/td><td>扩张<\/td><td>顺序统计树、区间树<\/td><\/tr><tr><td>ch18<\/td><td>B 树<\/td><td>磁盘块友好<\/td><\/tr><tr><td>ch20<\/td><td>vEB<\/td><td>整数域 O(lg lg u)<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：渐近记号、递归式。\n<\/li><li>\n后续：优先队列（堆）、数据库索引。\n<\/ul>", "c05": "<h1>散列<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 11 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p><strong>用散列函数 h(key) 把 key 直接映射到数组下标，让「查找/插入/删除」平均 O(1)——代价是要处理「不同 key 撞到同一槽」（碰撞）。<\/strong><\/p>\n<h2>为什么重要<\/h2>\n<p>散列表是所有「键值存储」的底座：Python dict、Java HashMap、数据库的内存索引。理解「平均 O(1) 是怎么来的、什么情况下会退化」是数据结构的基本功。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[key] --&gt; B[散列函数 h(key)]\n    B --&gt; C[数组槽 h(key)]\n    C --&gt; D{槽里空吗?}\n    D --&gt;|空| E[直接放入]\n    D --&gt;|碰撞| F{怎么处理碰撞?}\n    F --&gt;|链表| G[拉链法: 槽挂链表]\n    F --&gt;|线性探测| H[开放寻址: 找下一个空槽]\n    G --&gt; I[完全散列: 二层无碰撞, 查询最坏 O(1)]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：散列的核心矛盾是「h 把大 key 空间压到小数组」；碰撞处理决定常数与最坏情况。<\/p>\n<h2>详解<\/h2>\n<ul><li>\n<strong>直接寻址<\/strong>：key 就是下标。要求 key 范围小。\n<\/li><li>\n<strong>散列表<\/strong>：用 h(key)∈[0,m) 压缩。装载因子 α=n/m。\n<\/li><li>\n<strong>碰撞处理<\/strong>：\n<ul>\n<li>\n<strong>拉链法<\/strong>：每个槽挂链表；期望查找 O(1+α)。\n<\/li><li>\n<strong>开放寻址<\/strong>：线性/二次/双重散列找下一个空槽；不挂链表。\n<\/li><li>\n<strong>散列函数<\/strong>：除法散列 h(k)=k mod m；乘法散列 h(k)=⌊m(kA mod 1)⌋；全域散列用随机函数族防恶意输入。\n<\/li><li>\n<strong>完全散列<\/strong>：二层结构，最坏 O(1) 查询。\n<\/ul>\n<\/ul>\n<p>类比：散列表像「按手机号尾号分抽屉」——尾号相同的人放同一抽屉（碰撞），抽屉里挂个名单（拉链法）。失效边界：若所有 key 都撞到同一槽，退化成链表 O(n)；全域散列就是防这种恶意。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为「散列表最坏 O(1)」——实际上最坏是 O(n)（全碰撞），O(1) 是期望。\n<\/li><li>\n别以为「开放寻址就是删元素时直接清空」——实际上删除要打「墓碑」，否则探测链断了。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>ch11<\/td><td>散列<\/td><td>期望 O(1)，全域散列防恶意<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：渐近记号、概率（附录 C）。\n<\/li><li>\n后续：缓存、字典、数据库索引。\n<\/ul>", "c06": "<h1>动态规划<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 15 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p><strong>当问题有「最优子结构」且「子问题反复重叠」时，把每个子问题的解存进表，自底向上填，避免重复算——这就是动态规划（DP）。<\/strong><\/p>\n<h2>为什么重要<\/h2>\n<p>DP 解决「看起来要穷举指数、其实子问题只有多项式个」的问题：钢条切割、矩阵链乘、最长公共子序列、最优二叉搜索树。它是算法面试和实际优化问题的常客。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[能用 DP 吗?] --&gt; B{最优子结构? 大最优含小最优}\n    B --&gt;|有| C{子问题重叠? 递归会反复用到同一小问题}\n    C --&gt;|有| D[记忆化 or 自底向上填表]\n    D --&gt; E[钢条切割/矩阵链乘/LCS/最优BST]\n    B --&gt;|无| F[分治即可, 子问题不重叠]\n    C --&gt;|无| G[直接递归即可, 不用表]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：DP 的两个适用条件缺一不可；缺「最优子结构」问题都不能拆，缺「重叠」就退化成普通分治。<\/p>\n<h2>详解<\/h2>\n<ul><li>\n<strong>四步走<\/strong>：① 刻画最优子结构；② 递归定义最优值；③ 自底向上算值；④ 构造最优解。\n<\/li><li>\n<strong>记忆化（top-down）<\/strong>：递归 + 查表；算过的子问题存起来。\n<\/li><li>\n<strong>自底向上（bottom-up）<\/strong>：按子问题规模从小到大填表。\n<\/li><li>\n<strong>经典问题<\/strong>：\n<ul>\n<li>\n钢条切割：r[n]=max_{i} (p[i]+r[n−i])。\n<\/li><li>\n矩阵链乘：m[i,j]=min_{k} (m[i,k]+m[k+1,j]+p_{i−1}p_kp_j)，O(n³)。\n<\/li><li>\nLCS：c[i,j] 按 s[i]==t[j] 分两支。\n<\/li><li>\n最优 BST：e[i,j] 类似矩阵链。\n<\/ul>\n<\/ul>\n<p>类比：DP 像「记账」——算过的子问题写在账本上，下次遇到直接查，不再重算。失效边界：若子问题不重叠（如归并排序的左右两半互不相同），DP 的表是浪费的。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为「DP 就是递归」——实际上朴素递归没有表，会指数重复；DP 的灵魂是「存子问题答案」。\n<\/li><li>\n别以为「所有最优化问题都能 DP」——实际上必须同时有最优子结构和重叠子问题。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>ch15<\/td><td>DP<\/td><td>钢条切割 O(n²)、矩阵链 O(n³)、LCS O(mn)<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：递归式与分治。\n<\/li><li>\n后续：贪心（DP 的特例优化）、最短路径（最优子结构）。\n<\/ul>", "c07": "<h1>贪心算法<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 16、23、24 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p><strong>每一步都选「当前看起来最好」的选择，不回头——当问题具有「贪心选择性质」和「最优子结构」时，这种短视反而能得到全局最优。<\/strong><\/p>\n<h2>为什么重要<\/h2>\n<p>DP 要填表、慢；贪心只要排序后线性扫描、快。活动选择、赫夫曼编码、最小生成树、Dijkstra 都是贪心——前提是先证明「当前最优不会害全局」。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[优化问题] --&gt; B{能证明贪心选择安全吗?}\n    B --&gt;|能| C[每步选当前最优, 不回头]\n    B --&gt;|不能| D[用 DP, 别用贪心]\n    C --&gt; E[活动选择: 选结束最早的]\n    C --&gt; F[赫夫曼: 合并频率最低两节点]\n    C --&gt; G[MST: 选最轻跨切口]\n    C --&gt; H[Dijkstra: 选 d 最小的顶点定死]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：贪心和 DP 共用「最优子结构」，但多了一个「贪心选择性质」——当前最优安全。<\/p>\n<h2>详解<\/h2>\n<ul><li>\n<strong>贪心选择性质<\/strong>：全局最优解可以通过「每步做局部最优选择」达到。\n<\/li><li>\n<strong>最优子结构<\/strong>：全局最优包含子问题最优（与 DP 共用）。\n<\/li><li>\n<strong>经典算法<\/strong>：\n<ul>\n<li>\n<strong>活动选择<\/strong>：每次选「结束最早」的兼容活动，O(n lg n)。\n<\/li><li>\n<strong>赫夫曼编码<\/strong>：频率最小的两节点反复合并，得到最优前缀码。\n<\/li><li>\n<strong>MST（Kruskal/Prim）<\/strong>：选最轻跨切口（见 MST 概念页）。\n<\/li><li>\n<strong>Dijkstra<\/strong>：选 d 最小的顶点定死（见最短路径概念页）。\n<\/ul>\n<\/ul>\n<p>类比：贪心像「逛超市每次拿最近的货架」——只有当「最近」永远不会让你错过更优路线时（如活动结束时间不重叠），这个短视才是全局最优。失效边界：若当前最优会锁死未来（如 0/1 背包），贪心就错了，必须 DP。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为「贪心就是『短视』所以总是错」——实际上对满足性质的问题，短视就是最优。\n<\/li><li>\n别以为「背包问题能用贪心」——实际上 0/1 背包贪心错（物品按性价比选可能不如组合），要用 DP。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>ch16<\/td><td>活动选择/赫夫曼<\/td><td>贪心选择性质<\/td><\/tr><tr><td>ch23<\/td><td>MST<\/td><td>切分性质保证贪心安全<\/td><\/tr><tr><td>ch24<\/td><td>Dijkstra<\/td><td>非负权保证「最小 d 可定死」<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：动态规划（贪心是 DP 的特例）。\n<\/li><li>\n后续：最小生成树、最短路径、近似算法。\n<\/ul>", "c08": "<h1>图搜索（BFS 与 DFS）<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 22、24、26 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p><strong>BFS 像水波纹一层层扩（队列），DFS 像走迷宫一条路走到黑（栈/递归）——两者都 O(V+E)，但给你不同的图结构信息。<\/strong><\/p>\n<h2>为什么重要<\/h2>\n<p>几乎所有图算法都是 BFS/DFS 的变体：BFS 求无权最短路、DFS 做拓扑排序和强连通分量、Dijkstra/Prim 在 BFS 骨架上换个优先队列。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[图 G=(V,E)] --&gt; B{BFS 还是 DFS?}\n    B --&gt;|BFS 队列| C[按距离层扩展]\n    C --&gt; D[无权最短路: d[s,v]=层数]\n    C --&gt; E[层次图/广度树]\n    B --&gt;|DFS 栈| F[一条路走到黑, 回溯]\n    F --&gt; G[发现时间/完成时间]\n    G --&gt; H[拓扑排序: 按完成时间逆序]\n    G --&gt; I[强连通分量: 两次 DFS]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：BFS 用「队列」保证按层；DFS 用「栈+时间戳」暴露图的前后结构（拓扑、强连通）。<\/p>\n<h2>详解<\/h2>\n<ul><li>\n<strong>BFS<\/strong>：从 s 出发，先把 s 的所有邻居入队，再逐个扩展。每个顶点首次被发现时的 d 值就是到 s 的无权最短距离。O(V+E)。\n<\/li><li>\n<strong>DFS<\/strong>：递归地沿一条路径走到死，再回溯。给每个顶点记发现时间 d 和完成时间 f。\n<\/li><li>\n<strong>拓扑排序<\/strong>：DAG 上按 DFS 完成时间 f 从大到小输出。\n<\/li><li>\n<strong>强连通分量<\/strong>：先在 G 上 DFS 得 f；再把边反转在转置图上按 f 降序 DFS，每次 DFS 树就是一个 SCC。\n<\/ul>\n<p>类比：BFS 像「广播」——信号一圈圈扩；DFS 像「翻阅家谱」——先把一支脉挖到底，再退回来翻下一支。失效边界：BFS 只能求无权最短路（或权全相等）；有权图要用 Dijkstra。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为「BFS 和 DFS 复杂度不同」——实际上都是 O(V+E)，差别在「得到的信息」。\n<\/li><li>\n别以为「拓扑排序只能 DFS」——实际上也能反复找入度为 0 的顶点（Kahn 算法）。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>ch22<\/td><td>BFS/DFS<\/td><td>O(V+E)，时间戳<\/td><\/tr><tr><td>ch22<\/td><td>拓扑/SCC<\/td><td>DFS 时间戳应用<\/td><\/tr><tr><td>ch26<\/td><td>Edmonds-Karp<\/td><td>BFS 选增广路<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：散列（标记访问）、栈/队列。\n<\/li><li>\n后续：最短路径、最大流、MST。\n<\/ul>", "c09": "<h1>最小生成树<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 23、16、21 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p><strong>在带权无向图里选 |V|−1 条边把所有顶点连起来、总权最小；切分性质保证「每次选最轻跨切口」的贪心一定对。<\/strong><\/p>\n<h2>为什么重要<\/h2>\n<p>MST 是「连通所有点且成本最小」的抽象——电路布线、网络架设、聚类都归约到它。Kruskal 与 Prim 两种贪心实现是「并查集」和「优先队列」两种数据结构的经典练兵。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[带权无向图] --&gt; B[切分性质: 最轻跨切口必在某棵 MST]\n    B --&gt; C{怎么选?}\n    C --&gt;|按权排序+并查集| D[Kruskal: O(E lg V)]\n    C --&gt;|从根长树+优先队列| E[Prim: O(E lg V), 斐波那契堆 O(E+V lg V)]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：两种算法都靠切分性质；Kruskal 全局排边，Prim 从一棵树向外长。<\/p>\n<h2>详解<\/h2>\n<ul><li>\n<strong>生成树<\/strong>：连通所有顶点、|V|−1 条边、无环。\n<\/li><li>\n<strong>切分性质（定理 23.1）<\/strong>：A 是某棵 MST 的边集、切分尊重 A，则横跨切分的最轻边对 A 安全。\n<\/li><li>\n<strong>Kruskal<\/strong>：边按权排序，用并查集判断两端是否同根，不同根就加边。\n<\/li><li>\n<strong>Prim<\/strong>：从根出发，优先队列维护「不在树的顶点到树的最短边」，每次拉最轻的进来。\n<\/ul>\n<p>类比：MST 像「修村村通公路」——每次在已通路区和未通路区之间选最便宜的一段。失效边界：MST 只保证总权最小，不保证任意两点间路径最短（那是最短路）。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为「MST 给出任意两点最短路」——实际上不保证。\n<\/li><li>\n别以为「Prim 必须从某特定点出发」——实际上任意点作根都行。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>ch23<\/td><td>Kruskal/Prim<\/td><td>切分性质 → 贪心安全<\/td><\/tr><tr><td>ch35<\/td><td>TSP 近似<\/td><td>MST 前序遍历给 2-近似<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：贪心、并查集（第 21 章）、图搜索。\n<\/li><li>\n后续：最短路径、TSP 近似。\n<\/ul>", "c10": "<h1>最短路径<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 24、25 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p><strong>所有单源最短路算法都在反复「松弛」d[u]+w(u,v)&lt;d[v]；按什么顺序松弛分出 Bellman-Ford（容负权）、DAG 拓扑序、Dijkstra（非负权）三种。<\/strong><\/p>\n<h2>为什么重要<\/h2>\n<p>地图导航、网络路由、任务调度（差分约束）都建模为最短路。理解「负权边怎么处理」「为什么 Dijkstra 能快」是图算法的分水岭。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[单源 s 到各点最短路] --&gt; B{图长什么样?}\n    B --&gt;|DAG| C[拓扑序后逐边松弛, O(V+E)]\n    B --&gt;|可含负权边| D[Bellman-Ford: 全边松弛|V|-1 轮, O(VE)]\n    B --&gt;|边权非负| E[Dijkstra: 最小 d 先定死, O(E lg V)]\n    D --&gt; F[第 V 轮仍可松弛 ⇒ 负权回路]\n    G[所有点对] --&gt; H[Floyd-Warshall O(n³)]\n    G --&gt; I[Johnson: 重赋权+跑 V 遍 Dijkstra]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：单源问题按「图结构」三选一；所有点对问题在稠密图用 Floyd，稀疏图用 Johnson。<\/p>\n<h2>详解<\/h2>\n<ul><li>\n<strong>松弛<\/strong>：d[u]+w(u,v)&lt;d[v] 就更新 d[v]、π[v]。\n<\/li><li>\n<strong>Bellman-Ford<\/strong>：O(VE)，容负权边，可检测负权回路，可解差分约束。\n<\/li><li>\n<strong>DAG 最短路<\/strong>：拓扑序松弛一次，O(V+E)。\n<\/li><li>\n<strong>Dijkstra<\/strong>：非负权，优先队列取最小 d 定死，O(E lg V)。\n<\/li><li>\n<strong>Floyd-Warshall<\/strong>：放开中转站 k，三重循环 O(n³)。\n<\/li><li>\n<strong>Johnson<\/strong>：势能 h 重赋权 w̃=w+h[u]−h[v] 洗白成非负，再跑 V 遍 Dijkstra。\n<\/ul>\n<p>类比：松弛像导航软件不断「发现更近绕行路」；Dijkstra 像「一旦给你定了主路线就不回头」——所以遇到逆行短小路会错。失效边界：Dijkstra 不容负权边；负权回路让最短路不存在。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为「有负权边就什么算法都不行」——实际上 Bellman-Ford/DAG 都能处理，只有负权回路无解。\n<\/li><li>\n别以为「重赋权会改变最短路」——实际上路径上 h 项首尾相消，最短距离关系不变。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>ch24<\/td><td>单源<\/td><td>松弛+三种算法<\/td><\/tr><tr><td>ch25<\/td><td>所有点对<\/td><td>Floyd-Warshall / Johnson<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：图搜索、优先队列（堆）。\n<\/li><li>\n后续：最大流、差分约束、TSP。\n<\/ul>", "c11": "<h1>最大流<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 26 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p><strong>在「每条管有容量、中间点守恒」的网络里，求从源 s 到汇 t 最大能压多少水；不断在残留网络找增广路挤水，直到找不到路——此时最大流 = 最小割。<\/strong><\/p>\n<h2>为什么重要<\/h2>\n<p>最大流是网络流问题的「母问题」：二分匹配、航线调度、二分图任务分配、甚至某些线性规划都能归约成最大流。它是「用图建模实际分配问题」的典范。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[流网络 G, 容量 c] --&gt; B[残留网络 G_f: 正向余量+反向退流]\n    B --&gt; C[找 s→t 增广路]\n    C --&gt;|找到| D[按瓶颈容量挤水]\n    D --&gt; B\n    C --&gt;|找不到| E[当前 f 即最大流]\n    E --&gt; F[最大流 = 最小 s-t 割容量]\n    G[二分匹配] -.-&gt;|建图| A<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：核心循环「找路→挤水→更新残留」；反向边保证算法能反悔；最大流-最小割定理给终止条件。<\/p>\n<h2>详解<\/h2>\n<ul><li>\n<strong>流<\/strong>：容量限制 0≤f(u,v)≤c(u,v)；中间点守恒（流入=流出）。\n<\/li><li>\n<strong>残留容量<\/strong> c_f(u,v)=c(u,v)−f(u,v)；反向边 c_f(v,u)=f(u,v) 用于退流。\n<\/li><li>\n<strong>Ford-Fulkerson<\/strong>：任意选增广路；Edmonds-Karp 用 BFS 选最短路径，O(VE²)。\n<\/li><li>\n<strong>最大流-最小割定理<\/strong>：找不到增广路时，|f| = 最小 s-t 割的容量。\n<\/li><li>\n<strong>Push-relabel<\/strong>：逐个顶点推送/重贴标签，O(V³)。\n<\/li><li>\n<strong>二分匹配<\/strong>：源→左部→右部→汇，边容量 1，最大流 = 最大匹配。\n<\/ul>\n<p>类比：最大流像水管网供水——每根管粗细有限，你想最大化水厂到用户的总流量；反向边像「之前接错的管可以拆了重接」。失效边界：不允许负容量；节点守恒必须满足。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为「反向边是为了加新容量」——实际上它是「撤销之前流」的账本。\n<\/li><li>\n别以为「最大流只在水管里有用」——实际上二分匹配、任务分配都靠它。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>ch26<\/td><td>Ford-Fulkerson<\/td><td>最大流=最小割<\/td><\/tr><tr><td>ch26<\/td><td>二分匹配<\/td><td>最大流归约<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：图搜索（BFS）、最短路径思想。\n<\/li><li>\n后续：线性规划（LP 是最大流的推广）。\n<\/ul>", "c12": "<h1>NP 完全性<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 34、35 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p><strong>能「猜答案并多项式验证」的问题叫 NP；其中最难的那批叫 NPC——任何 NP 问题都能多项式归约到它们；若任意一个 NPC 有多项式算法，则 P=NP（主流猜想 P≠NP）。<\/strong><\/p>\n<h2>为什么重要<\/h2>\n<p>当你遇到一个「怎么都设计不出多项式算法」的问题，先问它是不是 NPC：若是，就别再死磕精确算法，转用近似算法、启发式或指数级但实用的算法。这是「问题分类学」的实用价值。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[遇到难解问题] --&gt; B{能多项式验证答案?}\n    B --&gt;|不能| C[不属于 NP, 更难]\n    B --&gt;|能| D[能把已知 NPC 问题多项式归约到它?]\n    D --&gt;|能| E[它也是 NPC: 别磕精确算法]\n    D --&gt;|不能| F[可能在 NP-P 之间]\n    E --&gt; G[转向: 近似算法 / 启发式 / 指数但实用]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：判定路径是「先 NP 再归约」；归约是 NPC 证明的唯一钥匙。<\/p>\n<h2>详解<\/h2>\n<ul><li>\n<strong>P<\/strong>：多项式时间可解。\n<\/li><li>\n<strong>NP<\/strong>：多项式时间可验证给定答案。P⊆NP。\n<\/li><li>\n<strong>NPC<\/strong>：NP 中最难；所有 NP 问题可多项式归约到它。\n<\/li><li>\n<strong>Cook-Levin<\/strong>：SAT 是第一个 NPC；3-CNF-SAT、团、顶点覆盖、哈密顿回路、TSP、子集和都是 NPC。\n<\/li><li>\n<strong>多项式归约<\/strong>：把 A 的输入多项式变换成 B 的输入，A 的答案从 B 的答案读出。\n<\/li><li>\n<strong>P=NP?<\/strong>：未决；主流猜想不等。\n<\/ul>\n<p>类比：NPC 像「难题俱乐部」——入门条件是「能把任意 NP 难题翻译成你的问题」。SAT 是第一个会员。失效边界：归约必须多项式时间且等价；指数放大不算。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为「NP = 非多项式」——实际上 NP = Nondeterministic Polynomial（猜+验证）。\n<\/li><li>\n别以为「NPC 证明要设计多项式算法」——实际上是反过来证明它难。\n<\/li><li>\n别以为「P=NP 已被证伪」——实际上未决。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>ch34<\/td><td>P/NP/NPC<\/td><td>归约与 Cook-Levin<\/td><\/tr><tr><td>ch35<\/td><td>近似算法<\/td><td>NPC 问题退而求其次的质量保证<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：渐近记号（多项式定义）。\n<\/li><li>\n后续：近似算法（ρ 近似比）。\n<\/ul>", "__path__": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：算法入门<\/strong><br>阅读：<a href=\"#/book/clrs/chapter/ch01\">第 1 章：算法在计算中的作用<\/a><br>检查点：通过该章自测题（≥80%）<\/li><li class='path-step' id='path-02'><strong>步骤 02：算法基础与归并<\/strong><br>阅读：<a href=\"#/book/clrs/chapter/ch02\">第 2 章：算法基础<\/a><br>检查点：通过该章自测题（≥80%）<\/li><li class='path-step' id='path-03'><strong>步骤 03：函数增长<\/strong><br>阅读：<a href=\"#/book/clrs/chapter/ch03\">第 3 章：函数的增长<\/a><br>检查点：通过该章自测题（≥80%）<\/li><li class='path-step' id='path-04'><strong>步骤 04：分治与主方法<\/strong><br>阅读：<a href=\"#/book/clrs/chapter/ch04\">第 4 章：分治策略<\/a><br>检查点：通过该章自测题（≥80%）<\/li><li class='path-step' id='path-05'><strong>步骤 05：概率分析<\/strong><br>阅读：<a href=\"#/book/clrs/chapter/ch05\">第 5 章：概率分析和随机算法<\/a><br>检查点：通过该章自测题（≥80%）<\/li><li class='path-step' id='path-06'><strong>步骤 06：堆与堆排序<\/strong><br>阅读：<a href=\"#/book/clrs/chapter/ch06\">第 6 章：堆排序<\/a><br>检查点：通过该章自测题（≥80%）<\/li><li class='path-step' id='path-07'><strong>步骤 07：快速排序<\/strong><br>阅读：<a href=\ 析。<\/p>", "__quiz_ch36__": "<h1>测验：附录 A：求和<\/h1><div class='quiz-item' data-qid='ch36-q036' data-type='single'><p class='quiz-q'><b>Q1.<\/b> Σ_{k=1}^{n} k 的渐近阶是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch36-q036' value='0'> Θ(n)<\/label><label class='quiz-opt'><input type='radio' name='ch36-q036' value='1'> Θ(n²)<\/label><label class='quiz-opt'><input type='radio' name='ch36-q036' value='2'> Θ(n³)<\/label><label class='quiz-opt'><input type='radio' name='ch36-q036' value='3'> Θ(lg n)<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch37__": "<h1>测验：附录 B：集合、关系、函数、图、树<\/h1><div class='quiz-item' data-qid='ch37-q037' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 自反+对称+传递的关系叫？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch37-q037' value='0'> 偏序<\/label><label class='quiz-opt'><input type='radio' name='ch37-q037' value='1'> 等价关系<\/label><label class='quiz-opt'><input type='radio' name='ch37-q037' value='2'> 函数<\/label><label class='quiz-opt'><input type='radio' name='ch37-q037' value='3'> 空关系<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch38__": "<h1>测验：附录 C：计数与概率<\/h1><div class='quiz-item' data-qid='ch38-q038' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 期望线性 E[X+Y]=E[X]+E[Y] 要求什么？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch38-q038' value='0'> X、Y 独立<\/label><label class='quiz-opt'><input type='radio' name='ch38-q038' value='1'> 无要求<\/label><label class='quiz-opt'><input type='radio' name='ch38-q038' value='2'> X、Y 同分布<\/label><label class='quiz-opt'><input type='radio' name='ch38-q038' value='3'> X、Y 不相关<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch39__": "<h1>测验：附录 D：矩阵<\/h1><div class='quiz-item' data-qid='ch39-q039' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 矩阵 A 可逆当且仅当？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch39-q039' value='0'> A=Aᵀ<\/label><label class='quiz-opt'><input type='radio' name='ch39-q039' value='1'> det(A)≠0<\/label><label class='quiz-opt'><input type='radio' name='ch39-q039' value='2'> A 全为正<\/label><label class='quiz-opt'><input type='radio' name='ch39-q039' value='3'> A 是 3×3<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__cards__": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "__glossary__": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='算法'>算法 — 把输入映射到输出的确定性指令序列 <span class=glossary-ref>（第 1 章：算法在计算中的作用）<\/span><\/li><li data-term='θ/o/ω'>Θ/O/Ω — 渐近精确阶/上界/下界 <span class=glossary-ref>（第 3 章：函数的增长）<\/span><\/li><li data-term='主方法'>主方法 — 给 T(n)=aT(n/b)+f(n) 定阶的三情况表 <span class=glossary-ref>（第 4 章：分治策略）<\/span><\/li><li data-term='分治'>分治 — 切分子问题、递归解、合并 <span class=glossary-ref>（第 4 章：分治策略）<\/span><\/li><li data-term='指示器随机变量'>指示器随机变量 — 取值 0/1 的随机变量，用于算期望 <span class=glossary-ref>（第 5 章：概率分析和随机算法）<\/span><\/li><li data-term='堆'>堆 — 父键≥子键的完全二叉树数组 <span class=glossary-ref>（第 6 章：堆排序）<\/span><\/li><li data-term='优先队列'>优先队列 — 支持取最大/最小的队列 <span class=glossary-ref>（第 6 章：堆排序）<\/span><\/li><li data-term='计数排序'>计数排序 — 用计数桶的线性时间排序 <span class=glossary-ref>（第 8 章：线性时间排序）<\/span><\/li><li data-term='栈'>栈 — 后进先出 LIFO <span class=glossary-ref>（第 10 章：基本数据结构）<\/span><\/li><li data-term='队列'>队列 — 先进先出 FIFO <span class=glossary-ref>（第 10 章：基本数据结构）<\/span><\/li><li data-term='散列函数'>散列函数 — 把 key 映射到数组下标的函数 <span class=glossary-ref>（第 11 章：散列表）<\/span><\/li><li data-term='碰撞'>碰撞 — 不同 key 映到同一槽 <span class=glossary-ref>（第 11 章：散列表）<\/span><\/li><li data-term='装载因子'>装载因子 — 元素数/槽数 <span class=glossary-ref>（第 11 章：散列表）<\/span><\/li><li data-term='二叉搜索树'>二叉搜索树 — 左&lt;根&lt;右的二叉树 <span class=glossary-ref>（第 12 章：二叉搜索树）<\/span><\/li><li data-term='红黑树'>红黑树 — 5 条性质保平衡的 BST <span class=glossary-ref>（第 13 章：红黑树）<\/span><\/li><li data-term='旋转'>旋转 — 调整树结构保平衡的操作 <span class=glossary-ref>（第 13 章：红黑树）<\/span><\/li><li data-term='最优子结构'>最优子结构 — 全局最优含子问题最优 <span class=glossary-ref>（第 15 章：动态规划）<\/span><\/li><li data-term='重叠子问题'>重叠子问题 — 递归反复用到同一小问题 <span class=glossary-ref>（第 15 章：动态规划）<\/span><\/li><li data-term='动态规划'>动态规划 — 存子问题答案自底向上填表 <span class=glossary-ref>（第 15 章：动态规划）<\/span><\/li><li data-term='贪心选择性质'>贪心选择性质 — 局部最优可推全局最优 <span class=glossary-ref>（第 16 章：贪心算法）<\/span><\/li><li data-term='摊还分析'>摊还分析 — 一整段操作的平均代价 <span class=glossary-ref>（第 17 章：摊还分析）<\/span><\/li><li data-term='b 树'>B 树 — 多路平衡查找树，磁盘友好 <span class=glossary-ref>（第 18 章：B 树）<\/span><\/li><li data-term='斐波那契堆'>斐波那契堆 — 松弛堆，decrease-key 均摊 O(1) <span class=glossary-ref>（第 19 章：斐波那契堆）<\/span><\/li><li data-term='并查集'>并查集 — 支持 UNION/FIND-SET 的结构 <span class=glossary-ref>（第 21 章：用于不相交集合的数据结构）<\/span><\/li><li data-term='路径压缩'>路径压缩 — 查找时把节点直接挂到根 <span class=glossary-ref>（第 21 章：用于不相交集合的数据结构）<\/span><\/li><li data-term='按秩合并'>按秩合并 — 把矮树挂到高树根下 <span class=glossary-ref>（第 21 章：用于不相交集合的数据结构）<\/span><\/li><li data-term='bfs'>BFS — 广度优先，队列按层扩 <span class=glossary-ref>（第 22 章：基本的图算法）<\/span><\/li><li data-term='dfs'>DFS — 深度优先，栈一条路走到底 <span class=glossary-ref>（第 22 章：基本的图算法）<\/span><\/li><li data-term='拓扑排序'>拓扑排序 — DAG 顶点按完成时间逆序 <span class=glossary-ref>（第 22 章：基本的图算法）<\/span><\/li><li data-term='强连通分量'>强连通分量 — 互相可达的最大顶点集 <span class=glossary-ref>（第 22 章：基本的图算法）<\/span><\/li><li data-term='生成树'>生成树 — 连通所有顶点的无环边集 <span class=glossary-ref>（第 23 章：最小生成树）<\/span><\/li><li data-term='切分'>切分 — 把 V 分成 S 与 V−S <span class=glossary-ref>（第 23 章：最小生成树）<\/span><\/li><li data-term='松弛'>松弛 — d[u]+w(u,v)&lt;d[v] 就更新 <span class=glossary-ref>（第 24 章：单源最短路径）<\/span><\/li><li data-term='负权回路'>负权回路 — 总权为负的环，最短路不存在 <span class=glossary-ref>（第 24 章：单源最短路径）<\/span><\/li><li data-term='残留网络'>残留网络 — 还能前进+可退流的图 <span class=glossary-ref>（第 26 章：最大流）<\/span><\/li><li data-term='增广路'>增广路 — 残留网络中 s→t 路径 <span class=glossary-ref>（第 26 章：最大流）<\/span><\/li><li data-term='最大流-最小割'>最大流-最小割 — 最大流值=最小 s-t 割容量 <span class=glossary-ref>（第 26 章：最大流）<\/span><\/li><li data-term='工作量 t₁'>工作量 T₁ — 并行算法全部指令之和 <span class=glossary-ref>（第 27 章：多线程算法）<\/span><\/li><li data-term='持续时间 t∞'>持续时间 T∞ — 关键路径长度 <span class=glossary-ref>（第 27 章：多线程算法）<\/span><\/li><li data-term='lup 分解'>LUP 分解 — PA=LU 三角分解 <span class=glossary-ref>（第 28 章：矩阵运算）<\/span><\/li><li data-term='选主元'>选主元 — 换行把最大绝对值换到主元位 <span class=glossary-ref>（第 28 章：矩阵运算）<\/span><\/li><li data-term='对称正定矩阵'>对称正定矩阵 — A=Aᵀ 且 xᵀAx&gt;0 <span class=glossary-ref>（第 28 章：矩阵运算）<\/span><\/li><li data-term='标准型 lp'>标准型 LP — max cᵀx, Ax≤b, x≥0 <span class=glossary-ref>（第 29 章：线性规划）<\/span><\/li><li data-term='单纯形法'>单纯形法 — 沿可行域顶点爬坡 <span class=glossary-ref>（第 29 章：线性规划）<\/span><\/li><li data-term='对偶'>对偶 — LP 的配对问题，最优值相等 <span class=glossary-ref>（第 29 章：线性规划）<\/span><\/li><li data-term='dft/fft'>DFT/FFT — 离散傅里叶变换/快速算法 <span class=glossary-ref>（第 30 章：多项式与快速傅里叶变换）<\/span><\/li><li data-term='欧几里得算法'>欧几里得算法 — 辗转相除求 gcd <span class=glossary-ref>（第 31 章：数论算法）<\/span><\/li><li data-term='模逆元'>模逆元 — ax≡1 mod n 的 x <span class=glossary-ref>（第 31 章：数论算法）<\/span><\/li><li data-term='反复平方'>反复平方 — O(lg b) 算 aᵇ mod n <span class=glossary-ref>（第 31 章：数论算法）<\/span><\/li><li data-term='rsa'>RSA — 大素数公钥加密 <span class=glossary-ref>（第 31 章：数论算法）<\/span><\/li><li data-term='前缀函数 π'>前缀函数 π — KMP 中前 q 字符的最长真前后缀 <span class=glossary-ref>（第 32 章：字符串匹配）<\/span><\/li><li data-term='rabin-karp'>Rabin-Karp — 滚动哈希字符串匹配 <span class=glossary-ref>（第 32 章：字符串匹配）<\/span><\/li><li data-term='叉积'>叉积 — x₁y₂−x₂y₁，符号表转向 <span class=glossary-ref>（第 33 章：计算几何学）<\/span><\/li><li data-term='凸包'>凸包 — 包住所有点的最小凸多边形 <span class=glossary-ref>（第 33 章：计算几何学）<\/span><\/li><li data-term='p'>P — 多项式时间可解类 <span class=glossary-ref>（第 34 章：NP 完全性）<\/span><\/li><li data-term='np'>NP — 多项式时间可验证答案类 <span class=glossary-ref>（第 34 章：NP 完全性）<\/span><\/li><li data-term='npc'>NPC — NP 中最难，所有 NP 可归约到它 <span class=glossary-ref>（第 34 章：NP 完全性）<\/span><\/li><li data-term='多项式归约'>多项式归约 — A 输入多项式变 B 输入 <span class=glossary-ref>（第 34 章：NP 完全性）<\/span><\/li><li data-term='cook-levin'>Cook-Levin — SAT 是首个 NPC 证明 <span class=glossary-ref>（第 34 章：NP 完全性）<\/span><\/li><li data-term='近似比 ρ'>近似比 ρ — 算法解/最优解的最坏比值 <span class=glossary-ref>（第 35 章：近似算法）<\/span><\/li><li data-term='fptas'>FPTAS — 完全多项式近似方案 <span class=glossary-ref>（第 35 章：近似算法）<\/span><\/li><li data-term='等比级数'>等比级数 — Σ xᵏ 求和公式 <span class=glossary-ref>（附录 A：求和）<\/span><\/li><li data-term='等价关系'>等价关系 — 自反+对称+传递 <span class=glossary-ref>（附录 B：集合、关系、函数、图、树）<\/span><\/li><li data-term='双射'>双射 — 既单又满的函数 <span class=glossary-ref>（附录 B：集合、关系、函数、图、树）<\/span><\/li><li data-term='二项分布'>二项分布 — n 次伯努利成功 k 次 <span class=glossary-ref>（附录 C：计数与概率）<\/span><\/li><li data-term='期望线性'>期望线性 — E[aX+bY]=aE[X]+bE[Y] <span class=glossary-ref>（附录 C：计数与概率）<\/span><\/li><li data-term='行列式'>行列式 — 可逆当且仅当 det≠0 <span class=glossary-ref>（附录 D：矩阵）<\/span><\/li><\/ul>", "__patterns__": "<h1>模式与框架库<\/h1>\n<h2>框架：算法分析四步<\/h2>\n<ol><li>\n<strong>写递归式<\/strong>：把算法写成 T(n)=aT(n/b)+f(n) 或直接计数操作。\n<\/li><li>\n<strong>定渐近阶<\/strong>：用主方法/递归树/积分夹逼给出 Θ/O。\n<\/li><li>\n<strong>看最坏与期望<\/strong>：区分 worst-case 与 average-case（快排是典型）。\n<\/li><li>\n<strong>找常数与实现<\/strong>：渐近阶相同时常数决定谁更快（如快排 vs 归并）。\n<\/ol>\n<h2>框架：设计算法三范式<\/h2>\n<ul><li>\n<strong>分治<\/strong>：子问题不重叠 → 递归+合并。\n<\/li><li>\n<strong>动态规划<\/strong>：子问题重叠 + 最优子结构 → 填表。\n<\/li><li>\n<strong>贪心<\/strong>：再叠加「贪心选择性质」→ 每步选当前最优不回头。\n<\/ul>\n<h2>决策规则<\/h2>\n<h3>该用哪个排序？<\/h3>\n<ul><li>\n数据小、基本有序：插入排序。\n<\/li><li>\n通用、内存够：快排（期望 O(n lg n)）。\n<\/li><li>\n要求稳定且最坏 O(n lg n)：归并排序。\n<\/li><li>\n数据在 [0,k] 范围：计数/基数排序 O(n+k)。\n<\/li><li>\n需要实时取最大/最小：堆排序/优先队列。\n<\/ul>\n<h3>该用哪个最短路？<\/h3>\n<ul><li>\n边权非负：Dijkstra O(E lg V)。\n<\/li><li>\n可含负权边：Bellman-Ford O(VE)。\n<\/li><li>\nDAG：拓扑序松弛 O(V+E)。\n<\/li><li>\n所有点对：稠密图 Floyd-Warshall O(n³)；稀疏图 Johnson。\n<\/ul>\n<h3>问题是 NPC 怎么办？<\/h3>\n<ol><li>\n先确认是否真在 NP 内。\n<\/li><li>\n找已知 NPC 问题做多项式归约。\n<\/li><li>\n若确认 NPC：放弃精确多项式，转向近似算法（证明 ρ）、启发式、或指数级但实用（分支定界）。\n<\/ol>\n<h2>反模式<\/h2>\n<h3>反模式 1：把「平均情况」当「最坏情况」<\/h3>\n<p>快排平均 O(n lg n)，但最坏 O(n²)（已排序输入+选首元素为枢轴）。<strong>替代<\/strong>：随机化选枢轴，把最坏变成概率意义上的小概率事件。<\/p>\n<h3>反模式 2：用朴素递归不存子问题<\/h3>\n<p>写 Fibonacci 递归 f(n)=f(n−1)+f(n−2) 是指数的；<strong>替代<\/strong>：记忆化或自底向上 DP 表，O(n)。<\/p>\n<h3>反模式 3：Dijkstra 用在负权边图上<\/h3>\n<p>「先定死最小 d」在负权边图上会被后续负权边推翻。<strong>替代<\/strong>：负权边用 Bellman-Ford；负权回路不存在最短路。<\/p>\n<h3>反模式 4：忽略摊还分析被单次最坏吓到<\/h3>\n<p>动态表单次扩张 Θ(n)，但均摊 O(1)。<strong>替代<\/strong>：看一整段操作的总成本，而不是单次峰值。<\/p>\n<h3>反模式 5：归约时放大输入规模<\/h3>\n<p>NPC 证明中把 A 输入指数变换成 B 输入，不算多项式归约。<strong>替代<\/strong>：保证变换是多项式时间且等价。<\/p>\n<h3>反模式 6：把 NPC 问题硬磕精确多项式<\/h3>\n<p>找不到就怀疑自己。<strong>替代<\/strong>：先查它是不是已知 NPC（SAT/团/顶点覆盖/哈密顿/TSP/子集和），若是就走近似或指数路线。<\/p>", "__cheatsheet__": "<h1>速查表<\/h1>\n<h2>算法复杂度速查<\/h2>\n<table><thead><tr><th>算法<\/th><th>最坏<\/th><th>期望<\/th><th>备注<\/th><\/tr><\/thead><tbody><tr><td>插入排序<\/td><td>Θ(n²)<\/td><td>—<\/td><td>小数据/基本有序快<\/td><\/tr><tr><td>归并排序<\/td><td>Θ(n lg n)<\/td><td>—<\/td><td>稳定，需 O(n) 额外空间<\/td><\/tr><tr><td>堆排序<\/td><td>O(n lg n)<\/td><td>—<\/td><td>原地，不稳定<\/td><\/tr><tr><td>快速排序<\/td><td>Θ(n²)<\/td><td>Θ(n lg n)<\/td><td>随机化枢轴<\/td><\/tr><tr><td>计数排序<\/td><td>O(n+k)<\/td><td>—<\/td><td>数据范围 [0,k]<\/td><\/tr><tr><td>基数排序<\/td><td>O(d(n+k))<\/td><td>—<\/td><td>d 位、每位 [0,k]<\/td><\/tr><tr><td>顺序统计(最坏线性)<\/td><td>Θ(n)<\/td><td>—<\/td><td>BFPRT 选中位数<\/td><\/tr><tr><td>BFS / DFS<\/td><td>O(V+E)<\/td><td>—<\/td><td>—<\/td><\/tr><tr><td>拓扑排序<\/td><td>O(V+E)<\/td><td>—<\/td><td>DAG<\/td><\/tr><tr><td>Kruskal<\/td><td>O(E lg V)<\/td><td>—<\/td><td>并查集<\/td><\/tr><tr><td>Prim (二叉堆)<\/td><td>O(E lg V)<\/td><td>—<\/td><td>斐波那契堆 O(E+V lg V)<\/td><\/tr><tr><td>Bellman-Ford<\/td><td>O(VE)<\/td><td>—<\/td><td>容负权边<\/td><\/tr><tr><td>Dijkstra<\/td><td>O(E lg V)<\/td><td>—<\/td><td>不容负权边<\/td><\/tr><tr><td>Floyd-Warshall<\/td><td>Θ(n³)<\/td><td>—<\/td><td>所有点对<\/td><\/tr><tr><td>Johnson<\/td><td>O(V² lg V+VE)<\/td><td>—<\/td><td>稀疏图+负权边<\/td><\/tr><tr><td>Edmonds-Karp<\/td><td>O(VE²)<\/td><td>—<\/td><td>BFS 增广<\/td><\/tr><tr><td>Push-relabel<\/td><td>O(V³)<\/td><td>—<\/td><td>前置重贴标签<\/td><\/tr><\/tbody><\/table>\n<h2>主方法三情况（T(n)=aT(n/b)+f(n)）<\/h2>\n<table><thead><tr><th>情况<\/th><th>条件<\/th><th>解<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>f(n)=O(n^{log_b a−ε})<\/td><td>Θ(n^{log_b a})<\/td><\/tr><tr><td>2<\/td><td>f(n)=Θ(n^{log_b a})<\/td><td>Θ(n^{log_b a}·lg n)<\/td><\/tr><tr><td>3<\/td><td>f(n)=Ω(n^{log_b a+ε}) 且正则<\/td><td>Θ(f(n))<\/td><\/tr><\/tbody><\/table>\n<h2>常用求和<\/h2>\n<table><thead><tr><th>求和<\/th><th>结果<\/th><\/tr><\/thead><tbody><tr><td>Σ_{k=1}^{n} k<\/td><td>n(n+1)/2 = Θ(n²)<\/td><\/tr><tr><td>Σ_{k=1}^{n} k²<\/td><td>n(n+1)(2n+1)/6 = Θ(n³)<\/td><\/tr><tr><td>Σ_{k=0}^{n} xᵏ (x≠1)<\/td><td>(x^{n+1}−1)/(x−1)<\/td><\/tr><tr><td>Σ_{k=0}^{∞} xᵏ (\\<\/td><td>x\\<\/td><td>&lt;1)<\/td><td>1/(1−x)<\/td><\/tr><tr><td>Hₙ = Σ1/k<\/td><td>Θ(lg n)<\/td><\/tr><\/tbody><\/table>\n<h2>数据结构操作复杂度<\/h2>\n<table><thead><tr><th>结构<\/th><th>查找<\/th><th>插入<\/th><th>删除<\/th><\/tr><\/thead><tbody><tr><td>有序数组<\/td><td>O(lg n)<\/td><td>O(n)<\/td><td>O(n)<\/td><\/tr><tr><td>链表<\/td><td>O(n)<\/td><td>O(1)<\/td><td>O(1)（给定结点）<\/td><\/tr><tr><td>散列表<\/td><td>期望 O(1)<\/td><td>期望 O(1)<\/td><td>期望 O(1)<\/td><\/tr><tr><td>二叉搜索树<\/td><td>O(n) 最坏<\/td><td>O(n)<\/td><td>O(n)<\/td><\/tr><tr><td>红黑树<\/td><td>O(lg n)<\/td><td>O(lg n)<\/td><td>O(lg n)<\/td><\/tr><tr><td>B 树<\/td><td>O(lg n) I/O<\/td><td>O(lg n)<\/td><td>O(lg n)<\/td><\/tr><tr><td>斐波那契堆<\/td><td>—<\/td><td>均摊 O(1)<\/td><td>均摊 O(lg n)<\/td><\/tr><tr><td>并查集<\/td><td>近似 O(α(n))<\/td><td>—<\/td><td>—<\/td><\/tr><\/tbody><\/table>\n<h2>数论工具<\/h2>\n<table><thead><tr><th>工具<\/th><th>结论<\/th><\/tr><\/thead><tbody><tr><td>gcd(a,b)<\/td><td>欧几里得 gcd(b, a mod b)，O(lg a)<\/td><\/tr><tr><td>模逆元<\/td><td>扩展欧几里得求 ax+by=gcd，gcd=1 时 x 即逆元<\/td><\/tr><tr><td>快速幂<\/td><td>aᵇ mod n，O(lg b) 次模乘<\/td><\/tr><tr><td>CRT<\/td><td>n=∏nᵢ 互素 ⇔ 模 n 与模各 nᵢ 一一对应<\/td><\/tr><tr><td>RSA<\/td><td>公钥 (e,n) 加密 mᵉ；私钥 d 解密 cᵈ<\/td><\/tr><\/tbody><\/table>\n<h2>NPC 经典问题清单<\/h2>\n<p>SAT → 3-CNF-SAT → 团 / 顶点覆盖 / 哈密顿回路 / TSP（判定）/ 子集和。<\/p>"},"nav":[{"label": "学习路径", "href": "#/path"}, {"label": "章节", "children": [{"label": "第 1 章：算法在计算中的作用", "href": "#/chapter/ch01"}, {"label": "第 2 章：算法基础", "href": "#/chapter/ch02"}, {"label": "第 3 章：函数的增长", "href": "#/chapter/ch03"}, {"label": "第 4 章：分治策略", "href": "#/chapter/ch04"}, {"label": "第 5 章：概率分析和随机算法", "href": "#/chapter/ch05"}, {"label": "第 6 章：堆排序", "href": "#/chapter/ch06"}, {"label": "第 7 章：快速排序", "href": "#/chapter/ch07"}, {"label": "第 8 章：线性时间排序", "href": "#/chapter/ch08"}, {"label": "第 9 章：中位数和顺序统计量", "href": "#/chapter/ch09"}, {"label": "第 10 章：基本数据结构", "href": "#/chapter/ch10"}, {"label": "第 11 章：散列表", "href": "#/chapter/ch11"}, {"label": "第 12 章：二叉搜索树", "href": "#/chapter/ch12"}, {"label": "第 13 章：红黑树", "href": "#/chapter/ch13"}, {"label": "第 14 章：数据结构的扩张", "href": "#/chapter/ch14"}, {"label": "第 15 章：动态规划", "href": "#/chapter/ch15"}, {"label": "第 16 章：贪心算法", "href": "#/chapter/ch16"}, {"label": "第 17 章：摊还分析", "href": "#/chapter/ch17"}, {"label": "第 18 章
