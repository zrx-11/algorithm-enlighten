const CROSS = {"readme": "<h1>四本算法书 · 跨书总览<\/h1>\n<blockquote>&gt; 这是一套把四本算法经典「点化」成零基础可自学课程之后的<strong>总导航<\/strong>。<\/blockquote>\n<blockquote>&gt; 四本书不是让你都从头读到尾，而是一级一级往上爬的台阶：先建立直觉，再系统建模，再工程选型，最后数学严谨化。<\/blockquote>\n<blockquote>&gt; 本目录只做「跨书串联」，每本书自己的章节正文、术语表、测验、抽认卡都在各自目录里。<\/blockquote>\n<hr>\n<h2>一、四本书一句话定位对比<\/h2>\n<table><thead><tr><th><\/th><th>算法图解<\/th><th>Hello 算法<\/th><th>算法（第4版）<\/th><th>算法导论（CLRS）<\/th><\/tr><\/thead><tbody><tr><td><strong>作者<\/strong><\/td><td>Aditya Bhargava（袁国忠 译）<\/td><td>靳宇栋 Krahets<\/td><td>Sedgewick &amp; Wayne（谢路云 译）<\/td><td>Cormen / Leiserson / Rivest / Stein<\/td><\/tr><tr><td><strong>演示语言<\/strong><\/td><td>Python<\/td><td>Python<\/td><td>Java<\/td><td>伪代码<\/td><\/tr><tr><td><strong>章节数<\/strong><\/td><td>11 章<\/td><td>17 章（含第0章导读）<\/td><td>25 节（按原书 6 章拆小节）<\/td><td>39 单元（35 章 + 4 附录）<\/td><\/tr><tr><td><strong>风格<\/strong><\/td><td>生活类比 + 一页图 + 一段代码，最薄最暖<\/td><td>系统课：复杂度→数据结构→四大策略，代码可跑<\/td><td>实现→分析→比较→改进，讲工程选型<\/td><td>最严谨：定理、证明、渐近记号全套<\/td><\/tr><tr><td><strong>它回答的问题<\/strong><\/td><td>&quot;算法这东西大概是怎么回事？&quot;<\/td><td>&quot;数据结构和算法到底有哪几类？怎么写？&quot;<\/td><td>&quot;这个场景到底该选哪个？为什么？&quot;<\/td><td>&quot;凭什么说它是对的、是快的？快到什么量级？&quot;<\/td><\/tr><tr><td><strong>适合谁<\/strong><\/td><td>完全没碰过算法、想先不怕它的人<\/td><td>想系统过一遍数据结构+算法策略的人<\/td><td>想写出工程上能用的代码、懂选型的人<\/td><td>考研/读论文/想懂证明与复杂度下界的人<\/td><\/tr><\/tbody><\/table>\n<p><strong>一句话<\/strong>：图解给你「感觉」，Hello 给你「骨架」，第四版给你「工程手感」，导论给你「数学底座」。<\/p>\n<hr>\n<h2>二、推荐学习顺序<\/h2>\n<blockquote>&gt; 推荐顺序：<strong>算法图解 → Hello 算法 → 算法（第4版） → 算法导论<\/strong><\/blockquote>\n<blockquote>&gt; 这个顺序是拿四本书 manifest 里的真实难度与覆盖面核对过的，结论成立，下面说明为什么。<\/blockquote>\n<h3>为什么是这个顺序（三条依据）<\/h3>\n<p><strong>依据 1：难度曲线由浅入深，每一级都踩在上一级的肩膀上<\/strong><\/p>\n<ul><li>\n图解 11 章里难度标 1~2 的占绝大多数（manifest 难度字段：ch01/ch02/ch10/ch11 都是 1），它只讲「直觉」，不要求你会写完整工程代码。\n<\/li><li>\nHello 算法把图解里「点到为止」的东西系统展开：图解第3章讲递归，Hello 用整整 ch02/ch07/ch12/ch14 反复打磨；图解 ch05 讲散列表，Hello 有独立 ch06。\n<\/li><li>\n第四版突然切到 Java、强调 ADT（抽象数据类型，即「只露操作接口、藏内部实现」）和排序选型，这是「工程化」的一跳，必须先有 Hello 的 Python 骨架才接得住。\n<\/li><li>\n导论要求你读 Θ/O/Ω 三套渐近记号、主方法（给递归式 T(n)=aT(n/b)+f(n) 定阶的工具）、循环不变式证明，这是「数学化」的最后一跳。\n<\/ul>\n<p><strong>依据 2：覆盖面是「补盲」关系，不重复也不打架<\/strong><\/p>\n<ul><li>\n图解<strong>没讲<\/strong>的：堆、平衡树、最小生成树、并查集、字符串匹配、回溯。这些空缺由 Hello（补堆 ch08、回溯 ch13）和第四版（补并查集 ch01e、最小生成树 ch04c、红黑树 ch03c、字符串 ch05a~e）逐一补上。\n<\/li><li>\nHello<strong>没讲透<\/strong>的：红黑树只在 ch07 提了一嘴 AVL，最小生成树、并查集、KMP 字符串匹配完全没有——这些正是第四版的主场。\n<\/li><li>\n第四版<strong>没有单独成章<\/strong>的：动态规划、回溯（散见各章）——这两块的「系统课」其实在 Hello（ch14/ch13）和导论（ch15）里。\n<\/li><li>\n导论独有、前三本都不碰的：摊还分析 ch17、B 树 ch18、斐波那契堆 ch19、最大流 ch26、数论与 RSA ch31、FFT ch30、NP 完全性 ch34。这些是「进阶弹药库」。\n<\/ul>\n<p><strong>依据 3：语言与讲解风格逐级加码<\/strong><\/p>\n<ul><li>\nPython 直觉（图解）→ Python 可运行代码（Hello）→ Java 工程实现（第四版）→ 伪代码 + 数学（导论）。\n<\/li><li>\n先在最熟悉的 Python 里建立「复杂度手感」，再换成 Java 理解「为什么工程上要封装 ADT」，最后读伪代码时你已经知道它在描述什么，不会被语法绊住。\n<\/ul>\n<h3>每一步读完的「能力里程碑」<\/h3>\n<table><thead><tr><th>阶段<\/th><th>读完后你应该能<\/th><\/tr><\/thead><tbody><tr><td>① 图解<\/td><td>能口算 log₂n、分清 O(n)/O(n²)/O(n!)；能手算 BFS 和狄克斯特拉的小例子；知道背包问题大概怎么填表<\/td><\/tr><tr><td>② Hello<\/td><td>能独立写出数组/链表/栈/队列/哈希表/二叉树/堆的 Python 实现；能判断一个题该用分治、回溯还是动态规划；能给一段代码估时间+空间复杂度<\/td><\/tr><tr><td>③ 第四版<\/td><td>能在「要排序」时按数据量/稳定性/内存约束选出插入/归并/快排/堆排；能讲清 BST 为什么会退化、红黑树怎么救；能读懂邻接表上的 Dijkstra/Prim/Kruskal<\/td><\/tr><tr><td>④ 导论<\/td><td>能用主方法解递归式；能讲清 P/NP/NPC 的区别；能证明「基于比较的排序最快就是 O(n log n)」；看得懂论文里的复杂度声明<\/td><\/tr><\/tbody><\/table>\n<h3>何时可以跳过 / 直接进阶<\/h3>\n<ul><li>\n<strong>已经会 Python、上过一门数据结构课<\/strong>：图解可以只看 ch01（大O手感）和 ch07/ch09（Dijkstra、DP 直觉），其余跳，直接进 Hello。\n<\/li><li>\n<strong>Hello 觉得简单<\/strong>：ch04~ch09（基本数据结构）可快速过，把时间留给 ch12~ch15（分治/回溯/DP/贪心），然后直接进第四版。\n<\/li><li>\n<strong>第四版里 Java 语法是障碍<\/strong>：ch01a/ch01b 的编程模型部分可对照 Hello 的 Python 版理解，重点抓 ch01d（复杂度）、ch01e（并查集）、ch03c（红黑树）、ch04（图）。\n<\/li><li>\n<strong>目标是考研/理论<\/strong>：第四版可略读工程选型（ch02e、ch03e），把时间压给导论；但第四版 ch04c（MST）和 ch04d（最短路径）是导论 ch23/ch24 的直觉前置，别整段跳。\n<\/li><li>\n<strong>导论里的高级专题<\/strong>（ch18 B树、ch19 斐波那契堆、ch20 vEB、ch27 多线程、ch28 矩阵、ch29 线性规划）属于「知道有这回事即可」，核心主线是 ch01~ch17 + ch21~ch26 + ch34/ch35。\n<\/ul>\n<hr>\n<h2>三、跨书学习路线图（Mermaid）<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[&quot;① 算法图解（11章·Python）&lt;br/&gt;直觉层：大O/递归/BFS/狄克斯特拉/DP网格&quot;] --&gt; M1[&quot;里程碑①：&lt;br/&gt;能手算小例子，不怕算法&quot;]\n    M1 --&gt; B[&quot;② Hello 算法（17章·Python）&lt;br/&gt;系统层：全部基本数据结构&lt;br/&gt;+分治/回溯/DP/贪心四大策略&quot;]\n    B --&gt; M2[&quot;里程碑②：&lt;br/&gt;能写实现、能估复杂度、会选策略&quot;]\n    M2 --&gt; C[&quot;③ 算法第4版（25节·Java）&lt;br/&gt;工程层：排序选型/红黑树/&lt;br/&gt;并查集/MST/最短路径/KMP字符串&quot;]\n    C --&gt; M3[&quot;里程碑③：&lt;br/&gt;懂选型、懂为什么这么设计、Java可落地&quot;]\n    M3 --&gt; D[&quot;④ 算法导论（39单元·伪代码）&lt;br/&gt;严谨层：主方法/摊还/&lt;br/&gt;最大流/数论RSA/NP完全性&quot;]\n    D --&gt; M4[&quot;里程碑④：&lt;br/&gt;会证明、会定阶、看得懂论文&quot;]\n\n    style A fill:#e8f4fd,stroke:#4a90d9\n    style B fill:#e6f9e6,stroke:#5cb85c\n    style C fill:#fff4e0,stroke:#f0ad4e\n    style D fill:#fde8e8,stroke:#d9534f<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染；离线则阅读源码与正文。<\/p>\n<p>读法：四个色块就是四个台阶，箭头表示「读完前一本再读后一本」。每本书内部的章节顺序，遵照各自目录下 <code>SKILL.md<\/code> 里的拓扑序即可。<\/p>\n<hr>\n<h2>四、每本书的入口指引<\/h2>\n<blockquote>&gt; 四本书都长成同一套骨架：<code>chapters/<\/code>（章节正文）、<code>concepts/<\/code>（跨章概念页）、<code>glossary.md<\/code>（术语表）、<code>quiz.md<\/code>（测验）、<code>flashcards.md<\/code>（抽认卡）、<code>cheatsheet.md<\/code>（速查表）、<code>patterns.md<\/code>（模式库）。<\/blockquote>\n<blockquote>&gt; 每本书还配一个可直接在浏览器打开的 <strong>HTML 学习伴侣<\/strong>，用来交互刷题/看可视化。<\/blockquote>\n<table><thead><tr><th>书<\/th><th>目录<\/th><th>HTML 学习伴侣<\/th><th>Markdown 知识库入口<\/th><\/tr><\/thead><tbody><tr><td>算法图解<\/td><td><code>../02-算法图解/<\/code><\/td><td><code>02-算法图解/算法图解学习伴侣.html<\/code><\/td><td><code>SKILL.md<\/code>（学习总纲）→ <code>chapters/ch01~ch11<\/code> → <code>glossary.md<\/code><\/td><\/tr><tr><td>Hello 算法<\/td><td><code>../01-hello算法/<\/code><\/td><td><code>01-hello算法/hello算法学习伴侣.html<\/code><\/td><td><code>SKILL.md<\/code> → <code>chapters/ch00~ch16<\/code> → <code>concepts/<\/code>（7 个跨章概念页）<\/td><\/tr><tr><td>算法第4版<\/td><td><code>../03-算法第四版/<\/code><\/td><td><code>03-算法第四版/算法第四版学习伴侣.html<\/code><\/td><td><code>SKILL.md<\/code> → <code>chapters/ch01a~ch06<\/code> → <code>concepts/<\/code>（10 个概念页）<\/td><\/tr><tr><td>算法导论<\/td><td><code>../04-算法导论/<\/code><\/td><td><code>04-算法导论/算法导论学习伴侣.html<\/code><\/td><td><code>SKILL.md<\/code> → <code>chapters/ch01~ch39<\/code> → <code>concepts/<\/code>（12 个概念页）<\/td><\/tr><\/tbody><\/table>\n<p><strong>怎么用这套总览<\/strong>：<\/p>\n<ol><li>\n先在本目录看 <code>跨书概念映射表.md<\/code>——同一个概念在四本书里分别在哪一章、谁讲得最直觉、谁讲得最严谨，一查就知道。\n<\/li><li>\n学完四本后，用 <code>综合检验建议.md<\/code> 做跨书整合题，并按间隔重复节奏复习。\n<\/ol>", "mapping": "<h1>跨书概念映射表<\/h1>\n<blockquote>&gt; 本表是「四本算法书」的对照表：<strong>同一个概念，在每本书的哪一章讲、谁讲得最直觉、谁讲得最严谨，一查便知。<\/strong><\/blockquote>\n<blockquote>&gt; 所有章节号与标题均来自四本书各自 <code>manifest.json<\/code> 的真实章节，没有编造。<\/blockquote>\n<blockquote>&gt; 「—」表示这本书没有把它单列成章（可能完全没讲，也可能只是一笔带过）。<\/blockquote>\n<blockquote>&gt; 书名列简称：<strong>图解<\/strong>＝《算法图解》，<strong>Hello<\/strong>＝《Hello 算法》，<strong>四版<\/strong>＝《算法（第4版）》，<strong>导论<\/strong>＝《算法导论》。<\/blockquote>\n<h2>怎么读这张表<\/h2>\n<ul><li>\n想<strong>第一次搞懂<\/strong>某个概念 → 优先看「最佳入门入口」列指的那本书。\n<\/li><li>\n想<strong>验证自己真懂了 / 应付考试面试<\/strong> → 再去对应看导论或四版的严谨版。\n<\/li><li>\n同一概念四本书口径不同时，表后「重点概念对比块」展开说明，<strong>不强行统一<\/strong>。\n<\/ul>\n<h2>主映射表（20 个跨书共享概念）<\/h2>\n<table><thead><tr><th>#<\/th><th>概念<\/th><th>图解（章节）<\/th><th>Hello（章节）<\/th><th>四版（章节）<\/th><th>导论（章节）<\/th><th>口径差异与最佳入门入口<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>大O / 渐近记号<\/td><td>第1章·算法简介<\/td><td>第2章·复杂度分析<\/td><td>第1章(1.4)·算法分析<\/td><td>第3章·函数的增长<\/td><td>图解只给「看最糟、丢常数」的直觉；Hello 补时间+空间两个维度；四版教倍率实验实测；导论给出 Θ/O/Ω 三套严格记号。<strong>入门：图解第1章<\/strong><\/td><\/tr><tr><td>2<\/td><td>二分查找<\/td><td>第1章·算法简介<\/td><td>第10章·搜索（二分查找）<\/td><td>第1章(1.1)·基础编程模型与二分查找<\/td><td>—（未单列章节）<\/td><td>图解用 128→64→32 的猜数游戏讲透；Hello 强调「必须有序」的前提；四版给出真实 Java 实现并当递归范例。<strong>入门：图解第1章<\/strong><\/td><\/tr><tr><td>3<\/td><td>递归与调用栈<\/td><td>第3章·递归<\/td><td>第2章·复杂度分析（递归）<\/td><td>第1章(1.1)·基础编程模型与二分查找（递归铁律）<\/td><td>第2章·算法基础 / 第4章·分治策略<\/td><td>图解用 fact(3) 手画调用栈最形象；Hello 把递归和复杂度绑在一起讲；导论用递归式 + 主方法把它变成可计算的数学对象。<strong>入门：图解第3章<\/strong><\/td><\/tr><tr><td>4<\/td><td>数组与链表<\/td><td>第2章·选择排序<\/td><td>第4章·数组与链表<\/td><td>第1章(1.3)·背包队列栈与链表<\/td><td>第10章·基本数据结构<\/td><td>图解用「连续抽屉 vs 寻宝纸条」类比；Hello 多讲 Python list 动态扩容与 CPU 缓存；四版从 ADT 角度封装。<strong>入门：图解第2章<\/strong><\/td><\/tr><tr><td>5<\/td><td>栈与队列<\/td><td>第3章·递归（栈）/ 第6章·广度优先搜索（队列）<\/td><td>第5章·栈与队列<\/td><td>第1章(1.3)·背包队列栈与链表<\/td><td>第10章·基本数据结构<\/td><td>四本书定义一致（LIFO / FIFO）。图解把队列和 BFS 直接绑讲；Hello 提醒别用 list.pop(0) 当队列。<strong>入门：Hello 第5章<\/strong><\/td><\/tr><tr><td>6<\/td><td>散列 / 哈希表<\/td><td>第5章·散列表<\/td><td>第6章·哈希表<\/td><td>第3章(3.4)·散列表<\/td><td>第11章·散列表<\/td><td>图解用「查电话簿」讲 O(1)；Hello 补链式地址与开放寻址两种冲突解法；四版强调装载因子 α≤1/2；导论给出「简单均匀散列」下期望 O(1) 的证明。<strong>入门：图解第5章<\/strong><\/td><\/tr><tr><td>7<\/td><td>二叉搜索树 BST<\/td><td>第11章·接下来如何做（仅术语）<\/td><td>第7章·树（二叉树）<\/td><td>第3章(3.2)·二叉查找树<\/td><td>第12章·二叉搜索树<\/td><td>图解只提一句；Hello 系统讲四种遍历 + 中序即升序；四版给出「随机 BST 平均 ~1.39 lg N」；导论讲插入/删除/遍历的完整伪代码。<strong>入门：Hello 第7章<\/strong><\/td><\/tr><tr><td>8<\/td><td>平衡树 / 红黑树<\/td><td>—（未单列）<\/td><td>第7章·树（二叉树）（仅提 AVL）<\/td><td>第3章(3.3)·平衡查找树与红黑树<\/td><td>第13章·红黑树<\/td><td>这是四版的主场：用 2-3 树的「红链接编码」讲直觉；导论用 5 条性质 + 旋转/染色讲严谨证明，高度 ≤2 lg N。<strong>入门：四版第3章(3.3)<\/strong><\/td><\/tr><tr><td>9<\/td><td>堆与优先队列<\/td><td>—（未单列）<\/td><td>第8章·堆<\/td><td>第2章(2.4)·优先队列与堆排序<\/td><td>第6章·堆排序<\/td><td>Hello 讲大/小顶堆与 Top-k；四版把它包装成「优先队列」ADT 并引出堆排序；导论讲建堆 O(n)、堆排序 O(n lg n) 原地。<strong>入门：Hello 第8章<\/strong><\/td><\/tr><tr><td>10<\/td><td>图与图遍历 BFS/DFS<\/td><td>第6章·广度优先搜索<\/td><td>第9章·图<\/td><td>第4章(4.1)·无向图遍历 / 第4章(4.2)·有向图<\/td><td>第22章·基本的图算法<\/td><td>图解只讲 BFS（最短段数）；Hello 补 DFS + visited 为什么必要；四版讲邻接表/邻接矩阵选型；导论用 BFS/DFS 染色、发现时间完成时间做严格分析。<strong>入门：图解第6章<\/strong><\/td><\/tr><tr><td>11<\/td><td>最短路径<\/td><td>第7章·狄克斯特拉算法<\/td><td>第9章·图（BFS 最短路）<\/td><td>第4章(4.4)·最短路径<\/td><td>第24章·单源最短路径 / 第25章·所有结点对的最短路径<\/td><td>图解手算狄克斯特拉四步；四版讲「松弛」与优先队列实现 E log V；导论补 Bellman-Ford（容负权）、Floyd-Warshall Θ(n³)、Johnson 重赋权。<strong>入门：图解第7章<\/strong><\/td><\/tr><tr><td>12<\/td><td>最小生成树 MST<\/td><td>—（未单列）<\/td><td>—（未单列）<\/td><td>第4章(4.3)·最小生成树<\/td><td>第23章·最小生成树<\/td><td>前两本完全没讲。四版用「切分定理」讲 Prim/Kruskal 为什么对；导论把 Kruskal 与并查集 c02 绑讲。<strong>入门：四版第4章(4.3)<\/strong><\/td><\/tr><tr><td>13<\/td><td>排序（快排/归并/堆排）<\/td><td>第2章·选择排序 / 第4章·快速排序<\/td><td>第11章·排序<\/td><td>第2章(2.1~2.5)·初级/归并/快排/堆/选型<\/td><td>第2章·算法基础(归并) / 第6章·堆排序 / 第7章·快速排序 / 第8章·线性时间排序<\/td><td>图解只讲选择+快排；Hello 一张表对比五个维度；四版给出 Java 工程选型（原始类型三向快排、引用类型归并求稳）；导论证明比较排序下界 Ω(n lg n)，并给计数/基数线性排序。<strong>入门：Hello 第11章 → 四版选型<\/strong><\/td><\/tr><tr><td>14<\/td><td>分治<\/td><td>第4章·快速排序（D&amp;C）<\/td><td>第12章·分治<\/td><td>第2章(2.2)·归并排序<\/td><td>第4章·分治策略<\/td><td>图解用「找基线条件 + 缩小规模」两步口诀；Hello 强调分治子问题独立不重叠；导论用主方法 T(n)=aT(n/b)+f(n) 三情况定阶。<strong>入门：图解第4章<\/strong><\/td><\/tr><tr><td>15<\/td><td>动态规划<\/td><td>第9章·动态规划<\/td><td>第14章·动态规划<\/td><td>—（未单列章节）<\/td><td>第15章·动态规划<\/td><td>图解用背包网格逐格填最形象；Hello 给三大特性（重叠子问题/最优子结构/无后效性）+ 0-1 背包倒序遍历；导论讲矩阵链乘、LCS 的完整状态定义。<strong>入门：图解第9章 → Hello 第14章<\/strong><\/td><\/tr><tr><td>16<\/td><td>贪心<\/td><td>第8章·贪婪算法<\/td><td>第15章·贪心<\/td><td>第4章(4.3)·MST / 第5章(5.5)·数据压缩（霍夫曼）<\/td><td>第16章·贪心算法<\/td><td>图解用集合覆盖讲「NP 难就用贪婪近似」；Hello 用零钱兑换反例说明贪心会错；导论讲贪心选择性质 + 活动选择 + 霍夫曼。<strong>入门：图解第8章<\/strong><\/td><\/tr><tr><td>17<\/td><td>回溯<\/td><td>—（未单列）<\/td><td>第13章·回溯<\/td><td>—（未单列）<\/td><td>—（未单列）<\/td><td><strong>几乎是 Hello 一家独讲<\/strong>：尝试/回退/剪枝三动作 + n 皇后三数组剪枝。其他书把它当 DFS 的特例处理。<strong>入门：Hello 第13章<\/strong><\/td><\/tr><tr><td>18<\/td><td>字符串匹配 KMP<\/td><td>—（未单列）<\/td><td>—（未单列）<\/td><td>第5章(5.3)·子字符串查找<\/td><td>第32章·字符串匹配<\/td><td>四版用 DFA 讲「失配不回退文本指针」；导论给前缀函数 π 与 Rabin-Karp 滚动哈希。<strong>入门：四版第5章(5.3)<\/strong><\/td><\/tr><tr><td>19<\/td><td>并查集<\/td><td>—（未单列）<\/td><td>—（未单列）<\/td><td>第1章(1.5)·并查集<\/td><td>第21章·用于不相交集合的数据结构<\/td><td>四版从加权 quick-union + 路径压缩讲到任意点深度 ≤lg N；导论补按秩合并，给出近似 O(α(n)) 几乎常数。它是 Kruskal MST 的搭档。<strong>入门：四版第1章(1.5)<\/strong><\/td><\/tr><tr><td>20<\/td><td>NP 完全性<\/td><td>第8章·贪婪算法（NP 完全）<\/td><td>—（未单列）<\/td><td>第6章·背景<\/td><td>第34章·NP完全性 / 第35章·近似算法<\/td><td>图解只给「n 一大就慢到爆炸、涉及组合排列」的直觉识别法；导论用 P/NP/NPC + 多项式归约 + Cook-Levin 严格讲透，并配近似比 ρ。<strong>入门：图解第8章 → 导论第34章<\/strong><\/td><\/tr><\/tbody><\/table>\n<blockquote>&gt; 合计 <strong>20 个跨书共享概念<\/strong>，覆盖任务要求的全部清单项（大O、二分、递归、数组链表、栈队列、散列、BST、平衡树、堆、图遍历、最短路径、MST、排序、分治、DP、贪心、回溯、字符串匹配、并查集、NP完全）。<\/blockquote>\n<hr>\n<h2>重点概念对比块（口径差异展开）<\/h2>\n<h3>对比块 1：大O 到底该怎么学？<\/h3>\n<ul><li>\n<strong>图解第1章<\/strong>：只教「看最糟情况、忽略常数」。你会算 <code>O(log n) &lt; O(n) &lt; O(n²)<\/code> 就够了。\n<\/li><li>\n<strong>Hello 第2章<\/strong>：多了「空间复杂度」和「最坏/平均」的区分，背熟阶序口诀。\n<\/li><li>\n<strong>四版第1章(1.4)<\/strong>：教你<strong>实测<\/strong>——输入翻倍，看时间比值 <code>t(2N)/t(N)<\/code>：趋近 4 就是 O(N²)，趋近 8 就是 O(N³)。\n<\/li><li>\n<strong>导论第3章<\/strong>：严格区分 Θ（确界）、O（上界）、Ω（下界），还有小 o 是「严格小于」。\n<\/li><li>\n<strong>怎么衔接<\/strong>：先用图解建立手感 → Hello 补空间维度 → 面试/工程用四版倍率法 → 写论文读导论的 Θ/O/Ω。\n<\/ul>\n<h3>对比块 2：动态规划，为什么图解和导论差这么多？<\/h3>\n<ul><li>\n<strong>图解第9章<\/strong>：一张二维网格，背包逐行逐格填，字母不同时子串归 0、子序列取 max。完全直觉，不写状态方程。\n<\/li><li>\n<strong>Hello 第14章<\/strong>：把直觉升级成三条铁律——重叠子问题、最优子结构、无后效性；0-1 背包一维数组要<strong>倒序<\/strong>遍历容量（防止覆盖上一行）。\n<\/li><li>\n<strong>导论第15章<\/strong>：给你正式的状态定义 <code>c[i,j]<\/code>，讲矩阵链乘 O(n³)，强调 DP 两个适用条件缺一不可。\n<\/li><li>\n<strong>衔接关键句<\/strong>：「网格」就是「dp 表」，「逐格填」就是「自底向上递推」。先看图解的网格，再回头看导论的 <code>c[i,j]<\/code>，会发现是同一张表。\n<\/ul>\n<h3>对比块 3：狄克斯特拉 vs 最短路径全家桶<\/h3>\n<ul><li>\n<strong>图解第7章<\/strong>：手算四步——选最便宜节点 → 更新邻居 → 重复 → 回溯父节点。记住「负权边会让它失效」。\n<\/li><li>\n<strong>四版第4章(4.4)<\/strong>：把它工程化成「松弛」操作 <code>if(d[u]+w(u,v)&lt;d[v]) 更新<\/code>，用优先队列做到 E log V。\n<\/li><li>\n<strong>导论第24/25章<\/strong>：补齐另外两家——Bellman-Ford 容负权边但 O(VE)；Floyd-Warshall 全点对 Θ(n³)；遇到负权回路要直接判定「最短路不存在」。\n<\/li><li>\n<strong>一句话选型<\/strong>：边权都非负 → 狄克斯特拉；可能有负权 → Bellman-Ford；要所有点对 → Floyd-Warshall。\n<\/ul>\n<h3>对比块 4：排序为什么要学四遍？<\/h3>\n<ul><li>\n<strong>图解<\/strong>：只会选择排序 O(n²) 和快速排序 O(n log n 平均)。\n<\/li><li>\n<strong>Hello 第11章<\/strong>：一张表列五个维度——运行效率、原地、稳定、自适应、是否基于比较。\n<\/li><li>\n<strong>四版第2章<\/strong>：给出 Java 真实选型——原始类型用三向快排，引用类型（要稳定）用归并；内存紧的实时系统用堆排序（原地 + O(N log N) 最坏保证）。\n<\/li><li>\n<strong>导论第6/7/8章<\/strong>：先证明「基于比较的排序怎么都快不过 Ω(n log n)」，再教你打破它——计数排序、基数排序在键是小范围整数时能到线性时间。\n<\/li><li>\n<strong>衔接关键句<\/strong>：前一本教「怎么写」，后一本教「什么时候不能更快、什么时候能更快」。\n<\/ul>\n<h3>对比块 5：哪些概念是「某一本书独讲」，别找错门<\/h3>\n<table><thead><tr><th>概念<\/th><th>独讲的书<\/th><th>说明<\/th><\/tr><\/thead><tbody><tr><td>回溯（尝试/回退/剪枝）<\/td><td><strong>Hello 第13章<\/strong><\/td><td>其他书只当 DFS 特例提<\/td><\/tr><tr><td>最小生成树<\/td><td><strong>四版第4章(4.3) + 导论第23章<\/strong><\/td><td>图解、Hello 完全没讲<\/td><\/tr><tr><td>并查集<\/td><td><strong>四版第1章(1.5) + 导论第21章<\/strong><\/td><td>前两本没讲，但是 Kruskal 的搭档<\/td><\/tr><tr><td>字符串匹配 KMP/Trie<\/td><td><strong>四版第5章 + 导论第32章<\/strong><\/td><td>前两本没讲<\/td><\/tr><tr><td>红黑树严格证明<\/td><td><strong>导论第13章<\/strong><\/td><td>四版讲直觉编码，Hello 只提 AVL<\/td><\/tr><tr><td>NP 完全性严格理论<\/td><td><strong>导论第34/35章<\/strong><\/td><td>图解只有直觉识别法<\/td><\/tr><tr><td>KNN / 机器学习入门<\/td><td><strong>图解第10章<\/strong><\/td><td>其他书完全没有<\/td><\/tr><\/tbody><\/table>", "checks": "<h1>综合检验建议（学完全套后的收官卷）<\/h1>\n<blockquote>&gt; 当你按「图解 → Hello → 四版 → 导论」走完，不要急着合上书本。<\/blockquote>\n<blockquote>&gt; 下面 4 道题是<strong>跨书整合题<\/strong>——单看任何一本书都答不完整，必须把几本书的口径拼起来。<\/blockquote>\n<blockquote>&gt; 每题都标了评分要点和它考到哪本书的哪一章，做完你就知道自己哪一层还虚。<\/blockquote>\n<hr>\n<h2>一、跨书整合题（4 道）<\/h2>\n<h3>第 1 题：排序全家桶的「多书对比分析」<\/h3>\n<p><strong>题目<\/strong>：给定 10⁷ 个待排数据，请你回答—— （a）如果它们全是范围 [0, 10⁶] 的整数，最快能多快？为什么这个速度不违反「比较排序下界」？ （b）如果它们是 Java 对象（要保持相等元素原顺序），该选哪种？为什么原始类型不选它？ （c）如果运行在内存极紧的实时系统，且要求最坏情况必须 O(n log n)，选哪种？它付出了什么代价？<\/p>\n<p><strong>评分要点（满分 10）<\/strong>：<\/p>\n<ul><li>\n答出「计数排序 O(n+k) 线性时间」+ 引用<strong>导论第8章·线性时间排序<\/strong>（2 分）\n<\/li><li>\n说清「比较排序下界 Ω(n log n)」出自<strong>导论第8章<\/strong>决策树证明，而计数排序不基于比较（2 分）\n<\/li><li>\n答出「Java 引用类型用归并，因为要稳定」+ 引用<strong>四版第2章(2.5)·排序应用与选型<\/strong>（2 分）\n<\/li><li>\n答出「原始类型用三向快排，因为稳定无所谓、常数更小」（2 分）\n<\/li><li>\n答出「内存紧 + 最坏 O(n log n) → 堆排序原地 O(1) 额外空间」+ 代价是「不稳定、常数比快排大」+ 引用<strong>四版第2章(2.4)<\/strong> 与<strong>导论第6章<\/strong>（2 分）\n<\/ul>\n<p><strong>涉及书目章节<\/strong>：图解第2章（选择排序直觉）→ Hello 第11章（五维对比表）→ 四版第2章(2.1~2.5) → 导论第6/7/8章。<\/p>\n<hr>\n<h3>第 2 题：从「抽象数据类型」到「具体数据结构」的选择决策树<\/h3>\n<p><strong>题目<\/strong>：业务方提了 5 个需求，你分别该选哪种数据结构？要求说清「为什么是它、为什么不是别的」。<\/p>\n<ol><li>\n1000 万用户名，频繁判断「这个用户注册过没」，无序。\n<\/li><li>\n同样的数据，但还要支持「查出当前排名第 5000 的用户是谁」。\n<\/li><li>\n要按层来遍历一个社交网络的好友关系。\n<\/li><li>\n要从海量日志里实时弹出「当前优先级最高」的任务。\n<\/li><li>\n要维护动态连通性（两台服务器是否已在同一网络里），并支持合并。\n<\/ol>\n<p><strong>评分要点（满分 10）<\/strong>：<\/p>\n<ul><li>\n(1) 答「哈希表/集合 O(1)」，并说为什么不是有序数组二分（插入太贵）、不是链表（查找 O(n)）→ <strong>Hello 第6章<\/strong>、<strong>图解第5章<\/strong>（2 分）\n<\/li><li>\n(2) 答「散列表不支持 rank，要平衡树/顺序统计树」，点出「散列把键顺序打乱了」→ <strong>四版第3章(3.4)<\/strong> quiz 原话、<strong>导论第14章·数据结构的扩张<\/strong>（顺序统计树）（2 分）\n<\/li><li>\n(3) 答「BFS 用队列按层扩展」→ <strong>图解第6章<\/strong>、<strong>Hello 第9章<\/strong>、<strong>导论第22章<\/strong>（2 分）\n<\/li><li>\n(4) 答「优先队列 = 堆」，Top-k 用大小 k 的小顶堆 O(n log k) → <strong>Hello 第8章<\/strong>、<strong>四版第2章(2.4)<\/strong>、<strong>导论第6章<\/strong>（2 分）\n<\/li><li>\n(5) 答「并查集 union/find，路径压缩 + 按秩合并，近 O(α(n))」→ <strong>四版第1章(1.5)<\/strong>、<strong>导论第21章<\/strong>（2 分）\n<\/ul>\n<p><strong>一句话考点<\/strong>：这道题考的是<strong>选型决策树<\/strong>——ADT（要什么操作）→ 具体结构（怎么实现）→ 复杂度代价。<\/p>\n<hr>\n<h3>第 3 题：最短路径的「负权」边界问题<\/h3>\n<p><strong>题目<\/strong>：导航软件要给城市里最快路线。 （a）所有路段耗时都是正数，用什么？它为什么不能有负权边？ （b）某条「高速公路逆行入口」耗时被标成负数（惩罚），狄克斯特拉为什么会算错？该换成谁？ （c）如果要一次性算好全城任意两点的最快路线，又该用什么？复杂度多少？ （d）什么情况下「最短路径」根本不存在？<\/p>\n<p><strong>评分要点（满分 10）<\/strong>：<\/p>\n<ul><li>\n(a) 狄克斯特拉，边权非负；「先定死最便宜节点」的前提被负权破坏 → <strong>图解第7章<\/strong>、<strong>四版第4章(4.4)<\/strong>（2.5 分）\n<\/li><li>\n(b) 换 Bellman-Ford，O(VE)，容负权边 → <strong>导论第24章<\/strong>（2.5 分）\n<\/li><li>\n(c) Floyd-Warshall 全点对，Θ(n³)；或 Johnson 重赋权 → <strong>导论第25章<\/strong>（2.5 分）\n<\/li><li>\n(d) 图里存在「负权回路」时，绕圈越绕越短，最短路不存在 → <strong>导论第24章<\/strong>「负权回路」术语（2.5 分）\n<\/ul>\n<p><strong>考点<\/strong>：同一个「找最短路」问题，权值的符号一变，算法全家桶就要换一套——这是跨书串起来的。<\/p>\n<hr>\n<h3>第 4 题：DP vs 贪心 vs 分治，什么时候用哪个？<\/h3>\n<p><strong>题目<\/strong>：判断下列问题各该用什么策略，并说清为什么不是另外两个。<\/p>\n<ol><li>\n爬楼梯：每次跨 1 或 2 阶，到第 n 阶有几种走法。\n<\/li><li>\n零钱兑换：硬币面额 [1, 20, 50]，凑 60。\n<\/li><li>\n归并排序。\n<\/li><li>\nn 皇后：列出所有合法摆法。\n<\/li><li>\n活动选择：会议室不冲突地选最多活动。\n<\/ol>\n<p><strong>评分要点（满分 10）<\/strong>：<\/p>\n<ul><li>\n(1) DP：重叠子问题 + 最优子结构，dp[i]=dp[i-1]+dp[i-2] → <strong>Hello 第14章<\/strong>（2 分）\n<\/li><li>\n(2) 必须 DP 不能贪心：[1,20,50] 凑 60 时贪心得 11 枚、最优 3 枚（20+20+20）→ <strong>Hello 第15章<\/strong>反例（2 分）\n<\/li><li>\n(3) 分治：子问题独立不重叠（DP 是重叠的）→ <strong>Hello 第12章<\/strong>、<strong>导论第4章<\/strong>（2 分）\n<\/li><li>\n(4) 回溯：要<strong>列出所有解<\/strong>而非求最优值，三动作尝试/回退/剪枝 → <strong>Hello 第13章<\/strong>（2 分）\n<\/li><li>\n(5) 贪心：选结束最早的兼容活动，满足贪心选择性质 → <strong>导论第16章<\/strong>、<strong>图解第8章<\/strong>（2 分）\n<\/ul>\n<p><strong>考点<\/strong>：四本书里最容易混的就是这四大策略。判据记一句话：<strong>子问题重叠 → DP；要求列出全部解 → 回溯；子问题独立 → 分治；局部最优可推全局 → 贪心<\/strong>。<\/p>\n<hr>\n<h2>二、建议复习节奏（间隔重复）<\/h2>\n<blockquote>&gt; 不要学完就扔。按下面的节点回头翻，忘得最慢。<\/blockquote>\n<table><thead><tr><th>节点<\/th><th>做什么<\/th><th>用什么材料<\/th><\/tr><\/thead><tbody><tr><td><strong>次日<\/strong><\/td><td>重做当天章节的 quiz + flashcards，遮住答案口述<\/td><td>各书 <code>quiz.md<\/code>、<code>flashcards.md<\/code><\/td><\/tr><tr><td><strong>第 3 天<\/strong><\/td><td>只翻 <code>cheatsheet.md<\/code> 速查表，讲不出的标记出来重看对应章节<\/td><td>各书 <code>cheatsheet.md<\/code><\/td><\/tr><tr><td><strong>第 7 天<\/strong><\/td><td>跨书概念映射表里挑 5 个概念，说出四本书各自怎么讲<\/td><td><code>00-跨书总览/跨书概念映射表.md<\/code><\/td><\/tr><tr><td><strong>第 30 天<\/strong><\/td><td>做上面 4 道整合题里的 2 道，限时写思路<\/td><td>本文件<\/td><\/tr><tr><td><strong>第 90 天<\/strong><\/td><td>用本文件 4 道题完整自测一遍，对照评分要点打分<\/td><td>本文件<\/td><\/tr><\/tbody><\/table>\n<p><strong>小技巧<\/strong>：每本书的 <code>flashcards.md<\/code> 就是为间隔重复准备的，按「次日/3天/7天」三张卡的节奏过，比重读整章高效得多。<\/p>\n<hr>\n<h2>三、进阶路线（三条分叉）<\/h2>\n<p>学完全套后，按你的目标选一条继续深入，别三条一起啃。<\/p>\n<h3>路线 A：竞赛（想打 ACM / LeetCode 冲分）<\/h3>\n<ul><li>\n<strong>重点书<\/strong>：Hello 算法（第12~15章 分治/回溯/DP/贪心）+ 导论（第15/16章）。\n<\/li><li>\n<strong>补什么<\/strong>：图论里的<strong>最大流<\/strong>（导论第26章）、数论（导论第31章）是竞赛高频但 Hello/四版讲得浅。\n<\/li><li>\n<strong>怎么练<\/strong>：把本文件第 2、4 题的选型直觉，拿到 OJ 上每类刷 10 道，重点练 DP 和图。\n<\/ul>\n<h3>路线 B：工程（想进大厂写后端 / 做基础设施）<\/h3>\n<ul><li>\n<strong>重点书<\/strong>：算法第四版（第2章排序选型、第3章符号表/散列、第4章图）。\n<\/li><li>\n<strong>补什么<\/strong>：并发、B 树（导论第18章，对应数据库索引）、字符串 Trie（四版第5章）。\n<\/li><li>\n<strong>怎么练<\/strong>：用 Java 或 Python 手写一遍 HashMap、PriorityQueue、并查集，读 JDK/标准库源码对照。\n<\/ul>\n<h3>路线 C：理论（想考研 / 读论文 / 读研）<\/h3>\n<ul><li>\n<strong>重点书<\/strong>：算法导论整本，尤其第3章渐近记号、第4章主方法、第17章摊还分析、第34/35章 NP 完全性。\n<\/li><li>\n<strong>补什么<\/strong>：附录 A/B/C/D（求和、离散数学、概率、矩阵）要当工具书随时翻。\n<\/li><li>\n<strong>怎么练<\/strong>：把导论每章的定理<strong>自己重新证一遍<\/strong>，而不是看一遍；用本文件第 1、3 题检验能不能把直觉讲成证明。\n<\/ul>\n<hr>\n<h2>收尾自检清单<\/h2>\n<ul><li>\n[ ] 我能不看表，说出四本书各自的定位和语言\n<\/li><li>\n[ ] 跨书映射表里 20 个概念，我至少能说出 15 个的「最佳入门入口」是哪本书\n<\/li><li>\n[ ] 4 道整合题每题评分要点我都能自己写出来\n<\/li><li>\n[ ] 我已经选定 A/B/C 中的一条进阶路线，并列出下 30 天要刷的章节\n<\/ul>"};

function parseHash(){

  const p = h.split('/');
  if(p[0]==='cross') return {book:'cross', doc:p[1]||'readme', page:'cross'};
  if(p[0]==='book'){
    const key=p[1], page=p.slice(2).join('/')||'path';
    return {book:key, page:page, doc:null};
  }
  return {book:'cross', doc:'readme', page:'cross'};
}
function pageIdOf(page){
  if(page==='path') return '__path__';
  if(page==='cards') return '__cards__';
  if(page==='glossary') return '__glossary__';
  if(page==='patterns') return '__patterns__';
  if(page==='cheatsheet') return '__cheatsheet__';
  if(page.startsWith('quiz/')) return '__quiz_'+(page.split('/')[1]||'all')+'__';
  if(page.startsWith('chapter/')) return page.slice(8);   // chapter/ch01 => ch01
  if(page.startsWith('concept/')) return page.slice(8);   // concept/c01 => c01
  return page;
}

/* ---------- 顶栏 tabs ---------- */
function renderTabs(){
  const el = $('#tabs'); el.innerHTML='';
  TABS.forEach(t=>{
    const b=document.createElement('button');
    b.className='tab'+(cur.book===t.key?' active':'');
    b.textContent=t.label;
    b.onclick=()=>{ location.hash = t.key==='cross' ? '#/cross/readme' : '#/book/'+t.key+'/path'; };
    el.appendChild(b);
  });
}

/* ---------- 侧边栏 ---------- */
function renderNav(){
  const nav=$('#nav'); nav.innerHTML='';
  const add=(label,href,cls)=>{
    const a=document.createElement('a'); a.className='nav-item'+(cls?' '+cls:''); a.href=href; a.textContent=label;
    nav.appendChild(a); return a;
  };
  const sec=t=>{ const d=document.createElement('div'); d.className='nav-sec'; d.textContent=t; nav.appendChild(d); };

  if(cur.book==='cross'){
    sec('跨书总览');
    Object.entries(CROSS_LABELS).forEach(([k,l])=>{
      add(l, '#/cross/'+k, cur.doc===k?'active':'');
    });
    sec('四本书入口');
    META.forEach(m=> add(m.title, '#/book/'+m.key+'/path'));
    updateProgress(0,'跨书总览');
    return;
  }
  const B=BOOKS[cur.book];
  const S=getState(cur.book);
  const man=B.manifest;
  // 学习路径
  add('学习路径','#/book/'+cur.book+'/path', cur.page==='path'?'active':'');
  // 章节
  sec('章节');
  (man.chapters||[]).forEach(c=>{
    const id=c.id;
    const a=add(c.title, '#/book/'+cur.book+'/chapter/'+id, cur.page==='chapter/'+id?'active':'');
    if(S.visited.includes(cur.book+'/chapter/'+id)){
      const s=document.createElement('span'); s.className='done'; s.textContent='✓'; a.appendChild(s);
    }
  });
  // 概念
  if((man.concepts||[]).length){
    sec('概念');
    man.concepts.forEach(c=>{
      const a=add(c.title, '#/book/'+cur.book+'/concept/'+c.id, cur.page==='concept/'+c.id?'active':'');
      if(S.visited.includes(cur.book+'/concept/'+c.id)){
        const s=document.createElement('span'); s.className='done'; s.textContent='✓'; a.appendChild(s);
      }
    });
  }
  // 测验
  sec('测验');
  add('综合测验（全书）','#/book/'+cur.book+'/quiz/all', cur.page==='quiz/all'?'active':'');
  (man.chapters||[]).forEach(c=>{
    const qc=(B.quizCoverage||{})[c.id];
    if(!qc) return;
    add('测验：'+c.title, '#/book/'+cur.book+'/quiz/'+c.id, cur.page==='quiz/'+c.id?'active':'');
  });
  // 其他
  sec('复习工具');
  add('抽认卡','#/book/'+cur.book+'/cards', cur.page==='cards'?'active':'');
  add('术语表','#/book/'+cur.book+'/glossary', cur.page==='glossary'?'active':'');
  if(B.rendered['__patterns__']) add('模式库','#/book/'+cur.book+'/patterns', cur.page==='patterns'?'active':'');
  if(B.rendered['__cheatsheet__']) add('速查表','#/book/'+cur.book+'/cheatsheet', cur.page==='cheatsheet'?'active':'');
  // 单独伴侣入口
  sec('其他');
  const m=META.find(x=>x.key===cur.book);
  if(m) add('单独打开《'+m.title.replace(/点化学习(系统|伴侣)/,'')+'》学习伴侣 ↗', encodeURI(m.companion));

  updateProgressBook(cur.book);
}

/* ---------- 进度 ---------- */
function updateProgress(pct,label){
  $('#progress-fill').style.width=pct+'%';
  $('#progress-label').textContent=label;
}
function updateProgressBook(book){
  const B=BOOKS[book], S=getState(book);
  const chs=(B.manifest.chapters||[]).length;
  const done=(B.manifest.chapters||[]).filter(c=>S.visited.includes(book+'/chapter/'+c.id)).length;
  const pct=chs?Math.round(done/chs*100):0;
  $('#progress-fill').style.width=pct+'%';
  $('#progress-label').textContent=`《${(META.find(x=>x.key===book)||{}).title||book}》 进度 ${pct}% · 已学 ${done}/${chs} 章`;
}

/* ---------- 渲染 ---------- */
function renderCross(){
  const v=$('#view');
  const docId=cur.doc||'readme';
  const html=CROSS[docId]||'<div class="empty">页面不存在</div>';
  let pre='';
  if(docId==='readme'){
    pre = '<h1>算法四书 · 总学习手册</h1>'
      + '<p>四本书 + 跨书总览整合为一个学习系统。点击顶部标签切换书，或用下方卡片进入。'
      + '每本书含学习路径、章节精讲、概念页、测验、抽认卡、术语表、模式库与速查表，进度自动保存在本机浏览器。</p>'
      + '<div class="book-cards">'
      + META.map(m=>`<div class="book-card"><h3>${esc(m.title)}</h3>
          <div class="meta">${m.chapters} 章 · ${m.concepts} 概念 · ${m.quizzes} 测验 · ${m.cards} 抽认卡</div>
          <div class="enter"><a href="#/book/${m.key}/path">进入学习 →</a> &nbsp;|&nbsp;
          <a href="${encodeURI(m.companion)}" target="_blank">单独伴侣 ↗</a></div></div>`).join('')
      + '</div>';
  }
  v.innerHTML = pre + html;
  renderMermaid();
}

function renderBook(){
  const B=BOOKS[cur.book];
  if(!B){ $('#view').innerHTML='<div class="empty">书目不存在</div>'; return; }
  const pid=pageIdOf(cur.page);
  let html=B.rendered[pid];
  if(!html){ html='<div class="empty">页面不存在</div>'; }
  // 记录已访问
  const S=getState(cur.book);
  if((cur.page.startsWith('chapter/')||cur.page.startsWith('concept/')) && !S.visited.includes(cur.book+'/'+cur.page)){
    S.visited.push(cur.book+'/'+cur.page);
    store.set(stKey(cur.book,'visited'), S.visited);
  }
  $('#view').innerHTML=html;
  if(cur.page==='cards') initCards();
  if(cur.page==='glossary') initGlossary();
  if(cur.page.startsWith('quiz/')) initQuizzes();
  if(pid==='__path__') updatePath();
  renderMermaid();
}

/* ---------- 测验 ---------- */
function initQuizzes(){
  const B=BOOKS[cur.book];
  document.querySelectorAll('.quiz-item').forEach(item=>{
    const btn=item.querySelector('.quiz-check');
    if(!btn||item.dataset.inited) return;
    item.dataset.inited='1';
    btn.addEventListener('click',()=>{
      const qid=item.dataset.qid, type=item.dataset.type;
      const q=(B.manifest.quizzes||[]).find(x=>x.id===qid); if(!q) return;
      let user=null, correct=false, fb='';
      if(type==='single'){
        const sel=item.querySelector('input:checked');
        user=sel?parseInt(sel.value):null;
        correct=(user===q.answer);
        fb=correct?'✓ 正确':'✗ 错误'+(user==null?'（未作答）':'');
      }else if(type==='multi'){
        user=Array.from(item.querySelectorAll('input:checked')).map(i=>parseInt(i.value)).sort();
        const ans=Array.isArray(q.answer)?q.answer.slice().sort():[q.answer];
        correct=user.length>0 && JSON.stringify(user)===JSON.stringify(ans);
        fb=correct?'✓ 正确':'✗ 错误';
      }else if(type==='blank'){
        const v=(item.querySelector('.quiz-blank').value||'').trim().toLowerCase();
        correct=(v===String(q.answer).trim().toLowerCase());
        fb=correct?'✓ 正确':'✗ 错误'+(v?'':'（未作答）');
      }
      item.querySelectorAll('input:checked').forEach(i=>{
        const val=parseInt(i.value);
        if(Array.isArray(q.answer)?q.answer.includes(val):val===q.answer) i.parentElement.style.color='var(--ok)';
        else i.parentElement.style.color='var(--bad)';
      });
      const feed=item.querySelector('.quiz-feedback');
      feed.className='quiz-feedback '+(correct?'fb-ok':'fb-bad');
      feed.textContent=fb;
      let ex=item.querySelector('.quiz-explain');
      if(!ex){ ex=document.createElement('div'); ex.className='quiz-explain'; item.appendChild(ex); }
      ex.innerHTML='解析：'+esc(q.explain||'');
      const S=getState(cur.book);
      const ch=q.chapterId||'__all__';
      if(!S.quiz[ch]) S.quiz[ch]={n:0};
      S.quiz[ch].n+=1;
      store.set(stKey(cur.book,'quiz'), S.quiz);
    });
  });
}
function updatePath(){
  const B=BOOKS[cur.book], S=getState(cur.book);
  document.querySelectorAll('.path-step').forEach(el=>{
    const step=el.id.replace('path-','');
    const s=(B.manifest.learningPath||[]).find(x=>String(x.step)===step);
    if(s && (s.chapterIds||[]).every(c=>S.visited.includes(cur.book+'/chapter/'+c))){
      el.classList.add('passed');
      if(!el.querySelector('.ck')){ const sp=document.createElement('span'); sp.className='ck done'; sp.textContent=' ✓ 已完成'; el.appendChild(sp); }
    }
  });
}

/* ---------- 抽认卡 ---------- */
let cardIdx=0, cardList=[];
function initCards(){
  const B=BOOKS[cur.book], S=getState(cur.book);
  const cards=B.manifest.flashcards||[];
  cardList=cards.slice(); cardIdx=0;
  if(!$('#card-done')){
    const d=document.createElement('div'); d.id='card-done'; d.className='empty';
    d.style.display='none'; d.textContent='本组卡片已全部复习完 🎉';
    const st=$('#card-stage'); if(st) st.appendChild(d);
  }
  const sel=$('#card-filter'); if(!sel) return;
  sel.innerHTML='<option value="">全部</option>';
  [...new Set(cards.map(c=>c.chapterId).filter(Boolean))].forEach(c=>{
    const o=document.createElement('option'); o.value=c;
    const ch=(B.manifest.chapters||[]).find(x=>x.id===c);
    o.textContent=ch?ch.title:c; sel.appendChild(o);
  });
  sel.onchange=()=>{ const v=sel.value; cardList=v?cards.filter(c=>c.chapterId===v):cards.slice(); cardIdx=0; showCard(); };
  $('#flashcard').onclick=()=>$('#flashcard').classList.toggle('flip');
  $('#card-known-btn').onclick=()=>markCard(true);
  $('#card-again-btn').onclick=()=>markCard(false);
  showCard();
}
function showCard(){
  const S=getState(cur.book);
  updateCardCounts();
  const done=$('#card-done'), fc=$('#flashcard');
  if(cardIdx>=cardList.length){
    if(done) done.style.display=''; if(fc) fc.style.display='none'; return;
  }
  if(done) done.style.display='none'; if(fc) fc.style.display='';
  const c=cardList[cardIdx];
  document.querySelector('.fc-front').textContent=c.front;
  document.querySelector('.fc-back').textContent=c.back;
  $('#flashcard').classList.remove('flip');
}
function markCard(known){
  const S=getState(cur.book);
  const c=cardList[cardIdx]; if(!c) return;
  S.cards[c.id]=known?'known':'again';
  store.set(stKey(cur.book,'cards'), S.cards);
  cardIdx++; showCard();
}
function updateCardCounts(){
  const S=getState(cur.book);
  const known=Object.values(S.cards).filter(v=>v==='known').length;
  const again=Object.values(S.cards).filter(v=>v==='again').length;
  const k=$('#card-known'), a=$('#card-again'), l=$('#card-left');
  if(k) k.textContent=known; if(a) a.textContent=again; if(l) l.textContent=Math.max(0,cardList.length-cardIdx);
}

/* ---------- 术语表 ---------- */
function initGlossary(){
  const input=$('#glossary-filter');
  if(!input||input.dataset.inited) return;
  input.dataset.inited='1';
  input.oninput=()=>{
    const v=input.value.trim().toLowerCase();
    document.querySelectorAll('#glossary-list li').forEach(li=>{
      li.style.display=(!v||li.dataset.term.includes(v))?'':'none';
    });
  };
}

/* ---------- 全局搜索 ---------- */
let searchIdx=null;
function buildSearch(){
  if(searchIdx) return searchIdx;
  searchIdx=[];
  META.forEach(m=>{
    const B=BOOKS[m.key];
    Object.entries(B.rendered).forEach(([pid,html])=>{
      if(pid.startsWith('__')) return;
      const text=html.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ');
      searchIdx.push({book:m.key, page:pdfToPage(pid, B), text, label:m.title});
    });
  });
  Object.entries(CROSS).forEach(([k,html])=>{
    searchIdx.push({book:'cross', page:'cross/'+k, text:html.replace(/<[^>]+>/g,' ').replace(/\s+/g,' '), label:'跨书总览 · '+(CROSS_LABELS[k]||k)});
  });
  return searchIdx;
}
function pdfToPage(pid, B){
  if(pid.startsWith('__quiz_')) return 'quiz/'+pid.replace('__quiz_','').replace('__','');
  if(pid==='__path__') return 'path';
  if(pid==='__cards__') return 'cards';
  if(pid==='__glossary__') return 'glossary';
  if(pid==='__patterns__') return 'patterns';
  if(pid==='__cheatsheet__') return 'cheatsheet';
  const ch=(B.manifest.chapters||[]).find(c=>c.id===pid);
  if(ch) return 'chapter/'+pid;
  return 'concept/'+pid;
}
$('#q').addEventListener('input', e=>{
  const v=e.target.value.trim().toLowerCase();
  if(!v){ route(); return; }
  const hits=buildSearch().filter(p=>p.text.toLowerCase().includes(v)).slice(0,40);
  $('#view').innerHTML='<h1>搜索结果：'+esc(v)+'</h1>'+
    (hits.length? hits.map(h=>{
      const href=h.book==='cross'?('#/cross/'+(h.page.split('/')[1]||'readme')):('#/book/'+h.book+'/'+h.page);
      return `<div class="search-hit"><a href="${href}">${esc(h.label)}</a><br><span style="color:var(--muted);font-size:13px">${esc(h.text.slice(0,200))}</span></div>`;
    }).join('') : '<div class="empty">未找到相关内容，试试章节名 / 概念名 / 术语。</div>');
});

/* ---------- Mermaid ---------- */
let mermaidState='idle';
function renderMermaid(){
  const els=Array.from(document.querySelectorAll('.mermaid')).filter(el=>!el.dataset.rendered);
  if(!els.length) return;
  const run=()=>{ try{
    mermaid.initialize({startOnLoad:false, theme:document.body.dataset.theme==='dark'?'dark':'default'});
    els.forEach((el,idx)=>{ try{
      const out=mermaid.render('mm'+Date.now()+idx, el.textContent);
      if(out && typeof out.then==='function'){
        out.then(r=>{ el.innerHTML=r.svg; el.dataset.rendered='1'; }).catch(()=>{ el.dataset.rendered='0'; });
      } else { el.innerHTML=out; el.dataset.rendered='1'; }
    } catch(e){ el.dataset.rendered='0'; } });
  }catch(e){} };
  if(window.mermaid){ run(); return; }
  if(mermaidState==='loading') return;
  mermaidState='loading';
  const urls=['https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js',
              'https://unpkg.com/mermaid@10/dist/mermaid.min.js',
              'https://registry.npmmirror.com/mermaid/10/files/dist/mermaid.min.js'];
  let ui=0;
  const tryNext=()=>{
    if(ui>=urls.length){ mermaidState='failed'; return; }
    const s=document.createElement('script');
    s.src=urls[ui++];
    s.onload=()=>{ mermaidState='loaded'; run(); };
    s.onerror=()=>{ s.remove(); tryNext(); };
    document.head.appendChild(s);
  };
  tryNext();
}

/* ---------- 主题 ---------- */
const themeBtn=$('#theme-btn');
themeBtn.onclick=()=>{
  const d=document.body.dataset.theme==='dark';
  document.body.dataset.theme=d?'':'dark';
  themeBtn.textContent=d?'🌙 深色':'☀️ 浅色';
};

/* ---------- 启动 ---------- */
function route(){
  cur=parseHash();
  renderTabs();
  renderNav();
  if(cur.book==='cross') renderCross(); else renderBook();
  window.scrollTo(0,0);
}
window.addEventListener('hashchange', route);
route();
</script>
