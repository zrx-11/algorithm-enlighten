N)<\/strong> 搬移。<\/p>\n<p>这组对比暴露核心矛盾：<strong>查找快的结构插入慢，插入快的结构查找慢<\/strong>。第 3.2 节二叉查找树就是来解这个矛盾的。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[&quot;无序链表&quot;] --&gt;|get/put 全扫| B[&quot;O(N)&quot;]\n    C[&quot;有序数组&quot;] --&gt;|get 二分| D[&quot;O(log N) 查找&quot;]\n    C --&gt;|put 搬移| E[&quot;O(N) 插入&quot;]\n    B --&gt; F[&quot;矛盾: 查找与插入难以兼得&quot;]\n    D --&gt; F\n    E --&gt; F\n    F --&gt; G[&quot;→ 二叉查找树登场(3.2)&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：朴素实现的两难——这个矛盾正是后面 BST、红黑树、散列表的设计动机。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：纸质字典（有序数组）查得快（二分），但要插入一个新词得重排页码（贵）；纸条上随手记（链表）插得快，但找一条要翻遍所有纸条。<em>失效边界<\/em>：真实字典既有索引又可加页，比这两种极端都好——BST 就是那个&quot;更好&quot;。\n<\/li><li>\n<strong>实例<\/strong>：FrequencyCounter 统计文本词频：读入每个词 <code>put(word, get(word)+1)<\/code>，最后遍历 keys 找最高频词。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为<\/strong>符号表就是数组——实际上它是抽象接口，数组/链表/BST/散列都能当它的实现。\n<\/li><li>\n<strong>别以为<\/strong>有序数组二分查找是免费的——实际上它把 O(N) 成本从查找挪到了插入。\n<\/li><li>\n<strong>别以为<\/strong>键必须是数字——实际上任何可比较类型都行（字符串、日期……）。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n符号表 put 同一个键两次会怎样？（答案：后值覆盖前值，键仍只有一个；解析。）\n<\/li><li>\n有序符号表比无序多出哪类操作？举两个。（答案：min/max、floor、rank、select、范围查询等；解析：依赖键有序。）\n<\/li><li>\n有序数组实现符号表，get 和 put 各什么量级？（答案：get O(log N)，put O(N)；解析：二分查找 vs 搬移插入。）\n<\/li><li>\n无序链表顺序查找的最坏成本？（答案：O(N)；解析：每次从头扫到尾。）\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n符号表 = 键值对字典，核心 put/get。\n<\/li><li>\n有序额外能力：min/max/floor/rank/select。\n<\/li><li>\n朴素两难：链表 O(N) 全慢；有序数组查找 log N 但插入 N。\n<\/ul>", "ch03b": "<h1>第 3 章（3.2）：二叉查找树（BST）<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：3 小时 | <strong>前置<\/strong>：ch03a、ch01a（递归）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本节，你能：<\/p>\n<ol><li>\n说清<strong>二叉查找树<\/strong>的定义：左子树键 &lt; 根 &lt; 右子树键；\n<\/li><li>\n写出 BST 的 get/put 递归代码，理解为什么它们是树高量级；\n<\/li><li>\n说出随机键构造的 BST 平均查找 ~2 ln N ≈ 1.39 lg N，以及它为什么会&quot;长歪&quot;。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>BST = 每个节点左小右大的二叉树；查找像二分查找，但插入只需挂新叶——两全其美，直到树长歪。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：定义（难度：基础）<\/h3>\n<p><strong>二叉查找树（Binary Search Tree, BST）<\/strong>：一棵二叉树，每个节点含一个键，且满足——<strong>左子树所有键 &lt; 该节点键 &lt; 右子树所有键<\/strong>。这一条&quot;中序有序&quot;性质是全部操作的基础。<\/p>\n<h3>概念 2：get（查找，难度：进阶）<\/h3>\n<p>从根开始：key 等于节点键 → 命中；key 更小 → 去左子树找；key 更大 → 去右子树找。到 null 即不存在。和二分查找同构，但走的是树的一条路径。<\/p>\n<pre class=\"lang-java\"><code>public Value get(Key key) {\n    Node x = root;\n    while (x != null) {\n        int cmp = key.compareTo(x.key);\n        if      (cmp &lt; 0) x = x.left;\n        else if (cmp &gt; 0) x = x.right;\n        else    return x.val;\n    }\n    return null;\n}<\/code><\/pre>\n<h3>概念 3：put（插入，难度：进阶）<\/h3>\n<p>递归查找空位，在该处挂一个新叶节点。<strong>关键：插入不改已有节点指针，只加叶子<\/strong>——这就是它比有序数组快的原因。<\/p>\n<h3>概念 4：分析与&quot;长歪&quot;（难度：高难）<\/h3>\n<p>原书命题 C：由 N 个<strong>随机键<\/strong>构造的 BST，查找命中平均比较次数 <strong>~2 ln N ≈ 1.39 lg N<\/strong>。<\/p>\n<p><strong>但是<\/strong>：若键按顺序插入（1,2,3,…,N），BST 退化成一条链——查找变 O(N)。树高完全取决于插入顺序。这就是 3.3 节<strong>平衡查找树<\/strong>要解决的问题：保证任何插入顺序下树都不歪。<\/p>\n<h3>概念 5：有序性方法（难度：进阶）<\/h3>\n<ul><li>\n<code>min<\/code>：一路向左走到头；\n<\/li><li>\n<code>floor(key)<\/code>：≤ key 的最大键——递归判断；\n<\/li><li>\n<code>rank(key)<\/code>：小于 key 的键数——左子树大小 + 递归；\n<\/li><li>\n删除：最复杂的是删有两个孩子的节点，用<strong>右子树最小节点<\/strong>替代。\n<\/ul>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    R[&quot;根: D&quot;] --&gt; L[&quot;B&quot;]\n    R --&gt; RR[&quot;F&quot;]\n    L --&gt; L1[&quot;A&quot;]\n    L --&gt; L2[&quot;C&quot;]\n    RR --&gt; R1[&quot;E&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：中序遍历 A B C D E F 严格升序——这就是&quot;左小右大&quot;性质。查找 C：D→B→C 三次比较。<\/p>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[&quot;插入 1&quot;] --&gt; B[&quot;插入 2&quot;]\n    B --&gt; C[&quot;插入 3&quot;]\n    C --&gt; D[&quot;树变成一条链 1→2→3!&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：有序插入让 BST 长歪成链表——这就是 BST 的天生缺陷。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：家谱式二分——root 是中等人，左边全是更矮的亲戚、右边全是更高的。<em>失效边界<\/em>：如果你按身高顺序一个个加人（从矮到高），树就歪成一队，优势全失。\n<\/li><li>\n<strong>实例<\/strong>：插入 D、B、F、A、C、E 得到上图平衡树；插入顺序改成 A、B、C、D、E、F 则得右斜链。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为<\/strong> BST 查找是 O(log N) 有保证——实际上平均 1.39 lg N 只在<strong>随机键<\/strong>下成立，最坏 O(N)。\n<\/li><li>\n<strong>别以为<\/strong> BST 和二分查找完全一样——二分查找作用于静态有序数组，BST 是动态树、支持插入删除。\n<\/li><li>\n<strong>别以为<\/strong>删除节点就是直接摘掉——实际上有两个孩子时要用右子树最小节点补位，保持 BST 性质。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\nBST 的核心性质一句话是什么？（答案：左子树键 &lt; 根键 &lt; 右子树键；解析：中序遍历必升序。）\n<\/li><li>\n随机 N 键构造的 BST，平均查找命中约？（答案：~2 ln N ≈ 1.39 lg N；解析：命题 C。）\n<\/li><li>\n按 1,2,3,4 顺序插入构造的 BST 长什么样？（答案：一条向右的链；解析：每次新键都比所有旧键大，只能挂最右。）\n<\/li><li>\nBST 的 min 操作怎么走？（答案：从根一路向左走到无左孩子；解析。）\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\nBST：左小右大；查找=走根到叶的一条路。\n<\/li><li>\n平均 1.39 lg N，但最坏退化成链。\n<\/li><li>\n平衡树（3.3）就是为了治&quot;长歪&quot;。\n<\/ul>", "ch03c": "<h1>第 3 章（3.3）：平衡查找树——2-3 树与红黑树<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：4 小时 | <strong>前置<\/strong>：ch03b\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本节，你能：<\/p>\n<ol><li>\n说清<strong>2-3 查找树<\/strong>为什么天然平衡；\n<\/li><li>\n理解<strong>红黑树<\/strong>是 2-3 树的&quot;二叉树编码&quot;：红链接把 3-节点拉平；\n<\/li><li>\n记住关键结论：N 个节点的红黑树高度 ≤ 2 lg N，所有操作对数级。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>红黑树 = 给 BST 加颜色规则，让树任何插入顺序下都保持&quot;近乎完美平衡&quot;，把最坏查找从 O(N) 救回 O(log N)。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：2-3 查找树（难度：高难）<\/h3>\n<p>允许两种节点：<\/p>\n<ul><li>\n<strong>2-节点<\/strong>：一个键，两个孩子（普通 BST 节点）；\n<\/li><li>\n<strong>3-节点<\/strong>：两个键，三个孩子。\n<\/ul>\n<p>插入时先接到叶子：若临时变成 4-节点，<strong>分裂<\/strong>成三个 2-节点，中间键上浮给父亲。这个&quot;分裂上浮&quot;一路向上，树始终<strong>完美平衡<\/strong>——所有叶子等高。<\/p>\n<h3>概念 2：红黑树的直觉（难度：高难）<\/h3>\n<p>直接实现 2-3 树很麻烦。<strong>红黑树（red-black BST）<\/strong>巧在：用&quot;红链接&quot;把 3-节点画扁——把两个键绑在一起的节点画成一个红链接连接的二叉小结构。于是：<\/p>\n<ul><li>\n红链接连接的两节点&quot;假装&quot;是一个 3-节点；\n<\/li><li>\n黑链接就是普通 BST 链接。\n<\/ul>\n<p><strong>规则<\/strong>：① 红链接左斜；② 从根到叶没有两条连续红链接；③ 树完美黑平衡（任一空链接到根的黑链接数相同）。<\/p>\n<h3>概念 3：三种平衡操作（难度：高难）<\/h3>\n<p>插入后可能违规，用两个手术修：<\/p>\n<ul><li>\n<strong>左旋（rotate left）<\/strong>：右斜红链接掰向左；\n<\/li><li>\n<strong>右旋（rotate right）<\/strong>：左斜红链接掰向右；\n<\/li><li>\n<strong>颜色反转（flip colors）<\/strong>：4-节点分裂，两孩子变黑、自己变红——对应 2-3 树的分裂上浮。\n<\/ul>\n<h3>概念 4：关键结论（难度：进阶）<\/h3>\n<ul><li>\n命题 G：N 个节点的红黑树高度 <strong>≤ 2 lg N<\/strong>；\n<\/li><li>\n命题 I：查找、插入、删除全在<strong>最坏对数级别<\/strong>；\n<\/li><li>\n工程含义：TreeMap/TreeSet、Linux 内核、C++ STL 都用红黑树。\n<\/ul>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    subgraph 2-节点\n        P1[&quot;键 K&quot;] --&gt; C1[&quot;子1&quot;]\n        P1 --&gt; C2[&quot;子2&quot;]\n    end\n    subgraph 3-节点(红黑树中画扁)\n        P2[&quot;键小&quot;] ==红==&gt; P3[&quot;键大&quot;]\n        P2 --&gt; D1\n        P3 --&gt; D2\n    end<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：红链接（粗红）把 3-节点&quot;压扁&quot;成两个普通节点——红黑树因此长得像 BST，却带着 2-3 树的平衡性。<\/p>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n    A[&quot;新插入&quot;] --&gt; B{违规?}\n    B -- &quot;右斜红&quot; --&gt; C[&quot;左旋&quot;]\n    B -- &quot;左斜红+双红&quot; --&gt; D[&quot;右旋&quot;]\n    B -- &quot;4-节点&quot; --&gt; E[&quot;颜色反转&quot;]\n    C --&gt; F[&quot;恢复平衡&quot;]\n    D --&gt; F\n    E --&gt; F<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：每次插入后用旋转/变色三件套修复，保证三条颜色规则永不破。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：2-3 树像&quot;可合并的车厢&quot;——车厢挤了（4-节点）就拆成两节，中间乘客（键）升往上层；红黑树是把&quot;两节车厢并排画&quot;的工程画法。<em>失效边界<\/em>：红黑树不是完美平衡（高度可到 2 lg N），只是&quot;足够平衡&quot;，换来实现简单。\n<\/li><li>\n<strong>实例<\/strong>：按 A、C、E、G 顺序插入——普通 BST 会右斜成链，红黑树通过旋转把它掰成矮胖。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为<\/strong>红黑树是完美平衡——实际上高度可达 2 lg N，只是&quot;近似平衡&quot;。\n<\/li><li>\n<strong>别以为<\/strong>红链接是&quot;数据&quot;——实际上它只是<strong>标记<\/strong>，不影响中序遍历的键顺序。\n<\/li><li>\n<strong>别以为<\/strong>学红黑树必须背下全部旋转代码——实际上核心是理解&quot;它是 2-3 树的二叉编码 + 三种修复操作&quot;，代码细节可查。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n红黑树中&quot;红链接&quot;代表什么？（答案：两个节点共同构成一个 3-节点；解析：是 2-3 树的编码标记。）\n<\/li><li>\nN 节点红黑树的高度上界？（答案：2 lg N；解析：命题 G。）\n<\/li><li>\n红黑树插入后修复的三种操作？（答案：左旋、右旋、颜色反转；解析。）\n<\/li><li>\n红黑树相对普通 BST 解决了什么致命问题？（答案：有序键插入导致树退化成链、查找 O(N)；解析：红黑树保证对数级。）\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n2-3 树：2-节点/3-节点，分裂上浮，完美平衡。\n<\/li><li>\n红黑树 = 2-3 树的二叉编码：红链接绑 3-节点。\n<\/li><li>\n高 ≤ 2 lg N，全操作对数级。\n<\/ul>", "ch03d": "<h1>第 3 章（3.4）：散列表（哈希表）<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：3 小时 | <strong>前置<\/strong>：ch03a、ch01c\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本节，你能：<\/p>\n<ol><li>\n说清<strong>散列函数<\/strong>：把 key 压成数组下标；\n<\/li><li>\n区分两种<strong>碰撞解决<\/strong>：拉链法（separate chaining）与线性探测（linear probing）；\n<\/li><li>\n理解<strong>装载因子<\/strong>为什么要控制在 1/2 附近，以及动态扩缩容。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>散列表 = key 经散列函数直接算出存储下标，理想情况查找/插入<strong>常数时间<\/strong>——代价是失去有序性。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：散列函数（hash function，难度：基础）<\/h3>\n<p><strong>散列函数<\/strong> <code>hash(key)<\/code>：把任意 key 映射成数组 <code>[]<\/code> 的下标（0 ~ M-1）。理想性质：① 计算快；② 分布均匀，不同 key 尽量落到不同槽。Java 的 <code>hashCode()<\/code> 再用除留余数法 <code>% M<\/code> 压到槽数。<\/p>\n<h3>概念 2：碰撞（collision，难度：基础）<\/h3>\n<p><strong>碰撞<\/strong>：两个不同 key 散列到同一个槽。槽只有那么多，碰撞必然发生——问题不是&quot;会不会撞&quot;，而是&quot;撞了怎么办&quot;。<\/p>\n<h3>概念 3：拉链法（separate chaining，难度：进阶）<\/h3>\n<p>每个槽放一条<strong>链表<\/strong>（背包）。碰撞的 key 全挂同一条链。查找：先散列到槽，再在链上顺序找。<\/p>\n<ul><li>\n若 N 个键分到 M 条链，平均链长 N/M；\n<\/li><li>\n控制 M ≈ N → 每条链常数长 → 查找/插入<strong>O(1)<\/strong>。\n<\/ul>\n<h3>概念 4：线性探测（linear probing，难度：进阶）<\/h3>\n<p><strong>开放寻址<\/strong>：数组本身存键值对，不挂链表。碰撞时往后顺移一格（<code>(hash+1)%M<\/code>）找空位。查找同理：散列到槽，不等就往后扫，直到命中或遇到空位。 要求：数组必须比键多——<strong>装载因子 α = N/M 保持 ≤ 1/2<\/strong>，否则探测链太长。<\/p>\n<h3>概念 5：动态扩缩容（难度：进阶）<\/h3>\n<p>α 超过 1/2 时数组翻倍重建；低于 1/8 时减半。重建 = 把所有键重新散列到新槽（槽数变了，hash%M 全变）。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    K[&quot;key&quot;] --&gt; H[&quot;hash(key) % M = 槽 s&quot;]\n    H --&gt; C{&quot;槽 s 被占?&quot;}\n    C -- 否 --&gt; S[&quot;直接存入 s&quot;]\n    C -- 是 --&gt; M{&quot;哪种碰撞策略?&quot;}\n    M -- 拉链法 --&gt; Z[&quot;挂到槽 s 的链表尾&quot;]\n    M -- 线性探测 --&gt; P[&quot;顺移 s+1, s+2... 找空位&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：散列函数是入口；两种碰撞策略决定了&quot;撞了之后往哪走&quot;。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：旅馆房间号由&quot;姓氏首字母&quot;算出（散列）。同姓的人多了（碰撞）：拉链法=同一房间加床住一串人；线性探测=顺着房间号往后找空房。<em>失效边界<\/em>：房间住太满（α→1），找房要走很长走廊——所以必须控制装载因子。\n<\/li><li>\n<strong>实例<\/strong>：M=3 槽，键 A、B、C 的 hash 分别为 0、0、1。拉链法：槽0 链 [A,B]，槽1 链 [C]。查 B：散列到 0，在链上第二个命中。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为<\/strong>散列表查找是 O(1) 无条件——实际上只有装载因子低、散列均匀时才是；最坏（全撞一条链）退化成 O(N)。\n<\/li><li>\n<strong>别以为<\/strong>散列表支持按顺序遍历键——实际上散列打乱了键顺序，<strong>不支持 min/floor/rank<\/strong> 这类有序操作。\n<\/li><li>\n<strong>别以为<\/strong>拉链法和线性探测随便选——实际上内存紧张用线性探测（无链表节点开销），允许链长时拉链法实现简单。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n散列函数的两个理想性质？（答案：计算快、分布均匀；解析。）\n<\/li><li>\n拉链法如何解决碰撞？（答案：每个槽挂链表，碰撞键串在同一条链上；解析。）\n<\/li><li>\n线性探测要求装载因子 α 控制在多少？（答案：≤ 1/2；解析：否则探测链过长。）\n<\/li><li>\n散列表为什么不支持 rank/select？（答案：散列打乱键顺序，无有序结构；解析。）\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n散列：key → 下标，理想 O(1)。\n<\/li><li>\n碰撞两策：拉链法（挂链）、线性探测（顺移）。\n<\/li><li>\n装载因子 ≤ 1/2；超了就扩容重散列。\n<\/ul>", "ch03e": "<h1>第 3 章（3.5）：符号表应用——字典、索引与稀疏向量<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★☆☆ | <strong>预估学时<\/strong>：1.5 小时 | <strong>前置<\/strong>：ch03a~ch03d\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本节，你能：<\/p>\n<ol><li>\n说清&quot;我该用哪种符号表实现&quot;的选型决策；\n<\/li><li>\n看懂字典类用例（词频统计、白名单过滤）；\n<\/li><li>\n理解<strong>稀疏向量<\/strong>：用符号表存非零分量，省内存。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>符号表是工程里最常用的抽象——字典、索引、稀疏矩阵全是它；选型口诀：要有序用红黑树，要最快用散列。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：选型决策（原书 3.5.1，难度：基础）<\/h3>\n<table><thead><tr><th>需求<\/th><th>选<\/th><\/tr><\/thead><tbody><tr><td>需要有序操作（min/floor/rank/范围）<\/td><td>红黑树（TreeMap）<\/td><\/tr><tr><td>只要 put/get、追求最快<\/td><td>散列表（HashMap）<\/td><\/tr><tr><td>键全是整数且稠密<\/td><td>直接数组下标<\/td><\/tr><\/tbody><\/table>\n<p>经验：Java 库默认 HashMap（散列），需要排序遍历才换 TreeMap。<\/p>\n<h3>概念 2：字典类用例（难度：基础）<\/h3>\n<ul><li>\n<strong>词频统计<\/strong>：<code>get(word)+1<\/code> 累加；\n<\/li><li>\n<strong>白名单过滤<\/strong>：读入白名单进符号表，输入查不到就丢弃；\n<\/li><li>\n<strong>去重<\/strong>：put 时若 get 已存在则跳过。\n<\/ul>\n<h3>概念 3：索引类用例（难度：进阶）<\/h3>\n<p><strong>索引<\/strong>：为加速查找而建的辅助符号表。例：反向索引——词 → 出现它的所有文档列表。搜索引擎的核心就是这个。<\/p>\n<h3>概念 4：稀疏向量（sparse vector，难度：高难）<\/h3>\n<p><strong>稀疏向量<\/strong>：绝大多数分量为 0 的向量。直接存 N 维数组浪费内存。改用符号表：<code>索引 → 非零值<\/code>，只存非零位置。 点积 <code>a·b = Σ a[i]*b[i]<\/code>：只遍历两边都非零的索引——成本正比于非零分量数，而非 N。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n    A[&quot;要有序操作?&quot;] --&gt;|是| B[&quot;红黑树 TreeMap&quot;]\n    A --&gt;|否| C[&quot;散列表 HashMap&quot;]\n    B --&gt; D[&quot;O(log N), 可排序遍历&quot;]\n    C --&gt; E[&quot;O(1) 均摊, 最快&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：选型就一条分叉——要不要有序能力。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：稀疏向量像只记了几个联系人的通讯录——绝大多数位置是空的，没必要买厚电话本。<em>失效边界<\/em>：当向量稠密（非零占大多数）时，符号表的节点开销反而比数组大，应直接用数组。\n<\/li><li>\n<strong>实例<\/strong>：向量 (0,0,3,0,0,7) 存成 {2:3, 5:7}，点积只算这两个位置。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为<\/strong>散列表总是首选——实际上需要按 key 排序输出时（如排行榜），必须用红黑树。\n<\/li><li>\n<strong>别以为<\/strong>稀疏向量省内存没代价——实际上每个非零分量要付一个符号表节点（键+值+指针）开销，稀疏才划算。\n<\/li><li>\n<strong>别以为<\/strong>符号表只用于内存——实际上磁盘数据库的索引也是符号表思想。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n需要&quot;找小于某键的最大键&quot;用哪种符号表？（答案：红黑树 TreeMap；解析：散列表无有序操作。）\n<\/li><li>\n稀疏向量为什么用符号表存？（答案：只存非零分量，省内存；解析。）\n<\/li><li>\n反向索引是什么？（答案：词 → 包含该词的文档列表；解析：搜索引擎基础。）\n<\/li><li>\n键是稠密整数时最朴素的符号表实现是？（答案：直接用数组下标；解析。）\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n选型：有序→红黑树；极速→散列。\n<\/li><li>\n字典/索引/稀疏向量都是符号表用例。\n<\/li><li>\n稀疏向量：只存非零，点积成本=非零数。\n<\/ul>", "ch04a": "<h1>第 4 章（4.1）：无向图——DFS 与 BFS<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：3.5 小时 | <strong>前置<\/strong>：ch01c（栈/队列）、ch01e（连通分量）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本节，你能：<\/p>\n<ol><li>\n说清图的术语：顶点、边、度、路径、环、连通分量；\n<\/li><li>\n用<strong>邻接表<\/strong>表示图，并写出 DFS（深度优先）与 BFS（广度优先）；\n<\/li><li>\n说清 BFS 为什么能求&quot;最短路径&quot;。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>图 = 顶点 + 边；DFS 像走迷宫一条路走到黑，BFS 像水波一圈圈扩散——BFS 第一次到达某点的路就是最短路径。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：图的术语（难度：基础）<\/h3>\n<ul><li>\n<strong>顶点（vertex）<\/strong>：节点；<strong>边（edge）<\/strong>：两顶点间的连接；\n<\/li><li>\n<strong>度（degree）<\/strong>：一个顶点连出几条边；\n<\/li><li>\n<strong>路径（path）<\/strong>：边连成的序列；<strong>环（cycle）<\/strong>：起点=终点的路径；\n<\/li><li>\n<strong>连通（connected）<\/strong>：两点间有路径；<strong>连通分量<\/strong>：互相连通的极大顶点集合。\n<\/ul>\n<h3>概念 2：邻接表表示（难度：基础）<\/h3>\n<p><strong>邻接表<\/strong>：数组 <code>adj[]<\/code>，每个顶点 v 对应一条链表，存它的所有邻居。V 个顶点、E 条边的图，空间 O(V+E)。<\/p>\n<pre class=\"lang-java\"><code>public class Graph {\n    private int V;\n    private Bag&lt;Integer&gt;[] adj;          // 邻接表\n    public Graph(int V) {\n        this.V = V; adj = (Bag&lt;Integer&gt;[]) new Bag[V];\n        for (int v = 0; v &lt; V; v++) adj[v] = new Bag&lt;Integer&gt;();\n    }\n    public void addEdge(int v, int w) {\n        adj[v].add(w); adj[w].add(v);    // 无向：两边都加\n    }\n}<\/code><\/pre>\n<h3>概念 3：深度优先搜索 DFS（难度：进阶）<\/h3>\n<p><strong>DFS（Depth-First Search）<\/strong>：访问顶点 v，标记 <code>marked[v]=true<\/code>，然后递归访问它每个未标记的邻居。像走迷宫：一条路走到死，回头换岔路。<\/p>\n<pre class=\"lang-java\"><code>private void dfs(Graph G, int v) {\n    marked[v] = true;\n    for (int w : G.adj(v))\n        if (!marked[w]) dfs(G, w);\n}<\/code><\/pre>\n<p>用途：判断连通性、找路径、数连通分量。<\/p>\n<h3>概念 4：广度优先搜索 BFS（难度：进阶）<\/h3>\n<p><strong>BFS（Breadth-First Search）<\/strong>：用<strong>队列<\/strong>。从起点出发，先访问距离 1 的所有邻居，再距离 2……一圈圈扩散。<\/p>\n<pre class=\"lang-java\"><code>private void bfs(Graph G, int s) {\n    Queue&lt;Integer&gt; q = new Queue&lt;Integer&gt;();\n    marked[s] = true; q.enqueue(s);\n    while (!q.isEmpty()) {\n        int v = q.dequeue();\n        for (int w : G.adj(v))\n            if (!marked[w]) { marked[w]=true; q.enqueue(w); }\n    }\n}<\/code><\/pre>\n<p><strong>为什么 BFS 给最短路径<\/strong>：按距离从小到大访问，第一次碰到 w 时，当前这条路径必然是边数最少的（更短的路早该被发现）。<\/p>\n<h3>概念 5：连通分量（难度：进阶）<\/h3>\n<p>遍历所有顶点：每个未标记顶点启动一次 DFS，这次 DFS 能到达的全部顶点就是一个连通分量。和第 1.5 节并查集呼应——但 DFS 版能给出具体路径。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[&quot;0&quot;] --- B[&quot;1&quot;]\n    A --- C[&quot;2&quot;]\n    B --- D[&quot;3&quot;]\n    C --- D\n    D --- E[&quot;4&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：以 0 为起点。DFS：0→1→3→2→4（一条路扎到底）。BFS：先访问 1、2（距离1），再 3、4（距离2）。<\/p>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n    S[&quot;起点 s&quot;] --&gt; L1[&quot;距离1: 一圈邻居&quot;]\n    L1 --&gt; L2[&quot;距离2: 再外圈&quot;]\n    L2 --&gt; L3[&quot;距离3: ...&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：BFS 按&quot;波纹&quot;层次扩散——先到的层距离短，故首次到达即最短。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比（DFS）<\/strong>：走迷宫，每条岔路走到死胡同才回头。<em>失效边界<\/em>：DFS 不保证先走最短的路。\n<\/li><li>\n<strong>类比（BFS）<\/strong>：往池塘扔石头，波纹一圈圈外扩。<em>失效边界<\/em>：BFS 要存整个队列，大图内存开销比 DFS 大。\n<\/li><li>\n<strong>实例<\/strong>：上图中 BFS 从 0 到 4 的最短路径是 0-3-4（2 条边）；DFS 可能走 0-1-3-4（3 条边）。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为<\/strong> DFS 和 BFS 只是写法不同——实际上 DFS 用栈（递归）、BFS 用队列，顺序本质不同。\n<\/li><li>\n<strong>别以为<\/strong> DFS 能求最短路径——实际上只有 BFS 保证最短；DFS 找到的第一条路不一定最短。\n<\/li><li>\n<strong>别以为<\/strong> 图必须画成圈圈——实际上邻接表才是标准表示，画出来的图只是辅助想象。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n无向图中&quot;度&quot;指什么？（答案：一个顶点连出的边数；解析。）\n<\/li><li>\nDFS 用什么数据结构？BFS 呢？（答案：DFS 栈（递归调用栈）；BFS 队列；解析。）\n<\/li><li>\n为什么 BFS 能求最短路径？（答案：按距离从小到大访问，首次到达即最短；解析。）\n<\/li><li>\nV 顶点 E 边的邻接表占多少空间？（答案：O(V+E)；解析。）\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n图 = 顶点 + 边；邻接表 O(V+E)。\n<\/li><li>\nDFS 栈式扎到底；BFS 队列式波纹扩散。\n<\/li><li>\n最短路径 = BFS 首次到达。\n<\/ul>", "ch04b": "<h1>第 4 章（4.2）：有向图——可达性、环与强连通<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：3 小时 | <strong>前置<\/strong>：ch04a\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本节，你能：<\/p>\n<ol><li>\n说清有向图与无向图的差别（边有方向）；\n<\/li><li>\n判断<strong>环<\/strong>与<strong>有向无环图（DAG）<\/strong>，做<strong>拓扑排序<\/strong>；\n<\/li><li>\n理解<strong>强连通<\/strong>：a 能到 b、b 也能到 a。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>有向图的边是&quot;单行道&quot;；DAG（无环）能做拓扑排序排任务依赖；强连通是&quot;互相可达&quot;。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：有向图术语（难度：基础）<\/h3>\n<p><strong>有向图（digraph）<\/strong>：边带方向，v→w 不等于 w→v。类比：网页链接（A 链到 B 不代表 B 链回 A）、课程先修关系。<\/p>\n<h3>概念 2：可达性（reachability，难度：基础）<\/h3>\n<p><strong>可达<\/strong>：从 s 出发沿有向边能到 v。用 DFS 从 s 出发遍历，能到的顶点集合就是 s 的可达集。<\/p>\n<h3>概念 3：环与 DAG（难度：进阶）<\/h3>\n<p><strong>环（cycle）<\/strong>：沿有向边绕回起点。<strong>有向无环图（DAG, Directed Acyclic Graph）<\/strong>：没有环的有向图。<\/p>\n<ul><li>\n判断环：DFS 时若遇到&quot;正在访问中&quot;的祖先节点，就成环。\n<\/li><li>\n<strong>拓扑排序（topological sort）<\/strong>：把 DAG 的顶点排成线性序，使每条边从前者指向后者。用途：排课程先修顺序、任务调度。做法：DFS 后序逆序输出。\n<\/ul>\n<h3>概念 4：强连通（strongly connected，难度：高难）<\/h3>\n<p><strong>强连通<\/strong>：a 能到 b <strong>且<\/strong> b 能到 a（双向可达）。强连通把图分成若干&quot;互相可达团&quot;。<\/p>\n<ul><li>\n普通连通（无向）是双向天然成立；有向图里必须两边都能走。\n<\/li><li>\n用途：网页重要性、编译器依赖分析。\n<\/ul>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[&quot;课程1&quot;] --&gt; B[&quot;课程2&quot;]\n    B --&gt; C[&quot;课程3&quot;]\n    A --&gt; C\n    C --&gt; D[&quot;课程4&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：这是 DAG（无环）。拓扑序：课程1→课程2→课程3→课程4——先修在前。<\/p>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n    A[&quot;a&quot;] --&gt; B[&quot;b&quot;]\n    B --&gt; A\n    B --&gt; C[&quot;c&quot;]\n    C --&gt; B<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：a、b、c 两两互相可达——构成一个强连通分量。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比（拓扑排序）<\/strong>：做菜步骤——先备菜才能炒，先炒才能装盘。<em>失效边界<\/em>：若步骤互相依赖（&quot;先做 A 才能 B，先做 B 才能 A&quot;），就成环，无法拓扑排序——现实中就是死锁。\n<\/li><li>\n<strong>实例<\/strong>：先修关系 1→2、2→3、1→3、3→4，拓扑序 1,2,3,4 合法。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为<\/strong>有向图连通和无向图一样——实际上有向图&quot;a 到 b&quot;不代表&quot;b 到 a&quot;，强连通要求双向。\n<\/li><li>\n<strong>别以为<\/strong>拓扑排序适用于任何图——实际上只适用于 DAG；有环图排不出合法顺序。\n<\/li><li>\n<strong>别以为<\/strong>强连通分量要两两直接相连——实际上只要间接可达即可，不要求直接边。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n有向图的&quot;可达&quot;和无向图有何不同？（答案：可达是单向的，a→b 不代表 b→a；解析。）\n<\/li><li>\nDAG 是什么？（答案：有向无环图；解析：可做拓扑排序。）\n<\/li><li>\n拓扑排序的用途？（答案：排任务依赖/课程先修顺序；解析。）\n<\/li><li>\n强连通的定义？（答案：两顶点互相可达（双向）；解析。）\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n有向边 = 单行道。\n<\/li><li>\nDAG → 拓扑排序；有环 → 死锁。\n<\/li><li>\n强连通 = 互相可达。\n<\/ul>", "ch04c": "<h1>第 4 章（4.3）：最小生成树（MST）<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：3.5 小时 | <strong>前置<\/strong>：ch04a、ch02d（优先队列）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本节，你能：<\/p>\n<ol><li>\n说清<strong>最小生成树<\/strong>问题：给连通加权无向图，选 V-1 条边连起所有顶点且总权重最小；\n<\/li><li>\n讲出<strong>切分定理<\/strong>（MST 的理论基础）；\n<\/li><li>\n写出 Prim 与 Kruskal 两种算法，说出它们的复杂度 E log V。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>最小生成树 = 用最少的&quot;总修路成本&quot;把所有城市连起来；Prim 从一个点长出去，Kruskal 按边权从小到大接。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：问题定义（难度：基础）<\/h3>\n<p><strong>最小生成树（Minimum Spanning Tree, MST）<\/strong>：连通加权无向图中，一棵包含所有顶点、边数 V-1、<strong>总权重最小<\/strong>的树。 类比：要在若干城市间铺光缆连通全部，求总成本最低方案。<\/p>\n<h3>概念 2：切分定理（cut property，难度：高难）<\/h3>\n<p><strong>切分（cut）<\/strong>：把顶点分成两组。<strong>横切边<\/strong>：连接两组的边。 <strong>切分定理<\/strong>：在所有横切边中，<strong>权重最小的那条边一定属于 MST<\/strong>。 这是 Prim/Kruskal 共同的理论基石——每一步&quot;挑最小横切边&quot;都安全。<\/p>\n<h3>概念 3：Prim 算法（难度：进阶）<\/h3>\n<p>从任一顶点开始，维护&quot;已在树中的顶点集&quot;。每次选<strong>连接树内与树外的最小横切边<\/strong>，把树外顶点拉进来。用<strong>优先队列<\/strong>存候选边。 复杂度（原书）：时间 <strong>E log V<\/strong>，空间 V。<\/p>\n<h3>概念 4：Kruskal 算法（难度：进阶）<\/h3>\n<p>把所有边按权重<strong>从小到大排序<\/strong>，依次考虑：若这条边连接两个不同连通分量（用并查集判断），就收进 MST；否则跳过（会成环）。直到收满 V-1 条边。 复杂度：排序 E log E + 并查集近常数 → 整体 E log E ≈ E log V。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[&quot;切分: 树内 S ｜ 树外 T&quot;] --&gt; B[&quot;横切边中权重最小者&quot;]\n    B --&gt; C[&quot;必入 MST(切分定理)&quot;]\n    C --&gt; D[&quot;把该边端点拉入 S&quot;]\n    D --&gt; A<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：Prim 的循环——每轮用切分定理安全地加一条边。<\/p>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n    E[&quot;所有边按权排序&quot;] --&gt; F[&quot;从小到大遍历&quot;]\n    F --&gt; G{&quot;两端已连通?&quot;}\n    G -- 否 --&gt; H[&quot;收入 MST(并查集 union)&quot;]\n    G -- 是 --&gt; I[&quot;跳过(会成环)&quot;]\n    H --&gt; F\n    I --&gt; F<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：Kruskal = 排序 + 并查集；只收&quot;连接新分量&quot;的边。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比（Prim）<\/strong>：从首都开始修地铁，每次修一条连接&quot;已通地铁区&quot;和&quot;未通区&quot;的最便宜线路，路网像树一样长出去。<em>失效边界<\/em>：Prim 要求图连通；不连通图没有 MST。\n<\/li><li>\n<strong>类比（Kruskal）<\/strong>：把所有候选路按造价排队，从最便宜的开始修，能连通新地方就修，会绕圈就不修。\n<\/li><li>\n<strong>实例<\/strong>：4 城市，边权 AB=1、BC=2、CD=3、AD=4。MST 选 AB、BC、CD（总 6），AD 被弃（会成环）。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为<\/strong> MST 是&quot;最短路径树&quot;——实际上 MST 最小化的是<strong>总边权和<\/strong>，不是任意两点间的最短距离。\n<\/li><li>\n<strong>别以为<\/strong> Kruskal 用 DFS——实际上它用<strong>并查集<\/strong>判断连通，和第 1.5 节呼应。\n<\/li><li>\n<strong>别以为<\/strong> MST 唯一——实际上权重有并列时 MST 可能不唯一，但总权重一定最小。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\nMST 要选多少条边？（答案：V-1 条；解析：树的定义。）\n<\/li><li>\n切分定理说横切边中哪条必入 MST？（答案：权重最小的那条；解析。）\n<\/li><li>\nKruskal 用什么数据结构判断两端是否已连通？（答案：并查集；解析。）\n<\/li><li>\nPrim 算法的时间复杂度？（答案：E log V；解析：优先队列操作。）\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\nMST = 总权重最小的生成树。\n<\/li><li>\n切分定理：最小横切边必入 MST。\n<\/li><li>\nPrim 从点长出去；Kruskal 按边权排序+并查集。\n<\/ul>", "ch04d": "<h1>第 4 章（4.4）：最短路径——Dijkstra 与无环图算法<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：4 小时 | <strong>前置<\/strong>：ch04c、ch02d（优先队列）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本节，你能：<\/p>\n<ol><li>\n说清<strong>最短路径树（SPT）<\/strong>：从起点到所有顶点的最短路径集合；\n<\/li><li>\n写出 <strong>Dijkstra 算法<\/strong>（非负权），说出复杂度 E log V；\n<\/li><li>\n理解无环加权有向图可以线性时间求最短/最长路径。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>最短路径 = 从起点找&quot;到各点最便宜的路&quot;；Dijkstra 像 Prim 一样每次锁定当前最近点，前提是边权非负。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：最短路径树 SPT（难度：基础）<\/h3>\n<p><strong>最短路径树（Shortest-Path Tree, SPT）<\/strong>：以起点 s 为根，每个顶点到 s 的路径都是最短路径。用两个数组存：<code>distTo[v]<\/code>（s 到 v 的最短距离）、<code>edgeTo[v]<\/code>（最短路上 v 的前一条边）。<\/p>\n<h3>概念 2：松弛（relaxation，难度：进阶）<\/h3>\n<p><strong>松弛<\/strong>：考察边 v→w。若 <code>distTo[v] + 边权 &lt; distTo[w]<\/code>，就更新 <code>distTo[w]<\/code> 和 <code>edgeTo[w]<\/code>——发现一条更短的路。所有最短路径算法本质都是反复松弛。<\/p>\n<h3>概念 3：Dijkstra 算法（难度：高难）<\/h3>\n<p>前提：<strong>所有边权非负<\/strong>。<\/p>\n<ol><li>\n起点 distTo=0，其余无穷；\n<\/li><li>\n选<strong>未确定顶点中 distTo 最小<\/strong>的 u，标记 u 已确定；\n<\/li><li>\n松弛 u 的所有出边；\n<\/li><li>\n重复直到全部确定。\n<\/ol>\n<p>为什么非负才行？：一旦锁定 u，不可能再有&quot;更短的路绕到 u&quot;——因为后续路只会加非负权。<\/p>\n<p>复杂度：优先队列实现 → <strong>E log V<\/strong>。<\/p>\n<h3>概念 4：无环加权有向图（难度：高难）<\/h3>\n<p>若图是 DAG，可以<strong>拓扑排序后按序松弛<\/strong>——线性时间 O(V+E) 同时求出最短和最长路径。因为拓扑序保证松弛 v 时，v 的所有入边都已处理过。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    S[&quot;起点 s, distTo=0&quot;] --&gt; P[&quot;选未确定中 distTo 最小的 u&quot;]\n    P --&gt; R[&quot;松弛 u 的出边: 更新 distTo[w]&quot;]\n    R --&gt; P\n    P --&gt; D[&quot;全部确定 → SPT 建成&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：Dijkstra = 反复&quot;锁定最近点 + 松弛它的边&quot;。和 Prim 几乎同构，区别在松弛规则。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：导航软件规划路线——先锁定&quot;当前已知最近的路口&quot;，再从它往外探新路。<em>失效边界<\/em>：若有负权边（如某段路倒贴钱），Dijkstra 会错——锁定后还可能出现更短路。\n<\/li><li>\n<strong>实例<\/strong>：s→a 权 2，s→b 权 5，a→b 权 1。松弛后 distTo[b] = min(5, 2+1)=3，edgeTo[b]=a→b。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为<\/strong> Dijkstra 适用于任何图——实际上它<strong>要求边权非负<\/strong>；有负权边要换 Bellman-Ford。\n<\/li><li>\n<strong>别以为<\/strong> 最短路径和 MST 是一回事——实际上 MST 最小化总边权，最短路径最小化起点到各点距离，目标不同。\n<\/li><li>\n<strong>别以为<\/strong> Dijkstra 用队列——实际上它用<strong>优先队列<\/strong>（每次取 distTo 最小）。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\nSPT 用哪两个数组记录？（答案：distTo[v] 最短距离、edgeTo[v] 前驱边；解析。）\n<\/li><li>\n&quot;松弛&quot;一条边做什么？（答案：若经 v 到 w 更短，更新 distTo[w] 和 edgeTo[w]；解析。）\n<\/li><li>\nDijkstra 为什么要求边权非负？（答案：锁定 u 后不能再有更短路绕到 u；负权会破坏此性质；解析。）\n<\/li><li>\nDijkstra 的时间复杂度？（答案：E log V；解析：优先队列。）\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\nSPT：起点到各点的最短路集合。\n<\/li><li>\n松弛 = 发现更短路就更新。\n<\/li><li>\nDijkstra：非负权，E log V；DAG 可线性求解。\n<\/ul>", "ch05a": "<h1>第 5 章（5.1）：字符串排序——键索引计数、LSD、MSD、三向快排<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：3 小时 | <strong>前置<\/strong>：ch02c（快排）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本节，你能：<\/p>\n<ol><li>\n说清<strong>键索引计数法<\/strong>：O(N+R) 按字母分桶；\n<\/li><li>\n区分 <strong>LSD<\/strong>（低位优先，定长串）与 <strong>MSD<\/strong>（高位优先，变长串）；\n<\/li><li>\n说出三向字符串快速排序的适用场景。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>字符串排序不逐字符比较，而是按字符&quot;分桶&quot;：从低位或高位逐位稳定分发，桶内再递归。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：键索引计数法（key-indexed counting，难度：进阶）<\/h3>\n<p><strong>键索引计数<\/strong>：字母表大小 R。统计每个字符出现次数 → 算前缀和确定每组起始位置 → 按序分发到辅助数组。<strong>O(N+R)<\/strong>，稳定。这是所有字符串排序的地基。<\/p>\n<h3>概念 2：LSD 低位优先（Least Significant Digit，难度：进阶）<\/h3>\n<p><strong>LSD 字符串排序<\/strong>：从<strong>最右字符<\/strong>开始，逐位向左做键索引计数。前提：所有字符串<strong>等长<\/strong>。 类比：按学号排序——先比个位，再十位，再百位，每步稳定分发。<\/p>\n<h3>概念 3：MSD 高位优先（Most Significant Digit，难度：高难）<\/h3>\n<p><strong>MSD<\/strong>：从<strong>最左字符<\/strong>开始分桶，桶内递归。支持<strong>变长字符串<\/strong>。痛点：短字符串提前结束（补&quot;更小&quot;字符）；小桶退化，小数组改用插入排序。<\/p>\n<h3>概念 4：三向字符串快速排序（难度：高难）<\/h3>\n<p><strong>三向字符串快排<\/strong>：按当前字符把字符串分成 <code>&lt;<\/code>、<code>=<\/code>、<code>&gt;<\/code> 三组，只对 <code>&lt;<\/code> 和 <code>&gt;<\/code> 组递归下一位。避免 MSD 小桶爆炸，工程常用。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[&quot;一组字符串&quot;] --&gt; B[&quot;按第 d 位字符分桶(键索引计数)&quot;]\n    B --&gt; C{&quot;LSD: 从右往左逐位&quot;}\n    B --&gt; D{&quot;MSD: 从左往右, 桶内递归&quot;}\n    C --&gt; E[&quot;每步稳定分发&quot;]\n    D --&gt; E<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：核心动作都是&quot;按某位字符分桶&quot;，区别只在从哪头开始。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比（LSD）<\/strong>：整理一摞等长卡片，先按个位数分 10 堆，每堆再按十分位细分。<em>失效边界<\/em>：卡片长度不一就不能用 LSD——长短不一得用 MSD。\n<\/li><li>\n<strong>实例<\/strong>：定长 3 位串 [&quot;cab&quot;,&quot;acb&quot;,&quot;bca&quot;]，LSD 先按第 3 位分桶 → 再第 2 位 → 第 1 位，得序。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为<\/strong> LSD 适用于任何字符串——实际上它要求<strong>等长<\/strong>；变长串用 MSD。\n<\/li><li>\n<strong>别以为<\/strong>字符串排序靠比较——实际上 LSD/MSD 是<strong>分桶<\/strong>，不做字符间比较。\n<\/li><li>\n<strong>别以为<\/strong> MSD 一定比 LSD 快——实际上 MSD 递归开销大，定长短串 LSD 更省。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n键索引计数法的复杂度？（答案：O(N+R)，R 为字母表大小；解析。）\n<\/li><li>\nLSD 排序要求字符串满足什么？（答案：等长；解析。）\n<\/li><li>\nMSD 从哪一端开始分桶？（答案：最左字符（高位）；解析。）\n<\/li><li>\n三向字符串快排把字符串分成哪三组？（答案：当前字符 &lt;、=、&gt; 基准；解析。）\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n地基：键索引计数 O(N+R)，稳定。\n<\/li><li>\nLSD 从右（定长）；MSD 从左（变长）。\n<\/li><li>\n三向字符串快排 = 分桶版快排。\n<\/ul>", "ch05b": "<h1>第 5 章（5.2）：单词查找树（Trie）<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：2.5 小时 | <strong>前置<\/strong>：ch03b（BST）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本节，你能：<\/p>\n<ol><li>\n说清<strong>单词查找树（trie）<\/strong>：边代表字符、路径拼出键；\n<\/li><li>\n写出 get/put：沿字符走树；\n<\/li><li>\n理解它的成本与三向单词查找树的折中。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>trie = 把字符串按键的字符逐段拆开存进树，查一个键只走它的长度，与总键数无关。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：定义（难度：基础）<\/h3>\n<p><strong>单词查找树（trie / 字典树）<\/strong>：根无字符，每条边标一个字符。从根到某节点的路径拼出一个键。节点可存值。 例：插入 &quot;she&quot;、&quot;shell&quot;——共享前缀 &quot;sh&quot; 的路径。<\/p>\n<h3>概念 2：get/put（难度：进阶）<\/h3>\n<ul><li>\nget：从根出发，按 key 的字符逐边走；走到底且节点有值 → 命中；中途断边 → 不存在。\n<\/li><li>\nput：沿路走，缺边就建新节点；最后在末端节点存值。\n<p><strong>成本<\/strong>：查找/插入正比于<strong>键长<\/strong>，与键总数 N 无关——这是它相对 BST 的最大优势。<\/p>\n<\/ul>\n<h3>概念 3：痛点与三向单词查找树（难度：高难）<\/h3>\n<p>标准 trie 每个节点有 R 条边（字母表大小），<strong>空间浪费大<\/strong>。 <strong>三向单词查找树（TST）<\/strong>：每个节点只分三条边（小于/等于/大于当前字符），折中了空间与速度，工程常用。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    R[&quot;根&quot;] -- s --&gt; S[&quot;s&quot;]\n    S -- h --&gt; SH[&quot;sh&quot;]\n    SH -- e --&gt; SHE[&quot;she(值)&quot;]\n    SH -- e --&gt; SHE2[&quot;she&quot;]\n    SHE2 -- l --&gt; SHEL[&quot;shel&quot;]\n    SHEL -- l --&gt; SHELL[&quot;shell(值)&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：&quot;she&quot; 和 &quot;shell&quot; 共享路径 s→h→e——公共前缀只存一份，省空间。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：拼音输入法联想——打 &quot;sh&quot; 就列出所有以 sh 开头的词，因为它们在 trie 里共用一条前缀路径。<em>失效边界<\/em>：字符表很大（如 Unicode）时，每节点 R 条边的内存爆炸，得用三向 TST。\n<\/li><li>\n<strong>实例<\/strong>：查 &quot;she&quot;：根→s→h→e，节点有值 → 命中。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为<\/strong> trie 和 BST 一样——实际上 trie 按字符边走，BST 按整键比较；trie 查找成本只看键长。\n<\/li><li>\n<strong>别以为<\/strong> trie 省空间——实际上标准 trie 节点 R 条边很费内存；三向 TST 才是折中。\n<\/li><li>\n<strong>别以为<\/strong> trie 只能查完整键——实际上它天然支持前缀匹配（列出某前缀下所有键）。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\ntrie 的边代表什么？（答案：一个字符；解析：路径拼出键。）\n<\/li><li>\ntrie 查找一个键的成本取决于？（答案：键长，与键总数无关；解析。）\n<\/li><li>\n三向单词查找树解决什么问题？（答案：标准 trie 每节点 R 边太费内存；解析。）\n<\/li><li>\ntrie 天然支持什么 BST 不擅长的操作？（答案：前缀匹配/前缀遍历；解析。）\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\ntrie：边=字符，路径=键。\n<\/li><li>\n查找成本=键长，与 N 无关。\n<\/li><li>\n标准 trie 费内存；三向 TST 折中。\n<\/ul>", "ch05c": "<h1>第 5 章（5.3）：子字符串查找——暴力、KMP、Boyer-Moore、Rabin-Karp<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：3.5 小时 | <strong>前置<\/strong>：ch01a\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本节，你能：<\/p>\n<ol><li>\n说清子串查找问题：在文本中找模式串首次出现位置；\n<\/li><li>\n讲出<strong>暴力查找<\/strong>为什么会回退；\n<\/li><li>\n理解 <strong>KMP<\/strong> 的核心：不回退文本指针，用 DFA 记住已匹配部分。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>在长文本里找短模式串；暴力法每次失配就退回重比，KMP 靠预计算&quot;失配后从哪继续&quot;避免回退。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：问题定义（难度：基础）<\/h3>\n<p><strong>子字符串查找<\/strong>：文本 txt 中找模式串 pat 首次出现的起点。例：在 &quot;ababac&quot; 找 &quot;abac&quot;。<\/p>\n<h3>概念 2：暴力查找（难度：基础）<\/h3>\n<p>从文本位置 i 开始逐字符比 pat；失配则 i++ 重新比。最坏 O(NM)（N 文本长、M 模式长）——文本指针会<strong>回退<\/strong>。<\/p>\n<h3>概念 3：KMP（Knuth-Morris-Pratt，难度：高难）<\/h3>\n<p><strong>KMP<\/strong>：失配时<strong>不回退文本指针 i<\/strong>，而是用一个预计算的 DFA（确定有限状态自动机）决定&quot;模式指针 j 该退到哪&quot;。 核心洞察：已匹配的前缀里可能藏着&quot;下次可以直接复用&quot;的部分，不必从头再来。 预计算 DFA 只需 O(M)，查找 O(N)，总 O(N+M)。<\/p>\n<h3>概念 4：Boyer-Moore 与 Rabin-Karp（难度：高难）<\/h3>\n<ul><li>\n<strong>Boyer-Moore<\/strong>：从模式右端向左比，失配时按&quot;坏字符&quot;规则<strong>跳过一大段<\/strong>，实践常最快。\n<\/li><li>\n<strong>Rabin-Karp<\/strong>：把模式串当成大整数做<strong>散列指纹<\/strong>，文本窗口滚动散列，指纹相等再逐字符确认。O(N+M) 期望。\n<\/ul>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[&quot;文本 i 位置开始比 pat&quot;] --&gt; B{&quot;逐字符匹配?&quot;}\n    B -- 全中 --&gt; C[&quot;返回 i&quot;]\n    B -- 失配 --&gt; D{&quot;暴力: i++ 回退重比&quot;}\n    B --&gt; E{&quot;KMP: 不回退 i, DFA 决定 j 退到哪&quot;}\n    D --&gt; A\n    E --&gt; A<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：差别全在&quot;失配后怎么办&quot;——暴力退回，KMP 不退回。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：对答案时，暴力法每错一个字就从头对；KMP 像记住&quot;前三个字已经对过&quot;，错了只需从中间某字继续。<em>失效边界<\/em>：KMP 的优势在模式串有重复前缀时最明显；极短模式串暴力就够。\n<\/li><li>\n<strong>实例<\/strong>：pat=&quot;ababac&quot;，文本失配时 KMP 用已匹配的 &quot;abab&quot; 前缀信息决定 j 不退回 0。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为<\/strong> KMP 是最快的——实际上它是&quot;最坏保证好&quot;，实践中 Boyer-Moore 常更快。\n<\/li><li>\n<strong>别以为<\/strong> KMP 很难——实际上核心就一句：失配不回退文本指针，用预计算表决定模式指针位置。\n<\/li><li>\n<strong>别以为<\/strong> Rabin-Karp 逐字符比——实际上它先比散列指纹，指纹撞了才细看。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n暴力子串查找最坏复杂度？（答案：O(NM)；解析：文本 N、模式 M。）\n<\/li><li>\nKMP 的关键改进是什么？（答案：失配不回退文本指针，用 DFA 决定模式指针位置；解析。）\n<\/li><li>\nRabin-Karp 用什么加速？（答案：滚动散列指纹；解析。）\n<\/li><li>\nBoyer-Moore 从模式哪端开始比？（答案：右端向左；解析。）\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n子串查找：文本中找模式串。\n<\/li><li>\n暴力 O(NM) 会回退。\n<\/li><li>\nKMP 不回退，O(N+M)。\n<\/ul>", "ch05d": "<h1>第 5 章（5.4）：正则表达式与 NFA<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：3 小时 | <strong>前置<\/strong>：ch05c\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本节，你能：<\/p>\n<ol><li>\n说清正则表达式的三种运算：连接、或（|）、闭包（*）；\n<\/li><li>\n理解<strong>NFA（非确定有限状态自动机）<\/strong>：从正则表达式构造自动机模拟匹配；\n<\/li><li>\n说出 NFA 模拟的时间 ~3NM。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>正则表达式是描述模式的语言；本书把它编译成一台 NFA 自动机，模拟它跑一遍就知道文本是否匹配。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：正则表达式语法（难度：基础）<\/h3>\n<p>三种基本运算：<\/p>\n<ul><li>\n<strong>连接<\/strong>：AB 表示 A 后紧跟 B；\n<\/li><li>\n<strong>或<\/strong>：A|B 表示 A 或 B；\n<\/li><li>\n<strong>闭包<\/strong>：A* 表示 A 重复零次或多次。\n<p>加括号分组。例：<code>(A|B)(C|D)*<\/code> 匹配 &quot;ACCD&quot; 这类。<\/p>\n<\/ul>\n<h3>概念 2：NFA（难度：高难）<\/h3>\n<p><strong>NFA（Nondeterministic Finite Automaton，非确定有限状态自动机）<\/strong>：状态机，有 ε-转移（不读字符就能跳）。本书做法：<\/p>\n<ol><li>\n把正则表达式<strong>编译<\/strong>成 NFA（用栈处理括号和闭包）；\n<\/li><li>\n<strong>模拟<\/strong> NFA 读文本：维护&quot;当前所有可能状态集合&quot;，逐字符推进；\n<\/li><li>\n若读完文本时能到达接受状态 → 匹配成功。\n<\/ol>\n<p><strong>时间<\/strong>：~3NM（N 文本长、M 正则长度）。<\/p>\n<h3>概念 3：NFA vs DFA（难度：高难）<\/h3>\n<ul><li>\n<strong>DFA<\/strong>（确定）：每状态每字符唯一转移——就是 KMP 用的那种；\n<\/li><li>\n<strong>NFA<\/strong>：允许 ε 转移和多分支，模拟时维护状态集。\n<p>本书用 NFA 是因为它能直接从正则表达式构造，比 DFA 灵活。<\/p>\n<\/ul>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n    RE[&quot;正则表达式&quot;] --&gt; C[&quot;编译(栈处理括号/闭包)&quot;]\n    C --&gt; NFA[&quot;NFA 自动机&quot;]\n    NFA --&gt; SIM[&quot;逐字符模拟: 维护状态集&quot;]\n    SIM --&gt; R{&quot;到达接受状态?&quot;}\n    R -- 是 --&gt; OK[&quot;匹配成功&quot;]\n    R -- 否 --&gt; NO[&quot;不匹配&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：正则 → 编译成自动机 → 模拟运行。这就是 grep/正则引擎的骨架。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：正则表达式像&quot;乐谱&quot;，NFA 是&quot;演奏它的机器&quot;——把乐谱编译成可执行的演奏过程。<em>失效边界<\/em>：NFA 模拟维护状态集，正则极复杂时状态爆炸，工程引擎会做优化。\n<\/li><li>\n<strong>实例<\/strong>：正则 <code>A*B<\/code> 编译成 NFA：A 可自循环，遇到 B 进接受态。文本 &quot;AAAB&quot; 模拟通过。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为<\/strong>正则表达式就是通配符——实际上它是有形式语法的语言（连接/或/闭包）。\n<\/li><li>\n<strong>别以为<\/strong> NFA 和 DFA 能力不同——实际上正则表达能力等价，只是 NFA 构造更直接。\n<\/li><li>\n<strong>别以为<\/strong> NFA 模拟很快——实际上 ~3NM，正则长时状态集膨胀。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n正则表达式的三种基本运算？（答案：连接、或(|)、闭包(*)；解析。）\n<\/li><li>\nNFA 模拟维护什么？（答案：当前所有可能状态的集合；解析。）\n<\/li><li>\nNFA 模拟匹配的时间约为？（答案：~3NM；解析：N 文本长、M 正则长。）\n<\/li><li>\n本书从正则表达式构造什么来做匹配？（答案：NFA 自动机；解析。）\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n正则三运算：连接、或、闭包。\n<\/li><li>\n正则 → 编译成 NFA → 模拟匹配。\n<\/li><li>\nNFA ~3NM。\n<\/ul>", "ch05e": "<h1>第 5 章（5.5）：数据压缩——游程编码与霍夫曼压缩<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：2.5 小时 | <strong>前置<\/strong>：ch03d（散列）、ch05b\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本节，你能：<\/p>\n<ol><li>\n说清数据压缩的&quot;游戏规则&quot;：压缩率、无损/有损；\n<\/li><li>\n理解<strong>游程编码<\/strong>：连续重复值计数；\n<\/li><li>\n写出<strong>霍夫曼压缩<\/strong>：频率高的字符用短编码（前缀编码）。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>压缩 = 给常见字符短编码、少见字符长编码；霍夫曼用贪心树实现最优前缀编码。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：游戏规则（难度：基础）<\/h3>\n<ul><li>\n<strong>压缩率<\/strong>：压缩后大小 / 原大小；\n<\/li><li>\n<strong>无损压缩<\/strong>：能完整还原（本书主题）；<strong>有损<\/strong>：允许失真（图片/视频）。\n<\/ul>\n<h3>概念 2：游程编码（run-length encoding，难度：基础）<\/h3>\n<p><strong>游程编码<\/strong>：连续重复的值用&quot;值+重复次数&quot;表示。例：<code>AAAAA<\/code> → <code>5A<\/code>。适合重复多的数据（如基因组、单色图像）。<\/p>\n<h3>概念 3：霍夫曼压缩（Huffman，难度：高难）<\/h3>\n<p><strong>霍夫曼编码<\/strong>：统计字符频率，频率高的字符分配短二进制码。要求<strong>前缀编码<\/strong>（任一编码不是另一编码的前缀），才能无歧义解码。 构造（贪心）：<\/p>\n<ol><li>\n每个字符做成叶节点，权=频率；\n<\/li><li>\n每次取权最小的两个合并成新树，权=两者之和；\n<\/li><li>\n重复到只剩一棵树；\n<\/li><li>\n左 0 右 1，从根到叶的路径即该字符编码。\n<p>频率越高的字符离根越近 → 编码越短。<\/p>\n<\/ol>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[&quot;统计字符频率&quot;] --&gt; B[&quot;每个字符一叶, 权=频率&quot;]\n    B --&gt; C[&quot;取权最小两叶合并&quot;]\n    C --&gt; D[&quot;新树权=两权之和&quot;]\n    D --&gt; C\n    C --&gt; E[&quot;剩一棵树&quot;]\n    E --&gt; F[&quot;左0右1, 路径=编码&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：霍夫曼 = 反复合并最小权节点。高频字符自然靠近根、编码短。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：摩尔斯电码——常见字母 E 用最短的 &quot;.&quot;，少见字母用长码。霍夫曼就是按实际文本频率自动定这套长短码。<em>失效边界<\/em>：霍夫曼要存编码表（树），极短文本可能压缩后反而变大。\n<\/li><li>\n<strong>实例<\/strong>：文本 &quot;aab&quot;，频率 a=2、b=1。合并 a、b 成树，a 编码 0、b 编码 1（或反之），压缩为 &quot;001&quot;。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为<\/strong>霍夫曼是无损压缩的唯一方法——实际上还有 LZ 系列（gzip），霍夫曼是经典入门。\n<\/li><li>\n<strong>别以为<\/strong>霍夫曼编码任意——实际上它是<strong>最优前缀编码<\/strong>（贪心证明）。\n<\/li><li>\n<strong>别以为<\/strong>压缩总能变小——实际上随机数据不可压缩，霍夫曼对它可能反而膨胀。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n游程编码把 &quot;AAAAA&quot; 编成什么？（答案：5A；解析。）\n<\/li><li>\n霍夫曼编码为什么要前缀编码？（答案：否则解码时一个码可能是另一个码的前缀，产生歧义；解析。）\n<\/li><li>\n霍夫曼树合并时每次取哪两个节点？（答案：权最小的两个；解析：贪心。）\n<\/li><li>\n频率高的字符在霍夫曼树中离根更近还是更远？（答案：更近，编码更短；解析。）\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n游程编码：重复值计数。\n<\/li><li>\n霍夫曼：高频短码，贪心建树，前缀编码。\n<\/li><li>\n随机数据不可压缩。\n<\/ul>", "ch06": "<h1>第 6 章：背景——事件模拟、B-树、网络流与 NP 完全性<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：2 小时 | <strong>前置<\/strong>：第 1~5 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说出优先队列的一个大应用：<strong>事件驱动模拟<\/strong>；\n<\/li><li>\n理解 <strong>B-树<\/strong>：为磁盘/外部存储设计的平衡树；\n<\/li><li>\n知道<strong>最大流-最小割定理<\/strong>与 <strong>NP 完全性<\/strong>的大致含义（入门地图，不深究）。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>本章是&quot;拓展视野&quot;：把前面的工具用到事件模拟、磁盘索引、网络流，并告诉你哪些问题（NP 完全）可能根本没有高效算法。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：事件驱动模拟（难度：进阶）<\/h3>\n<p>用<strong>优先队列<\/strong>按&quot;事件发生时间&quot;排序。每次取出最近事件，处理它，可能产生新事件再入队。例：粒子碰撞模拟——碰撞事件按时间排队。这是优先队列的经典工业应用。<\/p>\n<h3>概念 2：B-树（B-tree，难度：高难）<\/h3>\n<p><strong>B-树<\/strong>：为<strong>磁盘/外部存储<\/strong>设计的平衡多路搜索树。每个节点存很多键（一页），树很矮——因为磁盘读一页很贵，要尽量减少读盘次数。数据库索引的核心结构。<\/p>\n<h3>概念 3：最大流-最小割（难度：高难）<\/h3>\n<p><strong>最大流问题<\/strong>：网络中从源到汇最多能送多少&quot;流量&quot;。<strong>最大流-最小割定理<\/strong>：最大流的值 = 最小割的容量。应用：配对问题、带宽分配。<\/p>\n<h3>概念 4：NP 完全性（难度：高难）<\/h3>\n<p><strong>P<\/strong>：多项式时间可解；<strong>NP<\/strong>：多项式时间可验证答案；<strong>NP 完全<\/strong>：NP 中最难的一类（如旅行商、可满足性）。若找到一个 NP 完全问题的多项式算法，则所有 NP 问题都多项式可解（P=NP）。目前普遍猜测 P≠NP——即这些问题<strong>可能没有高效算法<\/strong>，工程上只能用近似或指数算法。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[&quot;前面学的工具&quot;] --&gt; B[&quot;优先队列 → 事件模拟&quot;]\n    A --&gt; C[&quot;平衡树 → B-树(磁盘)&quot;]\n    A --&gt; D[&quot;图算法 → 最大流/最小割&quot;]\n    A --&gt; E[&quot;算法边界 → NP完全(可能无高效解)&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：本章把工具推向应用，并标出&quot;哪些问题算不动&quot;的边界。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比（B-树）<\/strong>：查字典不逐页翻，而是按&quot;章节&quot;大块定位——B-树就是为&quot;大块读取便宜、小块读取贵&quot;的磁盘设计的。<em>失效边界<\/em>：内存中 BST/红黑树比 B-树更快，B-树只在外部存储占优。\n<\/li><li>\n<strong>类比（NP 完全）<\/strong>：有些问题像&quot;在所有围棋棋局里找最优&quot;——组合爆炸，可能永远算不完。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为<\/strong> NP 完全 = &quot;没法解&quot;——实际上它能解，只是<strong>可能没有多项式高效算法<\/strong>，小规模仍可算。\n<\/li><li>\n<strong>别以为<\/strong> B-树是红黑树的改进版——实际上它是为<strong>磁盘页<\/strong>设计的不同结构，不是内存树的升级。\n<\/li><li>\n<strong>别以为<\/strong>最大流就是最短路径——实际上它求&quot;网络吞吐上限&quot;，目标完全不同。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n事件驱动模拟用什么数据结构？（答案：优先队列（按事件时间）；解析。）\n<\/li><li>\nB-树为什么设计得很矮？（答案：磁盘读一页贵，减少读盘次数；解析。）\n<\/li><li>\n最大流-最小割定理说什么？（答案：最大流值 = 最小割容量；解析。）\n<\/li><li>\nNP 完全问题的含义？（答案：NP 中最难的一类，可能无多项式高效算法；解析。）\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n优先队列 → 事件模拟。\n<\/li><li>\nB-树 → 磁盘索引。\n<\/li><li>\n最大流=最小割；NP 完全 = 可能算不动。\n<\/ul>", "c01": "<h1>复杂度记号（O / ~ / 增长数量级）<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 1.4 节，贯穿全书\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>用&quot;忽略常数和低阶项的函数类别&quot;描述算法随输入规模 N 变大的快慢趋势，而不是具体毫秒数。<\/p>\n<h2>为什么重要<\/h2>\n<p>它是全书比较算法的<strong>通用语言<\/strong>。没有它，&quot;快排和归并谁快&quot;只能靠跑程序碰运气；有了它，一眼看出 N=百万时谁能跑完。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n    A[&quot;1 常数&quot;] --&gt; B[&quot;log N 对数&quot;]\n    B --&gt; C[&quot;N 线性&quot;]\n    C --&gt; D[&quot;N log N&quot;]\n    D --&gt; E[&quot;N² 平方&quot;]\n    E --&gt; F[&quot;N³ 立方&quot;]\n    F --&gt; G[&quot;2^N 指数&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：越靠左越&quot;扛得住大 N&quot;。从 N 到 N² 是质变——10 倍输入从 10 倍慢变 100 倍慢。<\/p>\n<h2>详解<\/h2>\n<ul><li>\n<strong>O(f(N))<\/strong>：上界——运行时间不超过 f(N) 的常数倍。\n<\/li><li>\n<strong>~f(N)<\/strong>：渐近等于——忽略低阶项，如 ~N²/2 与 ~N² 同级。\n<\/li><li>\n原书七兄弟：1 / log N / N / N log N / N² / N³ / 2^N。\n<\/li><li>\n<strong>类比<\/strong>：判断烧水时间不看火苗大小（硬件常数），看&quot;米量翻倍要多久&quot;（倍率）。<em>失效边界<\/em>：N 很小时常数项主导，复杂度比较失灵。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 O(N²) 一定比 O(N log N) 慢——小 N 时带大常数的后者可能更慢。\n<\/li><li>\n别以为大 O 是精确时间——它只描述增长趋势。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>1.4<\/td><td>ThreeSum 三重循环<\/td><td>~N³/6<\/td><\/tr><tr><td>1.1<\/td><td>二分查找<\/td><td>O(log N)<\/td><\/tr><tr><td>2.2<\/td><td>归并排序<\/td><td>O(N log N)<\/td><\/tr><tr><td>3.3<\/td><td>红黑树<\/td><td>高 ≤ 2 lg N<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：无；后续：并查集、排序、BST、散列的全部成本分析。\n<\/ul>", "c02": "<h1>并查集（Union-Find）<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 1.5 节、第 4.3 节（Kruskal）\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>维护&quot;一群点的连通关系&quot;的数据结构，支持 union（连通两点）与 find（查两点是否同组），经优化后近乎常数。<\/p>\n<h2>为什么重要<\/h2>\n<p>它是 Kruskal 最小生成树、连通性问题、图像处理分区的底层工具。用极小的代价回答&quot;这两块是不是已经连起来了&quot;。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n    A[&quot;union(p,q)&quot;] --&gt; B[&quot;find(p) 爬根&quot;]\n    B --&gt; C[&quot;find(q) 爬根&quot;]\n    C --&gt; D{&quot;根同?&quot;}\n    D -- 否 --&gt; E[&quot;小树挂大树根(加权)&quot;]\n    E --&gt; F[&quot;路过压平(路径压缩)&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：两个优化叠加——树天然矮 + 被走过的路压短。<\/p>\n<h2>详解<\/h2>\n<p>演化链：quick-find（union O(N)）→ quick-union（可能退化链）→ <strong>加权 quick-union<\/strong>（树高 ≤ lg N）→ <strong>+路径压缩<\/strong>（近似常数）。<\/p>\n<ul><li>\n<strong>类比<\/strong>：氏族合并——小族并入大族，年轻人每次报到就把户口本直接写族长名。<em>失效边界<\/em>：不存边顺序，只维护连通性。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为它存图——它故意不存边，只存连通分组，所以轻量。\n<\/li><li>\n别以为加权就是&quot;按数量&quot;——是按<strong>树大小<\/strong>挂小到大。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>1.5<\/td><td>动态连通性案例<\/td><td>加权 QU 深度 ≤ lg N<\/td><\/tr><tr><td>4.3<\/td><td>Kruskal 判断两端连通<\/td><td>并查集近常数<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：栈/队列；后续：最小生成树 Kruskal。\n<\/ul>", "c03": "<h1>栈、队列与递归<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 1.3 节，贯穿第 2、4 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>栈（后进先出）与队列（先进先出）是两种最基础的存取规则；递归是方法自我调用，靠&quot;调用栈&quot;实现。<\/p>\n<h2>为什么重要<\/h2>\n<p>它们是树遍历（DFS 用栈）、BFS（用队列）、表达式求值、归并/快排递归的底层积木。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n    subgraph 栈 LIFO\n        S[&quot;顶→底: c,b,a&quot;]\n    end\n    subgraph 队列 FIFO\n        Q[&quot;头→尾: a,b,c&quot;]\n    end<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：栈从顶取（c 先出），队列从头取（a 先出）。<\/p>\n<h2>详解<\/h2>\n<ul><li>\n栈 = 弹夹/浏览器后退；队列 = 排队打饭。\n<\/li><li>\n递归两铁律：有基准条件；子问题不相交。\n<\/li><li>\n<strong>类比<\/strong>：调用栈像摞盘子——调用新函数压盘，返回时撤盘。<em>失效边界<\/em>：递归太深会栈溢出。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为栈和队列&quot;都能随机访问&quot;——它们只能端点操作。\n<\/li><li>\n别以为递归比循环高级——它只是循环的另一种表达，不当会爆栈。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>1.3<\/td><td>数组/链表实现栈队列<\/td><td>动态数组均摊常数<\/td><\/tr><tr><td>4.1<\/td><td>DFS 用栈、BFS 用队列<\/td><td>决定遍历顺序<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：无；后续：图遍历、递归排序。\n<\/ul>", "c04": "<h1>排序稳定性<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 2 章（尤其 2.2、2.5）\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>若两个相等键在排序后保持它们排序前的相对顺序，则该排序算法是<strong>稳定的<\/strong>。<\/p>\n<h2>为什么重要<\/h2>\n<p>多级排序（先按姓名排、再按成绩排）时，稳定性保证第二级排序不破坏第一级已排好的同组顺序。Java 对引用类型用归并排序，正是因为它稳定。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n    A[&quot;输入: (b,1)(a,1)(a,2)&quot;] --&gt; B{&quot;稳定排序按首字母&quot;}\n    B --&gt; C[&quot;(a,1)(a,2)(b,1) 保持 a1 在 a2 前&quot;]\n    B --&gt; D[&quot;不稳定: 可能 (a,2)(a,1)(b,1)&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：两个 a 相等，稳定算法保住它们原来的先后。<\/p>\n<h2>详解<\/h2>\n<ul><li>\n<strong>稳定<\/strong>：插入排序、归并排序。\n<\/li><li>\n<strong>不稳定<\/strong>：选择排序、希尔排序、快速排序、堆排序（交换会跨过相等元素）。\n<\/li><li>\n<strong>类比<\/strong>：按学号排好队，再按身高重排——稳定算法让同身高的人仍按学号站。<em>失效边界<\/em>：若你不在乎相等键的先后，稳定性无所谓。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;快排很稳所以Java用它&quot;——实际上 Java 对引用类型用归并（稳），对原始类型才用三向快排。\n<\/li><li>\n别以为稳定性无关紧要——多级排序时它是正确性关键。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>2.2<\/td><td>归并排序<\/td><td>稳定<\/td><\/tr><tr><td>2.5.2<\/td><td>选型表<\/td><td>引用排序要稳定<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：排序；后续：符号表多级键。\n<\/ul>", "c05": "<h1>二叉查找树与平衡树<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 3.2、3.3 节\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>BST（左小右大）让查找像二分、插入只需挂新叶；但有序插入会让它退化成链，于是用红黑树（平衡树）强制它不歪。<\/p>\n<h2>为什么重要<\/h2>\n<p>这是&quot;动态有序集合&quot;的标准解法——Java 的 TreeMap/TreeSet、Linux 内核都用红黑树。理解它就理解了&quot;为什么查找既能快又能插&quot;。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[&quot;BST: 左小右大&quot;] --&gt; B{&quot;随机键&quot;}\n    B --&gt; C[&quot;高 ~1.39 lg N&quot;]\n    B --&gt; D{&quot;有序插入&quot;}\n    D --&gt; E[&quot;退化成链 O(N)&quot;]\n    E --&gt; F[&quot;红黑树: 红链接绑 3-节点&quot;]\n    F --&gt; G[&quot;高 ≤ 2 lg N, 对数级&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：BST 的弱点（长歪）正是平衡树要治的病。<\/p>\n<h2>详解<\/h2>\n<ul><li>\nBST：查找/插入 = 走根到叶一条路，成本=树高。\n<\/li><li>\n红黑树 = 2-3 树的二叉编码，靠左旋/右旋/颜色反转保持平衡。\n<\/li><li>\n<strong>类比<\/strong>：家谱树若按身高顺序加人会歪成一队；红黑树像随时扶正，保证树矮胖。<em>失效边界<\/em>：红黑不是完美平衡，只是足够平衡。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 BST 查找保证 log N——只有随机键平均成立，最坏 O(N)。\n<\/li><li>\n别以为红链接是数据——它只是标记，不改键顺序。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>3.2<\/td><td>BST<\/td><td>随机键 ~1.39 lg N<\/td><\/tr><tr><td>3.3<\/td><td>红黑树<\/td><td>高 ≤ 2 lg N<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：递归、有序数组；后续：符号表有序操作。\n<\/ul>", "c06": "<h1>散列（哈希）<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 3.4 节\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>把 key 通过散列函数直接算成数组下标，理想查找/插入常数时间；代价是失去键的有序性。<\/p>\n<h2>为什么重要<\/h2>\n<p>它是最快的符号表实现（HashMap），数据库、缓存、去重全靠它。理解它就理解了&quot;为什么查字典有时 O(1)&quot;。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    K[&quot;key&quot;] --&gt; H[&quot;hash(key)%M&quot;]\n    H --&gt; S[&quot;槽 s&quot;]\n    S --&gt; C{&quot;被占?&quot;}\n    C -- 否 --&gt; D[&quot;存入&quot;]\n    C -- 是 --&gt; E[&quot;拉链法: 挂链尾&quot;]\n    C --&gt; F[&quot;线性探测: 顺移找空&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：散列是入口，碰撞两策决定&quot;撞了往哪走&quot;。<\/p>\n<h2>详解<\/h2>\n<ul><li>\n散列函数：快 + 均匀。\n<\/li><li>\n装载因子 α=N/M ≤ 1/2，超了就扩容重散列。\n<\/li><li>\n<strong>类比<\/strong>：旅馆按姓氏首字母分房；同姓多了加床（拉链）或顺延空房（线性探测）。<em>失效边界<\/em>：α→1 时找房要走长走廊。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为散列表总 O(1)——只有低装载、均匀散列才成立。\n<\/li><li>\n别以为它支持 min/rank——它打乱键序，无有序操作。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>3.4.2<\/td><td>拉链法<\/td><td>链长 N/M<\/td><\/tr><tr><td>3.4.3<\/td><td>线性探测<\/td><td>α ≤ 1/2<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：符号表；后续：稀疏向量、缓存。\n<\/ul>", "c07": "<h1>图遍历（DFS 与 BFS）<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 4.1、4.2 节\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>DFS（深度优先，栈）一条路扎到底；BFS（广度优先，队列）一圈圈扩散——BFS 首次到达某点的路就是最短路径。<\/p>\n<h2>为什么重要<\/h2>\n<p>它们是图算法的总开关：连通性、路径、环、拓扑排序、强连通全建立在这两种遍历之上。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    S[&quot;起点&quot;] --&gt; DFS[&quot;DFS: 递归扎到底, 回头换岔&quot;]\n    S --&gt; BFS[&quot;BFS: 队列按层扩散&quot;]\n    BFS --&gt; SP[&quot;首次到达 = 最短路径&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：同一张图，DFS 走法像迷宫，BFS 走法像水波纹。<\/p>\n<h2>详解<\/h2>\n<ul><li>\n邻接表存图，空间 O(V+E)。\n<\/li><li>\nBFS 求最短；DFS 求路径/环/拓扑序。\n<\/li><li>\n<strong>类比<\/strong>：DFS=走迷宫死胡同才回头；BFS=池塘波纹外扩。<em>失效边界<\/em>：BFS 要存整层队列，大图内存大。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 DFS 能求最短——只有 BFS 保证最短。\n<\/li><li>\n别以为两者只是写法差——一个栈一个队列，顺序本质不同。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>4.1<\/td><td>无向图<\/td><td>BFS 最短路径<\/td><\/tr><tr><td>4.2<\/td><td>有向图<\/td><td>DFS 判环/拓扑<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：栈/队列；后续：MST、最短路径。\n<\/ul>", "c08": "<h1>最小生成树（MST）<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 4.3 节\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>在连通加权无向图中选 V-1 条边连起所有顶点，使总权重最小。<\/p>\n<h2>为什么重要<\/h2>\n<p>它是&quot;最低成本连网&quot;问题——修路、铺光缆、电路布线的数学模型。切分定理是它的理论心脏。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[&quot;切分 S ｜ T&quot;] --&gt; B[&quot;横切边中最小者&quot;]\n    B --&gt; C[&quot;必入 MST(切分定理)&quot;]\n    C --&gt; D[&quot;端点拉入 S&quot;]\n    D --&gt; A<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：Prim 的循环——每轮靠切分定理安全加一条边。<\/p>\n<h2>详解<\/h2>\n<ul><li>\n<strong>切分定理<\/strong>：最小横切边必入 MST。\n<\/li><li>\n<strong>Prim<\/strong>：从点长出去，优先队列，E log V。\n<\/li><li>\n<strong>Kruskal<\/strong>：边按权排序，并查集判连通，E log E。\n<\/li><li>\n<strong>类比<\/strong>：从首都修最便宜地铁线往外扩。<em>失效边界<\/em>：图必须连通才存在 MST。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 MST 是最短路径树——它最小化总边权，不是两点距离。\n<\/li><li>\n别以为 MST 唯一——权并列时可能多解，但总权最小。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>4.3.4<\/td><td>Prim<\/td><td>E log V<\/td><\/tr><tr><td>4.3.6<\/td><td>Kruskal<\/td><td>并查集<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：图遍历、优先队列、并查集；后续：最短路径。\n<\/ul>", "c09": "<h1>最短路径<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 4.4 节\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>从起点到图中各顶点的&quot;最便宜路径&quot;集合（最短路径树 SPT）；Dijkstra 在非负权下用 E log V 求解。<\/p>\n<h2>为什么重要<\/h2>\n<p>它是导航、网络路由、任务调度的核心。松弛（relaxation）是所有最短路径算法的统一动作。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    S[&quot;起点 distTo=0&quot;] --&gt; P[&quot;选未确定中 distTo 最小 u&quot;]\n    P --&gt; R[&quot;松弛 u 出边, 更新 distTo[w]&quot;]\n    R --&gt; P\n    P --&gt; D[&quot;全确定 → SPT&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：Dijkstra = 反复&quot;锁定最近点 + 松弛边&quot;。<\/p>\n<h2>详解<\/h2>\n<ul><li>\n<strong>松弛<\/strong>：经 v 到 w 更短就更新 distTo[w]。\n<\/li><li>\n<strong>Dijkstra<\/strong>：边权非负，优先队列，E log V。\n<\/li><li>\n<strong>DAG<\/strong>：拓扑序松弛，线性求最短/最长。\n<\/li><li>\n<strong>类比<\/strong>：导航先锁定当前最近路口再往外探。<em>失效边界<\/em>：有负权边时 Dijkstra 会错，得用 Bellman-Ford。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 Dijkstra 适用任何图——要求边权非负。\n<\/li><li>\n别以为它用普通队列——用的是优先队列。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>4.4.4<\/td><td>Dijkstra<\/td><td>E log V<\/td><\/tr><tr><td>4.4.5<\/td><td>DAG 最短<\/td><td>线性<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：图遍历、优先队列；后续：网络流。\n<\/ul>", "c10": "<h1>字符串匹配（子串查找）<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 5.3、5.4 节\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>在长文本中找短模式串首次出现的位置；KMP 靠预计算避免失配回退，把 O(NM) 降到 O(N+M)。<\/p>\n<h2>为什么重要<\/h2>\n<p>它是文本编辑器查找、grep、生物信息序列比对的基础。理解&quot;失配后不回退&quot;是串算法的精髓。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[&quot;文本 i 起比 pat&quot;] --&gt; B{&quot;匹配?&quot;}\n    B -- 中 --&gt; C[&quot;返回 i&quot;]\n    B -- 失配 --&gt; D[&quot;暴力: i++ 回退重比&quot;]\n    B --&gt; E[&quot;KMP: 不回退, DFA 决定 j 位置&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：差别全在&quot;失配后&quot;——暴力退回，KMP 不退回。<\/p>\n<h2>详解<\/h2>\n<ul><li>\n暴力 O(NM)；KMP O(N+M)。\n<\/li><li>\nBoyer-Moore 从右端比、坏字符跳段；Rabin-Karp 用滚动散列指纹。\n<\/li><li>\n<strong>类比<\/strong>：对答案错一个字，暴力从头对；KMP 记住&quot;前三字已对&quot;，从中间继续。<em>失效边界<\/em>：极短模式串暴力就够。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 KMP 最快——它是最坏保证好，实践 Boyer-Moore 常更快。\n<\/li><li>\n别以为 Rabin-Karp 逐字比——先比散列指纹。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>5.3.2<\/td><td>暴力<\/td><td>O(NM)<\/td><\/tr><tr><td>5.3.3<\/td><td>KMP<\/td><td>O(N+M)<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：二分查找；后续：正则 NFA、数据压缩。\n<\/ul>", "__path__": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：基础编程模型与二分查找<\/strong><br>阅读：<a href=\"#/book/fourth/chapter/ch01a\">第1章(1.1) 基础编程模型与二分查找<\/a><br>检查点：通过 ch01a 自测<\/li><li class='path-step' id='path-02'><strong>步骤 02：数据抽象 ADT<\/strong><br>阅读：<a href=\"#/book/fourth/chapter/ch01b\">第1章(1.2) 数据抽象<\/a><br>检查点：通过 ch01b 自测<\/li><li class='path-step' id='path-03'><strong>步骤 03：背包队列栈与链表<\/strong><br>阅读：<a href=\"#/book/fourth/chapter/ch01c\">第1章(1.3) 背包队列栈与链表<\/a><br>检查点：通过 ch01c 自测<\/li><li class='path-step' id='path-04'><strong>步骤 04：算法分析（O 记号）<\/strong><br>阅读：<a href=\"#/book/fourth/chapter/ch01d\">第1章(1.4) 算法分析<\/a><br>检查点：通过 ch01d 自测<\/li><li class='path-step' id='path-05'><strong>步骤 05：并查集<\/strong><br>阅读：<a href=\"#/book/fourth/chapter/ch01e\">第1章(1.5) 并查集<\/a><br>检查点：通过 ch01e 自测<\/li><li class='path-step' id='path-06'><strong>步骤 06：初级排序<\/strong><br>阅读：<a href=\"#/book/fourth/chapter/ch02a\">第2章(2.1) 初级排序<\/a><br>检查点：通过 ch02a 自测<\/li><li class='path-step' id='path-07'><strong>步骤 07：归并排序<\/strong><br>阅读：<a href=\"#/book/fourth/chapter/ch02b\">第2章(2.2) 归并排序<\/a><br>检查点：通过 ch02b 自测<\/li><li class='path-step' id='path-08'><strong>步骤 08：快速排序<\/strong><br>阅读：<a href=\"#/book/fourth/chapter/ch02c\">第2章(2.3) 快速排序<\/a><br>检查点：通过 ch02c 自测<\/li><li class='path-step' id='path-09'><strong>步骤 09：优先队列与堆排序<\/strong><br>阅读：<a href=\"#/book/fourth/chapter/ch02d\">第2章(2.4) 优先队列与堆排序<\/a><br>检查点：通过 ch02d 自测<\/li><li class='path-step' id='path-10'><strong>步骤 10：排序应用与选型<\/strong><br>阅读： quiz-q'><b>Q1.<\/b> 霍夫曼编码中频率高的字符编码？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch05e-q19' value='0'> 更长<\/label><label class='quiz-opt'><input type='radio' name='ch05e-q19' value='1'> 更短<\/label><label class='quiz-opt'><input type='radio' name='ch05e-q19' value='2'> 相同<\/label><label class='quiz-opt'><input type='radio' name='ch05e-q19' value='3'> 随机<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch02d__": "<h1>测验：第2章(2.4) 优先队列与堆排序<\/h1><div class='quiz-item' data-qid='ch02d-q22' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 要在内存极紧的实时系统中排 10^7 个元素且要 O(N log N) 最坏保证，选？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch02d-q22' value='0'> 快速排序<\/label><label class='quiz-opt'><input type='radio' name='ch02d-q22' value='1'> 堆排序<\/label><label class='quiz-opt'><input type='radio' name='ch02d-q22' value='2'> 归并排序<\/label><label class='quiz-opt'><input type='radio' name='ch02d-q22' value='3'> 选择排序<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__cards__": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "__glossary__": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='二分查找'>二分查找 — 在有序数组里每次和中间元素比、排除一半的查找法 <span class=glossary-ref>（第1章(1.1) 基础编程模型与二分查找）<\/span><\/li><li data-term='递归'>递归 — 方法调用自身解决更小规模同类问题 <span class=glossary-ref>（第1章(1.1) 基础编程模型与二分查找）<\/span><\/li><li data-term='抽象数据类型 adt'>抽象数据类型 ADT — 数据+一组操作，只露 API 藏内部 <span class=glossary-ref>（第1章(1.2) 数据抽象）<\/span><\/li><li data-term='栈'>栈 — 后进先出 LIFO 的存取结构 <span class=glossary-ref>（第1章(1.3) 背包队列栈与链表）<\/span><\/li><li data-term='队列'>队列 — 先进先出 FIFO 的存取结构 <span class=glossary-ref>（第1章(1.3) 背包队列栈与链表）<\/span><\/li><li data-term='链表'>链表 — 节点串成的序列，每节点含数据+下一节点指针 <span class=glossary-ref>（第1章(1.3) 背包队列栈与链表）<\/span><\/li><li data-term='均摊成本'>均摊成本 — 把偶尔昂贵操作平摊到每次操作上 <span class=glossary-ref>（第1章(1.3) 背包队列栈与链表）<\/span><\/li><li data-term='增长数量级'>增长数量级 — 忽略常数和低阶项后函数的类别 <span class=glossary-ref>（第1章(1.4) 算法分析）<\/span><\/li><li data-term='大 o'>大 O — 运行时间的上界（常数倍内） <span class=glossary-ref>（第1章(1.4) 算法分析）<\/span><\/li><li data-term='倍率实验'>倍率实验 — 输入翻倍看时间比值定阶数 <span class=glossary-ref>（第1章(1.4) 算法分析）<\/span><\/li><li data-term='并查集'>并查集 — 维护连通分组、支持 union/find 的结构 <span class=glossary-ref>（第1章(1.5) 并查集）<\/span><\/li><li data-term='路径压缩'>路径压缩 — find 时把路过节点直接指向根 <span class=glossary-ref>（第1章(1.5) 并查集）<\/span><\/li><li data-term='倒置'>倒置 — 数组中一对顺序反了的元素 <span class=glossary-ref>（第2章(2.1) 初级排序）<\/span><\/li><li data-term='归并'>归并 — 两个有序半场合并成一个有序数组 <span class=glossary-ref>（第2章(2.2) 归并排序）<\/span><\/li><li data-term='切分'>切分 — 选基准小左大右、基准归位 <span class=glossary-ref>（第2章(2.3) 快速排序）<\/span><\/li><li data-term='优先队列'>优先队列 — 按最值出队的队列 <span class=glossary-ref>（第2章(2.4) 优先队列与堆排序）<\/span><\/li><li data-term='堆'>堆 — 父≥子的完全二叉树 <span class=glossary-ref>（第2章(2.4) 优先队列与堆排序）<\/span><\/li><li data-term='符号表'>符号表 — 键值对字典，核心 put/get <span class=glossary-ref>（第3章(3.1) 符号表与顺序查找）<\/span><\/li><li data-term='二叉查找树'>二叉查找树 — 左子树键&lt;根&lt;右子树键的二叉树 <span class=glossary-ref>（第3章(3.2) 二叉查找树）<\/span><\/li><li data-term='红黑树'>红黑树 — 2-3 树的二叉编码，红链接绑 3-节点 <span class=glossary-ref>（第3章(3.3) 平衡查找树与红黑树）<\/span><\/li><li data-term='散列函数'>散列函数 — 把 key 压成数组下标的函数 <span class=glossary-ref>（第3章(3.4) 散列表）<\/span><\/li><li data-term='装载因子'>装载因子 — α=N/M，键数/槽数 <span class=glossary-ref>（第3章(3.4) 散列表）<\/span><\/li><li data-term='dag'>DAG — 有向无环图 <span class=glossary-ref>（第4章(4.2) 有向图）<\/span><\/li><li data-term='拓扑排序'>拓扑排序 — 把 DAG 排成合法依赖序 <span class=glossary-ref>（第4章(4.2) 有向图）<\/span><\/li><li data-term='最小生成树'>最小生成树 — 总权重最小的生成树 <span class=glossary-ref>（第4章(4.3) 最小生成树）<\/span><\/li><li data-term='切分定理'>切分定理 — 最小横切边必入 MST <span class=glossary-ref>（第4章(4.3) 最小生成树）<\/span><\/li><li data-term='dijkstra'>Dijkstra — 非负权下求最短路的算法 <span class=glossary-ref>（第4章(4.4) 最短路径）<\/span><\/li><li data-term='trie'>Trie — 边=字符、路径=键的查找树 <span class=glossary-ref>（第5章(5.2) 单词查找树）<\/span><\/li><li data-term='kmp'>KMP — 失配不回退的子串查找 <span class=glossary-ref>（第5章(5.3) 子字符串查找）<\/span><\/li><li data-term='霍夫曼编码'>霍夫曼编码 — 高频字符短码的贪心前缀编码 <span class=glossary-ref>（第5章(5.5) 数据压缩）<\/span><\/li><\/ul>", "__patterns__": "<h1>模式与框架库<\/h1>\n<h2>框架：实现 → 分析 → 比较 → 改进<\/h2>\n<p>本书作者的主循环。学任何算法都走这四步：先写 Java 实现，再用增长数量级分析成本，再和同类算法比较，再换数据结构改进。<strong>何时用<\/strong>：学新算法时照此流水线，不要背结论。<\/p>\n<h2>框架：分治（Divide &amp; Conquer）<\/h2>\n<p>劈成两半 → 递归解决 → 合并。代表：归并排序、快排（切分）。<strong>何时用<\/strong>：问题能天然拆成独立子问题时。<\/p>\n<h2>框架：贪心（Greedy）<\/h2>\n<p>每一步选当前最优，不回头。代表：Prim（选最近横切边）、Kruskal（按边权从小到大）、霍夫曼（合并最小权）。<strong>何时用<\/strong>：局部最优能导出全局最优（需定理保证，如切分定理）。<\/p>\n<h2>框架：松弛（Relaxation）<\/h2>\n<p>反复&quot;发现更短就更新&quot;。代表：Dijkstra、最短路径树。<strong>何时用<\/strong>：求最优路径/距离类问题。<\/p>\n<h2>决策规则：选排序算法<\/h2>\n<pre><code>需要稳定? ──是──&gt; 归并排序\n   │否\n需要最坏 O(N log N) 保证且省内存? ──是──&gt; 堆排序\n   │否\n通用最快? ──&gt; 三向快排\n近乎有序? ──&gt; 插入排序<\/code><\/pre>\n<h2>决策规则：选符号表实现<\/h2>\n<pre><code>需要有序操作(min/floor/rank/范围)? ──是──&gt; 红黑树 TreeMap\n   │否\n只要 put/get 求最快? ──&gt; 散列表 HashMap\n键是稠密整数? ──&gt; 直接数组<\/code><\/pre>\n<h2>决策规则：求图最短路<\/h2>\n<pre><code>边权非负? ──是──&gt; Dijkstra (E log V)\n   │否\n是 DAG? ──是──&gt; 拓扑序松弛 (线性)\n   │否\n含负权? ──&gt; Bellman-Ford<\/code><\/pre>\n<h2>反模式<\/h2>\n<ul><li>\n<strong>反模式：凭&quot;感觉快&quot;选算法<\/strong>——作者反复强调要用倍率实验测成本，不凭直觉。\n<\/li><li>\n<strong>反模式：忽视最坏情况<\/strong>——快排最坏 O(N²)，不随机化就埋雷。\n<\/li><li>\n<strong>反模式：在无序数组上用二分查找<\/strong>——前提已排序，否则全错。\n<\/li><li>\n<strong>反模式：散列表不控制装载因子<\/strong>——α→1 时探测链爆炸，退化成 O(N)。\n<\/li><li>\n<strong>反模式：把 BST 当有序数组用<\/strong>——BST 最坏会退化，动态有序集合用红黑树。\n<\/ul>", "__cheatsheet__": "<h1>速查表<\/h1>\n<h2>增长数量级七兄弟<\/h2>\n<table><thead><tr><th>量级<\/th><th>函数<\/th><th>典型算法<\/th><\/tr><\/thead><tbody><tr><td>常数<\/td><td>1<\/td><td>数组取值<\/td><\/tr><tr><td>对数<\/td><td>log N<\/td><td>二分查找<\/td><\/tr><tr><td>线性<\/td><td>N<\/td><td>遍历数组<\/td><\/tr><tr><td>线性对数<\/td><td>N log N<\/td><td>归并排序<\/td><\/tr><tr><td>平方<\/td><td>N²<\/td><td>选择/插入排序<\/td><\/tr><tr><td>立方<\/td><td>N³<\/td><td>ThreeSum<\/td><\/tr><tr><td>指数<\/td><td>2^N<\/td><td>穷举（第6章）<\/td><\/tr><\/tbody><\/table>\n<h2>排序算法成本总表<\/h2>\n<table><thead><tr><th>算法<\/th><th>平均<\/th><th>最坏<\/th><th>额外空间<\/th><th>稳定<\/th><\/tr><\/thead><tbody><tr><td>选择排序<\/td><td>~N²/2 比较<\/td><td>~N²/2<\/td><td>1<\/td><td>否<\/td><\/tr><tr><td>插入排序<\/td><td>~N²/4<\/td><td>N²<\/td><td>1<\/td><td>是<\/td><\/tr><tr><td>希尔排序<\/td><td>突破平方(经验)<\/td><td>？<\/td><td>1<\/td><td>否<\/td><\/tr><tr><td>归并排序<\/td><td>N lg N<\/td><td>N lg N<\/td><td>N<\/td><td>是<\/td><\/tr><tr><td>快速排序<\/td><td>1.39 N lg N<\/td><td>N²<\/td><td>lg N<\/td><td>否<\/td><\/tr><tr><td>三向快排<\/td><td>N(大量重复键)<\/td><td>N²<\/td><td>lg N<\/td><td>否<\/td><\/tr><tr><td>堆排序<\/td><td>2N lg N<\/td><td>2N lg N<\/td><td>1<\/td><td>否<\/td><\/tr><\/tbody><\/table>\n<h2>查找/树成本<\/h2>\n<table><thead><tr><th>结构<\/th><th>平均查找<\/th><th>最坏<\/th><\/tr><\/thead><tbody><tr><td>无序链表<\/td><td>O(N)<\/td><td>O(N)<\/td><\/tr><tr><td>有序数组二分<\/td><td>O(log N)<\/td><td>O(log N)（插入 O(N)）<\/td><\/tr><tr><td>随机 BST<\/td><td>~1.39 lg N<\/td><td>O(N)<\/td><\/tr><tr><td>红黑树<\/td><td>log N<\/td><td>≤ 2 lg N<\/td><\/tr><tr><td>散列表(拉链)<\/td><td>O(1)<\/td><td>O(N)（碰撞时）<\/td><\/tr><\/tbody><\/table>\n<h2>图算法成本<\/h2>\n<table><thead><tr><th>算法<\/th><th>时间<\/th><th>空间<\/th><\/tr><\/thead><tbody><tr><td>DFS / BFS<\/td><td>O(V+E)<\/td><td>O(V)<\/td><\/tr><tr><td>Prim<\/td><td>E log V<\/td><td>V<\/td><\/tr><tr><td>Kruskal<\/td><td>E log E<\/td><td>E+V<\/td><\/tr><tr><td>Dijkstra<\/td><td>E log V<\/td><td>V<\/td><\/tr><\/tbody><\/table>\n<h2>关键公式<\/h2>\n<ul><li>\n二分查找最多比较：⌊log₂N⌋+1\n<\/li><li>\n归并排序比较：~N lg N\n<\/li><li>\n快排平均比较：~2N ln N ≈ 1.39 N lg N\n<\/li><li>\n加权 quick-union 树高：≤ lg N\n<\/li><li>\n红黑树高度：≤ 2 lg N\n<\/li><li>\n散列表装载因子：α = N/M ≤ 1/2\n<\/ul>\n<h2>Java 系统排序选择（原书）<\/h2>\n<ul><li>\n原始数据类型（int/double…）：三向切分快速排序\n<\/li><li>\n引用类型（String…）：归并排序（要稳定）\n<\/ul>\n<h2>常用步骤<\/h2>\n<ul><li>\n二分查找：lo=0, hi=N-1, 每次 mid=(lo+hi)/2 砍一半\n<\/li><li>\nDijkstra：选未确定 distTo 最小 u → 松弛 u 出边\n<\/li><li>\nKruskal：边按权排序 → 并查集判连通 → 收 V-1 条\n<\/ul>"},"nav":[{"label": "学习路径", "href": "#/path"}, {"label": "章节", "children": [{"label": "第1章(1.1) 基础编程模型与二分查找", "href": "#/chapter/ch01a"}, {"label": "第1章(1.2) 数据抽象", "href": "#/chapter/ch01b"}, {"label": "第1章(1.3) 背包队列栈与链表", "href": "#/chapter/ch01c"}, {"label": "第1章(1.4) 算法分析", "href": "#/chapter/ch01d"}, {"label": "第1章(1.5) 并查集", "href": "#/chapter/ch01e"}, {"label": "第2章(2.1) 初级排序", "href": "#/chapter/ch02a"}, {"label": "第2章(2.2) 归并排序", "href": "#/chapter/ch02b"}, {"label": "第2章(2.3) 快速排序", "href": "#/chapter/ch02c"}, {"label": "第2章(2.4) 优先队列与堆排序", "href": "#/chapter/ch02d"}, {"label": "第2章(2.5) 排序应用与选型", "href": "#/chapter/ch02e"}, {"label": "第3章(3.1) 符号表与顺序查找", "href": "#/chapter/ch03a"}, {"label": "第3章(3.2) 二叉查找树", "href": "#/chapter/ch03b"}, {"label": "第3章(3.3) 平衡查找树与红黑树", "href": "#/chapter/ch03c"}, {"label": "第3章(3.4) 散列表", "href": "#/chapter/ch03d"}, {"label": "第3章(3.5) 符号表应用", "href": "#/chapter/ch03e"}, {"label": "第4章(4.1) 无向图遍历", "href": "#/chapter/ch04a"}, {"label": "第4章(4.2) 有向图", "href": "#/chapter/ch04b"}, {"label": "第4章(4.3) 最小生成树", "href": "#/chapter/ch04c"}, {"label": "第4章(4.4) 最短路径", "href": "#/chapter/ch04d"}, {"label": "第5章(5.1) 字符串排序", "href": "#/chapter/ch05a"}, {"label": " 计算过程；当计算机不是无限快、存储不是免费时，「选对算法」和「用好硬件」同等重要。<\/strong><\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：算法（algorithm）是什么（难度：基础）<\/h3>\n<p><strong>算法<\/strong>就是任何良定义的计算过程，它取某个值或值的集合作为<strong>输入<\/strong>，并产生某个值或值的集合作为<strong>输出<\/strong>。换句话说：算法是把输入一步步变换成输出的、有明确规则的操作序列。<\/p>\n<p>以书中反复用的<strong>排序问题<\/strong>为例：<\/p>\n<ul><li>\n<strong>输入<\/strong>：n 个数的一个序列 ⟨a₁, a₂, …, aₙ⟩。\n<\/li><li>\n<strong>输出<\/strong>：输入序列的一个排列 ⟨a₁′, a₂′, …, aₙ′⟩，满足 a₁′ ≤ a₂′ ≤ … ≤ aₙ′。\n<\/ul>\n<p>例如输入 ⟨31, 41, 59, 26, 41, 58⟩，排序算法返回 ⟨26, 31, 41, 41, 58, 59⟩。这组具体的输入，在书中叫作该问题的一个<strong>实例（instance）<\/strong>——即满足问题陈述所加各种约束的具体输入。<\/p>\n<h3>概念 2：正确性（难度：基础）<\/h3>\n<p>若对每个输入实例，算法都以正确的输出停机，则称该算法是<strong>正确的<\/strong>。注意：书中默认我们只关心正确算法；但第 31 章会看到带可控错误率的随机化素数测试——错误率可控的算法在实践中也很有用。<\/p>\n<h3>概念 3：算法为什么重要（难度：基础）<\/h3>\n<p>书中 §1.2「作为一种技术的算法」用了一个「效率故事」锚定：<\/p>\n<ul><li>\n<strong>插入排序<\/strong>：排序 n 个数大约需要 c₁n² 时间（c₁ 是不依赖 n 的常数）。\n<\/li><li>\n<strong>归并排序<\/strong>：大约需要 c₂n lg n 时间（lg n = log₂n）。\n<\/li><li>\n当 n 从 1000 涨到 100 万时：n² 膨胀到 10¹² 量级，而 n lg n 只有 10⁷×20 ≈ 2×10⁸ 量级。即使插入排序跑在快 CPU、归并排序跑在慢 CPU 上，输入足够大时归并排序也会赢。\n<\/ul>\n<p><strong>结论<\/strong>：硬件速度翻倍只能线性改善常数，而算法复杂度的阶（n² 对 n lg n）随 n 增长几个数量级——算法效率是和硬件、网络、对象系统并列的「技术」。<\/p>\n<h3>概念 4：应用全景（难度：基础）<\/h3>\n<p>书中点名的场景：人类基因工程（30 亿个碱基对的测序与匹配）、互联网（海量数据的路由、检索、加密）、电子商务（公钥加密与数字签名）、制造业与零售业（优化运输路径、调度）。这些都依赖本书后面章节的排序、图、数论、动态规划等技术。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n    A[输入实例&lt;br/&gt;一组数] --&gt; B[算法&lt;br/&gt;一步步确定规则] --&gt; C[输出&lt;br/&gt;排好序的序列]\n    D[问题陈述&lt;br/&gt;输入/输出关系] -.定义.-&gt; B<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：箭头从左到右是「数据流过算法」；虚线表示问题陈述规定了算法必须实现的输入输出关系。重点：算法是「过程」，问题是「关系」，实例是「具体一批输入」，三者不要混。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：算法像菜谱——输入是食材，输出是菜，每一步操作（切、炒、加盐）都明确无歧义。<strong>失效边界<\/strong>：菜谱做完菜就结束，算法还要处理「无限多可能的输入」，所以必须证明对所有合法输入都正确。\n<\/li><li>\n<strong>实例<\/strong>：对输入 ⟨5, 2, 4, 6, 1, 3⟩ 执行排序，输出必须是 ⟨1, 2, 3, 4, 5, 6⟩。任何把 6 漏排到最后的算法，都没有正确解决这个实例。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为「能跑就行，快不快无所谓」<\/strong>——实际上 n 很大时（数据库、基因组、网络路由），n² 与 n lg n 的差距是成千上万倍，硬件再快也补不回来。\n<\/li><li>\n<strong>别以为「算法就是数学题」<\/strong>——实际上算法是工程对象：要用伪代码描述、要分析正确性、要在真实机器上衡量资源（时间+空间）。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n（单选）下列哪一项最符合书中「算法」的定义？（答案：C；解析：算法是良定义的计算过程，有输入有输出、对每个实例正确停机；A 只是数据结构、B 只是编程语言特征、D 把算法等同于具体程序，程序只是算法的一种实现）\n<ul>\n<li>\nA. 一种在内存中存数据的方式\n<\/li><li>\nB. 任何一门编程语言\n<\/li><li>\nC. 把输入经确定步骤变换为正确输出的计算过程\n<\/li><li>\nD. 一份可以直接编译运行的源码文件\n<\/li><li>\n（单选）对排序问题 ⟨31, 41, 59, 26, 41, 58⟩，正确输出是？（答案：B；解析：非降序排列且保持重复值，26, 31, 41, 41, 58, 59）\n<\/li><li>\nA. ⟨59, 41, 41, 31, 26, 58⟩\n<\/li><li>\nB. ⟨26, 31, 41, 41, 58, 59⟩\n<\/li><li>\nC. ⟨26, 31, 41, 58, 59⟩\n<\/li><li>\nD. ⟨1, 2, 3, 4, 5, 6⟩\n<\/li><li>\n（填空）插入排序运行时间约为 c₁n²，归并排序约为 c₂n__n（用 lg 形式填）。（答案：lg；解析：书中明确归并排序为 c₂n lg n，lg n = log₂ n）\n<\/li><li>\n（简答）为什么书中说「算法是一项技术」？（答案：当计算机不是无限快、存储器不是免费时，好算法能节省时间与空间，与硬件、网络等技术并列影响系统性能；n 越大，复杂度阶的优势越压倒常数因子）\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n算法 = 良定义计算过程：输入 → 确定步骤 → 正确输出。\n<\/li><li>\n效率故事：插入排序 n²，归并排序 n lg n；规模一大，阶决定胜负。\n<\/li><li>\n算法渗透在基因工程、互联网、电商加密等真实系统中。\n<\/ul>", "ch02": "<h1>第 2 章：算法基础<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★☆☆ | <strong>预估学时<\/strong>：2 小时 | <strong>前置<\/strong>：第 1 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n用伪代码写出插入排序，并说出它最坏/最好情况的运行时间。\n<\/li><li>\n用「循环不变式」三条性质（初始化、保持、终止）解释算法为什么正确。\n<\/li><li>\n用分治思想描述归并排序，并画出递归树、读出 T(n) = 2T(n/2) + cn 的解为 Θ(n lg n)。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p><strong>先动手写第一个算法（插入排序），再学会用「循环不变式」证明它、用「增长量级」抽象它，最后用「分治」造出更快的归并排序。<\/strong><\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：伪代码（pseudocode）约定（难度：基础）<\/h3>\n<p>本书伪代码类似 C/C++/Java/Python 的精简写法，核心约定（来自书中 §2.1）：<\/p>\n<ul><li>\n缩进表示块结构（类似 Python）。\n<\/li><li>\n<code>for / while / if<\/code> 用缩进管作用域，不用大括号。\n<\/li><li>\n数组元素用 <code>A[i]<\/code>、属性用 <code>A.length<\/code>、对象属性用「点」访问（<code>x.f<\/code>）。\n<\/li><li>\n参数按值传递；<code>return<\/code> 可以一次返回多个值；<code>and/or<\/code> 是短路求值；遇到异常情况用 <code>error<\/code> 表示。\n<\/ul>\n<h3>概念 2：插入排序（INSERTION-SORT）（难度：基础）<\/h3>\n<p><strong>插入排序<\/strong>：像打扑克牌——左手已排好的牌，从牌堆摸一张，从右往左比，插到正确位置。<\/p>\n<pre><code>INSERTION-SORT(A)\n1  for j = 2 to A.length        // A[1..j-1] 始终已排好序\n2      key = A[j]\n3      // 将 A[j] 插入已排序的 A[1..j-1]\n4      i = j - 1\n5      while i &gt; 0 and A[i] &gt; key\n6          A[i+1] = A[i]          // 比 key 大的牌右挪一位\n7          i = i - 1\n8      A[i+1] = key              // 插入正确位置<\/code><\/pre>\n<p>对 A = ⟨5, 2, 4, 6, 1, 3⟩：j=2 时把 2 插到 5 前；j=3 时把 4 插到 5 前；……最终 ⟨1,2,3,4,5,6⟩。<\/p>\n<p><strong>运行时间<\/strong>：最好情况（已排好序）内层 while 一次不转，Θ(n)；最坏情况（逆序）每轮都从 j-1 比较到 1，总比较次数 ≈ n(n-1)/2，Θ(n²)。<\/p>\n<h3>概念 3：循环不变式（loop invariant）（难度：进阶）<\/h3>\n<p><strong>循环不变式<\/strong>是循环每次转完都成立的断言。以上面为例：「在循环的每次迭代开始时，子数组 A[1..j-1] 由原 A[1..j-1] 中的元素按序组成」。要证明它成立，验三条：<\/p>\n<ol><li>\n<strong>初始化<\/strong>：第一次迭代前（j=2 时），A[1..1] 当然已排好。\n<\/li><li>\n<strong>保持<\/strong>：若 A[1..j-1] 已排序，一轮把 A[j] 插入正确位置后 A[1..j] 仍排序。\n<\/li><li>\n<strong>终止<\/strong>：循环在 j = n+1 时结束，此时 A[1..n] 排序——算法正确。\n<\/ol>\n<p>类比数学归纳法：初始化=归纳基例，保持=归纳步。<\/p>\n<h3>概念 4：增长量级（order of growth）（难度：进阶）<\/h3>\n<p>书中 §2.2 引入「渐近分析」的雏形：只保留运行时间中<strong>最高阶项<\/strong>（如插入排序最坏时的 an²+bn+c 里只留 n²），并丢掉最高阶项的常数系数。记作 Θ(n²)。当 n 足够大时，低阶项与常数项相对不重要——这为第 3 章的渐近记号铺路。<\/p>\n<h3>概念 5：分治法（divide and conquer）与归并排序（难度：进阶）<\/h3>\n<p><strong>分治<\/strong>：把问题分解成若干规模更小的同类子问题，递归求解，再合并结果。归并排序 MERGE-SORT：<\/p>\n<ol><li>\n<strong>分解<\/strong>：把 A[p..r] 从中间 q 切成两半 A[p..q] 与 A[q+1..r]。\n<\/li><li>\n<strong>解决<\/strong>：递归地对两半排序。\n<\/li><li>\n<strong>合并<\/strong>：MERGE(A, p, q, r)——把两个已排序的子数组合成一个已排序数组。书中 MERGE 用「哨兵」技巧：L、R 末尾各放一个 ∞，这样比较时永远不用先判「哪半先耗尽」。\n<\/ol>\n<p><strong>递归式<\/strong>：T(n) = Θ(1)（n 够小）；否则 T(n) = 2T(n/2) + Θ(n)。 <strong>递归树读法<\/strong>（书中图 2-5）：树有 lg n 层；每层合并代价都是 cn；总代价 cn·lg n + cn = Θ(n lg n)。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[⟨5,2,4,6,1,3⟩] --&gt; S[切成两半 ⟨5,2,4⟩ ⟨6,1,3⟩]\n    S --&gt; S1[左再切 ⟨5,2⟩ ⟨4⟩]\n    S --&gt; S2[右再切 ⟨6⟩ ⟨1,3⟩]\n    S1 --&gt; M1[排序合并 → ⟨2,4,5⟩]\n    S2 --&gt; M2[排序合并 → ⟨1,3,6⟩]\n    M1 --&gt; F[MERGE ⟨1,2,3,4,5,6⟩]\n    M2 --&gt; F<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：自上而下是「分解」，自下而上是「合并」。每一层的合并代价都是 cn（扫描一遍），树高 lg n，所以总量是 cn lg n——这就是 Θ(n lg n) 的来源。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：插入排序像新手理牌，每次摸一张插到位；归并排序像「分两摞各自理好，再像归拢扑克牌一样一叠一叠挑最小的放一起」。<strong>失效边界<\/strong>：合并需要额外的 O(n) 临时空间，插入排序是原地的——空间换时间。\n<\/li><li>\n<strong>实例<\/strong>：MERGE(⟨2,4,7,∞⟩, ⟨1,2,3,6,∞⟩) 从左到右挑最小：1,2,2,3,4,6,7，最后哨兵 ∞ 收尾——一轮线性扫描合并完成。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为「插入排序最坏 Θ(n²) 就不能用」<\/strong>——实际上 n 很小（打牌、小数组）时常数小、原地、缓存友好，工程里常作为快排/归并的小数组兜底。\n<\/li><li>\n<strong>别以为「归并排序更快所以总是它」<\/strong>——实际上合并要 O(n) 辅助空间；对内存受限场景要权衡。\n<\/li><li>\n<strong>别以为「循环不变式是玄学」<\/strong>——它就是归纳法在循环上的翻译，三条件逐条核对即可。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n（单选）插入排序在数组已完全有序时的运行时间是？（答案：A；解析：内层 while 一次不执行，外层 n 次 = Θ(n)）\n<ul>\n<li>\nA. Θ(n)   B. Θ(n lg n)   C. Θ(n²)   D. Θ(lg n)\n<\/li><li>\n（多选）循环不变式需要验证哪几条性质？（答案：A、B、C；解析：初始化/保持/终止缺一不可；D 是递归式性质）\n<\/li><li>\nA. 初始化   B. 保持   C. 终止   D. 递归基例\n<\/li><li>\n（填空）归并排序的递归式 T(n) = 2T(n/2) + Θ(n)，其解为 Θ(n__)。（答案：lg n；解析：每层 cn，共 lg n 层）\n<\/li><li>\n（简答）MERGE 为什么要在 L、R 末尾放哨兵 ∞？（答案：免去「哪一半先耗尽」的判断，每次比较都能挑出更小者；哨兵保证一旦有一方耗尽，另一方的剩余元素自然成为最小并被取走，简化代码且仍是线性时间）\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n插入排序：打牌式插入，最坏 Θ(n²)、最好 Θ(n)。\n<\/li><li>\n循环不变式三条件：初始化、保持、终止。\n<\/li><li>\n分治 = 分解 + 解决 + 合并；归并排序 T(n)=2T(n/2)+Θ(n) ⇒ Θ(n lg n)。\n<\/ul>", "ch03": "<h1>第 3 章：函数的增长<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：2.5 小时 | <strong>前置<\/strong>：第 2 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n用数学定义解释 Θ（紧确界）、O（上界）、Ω（下界）、o（非紧上界）、ω（非紧下界）五种渐近记号。\n<\/li><li>\n判断 f(n) 与 g(n) 增长快慢（多项式 vs 对数 vs 指数）。\n<\/li><li>\n熟记书中常用函数：lg n、n!、lg(n!)、对数换底与 e^x 级数。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p><strong>渐近记号只关心「n 足够大时函数在哪个量级」——丢掉常数与低阶项，让我们看清算法之间的本质差距。<\/strong><\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：Θ（g(n)）——渐近紧确界（难度：进阶）<\/h3>\n<p><strong>Θ(g(n))<\/strong>：若存在正常量 c₁、c₂ 和 n₀，使对所有 n ≥ n₀，有 0 ≤ c₁g(n) ≤ f(n) ≤ c₂g(n)，则 f(n) ∈ Θ(g(n))。白话：n 足够大时，f(n) 被夹在 g(n) 的两个常数倍之间——g(n) 是 f(n) 的<strong>渐近紧确界（asymptotically tight bound）<\/strong>。<\/p>\n<p>书中实例：证明 (1/2)n² − 3n = Θ(n²)。用 n² 除：c₁ ≤ 1/2 − 3/n ≤ c₂。取 c₂ = 1/2（n ≥ 1 时右不等式成立），c₁ = 1/14（n ≥ 7 时左不等式成立），n₀ = 7。于是 n ≥ 7 时不等式成立——证毕。<\/p>\n<h3>概念 2：O(g(n))——渐近上界（难度：进阶）<\/h3>\n<p><strong>O(g(n))<\/strong>：存在正常量 c、n₀，使 n ≥ n₀ 时 0 ≤ f(n) ≤ c·g(n)。白话：f 「至多」像 g 增长。O 是上界，但<strong>不一定紧<\/strong>：2n² = O(n³) 在数学上成立（n 大时 n³ 更大），虽然不紧——能写 Θ 就别只写 O。<\/p>\n<h3>概念 3：Ω(g(n))——渐近下界（难度：进阶）<\/h3>\n<p><strong>Ω(g(n))<\/strong>：存在正常量 c、n₀，使 n ≥ n₀ 时 0 ≤ c·g(n) ≤ f(n)。白话：f 「至少」像 g 增长。书中定理：f(n)=Θ(g(n)) 当且仅当 f=O(g) 且 f=Ω(g)。<\/p>\n<h3>概念 4：o 与 ω——非紧确记号（难度：高难）<\/h3>\n<ul><li>\n<strong>o(g(n))<\/strong>：对任意正常量 c，存在 n₀，使 n ≥ n₀ 时 0 ≤ f(n) &lt; c·g(n)。白话：f 相对 g「可以任意小」——g 比 f 高一个量级。例：2n = o(n²)（因为 2n/n² → 0）。\n<\/li><li>\n<strong>ω(g(n))<\/strong>：与 o 对称，f 比 g 高一个量级。例：n²/2 = ω(n)。\n<\/ul>\n<p>记忆法：Θ/O/Ω 用「存在某个 c」；o/ω 用「对任意 c」——后者刻画的是严格的阶差。<\/p>\n<h3>概念 5：标准记号（难度：基础）<\/h3>\n<p>书中 §3.2 给出的常用关系（已从书页核对）：<\/p>\n<ul><li>\n<strong>lg n = log₂ n<\/strong>，<strong>ln n = logₑ n<\/strong>，<strong>lgᵏ n = (lg n)ᵏ<\/strong>。\n<\/li><li>\n换底：log_b a = log_c a / log_c b——换底只乘一个常数因子，所以 O 记号里底数不重要，直接写 lg n。\n<\/li><li>\n多项式 vs 指数：对任意底 a &gt; 1 的指数函数，nᵏ = o(aⁿ)——指数碾压多项式。\n<\/li><li>\n对数不等式：对 x &gt; −1，x/(1+x) ≤ ln(1+x) ≤ x。\n<\/li><li>\neˣ 级数：eˣ = 1 + x + x²/2! + …，且 eˣ ≥ 1+x。\n<\/li><li>\n极限：lim(1 + x/n)ⁿ = eˣ。\n<\/ul>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n    subgraph 从小到大\n    A[对数 lg n] --&gt; B[幂 n^ε] --&gt; C[n] --&gt; D[n lg n] --&gt; E[n^2] --&gt; F[n^3] --&gt; G[2^n] --&gt; H[n!]\n    end<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：从左到右增长越来越快。算法复杂度落在左边的好，落在右边的坏。o 记号刻画「严格在左边」：lg n = o(n)，n lg n 比 n 高一截、比 n² 低一截。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：渐近记号像估算城市人口——「几十万」对「几十亿」，不关心精确到个位，只关心量级。<strong>失效边界<\/strong>：对 n 很小的场景（n=5），常数项和低阶项可能主导，渐近结论不适用。\n<\/li><li>\n<strong>实例<\/strong>：插入排序最坏 Θ(n²)、归并排序 Θ(n lg n)——n lg n = o(n²)，所以 n 一大归并就碾压。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为 O(n²) 就表示「恰好 n²」<\/strong>——实际上 O 只是上界；说「恰好」必须用 Θ。\n<\/li><li>\n<strong>别以为换对数底会改变复杂度<\/strong>——实际上换底只乘常数 1/ln 2，O 记号里底数无关，统一写 lg。\n<\/li><li>\n<strong>别以为「n² 比 n³ 慢是显然的」<\/strong>——慢是慢，但书中用定义严格证明 2n² = o(n³)，靠的是比值趋向 0，不是「感觉」。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n（单选）(1/2)n² − 3n 用渐近记号最紧的写法是？（答案：B；解析：书中证明它属于 Θ(n²)）\n<ul>\n<li>\nA. O(n³)   B. Θ(n²)   C. Ω(n³)   D. o(n²)\n<\/li><li>\n（多选）下列哪些正确（可多选）？（答案：A、B、C；解析：2n=O(n²) 上界成立；n²/2=ω(n) 比值→∞；lg n = o(n)；D 错，n! 比 2ⁿ 还快，2ⁿ ≠ ω(n!)）\n<\/li><li>\nA. 2n = O(n²)   B. n²/2 = ω(n)   C. lg n = o(n)   D. 2ⁿ = ω(n!)\n<\/li><li>\n（填空）换底公式 log_b a = log_c a / __c b。（答案：log；解析：log_b a = log_c a / log_c b）\n<\/li><li>\n（简答）为什么书中说「对任意底 a&gt;1，nᵏ = o(aⁿ)」？（答案：多项式比值 nᵏ/aⁿ → 0，所以多项式严格低于指数——任何多项式再高次也追不上任何底数&gt;1的指数）\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\nΘ 紧确、O 上界、Ω 下界、o/ω 严格阶差。\n<\/li><li>\n增长率梯队：lg n &lt; n &lt; n lg n &lt; n² &lt; 2ⁿ &lt; n!。\n<\/li><li>\n换底只乘常数，O 里底数随便写。\n<\/ul>", "ch04": "<h1>第 4 章：分治策略<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：3.5 小时 | <strong>前置<\/strong>：第 2 章、第 3 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n对 T(n) = aT(n/b) + f(n) 形式的递归式，用主方法三种情况直接读出结果。\n<\/li><li>\n用递归树估算一个递归式的上界，再用代入法验证。\n<\/li><li>\n用分治解最大子数组问题，并说出它与暴力法 Θ(n²) 的复杂度对比。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p><strong>分治递归式 T(n) = aT(n/b) + f(n) 的解由「子问题代价」与「合并代价 f(n)」谁占主导决定——主方法给了三档查表法。<\/strong><\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：最大子数组问题（难度：进阶）<\/h3>\n<p>股价每日变动序列里，「哪天买、哪天卖赚钱最多」等价于求<strong>变动数组<\/strong> A 的连续子数组，使其和最大。<\/p>\n<ul><li>\n暴力法：枚举所有 i≤j，O(n²) 对，每对求和 O(n)，总 Θ(n³)。\n<\/li><li>\n分治法：把 A[low..high] 从 mid 切开。最大子数组只可能在三种位置：\n<ol>\n<li>\n完全在左半 A[low..mid]；\n<\/li><li>\n完全在右半 A[mid+1..high]；\n<\/li><li>\n<strong>跨越中点<\/strong>（low ≤ i ≤ mid &lt; j ≤ high）。\n<\/li><li>\n跨中点情况用 FIND-MAX-CROSSING-SUBARRAY：左半从 mid 向左扫求最大和 left-sum，右半从 mid+1 向右扫求最大和 right-sum，合并即得。这一步 Θ(n)。\n<\/li><li>\n递归式 T(n) = 2T(n/2) + Θ(n) ⇒ <strong>Θ(n lg n)<\/strong>。\n<\/ol>\n<\/ul>\n<h3>概念 2：Strassen 矩阵乘法（难度：高难）<\/h3>\n<p>两个 n×n 矩阵朴素乘法 Θ(n³)。Strassen 的巧思：把 4 个 n/2 子矩阵的 8 次乘法换成 <strong>7 次<\/strong>（用中间矩阵 M₁…M₇ 的加减组合），递归式 T(n) = 7T(n/2) + Θ(n²)。用主方法读出 ⇒ <strong>Θ(n^lg7) ≈ Θ(n^2.81)<\/strong>。<\/p>\n<h3>概念 3：求解递归式的三种方法（难度：进阶）<\/h3>\n<ol><li>\n<strong>代入法<\/strong>：猜测一个界，用数学归纳法证明常数可行。例：证明 T(n)=2T(⌊n/2⌋)+n 为 O(n lg n)，猜 T(n) ≤ c n lg n，代入验证 c 的选择。\n<\/li><li>\n<strong>递归树<\/strong>：把递归式逐层展开成树，每层代价写出来求和。书中例子 T(n)=T(n/3)+T(2n/3)+cn：树高约 log_{3/2} n，每层代价 cn，总 cn·log n = O(n lg n)（书页已核对该推导）。\n<\/li><li>\n<strong>主方法<\/strong>：直接套公式（见下）。\n<\/ol>\n<h3>概念 4：主定理（定理 4.1）（难度：进阶）<\/h3>\n<p>对 a ≥ 1、b &gt; 1，T(n) = aT(n/b) + f(n)（n/b 取整不影响渐近）：<\/p>\n<table><thead><tr><th>情况<\/th><th>条件（与 n^log_b a 比较）<\/th><th>结论<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>f(n) = O(n^{log_b a − ε})，ε&gt;0（子问题代价主导）<\/td><td>T(n) = Θ(n^{log_b a})<\/td><\/tr><tr><td>2<\/td><td>f(n) = Θ(n^{log_b a})（两者持平）<\/td><td>T(n) = Θ(n^{log_b a} · lg n)<\/td><\/tr><tr><td>3<\/td><td>f(n) = Ω(n^{log_b a + ε})（合并代价主导），且满足正则条件 a·f(n/b) ≤ c·f(n)，c&lt;1<\/td><td>T(n) = Θ(f(n))<\/td><\/tr><\/tbody><\/table>\n<p><strong>记忆锚<\/strong>：先算 n^{log_b a}（所有子问题加起来的总代价层），再跟 f(n) 比大小：小 → 子问题赢（情况1）；平 → 乘 lg n（情况2）；大 → f(n) 赢（情况3）。<\/p>\n<p><strong>例<\/strong>：归并 T(n)=2T(n/2)+Θ(n)：log_b a = log_2 2 = 1，n^1 = n 与 f(n)=n 持平 ⇒ 情况 2 ⇒ Θ(n lg n)。 <strong>例<\/strong>：Strassen T(n)=7T(n/2)+Θ(n²)：log_2 7 ≈ 2.81，n^2.81 &gt; n² ⇒ f(n)=n² 是低阶 ⇒ 情况 1 ⇒ Θ(n^{lg 7})。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[T(n)=aT(n/b)+f(n)] --&gt; B[算 n^log_b a]\n    B --&gt; C1{f vs n^log_b a}\n    C1 --&gt;|f 低阶| D1[情况1: Θ n^log_b a]\n    C1 --&gt;|f 持平| D2[情况2: Θ n^log_b a · lg n]\n    C1 --&gt;|f 高阶| D3[情况3: Θ f(n)]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：主方法是个「比大小」开关。先算子问题总量 n^{log_b a}，再让 f(n) 跟它比，落到三个分支之一。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/st
