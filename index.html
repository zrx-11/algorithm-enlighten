rong>：主方法像工资谈判——a 个子问题是「手下人干活」，f(n) 是「自己做合并」。手下总产量 n^{log_b a} 比 f 大，就由手下决定进度（情况1）；两者一样大，进度乘一层对数（情况2）；自己合并比手下还贵，就由 f 决定（情况3）。<strong>失效边界<\/strong>：f 与 n^{log_b a} 之间隔着「多项式间隙」才能用主方法；若 f = Θ(n^{log_b a}·lgᵏ n) 这种「差个对数因子」，要用推广版主定理，不能硬套三档。\n<\/li><li>\n<strong>实例<\/strong>：T(n) = 2T(n/2) + n：log_b a=1，n^1=n 与 f=n 持平 ⇒ 情况 2 ⇒ Θ(n lg n)，与归并排序一致。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为主方法对所有递归式都能用<\/strong>——实际上 f(n) 必须与 n^{log_b a} 是多项式阶可比；像 T(n)=2T(n/2)+n lg n 这种，要用推广版。\n<\/li><li>\n<strong>别以为「n/b 取整」会改变结论<\/strong>——书中证明取整只影响低阶，渐近结论不变。\n<\/li><li>\n<strong>别以为 Strassen 更快所以日常用它<\/strong>——实际上常数巨大、数值稳定性差，工程上很少用；它的价值是「矩阵乘法下界可以低于 3」的理论突破。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n（单选）T(n) = 9T(n/3) + n，主方法结论是？（答案：A；解析：log_3 9 = 2，n² 比 f=n 高阶 ⇒ 情况 1 ⇒ Θ(n²)）\n<ul>\n<li>\nA. Θ(n²)   B. Θ(n² lg n)   C. Θ(n)   D. Θ(n lg n)\n<\/li><li>\n（单选）T(n) = T(2n/3) + 1（即 a=1,b=3/2）结论是？（答案：B；解析：log_{3/2} 1 = 0，n⁰=1 与 f=1 持平 ⇒ 情况 2 ⇒ Θ(lg n)）\n<\/li><li>\nA. Θ(1)   B. Θ(lg n)   C. Θ(n)   D. Θ(n²)\n<\/li><li>\n（填空）Strassen 算法把矩阵乘法递归式写成 T(n)=__T(n/2)+Θ(n²)，复杂度为 Θ(n^lg7)。（答案：7；解析：7 次子矩阵乘法替代 8 次）\n<\/li><li>\n（简答）最大子数组分治法为什么要单独处理「跨越中点」？（答案：跨越中点的子数组既不属于左半也不属于右半，递归的两个子问题都覆盖不到它；必须在合并阶段用一次线性扫描把它找出来，再与左右最优比三者取最大）\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n主方法三档：跟 n^{log_b a} 比大小——低阶取子问题、持平乘 lg、高阶取 f。\n<\/li><li>\n最大子数组：Θ(n lg n)；Strassen：Θ(n^2.81)。\n<\/li><li>\n代入法先猜后证；递归树估算层数与每层代价。\n<\/ul>", "ch05": "<h1>第 5 章：概率分析和随机算法<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：2.5 小时 | <strong>前置<\/strong>：第 2 章；附录 C（计数与概率）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n区分「概率分析」（对输入分布做假设）与「随机算法」（算法自己掷骰子）。\n<\/li><li>\n用指示器随机变量快速算出雇用问题的期望雇用次数。\n<\/li><li>\n解释生日悖论，算出 k 人时两人生日相同的概率。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p><strong>当输入不好控制时，让算法自己随机化——期望运行时间就不再依赖最坏输入分布，而由骰子决定。<\/strong><\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：雇用问题（hiring problem）（难度：基础）<\/h3>\n<p>你要面试 n 个应聘者，每天看一个人；如果当天这个人比之前所有都好，就「雇用」当前的人（解雇旧的）。问：总雇用次数的期望是多少？<\/p>\n<ul><li>\n最坏情况：应聘者按从差到好排序，每次都雇 ⇒ n 次。\n<\/li><li>\n假设应聘者以<strong>随机顺序<\/strong>到来：第 i 个应聘者比前 i-1 个都好的概率 = 1/i。\n<\/ul>\n<h3>概念 2：指示器随机变量（indicator random variable）（难度：进阶）<\/h3>\n<p><strong>指示器随机变量<\/strong> I{A}：事件 A 发生取 1，否则取 0（书页公式 5.1）。关键性质（引理 5.1）：E[I{A}] = Pr{A}——事件发生的概率就是它的指示器的期望。<\/p>\n<p>雇用问题：设 Xᵢ = I{第 i 个应聘者被雇用}，X = ΣXᵢ。则 E[Xᵢ] = Pr{第 i 个是前 i 个中最好} = 1/i。 E[X] = Σ E[Xᵢ] = Σ 1/i = ln n + O(1)。<strong>结论<\/strong>：随机顺序下只期望雇约 ln n 次，而不是 n 次。<\/p>\n<h3>概念 3：随机化算法（randomized algorithm）（难度：进阶）<\/h3>\n<p>雇用问题里我们无法控制输入顺序，于是把输入<strong>随机排列<\/strong>——算法自己调用 RANDOM 重排数组。典型实现 RANDOMIZE-IN-PLACE(A)：对 i = 1..n，交换 A[i] 与 A[RANDOM(i, n)]。书中证明它产生<strong>均匀随机排列<\/strong>（每个排列概率 1/n!）。<\/p>\n<ul><li>\n<strong>概率分析<\/strong>：假设输入服从某分布，分析期望。\n<\/li><li>\n<strong>随机算法<\/strong>：分布不在输入上，而在算法内部——掷骰子决定下一步。\n<\/ul>\n<h3>概念 4：生日悖论（难度：进阶）<\/h3>\n<p>k 个人的屋子里，至少两人生日相同的概率多大？书中设一年 n=365 天。两人生日不同的概率 = 364/365；k 人<strong>全部互不相同<\/strong>的概率 Π_{i=1}^{k-1}(1 − i/365)。<\/p>\n<ul><li>\nk=23 时，至少两人相同的概率就超过 50%——远小于 365。这就是「悖论」：人不需要很多，相同生日就很可能出现。\n<\/ul>\n<h3>概念 5：球与箱子 / 特征序列 / 在线雇用（难度：高难，了解）<\/h3>\n<ul><li>\n<strong>球与箱子<\/strong>：把 n 个球独立随机扔进 b 个箱子，某箱子球数、空箱数的期望。\n<\/li><li>\n<strong>特征序列<\/strong>：抛硬币 n 次，最长连续正面的期望长度 ≈ lg n。\n<\/li><li>\n<strong>在线雇用<\/strong>：不能回头、必须当场决定——书中给出「先看约 n/e 个不雇，之后遇到第一个比之前都好的就雇」的策略，雇到最佳者概率 ≈ 1/e。\n<\/ul>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n    A[输入数组] --&gt; B[RANDOMIZE-IN-PLACE&lt;br/&gt;算法自己掷骰子重排]\n    B --&gt; C[对随机后的输入运行算法]\n    C --&gt; D[期望运行时间&lt;br/&gt;不再依赖输入分布]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：随机算法把「输入不可控」变成「算法内部可控」——期望是对骰子取的，不是对恶意输入取的。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：发牌——不假设牌堆本来就乱，而是洗完牌再发，每个人拿到公平的一手。<strong>失效边界<\/strong>：随机化不能让「错误算法」变对；它只把最坏输入变成平均输入。\n<\/li><li>\n<strong>实例<\/strong>：n=1000 应聘者，随机顺序下期望雇用次数 ≈ ln 1000 ≈ 7 次，远少于最坏 1000 次。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为「生日悖论说 23 人里有一人跟我同天生日概率 50%」<\/strong>——实际上它说的是「任意两人之间有一对同天」；跟<strong>你特定<\/strong>同天要约 253 人才到 50%。\n<\/li><li>\n<strong>别以为「随机算法就是慢」<\/strong>——实际上快排的随机化版本（第 7 章）期望 Θ(n lg n)，正是靠这一章的随机化思想。\n<\/li><li>\n<strong>别以为「期望 ≈ 平均情况」<\/strong>——期望是对随机骰子取的平均，可能某次运行很差，但长期平均稳定。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n（单选）雇用问题中，第 i 个应聘者被雇用的概率是？（答案：C；解析：他要成为前 i 个中最好，随机顺序下概率 1/i）\n<ul>\n<li>\nA. 1/n   B. i/n   C. 1/i   D. 1/2\n<\/li><li>\n（单选）k=23 人时，至少两人生日相同的概率约为？（答案：B；解析：书中算出约 50.7%，远小于一年天数）\n<\/li><li>\nA. 6%   B. 50%   C. 99%   D. 0\n<\/li><li>\n（填空）RANDOMIZE-IN-PLACE 对每个 i，把 A[i] 与 A[__(i, n)] 返回的位置交换。（答案：RANDOM；解析：书中伪代码 A[RANDOM(i,n)]）\n<\/li><li>\n（简答）概率分析与随机算法的区别？（答案：概率分析假设输入分布并在该分布下分析期望；随机算法在算法内部掷骰子重排/选择，期望对骰子取——不依赖输入是否随机）\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n指示器 E[I{A}] = Pr{A}；雇用问题期望 E[X] = H_n ≈ ln n。\n<\/li><li>\n随机算法 = 算法自己掷骰子；RANDOMIZE-IN-PLACE 生成均匀排列。\n<\/li><li>\n生日悖论：23 人即有 &gt;50% 出现一对同天。\n<\/ul>", "ch06": "<h1>第 6 章：堆排序<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：2 小时 | <strong>前置<\/strong>：第 2、3 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说出二叉堆的数组表示（PARENT/LEFT/RIGHT 下标公式）与大根堆性质。\n<\/li><li>\n描述 MAX-HEAPIFY、BUILD-MAX-HEAP、HEAPSORT 的流程与复杂度。\n<\/li><li>\n用堆实现优先队列的 INSERT / MAXIMUM / EXTRACT-MAX / INCREASE-KEY。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p><strong>堆是一个被看成「近似完全二叉树」的数组：父 ≥ 子（大根堆），于是堆顶永远是最大值——排序与优先队列都靠它。<\/strong><\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：二叉堆（binary heap）（难度：基础）<\/h3>\n<p><strong>二叉堆<\/strong>是一个数组，可以看成一棵近似的<strong>完全二叉树<\/strong>：除最底层外全满，且从左向右填充。树上每个结点对应数组一个元素，树根是 A[1]。下标关系（书页已核对）：<\/p>\n<ul><li>\nPARENT(i) = ⌊i/2⌋\n<\/li><li>\nLEFT(i) = 2i\n<\/li><li>\nRIGHT(i) = 2i+1\n<\/ul>\n<p>堆有两个属性：A.length（数组总长）和 A.heap-size（堆里实际存了多少元素，0 ≤ heap-size ≤ length）。 <strong>大根堆（max-heap）性质<\/strong>：对每个结点 i ≠ 1，A[PARENT(i)] ≥ A[i]——父节点值不小于子节点。所以堆顶 A[1] 是全堆最大。（小根堆反之，堆顶最小。）<\/p>\n<h3>概念 2：MAX-HEAPIFY（难度：进阶）<\/h3>\n<p>作用：假设 LEFT(i)、RIGHT(i) 为根的两棵子树已是大根堆，但 A[i] 可能比孩子小——把 A[i]「下沉」到正确位置。伪代码（书页已核对）：<\/p>\n<pre><code>MAX-HEAPIFY(A, i)\n1  l = LEFT(i);  r = RIGHT(i)\n2  if l ≤ A.heap-size and A[l] &gt; A[i]\n3      largest = l\n4  else largest = i\n5  if r ≤ A.heap-size and A[r] &gt; A[largest]\n6      largest = r\n7  if largest ≠ i\n8      exchange A[i] with A[largest]\n9      MAX-HEAPIFY(A, largest)<\/code><\/pre>\n<p>递归式 T(n) ≤ T(2n/3) + Θ(1)（最坏情况发生在树最底层恰好半满时），由主方法读出 <strong>T(n) = O(lg n)<\/strong>。<\/p>\n<h3>概念 3：建堆与堆排序（难度：进阶）<\/h3>\n<ul><li>\n<strong>BUILD-MAX-HEAP<\/strong>：从最后一个非叶结点 ⌊n/2⌋ 往前到 1，逐个 MAX-HEAPIFY。复杂度 Θ(n)（不是 O(n lg n)）。\n<\/li><li>\n<strong>HEAPSORT<\/strong>：建好大根堆后，堆顶 A[1] 是最大——把它与 A[heap-size] 交换、堆 size 减 1、对新堆顶 MAX-HEAPIFY 恢复堆性质。重复 n-1 次。总复杂度 <strong>O(n lg n)<\/strong>，原地。\n<\/ul>\n<h3>概念 4：优先队列（priority queue）（难度：进阶）<\/h3>\n<p><strong>最大优先队列<\/strong>维护一组带关键字的元素，支持（书页 §6.5 已核对）：<\/p>\n<ul><li>\nINSERT(S, x)：插入 x（O(lg n)）。\n<\/li><li>\nMAXIMUM(S)：返回最大关键字元素（O(1)）。\n<\/li><li>\nEXTRACT-MAX(S)：去掉并返回最大元素（O(lg n)，堆顶与末尾交换后 MAX-HEAPIFY）。\n<\/li><li>\nINCREASE-KEY(S, x, k)：把 x 的关键字增到 k——从 x 向上「上浮」与父交换（O(lg n)）。\n<\/ul>\n<p>典型应用：共享计算机的<strong>作业调度<\/strong>——最高优先级作业先跑（EXTRACT-MAX），新作业随时插入（INSERT）。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[数组 16 14 10 8 7 9 3 2 4 1] --&gt; B[看成完全二叉树&lt;br/&gt;16根；14、10为子；...]\n    B --&gt; C[大根堆: 父 ≥ 子]\n    C --&gt; D[HEAPSORT: 交换堆顶与末尾 → 堆缩小 → 恢复堆]\n    D --&gt; E[已排序区在数组尾部, 逐次长大]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：上半是「数组怎么变成树」；下半是排序循环——每轮把当前最大值固定到数组尾部，堆不断缩小。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：大根堆像公司组织架构——总裁（根）工资最高，往下逐层降；新来的人涨工资（INCREASE-KEY）就沿层级往上「上浮」到合适位置。<strong>失效边界<\/strong>：堆只能保证「父 ≥ 子」，不保证兄弟之间有序，所以堆不是排序好的数组。\n<\/li><li>\n<strong>实例<\/strong>：A = ⟨4, 1, 3, 2, 16, 9, 10, 14, 8, 7⟩，BUILD-MAX-HEAP 后变成 ⟨16, 14, 10, 8, 7, 9, 3, 2, 4, 1⟩——这正是书页图 6-1 的例子。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为「BUILD-MAX-HEAP 是 O(n lg n)」<\/strong>——实际上是 Θ(n)：叶子本来就满足堆性质，只有前半部分结点要下沉，总代价摊下来线性。\n<\/li><li>\n<strong>别以为「堆是垃圾回收」<\/strong>——书中特意澄清：本书的「堆」指堆数据结构，不是 Java/Lisp 的垃圾回收堆。\n<\/li><li>\n<strong>别以为「堆排序比快排快」<\/strong>——实际上快排常数小、缓存友好；堆排序的价值是最坏保证 O(n lg n) + 原地 + 优先队列应用。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n（单选）LEFT(i) 与 RIGHT(i) 的下标是？（答案：C；解析：书中 LEFT=2i, RIGHT=2i+1）\n<ul>\n<li>\nA. i+1, i+2   B. 2i+1, 2i+2   C. 2i, 2i+1   D. ⌊i/2⌋, ⌈i/2⌉\n<\/li><li>\n（单选）MAX-HEAPIFY 的递归式 T(n) ≤ T(2n/3)+Θ(1)，其解是？（答案：B；解析：主方法情况 2，树高 lg n）\n<\/li><li>\nA. Θ(1)   B. O(lg n)   C. Θ(n)   D. Θ(n lg n)\n<\/li><li>\n（多选）下列哪些是最大优先队列支持的操作？（答案：A、B、C、D；解析：书中 §6.5 列了 INSERT/MAXIMUM/EXTRACT-MAX/INCREASE-KEY 四个）\n<\/li><li>\nA. INSERT   B. MAXIMUM   C. EXTRACT-MAX   D. INCREASE-KEY\n<\/li><li>\n（简答）HEAPSORT 为什么原地且 O(n lg n)？（答案：建堆 Θ(n)；之后 n-1 轮，每轮交换 O(1) + MAX-HEAPIFY O(lg n)，共 O(n lg n)；所有操作都在原数组内，不另开数组）\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n堆 = 数组看成完全二叉树；父≥子；LEFT=2i, RIGHT=2i+1。\n<\/li><li>\nMAX-HEAPIFY O(lg n)；BUILD-MAX-HEAP Θ(n)；HEAPSORT O(n lg n) 原地。\n<\/li><li>\n优先队列：作业调度；EXTRACT-MAX 与 INCREASE-KEY 是堆的经典应用。\n<\/ul>", "ch07": "<h1>第 7 章：快速排序<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：2.5 小时 | <strong>前置<\/strong>：第 2、5 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n写出 QUICKSORT 与 PARTITION 的伪代码，说出主元（pivot）的作用。\n<\/li><li>\n说出快速排序最坏 Θ(n²)、期望 Θ(n lg n) 的原因。\n<\/li><li>\n解释为什么随机化版本能消除「特定输入触发最坏」。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p><strong>选一个主元把数组劈成「小的一半」和「大的一半」，再递归排两边——平均极快，最坏靠随机化主元来防。<\/strong><\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：分治三步（书页 §7.1 已核对）<\/h3>\n<p>对 A[p..r]：<\/p>\n<ol><li>\n<strong>分解<\/strong>：用 PARTITION 把 A[p..r] 切成 A[p..q-1]（全 ≤ A[q]）与 A[q+1..r]（全 ≥ A[q]）。\n<\/li><li>\n<strong>解决<\/strong>：递归 QUICKSORT(A, p, q-1) 与 QUICKSORT(A, q+1, r)。\n<\/li><li>\n<strong>合并<\/strong>：因为子数组已原地排好，无需合并——整段自然有序。\n<\/ol>\n<pre><code>QUICKSORT(A, p, r)\n1  if p &lt; r\n2      q = PARTITION(A, p, r)\n3      QUICKSORT(A, p, q-1)\n4      QUICKSORT(A, q+1, r)<\/code><\/pre>\n<h3>概念 2：PARTITION（书页已核对）<\/h3>\n<p>选 x = A[r] 作主元（pivot，枢纽元素）。维护 i 使 A[p..i] 全 ≤ x：<\/p>\n<pre><code>PARTITION(A, p, r)\n1  x = A[r]\n2  i = p - 1\n3  for j = p to r-1\n4      if A[j] ≤ x\n5          i = i + 1\n6          exchange A[i] with A[j]\n7  exchange A[i+1] with A[r]\n8  return i+1<\/code><\/pre>\n<p>一趟扫描 Θ(n)，把主元 x 放到最终正确位置 q。<\/p>\n<h3>概念 3：性能分析（难度：进阶）<\/h3>\n<ul><li>\n<strong>最坏划分<\/strong>：每次主元都是最大或最小——切成 0 和 n-1 两块。递归式 T(n) = T(n-1) + T(0) + Θ(n) ⇒ <strong>T(n) = Θ(n²)<\/strong>。什么时候发生？数组已（逆）序且总选 A[r] 当主元。\n<\/li><li>\n<strong>最好划分<\/strong>：每次对半切 ⇒ T(n) = 2T(n/2) + Θ(n) = Θ(n lg n)。\n<\/li><li>\n<strong>平衡划分<\/strong>：哪怕 9:1 切，递归式仍是 O(n lg n)——只要不是每次都极端偏一边。\n<\/li><li>\n<strong>随机化版本<\/strong>：把 <code>x = A[r]<\/code> 换成随机选一个元素与 A[r] 交换（RANDOMIZED-PARTITION）。这样没有「专门触发最坏的输入」——期望运行时间 <strong>Θ(n lg n)<\/strong>，常数因子很小，是实际排序首选。\n<\/ul>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[⟨2,8,7,1,3,5,6,4⟩] --&gt; B[PARTITION: 主元 x=4]\n    B --&gt; C[≤4 的左半: ⟨2,1,3⟩ + 主元4 + ≥4 的右半: ⟨8,7,5,6⟩]\n    C --&gt; D[递归排左、右两半]\n    D --&gt; E[⟨1,2,3,4,5,6,7,8⟩]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：每一趟 PARTITION 只干一件事——把主元放到它在最终排序里的正确位置 q，并保证左边都 ≤ 它、右边都 ≥ 它。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：快速排序像「按体重分队」——随便挑一人当「秤」，比他轻的站左、比他重的站右，然后左右各自再找人当秤。<strong>失效边界<\/strong>：如果每次挑的「秤」都是全队最轻或最重（有序数组），就退化成一个超长队和一个空队，Θ(n²)。\n<\/li><li>\n<strong>实例<\/strong>：A = ⟨2, 8, 7, 1, 3, 5, 6, 4⟩，x = A[8] = 4。扫描后交换，q = 5，得到左 ⟨2,1,3⟩ + 4 + 右 ⟨8,7,5,6⟩——主元 4 已在最终位置。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为「快排最坏 Θ(n²) 所以不能用」<\/strong>——实际上期望 Θ(n lg n) 且常数小、缓存友好，是 C++ sort 等的默认实现；随机化后没有恶意输入能稳定触发最坏。\n<\/li><li>\n<strong>别以为「快排是稳定排序」<\/strong>——实际上 PARTITION 的远距离交换会打乱相等元素的相对顺序，快排不稳定。\n<\/li><li>\n<strong>别以为「主元选最后一个元素是算法的一部分」<\/strong>——实际上选谁当主元都行，只是教科书默认 A[r]；随机化主元是关键改进。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n（单选）快排最坏划分下的递归式是？（答案：A；解析：切出 0 和 n-1，T(n)=T(n-1)+Θ(n)=Θ(n²)）\n<ul>\n<li>\nA. T(n) = T(n-1) + Θ(n)\n<\/li><li>\nB. T(n) = 2T(n/2) + Θ(n)\n<\/li><li>\nC. T(n) = T(9n/10) + T(n/10) + Θ(n)\n<\/li><li>\nD. T(n) = 2T(n-1)\n<\/li><li>\n（单选）RANDOMIZED-QUICKSORT 的期望运行时间是？（答案：B；解析：书中证明期望 Θ(n lg n)）\n<\/li><li>\nA. Θ(n²)   B. Θ(n lg n)   C. Θ(n)   D. Θ(lg n)\n<\/li><li>\n（填空）PARTITION 选 x = A[__] 作主元（教科书默认）。（答案：r；解析：最后一个元素）\n<\/li><li>\n（简答）为什么「9:1 划分」仍然是 O(n lg n)？（答案：递归树每层总代价仍是 cn，树高 ≈ log_{10/9} n = O(lg n)；只要比例固定不为 1:0，深度就是对数级，总代价 O(n lg n)）\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n快排 = PARTITION 分边 + 递归；主元一趟放到最终位置。\n<\/li><li>\n最坏 Θ(n²)（有序数组）、最好/平衡 Θ(n lg n)。\n<\/li><li>\n随机化主元消除恶意输入，期望 Θ(n lg n)。\n<\/ul>", "ch08": "<h1>第 8 章：线性时间排序<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：2 小时 | <strong>前置<\/strong>：第 3、6、7 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n用决策树证明「任何比较排序最坏 Ω(n lg n)」。\n<\/li><li>\n说清计数排序、基数排序、桶排序各自适用条件与复杂度。\n<\/li><li>\n解释为什么线性时间排序能绕过 Ω(n lg n) 下界。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p><strong>只要还在「两两比较」，排序就快不过 n lg n；但计数/基数/桶排序不比较元素大小，所以能在线性时间跑完。<\/strong><\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：比较排序的下界（定理 8.1）（难度：进阶）<\/h3>\n<p><strong>比较排序<\/strong>：只通过比较 aᵢ 与 aⱼ 的大小获取次序信息。把一次排序抽象成一棵<strong>决策树<\/strong>：内部结点 = 一次比较 i:j，叶结点 = 一个排列 π(1),…,π(n)。<\/p>\n<ul><li>\nn 个元素有 n! 种排列，决策树至少要有 n! 个可达叶结点。\n<\/li><li>\n高度 h 的二叉树最多 2^h 个叶结点 ⇒ n! ≤ 2^h。\n<\/li><li>\n两边取对数：h ≥ lg(n!) = Ω(n lg n)（用斯特林近似或 A.2 求和）。\n<\/ul>\n<p><strong>结论<\/strong>：任何比较排序在最坏情况下都要 Ω(n lg n) 次比较（定理 8.1）。<strong>推论 8.2<\/strong>：堆排序和归并排序是渐近最优的比较排序。<\/p>\n<h3>概念 2：计数排序（counting sort）（难度：基础）<\/h3>\n<p><strong>前提<\/strong>：n 个输入元素都是 0 到 k 区间内的整数，且 k = O(n)。 <strong>思想<\/strong>：对每个元素 x，数「小于等于 x 的元素有几个」，直接把 x 放到输出数组的正确位置。<\/p>\n<pre><code>COUNTING-SORT(A, B, k)\n1  let C[0..k] be a new array\n2  for i = 0 to k: C[i] = 0\n3  for j = 1 to A.length: C[A[j]] += 1      // C[v] = 值 v 的个数\n4  for i = 1 to k: C[i] = C[i] + C[i-1]     // C[v] = ≤ v 的个数\n5  for j = A.length downto 1:               // 倒着扫,保稳定\n6      B[C[A[j]]] = A[j]\n7      C[A[j]] -= 1<\/code><\/pre>\n<p>复杂度 Θ(k + n) = Θ(n)（k = O(n) 时）。<strong>稳定<\/strong>：相同值元素在输出里保持输入里的相对顺序——这是基数排序依赖它的关键。<\/p>\n<h3>概念 3：基数排序（radix sort）（难度：基础）<\/h3>\n<p><strong>思想<\/strong>：像老式卡片排序机——按<strong>最低有效位<\/strong>到最高有效位逐位排，每一位用稳定排序（通常就是计数排序）。书中例子：d 位十进制数，从个位开始排一轮、十位再排一轮……共 d 轮。 复杂度：d 位、每位值域 0..k，用计数排序 ⇒ Θ(d(n+k))。当 d 是常数、k = O(n) 时为 Θ(n)。<strong>关键<\/strong>：每一轮必须是稳定的，否则高位排完会被低位洗回去。<\/p>\n<h3>概念 4：桶排序（bucket sort）（难度：进阶）<\/h3>\n<p><strong>前提<\/strong>：输入均匀分布在 [0,1)。 <strong>思想<\/strong>：把 [0,1) 切成 n 个等宽「桶」，元素按值扔进对应桶；每个桶内部用插入排序；最后按桶序串起来。因均匀分布，每桶元素期望 O(1)，总期望 <strong>Θ(n)<\/strong>。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n    A[输入 n 个数] --&gt; B{是比较排序吗?}\n    B --&gt;|是| C[决策树下界 Ω n lg n&lt;br/&gt;归并/堆排序达到此界]\n    B --&gt;|不是: 用元素值本身| D[计数排序 Θ n+k&lt;br/&gt;基数排序 Θ d n+k&lt;br/&gt;桶排序 期望 Θ n]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：分水岭在「要不要两两比较」。比较派被 Ω(n lg n) 卡死；不比较派靠「元素值的额外信息」突破。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：计数排序像「成绩单分类」——已知分数都在 0~100，直接开 101 个格子，每考分扔进对应格子，再按格子顺序倒出来。<strong>失效边界<\/strong>：分数若是 0~10⁹ 的任意整数，k 远大于 n，开格子就不划算。\n<\/li><li>\n<strong>实例<\/strong>：基数排序排 ⟨329, 457, 657, 839, 436, 720, 355⟩——先按个位（9,7,7,9,6,0,5）稳定排，再按十位，最后按百位，三轮后全局有序（书中图 8-3）。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为「线性排序比快排好」<\/strong>——实际上它们只在「元素值域小/分布均匀」的特定条件下成立；通用排序仍靠快排/归并。\n<\/li><li>\n<strong>别以为「计数排序不稳定就不能用」<\/strong>——实际上基数排序依赖它稳定；若自己写漏了第 5 行的「downto」倒扫，基数排序结果就错。\n<\/li><li>\n<strong>别以为「Ω(n lg n) 下界是算法无能」<\/strong>——它是对「只靠比较」这一模型的信息论下界；要突破必须利用元素的额外信息（值域、分布）。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n（单选）决策树下界证明 n! ≤ 2^h 推出 h ≥ ?（答案：B；解析：h ≥ lg(n!) = Ω(n lg n)）\n<ul>\n<li>\nA. Θ(n)   B. Ω(n lg n)   C. Ω(n²)   D. Ω(lg n)\n<\/li><li>\n（单选）计数排序适用条件是？（答案：C；解析：元素为 0..k 整数且 k=O(n)）\n<\/li><li>\nA. 任意实数   B. 字符串   C. 值域小的整数且 k=O(n)   D. 已部分有序\n<\/li><li>\n（填空）基数排序从最__有效位往最__有效位逐位排，每轮用__排序。（答案：低；高；稳定（计数）；解析：书中明确最低位先排、每轮稳定）\n<\/li><li>\n（简答）基数排序为什么每一轮必须稳定？（答案：高位排序后，低位的次序会被保留；若每轮不稳定，相同高位元素之间刚排好的低位顺序就被打乱，多轮累积后整体就错了）\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n比较排序下界 Ω(n lg n)（决策树 n! 叶）。\n<\/li><li>\n计数排序：值域小、Θ(n+k)、稳定。\n<\/li><li>\n基数排序：低位到高位、d 轮稳定排序、Θ(d(n+k))。\n<\/li><li>\n桶排序：均匀分布、期望 Θ(n)。\n<\/ul>", "ch09": "<h1>第 9 章：中位数和顺序统计量<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：2 小时 | <strong>前置<\/strong>：第 5、7 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n用成对比较在 3⌊n/2⌋ 次比较内同时找到最小值和最大值。\n<\/li><li>\n写出 RANDOMIZED-SELECT 的伪代码，说出它期望 Θ(n) 的原因。\n<\/li><li>\n了解最坏情况线性时间选择算法（BFPRT/中位数的中位数）的思想。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p><strong>「找第 i 小」不必先排序——快排的 PARTITION 只要递归一边，期望 Θ(n) 就能选中位数。<\/strong><\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：顺序统计量（order statistic）（难度：基础）<\/h3>\n<p><strong>第 i 个顺序统计量<\/strong>就是 n 个元素中第 i 小的元素。最常见的是最小值（i=1）、最大值（i=n）、中位数（i≈⌈n/2⌉）。<\/p>\n<h3>概念 2：同时找最小与最大（难度：基础）<\/h3>\n<p>naive 做法：最小值 n-1 次比较、最大值 n-1 次比较，共 2n-2 次。书中优化（书页 §9.1 已核对）：<strong>成对处理<\/strong>——先把两个元素互相比，小的去跟当前最小值比、大的去跟当前最大值比。每对只花 3 次比较。n 为奇/偶数初值不同，但总比较次数至多 <strong>3⌊n/2⌋<\/strong>。<\/p>\n<h3>概念 3：RANDOMIZED-SELECT（难度：进阶）<\/h3>\n<p>思路：像快排 PARTITION，但<strong>只递归主元所在的一边<\/strong>——因为第 i 小要么在左、要么在右、要么就是主元。<\/p>\n<pre><code>RANDOMIZED-SELECT(A, p, r, i)\n1  if p == r: return A[p]\n2  q = RANDOMIZED-PARTITION(A, p, r)\n3  k = q - p + 1          // 主元 A[q] 是第 k 小\n4  if i == k: return A[q]\n5  if i &lt; k: return RANDOMIZED-SELECT(A, p, q-1, i)\n6  else: return RANDOMIZED-SELECT(A, q+1, r, i-k)<\/code><\/pre>\n<p><strong>关键<\/strong>：不像快排递归两边，只递归一边——期望运行时间 <strong>Θ(n)<\/strong>（书中 §9.2 证明）。对比：快排期望 Θ(n lg n)，因为它两边都要排。<\/p>\n<h3>概念 4：最坏线性时间（SELECT，BFPRT）（难度：高难，了解思想）<\/h3>\n<p>RANDOMIZED-SELECT 最坏仍是 Θ(n²)（总切偏）。书中 §9.3 给出最坏也线性的算法「中位数的中位数」：把 n 个元素 5 个一组分组、每组取中位数、再对这些中位数递归取中位数，以它作主元——保证每轮至少 3n/10 左右被切走，递归式 T(n) ≤ T(⌈n/5⌉) + T(7n/10) + Θ(n) ⇒ <strong>T(n) = Θ(n)<\/strong>。这就是著名的 BFPRT 算法。工程中很少用（常数太大），但理论上证明「选择可以最坏线性」。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[PARTITION 后, 主元 q 是第 k 小] --&gt; B{i 与 k 比}\n    B --&gt;|i = k| C[主元就是答案]\n    B --&gt;|i &lt; k| D[只在左半 A[p..q-1] 递归找第 i 小]\n    B --&gt;|i &gt; k| E[只在右半 A[q+1..r] 递归找第 i-k 小]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：与快排最大的区别——只走一条分支，所以期望代价不是 n lg n 而是 n。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：在一堆报名者里挑「第 10 名」，不必把所有人都排名——随便挑一人当标杆，比他小的放左边、大的放右边，看「第 10」在左还是右，继续在那一边找。<strong>失效边界<\/strong>：若每次标杆都是最大或最小（坏运气），就退化到 Θ(n²)；随机化主元正是为了防这个。\n<\/li><li>\n<strong>实例<\/strong>：A = ⟨3, 2, 9, 0, 7, 5, 4, 8, 6, 1⟩ 找第 5 小。某次 PARTITION 后主元 k=4，i=5&gt;k ⇒ 到右半找第 i-k=1 小。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为「选中位数必须先排序」<\/strong>——实际上 RANDOMIZED-SELECT 期望 Θ(n)，比排序的 Θ(n lg n) 快。\n<\/li><li>\n<strong>别以为「RANDOMIZED-SELECT 最坏也快」<\/strong>——实际上它期望 Θ(n)，最坏 Θ(n²)；想要最坏线性得用 BFPRT，但常数巨大不实用。\n<\/li><li>\n<strong>别以为「找最小最大要 2n-2 次比较」<\/strong>——实际上成对比较只要 3⌊n/2⌋ 次。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n（单选）RANDOMIZED-SELECT 的期望运行时间是？（答案：B；解析：只递归一边，书中证明 Θ(n)）\n<ul>\n<li>\nA. Θ(n lg n)   B. Θ(n)   C. Θ(n²)   D. Θ(lg n)\n<\/li><li>\n（单选）同时找最小和最大值，最优比较次数约为？（答案：C；解析：成对比较 3⌊n/2⌋）\n<\/li><li>\nA. 2n   B. n   C. 3⌊n/2⌋   D. n lg n\n<\/li><li>\n（填空）BFPRT 算法通过「中位数的中位数」选主元，保证最坏运行时间为 Θ(__)。（答案：n；解析：T(n)=Θ(n)）\n<\/li><li>\n（简答）RANDOMIZED-SELECT 为什么比快排快一个量级？（答案：快排要递归排序左右两半，总代价 n lg n；SELECT 只在包含第 i 小的那一半递归，每轮丢弃一半，期望总代价 n + n/2 + n/4 + … = Θ(n)）\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n顺序统计量 = 第 i 小；最小/最大/中位数。\n<\/li><li>\n成对比较找最值：3⌊n/2⌋ 次。\n<\/li><li>\nRANDOMIZED-SELECT 期望 Θ(n)，只递归一边。\n<\/li><li>\nBFPRT：最坏 Θ(n)，但常数大不实用。\n<\/ul>", "ch10": "<h1>第 10 章：基本数据结构<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★☆☆ | <strong>预估学时<\/strong>：1.5 小时 | <strong>前置<\/strong>：第 2 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说出栈（LIFO）与队列（FIFO）的区别与数组实现。\n<\/li><li>\n用数组/链表表示动态集合，理解指针与对象的实现方式。\n<\/li><li>\n用左孩子右兄弟法表示有根树。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p><strong>栈「后进先出」、队列「先进先出」——它们是一切复杂数据结构的积木；指针和对象只是把数组里的位置串起来。<\/strong><\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：栈（stack）（难度：基础）<\/h3>\n<p><strong>栈<\/strong>是只在一端（栈顶）操作的动态集合：INSERT 叫<strong>压入 PUSH<\/strong>，DELETE 叫<strong>弹出 POP<\/strong>。它是<strong>后进先出（LIFO, last-in first-out）<\/strong>——像餐厅摞起来的弹簧盘子，只能取最上面那个。 数组实现：用 S[1..n] 和一个属性 S.top 指向最新元素。S.top = 0 表示空；对空栈 POP 叫<strong>下溢 underflow<\/strong>，S.top 超过 n 叫<strong>上溢 overflow<\/strong>。<\/p>\n<pre><code>STACK-EMPTY(S): if S.top == 0 then TRUE else FALSE\nPUSH(S, x): S.top = S.top + 1; S[S.top] = x\nPOP(S):     if STACK-EMPTY(S): error else S.top = S.top - 1; return S[S.top+1]<\/code><\/pre>\n<h3>概念 2：队列（queue）（难度：基础）<\/h3>\n<p><strong>队列<\/strong>是<strong>先进先出（FIFO）<\/strong>：INSERT 叫<strong>入队 ENQUEUE<\/strong>，DELETE 叫<strong>出队 DEQUEUE<\/strong>——删的是队列中存在最久的元素。数组实现用 head（队头）与 tail（队尾）两个指针；当 tail 走到末尾就绕回开头（循环队列）。<\/p>\n<h3>概念 3：链表（linked list）（难度：基础）<\/h3>\n<p><strong>链表<\/strong>中每个对象有 key、next（指向后继）、prev（指向前驱，双向链）。SEARCH 线性扫描 O(n)；INSERT 挂到表头 O(1)；DELETE 按指针 O(1)。<strong>哨兵（sentinel）<\/strong>是一个哑对象，简化边界判断——红黑树那章会用到。<\/p>\n<h3>概念 4：指针与对象的实现（难度：进阶）<\/h3>\n<p>书中 §10.3 说明：对象不必用语言自带指针，用多个数组（key 数组、next 数组、prev 数组）按下标关联即可——「指针」就是数组下标。这是把「对象」翻译成连续内存的办法。<\/p>\n<h3>概念 5：有根树的表示（难度：基础）<\/h3>\n<ul><li>\n二叉树：left、right 两个指针。\n<\/li><li>\n任意树（孩子数不定）：<strong>左孩子右兄弟<\/strong>表示法——每个结点存 left-child 与 right-sibling，把任意度的树压成二叉树形状。\n<\/ul>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n    subgraph 栈[LIFO 像摞盘子]\n    A[压入 1] --&gt; B[压入 2] --&gt; C[弹出 2] --&gt; D[弹出 1]\n    end\n    subgraph 队列[FIFO 像排队]\n    E[入队 1] --&gt; F[入队 2] --&gt; G[出队 1] --&gt; H[出队 2]\n    end<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：栈里「后压入的先弹出」；队列里「先入队的先出队」。这两种相反的取出顺序决定了它们分别用于「回溯」（栈）与「排队」（队列）。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：栈 = 浏览器后退（最后打开的页面先退）；队列 = 打印机任务（先提交先打印）。<strong>失效边界<\/strong>：栈不能「取中间的元素」，队列不能「插队」——要这种灵活性就得用更复杂的结构（优先队列）。\n<\/li><li>\n<strong>实例<\/strong>：依次 PUSH 9、4、2，POP 一次返回 2；依次 ENQUEUE 9、4、2，DEQUEUE 一次返回 9。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为「栈和堆（内存）是一回事」<\/strong>——本书这里的栈是数据结构 LIFO；与 Java 垃圾回收的「堆」无关。\n<\/li><li>\n<strong>别以为「链表查找快」<\/strong>——实际上链表只能从头扫，SEARCH 是 O(n)，数组随机访问才 O(1)。\n<\/li><li>\n<strong>别以为「队列删除队头要搬移」<\/strong>——循环队列用 head/tail 指针绕回，不搬移元素。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n（单选）栈的取出顺序是？（答案：B；解析：LIFO 后进先出）\n<ul>\n<li>\nA. FIFO   B. LIFO   C. 随机   D. 按优先级\n<\/li><li>\n（单选）队列的取出顺序是？（答案：A；解析：FIFO 先进先出）\n<\/li><li>\nA. FIFO   B. LIFO   C. 按大小   D. 逆序\n<\/li><li>\n（填空）栈用 S[1..n] 与属性 S.__ 指向最新元素。（答案：top；解析：书中数组实现）\n<\/li><li>\n（简答）哨兵（sentinel）有什么用？（答案：一个哑对象充当边界，使链表/树操作不必每次判「是否为空」，把边界情况统一成普通情况，简化代码）\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n栈 LIFO（PUSH/POP），队列 FIFO（ENQUEUE/DEQUEUE）。\n<\/li><li>\n链表 O(1) 插删、O(n) 查找；哨兵简化边界。\n<\/li><li>\n任意树用左孩子右兄弟压成二叉树表示。\n<\/ul>", "ch11": "<h1>第 11 章：散列表<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：2.5 小时 | <strong>前置<\/strong>：第 10 章、第 5 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n解释「直接寻址」与「散列」的区别，说出<strong>冲突（collision）<\/strong>是什么。\n<\/li><li>\n用链接法与开放寻址法（线性/二次/双重探查）解决冲突。\n<\/li><li>\n说出均匀散列假设下，SEARCH 的期望时间 O(1)，以及全域散列为什么不怕恶意输入。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p><strong>散列表 = 用散列函数把关键字「压缩」成数组下标，平均 O(1) 完成插入/查找/删除——冲突靠链接或探查来化解。<\/strong><\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：直接寻址 vs 散列（难度：基础）<\/h3>\n<p><strong>直接寻址表<\/strong> T[0..m-1]：关键字 k 直接当下标，T[k] 存元素。问题：当关键字全域 U 很大（如所有字符串），开 m 个槽根本不现实。 <strong>散列表<\/strong>：槽数 m 与「实际存储的关键字数 n」成比例，用<strong>散列函数 h(k)<\/strong> 把 k 映射到 0..m-1。两个不同关键字 k₁≠k₂ 但 h(k₁)=h(k₂) 叫<strong>冲突（collision）<\/strong>。<\/p>\n<h3>概念 2：链接法（chaining）（难度：基础）<\/h3>\n<p>每个槽 T[j] 挂一个链表，所有散列到 j 的元素都串在这条链上。SEARCH 时先算 h(k)、再扫那条链。<\/p>\n<ul><li>\n装填因子 α = n/m（每个槽期望挂几个元素）。\n<\/li><li>\n均匀散列假设下：不成功查找期望 O(1+α)，成功查找也 O(1+α)。α 是常数 ⇒ O(1)。最坏（全冲突）Θ(n)。\n<\/ul>\n<h3>概念 3：散列函数（难度：进阶）<\/h3>\n<p>好的散列函数要「近似均匀」——每个关键字等可能落到任一槽。书中介绍：<\/p>\n<ul><li>\n<strong>除法散列<\/strong>：h(k) = k mod m（m 别取 2 的幂附近、别取太巧的数）。\n<\/li><li>\n<strong>乘法散列<\/strong>：h(k) = ⌊m(kA mod 1)⌋，0 &lt; A &lt; 1。\n<\/li><li>\n<strong>全域散列（universal hashing）<\/strong>：运行时从一簇函数里<strong>随机挑一个<\/strong> h。定理 11.3：k 不在表中时含 k 的链期望长度 ≤ α；在表中时 ≤ 1+α。推论 11.4：对手无法预先构造「总让你冲突」的输入——因为散列函数是随机选的。\n<\/ul>\n<h3>概念 4：开放寻址法（open addressing）（难度：进阶）<\/h3>\n<p>不挂链表：所有元素直接存在散列表里。冲突时按一个<strong>探查序列<\/strong>往下找空位。三种探查（书页已核对）：<\/p>\n<ul><li>\n<strong>线性探查<\/strong>：h(k, i) = (h&#x27;(k) + i) mod m。问题：<strong>一次群集（primary clustering）<\/strong>——连续被占的槽越来越长。\n<\/li><li>\n<strong>二次探查<\/strong>：h(k, i) = (h&#x27;(k) + c₁i + c₂i²) mod m。仍有轻度<strong>二次群集<\/strong>。\n<\/li><li>\n<strong>双重散列<\/strong>：h(k, i) = (h₁(k) + i·h₂(k)) mod m——探查序列既依赖起始位置又依赖步长，是开放寻址里最好的方法之一（h₂(k) 要与 m 互素）。\n<\/ul>\n<p>均匀散列假设：每个关键字的探查序列是 (0,1,…,m-1) 的 m! 种排列之一。不成功探查期望 O(1/(1−α))。<\/p>\n<h3>概念 5：完全散列（perfect hashing）（难度：高难，了解）<\/h3>\n<p>关键字集合静态（不再增删）时，用两层散列做到<strong>最坏 O(1)<\/strong> 查找——第一层散列，第二层对每个槽再开一个小散列表并保证无冲突。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[关键字 k] --&gt; B[散列函数 h k]\n    B --&gt; C{槽 h k 有冲突?}\n    C --&gt;|链接法| D[挂链表, 扫链]\n    C --&gt;|开放寻址| E[按探查序列 h k, i 找空位]\n    D --&gt; F[平均 O 1+α]\n    E --&gt; F<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：先把 k 压缩成下标，冲突时要么串链（链接法），要么按序列往下找（开放寻址）。两条路平均都是常数。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：散列函数像「按姓氏首字母分到 26 个班」——冲突（同姓）靠「同班的坐一张长凳」（链接法）或「往下找空位」（开放寻址）。<strong>失效边界<\/strong>：若散列函数极差（全挤一个班），就退化成链表 Θ(n)；全域散列就是「随机换一种分班规则」防有人故意全报同姓。\n<\/li><li>\n<strong>实例<\/strong>：m=9，关键字 10, 22, 33 经 h(k)=k mod 9：10→1、22→4、33→6，各落各槽；若再来 4（mod 9=4）与 22 冲突，链接法就在槽 4 挂 ⟨22, 4⟩。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为「散列表最坏也是 O(1)」<\/strong>——实际上最坏 Θ(n)（全冲突）；只有均匀散列假设下期望 O(1)。\n<\/li><li>\n<strong>别以为「开放寻址法不占额外空间就一定省」<\/strong>——实际上它装填因子 α 必须控制在 &lt; 1，表要留空，否则探查序列会失效。\n<\/li><li>\n<strong>别以为「双重散列 h₂(k) 可以随便取」<\/strong>——实际上 h₂(k) 要与 m 互素（m 取素数或 h₂ 总返回奇数），否则探查序列走不到所有槽。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n（单选）装填因子 α 的定义是？（答案：A；解析：α = n/m，平均每槽元素数）\n<ul>\n<li>\nA. n/m   B. m/n   C. n·m   D. n+m\n<\/li><li>\n（多选）开放寻址法常用的探查技术有？（答案：A、B、C；解析：书中列线性/二次/双重三种）\n<\/li><li>\nA. 线性探查   B. 二次探查   C. 双重散列   D. 二分探查\n<\/li><li>\n（填空）双重散列公式 h(k,i) = (h₁(k) + i·__(k)) mod m。（答案：h₂；解析：书中公式）\n<\/li><li>\n（简答）为什么要全域散列？（答案：固定散列函数时，对手可构造总冲突的关键字；运行时从一簇函数随机选一个，使任何输入的期望链长都 ≤ 1+α，从根上免疫恶意输入）\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n散列 = h(k) 把关键字压成下标；冲突不可避免。\n<\/li><li>\n链接法：期望 O(1+α)；开放寻址：线性/二次/双重探查。\n<\/li><li>\n全域散列随机选函数，最坏免疫；完全散列静态集合最坏 O(1)。\n<\/ul>", "ch12": "<h1>第 12 章：二叉搜索树<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：2 小时 | <strong>前置<\/strong>：第 10 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n写出二叉搜索树（BST）的性质，并据此查找 MINIMUM/MAXIMUM/SUCCESSOR。\n<\/li><li>\n描述 BST 的 INSERT 与 DELETE 过程。\n<\/li><li>\n解释为什么 BST 操作时间与树高成正比，以及随机 BST 的期望高度。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p><strong>左子树全 ≤ 根、右子树全 ≥ 根——这条性质让「查找/插入/删除」都只走一条从根到叶的路径，时间等于树高。<\/strong><\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：BST 性质（书页 §12.1 已核对）<\/h3>\n<p>对任意结点 x：左子树中所有结点 y 满足 y.key ≤ x.key；右子树中所有结点 y 满足 y.key ≥ x.key。这叫<strong>二叉搜索树性质<\/strong>。直接推论：<strong>中序遍历<\/strong>（左→根→右）输出的是按 key 排好序的序列。<\/p>\n<h3>概念 2：基本操作（难度：基础）<\/h3>\n<p>所有操作从根出发，沿一条路径下滑，代价 = 树高 h：<\/p>\n<ul><li>\n<strong>SEARCH(x, k)<\/strong>：从根开始，k &lt; 当前 key 走左、k &gt; 当前 key 走右。O(h)。\n<\/li><li>\n<strong>MINIMUM<\/strong>：一路往左到最左结点。O(h)。\n<\/li><li>\n<strong>MAXIMUM<\/strong>：一路往右到最右结点。O(h)。\n<\/li><li>\n<strong>SUCCESSOR(x)<\/strong>：x 有右子树 → 右子树的最左；否则往上找到「第一个把 x 放在其左子树里的祖先」。O(h)。\n<\/li><li>\n<strong>INSERT<\/strong>：SEARCH 找到该插入的叶子空位，挂上。O(h)。\n<\/li><li>\n<strong>DELETE<\/strong>（分三种情况）：\n<ol>\n<li>\n无子：直接删。\n<\/li><li>\n一个子：用子顶替。\n<\/li><li>\n两个子：找后继（右子树最左）y，用 y.key 顶替 x，再删 y（y 至多一个子）。O(h)。\n<\/ol>\n<\/ul>\n<h3>概念 3：树高问题（难度：进阶）<\/h3>\n<ul><li>\n完全平衡树：h = Θ(lg n)，操作都快。\n<\/li><li>\n最坏：插入有序序列 ⇒ 树退化成 n 个结点的链，h = Θ(n)，操作与链表一样慢。\n<\/li><li>\n<strong>随机构造的 BST<\/strong>（§12.4）：期望高 O(lg n) ⇒ 操作平均 Θ(lg n)。\n<\/ul>\n<p>这就是第 13 章红黑树要解决的问题：用颜色约束保证 h = O(lg n)。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    R[根 6] --&gt; L[左子 5: 全 ≤ 6]\n    R --&gt; RR[右子 7: 全 ≥ 6]\n    L --&gt; L1[2]\n    L --&gt; L2[5]\n    RR --&gt; RR1[7]\n    RR --&gt; RR2[8]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：每个结点都比左子树所有值大、比右子树所有值小。查找 7：从 6 起，7&gt;6 走右，命中。查找 2：2&lt;6 走左、2&lt;5 走左，命中。每次只走一条路径。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：BST 像「按字典序分叉的目录树」——在每个分叉点，左边是 smaller half、右边是 larger half。<strong>失效边界<\/strong>：如果插入顺序不幸（1,2,3,4,5…），树就成了一条斜链，失去二分优势。\n<\/li><li>\n<strong>实例<\/strong>：书上例图 12-1：根 6，左子 5（再左 2、右 5），右子 7（再右 8）。中序遍历输出 2, 5, 5, 6, 7, 8——排好序。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为「BST 操作都是 O(lg n)」<\/strong>——实际上操作时间 = 树高；树退化时是 O(n)。\n<\/li><li>\n<strong>别以为「删结点就直接摘掉」<\/strong>——两个子时必须用后继顶替，保持 BST 性质。\n<\/li><li>\n<strong>别以为「中序遍历是排序的副产品」<\/strong>——它恰恰是 BST 性质的直接体现：左根右 = 升序。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n（单选）BST 的中序遍历输出是？（答案：B；解析：左→根→右 = 升序）\n<ul>\n<li>\nA. 降序   B. 升序   C. 随机   D. 按插入序\n<\/li><li>\n（单选）BST 上 SEARCH 的时间是？（答案：C；解析：从根到叶一条路径，= O(h)，平衡时 O(lg n)）\n<\/li><li>\nA. O(1)   B. O(n)   C. O(h)   D. O(n²)\n<\/li><li>\n（填空）x 有右子树时，x 的后继是右子树的最__结点。（答案：左；解析：SUCCESSOR 规则）\n<\/li><li>\n（简答）按 1,2,3,4,5 顺序插入 BST 会怎样？（答案：每个新结点都比前一个大，全挂在右链上，树退化成高度 Θ(n) 的链，查找变成线性扫描——这就是需要红黑树的原因）\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\nBST 性质：左 ≤ 根 ≤ 右；中序 = 升序。\n<\/li><li>\nSEARCH/MIN/MAX/SUCCESSOR/INSERT/DELETE 都是 O(h)。\n<\/li><li>\n退化 BST = 链；随机 BST 期望 O(lg n)；红黑树保证最坏 O(lg n)。\n<\/ul>", "ch13": "<h1>第 13 章：红黑树<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：3 小时 | <strong>前置<\/strong>：第 12 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n列出红黑树的五条性质，并解释它们为什么保证树高 O(lg n)。\n<\/li><li>\n说出「旋转（rotation）」在保持 BST 性质的同时怎么改变结构。\n<\/li><li>\n描述 RB-INSERT 后用 RB-INSERT-FIXUP（重新着色 + 旋转）恢复性质的思路。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p><strong>给 BST 的每个结点涂红或黑，用「红父不能有红子」和「每条路径黑点数相同」两条约束，把树死死摁在近似平衡——高度 ≤ 2 lg(n+1)。<\/strong><\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：五条红黑性质（书页 §13.1 已核对）<\/h3>\n<ol><li>\n每个结点或是红色，或是黑色。\n<\/li><li>\n根结点是黑色。\n<\/li><li>\n每个叶结点（NIL 哨兵）是黑色。\n<\/li><li>\n如果一个结点是红色的，则它的两个子结点都是黑色（<strong>红父无红子<\/strong>）。\n<\/li><li>\n对每个结点，从该结点到其所有后代叶结点的简单路径上，黑结点数相同——这个数叫该结点的<strong>黑高 bh(x)<\/strong>。\n<\/ol>\n<h3>概念 2：为什么高是 O(lg n)（难度：进阶）<\/h3>\n<p><strong>引理 13.1<\/strong>：有 n 个内部结点的红黑树高度至多为 2 lg(n+1)。 白话推理：由性质 4，任意路径上红结点不能相邻 ⇒ 黑结点至少占一半。由性质 5，黑高 bh 的子树至少有 2^{bh} − 1 个内部结点。于是 n ≥ 2^{bh} − 1，bh ≥ lg(n+1)；而树高 ≤ 2·bh（红黑相间最多让高度翻倍）⇒ h ≤ 2 lg(n+1)。<strong>所以所有 BST 操作最坏 O(lg n)<\/strong>。<\/p>\n<h3>概念 3：旋转（rotation）（难度：进阶）<\/h3>\n<p><strong>左旋 LEFT-ROTATE(T, x)<\/strong>：把 x 与其右子 y 「转一下」——y 上位、x 下位、y 的左子变成 x 的右子。旋转保持 BST 性质（key 大小关系不变），只改变树结构。旋转是 O(1) 局部操作，插入/删除后用它「扶正」被破坏的平衡。<\/p>\n<h3>概念 4：插入与修复（难度：高难）<\/h3>\n<p><strong>RB-INSERT<\/strong>：像普通 BST 一样插入 z，然后<strong>把 z 着成红色<\/strong>（着红才不改变黑高，否则整棵树黑高+1 代价太大）。但红 z 可能导致「红父红子」——调用 <strong>RB-INSERT-FIXUP<\/strong>：按「叔叔结点」的颜色分情况，重新着色 + 旋转，直到性质恢复。书页给出的 FIXUP 结构：<\/p>\n<ul><li>\n情况 1：叔叔是红 → 父、叔变黑，祖父变红，z 上移到祖父。\n<\/li><li>\n情况 2/3：叔叔是黑 → 按方向旋转，完成修复。\n<\/ul>\n<p>整轮插入 O(lg n)。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[BST 退化成链 h=n] --&gt; B[加颜色约束 5 条性质]\n    B --&gt; C[红父无红子 + 每条路径黑点数相同]\n    C --&gt; D[任意路径 ≤ 2·bh, 树高 ≤ 2 lg n+1]\n    D --&gt; E[SEARCH/INSERT/DELETE 全部最坏 O lg n]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：红黑树的本质是「给 BST 上保险」——用颜色把树锁在平衡区间，不让它退化成链。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：红黑树像「交通灯管制」——红灯（红结点）不能连红灯（红父无红子），每条路从根到灯杆要经过的黑灯数一样（黑高相同）。<strong>失效边界<\/strong>：颜色规则只保证「近似平衡」，不保证绝对平衡——允许一边比另一边深一倍。\n<\/li><li>\n<strong>实例<\/strong>：书中图 13-1 的红黑树：黑根、黑叶、红结点的子都是黑的。插入一个红结点后可能出现「红爷爷红爸爸」，FIXUP 把爷爷转黑、爸爸转红、再旋转——像重新洗牌。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为「红黑树就是完全平衡」<\/strong>——实际上它只保证 h ≤ 2 lg(n+1)，允许左右高度差一倍。AVL 树更严格，但红黑树插入旋转次数更少，工程（如 Linux 进程调度、Java TreeMap）更爱用。\n<\/li><li>\n<strong>别以为「插入把新结点着黑更省事」<\/strong>——实际上着黑会改变黑高，整棵树都要修；着红只可能破坏「红父无红子」一条，FIXUP 范围小。\n<\/li><li>\n<strong>别以为「旋转会破坏 BST 性质」<\/strong>——实际上旋转只换父子关系，key 大小顺序在中序遍历里完全不变。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n（多选）下列哪些是红黑树的性质？（答案：A、B、C；解析：书中 5 条——根黑、红父无红子、每条路径黑点数相同；D 错，不要求左右等高）\n<ul>\n<li>\nA. 根结点是黑的\n<\/li><li>\nB. 红结点的两个子都是黑的\n<\/li><li>\nC. 从任意结点到叶的所有路径黑点数相同\n<\/li><li>\nD. 左右子树高度必须相等\n<\/li><li>\n（单选）引理 13.1 给出 n 个内部结点红黑树的高度上界是？（答案：C；解析：书中 h ≤ 2 lg(n+1)）\n<\/li><li>\nA. Θ(1)   B. Θ(lg n)   C. 2 lg(n+1)   D. Θ(n)\n<\/li><li>\n（填空）新插入的结点 z 被着成__色，以免改变树的黑高。（答案：红；解析：着黑会让黑高+1）\n<\/li><li>\n（简答）旋转为什么不破坏 BST 性质？（答案：旋转只调整父子指针，中序遍历的 key 顺序完全不变；左旋后 y 上位、x 下位、y 的左子挪给 x，key 的大小关系仍满足左≤根≤右）\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n5 条性质核心：红父无红子 + 黑高相同。\n<\/li><li>\n引理：h ≤ 2 lg(n+1) ⇒ 所有操作 O(lg n)。\n<\/li><li>\n旋转 O(1) 扶正；插入着红 + FIXUP 着色旋转恢复性质。\n<\/ul>", "ch14": "<h1>第 14 章：数据结构的扩张<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：2 小时 | <strong>前置<\/strong>：第 13 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说出「数据结构扩张」的标准四步法。\n<\/li><li>\n在红黑树每个结点上维护 size 属性，实现 O(lg n) 查第 i 小与查秩。\n<\/li><li>\n用区间树快速找出「与给定区间重叠的区间」。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p><strong>不用发明新结构——在红黑树每个结点上多存一个「子树大小/区间端点」的汇总信息，就能直接得到顺序统计树与区间树。<\/strong><\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：数据结构扩张四步法（书页 §14.2）<\/h3>\n<ol><li>\n选一个基础数据结构（如红黑树）。\n<\/li><li>\n在每个结点加一个<strong>新属性<\/strong>（如 size），并说明这个属性怎么由现有属性算出来。\n<\/li><li>\n保证插入/删除时能<strong>维护<\/strong>这个新属性（旋转时也要更新）。\n<\/li><li>\n设计新操作。\n<\/ol>\n<h3>概念 2：顺序统计树（order-statistic tree）（难度：进阶）<\/h3>\n<p>在红黑树每个结点 x 上多加一个属性 <strong>x.size<\/strong> = 以 x 为根的子树（含 x）的内部结点数。递推式（书页已核对）：<\/p>\n<pre><code>x.size = x.left.size + x.right.size + 1<\/code><\/pre>\n<ul><li>\n<strong>查询第 i 小（SELECT）<\/strong>：从根走，根左子树大小 r = left.size。若 i = r+1，根就是第 i 小；i ≤ r 走左；i &gt; r+1 走右并把 i 减去 (r+1)。O(lg n)。\n<\/li><li>\n<strong>查秩（RANK）<\/strong>：元素 x 在中序遍历中的位置。O(lg n)。\n<\/ul>\n<h3>概念 3：区间树（interval tree）（难度：高难）<\/h3>\n<p>需求：存一组区间（如时间区间），快速找出「与给定区间 [t₁, t₂] 重叠的区间」。 做法：在红黑树里以区间左端点为 key；每个结点 x 多存 <strong>x.max<\/strong> = 以 x 为根的子树中所有区间右端点的最大值。查找时：若查询区间与 x 重叠就返回 x；否则左子树 max ≥ 左端 → 走左，否则走右。O(lg n)。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n    A[基础: 红黑树 O lg n] --&gt; B[每个结点多存 size 或 max]\n    B --&gt; C[插入/删除/旋转时同步更新该属性]\n    C --&gt; D[新操作: 第i小 / 查秩 / 区间重叠查询]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：扩张 = 给老结构加「汇总信息」，而不是推倒重来。size 让树「知道」自己第 i 小；max 让树「知道」哪边可能藏着重叠区间。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：给组织架构图每个部门标注「本部门共多少人」（size），一眼就能数出全公司第 100 号员工在哪。<strong>失效边界<\/strong>：加属性后每次旋转/插入都得记得更新，否则 size 过期、答案就错。\n<\/li><li>\n<strong>实例<\/strong>：顺序统计树根 size=10，左子树 size=4。查第 5 小：5 &gt; 4+1，去右子树找第 5−5=0…（具体按递推）。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为「扩张数据结构要从零发明」<\/strong>——实际上书中的核心方法就是「在红黑树结点上加一个维护好的汇总字段」。\n<\/li><li>\n<strong>别以为「加 size 会让插入变 O(n)」<\/strong>——实际上 size 只在从根到插入点的路径上变化，每次 O(1) 更新，总 O(lg n)。\n<\/li><li>\n<strong>别以为「区间重叠要两两比」<\/strong>——实际上 max 属性让查找每次只走一条路径，O(lg n)。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n（单选）顺序统计树结点 size 的定义是？（答案：B；解析：x.size = left.size + right.size + 1，含自身）\n<ul>\n<li>\nA. 左子树大小   B. 含自身的子树结点数   C. 右子树大小   D. 整棵树结点数\n<\/li><li>\n（单选）区间树每个结点 x 维护的 max 是什么？（答案：C；解析：子树中所有区间右端点的最大值）\n<\/li><li>\nA. 左端点最大值   B. 右端点最小值   C. 子树右端点最大值   D. 区间中点\n<\/li><li>\n（填空）查第 i 小的 SELECT 操作时间是 O(__ n)。（答案：lg；解析：沿一条路径下滑）\n<\/li><li>\n（简答）旋转时为什么要更新 size？（答案：旋转改变了左右子树结构，size 是子树汇总值；若不更新，后续 SELECT/RANK 读到的 size 是过期的，会给出错误名次）\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n扩张四步：选基础结构 → 加属性 → 维护属性 → 设计新操作。\n<\/li><li>\n顺序统计树：size 字段，O(lg n) 查第 i 小与秩。\n<\/li><li>\n区间树：max 字段，O(lg n) 查重叠区间。\n<\/ul>", "ch15": "<h1>第 15 章：动态规划<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：4 小时 | <strong>前置<\/strong>：第 2、4 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说出动态规划适用的两个特征：<strong>最优子结构<\/strong>与<strong>重叠子问题<\/strong>。\n<\/li><li>\n用四步法解钢条切割、矩阵链乘法、LCS、最优二叉搜索树。\n<\/li><li>\n区分「自底向上填表」与「带备忘的自顶向下」两种实现。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p><strong>递归会反复算同一个子问题——把它算一次存进表，下次直接查表：最优解 = 表中一格一格推出来的。<\/strong><\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：DP 适用的两个特征（难度：基础）<\/h3>\n<p>书页 §15.3：能用动态规划（DP）的问题必须有：<\/p>\n<ul><li>\n<strong>最优子结构（optimal substructure）<\/strong>：问题的最优解由相关子问题的最优解组合而成。\n<\/li><li>\n<strong>重叠子问题（overlapping subproblems）<\/strong>：递归过程反复遇到同一个子问题（不是像分治那样每次生成全新子问题）。\n<\/ul>\n<h3>概念 2：DP 四步法（书页 §15 已核对）<\/h3>\n<ol><li>\n刻画一个最优解的结构特征。\n<\/li><li>\n递归地定义最优解的值。\n<\/li><li>\n自底向上计算最优值。\n<\/li><li>\n利用算出的信息构造最优解。\n<\/ol>\n<h3>概念 3：钢条切割（难度：基础）<\/h3>\n<p>长度 n 英寸钢条，价格表 pᵢ（长度 i 的售价）。求切割方案使总收益 rₙ 最大。 递归式：rₙ = max_{1≤i≤n}(pᵢ + r_{n−i})——第一刀切下长度 i 卖 pᵢ，剩下 n−i 递归最优。 朴素递归是指数级；<strong>自底向上<\/strong>填表 r[0..n] 后 O(n²)。书页价格例：长度 1..10 价格 [1,5,8,9,10,17,17,20,24,30]。<\/p>\n<h3>概念 4：矩阵链乘法（难度：进阶）<\/h3>\n<p>给矩阵链 A₁A₂…Aₙ（Aᵢ 尺寸 p_{i−1}×pᵢ），求最优括号化使标量乘法次数最少。 递归式（书页 eq 15.7）：<\/p>\n<pre><code>m[i,j] = 0                                    若 i=j\nm[i,j] = min_{i≤k&lt;j}(m[i,k] + m[k+1,j] + p_{i−1}p_k p_j)   若 i&lt;j<\/code><\/pre>\n<p>s[i,j] 记录最优分割点 k。子问题共 Θ(n²) 个，填表 O(n³)。<\/p>\n<h3>概念 5：最长公共子序列 LCS（难度：进阶）<\/h3>\n<p>X = ⟨x₁..xₘ⟩，Y = ⟨y₁..yₙ⟩。定理 15.1（最优子结构，书页已核对）：<\/p>\n<ul><li>\n若 xₘ = yₙ，则 LCS = xₘ + LCS(X_{m−1}, Y_{n−1})；\n<\/li><li>\n若不等，则 max(LCS(X_{m−1}, Y), LCS(X, Y_{n−1}))。\n<p>填表 c[i,j] = LCS 长度，O(mn)，并回溯构造序列。书页例：X=⟨A,B,C,B,D,A,B⟩，Y=⟨B,D,C,A,B,A⟩，LCS=⟨B,C,B,A⟩ 长 4。<\/p>\n<\/ul>\n<h3>概念 6：最优二叉搜索树（难度：高难，了解）<\/h3>\n<p>已知各关键字查找概率，构造期望查找代价最小的 BST。递归式 e[i,j] = min_{i≤k≤j}(e[i,k−1]+e[k+1,j]+w(i,j))，O(n³)。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[递归式直接算] --&gt; B{子问题重复吗?}\n    B --&gt;|不重复: 分治| C[分治法]\n    B --&gt;|重复: 重叠子问题| D[建表 m, 自底向上填]\n    D --&gt; E[每格由更小格推出, O n² 或 O n³]\n    E --&gt; F[回溯 s 表构造最优解]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：判断要不要用 DP 的关键是「递归是不是在反复算同一个子问题」。是 → 建表；不是 → 普通分治就够。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：DP 像「背公式表做题」——同一道中间题只算一次，把答案写在草稿表上，后面再遇到直接翻表。<strong>失效边界<\/strong>：若子问题不重叠（每次都是全新），建表反而浪费空间，直接递归即可。\n<\/li><li>\n<strong>实例<\/strong>：钢条 n=4，价格 p=[1,5,8,9]。r₁=1，r₂=max(2·1,5)=5，r₃=max(1+r₂,5+r₁,8)=8，r₄=max(1+r₃,5+r₂,8+r₁,9)=10（切 2+2）。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为「DP 就是递归」<\/strong>——实际上朴素递归遇到重叠子问题是指数级；DP 的本质是「算一次存起来」。\n<\/li><li>\n<strong>别以为「最优子结构到处都成立」<\/strong>——实际上不是所有问题都有；比如求最短路有，求最长简单路就没有（会失效）。\n<\/li><li>\n<strong>别以为「自顶向下一定慢」<\/strong>——带备忘（memoized）的自顶向下与自底向上同阶，只是只算用到的子问题，有时更省。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n（多选）动态规划适用的两个特征是？（答案：A、C；解析：最优子结构 + 重叠子问题）\n<ul>\n<li>\nA. 最优子结构   B. 贪心选择性质   C. 重叠子问题   D. 线性可分\n<\/li><li>\n（单选）矩阵链乘法 m[i,j] 递归式中分割点 k 的取值范围是？（答案：B；解析：i≤k&lt;j）\n<\/li><li>\nA. 1≤k≤n   B. i≤k&lt;j   C. i&lt;k≤j   D. k=i 或 k=j\n<\/li><li>\n（填空）LCS 问题 X 长 m、Y 长 n，填表复杂度 O(__)。（答案：mn；解析：m×n 表）\n<\/li><li>\n（简答）钢条切割 rₙ 递归式为什么是 max(pᵢ + r_{n−i})？（答案：第一刀无论切在哪，都是「卖第一刀那段 + 剩下段的最优切割」；枚举所有切法取最大，就是最优子结构的直接体现）\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\nDP = 最优子结构 + 重叠子问题；四步走。\n<\/li><li>\n钢条切割 O(n²)；矩阵链 O(n³)；LCS O(mn)。\n<\/li><li>\n自底向上填表 vs 带备忘自顶向下。\n<\/ul>", "ch16": "<h1>第 16 章：贪心算法<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：2.5 小时 | <strong>前置<\/strong>：第 15 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说出贪心算法「每步选当前最优」与 DP 的区别。\n<\/li><li>\n用活动选择问题证明：按结束时间最早贪心选，得到最大兼容活动集。\n<\/li><li>\n用赫夫曼算法构造最优前缀码。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p><strong>当问题有「贪心选择性质」时，不必枚举所有子问题——每步选眼前最好的，全局最优自然出现。<\/strong><\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：贪心 vs 动态规划（难度：基础）<\/h3>\n<p>书页 §16 开篇：动态规划对很多优化问题是「杀鸡用牛刀」。<strong>贪心算法<\/strong>每一步都做出当时看起来最优的选择（局部最优），期望由此得到全局最优。<\/p>\n<ul><li>\nDP：每步综合所有子问题的最优解再选。\n<\/li><li>\n贪心：每步直接选当前最好的，不再回溯。\n<\/ul>\n<h3>概念 2：活动选择问题（难度：进阶）<\/h3>\n<p>n 个活动共享资源（如阶梯教室），每个活动 aᵢ 有开始 sᵢ、结束 fᵢ。选<strong>最大兼容活动集<\/strong>（互不重叠）。 <strong>贪心策略<\/strong>：把活动按<strong>结束时间 fᵢ 单调递增<\/strong>排序，然后反复选「结束最早且与已选兼容」的活动。 书页例子：a₁,a₄,a₈,a₁₁ 是一个最大兼容集（4 个活动）。 <strong>为什么正确<\/strong>：选结束最早的活动，给剩下的时间留最多——任何最优解里第一个活动都能换成结束最早的那个，而不损失后续选择。这叫<strong>贪心选择性质<\/strong>。<\/p>\n<h3>概念 3：贪心算法的两个要素（难度：进阶）<\/h3>\n<ol><li>\n<strong>贪心选择性质<\/strong>：全局最优可以通过一系列局部贪心选择得到（不必等子问题解完再选）。\n<\/li><li>\n<strong>最优子结构<\/strong>：选了之后，剩下的仍是同类子问题。\n<\/ol>\n<p>书页预告：最小生成树（第 23 章）、Dijkstra 单源最短路（第 24 章）都是贪心。<\/p>\n<h3>概念 4：赫夫曼编码（Huffman coding）（难度：进阶）<\/h3>\n<p><strong>最优前缀码<\/strong>：频率高的字符用短码、频率低的用长码，且没有任何码是另一个码的前缀（避免歧义）。 <strong>赫夫曼算法<\/strong>（书页已核对）：<\/p>\n<ol><li>\n每个字符作为一个叶结点放入最小优先队列 Q（按频率 freq）。\n<\/li><li>\n重复 n−1 次：取出频率最低的两个 x、y，合并成新结点 z，z.freq = x.freq + y.freq，x、y 作 z 的左右孩子，z 入队。\n<\/li><li>\n最后剩下的根就是编码树。\n<\/ol>\n<p>书页例：6 个字符 f:5, e:9, c:12, b:13, d:16, a:45。5 次合并后得到最优前缀码，平均码长最短。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[活动按结束时间排序 f₁≤f₂≤…] --&gt; B[选结束最早且兼容的]\n    B --&gt; C[在剩余时间段重复]\n    C --&gt; D[得到最大兼容集]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：每步只做「结束最早」这一个局部决策，不回溯；这正是贪心比 DP 快的原因。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：贪心像「赶飞机前收拾包」——永远先拿眼下最紧要的，不去枚举所有打包方案。<strong>失效边界<\/strong>：不是所有问题都能这么干；比如背包问题（0-1 背包）贪心就错，必须 DP。\n<\/li><li>\n<strong>实例<\/strong>：活动集书页表格 s=[1,3,0,5,3,5,6,8,8,2,12], f=[4,5,6,7,9,9,10,11,12,14,16]。贪心选 a₁(f=4)、a₄(f=7)、a₈(f=11)、a₁₁(f=16)——4 个，最大。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为「贪心总能得到最优」<\/strong>——实际上只有具备贪心选择性质的问题才行；0-1 背包就是反例。\n<\/li><li>\n<strong>别以为「赫夫曼编码就是短码」<\/strong>——实际上它让高频字符短、低频字符长，整体平均码长最短，而不是每个字符都短。\n<\/li><li>\n<strong>别以为「活动选择按开始时间贪心」<\/strong>——实际上按开始时间贪心会被「长活动」坑；必须按结束时间。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n（单选）活动选择问题的正确贪心策略是？（答案：B；解析：按结束时间最早选）\n<ul>\n<li>\nA. 开始最早   B. 结束最早   C. 时长最短   D. 开始最晚\n<\/li><li>\n（单选）赫夫曼算法每次从优先队列取出几个结点合并？（答案：B；解析：取频率最低的两个）\n<\/li><li>\nA. 1 个   B. 2 个   C. 3 个   D. 全部\n<\/li><li>\n（填空）赫夫曼合并 n 个字符需要 __ 次合并。（答案：n−1；解析：每次合并减少一个结点）\n<\/li><li>\n（简答）为什么 0-1 背包不能用贪心？（答案：0-1 背包每样物品要么整件拿要么不拿，按「价值/重量」贪心会漏掉组合更优的装法；书中明确它需用动态规划，贪心只对「分数背包」有效）\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n贪心 = 每步局部最优；前提是贪心选择性质 + 最优子结构。\n<\/li><li>\n活动选择：按结束时间贪心，最大兼容集。\n<\/li><li>\n赫夫曼：每次合并频率最低两个，最优前缀码。\n<\/ul>", "ch17": "<h1>第 17 章：摊还分析<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：2.5 小时 | <strong>前置<\/strong>：第 10 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说出摊还分析与平均情况分析的区别（不涉及概率）。\n<\/li><li>\n用三种方法（聚合、核算、势能）证明 MULTIPOP 栈与动态表的摊还代价。\n<\/li><li>\n解释动态表「加倍扩张」的摊还代价为什么是 O(1)，以及「对半收缩」为什么会失效。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p><strong>单次操作可能很贵，但把一整串操作的代价摊到每次头上，平均下来是常数——这就是摊还分析。<\/strong><\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：摊还分析（amortized analysis）是什么（难度：基础）<\/h3>\n<p>书页 §17：对一个操作序列求<strong>所有操作的总时间<\/strong>，再评价每个操作的平均代价。关键：<strong>不涉及概率<\/strong>——它保证最坏情况下每个操作的平均性能。这是与「期望运行时间」（随机算法那套）的本质区别。<\/p>\n<h3>概念 2：三种方法（难度：进阶）<\/h3>\n<ol><li>\n<strong>聚合分析（aggregate analysis）<\/strong>：直接证明 n 个操作总代价 T(n)，摊还代价 = T(n)/n。\n<\/li><li>\n<strong>核算法（accounting method）<\/strong>：对不同类型操作赋不同「摊还代价」，多收的部分作为<strong>预付信用（prepaid credit）<\/strong>存起来，补贴以后便宜的操作。要求总信用非负。\n<\/li><li>\n<strong>势能法（potential method）<\/strong>：把信用当作数据结构整体的「势能 Φ」。第 i 个操作的摊还代价 ĉᵢ = cᵢ + Φᵢ − Φᵢ₋₁。势能越高，说明「以前多存的钱」越多。\n<\/ol>\n<h3>概念 3：例子——MULTIPOP 栈（难度：基础）<\/h3>\n<p>普通 PUSH/POP 都是 O(1)。新加 MULTIPOP(S, k)：一次弹出 k 个。最坏一次 MULTIPOP 是 O(n)。但 n 个操作的序列：每个元素压入后最多弹出一次 ⇒ 总代价 O(n) ⇒ <strong>每个操作摊还 O(1)<\/strong>。<\/p>\n<h3>概念 4：动态表（dynamic table）（难度：进阶）<\/h3>\n<p><strong>TABLE-INSERT<\/strong>：表满时<strong>加倍<\/strong>扩容（分配两倍内存、搬元素）。虽然单次 INSERT 偶尔 Θ(n)（扩容那次），但势能法（书页图 17-3）证明：连续 n 次 INSERT 总代价 Θ(n)，<strong>摊还 O(1)<\/strong>——因为「贵的扩容」被「前面一堆便宜插入」摊薄了。 <strong>TABLE-DELETE<\/strong> 麻烦：如果简单地「利用率低于 1/2 就对半收缩」，会出现「插入→扩容→删除→收缩→插入→扩容…」的震荡，每次 Θ(n)，总 Θ(n²)。正确做法：让收缩触发阈值比 1/2 更低（如 1/4），留出缓冲区。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n    A[一次扩容 Θ n] --&gt; B[被前面 n 次便宜插入摊薄]\n    B --&gt; C[总代价 Θ n, 每次摊还 O 1]\n    D[插入+删除震荡] --&gt; E[每次都扩容/收缩 Θ n]\n    E --&gt; F[总代价 Θ n², 摊还 Θ n —— 失效]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：左边是「加倍」的良性摊还；右边是「对半」的恶性震荡——阈值设计决定摊还成败。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：摊还像「健身房年卡」——单次去一次很亏（Θ(n) 扩容），但一年 100 次平摊到每次就便宜（O(1)）。<strong>失效边界<\/strong>：如果你今天来、明天走、后天又来（震荡），前台每次都为你重开卡，年卡就不划算了。\n<\/li><li>\n<strong>实例<\/strong>：动态表 n=1 起插入 16 个元素：1,2,4,8,16 次扩容，每次搬 1,2,4,8 元素，总搬移 = 1+2+4+8 = 15 次 ≈ n，摊还每次约 1 次。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为「摊还分析就是算期望」<\/strong>——实际上摊还是确定性总代价除以次数，不含概率。\n<\/li><li>\n<strong>别以为「单次 O(n) 的操作就不能用」<\/strong>——实际上只要它出现得稀，摊还下来就是 O(1)（如动态表扩容）。\n<\/li><li>\n<strong>别以为「删除时利用率低就该立刻对半收缩」<\/strong>——实际上那会引起扩容/收缩震荡，摊还变 Θ(n)；应把阈值放宽。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n（单选）摊还分析与平均情况分析的关键区别是？（答案：B；解析：摊还不涉及概率，是确定性总代价）\n<ul>\n<li>\nA. 摊还用概率   B. 摊还不涉及概率，是确定性总代价   C. 两者一样   D. 摊还是最坏单次\n<\/li><li>\n（多选）书中介绍的摊还分析三种技术是？（答案：A、B、D；解析：聚合/核算/势能）\n<\/li><li>\nA. 聚合分析   B. 核算法   C. 蒙特卡洛   D. 势能法\n<\/li><li>\n（填空）势能法中第 i 个操作摊还代价 ĉᵢ = cᵢ + __ᵢ − Φᵢ₋₁。（答案：Φ；解析：势能变化）\n<\/li><li>\n（简答）动态表为什么「加倍扩张」摊还是 O(1)，「对半收缩」却失效？（答案：加倍时扩容被前面一连串便宜插入摊薄，总代价 Θ(n)；但简单对半收缩会在「满→删一半→再插入」间反复触发搬移，每次 Θ(n)，总 Θ(n²)。正确做法是把收缩阈值放宽到 1/4 左右）\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n摊还 = 一整串操作总代价除以次数，不含概率。\n<\/li><li>\n三法：聚合 T(n)/n、核算预付信用、势能 Φ。\n<\/li><li>\n动态表加倍 O(1) 摊还；对半收缩会震荡，需放宽阈值。\n<\/ul>", "ch18": "<h1>第 18 章：B 树<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：2 小时 | <strong>前置<\/strong>：第 13 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说出 B 树与红黑树的本质区别（多叉 vs 二叉、面向磁盘）。\n<\/li><li>\n解释为什么数据库索引用 B 树而不是红黑树。\n<\/li><li>\n描述 B 树查找、插入的大致流程与高度界。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p><strong>B 树是「一个结点挂很多孩子」的平衡搜索树——为磁盘设计：每次 I/O 读一大块，树高就压到极低。<\/strong><\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：为什么需要 B 树（难度：基础）<\/h3>\n<p>书页 §18：红黑树适合主存（随机访问极快）。但<strong>磁盘（辅助存储）<\/strong>慢得多——一次寻道比主存访问慢上万倍，且磁盘是<strong>按块读写<\/strong>的（一次读一整个扇区/页）。 B 树的对策：让一个结点 = 一个磁盘块，块里塞很多关键字。这样树的「分支因子」（每个结点的孩子数）可以是几百到几千——树高极低（log_{几百} n），I/O 次数极少。<\/p>\n<h3>概念 2：B 树结构（难度：进阶）<\/h3>\n<ul><li>\n内部结点 x 含 x.n 个关键字，有 x.n+1 个孩子。\n<\/li><li>\n关键字是「分隔点」：把 x 管的范围切成 x.n+1 个子域。\n<\/li><li>\n所有叶结点在同一深度（完美平衡）。\n<\/li><li>\n查找：在结点的 x.n 个关键字里做线性（或二分）比较，选出下一个孩子——一次磁盘 I/O 降一层。\n<\/ul>\n<h3>概念 3：高度界（难度：进阶）<\/h3>\n<p>书页定理：含 n 个关键字、最小度数 t 的 B 树，高度 h ≤ log_t((n+1)/2)。虽然渐近仍是 O(log n)，但<strong>对数的底 t 可以非常大<\/strong>（几百），所以实际树高只有三四层——这对磁盘 I/O 是决定性优势。<\/p>\n<h3>概念 4：插入与删除（了解）<\/h3>\n<ul><li>\n插入：沿查找路径往下，叶结点有空就放进去；满了就<strong>分裂<\/strong>成两个、中间关键字升进父结点（可能连锁分裂）。\n<\/li><li>\n删除：类似地可能引起<strong>合并<\/strong>。\n<p>所有操作沿一条根到叶路径，O(log_t n) 次 I/O。<\/p>\n<\/ul>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[红黑树: 二叉, 树高 ~ 2 lg n] --&gt; B[适合主存, 一次比一个数]\n    C[B树: 几百叉, 树高 log_{几百} n] --&gt; D[适合磁盘, 一次 I/O 读一块, 块里几百个关键字]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：B 树不是为了在主存里比红黑树快，而是为了把「昂贵的磁盘 I/O 次数」从几十次压到三四次。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：红黑树像逐页翻字典；B 树像先翻到「部首目录」（一大块塞几十个部首）、再翻「正文分区」——一次翻一大块，翻的次数极少。<strong>失效边界<\/strong>：在主存里 B 树单结点线性扫描几百个关键字反而比红黑树的二分慢——它的优势只在「磁盘读取代价 &gt;&gt; 内存比较代价」时才体现。\n<\/li><li>\n<strong>实例<\/strong>：数据库索引（MySQL InnoDB 的 B+ 树）：一页 16KB 塞几百个索引项，千万级表只需 3~4 层，一次查询读 3~4 次磁盘。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为「B 树就是红黑树的多叉版」<\/strong>——实际上它是为磁盘块设计的；主存里红黑树/跳表常更合适。\n<\/li><li>\n<strong>别以为「B 树插入不会分裂」<\/strong>——实际上叶满了要分裂、中间关键字上升，可能一路裂到根。\n<\/li><li>\n<strong>别以为「B 树与 B+ 树是一回事」<\/strong>——B+ 树是 B 树变种：所有数据都在叶结点、叶串成链表，是数据库主流。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n（单选）B 树主要为哪种存储设计？（答案：B；解析：磁盘辅助存储，按块 I/O）\n<ul>\n<li>\nA. 寄存器   B. 磁盘/辅助存储   C. Cache   D. 内存\n<\/li><li>\n（单选）B 树相比红黑树的核心优势是？（答案：C；解析：分支因子大、树高低、磁盘 I/O 次数少）\n<\/li><li>\nA. 主存比较更快   B. 实现更简单   C. 树高低、磁盘 I/O 少   D. 占空间小\n<\/li><li>\n（填空）B 树内部结点 x 有 x.n 个关键字时，有 __ 个孩子。（答案：x.n+1；解析：书中定义）\n<\/li><li>\n（简答）为什么数据库索引用 B 树而不是红黑树？（答案：磁盘按块读写、寻道极慢；B 树一个结点=一个块、塞几百关键字，树高只有几层，把每次查询的磁盘 I/O 次数压到最低；红黑树二叉、树高 lg n，I/O 次数太多）\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\nB 树 = 多叉平衡搜索树，为磁盘块设计。\n<\/li><li>\n结点塞几百关键字 ⇒ 分支因子大 ⇒ 树高 log_t n 极低。\n<\/li><li>\n插入可能分裂、删除可能合并，沿根到叶一条路径。\n<\/ul>", "ch19": "<h1>第 19 章：斐波那契堆<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：2.5 小时 | <strong>前置<\/strong>：第 6、17 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说出斐波那契堆支持的可合并堆操作，以及哪些操作是摊还 O(1)。\n<\/li><li>\n解释为什么它在 Dijkstra/Prim 这类「频繁 DECREASE-KEY」的图算法里比二叉堆好。\n<\/li><li>\n理解「懒合并 + 势能摊还」的核心思想（不要求手写全部细节）。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p><strong>斐波那契堆把 INSERT/UNION/DECREASE-KEY 都做成摊还 O(1)——靠的是「先懒着不整理，等 EXTRACT-MIN 时才一次收拢」。<\/strong><\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：可合并堆（mergeable heap）操作（书页 §19 已核对）<\/h3>\n<p>支持（以最小堆为例）：<\/p>\n<ul><li>\nMAKE-HEAP、INSERT(H, x)、MINIMUM(H)。\n<\/li><li>\nEXTRACT-MIN(H)：删最小并返回。\n<\/li><li>\n<strong>UNION(H₁, H₂)<\/strong>：合并两堆。\n<\/li><li>\nDECREASE-KEY(H, x, k)：减小 x 的关键字。\n<\/li><li>\nDELETE(H, x)。\n<\/ul>\n<h3>概念 2：与二叉堆对比（书页图 19-1 表格）<\/h3>\n<table><thead><tr><th>操作<\/th><th>二叉堆（最坏）<\/th><th>斐波那契堆（摊还）<\/th><\/tr><\/thead><tbody><tr><td>INSERT<\/td><td>Θ(lg n)<\/td><td>Θ(1)<\/td><\/tr><tr><td>MINIMUM<\/td><td>Θ(1)<\/td><td>Θ(1)<\/td><\/tr><tr><td>EXTRACT-MIN<\/td><td>Θ(lg n)<\/td><td>O(lg n)<\/td><\/tr><tr><td>UNION<\/td><td>Θ(n)<\/td><td>Θ(1)<\/td><\/tr><tr><td>DECREASE-KEY<\/td><td>Θ(lg n)<\/td><td>Θ(1)<\/td><\/tr><tr><td>DELETE<\/td><td>Θ(lg n)<\/td><td>O(lg n)<\/td><\/tr><\/tbody><\/table>\n<p>关键：斐波那契堆把 INSERT/UNION/DECREASE-KEY 做到摊还 O(1)——这正是 Dijkstra/Prim 里「每条边松弛都 DECREASE-KEY」最想要的。<\/p>\n<h3>概念 3：结构直觉（难度：高难，了解）<\/h3>\n<ul><li>\n斐波那契堆是一组<strong>堆有序的树<\/strong>组成的「森林」，用根链表串起来。\n<\/li><li>\n<strong>懒策略<\/strong>：INSERT 就把新结点挂到根链表（O(1)，不整理）；UNION 就把两个根链表接起来（O(1)）；DECREASE-KEY 就把减小的子树切出来挂到根链表（O(1)）。\n<\/li><li>\n<strong>只有 EXTRACT-MIN 才整理<\/strong>：从根链表找最小删之，然后把它的孩子们并入根链表，再「合并同度数的树」直到没有两棵树同度数——这一步才花 O(lg n) 摊还。\n<\/li><li>\n摊还分析用势能法（第 17 章）证明「懒攒下来的乱」被 EXTRACT-MIN 一次性付清。\n<\/ul>\n<h3>概念 4：为什么叫「斐波那契」（了解）<\/h3>\n<p>分析中出现：某结点的孩子数最少时，其子树规模按斐波那契数增长——由此推出「一棵度数为 k 的树至少有 F_{k+2} 个结点」，所以度数 k = O(lg n)。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n    A[INSERT / UNION / DECREASE-KEY] --&gt;|懒: 直接挂根链表| B[森林越来越乱]\n    B --&gt; C[EXTRACT-MIN: 找最小, 删, 整理同度数树]\n    C --&gt;|摊还 O lg n| D[森林重新变整齐]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：平时「懒」是为了省时间（摊还 O(1)）；攒下来的乱在 EXTRACT-MIN 时一次性清算。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：斐波那契堆像「洗衣篓策略」——平时脏衣服随手扔篓里（INSERT/UNION O(1)），只有「必须穿干净衬衫」（EXTRACT-MIN）时才一次性全部洗。<strong>失效边界<\/strong>：如果 EXTRACT-MIN 调用极其频繁，懒攒的优势就不明显；它最适合「插入多、删少」的场景。\n<\/li><li>\n<strong>实例<\/strong>：Dijkstra 最短路：每条边 (u,v) 松弛时若 d(v) 能更小，就 DECREASE-KEY。二叉堆每条要 O(lg n)；斐波那契堆摊还 O(1)——稠密图上把总复杂度从 O(m lg n) 降到 O(m + n lg n)。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为「斐波那契堆全面碾压二叉堆」<\/strong>——实际上它常数大、实现复杂，工程里多数用二叉堆/四叉堆；它的价值在理论分析（Dijkstra 稠密图最优界）。\n<\/li><li>\n<strong>别以为「INSERT 在斐波那契堆里也要 O(lg n)」<\/strong>——实际上摊还 Θ(1)，直接挂根链表即可。\n<\/li><li>\n<strong>别以为「DECREASE-KEY 是免费的」<\/strong>——它摊还 O(1) 是靠 EXTRACT-MIN 时一次性清算攒下的乱，不是真的零成本。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n（多选）下列哪些操作在斐波那契堆中是摊还 O(1)？（答案：A、B、C；解析：INSERT/UNION/DECREASE-KEY 摊还 O(1)；EXTRACT-MIN 是 O(lg n)）\n<ul>\n<li>\nA. INSERT   B. UNION   C. DECREASE-KEY   D. EXTRACT-MIN\n<\/li><li>\n（单选）斐波那契堆最适合下列哪种场景？（答案：C；解析：频繁 DECREASE-KEY 的图算法）\n<\/li><li>\nA. 纯排序   B. 频繁 EXTRACT-MIN   C. Dijkstra/Prim 频繁松弛   D. 纯栈操作\n<\/li><li>\n（填空）EXTRACT-MIN 时要把同__的树合并到只剩一棵。（答案：度数；解析：consolidate 按 degree 合并）\n<\/li><li>\n（简答）为什么 Dijkstra 用斐波那契堆比二叉堆快？（答案：Dijkstra 每条边松弛都可能 DECREASE-KEY；二叉堆每次 O(lg n)，总 O(m lg n)；斐波那契堆 DECREASE-KEY 摊还 O(1)，总 O(m + n lg n)，稠密图上优势明显）\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n可合并堆：INSERT/UNION/DECREASE-KEY 摊还 O(1)。\n<\/li><li>\n懒合并：平时挂根链表，EXTRACT-MIN 才整理。\n<\/li><li>\n核心用途：Dijkstra/Prim 图算法的理论最优界。\n<\/ul>", "ch20": "<h1>第 20 章：van Emde Boas 树<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：1.5 小时（了解为主） | <strong>前置<\/strong>：第 11、13 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说出 vEB 树解决的问题域（在大小为 u 的全域上做前驱/后继查找）。\n<\/li><li>\n理解「分块 + 递归」的核心思想，记住各操作 O(lg lg u) 的复杂度。\n<\/li><li>\n知道它与散列表、平衡树各自的适用边界。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p><strong>当关键字来自大小 u 的有限全域时，vEB 树用「分层递归分块」把查找/插入/前驱压到 O(lg lg u)——比 O(lg u) 还低一截。<\/strong><\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：它解决什么（难度：基础）<\/h3>\n<p>问题：维护一个来自全域 U = {0, 1, …, u−1} 的动态集合，支持 MEMBER、MINIMUM、MAXIMUM、PREDECESSOR（前驱）、SUCCESSOR（后继）、INSERT、DELETE。<\/p>\n<ul><li>\n散列表：MEMBER O(1)，但<strong>前驱/后继<\/strong>做不到。\n<\/li><li>\n平衡树（红黑树）：所有操作 O(lg n)，n 是实际元素数。\n<\/li><li>\n<strong>vEB 树<\/strong>：所有操作 <strong>O(lg lg u)<\/strong>——用的是全域大小 u，不是元素数 n。当 u 是 2^k 时，lg lg u = k/2，极小。\n<\/ul>\n<h3>概念 2：核心思想（难度：高难，了解）<\/h3>\n<p>把大小 u 的全域切成 √u 个「簇」，每簇 √u 个数。vEB 树结点分两层：<\/p>\n<ul><li>\n<strong>summary（摘要）<\/strong>：一个「簇级」vEB 树，记录哪些簇非空。\n<\/li><li>\n<strong>cluster[1..√u]<\/strong>：每个簇又是一个 vEB 树。\n<p>查前驱 x：先看 x 所在簇里有没有比 x 小的；没有就去 summary 找「前一个非空簇」，再去那个簇找最大元素。 每层把问题规模开平方 ⇒ 递归深度 lg lg u。<\/p>\n<\/ul>\n<h3>概念 3：复杂度（难度：进阶）<\/h3>\n<p>所有操作 O(lg lg u)。空间若直接实现是 O(u)，用「紧凑存储」可降到 O(u) 内合理范围（工程中常只在 u=2^16、2^32 这种位域场景下用）。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[全域 u = 2^k] --&gt; B[切成 sqrt u 个簇, 每簇 sqrt u 个数]\n    B --&gt; C[summary 树管哪些簇非空]\n    B --&gt; D[每簇内部再套 vEB]\n    C --&gt; E[查前驱: 先查本簇, 没有就查 summary 找前簇]\n    D --&gt; E\n    E --&gt; F[每层规模开平方, 深度 lg lg u]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：vEB 的精髓是「把 u 不断开平方」——从 u 到 √u 到 u^1/4… 只要 lg lg u 层。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：查字典先翻「部首目录」（summary），再翻「该部首所在页范围」（簇），两层定位。<strong>失效边界<\/strong>：只在「全域 u 不大且固定」时划算；若 u 是 2^64，空间代价就太大，不如散列/平衡树。\n<\/li><li>\n<strong>实例<\/strong>：u = 2^16 = 65536，lg lg u = lg 16 = 4。查前驱最多递归 4 层，比红黑树的 lg n 次比较快一截。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为「vEB 树通用最优」<\/strong>——实际上它要求关键字来自固定小全域 u；任意大的字符串关键字用不上。\n<\/li><li>\n<strong>别以为「lg lg u 与 lg n 哪个快」要看场景<\/strong>——u 大（如 2^64）时 vEB 空间爆炸；n 远小于 u 时红黑树 O(lg n) 可能更省。\n<\/li><li>\n<strong>别以为「散列表能查前驱」<\/strong>——实际上散列只支持 O(1) 等值查询，不支持有序前驱/后继。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n（单选）vEB 树所有操作的复杂度是？（答案：B；解析：O(lg lg u)）\n<ul>\n<li>\nA. O(1)   B. O(lg lg u)   C. O(lg n)   D. O(u)\n<\/li><li>\n（单选）vEB 树最适合下列哪种场景？（答案：A；解析：关键字来自固定小全域 u，需要前驱/后继）\n<\/li><li>\nA. 关键字来自 0..65535 的动态集合，需查前驱\n<\/li><li>\nB. 任意字符串的等值查询\n<\/li><li>\nC. 全排序\n<\/li><li>\nD. 栈操作\n<\/li><li>\n（填空）vEB 把全域 u 切成 __u 个簇，每簇 __u 个数。（答案：√；√；解析：开平方分块）\n<\/li><li>\n（简答）vEB 树相比红黑树的优势与代价是什么？（答案：优势是前驱/后继等操作 O(lg lg u)，比红黑树 O(lg n) 低；代价是要求关键字来自固定全域 u 且空间 O(u)，u 太大就不划算）\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\nvEB = 全域上分块递归，前驱/后继 O(lg lg u)。\n<\/li><li>\nsummary 记哪些簇非空；每层规模开平方。\n<\/li><li>\n适用于 u 固定且不太大的位域场景。\n<\/ul>", "ch21": "<h1>第 21 章：用于不相交集合的数据结构<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：2.5 小时 | <strong>前置<\/strong>：第 10 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说出不相交集合的三个操作 MAKE-SET / UNION / FIND-SET。\n<\/li><li>\n用「按秩合并 + 路径压缩」把并查集操作压到近似线性 O(m α(n))。\n<\/li><li>\n解释它在「无向图连通分量」中的应用。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p><strong>并查集（union-find）给每个集合选一个代表：按秩合并让矮树挂高树上，路径压缩让查找时把结点直接挂到根——操作近似 O(1)。<\/strong><\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：三个操作（书页 §21.1 已核对）<\/h3>\n<p>维护一组不相交动态集合 S = {S₁, S₂, …}，每个集合有一个<strong>代表（representative）<\/strong>。<\/p>\n<ul><li>\nMAKE-SET(x)：建一个只含 x 的新集合，x 是代表。\n<\/li><li>\nUNION(x, y)：把含 x 和 y 的两个集合合并（选一个新代表）。\n<\/li><li>\nFIND-SET(x)：返回 x 所在集合的代表。\n<\/ul>\n<p><strong>应用<\/strong>：判断无向图两个顶点是否在同一连通分量——先对每个顶点 MAKE-SET，每条边 UNION 两端点，最后 FIND-SET 相同即连通。<\/p>\n<h3>概念 2：链表实现（naive）<\/h3>\n<p>每个集合是一条链表，头是代表。UNION 要把两条链接起来——若总把短链接长链尾部要搬动短链所有元素，n 次 UNION 总代价 Θ(n lg n)。<\/p>\n<h3>概念 3：不相交集合森林（难度：进阶）<\/h3>\n<p>每棵树代表一个集合，树根是代表。每个结点存父指针 p。FIND-SET 沿父指针爬到根。 两个优化：<\/p>\n<ol><li>\n<strong>按秩合并（union by rank）<\/strong>：把<strong>矮树的根挂到高树的根<\/strong>下（rank = 树高上界），不让树无限长高。\n<\/li><li>\n<strong>路径压缩（path compression）<\/strong>：FIND-SET 爬到根后，把沿途每个结点的父指针直接改成根——下次查找一步到位。\n<\/ol>\n<h3>概念 4：复杂度（难度：高难，了解结论）<\/h3>\n<p>书页 §21.4：m 个 MAKE-SET/UNION/FIND-SET 操作、n 个元素，用按秩合并+路径压缩，最坏总时间 <strong>O(m α(n))<\/strong>，其中 α 是「阿克曼函数的逆」——它增长慢到离谱（实际中 α(n) ≤ 4）。所以工程上可视为<strong>近似线性 O(m)<\/strong>。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[MAKE-SET: 每个元素自成一棵树] --&gt; B[UNION: 矮树挂高树的根下]\n    B --&gt; C[FIND-SET: 沿父指针爬到根]\n    C --&gt; D[路径压缩: 沿途结点直接挂到根]\n    D --&gt; E[下次 FIND 一步到位]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：按秩合并控制树高，路径压缩把「长路」摊平成「直挂根」。两者合起来让每次查找近乎 O(1)。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：并查集像「家族族谱认亲」——找「我们是不是一家人」就找共同始祖（代表）；路径压缩就是「以后干脆都直接写始祖名字，不用一层层往上数」。<strong>失效边界<\/strong>：它只回答「同集合吗」，不维护集合内部顺序，也不能高效枚举集合元素。\n<\/li><li>\n<strong>实例<\/strong>：图连通分量：顶点 1..6 各自 MAKE-SET；边 (1,2)(2,3)(4,5) 分别 UNION；FIND-SET(1) 与 FIND-SET(3) 相同 ⇒ 1 与 3 连通；FIND-SET(1) 与 FIND-SET(4) 不同 ⇒ 不连通。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为「并查集能做任意集合运算」<\/strong>——实际上它只支持「合并」和「找代表」，不能分裂集合。\n<\/li><li>\n<strong>别以为「路径压缩会破坏树结构」<\/strong>——实际上它只改父指针、不改变集合归属，下次查找更快。\n<\/li><li>\n<strong>别以为「α(n) 是普通对数」<\/strong>——实际上它是逆阿克曼函数，实际 ≤ 4，可当作常数。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n（多选）不相交集合支持的操作有？（答案：A、B、C；解析：MAKE-SET/UNION/FIND-SET）\n<ul>\n<li>\nA. MAKE-SET   B. UNION   C. FIND-SET   D. SPLIT\n<\/li><li>\n（单选）按秩合并 + 路径压缩后，m 个操作、n 个元素的总时间是？（答案：C；解析：O(m α(n))，α 逆阿克曼，实际近似线性）\n<\/li><li>\nA. O(m lg n)   B. O(m n)   C. O(m α(n))   D. O(1)\n<\/li><li>\n（填空）UNION(x,y) 把__树的根挂到__树的根下。（答案：矮（低秩）；高（高秩）；解析：按秩合并）\n<\/li><li>\n（简答）路径压缩做了什么？（答案：FIND-SET 沿父指针爬到根后，把沿途每个结点的父指针直接改为根；这样下次同一结点的查找一步直达，摊平树高）\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n并查集：MAKE-SET/UNION/FIND-SET，树根为代表。\n<\/li><li>\n按秩合并控树高，路径压缩摊平。\n<\/li><li>\n总时间 O(m α(n)) ≈ 近似线性；应用：连通分量。\n<\/ul>", "ch22": "<h1>第 22 章：基本的图算法<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：2.5 小时 | <strong>前置<\/strong>：第 10 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n用邻接链表与邻接矩阵表示图，并说出各自的空间与适用场景。\n<\/li><li>\n描述 BFS 与 DFS 的流程，说出颜色标记、发现/完成时间。\n<\/li><li>\n用 DFS 做拓扑排序与求强连通分量。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p><strong>图的搜索（BFS 按层扩展、DFS 一路走到底）是所有图算法的骨架——先摸清图长什么样，再谈最短路、连通性。<\/strong><\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：图的两种表示（书页 §22.1 已核对）<\/h3>\n<ul><li>\n<strong>邻接链表<\/strong>：数组 Adj[|V|]，每个顶点一条链表，挂它的所有邻居。空间 Θ(V+E)。<strong>稀疏图<\/strong>（|E| ≪ |V|²）首选。\n<\/li><li>\n<strong>邻接矩阵<\/strong>：n×n 矩阵 W，W[i][j] = 边 (i,j) 的权重（无边为 ∞）。空间 Θ(V²)。<strong>稠密图<\/strong>或要快速判断「i,j 之间有没有边」时用。\n<p>有向图邻接链表总长 |E|；无向图总长 2|E|。<\/p>\n<\/ul>\n<h3>概念 2：广度优先搜索 BFS（难度：进阶）<\/h3>\n<p>从源 s 出发，按「离 s 的边数」一层一层扩展（书页 §22.2）：<\/p>\n<ul><li>\n每个结点三态：白（未发现）、灰（在队列里）、黑（已处理）。\n<\/li><li>\n属性：u.d = 从 s 到 u 的<strong>最少边数<\/strong>，u.π = 前驱。\n<\/li><li>\n用 FIFO 队列 Q 管理灰色结点。\n<\/li><li>\n定理：BFS 算出的 u.d 就是无权图从 s 到 u 的<strong>最短路径边数<\/strong>。\n<p>总时间 O(V+E)。<\/p>\n<\/ul>\n<h3>概念 3：深度优先搜索 DFS（难度：进阶）<\/h3>\n<p>一路走到底、走不通再回溯（书页 §22.3）：<\/p>\n<ul><li>\n白色→灰色（发现）→黑色（完成）。\n<\/li><li>\n属性：u.d = <strong>发现时间戳<\/strong>，u.f = <strong>完成时间戳<\/strong>，1 ≤ u.d &lt; u.f ≤ 2|V|。\n<\/li><li>\n递归：DFS-VISIT 把当前结点涂灰、时间戳+1，递归访问所有白色邻居，回溯时涂黑、记完成时间。\n<p>总时间 O(V+E)。<\/p>\n<\/ul>\n<p>DFS 边的分类：<strong>树边 / 回边（back） / 前向边 / 交叉边<\/strong>——这套分类是后面很多算法的依据。<\/p>\n<h3>概念 4：两个应用（难度：进阶）<\/h3>\n<ul><li>\n<strong>拓扑排序<\/strong>（§22.4）：对有向无环图（DAG），按 DFS 完成时间 u.f <strong>从大到小<\/strong>排列——得到的就是拓扑序（所有边从左指向右）。\n<\/li><li>\n<strong>强连通分量<\/strong>（§22.5）：在有向图中，先 DFS 记完成时间，把图边反向，再按完成时间从大到小 DFS 反图，每次得到的一棵 DFS 树就是一个强连通分量（任意两顶点互相可达）。\n<\/ul>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n    A[BFS: 用队列, 一层一层扩散] --&gt; B[无权图最短边数]\n    C[DFS: 递归一路走到底] --&gt; D[发现时间 u.d / 完成时间 u.f]\n    D --&gt; E[拓扑排序: 按 u.f 降序]\n    D --&gt; F[强连通分量: 两次 DFS]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：BFS 像水波扩散（按层）；DFS 像走迷宫（扎到底再退）。DFS 的两个时间戳是拓扑排序与强连通分量的钥匙。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：BFS = 水滴扩散（先碰近的）；DFS = 走迷宫（先扎一条路，死胡同再退回）。<strong>失效边界<\/strong>：BFS 只算「边数」最短，带权重的图要用 Dijkstra（第 24 章）。\n<\/li><li>\n<strong>实例<\/strong>：课程先修关系图（A 是 B 的先修），拓扑排序给出「先修完 A 再学 B」的合法顺序。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为「BFS 能算带权图最短路」<\/strong>——实际上 BFS 只算边数；带权要用 Dijkstra/Bellman-Ford。\n<\/li><li>\n<strong>别以为「DFS 拓扑排序按发现时间排」<\/strong>——实际上按<strong>完成时间 u.f 从大到小<\/strong>排。\n<\/li><li>\n<strong>别以为「邻接链表存稠密图更省」<\/strong>——实际上稠密图 |E|≈|V|²，链表反而浪费，邻接矩阵 Θ(V²) 更紧凑。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n（单选）稀疏图首选哪种表示？（答案：A；解析：邻接链表 Θ(V+E)，E≪V² 时省）\n<ul>\n<li>\nA. 邻接链表   B. 邻接矩阵   C. 二维数组   D. 哈希表\n<\/li><li>\n（单选）BFS 算出的 u.d 是？（答案：B；解析：无权图从 s 到 u 的最少边数）\n<\/li><li>\nA. 带权最短   B. 最少边数   C. 任意路径   D. 入度\n<\/li><li>\n（填空）拓扑排序按 DFS 的 __ 时间从大到小排列。（答案：完成（u.f）；解析：书中拓扑排序规则）\n<\/li><li>\n（简答）BFS 与 DFS 的核心区别？（答案：BFS 用队列按层扩展，算边数最短路；DFS 用递归/栈一路扎到底，记发现/完成时间，用于拓扑排序与强连通分量）\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n邻接链表 Θ(V+E)；邻接矩阵 Θ(V²)。\n<\/li><li>\nBFS 按层、无权最短路；DFS 扎到底、记时间戳。\n<\/li><li>\n拓扑排序按 u.f 降序；强连通分量两次 DFS。\n<\/ul>", "ch23": "<h1>第 23 章：最小生成树<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：2.5 小时 | <strong>前置<\/strong>：第 16、21、22 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说出「生成树」与「最小生成树（MST）」的定义。\n<\/li><li>\n用切分性质（定理 23.1）理解 MST 为什么能用贪心。\n<\/li><li>\n写出 Kruskal 与 Prim 两种算法，说出各自复杂度。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p><strong>要把所有顶点连起来又总边权最小——每次选「跨过当前森林切分的最轻边」，贪心地加 |V|−1 条边即可。<\/strong><\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：生成树与最小生成树（难度：基础）<\/h3>\n<p>连通无向图 G=(V,E)，<strong>生成树 T<\/strong> 是 E 的一个无环子集，连通所有顶点且恰好 |V|−1 条边。<strong>最小生成树（MST）<\/strong>：所有生成树中总权 w(T) = Σ w(u,v) 最小的那棵。书页例子：电路板连线 n 个针脚用 n−1 根线、总长最短。<\/p>\n<h3>概念 2：切分性质（定理 23.1，难度：进阶）<\/h3>\n<ul><li>\n<strong>切分（cut）<\/strong>：把顶点集 V 分成两部分 (S, V−S)。\n<\/li><li>\n<strong>横跨（cross）<\/strong>：一条边一端在 S、一端在 V−S。\n<\/li><li>\n<strong>轻量级边（light edge）<\/strong>：横跨切分的边中权重最小的那条。\n<\/li><li>\n<strong>定理 23.1<\/strong>：若 A 是某棵 MST 的边子集、且切分 (S, V−S) <strong>尊重 A<\/strong>（A 中没有边横跨），则横跨该切分的任意轻量级边 (u,v) 对 A 是<strong>安全的<\/strong>——可以加入 A 而不破坏「A 属于某棵 MST」。\n<\/ul>\n<p>白话：每次在当前森林「切开一处」，选最轻的跨切口，这条边一定在某棵最优树里。这就是贪心能成立的根据。<\/p>\n<h3>概念 3：Kruskal 算法（难度：进阶）<\/h3>\n<ol><li>\n把所有边按权重从小到大排序。\n<\/li><li>\n依次考虑每条边：若两端点<strong>不在同一棵树<\/strong>（用并查集 FIND-SET 判断），就加入 MST 并 UNION。\n<\/li><li>\n直到 |V|−1 条边。\n<p>复杂度：排序 O(E lg E) + 并查集近线性 ⇒ <strong>O(E lg V)<\/strong>。<\/p>\n<\/ol>\n<h3>概念 4：Prim 算法（难度：进阶）<\/h3>\n<p>从任意一个根顶点出发，维护一棵「正在长」的树 A：<\/p>\n<ol><li>\n每次选「一端在 A、一端不在 A」的<strong>最轻边<\/strong>，把那个新顶点拉进 A。\n<\/li><li>\n用最小优先队列维护「不在 A 的顶点到 A 的最短边权」。\n<p>复杂度：二叉堆 O(E lg V)；<strong>斐波那契堆 O(E + V lg V)<\/strong>（第 19 章的用武之地）。<\/p>\n<\/ol>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[切分 S ｜ V−S] --&gt; B[找横跨切分的最轻边]\n    B --&gt; C[定理 23.1: 这条边一定在某棵 MST 里]\n    C --&gt; D[Kruskal: 按权排序, 用并查集防环]\n    C --&gt; E[Prim: 从根长树, 优先队列拉最轻邻边]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：两种算法都是「按切分性质选安全边」；Kruskal 全局排边，Prim 从一棵树向外长。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：MST 像「修村村通公路」——每次在「已通路区」和「未通路区」之间选最便宜的那条路修，直到所有村连起来。<strong>失效边界<\/strong>：MST 只保证「总边权最小」，不保证任意两点间的路径最短（那是最短路的事）。\n<\/li><li>\n<strong>实例<\/strong>：书页图 23-1 的图，MST 总权 37；换一条 (b,c) 边也能得到权 37 的另一棵 MST——MST 不唯一，但总权唯一。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为「MST 给出任意两点最短路」<\/strong>——实际上它只保证总权最小；两点间路径未必最短。\n<\/li><li>\n<strong>别以为「Kruskal 加边会成环」<\/strong>——实际上并查集 FIND-SET 判断两端同属一棵树就跳过，天然防环。\n<\/li><li>\n<strong>别以为「Prim 必须从某特定顶点出发」<\/strong>——实际上任意顶点作根都能得到 MST。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n（单选）MST 恰好包含多少条边？（答案：C；解析：|V|−1 条）\n<ul>\n<li>\nA. |V|   B. |E|   C. |V|−1   D. |E|−1\n<\/li><li>\n（单选）Kruskal 算法判断「加边会不会成环」用什么数据结构？（答案：B；解析：并查集 FIND-SET）\n<\/li><li>\nA. 堆   B. 并查集   C. BST   D. 队列\n<\/li><li>\n（填空）Prim 算法用__优先队列维护顶点到树的最短边。（答案：最小；解析：每次拉最轻边）\n<\/li><li>\n（简答）切分性质为什么能推出贪心？（答案：定理 23.1 说「尊重 A 的切分上，最轻跨切口一定安全」——所以每一步选当前最轻的安全边，永远不会偏离最优树）\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\nMST = 连通所有顶点、|V|−1 边、总权最小。\n<\/li><li>\n切分性质：最轻跨切口必在某棵 MST 里。\n<\/li><li>\nKruskal O(E lg V)（排序+并查集）；Prim 二叉堆 O(E lg V)、斐波那契堆 O(E+V lg V)。\n<\/ul>", "ch24": "<h1>第 24 章：单源最短路径<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：4 小时 | <strong>前置<\/strong>：第 6、22 章（优先队列、图的 BFS/DFS）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n写出「松弛（relax）」操作，并说明它如何把最短路一步步更新出来。\n<\/li><li>\n说出 Bellman-Ford、DAG 最短路、Dijkstra 三种算法各自的适用条件与复杂度。\n<\/li><li>\n判断什么时候图里存在「负权回路」，并解释为什么 Dijkstra 不能用于负权边。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p><strong>所有单源最短路算法都在反复做同一件事——「松弛」：如果经由某条边能让当前到 v 的距离 d[v] 更小，就更新它；谁先松弛、怎么排序，就分出了不同算法。<\/strong><\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：最短路权重 δ(u,v) 与松弛（难度：基础）<\/h3>\n<p>带权有向图 G=(V,E)，权函数 w，路径 p=(v₀,…,vₖ) 的权重 w(p)=Σ w(vᵢ₋₁,vᵢ)。<strong>最短路权重 δ(u,v)<\/strong> = u 到 v 所有路径权重的最小值（不可达为 ∞）。 <strong>松弛（relaxation）<\/strong>：对边 (u,v) 维护距离 d[v]（当前已知最短）与前驱 π[v]。若 d[u]+w(u,v) &lt; d[v]，则令 d[v]←d[u]+w(u,v)、π[v]←u。白话：「路过 u 去 v 更近，就改道」。 关键性质：最优子结构——最短路的任意一段也是最短路（否则可换更短段得到更短全路）。<\/p>\n<h3>概念 2：Bellman-Ford 算法（难度：进阶）<\/h3>\n<p>允许<strong>负权边<\/strong>（但不允许从源可达的负权回路）。对全部边做 |V|−1 轮松弛；若第 |V| 轮仍能松弛，说明存在负权回路。 复杂度 <strong>O(VE)<\/strong>。它同时解决「差分约束」问题（24.4 节：把一组不等式 x_j − x_i ≤ w 变成图，最短路距离即一组可行解）。<\/p>\n<h3>概念 3：DAG 上的最短路（难度：基础）<\/h3>\n<p>若图是<strong>有向无环图（DAG）<\/strong>，先拓扑排序（22.4），再按拓扑序对每条边松弛一次即可。复杂度 <strong>O(V+E)<\/strong>，自动处理负权边（无环故无负权回路）。<\/p>\n<h3>概念 4：Dijkstra 算法（难度：进阶）<\/h3>\n<p>要求<strong>所有边权非负<\/strong>。维护已确定最短路的集合 S；用最小优先队列 Q 按 d 值取出 u，加入 S，再对 u 的出边松弛。 复杂度：二叉堆 <strong>O((V+E) lg V)<\/strong>；斐波那契堆 O(E+V lg V)。 为什么不能有负权边？一旦把 u 放入 S，就认定 d[u] 已定；若之后出现一条负权边绕回来，会推翻这个结论——算法不回头。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[单源 s, d[s]=0, 其余 d=∞] --&gt; B{图长什么样?}\n    B --&gt;|DAG| C[拓扑序后逐边松弛一次: O(V+E)]\n    B --&gt;|可含负权边| D[Bellman-Ford: 全边松弛|V|-1 轮, O(VE)]\n    B --&gt;|边权全非负| E[Dijkstra: 每次取 d 最小者定死, 松弛出边, O(E lg V)]\n    D --&gt; F[第 V 轮仍可松弛 ⇒ 有负权回路]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：三种算法的差别只在「按什么顺序松弛」。DAG 靠拓扑序、Bellman-Ford 靠轮数、Dijkstra 靠「最小者先定死」。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：松弛像导航软件在地图上反复「发现更近的绕行路」并刷新到达时间；Dijkstra 像导航一旦给你定了条主路线就不再回头重算（所以遇到封路/短的逆行小路会出错）。<strong>失效边界<\/strong>：Dijkstra 只在边权非负时「先定死」才安全。\n<\/li><li>\n<strong>实例<\/strong>：边 (s,a)=4、(s,b)=2、(b,a)=1。先松弛 s→b 得 d[b]=2；再松弛 b→a 得 d[a]=3（比直接 s→a 的 4 更小）。这就是「经过 b 到 a 更近」。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为「有负权边就什么算法都不行」<\/strong>——实际上 Bellman-Ford、DAG 算法都能处理负权边；只有「负权回路」让最短路不存在（可无限绕）。\n<\/li><li>\n<strong>别以为「Dijkstra 慢在松弛次数」<\/strong>——实际上它快在「每个顶点只定死一次」，前提正是边权非负保证「先取出的最小 d 不会被后续更小值推翻」。\n<\/li><li>\n<strong>别以为「d[v] 一旦赋值就是最终值」<\/strong>——实际上 Bellman-Ford 里 d[v] 可能被多轮反复刷新。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n（单选）Dijkstra 算法要求边权满足什么条件？（答案：B；解析：非负，否则「先定死最小 d」不成立）\n<ul>\n<li>\nA. 全为正整数   B. 非负   C. 任意实数   D. 全为 0\n<\/li><li>\n（单选）Bellman-Ford 每轮对所有边做什么操作？（答案：A；解析：松弛 relaxation）\n<\/li><li>\nA. 松弛   B. 排序   C. 染色   D. 拓扑\n<\/li><li>\n（填空）对全部边做 |V|−1 轮松弛后，若第 |V| 轮仍能松弛，说明图中存在__。（答案：从源可达的负权回路；解析：最短路会无限变短）\n<\/li><li>\n（简答）为什么 DAG 最短路只要按拓扑序松弛一次？（答案：拓扑序保证每条边 (u,v) 在松弛时 u 的最终 d 已经算好，不会再有更早到达 u 的路径遗漏）\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n核心操作只有一个：松弛 d[u]+w(u,v)&lt;d[v] 就更新。\n<\/li><li>\nDAG O(V+E)；Bellman-Ford O(VE) 容负权边；Dijkstra O(E lg V) 不容负权边。\n<\/li><li>\n第 |V| 轮还能松弛 = 负权回路信号。\n<\/ul>", "ch25": "<h1>第 25 章：所有结点对的最短路径<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：2.5 小时 | <strong>前置<\/strong>：第 24 章、附录 D（矩阵）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说出「所有结点对最短路」与「单源最短路」的差别，以及为什么不能直接跑 n 遍 Dijkstra。\n<\/li><li>\n写出 Floyd-Warshall 的三重循环与它的递推思想。\n<\/li><li>\n解释 Johnson 算法如何通过「重赋权」让负权边图也能用 Dijkstra。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p><strong>想一次问清「任意两点间多远」，Floyd-Warshall 用「中间点编号不超过 k」的递推在 O(V³) 内搞定；Johnson 则先把负权边「洗白」成非负，再跑 n 遍 Dijkstra。<\/strong><\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：邻接矩阵与递归表示（难度：基础）<\/h3>\n<p>所有结点对问题用矩阵 W=(wᵢⱼ) 表示（wᵢᵢ=0，无边为 ∞）。设 D⁽ᵏ⁾ᵢⱼ = i 到 j、<strong>中间经过的顶点编号 ≤ k<\/strong> 的最短路。递推：<\/p>\n<ul><li>\n不经过 k：D⁽ᵏ⁾ᵢⱼ = D⁽ᵏ⁻¹⁾ᵢⱼ\n<\/li><li>\n经过 k：D⁽ᵏ⁾ᵢⱼ = D⁽ᵏ⁻¹⁾ᵢₖ + D⁽ᵏ⁻¹⁾ₖⱼ\n<\/li><li>\n取较小者。k 从 0 到 |V|。\n<\/ul>\n<h3>概念 2：Floyd-Warshall（难度：进阶）<\/h3>\n<pre><code>for k = 1..n\n  for i = 1..n\n    for j = 1..n\n      d[i][j] = min(d[i][j], d[i][k] + d[k][j])<\/code><\/pre>\n<p>复杂度 <strong>Θ(n³)<\/strong>，自动处理负权边（但不允许负权回路）。还能同步求「前驱矩阵 π」还原路径。 白话：允许中转站的编号从小到大，每放开一个新中转站 k，就看看「先到 k 再出发」有没有更短的路。<\/p>\n<h3>概念 3：基于矩阵乘法的慢算法（难度：进阶）<\/h3>\n<p>把「最短路径」看成一种特殊的矩阵乘法（把 × 换成 +，把 + 换成 min）。每「乘」一次相当于路径多松弛一步，乘 ⌈log n⌉ 次即可，复杂度 O(n³ log n)——比 Floyd-Warshall 慢，仅作思路演示。<\/p>\n<h3>概念 4：Johnson 算法（难度：高难）<\/h3>\n<p>思路分两步：<\/p>\n<ol><li>\n<strong>重赋权（reweight）<\/strong>：用 Bellman-Ford 加一个虚拟源点，算出每个顶点的势能 h(v)，令 w̃(u,v)=w(u,v)+h(u)−h(v)。关键结论：这样得到的新权 w̃(u,v) <strong>全部非负<\/strong>，且任意两点间最短路不变（路径上的 h 项首尾相消）。\n<\/li><li>\n对每个顶点跑一遍 Dijkstra，得到用 w̃ 的最短路，再把 h 项还原回真实距离。\n<p>复杂度 <strong>O(V² lg V + VE)<\/strong>，稀疏图上比 Floyd-Warshall 快。<\/p>\n<\/ol>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[任意两点最短路] --&gt; B{图有负权边?}\n    B --&gt;|稠密/简单| C[Floyd-Warshall: 三重循环 O(n³)]\n    B --&gt;|稀疏且有负权边| D[Johnson: 势能重赋权洗白成非负 → 跑 V 遍 Dijkstra]\n    C --&gt; E[d[i][k]+d[k][j] 与 d[i][j] 取小]\n    D --&gt; F[w̃=w+h[u]-h[v], 路径上 h 相消]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：Floyd-Warshall 靠「放开中转站」的递推；Johnson 靠「换一把不扭曲长短的尺子」（势能）把负权边问题变成 Dijkstra 能解的样子。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：Floyd-Warshall 像做「全国任意两城最短距离表」——每开放一个新枢纽机场，就更新一次「经此枢纽是否更快」。<strong>失效边界<\/strong>：有负权回路时距离会趋于 −∞，算法无意义。\n<\/li><li>\n<strong>实例<\/strong>：三顶点 a→b=3、b→c=1、a→c=10。k=b 时 d[a][c] 从 10 被刷新为 d[a][b]+d[b][c]=4。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为「所有结点对问题 = 跑 n 遍 Bellman-Ford」<\/strong>——那是 O(n²·n) = O(n³·… ) 中最慢的一档；Floyd-Warshall 同样 O(n³) 但常数小得多，Johnson 在稀疏图更快。\n<\/li><li>\n<strong>别以为「重赋权会改变最短路」<\/strong>——实际上 w̃ 上的最短路和 w 上的最短路一一对应，因为路径首尾的 h(u)−h(v) 会消掉。\n<\/li><li>\n<strong>别以为「Floyd-Warshall 要先拓扑排序」<\/strong>——它不要求 DAG，普通有向图直接三重循环。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n（单选）Floyd-Warshall 的运行时间是？（答案：C；解析：三重循环 Θ(n³)）\n<ul>\n<li>\nA. O(n²)   B. O(VE)   C. Θ(n³)   D. O(n³ log n)\n<\/li><li>\n（单选）Johnson 算法把负权边图变成非负图靠的是？（答案：B；解析：用势能 h 重赋权 w̃=w+h[u]−h[v]）\n<\/li><li>\nA. 删边   B. 势能重赋权   C. 拓扑排序   D. 取绝对值\n<\/li><li>\n（填空）Floyd-Warshall 的递推里，d[i][j] = min(d[i][j], __)。（答案：d[i][k]+d[k][j]；解析：经过中转站 k）\n<\/li><li>\n（简答）为什么重赋权 w̃(u,v)=w(u,v)+h(u)−h(v) 不改变最短路径？（答案：对任意路径 i→j，w̃ 求和时 +h(i)−h(j) 是常数差，路径之间的大小关系不变）\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\nFloyd-Warshall：放开中转站 k，O(n³)，容负权边不容负权回路。\n<\/li><li>\nJohnson：先势能重赋权洗白成非负，再每点跑 Dijkstra，稀疏图更优。\n<\/li><li>\n重赋权的代数本质：路径首尾 h 项相消，最短距离关系不变。\n<\/ul>", "ch26": "<h1>第 26 章：最大流<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：4 小时 | <strong>前置<\/strong>：第 22 章（图搜索）、第 24 章（最短路径思想）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说出流网络、容量、流量守恒的定义，以及「割」是什么。\n<\/li><li>\n用 Ford-Fulkerson（增广路）思想求最大流，解释残留网络与反向边的作用。\n<\/li><li>\n复述最大流-最小割定理，并用它判断一个流是不是最大。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p><strong>不断在「残留网络」里找从源 s 到汇 t 的增广路、能挤多少挤多少，直到再也找不到路——这时达到的流量就是最大流，它等于切断 s 与 t 所需的最小割容量。<\/strong><\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：流网络与流（难度：基础）<\/h3>\n<p><strong>流网络<\/strong> G=(V,E)，每条边 (u,v) 有非负<strong>容量<\/strong> c(u,v)。两个特殊点：源 s、汇 t。 <strong>流<\/strong> f 是一个函数，满足：<\/p>\n<ul><li>\n容量限制：0 ≤ f(u,v) ≤ c(u,v)\n<\/li><li>\n流量守恒：对所有非 s、t 的顶点，流入 = 流出（物料只经过不堆积，等价于 Kirchhoff 电流定律）。\n<p>流的值 |f| = 从 s 流出的总量。<strong>最大流问题<\/strong>：在容量限制下最大化 |f|。<\/p>\n<\/ul>\n<h3>概念 2：残留网络与增广路（难度：进阶）<\/h3>\n<p><strong>残留容量<\/strong> c_f(u,v) = c(u,v) − f(u,v)（还能再挤多少）。残留网络 G_f 由「还能前进的边」与「可以反悔后退的反向边」组成——反向边 c_f(v,u)=f(u,v) 表示「把已流过的水退回去」。 <strong>增广路<\/strong>：G_f 中一条 s→t 的路径。沿路径把每条边的流量加到其残留容量的瓶颈值，流的值就增大。<\/p>\n<h3>概念 3：Ford-Fulkerson 方法（难度：进阶）<\/h3>\n<pre><code>初始化 f=0\nwhile 残留网络 G_f 中存在 s→t 路径 p:\n    沿 p 增广（挤到瓶颈容量）\nreturn f<\/code><\/pre>\n<p>具体选路方式不同得到不同实现：用 BFS 选最短路即 <strong>Edmonds-Karp<\/strong>，复杂度 <strong>O(V E²)<\/strong>。 <strong>最大流-最小割定理（定理 26.6）<\/strong>：当残留网络中不再有 s→t 增广路时，当前流的值 = 所有 s-t 割中容量最小者。即「最大流 = 最小割」。<\/p>\n<h3>概念 4：最大二分匹配与推送-重贴标签（难度：高难）<\/h3>\n<ul><li>\n<strong>最大二分匹配<\/strong>：把「两边各一排人、可配对关系」建成源→左部→右部→汇的流网络，边容量全为 1，最大流即最大匹配（26.3）。\n<\/li><li>\n<strong>推送-重贴标签（push-relabel）<\/strong>：不要求全局守恒，逐个顶点「把超出的水推向更低的邻居」，不行就「重贴标签（抬高高度）」。前置重贴标签实现复杂度 <strong>O(V³)<\/strong>，是更快的最大流算法。\n<\/ul>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[初始流 f=0] --&gt; B[在残留网络找 s→t 增广路]\n    B --&gt;|找到| C[按路径瓶颈容量挤水, 更新 f]\n    C --&gt; B\n    B --&gt;|找不到| D[当前 f 即最大流]\n    D --&gt; E[最大流 = 最小 s-t 割容量]\n    F[反向边 c_f= f 允许反悔退流] -.-&gt; B<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：核心循环是「找路→挤水→更新残留」；反向边保证算法能「反悔」之前的选择，从而收敛到最优。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：最大流像水管网供水——每段管子有粗细（容量），你想让从水厂 s 到用户 t 的总流量最大。先随便通水，再看「哪些管还能加压、哪些接错了要退回来改道」。<strong>失效边界<\/strong>：容量为负或不允许流量守恒的场景不能直接套。\n<\/li><li>\n<strong>实例<\/strong>：s→a 容量 3，a→t 容量 2，s→b 容量 5，b→t 容量 4。第一路 s→a→t 挤 2；第二路 s→b→t 挤 4；最大流 = 6。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为「反向边是为了加新容量」<\/strong>——实际上反向边是「撤销之前的流」的账本，让算法能改错。\n<\/li><li>\n<strong>别以为「最大流问题只在水管里有用」<\/strong>——实际上二分匹配、航线调度、 bipartite 任务分配都能归约成最大流。\n<\/li><li>\n<strong>别以为「只要有路径就能无限增广」<\/strong>——实际上每条增广受路径上最小残留容量（瓶颈）限制，且算法必在有限步停（整数容量时）。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n（单选）流量守恒指的是？（答案：B；解析：非 s/t 顶点流入=流出）\n<ul>\n<li>\nA. 每条边流量相等   B. 中间顶点流入=流出   C. s 流出=0   D. t 流入任意\n<\/li><li>\n（单选）最大流-最小割定理说最大流等于？（答案：C；解析：最小 s-t 割的容量）\n<\/li><li>\nA. 边数   B. 顶点数   C. 最小割容量   D. 最大边容量\n<\/li><li>\n（填空）沿增广路一次能增广的量由路径上的__容量决定。（答案：瓶颈（最小残留）；解析：受最细那根管限制）\n<\/li><li>\n（简答）残留网络里反向边有什么用？（答案：表示可以把已经流过的流量退回去（f(u,v) 退成 0），从而允许算法修正之前的增广选择，最终收敛到最大流）\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n流网络：容量 c、守恒、源 s 汇 t。\n<\/li><li>\nFord-Fulkerson：反复在残留网络找增广路挤水；Edmonds-Karp=BFS 选路 O(VE²)。\n<\/li><li>\n最大流 = 最小割（找不到增广路即最优）。\n<\/ul>", "ch27": "<h1>第 27 章：多线程算法<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：2 小时 | <strong>前置<\/strong>：第 4 章（分治）、第 2 章（归并排序）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说出「工作量」和「持续时间」两个指标，以及它们如何衡量并行算法好不好。\n<\/li><li>\n用 spawn/sync 描述一个并行分治算法（如并行归并排序）。\n<\/li><li>\n算出并行算法在 P 个处理器上的近似运行时间。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p><strong>并行不是越快越好——用「工作量 T₁」（全部活加起来）和「持续时间 T∞」（关键路径长度）两个数衡量，在 P 个处理器上大约 T₁/P 到 T∞ 之间，忙等待浪费要避免。<\/strong><\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：动态多线程模型与 spawn/sync（难度：基础）<\/h3>\n<p>语言模型用两个关键字表达并行：<\/p>\n<ul><li>\n<strong>spawn<\/strong>：调用一个子程序，但不等待它结束（可以并行起来）。\n<\/li><li>\n<strong>sync<\/strong>：等待本函数之前 spawn 的所有子程序都完成，再继续。\n<p>白话：spawn 是「派出去干活不用盯着」，sync 是「出门前把派出去的人都收回来再走」。<\/p>\n<\/ul>\n<h3>概念 2：工作量 T₁、持续时间 T∞（难度：进阶）<\/h3>\n<ul><li>\n<strong>工作量 T₁<\/strong>：所有线程的指令总数之和（等于单处理器串行跑一遍的时间）。\n<\/li><li>\n<strong>持续时间 T∞<\/strong>：假设处理器无限多时，沿着「必须等前一步」的关键路径算下来的最短时间。\n<p><strong>并行加速比<\/strong> T₁/T∞ 越大说明可并行度越高；<strong>并行度<\/strong>就是这个比值。<\/p>\n<\/ul>\n<h3>概念 3：并行归并（难度：进阶）<\/h3>\n<p>归并两个已排好的数组：先二分定位「左数组中点」在右数组中的位置，把任务切成两块，spawn 出去并行归并，再 sync 合并。工作量 Θ(n)，持续时间 Θ(lg n)，并行度 Θ(n/lg n)。 同理可写<strong>并行归并排序<\/strong>：spawn 左右两半递归，sync 后并行归并。<\/p>\n<h3>概念 4：调度与近似运行时间（难度：基础）<\/h3>\n<p>在 P 个处理器上，贪心调度能保证运行时间在 T₁/P ~ T∞ 之间。<strong>理想并行时间<\/strong> ≈ T₁/P + T∞。 白话：P 个工人分总活 T₁，最好每个工人 T₁/P；但关键路径上的串行瓶颈 T∞ 无论多少工人都躲不掉。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[并行算法] --&gt; B[工作量 T1: 全部指令之和]\n    A --&gt; C[持续时间 T∞: 关键路径长度]\n    B --&gt; D[P 处理器: 约 T1/P + T∞]\n    C --&gt; E[加速比 T1/T∞ = 并行度]\n    F[spawn: 派活不等] --&gt; A\n    G[sync: 等所有派出的人回来] --&gt; A<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：T₁ 衡量「活有多少」，T∞ 衡量「瓶颈有多串行」；两者比值就是能吃多少个处理器。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：做一桌菜——洗菜切菜可以多人并行（工作量是总工序），但「必须先切完才能炒、必须先炒完才能出锅」这条链是持续时间。<strong>失效边界<\/strong>：spawn 太碎会让派活/同步开销吃掉并行收益（粒度问题）。\n<\/li><li>\n<strong>实例<\/strong>：并行归并 n 个元素：T₁=Θ(n)，T∞=Θ(lg n)。在 1000 个处理器上，n=10⁶ 时近似时间 ≈ n/1000 + lg n ≈ 1000 + 2000（单位），主要被 T∞ 拖住。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为「处理器越多一定越快」<\/strong>——实际上串行关键路径 T∞ 是天花板，超过并行度后加速比不再上升。\n<\/li><li>\n<strong>别以为「spawn 越多越好」<\/strong>——实际上派活和 sync 有开销，粒度过小反而更慢。\n<\/li><li>\n<strong>别以为「工作量就是串行算法时间」<\/strong>——在多线程模型里 T₁ 确实等于串行时间，但持续时间 T∞ 才是并行新引入的指标。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n（单选）持续时间 T∞ 指的是？（答案：C；解析：处理器无限多时关键路径的长度）\n<ul>\n<li>\nA. 总指令数   B. 内存大小   C. 关键路径最短时间   D. 处理器个数\n<\/li><li>\n（单选）spawn 的语义是？（答案：A；解析：派出去并行执行，不阻塞等待）\n<\/li><li>\nA. 并行调用不等待   B. 必须立即返回   C. 同步等待   D. 终止线程\n<\/li><li>\n（填空）在 P 个处理器上，近似运行时间为 T₁/P + __。（答案：T∞；解析：关键路径躲不掉）\n<\/li><li>\n（简答）为什么并行归并的持续时间是 Θ(lg n) 而不是 Θ(n)？（答案：每次二分把任务切成两块并行，递归深度是 lg n，关键路径沿递归深度走）\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n两个指标：工作量 T₁、持续时间 T∞；并行度 = T₁/T∞。\n<\/li><li>\nspawn 派活不等，sync 收齐再走。\n<\/li><li>\nP 处理器近似时间 ≈ T₁/P + T∞。\n<\/ul>", "ch28": "<h1>第 28 章：矩阵运算<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：3 小时 | <strong>前置<\/strong>：附录 D（矩阵）、第 4 章（Strassen）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n用 LUP 分解解线性方程组 Ax=b，并说出为什么要选主元（pivot）。\n<\/li><li>\n解释矩阵求逆与矩阵乘法为什么「一样快」（互相归约）。\n<\/li><li>\n说出对称正定矩阵的性质及其在最小二乘中的作用。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p><strong>解线性方程组的核心是把矩阵 A 拆成「下三角 L × 上三角 U × 置换 P」（LUP），再前代+回代两次搞定；选主元是为了避免除以一个接近 0 的数放大误差。<\/strong><\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：高斯消元与 LUP 分解（难度：进阶）<\/h3>\n<p>解 Ax=b 思路：若 A=LU（L 下三角、U 上三角），则先解 Ly=b（前代，自顶向下），再解 Ux=y（回代，自底向上），两次都是 Θ(n²)。 <strong>选主元（partial pivoting）<\/strong>：当前主元 a_{kk} 太小时，换一行把绝对值最大的那行换上来——否则除以一个极小的数会把舍入误差放大。这就是带置换矩阵 P：PA=LU。LUP 分解本身 Θ(n³)。<\/p>\n<h3>概念 2：矩阵求逆（难度：进阶）<\/h3>\n<p>A 可逆当且仅当 det(A)≠0。求 A⁻¹ 可以：对每一列 eᵢ 解 Axᵢ=eᵢ（共 n 次 LUP），把解拼成 A⁻¹。复杂度 Θ(n³)。 <strong>关键事实<\/strong>：矩阵求逆与矩阵乘法<strong>复杂度等价<\/strong>（互相归约）——能快速乘就能快速逆，反之亦然。<\/p>\n<h3>概念 3：对称正定矩阵（难度：高难）<\/h3>\n<p><strong>对称正定矩阵 A<\/strong>：A=Aᵀ，且对任意非零向量 x 有 xᵀAx&gt;0。好性质：可逆、所有主元为正、不用选主元就能做高斯消元、可分解为 A=LLᵀ（Cholesky 分解）。 典型用途：<strong>最小二乘<\/strong>——给一堆数据点拟合直线/曲线，正规方程 AᵀAx=Aᵀb 的 AᵀA 是对称正定的。<\/p>\n<h3>概念 4：与 Strassen 的关系（难度：进阶）<\/h3>\n<p>第 4 章 Strassen 把 n×n 矩阵乘法从朴素 Θ(n³) 降到 Θ(n^{lg 7})≈Θ(n^{2.81})；本章的 LUP 分解、求逆都以矩阵乘法为底层算子，因此也能享受同样的加速。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[解 Ax=b] --&gt; B[LUP 分解: PA=LU, Θ(n³)]\n    B --&gt; C[前代 Ly=Pb, 自顶向下]\n    C --&gt; D[回代 Ux=y, 自底向上]\n    E[选主元: 换最大绝对值行] -.-&gt; B\n    F[对称正定矩阵: A=LLᵀ, 不用选主元] -.-&gt; B\n    G[最小二乘: 正规方程 AᵀAx=Aᵀb] --&gt; F<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：整个流程是「先拆矩阵（LUP）→ 再两次三角回代」；选主元是数值稳定的保险，对称正定矩阵是简化版。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：LUP 像解连环方程组——先把每个未知数用前面的表示（前代），再从最后一个倒着解回去（回代）。选主元像「别拿太小的分母去除，否则一点误差都被放大」。<strong>失效边界<\/strong>：矩阵接近奇异（行列式≈0）时数值不稳定，需正规方程或正则化。\n<\/li><li>\n<strong>实例<\/strong>：解 2x+3y=8、x−y=1。消元得 x=y+1，代入 2(y+1)+3y=8 ⇒ y=6/5、x=11/5。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为「矩阵求逆是比矩阵乘法更难的问题」<\/strong>——实际上两者渐近复杂度等价，可以互相归约。\n<\/li><li>\n<strong>别以为「高斯消元不选主元也没问题」<\/strong>——实际上主元接近 0 会让舍入误差爆炸，必须选主元。\n<\/li><li>\n<strong>别以为「对称正定矩阵就是特征值为正」<\/strong>——对称正定等价于所有特征值为正，也等价于所有顺序主子式为正，互相可推。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n（单选）LUP 分解中的 P 表示？（答案：B；解析：置换矩阵，记录选主元时的换行）\n<ul>\n<li>\nA. 逆矩阵   B. 置换矩阵   C. 投影   D. 概率\n<\/li><li>\n（单选）为什么要选主元？（答案：C；解析：避免除以接近 0 的主元放大误差）\n<\/li><li>\nA. 加快速度   B. 减少内存   C. 数值稳定   D. 对称化\n<\/li><li>\n（填空）对称正定矩阵可分解为 A=__ᵀ。（答案：LL；解析：Cholesky 分解）\n<\/li><li>\n（简答）矩阵求逆和矩阵乘法的复杂度关系？（答案：渐近等价，可互相归约——快速乘法可加速求逆，快速求逆也可加速乘法）\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\nLUP：PA=LU，前代+回代解 Ax=b，分解 Θ(n³)。\n<\/li><li>\n选主元为数值稳定；对称正定矩阵免选主元、可 Cholesky。\n<\/li><li>\n求逆与乘法渐近等价。\n<\/ul>", "ch29": "<h1>第 29 章：线性规划<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：3 小时 | <strong>前置<\/strong>：第 28 章（矩阵）、附录 C（概率直觉）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n把一个「资源分配/利润最大化」问题写成线性规划的标准型。\n<\/li><li>\n说出可行域、顶点、目标函数等值面，并解释单纯形法为什么沿顶点走。\n<\/li><li>\n复述对偶的概念，知道原问题和对偶问题的最优值相等（弱对偶/强对偶）。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p><strong>线性规划 = 在「一堆线性不等式」围出的多面体里，找一个点让线性目标函数最大；单纯形法从一个顶点出发，沿着能改善目标的边走到相邻顶点，直到没有更好的邻居。<\/strong><\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：标准型与松弛型（难度：基础）<\/h3>\n<p><strong>标准型<\/strong>：max cᵀx，约束 Ax ≤ b，x ≥ 0。（min 可加负号变 max；等式约束拆成两个 ≤）。 <strong>松弛型<\/strong>：引入松弛变量把不等式变等式——x₃ = b₁ − a₁x₁ − a₂x₂ ≥ 0。这样所有约束都成了「左边是基本变量、右边是非基本变量」的方程组，便于迭代。<\/p>\n<h3>概念 2：可行域与顶点（难度：基础）<\/h3>\n<p>约束 Ax ≤ b、x≥0 在 n 维空间围出一个凸多面体（<strong>可行域<\/strong>）。最优解一定能在某个<strong>顶点（vertex）<\/strong>取到（若存在有限最优）。两个顶点若共享 n−1 个约束面，叫<strong>相邻<\/strong>。<\/p>\n<h3>概念 3：单纯形法（难度：进阶）<\/h3>\n<pre><code>从一个可行顶点出发:\n  在非基本变量里挑一个「进基」: 它增大能让目标系数 c 改善\n  按约束确定它最多能增到多大(某个松弛变量变 0)——那个变量「出基」\n  换基(进基变量换出基变量), 得到相邻顶点\n重复直到没有进基变量能改善目标<\/code><\/pre>\n<p>白话：在多面体的顶点上一步步「走下坡/上坡」，每次走到相邻且目标更优的顶点。 最坏情况指数级（Klee-Minty 立方体），但实际极快。<\/p>\n<h3>概念 4：对偶（难度：高难）<\/h3>\n<p><strong>对偶问题<\/strong>：原问题 max cᵀx s.t. Ax≤b, x≥0 的对偶是 min bᵀy s.t. Aᵀy ≥ c, y≥0。<\/p>\n<ul><li>\n<strong>弱对偶<\/strong>：任意可行 x 与 y，cᵀx ≤ bᵀy（原问题的值 ≤ 对偶的值）。\n<\/li><li>\n<strong>强对偶<\/strong>：若原问题有有限最优解，则对偶也有，且最优值相等。\n<p>白话：原问题想「在不超过预算下多赚」，对偶问题想「给资源定价使总价值不低于任何产出」，两者最优值锁死相等。<\/p>\n<\/ul>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[LP 问题: max cᵀx, Ax≤b, x≥0] --&gt; B[约束围出凸多面体可行域
