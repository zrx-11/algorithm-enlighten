p' id='path-09'><strong>步骤 09：顺序统计<\/strong><br>阅读：<a href=\"#/chapter/ch09\">第 9 章：中位数和顺序统计量<\/a><br>检查点：通过该章自测题（≥80%）<\/li><li class='path-step' id='path-10'><strong>步骤 10：基本数据结构<\/strong><br>阅读：<a href=\"#/chapter/ch10\">第 10 章：基本数据结构<\/a><br>检查点：通过该章自测题（≥80%）<\/li><li class='path-step' id='path-11'><strong>步骤 11：散列表<\/strong><br>阅读：<a href=\"#/chapter/ch11\">第 11 章：散列表<\/a><br>检查点：通过该章自测题（≥80%）<\/li><li class='path-step' id='path-12'><strong>步骤 12：二叉搜索树<\/strong><br>阅读：<a href=\"#/chapter/ch12\">第 12 章：二叉搜索树<\/a><br>检查点：通过该章自测题（≥80%）<\/li><li class='path-step' id='path-13'><strong>步骤 13：红黑树<\/strong><br>阅读：<a href=\"#/chapter/ch13\">第 13 章：红黑树<\/a><br>检查点：通过该章自测题（≥80%）<\/li><li class='path-step' id='path-14'><strong>步骤 14：数据结构扩张<\/strong><br>阅读：<a href=\"#/chapter/ch14\">第 14 章：数据结构的扩张<\/a><br>检查点：通过该章自测题（≥80%）<\/li><li class='path-step' id='path-15'><strong>步骤 15：动态规划<\/strong><br>阅读：<a href=\"#/chapter/ch15\">第 15 章：动态规划<\/a><br>检查点：通过该章自测题（≥80%）<\/li><li class='path-step' id='path-16'><strong>步骤 16：贪心算法<\/strong><br>阅读：<a href=\"#/chapter/ch16\">第 16 章：贪心算法<\/a><br>检查点：通过该章自测题（≥80%）<\/li><li class='path-step' id='path-17'><strong>步骤 17：摊还分析<\/strong><br>阅读：<a href=\"#/chapter/ch17\">第 17 章：摊还分析<\/a><br>检查点：通过该章自测题（≥80%）<\/li><li class='path-step' id='path-18'><strong>步骤 18：B 树<\/strong><br>阅读：<a href=\"#/chapter/ch18\">第 18 章：B 树<\/a><br>检查点：通过该章自测题（≥80%）<\/li><li class='path-step' id='path-19'><strong>步骤 19：斐波那契堆<\/strong><br>阅读：<a href=\"#/chapter/ch19\">第 19 章：斐波那契堆<\/a><br>检查点：通过该章自测题（≥80%）<\/li><li class='path-step' id='path-20'><strong>步骤 20：vEB 树<\/strong><br>阅读：<a href=\"#/chapter/ch20\">第 20 章：van Emde Boas 树<\/a><br>检查点：通过该章自测题（≥80%）<\/li><li class='path-step' id='path-21'><strong>步骤 21：并查集<\/strong><br>阅读：<a href=\"#/chapter/ch21\">第 21 章：用于不相交集合的数据结构<\/a><br>检查点：通过该章自测题（≥80%）<\/li><li class='path-step' id='path-22'><strong>步骤 22：图搜索<\/strong><br>阅读：<a href=\"#/chapter/ch22\">第 22 章：基本的图算法<\/a><br>检查点：通过该章自测题（≥80%）<\/li><li class='path-step' id='path-23'><strong>步骤 23：最小生成树<\/strong><br>阅读：<a href=\"#/chapter/ch23\">第 23 章：最小生成树<\/a><br>检查点：通过该章自测题（≥80%）<\/li><li class='path-step' id='path-24'><strong>步骤 24：单源最短路<\/strong><br>阅读：<a href=\"#/chapter/ch24\">第 24 章：单源最短路径<\/a><br>检查点：通过该章自测题（≥80%）<\/li><li class='path-step' id='path-25'><strong>步骤 25：所有点对最短路<\/strong><br>阅读：<a href=\"#/chapter/ch25\">第 25 章：所有结点对的最短路径<\/a><br>检查点：通过该章自测题（≥80%）<\/li><li class='path-step' id='path-26'><strong>步骤 26：最大流<\/strong><br>阅读：<a href=\"#/chapter/ch26\">第 26 章：最大流<\/a><br>检查点：通过该章自测题（≥80%）<\/li><li class='path-step' id='path-27'><strong>步骤 27：多线程算法<\/strong><br>阅读：<a href=\"#/chapter/ch27\">第 27 章：多线程算法<\/a><br>检查点：通过该章自测题（≥80%）<\/li><li class='path-step' id='path-28'><strong>步骤 28：矩阵运算<\/strong><br>阅读：<a href=\"#/chapter/ch28\">第 28 章：矩阵运算<\/a><br>检查点：通过该章自测题（≥80%）<\/li><li class='path-step' id='path-29'><strong>步骤 29：线性规划<\/strong><br>阅读：<a href=\"#/chapter/ch29\">第 29 章：线性规划<\/a><br>检查点：通过该章自测题（≥80%）<\/li><li class='path-step' id='path-30'><strong>步骤 30：多项式与 FFT<\/strong><br>阅读：<a href=\"#/chapter/ch30\">第 30 章：多项式与快速傅里叶变换<\/a><br>检查点：通过该章自测题（≥80%）<\/li><li class='path-step' id='path-31'><strong>步骤 31：数论与 RSA<\/strong><br>阅读：<a href=\"#/chapter/ch31\">第 31 章：数论算法<\/a><br>检查点：通过该章自测题（≥80%）<\/li><li class='path-step' id='path-32'><strong>步骤 32：字符串匹配<\/strong><br>阅读：<a href=\"#/chapter/ch32\">第 32 章：字符串匹配<\/a><br>检查点：通过该章自测题（≥80%）<\/li><li class='path-step' id='path-33'><strong>步骤 33：计算几何<\/strong><br>阅读：<a href=\"#/chapter/ch33\">第 33 章：计算几何学<\/a><br>检查点：通过该章自测题（≥80%）<\/li><li class='path-step' id='path-34'><strong>步骤 34：NP 完全性<\/strong><br>阅读：<a href=\"#/chapter/ch34\">第 34 章：NP 完全性<\/a><br>检查点：通过该章自测题（≥80%）<\/li><li class='path-step' id='path-35'><strong>步骤 35：近似算法<\/strong><br>阅读：<a href=\"#/chapter/ch35\">第 35 章：近似算法<\/a><br>检查点：通过该章自测题（≥80%）<\/li><li class='path-step' id='path-36'><strong>步骤 36：附录 A 求和<\/strong><br>阅读：<a href=\"#/chapter/ch36\">附录 A：求和<\/a><br>检查点：通过该章自测题（≥80%）<\/li><li class='path-step' id='path-37'><strong>步骤 37：附录 B 离散数学<\/strong><br>阅读：<a href=\"#/chapter/ch37\">附录 B：集合、关系、函数、图、树<\/a><br>检查点：通过该章自测题（≥80%）<\/li><li class='path-step' id='path-38'><strong>步骤 38：附录 C 概率<\/strong><br>阅读：<a href=\"#/chapter/ch38\">附录 C：计数与概率<\/a><br>检查点：通过该章自测题（≥80%）<\/li><li class='path-step' id='path-39'><strong>步骤 39：附录 D 矩阵<\/strong><br>阅读：<a href=\"#/chapter/ch39\">附录 D：矩阵<\/a><br>检查点：通过该章自测题（≥80%）<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "kind": "path", "title": "学习路径"}, "__quiz_all__": {"html": "<div class='quiz-item' data-qid='q040' data-type='single'><p class='quiz-q'><b>Q40.<\/b> 下列哪个算法不基于贪心？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q040' value='0'> Kruskal MST<\/label><label class='quiz-opt'><input type='radio' name='q040' value='1'> Dijkstra<\/label><label class='quiz-opt'><input type='radio' name='q040' value='2'> 赫夫曼编码<\/label><label class='quiz-opt'><input type='radio' name='q040' value='3'> 矩阵链乘 DP<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q041' data-type='single'><p class='quiz-q'><b>Q41.<\/b> 下列哪个问题是 NP 完全的？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q041' value='0'> 最短路径<\/label><label class='quiz-opt'><input type='radio' name='q041' value='1'> 最小生成树<\/label><label class='quiz-opt'><input type='radio' name='q041' value='2'> 哈密顿回路<\/label><label class='quiz-opt'><input type='radio' name='q041' value='3'> 排序<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q042' data-type='single'><p class='quiz-q'><b>Q42.<\/b> 关于 Dijkstra 与 Bellman-Ford，正确的是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q042' value='0'> 都容负权边<\/label><label class='quiz-opt'><input type='radio' name='q042' value='1'> Dijkstra 不容负权边<\/label><label class='quiz-opt'><input type='radio' name='q042' value='2'> Bellman-Ford 更快<\/label><label class='quiz-opt'><input type='radio' name='q042' value='3'> 都需要拓扑排序<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q043' data-type='single'><p class='quiz-q'><b>Q43.<\/b> 最大流可直接用来求解？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q043' value='0'> 二分图最大匹配<\/label><label class='quiz-opt'><input type='radio' name='q043' value='1'> 最短路<\/label><label class='quiz-opt'><input type='radio' name='q043' value='2'> 排序<\/label><label class='quiz-opt'><input type='radio' name='q043' value='3'> 凸包<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div>", "kind": "quiz", "title": "综合测验"}, "__quiz_ch01__": {"html": "<h1>测验：第 1 章：算法在计算中的作用<\/h1><div class='quiz-item' data-qid='q001' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 算法是什么？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q001' value='0'> 一种数据结构<\/label><label class='quiz-opt'><input type='radio' name='q001' value='1'> 把输入映射到输出的确定性指令序列<\/label><label class='quiz-opt'><input type='radio' name='q001' value='2'> 一种编程语言<\/label><label class='quiz-opt'><input type='radio' name='q001' value='3'> 一种图形界面<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch02__": {"html": "<h1>测验：第 2 章：算法基础<\/h1><div class='quiz-item' data-qid='q002' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 归并排序的递归式是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q002' value='0'> T(n)=T(n/2)+n<\/label><label class='quiz-opt'><input type='radio' name='q002' value='1'> T(n)=2T(n/2)+Θ(n)<\/label><label cl 'quiz-item' data-qid='q036' data-type='single'><p class='quiz-q'><b>Q1.<\/b> Σ_{k=1}^{n} k 的渐近阶是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q036' value='0'> Θ(n)<\/label><label class='quiz-opt'><input type='radio' name='q036' value='1'> Θ(n²)<\/label><label class='quiz-opt'><input type='radio' name='q036' value='2'> Θ(n³)<\/label><label class='quiz-opt'><input type='radio' name='q036' value='3'> Θ(lg n)<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch37__": {"html": "<h1>测验：附录 B：集合、关系、函数、图、树<\/h1><div class='quiz-item' data-qid='q037' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 自反+对称+传递的关系叫？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q037' value='0'> 偏序<\/label><label class='quiz-opt'><input type='radio' name='q037' value='1'> 等价关系<\/label><label class='quiz-opt'><input type='radio' name='q037' value='2'> 函数<\/label><label class='quiz-opt'><input type='radio' name='q037' value='3'> 空关系<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch38__": {"html": "<h1>测验：附录 C：计数与概率<\/h1><div class='quiz-item' data-qid='q038' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 期望线性 E[X+Y]=E[X]+E[Y] 要求什么？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q038' value='0'> X、Y 独立<\/label><label class='quiz-opt'><input type='radio' name='q038' value='1'> 无要求<\/label><label class='quiz-opt'><input type='radio' name='q038' value='2'> X、Y 同分布<\/label><label class='quiz-opt'><input type='radio' name='q038' value='3'> X、Y 不相关<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch39__": {"html": "<h1>测验：附录 D：矩阵<\/h1><div class='quiz-item' data-qid='q039' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 矩阵 A 可逆当且仅当？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q039' value='0'> A=Aᵀ<\/label><label class='quiz-opt'><input type='radio' name='q039' value='1'> det(A)≠0<\/label><label class='quiz-opt'><input type='radio' name='q039' value='2'> A 全为正<\/label><label class='quiz-opt'><input type='radio' name='q039' value='3'> A 是 3×3<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__cards__": {"html": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "kind": "cards", "title": "抽认卡"}, "__glossary__": {"html": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='算法'>算法 — 把输入映射到输出的确定性指令序列 <span class=glossary-ref>（第 1 章：算法在计算中的作用）<\/span><\/li><li data-term='θ/o/ω'>Θ/O/Ω — 渐近精确阶/上界/下界 <span class=glossary-ref>（第 3 章：函数的增长）<\/span><\/li><li data-term='主方法'>主方法 — 给 T(n)=aT(n/b)+f(n) 定阶的三情况表 <span class=glossary-ref>（第 4 章：分治策略）<\/span><\/li><li data-term='分治'>分治 — 切分子问题、递归解、合并 <span class=glossary-ref>（第 4 章：分治策略）<\/span><\/li><li data-term='指示器随机变量'>指示器随机变量 — 取值 0/1 的随机变量，用于算期望 <span class=glossary-ref>（第 5 章：概率分析和随机算法）<\/span><\/li><li data-term='堆'>堆 — 父键≥子键的完全二叉树数组 <span class=glossary-ref>（第 6 章：堆排序）<\/span><\/li><li data-term='优先队列'>优先队列 — 支持取最大/最小的队列 <span class=glossary-ref>（第 6 章：堆排序）<\/span><\/li><li data-term='计数排序'>计数排序 — 用计数桶的线性时间排序 <span class=glossary-ref>（第 8 章：线性时间排序）<\/span><\/li><li data-term='栈'>栈 — 后进先出 LIFO <span class=glossary-ref>（第 10 章：基本数据结构）<\/span><\/li><li data-term='队列'>队列 — 先进先出 FIFO <span class=glossary-ref>（第 10 章：基本数据结构）<\/span><\/li><li data-term='散列函数'>散列函数 — 把 key 映射到数组下标的函数 <span class=glossary-ref>（第 11 章：散列表）<\/span><\/li><li data-term='碰撞'>碰撞 — 不同 key 映到同一槽 <span class=glossary-ref>（第 11 章：散列表）<\/span><\/li><li data-term='装载因子'>装载因子 — 元素数/槽数 <span class=glossary-ref>（第 11 章：散列表）<\/span><\/li><li data-term='二叉搜索树'>二叉搜索树 — 左&lt;根&lt;右的二叉树 <span class=glossary-ref>（第 12 章：二叉搜索树）<\/span><\/li><li data-term='红黑树'>红黑树 — 5 条性质保平衡的 BST <span class=glossary-ref>（第 13 章：红黑树）<\/span><\/li><li data-term='旋转'>旋转 — 调整树结构保平衡的操作 <span class=glossary-ref>（第 13 章：红黑树）<\/span><\/li><li data-term='最优子结构'>最优子结构 — 全局最优含子问题最优 <span class=glossary-ref>（第 15 章：动态规划）<\/span><\/li><li data-term='重叠子问题'>重叠子问题 — 递归反复用到同一小问题 <span class=glossary-ref>（第 15 章：动态规划）<\/span><\/li><li data-term='动态规划'>动态规划 — 存子问题答案自底向上填表 <span class=glossary-ref>（第 15 章：动态规划）<\/span><\/li><li data-term='贪心选择性质'>贪心选择性质 — 局部最优可推全局最优 <span class=glossary-ref>（第 16 章：贪心算法）<\/span><\/li><li data-term='摊还分析'>摊还分析 — 一整段操作的平均代价 <span class=glossary-ref>（第 17 章：摊还分析）<\/span><\/li><li data-term='b 树'>B 树 — 多路平衡查找树，磁盘友好 <span class=glossary-ref>（第 18 章：B 树）<\/span><\/li><li data-term='斐波那契堆'>斐波那契堆 — 松弛堆，decrease-key 均摊 O(1) <span class=glossary-ref>（第 19 章：斐波那契堆）<\/span><\/li><li data-term='并查集'>并查集 — 支持 UNION/FIND-SET 的结构 <span class=glossary-ref>（第 21 章：用于不相交集合的数据结构）<\/span><\/li><li data-term='路径压缩'>路径压缩 — 查找时把节点直接挂到根 <span class=glossary-ref>（第 21 章：用于不相交集合的数据结构）<\/span><\/li><li data-term='按秩合并'>按秩合并 — 把矮树挂到高树根下 <span class=glossary-ref>（第 21 章：用于不相交集合的数据结构）<\/span><\/li><li data-term='bfs'>BFS — 广度优先，队列按层扩 <span class=glossary-ref>（第 22 章：基本的图算法）<\/span><\/li><li data-term='dfs'>DFS — 深度优先，栈一条路走到底 <span class=glossary-ref>（第 22 章：基本的图算法）<\/span><\/li><li data-term='拓扑排序'>拓扑排序 — DAG 顶点按完成时间逆序 <span class=glossary-ref>（第 22 章：基本的图算法）<\/span><\/li><li data-term='强连通分量'>强连通分量 — 互相可达的最大顶点集 <span class=glossary-ref>（第 22 章：基本的图算法）<\/span><\/li><li data-term='生成树'>生成树 — 连通所有顶点的无环边集 <span class=glossary-ref>（第 23 章：最小生成树）<\/span><\/li><li data-term='切分'>切分 — 把 V 分成 S 与 V−S <span class=glossary-ref>（第 23 章：最小生成树）<\/span><\/li><li data-term='松弛'>松弛 — d[u]+w(u,v)&lt;d[v] 就更新 <span class=glossary-ref>（第 24 章：单源最短路径）<\/span><\/li><li data-term='负权回路'>负权回路 — 总权为负的环，最短路不存在 <span class=glossary-ref>（第 24 章：单源最短路径）<\/span><\/li><li data-term='残留网络'>残留网络 — 还能前进+可退流的图 <span class=glossary-ref>（第 26 章：最大流）<\/span><\/li><li data-term='增广路'>增广路 — 残留网络中 s→t 路径 <span class=glossary-ref>（第 26 章：最大流）<\/span><\/li><li data-term='最大流-最小割'>最大流-最小割 — 最大流值=最小 s-t 割容量 <span class=glossary-ref>（第 26 章：最大流）<\/span><\/li><li data-term='工作量 t₁'>工作量 T₁ — 并行算法全部指令之和 <span class=glossary-ref>（第 27 章：多线程算法）<\/span><\/li><li data-term='持续时间 t∞'>持续时间 T∞ — 关键路径长度 <span class=glossary-ref>（第 27 章：多线程算法）<\/span><\/li><li data-term='lup 分解'>LUP 分解 — PA=LU 三角分解 <span class=glossary-ref>（第 28 章：矩阵运算）<\/span><\/li><li data-term='选主元'>选主元 — 换行把最大绝对值换到主元位 <span class=glossary-ref>（第 28 章：矩阵运算）<\/span><\/li><li data-term='对称正定矩阵'>对称正定矩阵 — A=Aᵀ 且 xᵀAx&gt;0 <span class=glossary-ref>（第 28 章：矩阵运算）<\/span><\/li><li data-term='标准型 lp'>标准型 LP — max cᵀx, Ax≤b, x≥0 <span class=glossary-ref>（第 29 章：线性规划）<\/span><\/li><li data-term='单纯形法'>单纯形法 — 沿可行域顶点爬坡 <span class=glossary-ref>（第 29 章：线性规划）<\/span><\/li><li data-term='对偶'>对偶 — LP 的配对问题，最优值相等 <span class=glossary-ref>（第 29 章：线性规划）<\/span><\/li><li data-term='dft/fft'>DFT/FFT — 离散傅里叶变换/快速算法 <span class=glossary-ref>（第 30 章：多项式与快速傅里叶变换）<\/span><\/li><li data-term='欧几里得算法'>欧几里得算法 — 辗转相除求 gcd <span class=glossary-ref>（第 31 章：数论算法）<\/span><\/li><li data-term='模逆元'>模逆元 — ax≡1 mod n 的 x <span class=glossary-ref>（第 31 章：数论算法）<\/span><\/li><li data-term='反复平方'>反复平方 — O(lg b) 算 aᵇ mod n <span class=glossary-ref>（第 31 章：数论算法）<\/span><\/li><li data-term='rsa'>RSA — 大素数公钥加密 <span class=glossary-ref>（第 31 章：数论算法）<\/span><\/li><li data-term='前缀函数 π'>前缀函数 π — KMP 中前 q 字符的最长真前后缀 <span class=glossary-ref>（第 32 章：字符串匹配）<\/span><\/li><li data-term='rabin-karp'>Rabin-Karp — 滚动哈希字符串匹配 <span class=glossary-ref>（第 32 章：字符串匹配）<\/span><\/li><li data-term='叉积'>叉积 — x₁y₂−x₂y₁，符号表转向 <span class=glossary-ref>（第 33 章：计算几何学）<\/span><\/li><li data-term='凸包'>凸包 — 包住所有点的最小凸多边形 <span class=glossary-ref>（第 33 章：计算几何学）<\/span><\/li><li data-term='p'>P — 多项式时间可解类 <span class=glossary-ref>（第 34 章：NP 完全性）<\/span><\/li><li data-term='np'>NP — 多项式时间可验证答案类 <span class=glossary-ref>（第 34 章：NP 完全性）<\/span><\/li><li data-term='npc'>NPC — NP 中最难，所有 NP 可归约到它 <span class=glossary-ref>（第 34 章：NP 完全性）<\/span><\/li><li data-term='多项式归约'>多项式归约 — A 输入多项式变 B 输入 <span class=glossary-ref>（第 34 章：NP 完全性）<\/span><\/li><li data-term='cook-levin'>Cook-Levin — SAT 是首个 NPC 证明 <span class=glossary-ref>（第 34 章：NP 完全性）<\/span><\/li><li data-term='近似比 ρ'>近似比 ρ — 算法解/最优解的最坏比值 <span class=glossary-ref>（第 35 章：近似算法）<\/span><\/li><li data-term='fptas'>FPTAS — 完全多项式近似方案 <span class=glossary-ref>（第 35 章：近似算法）<\/span><\/li><li data-term='等比级数'>等比级数 — Σ xᵏ 求和公式 <span class=glossary-ref>（附录 A：求和）<\/span><\/li><li data-term='等价关系'>等价关系 — 自反+对称+传递 <span class=glossary-ref>（附录 B：集合、关系、函数、图、树）<\/span><\/li><li data-term='双射'>双射 — 既单又满的函数 <span class=glossary-ref>（附录 B：集合、关系、函数、图、树）<\/span><\/li><li data-term='二项分布'>二项分布 — n 次伯努利成功 k 次 <span class=glossary-ref>（附录 C：计数与概率）<\/span><\/li><li data-term='期望线性'>期望线性 — E[aX+bY]=aE[X]+bE[Y] <span class=glossary-ref>（附录 C：计数与概率）<\/span><\/li><li data-term='行列式'>行列式 — 可逆当且仅当 det≠0 <span class=glossary-ref>（附录 D：矩阵）<\/span><\/li><\/ul>", "kind": "glossary", "title": "术语表"}, "__patterns__": {"html": "<h1>模式与框架库<\/h1>\n<h2>框架：算法分析四步<\/h2>\n<ol><li>\n<strong>写递归式<\/strong>：把算法写成 T(n)=aT(n/b)+f(n) 或直接计数操作。\n<\/li><li>\n<strong>定渐近阶<\/strong>：用主方法/递归树/积分夹逼给出 Θ/O。\n<\/li><li>\n<strong>看最坏与期望<\/strong>：区分 worst-case 与 average-case（快排是典型）。\n<\/li><li>\n<strong>找常数与实现<\/strong>：渐近阶相同时常数决定谁更快（如快排 vs 归并）。\n<\/ol>\n<h2>框架：设计算法三范式<\/h2>\n<ul><li>\n<strong>分治<\/strong>：子问题不重叠 → 递归+合并。\n<\/li><li>\n<strong>动态规划<\/strong>：子问题重叠 + 最优子结构 → 填表。\n<\/li><li>\n<strong>贪心<\/strong>：再叠加「贪心选择性质」→ 每步选当前最优不回头。\n<\/ul>\n<h2>决策规则<\/h2>\n<h3>该用哪个排序？<\/h3>\n<ul><li>\n数据小、基本有序：插入排序。\n<\/li><li>\n通用、内存够：快排（期望 O(n lg n)）。\n<\/li><li>\n要求稳定且最坏 O(n lg n)：归并排序。\n<\/li><li>\n数据在 [0,k] 范围：计数/基数排序 O(n+k)。\n<\/li><li>\n需要实时取最大/最小：堆排序/优先队列。\n<\/ul>\n<h3>该用哪个最短路？<\/h3>\n<ul><li>\n边权非负：Dijkstra O(E lg V)。\n<\/li><li>\n可含负权边：Bellman-Ford O(VE)。\n<\/li><li>\nDAG：拓扑序松弛 O(V+E)。\n<\/li><li>\n所有点对：稠密图 Floyd-Warshall O(n³)；稀疏图 Johnson。\n<\/ul>\n<h3>问题是 NPC 怎么办？<\/h3>\n<ol><li>\n先确认是否真在 NP 内。\n<\/li><li>\n找已知 NPC 问题做多项式归约。\n<\/li><li>\n若确认 NPC：放弃精确多项式，转向近似算法（证明 ρ）、启发式、或指数级但实用（分支定界）。\n<\/ol>\n<h2>反模式<\/h2>\n<h3>反模式 1：把「平均情况」当「最坏情况」<\/h3>\n<p>快排平均 O(n lg n)，但最坏 O(n²)（已排序输入+选首元素为枢轴）。<strong>替代<\/strong>：随机化选枢轴，把最坏变成概率意义上的小概率事件。<\/p>\n<h3>反模式 2：用朴素递归不存子问题<\/h3>\n<p>写 Fibonacci 递归 f(n)=f(n−1)+f(n−2) 是指数的；<strong>替代<\/strong>：记忆化或自底向上 DP 表，O(n)。<\/p>\n<h3>反模式 3：Dijkstra 用在负权边图上<\/h3>\n<p>「先定死最小 d」在负权边图上会被后续负权边推翻。<strong>替代<\/strong>：负权边用 Bellman-Ford；负权回路不存在最短路。<\/p>\n<h3>反模式 4：忽略摊还分析被单次最坏吓到<\/h3>\n<p>动态表单次扩张 Θ(n)，但均摊 O(1)。<strong>替代<\/strong>：看一整段操作的总成本，而不是单次峰值。<\/p>\n<h3>反模式 5：归约时放大输入规模<\/h3>\n<p>NPC 证明中把 A 输入指数变换成 B 输入，不算多项式归约。<strong>替代<\/strong>：保证变换是多项式时间且等价。<\/p>\n<h3>反模式 6：把 NPC 问题硬磕精确多项式<\/h3>\n<p>找不到就怀疑自己。<strong>替代<\/strong>：先查它是不是已知 NPC（SAT/团/顶点覆盖/哈密顿/TSP/子集和），若是就走近似或指数路线。<\/p>", "kind": "模式库", "title": "模式库"}, "__cheatsheet__": {"html": "<h1>速查表<\/h1>\n<h2>算法复杂度速查<\/h2>\n<table><thead><tr><th>算法<\/th><th>最坏<\/th><th>期望<\/th><th>备注<\/th><\/tr><\/thead><tbody><tr><td>插入排序<\/td><td>Θ(n²)<\/td><td>—<\/td><td>小数据/基本有序快<\/td><\/tr><tr><td>归并排序<\/td><td>Θ(n lg n)<\/td><td>—<\/td><td>稳定，需 O(n) 额外空间<\/td><\/tr><tr><td>堆排序<\/td><td>O(n lg n)<\/td><td>—<\/td><td>原地，不稳定<\/td><\/tr><tr><td>快速排序<\/td><td>Θ(n²)<\/td><td>Θ(n lg n)<\/td><td>随机化枢轴<\/td><\/tr><tr><td>计数排序<\/td><td>O(n+k)<\/td><td>—<\/td><td>数据范围 [0,k]<\/td><\/tr><tr><td>基数排序<\/td><td>O(d(n+k))<\/td><td>—<\/td><td>d 位、每位 [0,k]<\/td><\/tr><tr><td>顺序统计(最坏线性)<\/td><td>Θ(n)<\/td><td>—<\/td><td>BFPRT 选中位数<\/td><\/tr><tr><td>BFS / DFS<\/td><td>O(V+E)<\/td><td>—<\/td><td>—<\/td><\/tr><tr><td>拓扑排序<\/td><td>O(V+E)<\/td><td>—<\/td><td>DAG<\/td><\/tr><tr><td>Kruskal<\/td><td>O(E lg V)<\/td><td>—<\/td><td>并查集<\/td><\/tr><tr><td>Prim (二叉堆)<\/td><td>O(E lg V)<\/td><td>—<\/td><td>斐波那契堆 O(E+V lg V)<\/td><\/tr><tr><td>Bellman-Ford<\/td><td>O(VE)<\/td><td>—<\/td><td>容负权边<\/td><\/tr><tr><td>Dijkstra<\/td><td>O(E lg V)<\/td><td>—<\/td><td>不容负权边<\/td><\/tr><tr><td>Floyd-Warshall<\/td><td>Θ(n³)<\/td><td>—<\/td><td>所有点对<\/td><\/tr><tr><td>Johnson<\/td><td>O(V² lg V+VE)<\/td><td>—<\/td><td>稀疏图+负权边<\/td><\/tr><tr><td>Edmonds-Karp<\/td><td>O(VE²)<\/td><td>—<\/td><td>BFS 增广<\/td><\/tr><tr><td>Push-relabel<\/td><td>O(V³)<\/td><td>—<\/td><td>前置重贴标签<\/td><\/tr><\/tbody><\/table>\n<h2>主方法三情况（T(n)=aT(n/b)+f(n)）<\/h2>\n<table><thead><tr><th>情况<\/th><th>条件<\/th><th>解<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>f(n)=O(n^{log_b a−ε})<\/td><td>Θ(n^{log_b a})<\/td><\/tr><tr><td>2<\/td><td>f(n)=Θ(n^{log_b a})<\/td><td>Θ(n^{log_b a}·lg n)<\/td><\/tr><tr><td>3<\/td><td>f(n)=Ω(n^{log_b a+ε}) 且正则<\/td><td>Θ(f(n))<\/td><\/tr><\/tbody><\/table>\n<h2>常用求和<\/h2>\n<table><thead><tr><th>求和<\/th><th>结果<\/th><\/tr><\/thead><tbody><tr><td>Σ_{k=1}^{n} k<\/td><td>n(n+1)/2 = Θ(n²)<\/td><\/tr><tr><td>Σ_{k=1}^{n} k²<\/td><td>n(n+1)(2n+1)/6 = Θ(n³)<\/td><\/tr><tr><td>Σ_{k=0}^{n} xᵏ (x≠1)<\/td><td>(x^{n+1}−1)/(x−1)<\/td><\/tr><tr><td>Σ_{k=0}^{∞} xᵏ (\\<\/td><td>x\\<\/td><td>&lt;1)<\/td><td>1/(1−x)<\/td><\/tr><tr><td>Hₙ = Σ1/k<\/td><td>Θ(lg n)<\/td><\/tr><\/tbody><\/table>\n<h2>数据结构操作复杂度<\/h2>\n<table><thead><tr><th>结构<\/th><th>查找<\/th><th>插入<\/th><th>删除<\/th><\/tr><\/thead><tbody><tr><td>有序数组<\/td><td>O(lg n)<\/td><td>O(n)<\/td><td>O(n)<\/td><\/tr><tr><td>链表<\/td><td>O(n)<\/td><td>O(1)<\/td><td>O(1)（给定结点）<\/td><\/tr><tr><td>散列表<\/td><td>期望 O(1)<\/td><td>期望 O(1)<\/td><td>期望 O(1)<\/td><\/tr><tr><td>二叉搜索树<\/td><td>O(n) 最坏<\/td><td>O(n)<\/td><td>O(n)<\/td><\/tr><tr><td>红黑树<\/td><td>O(lg n)<\/td><td>O(lg n)<\/td><td>O(lg n)<\/td><\/tr><tr><td>B 树<\/td><td>O(lg n) I/O<\/td><td>O(lg n)<\/td><td>O(lg n)<\/td><\/tr><tr><td>斐波那契堆<\/td><td>—<\/td><td>均摊 O(1)<\/td><td>均摊 O(lg n)<\/td><\/tr><tr><td>并查集<\/td><td>近似 O(α(n))<\/td><td>—<\/td><td>—<\/td><\/tr><\/tbody><\/table>\n<h2>数论工具<\/h2>\n<table><thead><tr><th>工具<\/th><th>结论<\/th><\/tr><\/thead><tbody><tr><td>gcd(a,b)<\/td><td>欧几里得 gcd(b, a mod b)，O(lg a)<\/td><\/tr><tr><td>模逆元<\/td><td>扩展欧几里得求 ax+by=gcd，gcd=1 时 x 即逆元<\/td><\/tr><tr><td>快速幂<\/td><td>aᵇ mod n，O(lg b) 次模乘<\/td><\/tr><tr><td>CRT<\/td><td>n=∏nᵢ 互素 ⇔ 模 n 与模各 nᵢ 一一对应<\/td><\/tr><tr><td>RSA<\/td><td>公钥 (e,n) 加密 mᵉ；私钥 d 解密 cᵈ<\/td><\/tr><\/tbody><\/table>\n<h2>NPC 经典问题清单<\/h2>\n<p>SAT → 3-CNF-SAT → 团 / 顶点覆盖 / 哈密顿回路 / TSP（判定）/ 子集和。<\/p>", "kind": "速查表", "title": "速查表"}}, "base_dir": "/home/user/Doubao/chats/38450362683561730/算法专项-点化学习系统/04-算法导论", "nav": [{"label": "学习路径", "href": "#/path"}, {"label": "章节", "children": [{"label": "第 1 章：算法在计算中的作用", "href": "#/chapter/ch01"}, {"label": "第 2 章：算法基础", "href": "#/chapter/ch02"}, {"label": "第 3 章：函数的增长", "href": "#/chapter/ch03"}, {"label": "第 4 章：分治策略", "href": "#/chapter/ch04"}, {"label": "第 5 章：概率分析和随机算法", "href": "#/chapter/ch05"}, {"label": "第 6 章：堆排序", "href": "#/chapter/ch06"}, {"label": "第 7 章：快速排序", "href": "#/chapter/ch07"}, {"label": "第 8 章：线性时间排序", "href": "#/chapter/ch08"}, {"label": "第 9 章：中位数和顺序统计量", "href": "#/chapter/ch09"}, {"label": "第 10 章：基本数据结构", "href": "#/chapter/ch10"}, {"label": "第 11 章：散列表", "href": "#/chapter/ch11"}, {"label": "第 12 章：二叉搜索树", "href": "#/chapter/ch12"}, {"label": "第 13 章：红黑树", "href": " el": "测验", "children": [{"label": "综合测验", "href": "#/quiz/all"}, {"label": "测验：第 1 章：算法在计算中的作用", "href": "#/quiz/ch01"}, {"label": "测验：第 2 章：算法基础", "href": "#/quiz/ch02"}, {"label": "测验：第 3 章：函数的增长", "href": "#/quiz/ch03"}, {"label": "测验：第 4 章：分治策略", "href": "#/quiz/ch04"}, {"label": "测验：第 5 章：概率分析和随机算法", "href": "#/quiz/ch05"}, {"label": "测验：第 6 章：堆排序", "href": "#/quiz/ch06"}, {"label": "测验：第 7 章：快速排序", "href": "#/quiz/ch07"}, {"label": "测验：第 8 章：线性时间排序", "href": "#/quiz/ch08"}, {"label": "测验：第 9 章：中位数和顺序统计量", "href": "#/quiz/ch09"}, {"label": "测验：第 10 章：基本数据结构", "href": "#/quiz/ch10"}, {"label": "测验：第 11 章：散列表", "href": "#/quiz/ch11"}, {"label": "测验：第 12 章：二叉搜索树", "href": "#/quiz/ch12"}, {"label": "测验：第 13 章：红黑树", "href": "#/quiz/ch13"}, {"label": "测验：第 14 章：数据结构的扩张", "href": "#/quiz/ch14"}, {"label": "测验：第 15 章：动态规划", "href": "#/quiz/ch15"}, {"label": "测验：第 16 章：贪心算法", "href": "#/quiz/ch16"}, {"label": "测验：第 17 章：摊还分析", "href": "#/quiz/ch17"}, {"label": "测验：第 18 章：B 树", "href": "#/quiz/ch18"}, {"label": "测验：第 19 章：斐波那契堆", "href": "#/quiz/ch19"}, {"label": "测验：第 20 章：van Emde Boas 树", "href": "#/quiz/ch20"}, {"label": "测验：第 21 章：用于不相交集合的数据结构", "href": "#/quiz/ch21"}, {"label": "测验：第 22 章：基本的图算法", "href": "#/quiz/ch22"}, {"label": "测验：第 23 章：最小生成树", "href": "#/quiz/ch23"}, {"label": "测验：第 24 章：单源最短路径", "href": "#/quiz/ch24"}, {"label": "测验：第 25 章：所有结点对的最短路径", "href": "#/quiz/ch25"}, {"label": "测验：第 26 章：最大流", "href": "#/quiz/ch26"}, {"label": "测验：第 27 章：多线程算法", "href": "#/quiz/ch27"}, {"label": "测验：第 28 章：矩阵运算", "href": "#/quiz/ch28"}, {"label": "测验：第 29 章：线性规划", "href": "#/quiz/ch29"}, {"label": "测验：第 30 章：多项式与快速傅里叶变换", "href": "#/quiz/ch30"}, {"label": "测验：第 31 章：数论算法", "href": "#/quiz/ch31"}, {"label": "测验：第 32 章：字符串匹配", "href": "#/quiz/ch32"}, {"label": "测验：第 33 章：计算几何学", "href": "#/quiz/ch33"}, {"label": "测验：第 34 章：NP 完全性", "href": "#/quiz/ch34"}, {"label": "测验：第 35 章：近似算法", "href": "#/quiz/ch35"}, {"label": "测验：附录 A：求和", "href": "#/quiz/ch36"}, {"label": "测验：附录 B：集合、关系、函数、图、树", "href": "#/quiz/ch37"}, {"label": "测验：附录 C：计数与概率", "href": "#/quiz/ch38"}, {"label": "测验：附录 D：矩阵", "href": "#/quiz/ch39"}]}, {"label": "抽认卡", "href": "#/cards"}, {"label": "术语表", "href": "#/glossary"}, {"label": "模式库", "href": "#/patterns"}, {"label": "速查表", "href": "#/cheatsheet"}], "rendered": {"ch01": "<h1>第 1 章：算法在计算中的作用<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★☆☆ | <strong>预估学时<\/strong>：1 小时 | <strong>前置<\/strong>：无（全书入口）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n用一句话说清「算法（algorithm）」的形式定义，并区分「问题」与「问题实例」。\n<\/li><li>\n解释为什么效率是算法研究的核心，并说出插入排序与归并排序在 n=100 万时的运行时间差距量级。\n<\/li><li>\n列举算法在真实世界中的至少两个应用场景。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p><strong>算法是解决问题的一步步确定化计算过程；当计算机不是无限快、存储不是免费时，「选对算法」和「用好硬件」同等重要。<\/strong><\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：算法（algorithm）是什么（难度：基础）<\/h3>\n<p><strong>算法<\/strong>就是任何良定义的计算过程，它取某个值或值的集合作为<strong>输入<\/strong>，并产生某个值或值的集合作为<strong>输出<\/strong>。换句话说：算法是把输入一步步变换成输出的、有明确规则的操作序列。<\/p>\n<p>以书中反复用的<strong>排序问题<\/strong>为例：<\/p>\n<ul><li>\n<strong>输入<\/strong>：n 个数的一个序列 ⟨a₁, a₂, …, aₙ⟩。\n<\/li><li>\n<strong>输出<\/strong>：输入序列的一个排列 ⟨a₁′, a₂′, …, aₙ′⟩，满足 a₁′ ≤ a₂′ ≤ … ≤ aₙ′。\n<\/ul>\n<p>例如输入 ⟨31, 41, 59, 26, 41, 58⟩，排序算法返回 ⟨26, 31, 41, 41, 58, 59⟩。这组具体的输入，在书中叫作该问题的一个<strong>实例（instance）<\/strong>——即满足问题陈述所加各种约束的具体输入。<\/p>\n<h3>概念 2：正确性（难度：基础）<\/h3>\n<p>若对每个输入实例，算法都以正确的输出停机，则称该算法是<strong>正确的<\/strong>。注意：书中默认我们只关心正确算法；但第 31 章会看到带可控错误率的随机化素数测试——错误率可控的算法在实践中也很有用。<\/p>\n<h3>概念 3：算法为什么重要（难度：基础）<\/h3>\n<p>书中 §1.2「作为一种技术的算法」用了一个「效率故事」锚定：<\/p>\n<ul><li>\n<strong>插入排序<\/strong>：排序 n 个数大约需要 c₁n² 时间（c₁ 是不依赖 n 的常数）。\n<\/li><li>\n<strong>归并排序<\/strong>：大约需要 c₂n lg n 时间（lg n = log₂n）。\n<\/li><li>\n当 n 从 1000 涨到 100 万时：n² 膨胀到 10¹² 量级，而 n lg n 只有 10⁷×20 ≈ 2×10⁸ 量级。即使插入排序跑在快 CPU、归并排序跑在慢 CPU 上，输入足够大时归并排序也会赢。\n<\/ul>\n<p><strong>结论<\/strong>：硬件速度翻倍只能线性改善常数，而算法复杂度的阶（n² 对 n lg n）随 n 增长几个数量级——算法效率是和硬件、网络、对象系统并列的「技术」。<\/p>\n<h3>概念 4：应用全景（难度：基础）<\/h3>\n<p>书中点名的场景：人类基因工程（30 亿个碱基对的测序与匹配）、互联网（海量数据的路由、检索、加密）、电子商务（公钥加密与数字签名）、制造业与零售业（优化运输路径、调度）。这些都依赖本书后面章节的排序、图、数论、动态规划等技术。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n    A[输入实例&lt;br/&gt;一组数] --&gt; B[算法&lt;br/&gt;一步步确定规则] --&gt; C[输出&lt;br/&gt;排好序的序列]\n    D[问题陈述&lt;br/&gt;输入/输出关系] -.定义.-&gt; B<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：箭头从左到右是「数据流过算法」；虚线表示问题陈述规定了算法必须实现的输入输出关系。重点：算法是「过程」，问题是「关系」，实例是「具体一批输入」，三者不要混。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：算法像菜谱——输入是食材，输出是菜，每一步操作（切、炒、加盐）都明确无歧义。<strong>失效边界<\/strong>：菜谱做完菜就结束，算法还要处理「无限多可能的输入」，所以必须证明对所有合法输入都正确。\n<\/li><li>\n<strong>实例<\/strong>：对输入 ⟨5, 2, 4, 6, 1, 3⟩ 执行排序，输出必须是 ⟨1, 2, 3, 4, 5, 6⟩。任何把 6 漏排到最后的算法，都没有正确解决这个实例。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为「能跑就行，快不快无所谓」<\/strong>——实际上 n 很大时（数据库、基因组、网络路由），n² 与 n lg n 的差距是成千上万倍，硬件再快也补不回来。\n<\/li><li>\n<strong>别以为「算法就是数学题」<\/strong>——实际上算法是工程对象：要用伪代码描述、要分析正确性、要在真实机器上衡量资源（时间+空间）。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n（单选）下列哪一项最符合书中「算法」的定义？（答案：C；解析：算法是良定义的计算过程，有输入有输出、对每个实例正确停机；A 只是数据结构、B 只是编程语言特征、D 把算法等同于具体程序，程序只是算法的一种实现）\n<ul>\n<li>\nA. 一种在内存中存数据的方式\n<\/li><li>\nB. 任何一门编程语言\n<\/li><li>\nC. 把输入经确定步骤变换为正确输出的计算过程\n<\/li><li>\nD. 一份可以直接编译运行的源码文件\n<\/li><li>\n（单选）对排序问题 ⟨31, 41, 59, 26, 41, 58⟩，正确输出是？（答案：B；解析：非降序排列且保持重复值，26, 31, 41, 41, 58, 59）\n<\/li><li>\nA. ⟨59, 41, 41, 31, 26, 58⟩\n<\/li><li>\nB. ⟨26, 31, 41, 41, 58, 59⟩\n<\/li><li>\nC. ⟨26, 31, 41, 58, 59⟩\n<\/li><li>\nD. ⟨1, 2, 3, 4, 5, 6⟩\n<\/li><li>\n（填空）插入排序运行时间约为 c₁n²，归并排序约为 c₂n__n（用 lg 形式填）。（答案：lg；解析：书中明确归并排序为 c₂n lg n，lg n = log₂ n）\n<\/li><li>\n（简答）为什么书中说「算法是一项技术」？（答案：当计算机不是无限快、存储器不是免费时，好算法能节省时间与空间，与硬件、网络等技术并列影响系统性能；n 越大，复杂度阶的优势越压倒常数因子）\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n算法 = 良定义计算过程：输入 → 确定步骤 → 正确输出。\n<\/li><li>\n效率故事：插入排序 n²，归并排序 n lg n；规模一大，阶决定胜负。\n<\/li><li>\n算法渗透在基因工程、互联网、电商加密等真实系统中。\n<\/ul>", "ch02": "<h1>第 2 章：算法基础<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★☆☆ | <strong>预估学时<\/strong>：2 小时 | <strong>前置<\/strong>：第 1 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n用伪代码写出插入排序，并说出它最坏/最好情况的运行时间。\n<\/li><li>\n用「循环不变式」三条性质（初始化、保持、终止）解释算法为什么正确。\n<\/li><li>\n用分治思想描述归并排序，并画出递归树、读出 T(n) = 2T(n/2) + cn 的解为 Θ(n lg n)。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p><strong>先动手写第一个算法（插入排序），再学会用「循环不变式」证明它、用「增长量级」抽象它，最后用「分治」造出更快的归并排序。<\/strong><\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：伪代码（pseudocode）约定（难度：基础）<\/h3>\n<p>本书伪代码类似 C/C++/Java/Python 的精简写法，核心约定（来自书中 §2.1）：<\/p>\n<ul><li>\n缩进表示块结构（类似 Python）。\n<\/li><li>\n<code>for / while / if<\/code> 用缩进管作用域，不用大括号。\n<\/li><li>\n数组元素用 <code>A[i]<\/code>、属性用 <code>A.length<\/code>、对象属性用「点」访问（<code>x.f<\/code>）。\n<\/li><li>\n参数按值传递；<code>return<\/code> 可以一次返回多个值；<code>and/or<\/code> 是短路求值；遇到异常情况用 <code>error<\/code> 表示。\n<\/ul>\n<h3>概念 2：插入排序（INSERTION-SORT）（难度：基础）<\/h3>\n<p><strong>插入排序<\/strong>：像打扑克牌——左手已排好的牌，从牌堆摸一张，从右往左比，插到正确位置。<\/p>\n<pre><code>INSERTION-SORT(A)\n1  for j = 2 to A.length        // A[1..j-1] 始终已排好序\n2      key = A[j]\n3      // 将 A[j] 插入已排序的 A[1..j-1]\n4      i = j - 1\n5      while i &gt; 0 and A[i] &gt; key\n6          A[i+1] = A[i]          // 比 key 大的牌右挪一位\n7          i = i - 1\n8      A[i+1] = key              // 插入正确位置<\/code><\/pre>\n<p>对 A = ⟨5, 2, 4, 6, 1, 3⟩：j=2 时把 2 插到 5 前；j=3 时把 4 插到 5 前；……最终 ⟨1,2,3,4,5,6⟩。<\/p>\n<p><strong>运行时间<\/strong>：最好情况（已排好序）内层 while 一次不转，Θ(n)；最坏情况（逆序）每轮都从 j-1 比较到 1，总比较次数 ≈ n(n-1)/2，Θ(n²)。<\/p>\n<h3>概念 3：循环不变式（loop invariant）（难度：进阶）<\/h3>\n<p><strong>循环不变式<\/strong>是循环每次转完都成立的断言。以上面为例：「在循环的每次迭代开始时，子数组 A[1..j-1] 由原 A[1..j-1] 中的元素按序组成」。要证明它成立，验三条：<\/p>\n<ol><li>\n<strong>初始化<\/strong>：第一次迭代前（j=2 时），A[1..1] 当然已排好。\n<\/li><li>\n<strong>保持<\/strong>：若 A[1..j-1] 已排序，一轮把 A[j] 插入正确位置后 A[1..j] 仍排序。\n<\/li><li>\n<strong>终止<\/strong>：循环在 j = n+1 时结束，此时 A[1..n] 排序——算法正确。\n<\/ol>\n<p>类比数学归纳法：初始化=归纳基例，保持=归纳步。<\/p>\n<h3>概念 4：增长量级（order of growth）（难度：进阶）<\/h3>\n<p>书中 §2.2 引入「渐近分析」的雏形：只保留运行时间中<strong>最高阶项<\/strong>（如插入排序最坏时的 an²+bn+c 里只留 n²），并丢掉最高阶项的常数系数。记作 Θ(n²)。当 n 足够大时，低阶项与常数项相对不重要——这为第 3 章的渐近记号铺路。<\/p>\n<h3>概念 5：分治法（divide and conquer）与归并排序（难度：进阶）<\/h3>\n<p><strong>分治<\/strong>：把问题分解成若干规模更小的同类子问题，递归求解，再合并结果。归并排序 MERGE-SORT：<\/p>\n<ol><li>\n<strong>分解<\/strong>：把 A[p..r] 从中间 q 切成两半 A[p..q] 与 A[q+1..r]。\n<\/li><li>\n<strong>解决<\/strong>：递归地对两半排序。\n<\/li><li>\n<strong>合并<\/strong>：MERGE(A, p, q, r)——把两个已排序的子数组合成一个已排序数组。书中 MERGE 用「哨兵」技巧：L、R 末尾各放一个 ∞，这样比较时永远不用先判「哪半先耗尽」。\n<\/ol>\n<p><strong>递归式<\/strong>：T(n) = Θ(1)（n 够小）；否则 T(n) = 2T(n/2) + Θ(n)。 <strong>递归树读法<\/strong>（书中图 2-5）：树有 lg n 层；每层合并代价都是 cn；总代价 cn·lg n + cn = Θ(n lg n)。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[⟨5,2,4,6,1,3⟩] --&gt; S[切成两半 ⟨5,2,4⟩ ⟨6,1,3⟩]\n    S --&gt; S1[左再切 ⟨5,2⟩ ⟨4⟩]\n    S --&gt; S2[右再切 ⟨6⟩ ⟨1,3⟩]\n    S1 --&gt; M1[排序合并 → ⟨2,4,5⟩]\n    S2 --&gt; M2[排序合并 → ⟨1,3,6⟩]\n    M1 --&gt; F[MERGE ⟨1,2,3,4,5,6⟩]\n    M2 --&gt; F<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：自上而下是「分解」，自下而上是「合并」。每一层的合并代价都是 cn（扫描一遍），树高 lg n，所以总量是 cn lg n——这就是 Θ(n lg n) 的来源。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：插入排序像新手理牌，每次摸一张插到位；归并排序像「分两摞各自理好，再像归拢扑克牌一样一叠一叠挑最小的放一起」。<strong>失效边界<\/strong>：合并需要额外的 O(n) 临时空间，插入排序是原地的——空间换时间。\n<\/li><li>\n<strong>实例<\/strong>：MERGE(⟨2,4,7,∞⟩, ⟨1,2,3,6,∞⟩) 从左到右挑最小：1,2,2,3,4,6,7，最后哨兵 ∞ 收尾——一轮线性扫描合并完成。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为「插入排序最坏 Θ(n²) 就不能用」<\/strong>——实际上 n 很小（打牌、小数组）时常数小、原地、缓存友好，工程里常作为快排/归并的小数组兜底。\n<\/li><li>\n<strong>别以为「归并排序更快所以总是它」<\/strong>——实际上合并要 O(n) 辅助空间；对内存受限场景要权衡。\n<\/li><li>\n<strong>别以为「循环不变式是玄学」<\/strong>——它就是归纳法在循环上的翻译，三条件逐条核对即可。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n（单选）插入排序在数组已完全有序时的运行时间是？（答案：A；解析：内层 while 一次不执行，外层 n 次 = Θ(n)）\n<ul>\n<li>\nA. Θ(n)   B. Θ(n lg n)   C. Θ(n²)   D. Θ(lg n)\n<\/li><li>\n（多选）循环不变式需要验证哪几条性质？（答案：A、B、C；解析：初始化/保持/终止缺一不可；D 是递归式性质）\n<\/li><li>\nA. 初始化   B. 保持   C. 终止   D. 递归基例\n<\/li><li>\n（填空）归并排序的递归式 T(n) = 2T(n/2) + Θ(n)，其解为 Θ(n__)。（答案：lg n；解析：每层 cn，共 lg n 层）\n<\/li><li>\n（简答）MERGE 为什么要在 L、R 末尾放哨兵 ∞？（答案：免去「哪一半先耗尽」的判断，每次比较都能挑出更小者；哨兵保证一旦有一方耗尽，另一方的剩余元素自然成为最小并被取走，简化代码且仍是线性时间）\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n插入排序：打牌式插入，最坏 Θ(n²)、最好 Θ(n)。\n<\/li><li>\n循环不变式三条件：初始化、保持、终止。\n<\/li><li>\n分治 = 分解 + 解决 + 合并；归并排序 T(n)=2T(n/2)+Θ(n) ⇒ Θ(n lg n)。\n<\/ul>", "ch03": "<h1>第 3 章：函数的增长<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：2.5 小时 | <strong>前置<\/strong>：第 2 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n用数学定义解释 Θ（紧确界）、O（上界）、Ω（下界）、o（非紧上界）、ω（非紧下界）五种渐近记号。\n<\/li><li>\n判断 f(n) 与 g(n) 增长快慢（多项式 vs 对数 vs 指数）。\n<\/li><li>\n熟记书中常用函数：lg n、n!、lg(n!)、对数换底与 e^x 级数。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p><strong>渐近记号只关心「n 足够大时函数在哪个量级」——丢掉常数与低阶项，让我们看清算法之间的本质差距。<\/strong><\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：Θ（g(n)）——渐近紧确界（难度：进阶）<\/h3>\n<p><strong>Θ(g(n))<\/strong>：若存在正常量 c₁、c₂ 和 n₀，使对所有 n ≥ n₀，有 0 ≤ c₁g(n) ≤ f(n) ≤ c₂g(n)，则 f(n) ∈ Θ(g(n))。白话：n 足够大时，f(n) 被夹在 g(n) 的两个常数倍之间——g(n) 是 f(n) 的<strong>渐近紧确界（asymptotically tight bound）<\/strong>。<\/p>\n<p>书中实例：证明 (1/2)n² − 3n = Θ(n²)。用 n² 除：c₁ ≤ 1/2 − 3/n ≤ c₂。取 c₂ = 1/2（n ≥ 1 时右不等式成立），c₁ = 1/14（n ≥ 7 时左不等式成立），n₀ = 7。于是 n ≥ 7 时不等式成立——证毕。<\/p>\n<h3>概念 2：O(g(n))——渐近上界（难度：进阶）<\/h3>\n<p><strong>O(g(n))<\/strong>：存在正常量 c、n₀，使 n ≥ n₀ 时 0 ≤ f(n) ≤ c·g(n)。白话：f 「至多」像 g 增长。O 是上界，但<strong>不一定紧<\/strong>：2n² = O(n³) 在数学上成立（n 大时 n³ 更大），虽然不紧——能写 Θ 就别只写 O。<\/p>\n<h3>概念 3：Ω(g(n))——渐近下界（难度：进阶）<\/h3>\n<p><strong>Ω(g(n))<\/strong>：存在正常量 c、n₀，使 n ≥ n₀ 时 0 ≤ c·g(n) ≤ f(n)。白话：f 「至少」像 g 增长。书中定理：f(n)=Θ(g(n)) 当且仅当 f=O(g) 且 f=Ω(g)。<\/p>\n<h3>概念 4：o 与 ω——非紧确记号（难度：高难）<\/h3>\n<ul><li>\n<strong>o(g(n))<\/strong>：对任意正常量 c，存在 n₀，使 n ≥ n₀ 时 0 ≤ f(n) &lt; c·g(n)。白话：f 相对 g「可以任意小」——g 比 f 高一个量级。例：2n = o(n²)（因为 2n/n² → 0）。\n<\/li><li>\n<strong>ω(g(n))<\/strong>：与 o 对称，f 比 g 高一个量级。例：n²/2 = ω(n)。\n<\/ul>\n<p>记忆法：Θ/O/Ω 用「存在某个 c」；o/ω 用「对任意 c」——后者刻画的是严格的阶差。<\/p>\n<h3>概念 5：标准记号（难度：基础）<\/h3>\n<p>书中 §3.2 给出的常用关系（已从书页核对）：<\/p>\n<ul><li>\n<strong>lg n = log₂ n<\/strong>，<strong>ln n = logₑ n<\/strong>，<strong>lgᵏ n = (lg n)ᵏ<\/strong>。\n<\/li><li>\n换底：log_b a = log_c a / log_c b——换底只乘一个常数因子，所以 O 记号里底数不重要，直接写 lg n。\n<\/li><li>\n多项式 vs 指数：对任意底 a &gt; 1 的指数函数，nᵏ = o(aⁿ)——指数碾压多项式。\n<\/li><li>\n对数不等式：对 x &gt; −1，x/(1+x) ≤ ln(1+x) ≤ x。\n<\/li><li>\neˣ 级数：eˣ = 1 + x + x²/2! + …，且 eˣ ≥ 1+x。\n<\/li><li>\n极限：lim(1 + x/n)ⁿ = eˣ。\n<\/ul>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n    subgraph 从小到大\n    A[对数 lg n] --&gt; B[幂 n^ε] --&gt; C[n] --&gt; D[n lg n] --&gt; E[n^2] --&gt; F[n^3] --&gt; G[2^n] --&gt; H[n!]\n    end<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：从左到右增长越来越快。算法复杂度落在左边的好，落在右边的坏。o 记号刻画「严格在左边」：lg n = o(n)，n lg n 比 n 高一截、比 n² 低一截。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：渐近记号像估算城市人口——「几十万」对「几十亿」，不关心精确到个位，只关心量级。<strong>失效边界<\/strong>：对 n 很小的场景（n=5），常数项和低阶项可能主导，渐近结论不适用。\n<\/li><li>\n<strong>实例<\/strong>：插入排序最坏 Θ(n²)、归并排序 Θ(n lg n)——n lg n = o(n²)，所以 n 一大归并就碾压。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为 O(n²) 就表示「恰好 n²」<\/strong>——实际上 O 只是上界；说「恰好」必须用 Θ。\n<\/li><li>\n<strong>别以为换对数底会改变复杂度<\/strong>——实际上换底只乘常数 1/ln 2，O 记号里底数无关，统一写 lg。\n<\/li><li>\n<strong>别以为「n² 比 n³ 慢是显然的」<\/strong>——慢是慢，但书中用定义严格证明 2n² = o(n³)，靠的是比值趋向 0，不是「感觉」。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n（单选）(1/2)n² − 3n 用渐近记号最紧的写法是？（答案：B；解析：书中证明它属于 Θ(n²)）\n<ul>\n<li>\nA. O(n³)   B. Θ(n²)   C. Ω(n³)   D. o(n²)\n<\/li><li>\n（多选）下列哪些正确（可多选）？（答案：A、B、C；解析：2n=O(n²) 上界成立；n²/2=ω(n) 比值→∞；lg n = o(n)；D 错，n! 比 2ⁿ 还快，2ⁿ ≠ ω(n!)）\n<\/li><li>\nA. 2n = O(n²)   B. n²/2 = ω(n)   C. lg n = o(n)   D. 2ⁿ = ω(n!)\n<\/li><li>\n（填空）换底公式 log_b a = log_c a / __c b。（答案：log；解析：log_b a = log_c a / log_c b）\n<\/li><li>\n（简答）为什么书中说「对任意底 a&gt;1，nᵏ = o(aⁿ)」？（答案：多项式比值 nᵏ/aⁿ → 0，所以多项式严格低于指数——任何多项式再高次也追不上任何底数&gt;1的指数）\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\nΘ 紧确、O 上界、Ω 下界、o/ω 严格阶差。\n<\/li><li>\n增长率梯队：lg n &lt; n &lt; n lg n &lt; n² &lt; 2ⁿ &lt; n!。\n<\/li><li>\n换底只乘常数，O 里底数随便写。\n<\/ul>", "ch04": "<h1>第 4 章：分治策略<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：3.5 小时 | <strong>前置<\/strong>：第 2 章、第 3 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n对 T(n) = aT(n/b) + f(n) 形式的递归式，用主方法三种情况直接读出结果。\n<\/li><li>\n用递归树估算一个递归式的上界，再用代入法验证。\n<\/li><li>\n用分治解最大子数组问题，并说出它与暴力法 Θ(n²) 的复杂度对比。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p><strong>分治递归式 T(n) = aT(n/b) + f(n) 的解由「子问题代价」与「合并代价 f(n)」谁占主导决定——主方法给了三档查表法。<\/strong><\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：最大子数组问题（难度：进阶）<\/h3>\n<p>股价每日变动序列里，「哪天买、哪天卖赚钱最多」等价于求<strong>变动数组<\/strong> A 的连续子数组，使其和最大。<\/p>\n<ul><li>\n暴力法：枚举所有 i≤j，O(n²) 对，每对求和 O(n)，总 Θ(n³)。\n<\/li><li>\n分治法：把 A[low..high] 从 mid 切开。最大子数组只可能在三种位置：\n<ol>\n<li>\n完全在左半 A[low..mid]；\n<\/li><li>\n完全在右半 A[mid+1..high]；\n<\/li><li>\n<strong>跨越中点<\/strong>（low ≤ i ≤ mid &lt; j ≤ high）。\n<\/li><li>\n跨中点情况用 FIND-MAX-CROSSING-SUBARRAY：左半从 mid 向左扫求最大和 left-sum，右半从 mid+1 向右扫求最大和 right-sum，合并即得。这一步 Θ(n)。\n<\/li><li>\n递归式 T(n) = 2T(n/2) + Θ(n) ⇒ <strong>Θ(n lg n)<\/strong>。\n<\/ol>\n<\/ul>\n<h3>概念 2：Strassen 矩阵乘法（难度：高难）<\/h3>\n<p>两个 n×n 矩阵朴素乘法 Θ(n³)。Strassen 的巧思：把 4 个 n/2 子矩阵的 8 次乘法换成 <strong>7 次<\/strong>（用中间矩阵 M₁…M₇ 的加减组合），递归式 T(n) = 7T(n/2) + Θ(n²)。用主方法读出 ⇒ <strong>Θ(n^lg7) ≈ Θ(n^2.81)<\/strong>。<\/p>\n<h3>概念 3：求解递归式的三种方法（难度：进阶）<\/h3>\n<ol><li>\n<strong>代入法<\/strong>：猜测一个界，用数学归纳法证明常数可行。例：证明 T(n)=2T(⌊n/2⌋)+n 为 O(n lg n)，猜 T(n) ≤ c n lg n，代入验证 c 的选择。\n<\/li><li>\n<strong>递归树<\/strong>：把递归式逐层展开成树，每层代价写出来求和。书中例子 T(n)=T(n/3)+T(2n/3)+cn：树高约 log_{3/2} n，每层代价 cn，总 cn·log n = O(n lg n)（书页已核对该推导）。\n<\/li><li>\n<strong>主方法<\/strong>：直接套公式（见下）。\n<\/ol>\n<h3>概念 4：主定理（定理 4.1）（难度：进阶）<\/h3>\n<p>对 a ≥ 1、b &gt; 1，T(n) = aT(n/b) + f(n)（n/b 取整不影响渐近）：<\/p>\n<table><thead><tr><th>情况<\/th><th>条件（与 n^log_b a 比较）<\/th><th>结论<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>f(n) = O(n^{log_b a − ε})，ε&gt;0（子问题代价主导）<\/td><td>T(n) = Θ(n^{log_b a})<\/td><\/tr><tr><td>2<\/td><td>f(n) = Θ(n^{log_b a})（两者持平）<\/td><td>T(n) = Θ(n^{log_b a} · lg n)<\/td><\/tr><tr><td>3<\/td><td>f(n) = Ω(n^{log_b a + ε})（合并代价主导），且满足正则条件 a·f(n/b) ≤ c·f(n)，c&lt;1<\/td><td>T(n) = Θ(f(n))<\/td><\/tr><\/tbody><\/table>\n<p><strong>记忆锚<\/strong>：先算 n^{log_b a}（所有子问题加起来的总代价层），再跟 f(n) 比大小：小 → 子问题赢（情况1）；平 → 乘 lg n（情况2）；大 → f(n) 赢（情况3）。<\/p>\n<p><strong>例<\/strong>：归并 T(n)=2T(n/2)+Θ(n)：log_b a = log_2 2 = 1，n^1 = n 与 f(n)=n 持平 ⇒ 情况 2 ⇒ Θ(n lg n)。 <strong>例<\/strong>：Strassen T(n)=7T(n/2)+Θ(n²)：log_2 7 ≈ 2.81，n^2.81 &gt; n² ⇒ f(n)=n² 是低阶 ⇒ 情况 1 ⇒ Θ(n^{lg 7})。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[T(n)=aT(n/b)+f(n)] --&gt; B[算 n^log_b a]\n    B --&gt; C1{f vs n^log_b a}\n    C1 --&gt;|f 低阶| D1[情况1: Θ n^log_b a]\n    C1 --&gt;|f 持平| D2[情况2: Θ n^log_b a · lg n]\n    C1 --&gt;|f 高阶| D3[情况3: Θ f(n)]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：主方法是个「比大小」开关。先算子问题总量 n^{log_b a}，再让 f(n) 跟它比，落到三个分支之一。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：主方法像工资谈判——a 个子问题是「手下人干活」，f(n) 是「自己做合并」。手下总产量 n^{log_b a} 比 f 大，就由手下决定进度（情况1）；两者一样大，进度乘一层对数（情况2）；自己合并比手下还贵，就由 f 决定（情况3）。<strong>失效边界<\/strong>：f 与 n^{log_b a} 之间隔着「多项式间隙」才能用主方法；若 f = Θ(n^{log_b a}·lgᵏ n) 这种「差个对数因子」，要用推广版主定理，不能硬套三档。\n<\/li><li>\n<strong>实例<\/strong>：T(n) = 2T(n/2) + n：log_b a=1，n^1=n 与 f=n 持平 ⇒ 情况 2 ⇒ Θ(n lg n)，与归并排序一致。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为主方法对所有递归式都能用<\/strong>——实际上 f(n) 必须与 n^{log_b a} 是多项式阶可比；像 T(n)=2T(n/2)+n lg n 这种，要用推广版。\n<\/li><li>\n<strong>别以为「n/b 取整」会改变结论<\/strong>——书中证明取整只影响低阶，渐近结论不变。\n<\/li><li>\n<strong>别以为 Strassen 更快所以日常用它<\/strong>——实际上常数巨大、数值稳定性差，工程上很少用；它的价值是「矩阵乘法下界可以低于 3」的理论突破。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n（单选）T(n) = 9T(n/3) + n，主方法结论是？（答案：A；解析：log_3 9 = 2，n² 比 f=n 高阶 ⇒ 情况 1 ⇒ Θ(n²)）\n<ul>\n<li>\nA. Θ(n²)   B. Θ(n² lg n)   C. Θ(n)   D. Θ(n lg n)\n<\/li><li>\n（单选）T(n) = T(2n/3) + 1（即 a=1,b=3/2）结论是？（答案：B；解析：log_{3/2} 1 = 0，n⁰=1 与 f=1 持平 ⇒ 情况 2 ⇒ Θ(lg n)）\n<\/li><li>\nA. Θ(1)   B. Θ(lg n)   C. Θ(n)   D. Θ(n²)\n<\/li><li>\n（填空）Strassen 算法把矩阵乘法递归式写成 T(n)=__T(n/2)+Θ(n²)，复杂度为 Θ(n^lg7)。（答案：7；解析：7 次子矩阵乘法替代 8 次）\n<\/li><li>\n（简答）最大子数组分治法为什么要单独处理「跨越中点」？（答案：跨越中点的子数组既不属于左半也不属于右半，递归的两个子问题都覆盖不到它；必须在合并阶段用一次线性扫描把它找出来，再与左右最优比三者取最大）\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n主方法三档：跟 n^{log_b a} 比大小——低阶取子问题、持平乘 lg、高阶取 f。\n<\/li><li>\n最大子数组：Θ(n lg n)；Strassen：Θ(n^2.81)。\n<\/li><li>\n代入法先猜后证；递归树估算层数与每层代价。\n<\/ul>", "ch05": "<h1>第 5 章：概率分析和随机算法<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：2.5 小时 | <strong>前置<\/strong>：第 2 章；附录 C（计数与概率）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n区分「概率分析」（对输入分布做假设）与「随机算法」（算法自己掷骰子）。\n<\/li><li>\n用指示器随机变量快速算出雇用问题的期望雇用次数。\n<\/li><li>\n解释生日悖论，算出 k 人时两人生日相同的概率。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p><strong>当输入不好控制时，让算法自己随机化——期望运行时间就不再依赖最坏输入分布，而由骰子决定。<\/strong><\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：雇用问题（hiring problem）（难度：基础）<\/h3>\n<p>你要面试 n 个应聘者，每天看一个人；如果当天这个人比之前所有都好，就「雇用」当前的人（解雇旧的）。问：总雇用次数的期望是多少？<\/p>\n<ul><li>\n最坏情况：应聘者按从差到好排序，每次都雇 ⇒ n 次。\n<\/li><li>\n假设应聘者以<strong>随机顺序<\/strong>到来：第 i 个应聘者比前 i-1 个都好的概率 = 1/i。\n<\/ul>\n<h3>概念 2：指示器随机变量（indicator random variable）（难度：进阶）<\/h3>\n<p><strong>指示器随机变量<\/strong> I{A}：事件 A 发生取 1，否则取 0（书页公式 5.1）。关键性质（引理 5.1）：E[I{A}] = Pr{A}——事件发生的概率就是它的指示器的期望。<\/p>\n<p>雇用问题：设 Xᵢ = I{第 i 个应聘者被雇用}，X = ΣXᵢ。则 E[Xᵢ] = Pr{第 i 个是前 i 个中最好} = 1/i。 E[X] = Σ E[Xᵢ] = Σ 1/i = ln n + O(1)。<strong>结论<\/strong>：随机顺序下只期望雇约 ln n 次，而不是 n 次。<\/p>\n<h3>概念 3：随机化算法（randomized algorithm）（难度：进阶）<\/h3>\n<p>雇用问题里我们无法控制输入顺序，于是把输入<strong>随机排列<\/strong>——算法自己调用 RANDOM 重排数组。典型实现 RANDOMIZE-IN-PLACE(A)：对 i = 1..n，交换 A[i] 与 A[RANDOM(i, n)]。书中证明它产生<strong>均匀随机排列<\/strong>（每个排列概率 1/n!）。<\/p>\n<ul><li>\n<strong>概率分析<\/strong>：假设输入服从某分布，分析期望。\n<\/li><li>\n<strong>随机算法<\/strong>：分布不在输入上，而在算法内部——掷骰子决定下一步。\n<\/ul>\n<h3>概念 4：生日悖论（难度：进阶）<\/h3>\n<p>k 个人的屋子里，至少两人生日相同的概率多大？书中设一年 n=365 天。两人生日不同的概率 = 364/365；k 人<strong>全部互不相同<\/strong>的概率 Π_{i=1}^{k-1}(1 − i/365)。<\/p>\n<ul><li>\nk=23 时，至少两人相同的概率就超过 50%——远小于 365。这就是「悖论」：人不需要很多，相同生日就很可能出现。\n<\/ul>\n<h3>概念 5：球与箱子 / 特征序列 / 在线雇用（难度：高难，了解）<\/h3>\n<ul><li>\n<strong>球与箱子<\/strong>：把 n 个球独立随机扔进 b 个箱子，某箱子球数、空箱数的期望。\n<\/li><li>\n<strong>特征序列<\/strong>：抛硬币 n 次，最长连续正面的期望长度 ≈ lg n。\n<\/li><li>\n<strong>在线雇用<\/strong>：不能回头、必须当场决定——书中给出「先看约 n/e 个不雇，之后遇到第一个比之前都好的就雇」的策略，雇到最佳者概率 ≈ 1/e。\n<\/ul>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n    A[输入数组] --&gt; B[RANDOMIZE-IN-PLACE&lt;br/&gt;算法自己掷骰子重排]\n    B --&gt; C[对随机后的输入运行算法]\n    C --&gt; D[期望运行时间&lt;br/&gt;不再依赖输入分布]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：随机算法把「输入不可控」变成「算法内部可控」——期望是对骰子取的，不是对恶意输入取的。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：发牌——不假设牌堆本来就乱，而是洗完牌再发，每个人拿到公平的一手。<strong>失效边界<\/strong>：随机化不能让「错误算法」变对；它只把最坏输入变成平均输入。\n<\/li><li>\n<strong>实例<\/strong>：n=1000 应聘者，随机顺序下期望雇用次数 ≈ ln 1000 ≈ 7 次，远少于最坏 1000 次。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为「生日悖论说 23 人里有一人跟我同天生日概率 50%」<\/strong>——实际上它说的是「任意两人之间有一对同天」；跟<strong>你特定<\/strong>同天要约 253 人才到 50%。\n<\/li><li>\n<strong>别以为「随机算法就是慢」<\/strong>——实际上快排的随机化版本（第 7 章）期望 Θ(n lg n)，正是靠这一章的随机化思想。\n<\/li><li>\n<strong>别以为「期望 ≈ 平均情况」<\/strong>——期望是对随机骰子取的平均，可能某次运行很差，但长期平均稳定。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n（单选）雇用问题中，第 i 个应聘者被雇用的概率是？（答案：C；解析：他要成为前 i 个中最好，随机顺序下概率 1/i）\n<ul>\n<li>\nA. 1/n   B. i/n   C. 1/i   D. 1/2\n<\/li><li>\n（单选）k=23 人时，至少两人生日相同的概率约为？（答案：B；解析：书中算出约 50.7%，远小于一年天数）\n<\/li><li>\nA. 6%   B. 50%   C. 99%   D. 0\n<\/li><li>\n（填空）RANDOMIZE-IN-PLACE 对每个 i，把 A[i] 与 A[__(i, n)] 返回的位置交换。（答案：RANDOM；解析：书中伪代码 A[RANDOM(i,n)]）\n<\/li><li>\n（简答）概率分析与随机算法的区别？（答案：概率分析假设输入分布并在该分布下分析期望；随机算法在算法内部掷骰子重排/选择，期望对骰子取——不依赖输入是否随机）\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n指示器 E[I{A}] = Pr{A}；雇用问题期望 E[X] = H_n ≈ ln n。\n<\/li><li>\n随机算法 = 算法自己掷骰子；RANDOMIZE-IN-PLACE 生成均匀排列。\n<\/li><li>\n生日悖论：23 人即有 &gt;50% 出现一对同天。\n<\/ul>", "ch06": "<h1>第 6 章：堆排序<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：2 小时 | <strong>前置<\/strong>：第 2、3 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说出二叉堆的数组表示（PARENT/LEFT/RIGHT 下标公式）与大根堆性质。\n<\/li><li>\n描述 MAX-HEAPIFY、BUILD-MAX-HEAP、HEAPSORT 的流程与复杂度。\n<\/li><li>\n用堆实现优先队列的 INSERT / MAXIMUM / EXTRACT-MAX / INCREASE-KEY。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p><strong>堆是一个被看成「近似完全二叉树」的数组：父 ≥ 子（大根堆），于是堆顶永远是最大值——排序与优先队列都靠它。<\/strong><\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：二叉堆（binary heap）（难度：基础）<\/h3>\n<p><strong>二叉堆<\/strong>是一个数组，可以看成一棵近似的<strong>完全二叉树<\/strong>：除最底层外全满，且从左向右填充。树上每个结点对应数组一个元素，树根是 A[1]。下标关系（书页已核对）：<\/p>\n<ul><li>\nPARENT(i) = ⌊i/2⌋\n<\/li><li>\nLEFT(i) = 2i\n<\/li><li>\nRIGHT(i) = 2i+1\n<\/ul>\n<p>堆有两个属性：A.length（数组总长）和 A.heap-size（堆里实际存了多少元素，0 ≤ heap-size ≤ length）。 <strong>大根堆（max-heap）性质<\/strong>：对每个结点 i ≠ 1，A[PARENT(i)] ≥ A[i]——父节点值不小于子节点。所以堆顶 A[1] 是全堆最大。（小根堆反之，堆顶最小。）<\/p>\n<h3>概念 2：MAX-HEAPIFY（难度：进阶）<\/h3>\n<p>作用：假设 LEFT(i)、RIGHT(i) 为根的两棵子树已是大根堆，但 A[i] 可能比孩子小——把 A[i]「下沉」到正确位置。伪代码（书页已核对）：<\/p>\n<pre><code>MAX-HEAPIFY(A, i)\n1  l = LEFT(i);  r = RIGHT(i)\n2  if l ≤ A.heap-size and A[l] &gt; A[i]\n3      largest = l\n4  else largest = i\n5  if r ≤ A.heap-size and A[r] &gt; A[largest]\n6      largest = r\n7  if largest ≠ i\n8      exchange A[i] with A[largest]\n9      MAX-HEAPIFY(A, largest)<\/code><\/pre>\n<p>递归式 T(n) ≤ T(2n/3) + Θ(1)（最坏情况发生在树最底层恰好半满时），由主方法读出 <strong>T(n) = O(lg n)<\/strong>。<\/p>\n<h3>概念 3：建堆与堆排序（难度：进阶）<\/h3>\n<ul><li>\n<strong>BUILD-MAX-HEAP<\/strong>：从最后一个非叶结点 ⌊n/2⌋ 往前到 1，逐个 MAX-HEAPIFY。复杂度 Θ(n)（不是 O(n lg n)）。\n<\/li><li>\n<strong>HEAPSORT<\/strong>：建好大根堆后，堆顶 A[1] 是最大——把它与 A[heap-size] 交换、堆 size 减 1、对新堆顶 MAX-HEAPIFY 恢复堆性质。重复 n-1 次。总复杂度 <strong>O(n lg n)<\/strong>，原地。\n<\/ul>\n<h3>概念 4：优先队列（priority queue）（难度：进阶）<\/h3>\n<p><strong>最大优先队列<\/strong>维护一组带关键字的元素，支持（书页 §6.5 已核对）：<\/p>\n<ul><li>\nINSERT(S, x)：插入 x（O(lg n)）。\n<\/li><li>\nMAXIMUM(S)：返回最大关键字元素（O(1)）。\n<\/li><li>\nEXTRACT-MAX(S)：去掉并返回最大元素（O(lg n)，堆顶与末尾交换后 MAX-HEAPIFY）。\n<\/li><li>\nINCREASE-KEY(S, x, k)：把 x 的关键字增到 k——从 x 向上「上浮」与父交换（O(lg n)）。\n<\/ul>\n<p>典型应用：共享计算机的<strong>作业调度<\/strong>——最高优先级作业先跑（EXTRACT-MAX），新作业随时插入（INSERT）。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[数组 16 14 10 8 7 9 3 2 4 1] --&gt; B[看成完全二叉树&lt;br/&gt;16根；14、10为子；...]\n    B --&gt; C[大根堆: 父 ≥ 子]\n    C --&gt; D[HEAPSORT: 交换堆顶与末尾 → 堆缩小 → 恢复堆]\n    D --&gt; E[已排序区在数组尾部, 逐次长大]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：上半是「数组怎么变成树」；下半是排序循环——每轮把当前最大值固定到数组尾部，堆不断缩小。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：大根堆像公司组织架构——总裁（根）工资最高，往下逐层降；新来的人涨工资（INCREASE-KEY）就沿层级往上「上浮」到合适位置。<strong>失效边界<\/strong>：堆只能保证「父 ≥ 子」，不保证兄弟之间有序，所以堆不是排序好的数组。\n<\/li><li>\n<strong>实例<\/strong>：A = ⟨4, 1, 3, 2, 16, 9, 10, 14, 8, 7⟩，BUILD-MAX-HEAP 后变成 ⟨16, 14, 10, 8, 7, 9, 3, 2, 4, 1⟩——这正是书页图 6-1 的例子。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为「BUILD-MAX-HEAP 是 O(n lg n)」<\/strong>——实际上是 Θ(n)：叶子本来就满足堆性质，只有前半部分结点要下沉，总代价摊下来线性。\n<\/li><li>\n<strong>别以为「堆是垃圾回收」<\/strong>——书中特意澄清：本书的「堆」指堆数据结构，不是 Java/Lisp 的垃圾回收堆。\n<\/li><li>\n<strong>别以为「堆排序比快排快」<\/strong>——实际上快排常数小、缓存友好；堆排序的价值是最坏保证 O(n lg n) + 原地 + 优先队列应用。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n（单选）LEFT(i) 与 RIGHT(i) 的下标是？（答案：C；解析：书中 LEFT=2i, RIGHT=2i+1）\n<ul>\n<li>\nA. i+1, i+2   B. 2i+1, 2i+2   C. 2i, 2i+1   D. ⌊i/2⌋, ⌈i/2⌉\n<\/li><li>\n（单选）MAX-HEAPIFY 的递归式 T(n) ≤ T(2n/3)+Θ(1)，其解是？（答案：B；解析：主方法情况 2，树高 lg n）\n<\/li><li>\nA. Θ(1)   B. O(lg n)   C. Θ(n)   D. Θ(n lg n)\n<\/li><li>\n（多选）下列哪些是最大优先队列支持的操作？（答案：A、B、C、D；解析：书中 §6.5 列了 INSERT/MAXIMUM/EXTRACT-MAX/INCREASE-KEY 四个）\n<\/li><li>\nA. INSERT   B. MAXIMUM   C. EXTRACT-MAX   D. INCREASE-KEY\n<\/li><li>\n（简答）HEAPSORT 为什么原地且 O(n lg n)？（答案：建堆 Θ(n)；之后 n-1 轮，每轮交换 O(1) + MAX-HEAPIFY O(lg n)，共 O(n lg n)；所有操作都在原数组内，不另开数组）\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n堆 = 数组看成完全二叉树；父≥子；LEFT=2i, RIGHT=2i+1。\n<\/li><li>\nMAX-HEAPIFY O(lg n)；BUILD-MAX-HEAP Θ(n)；HEAPSORT O(n lg n) 原地。\n<\/li><li>\n优先队列：作业调度；EXTRACT-MAX 与 INCREASE-KEY 是堆的经典应用。\n<\/ul>", "ch07": "<h1>第 7 章：快速排序<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：2.5 小时 | <strong>前置<\/strong>：第 2、5 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n写出 QUICKSORT 与 PARTITION 的伪代码，说出主元（pivot）的作用。\n<\/li><li>\n说出快速排序最坏 Θ(n²)、期望 Θ(n lg n) 的原因。\n<\/li><li>\n解释为什么随机化版本能消除「特定输入触发最坏」。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p><strong>选一个主元把数组劈成「小的一半」和「大的一半」，再递归排两边——平均极快，最坏靠随机化主元来防。<\/strong><\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：分治三步（书页 §7.1 已核对）<\/h3>\n<p>对 A[p..r]：<\/p>\n<ol><li>\n<strong>分解<\/strong>：用 PARTITION 把 A[p..r] 切成 A[p..q-1]（全 ≤ A[q]）与 A[q+1..r]（全 ≥ A[q]）。\n<\/li><li>\n<strong>解决<\/strong>：递归 QUICKSORT(A, p, q-1) 与 QUICKSORT(A, q+1, r)。\n<\/li><li>\n<strong>合并<\/strong>：因为子数组已原地排好，无需合并——整段自然有序。\n<\/ol>\n<pre><code>QUICKSORT(A, p, r)\n1  if p &lt; r\n2      q = PARTITION(A, p, r)\n3      QUICKSORT(A, p, q-1)\n4      QUICKSORT(A, q+1, r)<\/code><\/pre>\n<h3>概念 2：PARTITION（书页已核对）<\/h3>\n<p>选 x = A[r] 作主元（pivot，枢纽元素）。维护 i 使 A[p..i] 全 ≤ x：<\/p>\n<pre><code>PARTITION(A, p, r)\n1  x = A[r]\n2  i = p - 1\n3  for j = p to r-1\n4      if A[j] ≤ x\n5          i = i + 1\n6          exchange A[i] with A[j]\n7  exchange A[i+1] with A[r]\n8  return i+1<\/code><\/pre>\n<p>一趟扫描 Θ(n)，把主元 x 放到最终正确位置 q。<\/p>\n<h3>概念 3：性能分析（难度：进阶）<\/h3>\n<ul><li>\n<strong>最坏划分<\/strong>：每次主元都是最大或最小——切成 0 和 n-1 两块。递归式 T(n) = T(n-1) + T(0) + Θ(n) ⇒ <strong>T(n) = Θ(n²)<\/strong>。什么时候发生？数组已（逆）序且总选 A[r] 当主元。\n<\/li><li>\n<strong>最好划分<\/strong>：每次对半切 ⇒ T(n) = 2T(n/2) + Θ(n) = Θ(n lg n)。\n<\/li><li>\n<strong>平衡划分<\/strong>：哪怕 9:1 切，递归式仍是 O(n lg n)——只要不是每次都极端偏一边。\n<\/li><li>\n<strong>随机化版本<\/strong>：把 <code>x = A[r]<\/code> 换成随机选一个元素与 A[r] 交换（RANDOMIZED-PARTITION）。这样没有「专门触发最坏的输入」——期望运行时间 <strong>Θ(n lg n)<\/strong>，常数因子很小，是实际排序首选。\n<\/ul>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[⟨2,8,7,1,3,5,6,4⟩] --&gt; B[PARTITION: 主元 x=4]\n    B --&gt; C[≤4 的左半: ⟨2,1,3⟩ + 主元4 + ≥4 的右半: ⟨8,7,5,6⟩]\n    C --&gt; D[递归排左、右两半]\n    D --&gt; E[⟨1,2,3,4,5,6,7,8⟩]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：每一趟 PARTITION 只干一件事——把主元放到它在最终排序里的正确位置 q，并保证左边都 ≤ 它、右边都 ≥ 它。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：快速排序像「按体重分队」——随便挑一人当「秤」，比他轻的站左、比他重的站右，然后左右各自再找人当秤。<strong>失效边界<\/strong>：如果每次挑的「秤」都是全队最轻或最重（有序数组），就退化成一个超长队和一个空队，Θ(n²)。\n<\/li><li>\n<strong>实例<\/strong>：A = ⟨2, 8, 7, 1, 3, 5, 6, 4⟩，x = A[8] = 4。扫描后交换，q = 5，得到左 ⟨2,1,3⟩ + 4 + 右 ⟨8,7,5,6⟩——主元 4 已在最终位置。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为「快排最坏 Θ(n²) 所以不能用」<\/strong>——实际上期望 Θ(n lg n) 且常数小、缓存友好，是 C++ sort 等的默认实现；随机化后没有恶意输入能稳定触发最坏。\n<\/li><li>\n<strong>别以为「快排是稳定排序」<\/strong>——实际上 PARTITION 的远距离交换会打乱相等元素的相对顺序，快排不稳定。\n<\/li><li>\n<strong>别以为「主元选最后一个元素是算法的一部分」<\/strong>——实际上选谁当主元都行，只是教科书默认 A[r]；随机化主元是关键改进。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n（单选）快排最坏划分下的递归式是？（答案：A；解析：切出 0 和 n-1，T(n)=T(n-1)+Θ(n)=Θ(n²)）\n<ul>\n<li>\nA. T(n) = T(n-1) + Θ(n)\n<\/li><li>\nB. T(n) = 2T(n/2) + Θ(n)\n<\/li><li>\nC. T(n) = T(9n/10) + T(n/10) + Θ(n)\n<\/li><li>\nD. T(n) = 2T(n-1)\n<\/li><li>\n（单选）RANDOMIZED-QUICKSORT 的期望运行时间是？（答案：B；解析：书中证明期望 Θ(n lg n)）\n<\/li><li>\nA. Θ(n²)   B. Θ(n lg n)   C. Θ(n)   D. Θ(lg n)\n<\/li><li>\n（填空）PARTITION 选 x = A[__] 作主元（教科书默认）。（答案：r；解析：最后一个元素）\n<\/li><li>\n（简答）为什么「9:1 划分」仍然是 O(n lg n)？（答案：递归树每层总代价仍是 cn，树高 ≈ log_{10/9} n = O(lg n)；只要比例固定不为 1:0，深度就是对数级，总代价 O(n lg n)）\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n快排 = PARTITION 分边 + 递归；主元一趟放到最终位置。\n<\/li><li>\n最坏 Θ(n²)（有序数组）、最好/平衡 Θ(n lg n)。\n<\/li><li>\n随机化主元消除恶意输入，期望 Θ(n lg n)。\n<\/ul>", "ch08": "<h1>第 8 章：线性时间排序<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：2 小时 | <strong>前置<\/strong>：第 3、6、7 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n用决策树证明「任何比较排序最坏 Ω(n lg n)」。\n<\/li><li>\n说清计数排序、基数排序、桶排序各自适用条件与复杂度。\n<\/li><li>\n解释为什么线性时间排序能绕过 Ω(n lg n) 下界。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p><strong>只要还在「两两比较」，排序就快不过 n lg n；但计数/基数/桶排序不比较元素大小，所以能在线性时间跑完。<\/strong><\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：比较排序的下界（定理 8.1）（难度：进阶）<\/h3>\n<p><strong>比较排序<\/strong>：只通过比较 aᵢ 与 aⱼ 的大小获取次序信息。把一次排序抽象成一棵<strong>决策树<\/strong>：内部结点 = 一次比较 i:j，叶结点 = 一个排列 π(1),…,π(n)。<\/p>\n<ul><li>\nn 个元素有 n! 种排列，决策树至少要有 n! 个可达叶结点。\n<\/li><li>\n高度 h 的二叉树最多 2^h 个叶结点 ⇒ n! ≤ 2^h。\n<\/li><li>\n两边取对数：h ≥ lg(n!) = Ω(n lg n)（用斯特林近似或 A.2 求和）。\n<\/ul>\n<p><strong>结论<\/strong>：任何比较排序在最坏情况下都要 Ω(n lg n) 次比较（定理 8.1）。<strong>推论 8.2<\/strong>：堆排序和归并排序是渐近最优的比较排序。<\/p>\n<h3>概念 2：计数排序（counting sort）（难度：基础）<\/h3>\n<p><strong>前提<\/strong>：n 个输入元素都是 0 到 k 区间内的整数，且 k = O(n)。 <strong>思想<\/strong>：对每个元素 x，数「小于等于 x 的元素有几个」，直接把 x 放到输出数组的正确位置。<\/p>\n<pre><code>COUNTING-SORT(A, B, k)\n1  let C[0..k] be a new array\n2  for i = 0 to k: C[i] = 0\n3  for j = 1 to A.length: C[A[j]] += 1      // C[v] = 值 v 的个数\n4  for i = 1 to k: C[i] = C[i] + C[i-1]     // C[v] = ≤ v 的个数\n5  for j = A.length downto 1:               // 倒着扫,保稳定\n6      B[C[A[j]]] = A[j]\n7      C[A[j]] -= 1<\/code><\/pre>\n<p>复杂度 Θ(k + n) = Θ(n)（k = O(n) 时）。<strong>稳定<\/strong>：相同值元素在输出里保持输入里的相对顺序——这是基数排序依赖它的关键。<\/p>\n<h3>概念 3：基数排序（radix sort）（难度：基础）<\/h3>\n<p><strong>思想<\/strong>：像老式卡片排序机——按<strong>最低有效位<\/strong>到最高有效位逐位排，每一位用稳定排序（通常就是计数排序）。书中例子：d 位十进制数，从个位开始排一轮、十位再排一轮……共 d 轮。 复杂度：d 位、每位值域 0..k，用计数排序 ⇒ Θ(d(n+k))。当 d 是常数、k = O(n) 时为 Θ(n)。<strong>关键<\/strong>：每一轮必须是稳定的，否则高位排完会被低位洗回去。<\/p>\n<h3>概念 4：桶排序（bucket sort）（难度：进阶）<\/h3>\n<p><strong>前提<\/strong>：输入均匀分布在 [0,1)。 <strong>思想<\/strong>：把 [0,1) 切成 n 个等宽「桶」，元素按值扔进对应桶；每个桶内部用插入排序；最后按桶序串起来。因均匀分布，每桶元素期望 O(1)，总期望 <strong>Θ(n)<\/strong>。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n    A[输入 n 个数] --&gt; B{是比较排序吗?}\n    B --&gt;|是| C[决策树下界 Ω n lg n&lt;br/&gt;归并/堆排序达到此界]\n    B --&gt;|不是: 用元素值本身| D[计数排序 Θ n+k&lt;br/&gt;基数排序 Θ d n+k&lt;br/&gt;桶排序 期望 Θ n]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：分水岭在「要不要两两比较」。比较派被 Ω(n lg n) 卡死；不比较派靠「元素值的额外信息」突破。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：计数排序像「成绩单分类」——已知分数都在 0~100，直接开 101 个格子，每考分扔进对应格子，再按格子顺序倒出来。<strong>失效边界<\/strong>：分数若是 0~10⁹ 的任意整数，k 远大于 n，开格子就不划算。\n<\/li><li>\n<strong>实例<\/strong>：基数排序排 ⟨329, 457, 657, 839, 436, 720, 355⟩——先按个位（9,7,7,9,6,0,5）稳定排，再按十位，最后按百位，三轮后全局有序（书中图 8-3）。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为「线性排序比快排好」<\/strong>——实际上它们只在「元素值域小/分布均匀」的特定条件下成立；通用排序仍靠快排/归并。\n<\/li><li>\n<strong>别以为「计数排序不稳定就不能用」<\/strong>——实际上基数排序依赖它稳定；若自己写漏了第 5 行的「downto」倒扫，基数排序结果就错。\n<\/li><li>\n<strong>别以为「Ω(n lg n) 下界是算法无能」<\/strong>——它是对「只靠比较」这一模型的信息论下界；要突破必须利用元素的额外信息（值域、分布）。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n（单选）决策树下界证明 n! ≤ 2^h 推出 h ≥ ?（答案：B；解析：h ≥ lg(n!) = Ω(n lg n)）\n<ul>\n<li>\nA. Θ(n)   B. Ω(n lg n)   C. Ω(n²)   D. Ω(lg n)\n<\/li><li>\n（单选）计数排序适用条件是？（答案：C；解析：元素为 0..k 整数且 k=O(n)）\n<\/li><li>\nA. 任意实数   B. 字符串   C. 值域小的整数且 k=O(n)   D. 已部分有序\n<\/li><li>\n（填空）基数排序从最__有效位往最__有效位逐位排，每轮用__排序。（答案：低；高；稳定（计数）；解析：书中明确最低位先排、每轮稳定）\n<\/li><li>\n（简答）基数排序为什么每一轮必须稳定？（答案：高位排序后，低位的次序会被保留；若每轮不稳定，相同高位元素之间刚排好的低位顺序就被打乱，多轮累积后整体就错了）\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n比较排序下界 Ω(n lg n)（决策树 n! 叶）。\n<\/li><li>\n计数排序：值域小、Θ(n+k)、稳定。\n<\/li><li>\n基数排序：低位到高位、d 轮稳定排序、Θ(d(n+k))。\n<\/li><li>\n桶排序：均匀分布、期望 Θ(n)。\n<\/ul>", "ch09": "<h1>第 9 章：中位数和顺序统计量<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：2 小时 | <strong>前置<\/strong>：第 5、7 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n用成对比较在 3⌊n/2⌋ 次比较内同时找到最小值和最大值。\n<\/li><li>\n写出 RANDOMIZED-SELECT 的伪代码，说出它期望 Θ(n) 的原因。\n<\/li><li>\n了解最坏情况线性时间选择算法（BFPRT/中位数的中位数）的思想。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p><strong>「找第 i 小」不必先排序——快排的 PARTITION 只要递归一边，期望 Θ(n) 就能选中位数。<\/strong><\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：顺序统计量（order statistic）（难度：基础）<\/h3>\n<p><strong>第 i 个顺序统计量<\/strong>就是 n 个元素中第 i 小的元素。最常见的是最小值（i=1）、最大值（i=n）、中位数（i≈⌈n/2⌉）。<\/p>\n<h3>概念 2：同时找最小与最大（难度：基础）<\/h3>\n<p>naive 做法：最小值 n-1 次比较、最大值 n-1 次比较，共 2n-2 次。书中优化（书页 §9.1 已核对）：<strong>成对处理<\/strong>——先把两个元素互相比，小的去跟当前最小值比、大的去跟当前最大值比。每对只花 3 次比较。n 为奇/偶数初值不同，但总比较次数至多 <strong>3⌊n/2⌋<\/strong>。<\/p>\n<h3>概念 3：RANDOMIZED-SELECT（难度：进阶）<\/h3>\n<p>思路：像快排 PARTITION，但<strong>只递归主元所在的一边<\/strong>——因为第 i 小要么在左、要么在右、要么就是主元。<\/p>\n<pre><code>RANDOMIZED-SELECT(A, p, r, i)\n1  if p == r: return A[p]\n2  q = RANDOMIZED-PARTITION(A, p, r)\n3  k = q - p + 1          // 主元 A[q] 是第 k 小\n4  if i == k: return A[q]\n5  if i &lt; k: return RANDOMIZED-SELECT(A, p, q-1, i)\n6  else: return RANDOMIZED-SELECT(A, q+1, r, i-k)<\/code><\/pre>\n<p><strong>关键<\/strong>：不像快排递归两边，只递归一边——期望运行时间 <strong>Θ(n)<\/strong>（书中 §9.2 证明）。对比：快排期望 Θ(n lg n)，因为它两边都要排。<\/p>\n<h3>概念 4：最坏线性时间（SELECT，BFPRT）（难度：高难，了解思想）<\/h3>\n<p>RANDOMIZED-SELECT 最坏仍是 Θ(n²)（总切偏）。书中 §9.3 给出最坏也线性的算法「中位数的中位数」：把 n 个元素 5 个一组分组、每组取中位数、再对这些中位数递归取中位数，以它作主元——保证每轮至少 3n/10 左右被切走，递归式 T(n) ≤ T(⌈n/5⌉) + T(7n/10) + Θ(n) ⇒ <strong>T(n) = Θ(n)<\/strong>。这就是著名的 BFPRT 算法。工程中很少用（常数太大），但理论上证明「选择可以最坏线性」。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[PARTITION 后, 主元 q 是第 k 小] --&gt; B{i 与 k 比}\n    B --&gt;|i = k| C[主元就是答案]\n    B --&gt;|i &lt; k| D[只在左半 A[p..q-1] 递归找第 i 小]\n    B --&gt;|i &gt; k| E[只在右半 A[q+1..r] 递归找第 i-k 小]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：与快排最大的区别——只走一条分支，所以期望代价不是 n lg n 而是 n。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：在一堆报名者里挑「第 10 名」，不必把所有人都排名——随便挑一人当标杆，比他小的放左边、大的放右边，看「第 10」在左还是右，继续在那一边找。<strong>失效边界<\/strong>：若每次标杆都是最大或最小（坏运气），就退化到 Θ(n²)；随机化主元正是为了防这个。\n<\/li><li>\n<strong>实例<\/strong>：A = ⟨3, 2, 9, 0, 7, 5, 4, 8, 6, 1⟩ 找第 5 小。某次 PARTITION 后主元 k=4，i=5&gt;k ⇒ 到右半找第 i-k=1 小。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为「选中位数必须先排序」<\/strong>——实际上 RANDOMIZED-SELECT 期望 Θ(n)，比排序的 Θ(n lg n) 快。\n<\/li><li>\n<strong>别以为「RANDOMIZED-SELECT 最坏也快」<\/strong>——实际上它期望 Θ(n)，最坏 Θ(n²)；想要最坏线性得用 BFPRT，但常数巨大不实用。\n<\/li><li>\n<strong>别以为「找最小最大要 2n-2 次比较」<\/strong>——实际上成对比较只要 3⌊n/2⌋ 次。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n（单选）RANDOMIZED-SELECT 的期望运行时间是？（答案：B；解析：只递归一边，书中证明 Θ(n)）\n<ul>\n<li>\nA. Θ(n lg n)   B. Θ(n)   C. Θ(n²)   D. Θ(lg n)\n<\/li><li>\n（单选）同时找最小和最大值，最优比较次数约为？（答案：C；解析：成对比较 3⌊n/2⌋）\n<\/li><li>\nA. 2n   B. n   C. 3⌊n/2⌋   D. n lg n\n<\/li><li>\n（填空）BFPRT 算法通过「中位数的中位数」选主元，保证最坏运行时间为 Θ(__)。（答案：n；解析：T(n)=Θ(n)）\n<\/li><li>\n（简答）RANDOMIZED-SELECT 为什么比快排快一个量级？（答案：快排要递归排序左右两半，总代价 n lg n；SELECT 只在包含第 i 小的那一半递归，每轮丢弃一半，期望总代价 n + n/2 + n/4 + … = Θ(n)）\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n顺序统计量 = 第 i 小；最小/最大/中位数。\n<\/li><li>\n成对比较找最值：3⌊n/2⌋ 次。\n<\/li><li>\nRANDOMIZED-SELECT 期望 Θ(n)，只递归一边。\n<\/li><li>\nBFPRT：最坏 Θ(n)，但常数大不实用。\n<\/ul>", "ch10": "<h1>第 10 章：基本数据结构<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★☆☆ | <strong>预估学时<\/strong>：1.5 小时 | <strong>前置<\/strong>：第 2 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说出栈（LIFO）与队列（FIFO）的区别与数组实现。\n<\/li><li>\n用数组/链表表示动态集合，理解指针与对象的实现方式。\n<\/li><li>\n用左孩子右兄弟法表示有根树。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p><strong>栈「后进先出」、队列「先进先出」——它们是一切复杂数据结构的积木；指针和对象只是把数组里的位置串起来。<\/strong><\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：栈（stack）（难度：基础）<\/h3>\n<p><strong>栈<\/strong>是只在一端（栈顶）操作的动态集合：INSERT 叫<strong>压入 PUSH<\/strong>，DELETE 叫<strong>弹出 POP<\/strong>。它是<strong>后进先出（LIFO, last-in first-out）<\/strong>——像餐厅摞起来的弹簧盘子，只能取最上面那个。 数组实现：用 S[1..n] 和一个属性 S.top 指向最新元素。S.top = 0 表示空；对空栈 POP 叫<strong>下溢 underflow<\/strong>，S.top 超过 n 叫<strong>上溢 overflow<\/strong>。<\/p>\n<pre><code>STACK-EMPTY(S): if S.top == 0 then TRUE else FALSE\nPUSH(S, x): S.top = S.top + 1; S[S.top] = x\nPOP(S):     if STACK-EMPTY(S): error else S.top = S.top - 1; return S[S.top+1]<\/code><\/pre>\n<h3>概念 2：队列（queue）（难度：基础）<\/h3>\n<p><strong>队列<\/strong>是<strong>先进先出（FIFO）<\/strong>：INSERT 叫<strong>入队 ENQUEUE<\/strong>，DELETE 叫<strong>出队 DEQUEUE<\/strong>——删的是队列中存在最久的元素。数组实现用 head（队头）与 tail（队尾）两个指针；当 tail 走到末尾就绕回开头（循环队列）。<\/p>\n<h3>概念 3：链表（linked list）（难度：基础）<\/h3>\n<p><strong>链表<\/strong>中每个对象有 key、next（指向后继）、prev（指向前驱，双向链）。SEARCH 线性扫描 O(n)；INSERT 挂到表头 O(1)；DELETE 按指针 O(1)。<strong>哨兵（sentinel）<\/strong>是一个哑对象，简化边界判断——红黑树那章会用到。<\/p>\n<h3>概念 4：指针与对象的实现（难度：进阶）<\/h3>\n<p>书中 §10.3 说明：对象不必用语言自带指针，用多个数组（key 数组、next 数组、prev 数组）按下标关联即可——「指针」就是数组下标。这是把「对象」翻译成连续内存的办法。<\/p>\n<h3>概念 5：有根树的表示（难度：基础）<\/h3>\n<ul><li>\n二叉树：left、right 两个指针。\n<\/li><li>\n任意树（孩子数不定）：<strong>左孩子右兄弟<\/strong>表示法——每个结点存 left-child 与 right-sibling，把任意度的树压成二叉树形状。\n<\/ul>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n    subgraph 栈[LIFO 像摞盘子]\n    A[压入 1] --&gt; B[压入 2] --&gt; C[弹出 2] --&gt; D[弹出 1]\n    end\n    subgraph 队列[FIFO 像排队]\n    E[入队 1] --&gt; F[入队 2] --&gt; G[出队 1] --&gt; H[出队 2]\n    end<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：栈里「后压入的先弹出」；队列里「先入队的先出队」。这两种相反的取出顺序决定了它们分别用于「回溯」（栈）与「排队」（队列）。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：栈 = 浏览器后退（最后打开的页面先退）；队列 = 打印机任务（先提交先打印）。<strong>失效边界<\/strong>：栈不能「取中间的元素」，队列不能「插队」——要这种灵活性就得用更复杂的结构（优先队列）。\n<\/li><li>\n<strong>实例<\/strong>：依次 PUSH 9、4、2，POP 一次返回 2；依次 ENQUEUE 9、4、2，DEQUEUE 一次返回 9。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为「栈和堆（内存）是一回事」<\/strong>——本书这里的栈是数据结构 LIFO；与 Java 垃圾回收的「堆」无关。\n<\/li><li>\n<strong>别以为「链表查找快」<\/strong>——实际上链表只能从头扫，SEARCH 是 O(n)，数组随机访问才 O(1)。\n<\/li><li>\n<strong>别以为「队列删除队头要搬移」<\/strong>——循环队列用 head/tail 指针绕回，不搬移元素。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n（单选）栈的取出顺序是？（答案：B；解析：LIFO 后进先出）\n<ul>\n<li>\nA. FIFO   B. LIFO   C. 随机   D. 按优先级\n<\/li><li>\n（单选）队列的取出顺序是？（答案：A；解析：FIFO 先进先出）\n<\/li><li>\nA. FIFO   B. LIFO   C. 按大小   D. 逆序\n<\/li><li>\n（填空）栈用 S[1..n] 与属性 S.__ 指向最新元素。（答案：top；解析：书中数组实现）\n<\/li><li>\n（简答）哨兵（sentinel）有什么用？（答案：一个哑对象充当边界，使链表/树操作不必每次判「是否为空」，把边界情况统一成普通情况，简化代码）\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n栈 LIFO（PUSH/POP），队列 FIFO（ENQUEUE/DEQUEUE）。\n<\/li><li>\n链表 O(1) 插删、O(n) 查找；哨兵简化边界。\n<\/li><li>\n任意树用左孩子右兄弟压成二叉树表示。\n<\/ul>", "ch11": "<h1>第 11 章：散列表<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：2.5 小时 | <strong>前置<\/strong>：第 10 章、第 5 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n解释「直接寻址」与「散列」的区别，说出<strong>冲突（collision）<\/strong>是什么。\n<\/li><li>\n用链接法与开放寻址法（线性/二次/双重探查）解决冲突。\n<\/li><li>\n说出均匀散列假设下，SEARCH 的期望时间 O(1)，以及全域散列为什么不怕恶意输入。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p><strong>散列表 = 用散列函数把关键字「压缩」成数组下标，平均 O(1) 完成插入/查找/删除——冲突靠链接或探查来化解。<\/strong><\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：直接寻址 vs 散列（难度：基础）<\/h3>\n<p><strong>直接寻址表<\/strong> T[0..m-1]：关键字 k 直接当下标，T[k] 存元素。问题：当关键字全域 U 很大（如所有字符串），开 m 个槽根本不现实。 <strong>散列表<\/strong>：槽数 m 与「实际存储的关键字数 n」成比例，用<strong>散列函数 h(k)<\/strong> 把 k 映射到 0..m-1。两个不同关键字 k₁≠k₂ 但 h(k₁)=h(k₂) 叫<strong>冲突（collision）<\/strong>。<\/p>\n<h3>概念 2：链接法（chaining）（难度：基础）<\/h3>\n<p>每个槽 T[j] 挂一个链表，所有散列到 j 的元素都串在这条链上。SEARCH 时先算 h(k)、再扫那条链。<\/p>\n<ul><li>\n装填因子 α = n/m（每个槽期望挂几个元素）。\n<\/li><li>\n均匀散列假设下：不成功查找期望 O(1+α)，成功查找也 O(1+α)。α 是常数 ⇒ O(1)。最坏（全冲突）Θ(n)。\n<\/ul>\n<h3>概念 3：散列函数（难度：进阶）<\/h3>\n<p>好的散列函数要「近似均匀」——每个关键字等可能落到任一槽。书中介绍：<\/p>\n<ul><li>\n<strong>除法散列<\/strong>：h(k) = k mod m（m 别取 2 的幂附近、别取太巧的数）。\n<\/li><li>\n<strong>乘法散列<\/strong>：h(k) = ⌊m(kA mod 1)⌋，0 &lt; A &lt; 1。\n<\/li><li>\n<strong>全域散列（universal hashing）<\/strong>：运行时从一簇函数里<strong>随机挑一个<\/strong> h。定理 11.3：k 不在表中时含 k 的链期望长度 ≤ α；在表中时 ≤ 1+α。推论 11.4：对手无法预先构造「总让你冲突」的输入——因为散列函数是随机选的。\n<\/ul>\n<h3>概念 4：开放寻址法（open addressing）（难度：进阶）<\/h3>\n<p>不挂链表：所有元素直接存在散列表里。冲突时按一个<strong>探查序列<\/strong>往下找空位。三种探查（书页已核对）：<\/p>\n<ul><li>\n<strong>线性探查<\/strong>：h(k, i) = (h&#x27;(k) + i) mod m。问题：<strong>一次群集（primary clustering）<\/strong>——连续被占的槽越来越长。\n<\/li><li>\n<strong>二次探查<\/strong>：h(k, i) = (h&#x27;(k) + c₁i + c₂i²) mod m。仍有轻度<strong>二次群集<\/strong>。\n<\/li><li>\n<strong>双重散列<\/strong>：h(k, i) = (h₁(k) + i·h₂(k)) mod m——探查序列既依赖起始位置又依赖步长，是开放寻址里最好的方法之一（h₂(k) 要与 m 互素）。\n<\/ul>\n<p>均匀散列假设：每个关键字的探查序列是 (0,1,…,m-1) 的 m! 种排列之一。不成功探查期望 O(1/(1−α))。<\/p>\n<h3>概念 5：完全散列（perfect hashing）（难度：高难，了解）<\/h3>\n<p>关键字集合静态（不再增删）时，用两层散列做到<strong>最坏 O(1)<\/strong> 查找——第一层散列，第二层对每个槽再开一个小散列表并保证无冲突。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[关键字 k] --&gt; B[散列函数 h k]\n    B --&gt; C{槽 h k 有冲突?}\n    C --&gt;|链接法| D[挂链表, 扫链]\n    C --&gt;|开放寻址| E[按探查序列 h k, i 找空位]\n    D --&gt; F[平均 O 1+α]\n    E --&gt; F<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：先把 k 压缩成下标，冲突时要么串链（链接法），要么按序列往下找（开放寻址）。两条路平均都是常数。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：散列函数像「按姓氏首字母分到 26 个班」——冲突（同姓）靠「同班的坐一张长凳」（链接法）或「往下找空位」（开放寻址）。<strong>失效边界<\/strong>：若散列函数极差（全挤一个班），就退化成链表 Θ(n)；全域散列就是「随机换一种分班规则」防有人故意全报同姓。\n<\/li><li>\n<strong>实例<\/strong>：m=9，关键字 10, 22, 33 经 h(k)=k mod 9：10→1、22→4、33→6，各落各槽；若再来 4（mod 9=4）与 22 冲突，链接法就在槽 4 挂 ⟨22, 4⟩。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为「散列表最坏也是 O(1)」<\/strong>——实际上最坏 Θ(n)（全冲突）；只有均匀散列假设下期望 O(1)。\n<\/li><li>\n<strong>别以为「开放寻址法不占额外空间就一定省」<\/strong>——实际上它装填因子 α 必须控制在 &lt; 1，表要留空，否则探查序列会失效。\n<\/li><li>\n<strong>别以为「双重散列 h₂(k) 可以随便取」<\/strong>——实际上 h₂(k) 要与 m 互素（m 取素数或 h₂ 总返回奇数），否则探查序列走不到所有槽。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n（单选）装填因子 α 的定义是？（答案：A；解析：α = n/m，平均每槽元素数）\n<ul>\n<li>\nA. n/m   B. m/n   C. n·m   D. n+m\n<\/li><li>\n（多选）开放寻址法常用的探查技术有？（答案：A、B、C；解析：书中列线性/二次/双重三种）\n<\/li><li>\nA. 线性探查   B. 二次探查   C. 双重散列   D. 二分探查\n<\/li><li>\n（填空）双重散列公式 h(k,i) = (h₁(k) + i·__(k)) mod m。（答案：h₂；解析：书中公式）\n<\/li><li>\n（简答）为什么要全域散列？（答案：固定散列函数时，对手可构造总冲突的关键字；运行时从一簇函数随机选一个，使任何输入的期望链长都 ≤ 1+α，从根上免疫恶意输入）\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n散列 = h(k) 把关键字压成下标；冲突不可避免。\n<\/li><li>\n链接法：期望 O(1+α)；开放寻址：线性/二次/双重探查。\n<\/li><li>\n全域散列随机选函数，最坏免疫；完全散列静态集合最坏 O(1)。\n<\/ul>", "ch12": "<h1>第 12 章：二叉搜索树<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：2 小时 | <strong>前置<\/strong>：第 10 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n写出二叉搜索树（BST）的性质，并据此查找 MINIMUM/MAXIMUM/SUCCESSOR。\n<\/li><li>\n描述 BST 的 INSERT 与 DELETE 过程。\n<\/li><li>\n解释为什么 BST 操作时间与树高成正比，以及随机 BST 的期望高度。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p><strong>左子树全 ≤ 根、右子树全 ≥ 根——这条性质让「查找/插入/删除」都只走一条从根到叶的路径，时间等于树高。<\/strong><\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：BST 性质（书页 §12.1 已核对）<\/h3>\n<p>对任意结点 x：左子树中所有结点 y 满足 y.key ≤ x.key；右子树中所有结点 y 满足 y.key ≥ x.key。这叫<strong>二叉搜索树性质<\/strong>。直接推论：<strong>中序遍历<\/strong>（左→根→右）输出的是按 key 排好序的序列。<\/p>\n<h3>概念 2：基本操作（难度：基础）<\/h3>\n<p>所有操作从根出发，沿一条路径下滑，代价 = 树高 h：<\/p>\n<ul><li>\n<strong>SEARCH(x, k)<\/strong>：从根开始，k &lt; 当前 key 走左、k &gt; 当前 key 走右。O(h)。\n<\/li><li>\n<strong>MINIMUM<\/strong>：一路往左到最左结点。O(h)。\n<\/li><li>\n<strong>MAXIMUM<\/strong>：一路往右到最右结点。O(h)。\n<\/li><li>\n<strong>SUCCESSOR(x)<\/strong>：x 有右子树 → 右子树的最左；否则往上找到「第一个把 x 放在其左子树里的祖先」。O(h)。\n<\/li><li>\n<strong>INSERT<\/strong>：SEARCH 找到该插入的叶子空位，挂上。O(h)。\n<\/li><li>\n<strong>DELETE<\/strong>（分三种情况）：\n<ol>\n<li>\n无子：直接删。\n<\/li><li>\n一个子：用子顶替。\n<\/li><li>\n两个子：找后继（右子树最左）y，用 y.key 顶替 x，再删 y（y 至多一个子）。O(h)。\n<\/ol>\n<\/ul>\n<h3>概念 3：树高问题（难度：进阶）<\/h3>\n<ul><li>\n完全平衡树：h = Θ(lg n)，操作都快。\n<\/li><li>\n最坏：插入有序序列 ⇒ 树退化成 n 个结点的链，h = Θ(n)，操作与链表一样慢。\n<\/li><li>\n<strong>随机构造的 BST<\/strong>（§12.4）：期望高 O(lg n) ⇒ 操作平均 Θ(lg n)。\n<\/ul>\n<p>这就是第 13 章红黑树要解决的问题：用颜色约束保证 h = O(lg n)。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    R[根 6] --&gt; L[左子 5: 全 ≤ 6]\n    R --&gt; RR[右子 7: 全 ≥ 6]\n    L --&gt; L1[2]\n    L --&gt; L2[5]\n    RR --&gt; RR1[7]\n    RR --&gt; RR2[8]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：每个结点都比左子树所有值大、比右子树所有值小。查找 7：从 6 起，7&gt;6 走右，命中。查找 2：2&lt;6 走左、2&lt;5 走左，命中。每次只走一条路径。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：BST 像「按字典序分叉的目录树」——在每个分叉点，左边是 smaller half、右边是 larger half。<strong>失效边界<\/strong>：如果插入顺序不幸（1,2,3,4,5…），树就成了一条斜链，失去二分优势。\n<\/li><li>\n<strong>实例<\/strong>：书上例图 12-1：根 6，左子 5（再左 2、右 5），右子 7（再右 8）。中序遍历输出 2, 5, 5, 6, 7, 8——排好序。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为「BST 操作都是 O(lg n)」<\/strong>——实际上操作时间 = 树高；树退化时是 O(n)。\n<\/li><li>\n<strong>别以为「删结点就直接摘掉」<\/strong>——两个子时必须用后继顶替，保持 BST 性质。\n<\/li><li>\n<strong>别以为「中序遍历是排序的副产品」<\/strong>——它恰恰是 BST 性质的直接体现：左根右 = 升序。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n（单选）BST 的中序遍历输出是？（答案：B；解析：左→根→右 = 升序）\n<ul>\n<li>\nA. 降序   B. 升序   C. 随机   D. 按插入序\n<\/li><li>\n（单选）BST 上 SEARCH 的时间是？（答案：C；解析：从根到叶一条路径，= O(h)，平衡时 O(lg n)）\n<\/li><li>\nA. O(1)   B. O(n)   C. O(h)   D. O(n²)\n<\/li><li>\n（填空）x 有右子树时，x 的后继是右子树的最__结点。（答案：左；解析：SUCCESSOR 规则）\n<\/li><li>\n（简答）按 1,2,3,4,5 顺序插入 BST 会怎样？（答案：每个新结点都比前一个大，全挂在右链上，树退化成高度 Θ(n) 的链，查找变成线性扫描——这就是需要红黑树的原因）\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\nBST 性质：左 ≤ 根 ≤ 右；中序 = 升序。\n<\/li><li>\nSEARCH/MIN/MAX/SUCCESSOR/INSERT/DELETE 都是 O(h)。\n<\/li><li>\n退化 BST = 链；随机 BST 期望 O(lg n)；红黑树保证最坏 O(lg n)。\n<\/ul>", "ch13": "<h1>第 13 章：红黑树<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：3 小时 | <strong>前置<\/strong>：第 12 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n列出红黑树的五条性质，并解释它们为什么保证树高 O(lg n)。\n<\/li><li>\n说出「旋转（rotation）」在保持 BST 性质的同时怎么改变结构。\n<\/li><li>\n描述 RB-INSERT 后用 RB-INSERT-FIXUP（重新着色 + 旋转）恢复性质的思路。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p><strong>给 BST 的每个结点涂红或黑，用「红父不能有红子」和「每条路径黑点数相同」两条约束，把树死死摁在近似平衡——高度 ≤ 2 lg(n+1)。<\/strong><\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：五条红黑性质（书页 §13.1 已核对）<\/h3>\n<ol><li>\n每个结点或是红色，或是黑色。\n<\/li><li>\n根结点是黑色。\n<\/li><li>\n每个叶结点（NIL 哨兵）是黑色。\n<\/li><li>\n如果一个结点是红色的，则它的两个子结点都是黑色（<strong>红父无红子<\/strong>）。\n<\/li><li>\n对每个结点，从该结点到其所有后代叶结点的简单路径上，黑结点数相同——这个数叫该结点的<strong>黑高 bh(x)<\/strong>。\n<\/ol>\n<h3>概念 2：为什么高是 O(lg n)（难度：进阶）<\/h3>\n<p><strong>引理 13.1<\/strong>：有 n 个内部结点的红黑树高度至多为 2 lg(n+1)。 白话推理：由性质 4，任意路径上红结点不能相邻 ⇒ 黑结点至少占一半。由性质 5，黑高 bh 的子树至少有 2^{bh} − 1 个内部结点。于是 n ≥ 2^{bh} − 1，bh ≥ lg(n+1)；而树高 ≤ 2·bh（红黑相间最多让高度翻倍）⇒ h ≤ 2 lg(n+1)。<strong>所以所有 BST 操作最坏 O(lg n)<\/strong>。<\/p>\n<h3>概念 3：旋转（rotation）（难度：进阶）<\/h3>\n<p><strong>左旋 LEFT-ROTATE(T, x)<\/strong>：把 x 与其右子 y 「转一下」——y 上位、x 下位、y 的左子变成 x 的右子。旋转保持 BST 性质（key 大小关系不变），只改变树结构。旋转是 O(1) 局部操作，插入/删除后用它「扶正」被破坏的平衡。<\/p>\n<h3>概念 4：插入与修复（难度：高难）<\/h3>\n<p><strong>RB-INSERT<\/strong>：像普通 BST 一样插入 z，然后<strong>把 z 着成红色<\/strong>（着红才不改变黑高，否则整棵树黑高+1 代价太大）。但红 z 可能导致「红父红子」——调用 <strong>RB-INSERT-FIXUP<\/strong>：按「叔叔结点」的颜色分情况，重新着色 + 旋转，直到性质恢复。书页给出的 FIXUP 结构：<\/p>\n<ul><li>\n情况 1：叔叔是红 → 父、叔变黑，祖父变红，z 上移到祖父。\n<\/li><li>\n情况 2/3：叔叔是黑 → 按方向旋转，完成修复。\n<\/ul>\n<p>整轮插入 O(lg n)。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[BST 退化成链 h=n] --&gt; B[加颜色约束 5 条性质]\n    B --&gt; C[红父无红子 + 每条路径黑点数相同]\n    C --&gt; D[任意路径 ≤ 2·bh, 树高 ≤ 2 lg n+1]\n    D --&gt; E[SEARCH/INSERT/DELETE 全部最坏 O lg n]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：红黑树的本质是「给 BST 上保险」——用颜色把树锁在平衡区间，不让它退化成链。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：红黑树像「交通灯管制」——红灯（红结点）不能连红灯（红父无红子），每条路从根到灯杆要经过的黑灯数一样（黑高相同）。<strong>失效边界<\/strong>：颜色规则只保证「近似平衡」，不保证绝对平衡——允许一边比另一边深一倍。\n<\/li><li>\n<strong>实例<\/strong>：书中图 13-1 的红黑树：黑根、黑叶、红结点的子都是黑的。插入一个红结点后可能出现「红爷爷红爸爸」，FIXUP 把爷爷转黑、爸爸转红、再旋转——像重新洗牌。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为「红黑树就是完全平衡」<\/strong>——实际上它只保证 h ≤ 2 lg(n+1)，允许左右高度差一倍。AVL 树更严格，但红黑树插入旋转次数更少，工程（如 Linux 进程调度、Java TreeMap）更爱用。\n<\/li><li>\n<strong>别以为「插入把新结点着黑更省事」<\/strong>——实际上着黑会改变黑高，整棵树都要修；着红只可能破坏「红父无红子」一条，FIXUP 范围小。\n<\/li><li>\n<strong>别以为「旋转会破坏 BST 性质」<\/strong>——实际上旋转只换父子关系，key 大小顺序在中序遍历里完全不变。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n（多选）下列哪些是红黑树的性质？（答案：A、B、C；解析：书中 5 条——根黑、红父无红子、每条路径黑点数相同；D 错，不要求左右等高）\n<ul>\n<li>\nA. 根结点是黑的\n<\/li><li>\nB. 红结点的两个子都是黑的\n<\/li><li>\nC. 从任意结点到叶的所有路径黑点数相同\n<\/li><li>\nD. 左右子树高度必须相等\n<\/li><li>\n（单选）引理 13.1 给出 n 个内部结点红黑树的高度上界是？（答案：C；解析：书中 h ≤ 2 lg(n+1)）\n<\/li><li>\nA. Θ(1)   B. Θ(lg n)   C. 2 lg(n+1)   D. Θ(n)\n<\/li><li>\n（填空）新插入的结点 z 被着成__色，以免改变树的黑高。（答案：红；解析：着黑会让黑高+1）\n<\/li><li>\n（简答）旋转为什么不破坏 BST 性质？（答案：旋转只调整父子指针，中序遍历的 key 顺序完全不变；左旋后 y 上位、x 下位、y 的左子挪给 x，key 的大小关系仍满足左≤根≤右）\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n5 条性质核心：红父无红子 + 黑高相同。\n<\/li><li>\n引理：h ≤ 2 lg(n+1) ⇒ 所有操作 O(lg n)。\n<\/li><li>\n旋转 O(1) 扶正；插入着红 + FIXUP 着色旋转恢复性质。\n<\/ul>", "ch14": "<h1>第 14 章：数据结构的扩张<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：2 小时 | <strong>前置<\/strong>：第 13 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说出「数据结构扩张」的标准四步法。\n<\/li><li>\n在红黑树每个结点上维护 size 属性，实现 O(lg n) 查第 i 小与查秩。\n<\/li><li>\n用区间树快速找出「与给定区间重叠的区间」。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p><strong>不用发明新结构——在红黑树每个结点上多存一个「子树大小/区间端点」的汇总信息，就能直接得到顺序统计树与区间树。<\/strong><\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：数据结构扩张四步法（书页 §14.2）<\/h3>\n<ol><li>\n选一个基础数据结构（如红黑树）。\n<\/li><li>\n在每个结点加一个<strong>新属性<\/strong>（如 size），并说明这个属性怎么由现有属性算出来。\n<\/li><li>\n保证插入/删除时能<strong>维护<\/strong>这个新属性（旋转时也要更新）。\n<\/li><li>\n设计新操作。\n<\/ol>\n<h3>概念 2：顺序统计树（order-statistic tree）（难度：进阶）<\/h3>\n<p>在红黑树每个结点 x 上多加一个属性 <strong>x.size<\/strong> = 以 x 为根的子树（含 x）的内部结点数。递推式（书页已核对）：<\/p>\n<pre><code>x.size = x.left.size + x.right.size + 1<\/code><\/pre>\n<ul><li>\n<strong>查询第 i 小（SELECT）<\/strong>：从根走，根左子树大小 r = left.size。若 i = r+1，根就是第 i 小；i ≤ r 走左；i &gt; r+1 走右并把 i 减去 (r+1)。O(lg n)。\n<\/li><li>\n<strong>查秩（RANK）<\/strong>：元素 x 在中序遍历中的位置。O(lg n)。\n<\/ul>\n<h3>概念 3：区间树（interval tree）（难度：高难）<\/h3>\n<p>需求：存一组区间（如时间区间），快速找出「与给定区间 [t₁, t₂] 重叠的区间」。 做法：在红黑树里以区间左端点为 key；每个结点 x 多存 <strong>x.max<\/strong> = 以 x 为根的子树中所有区间右端点的最大值。查找时：若查询区间与 x 重叠就返回 x；否则左子树 max ≥ 左端 → 走左，否则走右。O(lg n)。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n    A[基础: 红黑树 O lg n] --&gt; B[每个结点多存 size 或 max]\n    B --&gt; C[插入/删除/旋转时同步更新该属性]\n    C --&gt; D[新操作: 第i小 / 查秩 / 区间重叠查询]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：扩张 = 给老结构加「汇总信息」，而不是推倒重来。size 让树「知道」自己第 i 小；max 让树「知道」哪边可能藏着重叠区间。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：给组织架构图每个部门标注「本部门共多少人」（size），一眼就能数出全公司第 100 号员工在哪。<strong>失效边界<\/strong>：加属性后每次旋转/插入都得记得更新，否则 size 过期、答案就错。\n<\/li><li>\n<strong>实例<\/strong>：顺序统计树根 size=10，左子树 size=4。查第 5 小：5 &gt; 4+1，去右子树找第 5−5=0…（具体按递推）。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为「扩张数据结构要从零发明」<\/strong>——实际上书中的核心方法就是「在红黑树结点上加一个维护好的汇总字段」。\n<\/li><li>\n<strong>别以为「加 size 会让插入变 O(n)」<\/strong>——实际上 size 只在从根到插入点的路径上变化，每次 O(1) 更新，总 O(lg n)。\n<\/li><li>\n<strong>别以为「区间重叠要两两比」<\/strong>——实际上 max 属性让查找每次只走一条路径，O(lg n)。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n（单选）顺序统计树结点 size 的定义是？（答案：B；解析：x.size = left.size + right.size + 1，含自身）\n<ul>\n<li>\nA. 左子树大小   B. 含自身的子树结点数   C. 右子树大小   D. 整棵树结点数\n<\/li><li>\n（单选）区间树每个结点 x 维护的 max 是什么？（答案：C；解析：子树中所有区间右端点的最大值）\n<\/li><li>\nA. 左端点最大值   B. 右端点最小值   C. 子树右端点最大值   D. 区间中点\n<\/li><li>\n（填空）查第 i 小的 SELECT 操作时间是 O(__ n)。（答案：lg；解析：沿一条路径下滑）\n<\/li><li>\n（简答）旋转时为什么要更新 size？（答案：旋转改变了左右子树结构，size 是子树汇总值；若不更新，后续 SELECT/RANK 读到的 size 是过期的，会给出错误名次）\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n扩张四步：选基础结构 → 加属性 → 维护属性 → 设计新操作。\n<\/li><li>\n顺序统计树：size 字段，O(lg n) 查第 i 小与秩。\n<\/li><li>\n区间树：max 字段，O(lg n) 查重叠区间。\n<\/ul>", "ch15": "<h1>第 15 章：动态规划<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：4 小时 | <strong>前置<\/strong>：第 2、4 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说出动态规划适用的两个特征：<strong>最优子结构<\/strong>与<strong>重叠子问题<\/strong>。\n<\/li><li>\n用四步法解钢条切割、矩阵链乘法、LCS、最优二叉搜索树。\n<\/li><li>\n区分「自底向上填表」与「带备忘的自顶向下」两种实现。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p><strong>递归会反复算同一个子问题——把它算一次存进表，下次直接查表：最优解 = 表中一格一格推出来的。<\/strong><\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：DP 适用的两个特征（难度：基础）<\/h3>\n<p>书页 §15.3：能用动态规划（DP）的问题必须有：<\/p>\n<ul><li>\n<strong>最优子结构（optimal substructure）<\/strong>：问题的最优解由相关子问题的最优解组合而成。\n<\/li><li>\n<strong>重叠子问题（overlapping subproblems）<\/strong>：递归过程反复遇到同一个子问题（不是像分治那样每次生成全新子问题）。\n<\/ul>\n<h3>概念 2：DP 四步法（书页 §15 已核对）<\/h3>\n<ol><li>\n刻画一个最优解的结构特征。\n<\/li><li>\n递归地定义最优解的值。\n<\/li><li>\n自底向上计算最优值。\n<\/li><li>\n利用算出的信息构造最优解。\n<\/ol>\n<h3>概念 3：钢条切割（难度：基础）<\/h3>\n<p>长度 n 英寸钢条，价格表 pᵢ（长度 i 的售价）。求切割方案使总收益 rₙ 最大。 递归式：rₙ = max_{1≤i≤n}(pᵢ + r_{n−i})——第一刀切下长度 i 卖 pᵢ，剩下 n−i 递归最优。 朴素递归是指数级；<strong>自底向上<\/strong>填表 r[0..n] 后 O(n²)。书页价格例：长度 1..10 价格 [1,5,8,9,10,17,17,20,24,30]。<\/p>\n<h3>概念 4：矩阵链乘法（难度：进阶）<\/h3>\n<p>给矩阵链 A₁A₂…Aₙ（Aᵢ 尺寸 p_{i−1}×pᵢ），求最优括号化使标量乘法次数最少。 递归式（书页 eq 15.7）：<\/p>\n<pre><code>m[i,j] = 0                                    若 i=j\nm[i,j] = min_{i≤k&lt;j}(m[i,k] + m[k+1,j] + p_{i−1}p_k p_j)   若 i&lt;j<\/code><\/pre>\n<p>s[i,j] 记录最优分割点 k。子问题共 Θ(n²) 个，填表 O(n³)。<\/p>\n<h3>概念 5：最长公共子序列 LCS（难度：进阶）<\/h3>\n<p>X = ⟨x₁..xₘ⟩，Y = ⟨y₁..yₙ⟩。定理 15.1（最优子结构，书页已核对）：<\/p>\n<ul><li>\n若 xₘ = yₙ，则 LCS = xₘ + LCS(X_{m−1}, Y_{n−1})；\n<\/li><li>\n若不等，则 max(LCS(X_{m−1}, Y), LCS(X, Y_{n−1}))。\n<p>填表 c[i,j] = LCS 长度，O(mn)，并回溯构造序列。书页例：X=⟨A,B,C,B,D,A,B⟩，Y=⟨B,D,C,A,B,A⟩，LCS=⟨B,C,B,A⟩ 长 4。<\/p>\n<\/ul>\n<h3>概念 6：最优二叉搜索树（难度：高难，了解）<\/h3>\n<p>已知各关键字查找概率，构造期望查找代价最小的 BST。递归式 e[i,j] = min_{i≤k≤j}(e[i,k−1]+e[k+1,j]+w(i,j))，O(n³)。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[递归式直接算] --&gt; B{子问题重复吗?}\n    B --&gt;|不重复: 分治| C[分治法]\n    B --&gt;|重复: 重叠子问题| D[建表 m, 自底向上填]\n    D --&gt; E[每格由更小格推出, O n² 或 O n³]\n    E --&gt; F[回溯 s 表构造最优解]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：判断要不要用 DP 的关键是「递归是不是在反复算同一个子问题」。是 → 建表；不是 → 普通分治就够。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：DP 像「背公式表做题」——同一道中间题只算一次，把答案写在草稿表上，后面再遇到直接翻表。<strong>失效边界<\/strong>：若子问题不重叠（每次都是全新），建表反而浪费空间，直接递归即可。\n<\/li><li>\n<strong>实例<\/strong>：钢条 n=4，价格 p=[1,5,8,9]。r₁=1，r₂=max(2·1,5)=5，r₃=max(1+r₂,5+r₁,8)=8，r₄=max(1+r₃,5+r₂,8+r₁,9)=10（切 2+2）。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为「DP 就是递归」<\/strong>——实际上朴素递归遇到重叠子问题是指数级；DP 的本质是「算一次存起来」。\n<\/li><li>\n<strong>别以为「最优子结构到处都成立」<\/strong>——实际上不是所有问题都有；比如求最短路有，求最长简单路就没有（会失效）。\n<\/li><li>\n<strong>别以为「自顶向下一定慢」<\/strong>——带备忘（memoized）的自顶向下与自底向上同阶，只是只算用到的子问题，有时更省。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n（多选）动态规划适用的两个特征是？（答案：A、C；解析：最优子结构 + 重叠子问题）\n<ul>\n<li>\nA. 最优子结构   B. 贪心选择性质   C. 重叠子问题   D. 线性可分\n<\/li><li>\n（单选）矩阵链乘法 m[i,j] 递归式中分割点 k 的取值范围是？（答案：B；解析：i≤k&lt;j）\n<\/li><li>\nA. 1≤k≤n   B. i≤k&lt;j   C. i&lt;k≤j   D. k=i 或 k=j\n<\/li><li>\n（填空）LCS 问题 X 长 m、Y 长 n，填表复杂度 O(__)。（答案：mn；解析：m×n 表）\n<\/li><li>\n（简答）钢条切割 rₙ 递归式为什么是 max(pᵢ + r_{n−i})？（答案：第一刀无论切在哪，都是「卖第一刀那段 + 剩下段的最优切割」；枚举所有切法取最大，就是最优子结构的直接体现）\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\nDP = 最优子结构 + 重叠子问题；四步走。\n<\/li><li>\n钢条切割 O(n²)；矩阵链 O(n³)；LCS O(mn)。\n<\/li><li>\n自底向上填表 vs 带备忘自顶向下。\n<\/ul>", "ch16": "<h1>第 16 章：贪心算法<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：2.5 小时 | <strong>前置<\/strong>：第 15 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说出贪心算法「每步选当前最优」与 DP 的区别。\n<\/li><li>\n用活动选择问题证明：按结束时间最早贪心选，得到最大兼容活动集。\n<\/li><li>\n用赫夫曼算法构造最优前缀码。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p><strong>当问题有「贪心选择性质」时，不必枚举所有子问题——每步选眼前最好的，全局最优自然出现。<\/strong><\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：贪心 vs 动态规划（难度：基础）<\/h3>\n<p>书页 §16 开篇：动态规划对很多优化问题是「杀鸡用牛刀」。<strong>贪心算法<\/strong>每一步都做出当时看起来最优的选择（局部最优），期望由此得到全局最优。<\/p>\n<ul><li>\nDP：每步综合所有子问题的最优解再选。\n<\/li><li>\n贪心：每步直接选当前最好的，不再回溯。\n<\/ul>\n<h3>概念 2：活动选择问题（难度：进阶）<\/h3>\n<p>n 个活动共享资源（如阶梯教室），每个活动 aᵢ 有开始 sᵢ、结束 fᵢ。选<strong>最大兼容活动集<\/strong>（互不重叠）。 <strong>贪心策略<\/strong>：把活动按<strong>结束时间 fᵢ 单调递增<\/strong>排序，然后反复选「结束最早且与已选兼
