p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[key] --&gt; B[散列函数 h(key)]\n    B --&gt; C[数组槽 h(key)]\n    C --&gt; D{槽里空吗?}\n    D --&gt;|空| E[直接放入]\n    D --&gt;|碰撞| F{怎么处理碰撞?}\n    F --&gt;|链表| G[拉链法: 槽挂链表]\n    F --&gt;|线性探测| H[开放寻址: 找下一个空槽]\n    G --&gt; I[完全散列: 二层无碰撞, 查询最坏 O(1)]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：散列的核心矛盾是「h 把大 key 空间压到小数组」；碰撞处理决定常数与最坏情况。<\/p>\n<h2>详解<\/h2>\n<ul><li>\n<strong>直接寻址<\/strong>：key 就是下标。要求 key 范围小。\n<\/li><li>\n<strong>散列表<\/strong>：用 h(key)∈[0,m) 压缩。装载因子 α=n/m。\n<\/li><li>\n<strong>碰撞处理<\/strong>：\n<ul>\n<li>\n<strong>拉链法<\/strong>：每个槽挂链表；期望查找 O(1+α)。\n<\/li><li>\n<strong>开放寻址<\/strong>：线性/二次/双重散列找下一个空槽；不挂链表。\n<\/li><li>\n<strong>散列函数<\/strong>：除法散列 h(k)=k mod m；乘法散列 h(k)=⌊m(kA mod 1)⌋；全域散列用随机函数族防恶意输入。\n<\/li><li>\n<strong>完全散列<\/strong>：二层结构，最坏 O(1) 查询。\n<\/ul>\n<\/ul>\n<p>类比：散列表像「按手机号尾号分抽屉」——尾号相同的人放同一抽屉（碰撞），抽屉里挂个名单（拉链法）。失效边界：若所有 key 都撞到同一槽，退化成链表 O(n)；全域散列就是防这种恶意。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为「散列表最坏 O(1)」——实际上最坏是 O(n)（全碰撞），O(1) 是期望。\n<\/li><li>\n别以为「开放寻址就是删元素时直接清空」——实际上删除要打「墓碑」，否则探测链断了。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>ch11<\/td><td>散列<\/td><td>期望 O(1)，全域散列防恶意<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：渐近记号、概率（附录 C）。\n<\/li><li>\n后续：缓存、字典、数据库索引。\n<\/ul>", "c06": "<h1>动态规划<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 15 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p><strong>当问题有「最优子结构」且「子问题反复重叠」时，把每个子问题的解存进表，自底向上填，避免重复算——这就是动态规划（DP）。<\/strong><\/p>\n<h2>为什么重要<\/h2>\n<p>DP 解决「看起来要穷举指数、其实子问题只有多项式个」的问题：钢条切割、矩阵链乘、最长公共子序列、最优二叉搜索树。它是算法面试和实际优化问题的常客。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[能用 DP 吗?] --&gt; B{最优子结构? 大最优含小最优}\n    B --&gt;|有| C{子问题重叠? 递归会反复用到同一小问题}\n    C --&gt;|有| D[记忆化 or 自底向上填表]\n    D --&gt; E[钢条切割/矩阵链乘/LCS/最优BST]\n    B --&gt;|无| F[分治即可, 子问题不重叠]\n    C --&gt;|无| G[直接递归即可, 不用表]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：DP 的两个适用条件缺一不可；缺「最优子结构」问题都不能拆，缺「重叠」就退化成普通分治。<\/p>\n<h2>详解<\/h2>\n<ul><li>\n<strong>四步走<\/strong>：① 刻画最优子结构；② 递归定义最优值；③ 自底向上算值；④ 构造最优解。\n<\/li><li>\n<strong>记忆化（top-down）<\/strong>：递归 + 查表；算过的子问题存起来。\n<\/li><li>\n<strong>自底向上（bottom-up）<\/strong>：按子问题规模从小到大填表。\n<\/li><li>\n<strong>经典问题<\/strong>：\n<ul>\n<li>\n钢条切割：r[n]=max_{i} (p[i]+r[n−i])。\n<\/li><li>\n矩阵链乘：m[i,j]=min_{k} (m[i,k]+m[k+1,j]+p_{i−1}p_kp_j)，O(n³)。\n<\/li><li>\nLCS：c[i,j] 按 s[i]==t[j] 分两支。\n<\/li><li>\n最优 BST：e[i,j] 类似矩阵链。\n<\/ul>\n<\/ul>\n<p>类比：DP 像「记账」——算过的子问题写在账本上，下次遇到直接查，不再重算。失效边界：若子问题不重叠（如归并排序的左右两半互不相同），DP 的表是浪费的。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为「DP 就是递归」——实际上朴素递归没有表，会指数重复；DP 的灵魂是「存子问题答案」。\n<\/li><li>\n别以为「所有最优化问题都能 DP」——实际上必须同时有最优子结构和重叠子问题。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>ch15<\/td><td>DP<\/td><td>钢条切割 O(n²)、矩阵链 O(n³)、LCS O(mn)<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：递归式与分治。\n<\/li><li>\n后续：贪心（DP 的特例优化）、最短路径（最优子结构）。\n<\/ul>", "c07": "<h1>贪心算法<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 16、23、24 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p><strong>每一步都选「当前看起来最好」的选择，不回头——当问题具有「贪心选择性质」和「最优子结构」时，这种短视反而能得到全局最优。<\/strong><\/p>\n<h2>为什么重要<\/h2>\n<p>DP 要填表、慢；贪心只要排序后线性扫描、快。活动选择、赫夫曼编码、最小生成树、Dijkstra 都是贪心——前提是先证明「当前最优不会害全局」。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[优化问题] --&gt; B{能证明贪心选择安全吗?}\n    B --&gt;|能| C[每步选当前最优, 不回头]\n    B --&gt;|不能| D[用 DP, 别用贪心]\n    C --&gt; E[活动选择: 选结束最早的]\n    C --&gt; F[赫夫曼: 合并频率最低两节点]\n    C --&gt; G[MST: 选最轻跨切口]\n    C --&gt; H[Dijkstra: 选 d 最小的顶点定死]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：贪心和 DP 共用「最优子结构」，但多了一个「贪心选择性质」——当前最优安全。<\/p>\n<h2>详解<\/h2>\n<ul><li>\n<strong>贪心选择性质<\/strong>：全局最优解可以通过「每步做局部最优选择」达到。\n<\/li><li>\n<strong>最优子结构<\/strong>：全局最优包含子问题最优（与 DP 共用）。\n<\/li><li>\n<strong>经典算法<\/strong>：\n<ul>\n<li>\n<strong>活动选择<\/strong>：每次选「结束最早」的兼容活动，O(n lg n)。\n<\/li><li>\n<strong>赫夫曼编码<\/strong>：频率最小的两节点反复合并，得到最优前缀码。\n<\/li><li>\n<strong>MST（Kruskal/Prim）<\/strong>：选最轻跨切口（见 MST 概念页）。\n<\/li><li>\n<strong>Dijkstra<\/strong>：选 d 最小的顶点定死（见最短路径概念页）。\n<\/ul>\n<\/ul>\n<p>类比：贪心像「逛超市每次拿最近的货架」——只有当「最近」永远不会让你错过更优路线时（如活动结束时间不重叠），这个短视才是全局最优。失效边界：若当前最优会锁死未来（如 0/1 背包），贪心就错了，必须 DP。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为「贪心就是『短视』所以总是错」——实际上对满足性质的问题，短视就是最优。\n<\/li><li>\n别以为「背包问题能用贪心」——实际上 0/1 背包贪心错（物品按性价比选可能不如组合），要用 DP。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>ch16<\/td><td>活动选择/赫夫曼<\/td><td>贪心选择性质<\/td><\/tr><tr><td>ch23<\/td><td>MST<\/td><td>切分性质保证贪心安全<\/td><\/tr><tr><td>ch24<\/td><td>Dijkstra<\/td><td>非负权保证「最小 d 可定死」<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：动态规划（贪心是 DP 的特例）。\n<\/li><li>\n后续：最小生成树、最短路径、近似算法。\n<\/ul>", "c08": "<h1>图搜索（BFS 与 DFS）<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 22、24、26 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p><strong>BFS 像水波纹一层层扩（队列），DFS 像走迷宫一条路走到黑（栈/递归）——两者都 O(V+E)，但给你不同的图结构信息。<\/strong><\/p>\n<h2>为什么重要<\/h2>\n<p>几乎所有图算法都是 BFS/DFS 的变体：BFS 求无权最短路、DFS 做拓扑排序和强连通分量、Dijkstra/Prim 在 BFS 骨架上换个优先队列。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[图 G=(V,E)] --&gt; B{BFS 还是 DFS?}\n    B --&gt;|BFS 队列| C[按距离层扩展]\n    C --&gt; D[无权最短路: d[s,v]=层数]\n    C --&gt; E[层次图/广度树]\n    B --&gt;|DFS 栈| F[一条路走到黑, 回溯]\n    F --&gt; G[发现时间/完成时间]\n    G --&gt; H[拓扑排序: 按完成时间逆序]\n    G --&gt; I[强连通分量: 两次 DFS]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：BFS 用「队列」保证按层；DFS 用「栈+时间戳」暴露图的前后结构（拓扑、强连通）。<\/p>\n<h2>详解<\/h2>\n<ul><li>\n<strong>BFS<\/strong>：从 s 出发，先把 s 的所有邻居入队，再逐个扩展。每个顶点首次被发现时的 d 值就是到 s 的无权最短距离。O(V+E)。\n<\/li><li>\n<strong>DFS<\/strong>：递归地沿一条路径走到死，再回溯。给每个顶点记发现时间 d 和完成时间 f。\n<\/li><li>\n<strong>拓扑排序<\/strong>：DAG 上按 DFS 完成时间 f 从大到小输出。\n<\/li><li>\n<strong>强连通分量<\/strong>：先在 G 上 DFS 得 f；再把边反转在转置图上按 f 降序 DFS，每次 DFS 树就是一个 SCC。\n<\/ul>\n<p>类比：BFS 像「广播」——信号一圈圈扩；DFS 像「翻阅家谱」——先把一支脉挖到底，再退回来翻下一支。失效边界：BFS 只能求无权最短路（或权全相等）；有权图要用 Dijkstra。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为「BFS 和 DFS 复杂度不同」——实际上都是 O(V+E)，差别在「得到的信息」。\n<\/li><li>\n别以为「拓扑排序只能 DFS」——实际上也能反复找入度为 0 的顶点（Kahn 算法）。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>ch22<\/td><td>BFS/DFS<\/td><td>O(V+E)，时间戳<\/td><\/tr><tr><td>ch22<\/td><td>拓扑/SCC<\/td><td>DFS 时间戳应用<\/td><\/tr><tr><td>ch26<\/td><td>Edmonds-Karp<\/td><td>BFS 选增广路<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：散列（标记访问）、栈/队列。\n<\/li><li>\n后续：最短路径、最大流、MST。\n<\/ul>", "c09": "<h1>最小生成树<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 23、16、21 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p><strong>在带权无向图里选 |V|−1 条边把所有顶点连起来、总权最小；切分性质保证「每次选最轻跨切口」的贪心一定对。<\/strong><\/p>\n<h2>为什么重要<\/h2>\n<p>MST 是「连通所有点且成本最小」的抽象——电路布线、网络架设、聚类都归约到它。Kruskal 与 Prim 两种贪心实现是「并查集」和「优先队列」两种数据结构的经典练兵。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[带权无向图] --&gt; B[切分性质: 最轻跨切口必在某棵 MST]\n    B --&gt; C{怎么选?}\n    C --&gt;|按权排序+并查集| D[Kruskal: O(E lg V)]\n    C --&gt;|从根长树+优先队列| E[Prim: O(E lg V), 斐波那契堆 O(E+V lg V)]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：两种算法都靠切分性质；Kruskal 全局排边，Prim 从一棵树向外长。<\/p>\n<h2>详解<\/h2>\n<ul><li>\n<strong>生成树<\/strong>：连通所有顶点、|V|−1 条边、无环。\n<\/li><li>\n<strong>切分性质（定理 23.1）<\/strong>：A 是某棵 MST 的边集、切分尊重 A，则横跨切分的最轻边对 A 安全。\n<\/li><li>\n<strong>Kruskal<\/strong>：边按权排序，用并查集判断两端是否同根，不同根就加边。\n<\/li><li>\n<strong>Prim<\/strong>：从根出发，优先队列维护「不在树的顶点到树的最短边」，每次拉最轻的进来。\n<\/ul>\n<p>类比：MST 像「修村村通公路」——每次在已通路区和未通路区之间选最便宜的一段。失效边界：MST 只保证总权最小，不保证任意两点间路径最短（那是最短路）。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为「MST 给出任意两点最短路」——实际上不保证。\n<\/li><li>\n别以为「Prim 必须从某特定点出发」——实际上任意点作根都行。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>ch23<\/td><td>Kruskal/Prim<\/td><td>切分性质 → 贪心安全<\/td><\/tr><tr><td>ch35<\/td><td>TSP 近似<\/td><td>MST 前序遍历给 2-近似<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：贪心、并查集（第 21 章）、图搜索。\n<\/li><li>\n后续：最短路径、TSP 近似。\n<\/ul>", "c10": "<h1>最短路径<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 24、25 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p><strong>所有单源最短路算法都在反复「松弛」d[u]+w(u,v)&lt;d[v]；按什么顺序松弛分出 Bellman-Ford（容负权）、DAG 拓扑序、Dijkstra（非负权）三种。<\/strong><\/p>\n<h2>为什么重要<\/h2>\n<p>地图导航、网络路由、任务调度（差分约束）都建模为最短路。理解「负权边怎么处理」「为什么 Dijkstra 能快」是图算法的分水岭。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[单源 s 到各点最短路] --&gt; B{图长什么样?}\n    B --&gt;|DAG| C[拓扑序后逐边松弛, O(V+E)]\n    B --&gt;|可含负权边| D[Bellman-Ford: 全边松弛|V|-1 轮, O(VE)]\n    B --&gt;|边权非负| E[Dijkstra: 最小 d 先定死, O(E lg V)]\n    D --&gt; F[第 V 轮仍可松弛 ⇒ 负权回路]\n    G[所有点对] --&gt; H[Floyd-Warshall O(n³)]\n    G --&gt; I[Johnson: 重赋权+跑 V 遍 Dijkstra]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：单源问题按「图结构」三选一；所有点对问题在稠密图用 Floyd，稀疏图用 Johnson。<\/p>\n<h2>详解<\/h2>\n<ul><li>\n<strong>松弛<\/strong>：d[u]+w(u,v)&lt;d[v] 就更新 d[v]、π[v]。\n<\/li><li>\n<strong>Bellman-Ford<\/strong>：O(VE)，容负权边，可检测负权回路，可解差分约束。\n<\/li><li>\n<strong>DAG 最短路<\/strong>：拓扑序松弛一次，O(V+E)。\n<\/li><li>\n<strong>Dijkstra<\/strong>：非负权，优先队列取最小 d 定死，O(E lg V)。\n<\/li><li>\n<strong>Floyd-Warshall<\/strong>：放开中转站 k，三重循环 O(n³)。\n<\/li><li>\n<strong>Johnson<\/strong>：势能 h 重赋权 w̃=w+h[u]−h[v] 洗白成非负，再跑 V 遍 Dijkstra。\n<\/ul>\n<p>类比：松弛像导航软件不断「发现更近绕行路」；Dijkstra 像「一旦给你定了主路线就不回头」——所以遇到逆行短小路会错。失效边界：Dijkstra 不容负权边；负权回路让最短路不存在。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为「有负权边就什么算法都不行」——实际上 Bellman-Ford/DAG 都能处理，只有负权回路无解。\n<\/li><li>\n别以为「重赋权会改变最短路」——实际上路径上 h 项首尾相消，最短距离关系不变。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>ch24<\/td><td>单源<\/td><td>松弛+三种算法<\/td><\/tr><tr><td>ch25<\/td><td>所有点对<\/td><td>Floyd-Warshall / Johnson<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：图搜索、优先队列（堆）。\n<\/li><li>\n后续：最大流、差分约束、TSP。\n<\/ul>", "c11": "<h1>最大流<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 26 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p><strong>在「每条管有容量、中间点守恒」的网络里，求从源 s 到汇 t 最大能压多少水；不断在残留网络找增广路挤水，直到找不到路——此时最大流 = 最小割。<\/strong><\/p>\n<h2>为什么重要<\/h2>\n<p>最大流是网络流问题的「母问题」：二分匹配、航线调度、二分图任务分配、甚至某些线性规划都能归约成最大流。它是「用图建模实际分配问题」的典范。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[流网络 G, 容量 c] --&gt; B[残留网络 G_f: 正向余量+反向退流]\n    B --&gt; C[找 s→t 增广路]\n    C --&gt;|找到| D[按瓶颈容量挤水]\n    D --&gt; B\n    C --&gt;|找不到| E[当前 f 即最大流]\n    E --&gt; F[最大流 = 最小 s-t 割容量]\n    G[二分匹配] -.-&gt;|建图| A<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：核心循环「找路→挤水→更新残留」；反向边保证算法能反悔；最大流-最小割定理给终止条件。<\/p>\n<h2>详解<\/h2>\n<ul><li>\n<strong>流<\/strong>：容量限制 0≤f(u,v)≤c(u,v)；中间点守恒（流入=流出）。\n<\/li><li>\n<strong>残留容量<\/strong> c_f(u,v)=c(u,v)−f(u,v)；反向边 c_f(v,u)=f(u,v) 用于退流。\n<\/li><li>\n<strong>Ford-Fulkerson<\/strong>：任意选增广路；Edmonds-Karp 用 BFS 选最短路径，O(VE²)。\n<\/li><li>\n<strong>最大流-最小割定理<\/strong>：找不到增广路时，|f| = 最小 s-t 割的容量。\n<\/li><li>\n<strong>Push-relabel<\/strong>：逐个顶点推送/重贴标签，O(V³)。\n<\/li><li>\n<strong>二分匹配<\/strong>：源→左部→右部→汇，边容量 1，最大流 = 最大匹配。\n<\/ul>\n<p>类比：最大流像水管网供水——每根管粗细有限，你想最大化水厂到用户的总流量；反向边像「之前接错的管可以拆了重接」。失效边界：不允许负容量；节点守恒必须满足。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为「反向边是为了加新容量」——实际上它是「撤销之前流」的账本。\n<\/li><li>\n别以为「最大流只在水管里有用」——实际上二分匹配、任务分配都靠它。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>ch26<\/td><td>Ford-Fulkerson<\/td><td>最大流=最小割<\/td><\/tr><tr><td>ch26<\/td><td>二分匹配<\/td><td>最大流归约<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：图搜索（BFS）、最短路径思想。\n<\/li><li>\n后续：线性规划（LP 是最大流的推广）。\n<\/ul>", "c12": "<h1>NP 完全性<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 34、35 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p><strong>能「猜答案并多项式验证」的问题叫 NP；其中最难的那批叫 NPC——任何 NP 问题都能多项式归约到它们；若任意一个 NPC 有多项式算法，则 P=NP（主流猜想 P≠NP）。<\/strong><\/p>\n<h2>为什么重要<\/h2>\n<p>当你遇到一个「怎么都设计不出多项式算法」的问题，先问它是不是 NPC：若是，就别再死磕精确算法，转用近似算法、启发式或指数级但实用的算法。这是「问题分类学」的实用价值。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[遇到难解问题] --&gt; B{能多项式验证答案?}\n    B --&gt;|不能| C[不属于 NP, 更难]\n    B --&gt;|能| D[能把已知 NPC 问题多项式归约到它?]\n    D --&gt;|能| E[它也是 NPC: 别磕精确算法]\n    D --&gt;|不能| F[可能在 NP-P 之间]\n    E --&gt; G[转向: 近似算法 / 启发式 / 指数但实用]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：判定路径是「先 NP 再归约」；归约是 NPC 证明的唯一钥匙。<\/p>\n<h2>详解<\/h2>\n<ul><li>\n<strong>P<\/strong>：多项式时间可解。\n<\/li><li>\n<strong>NP<\/strong>：多项式时间可验证给定答案。P⊆NP。\n<\/li><li>\n<strong>NPC<\/strong>：NP 中最难；所有 NP 问题可多项式归约到它。\n<\/li><li>\n<strong>Cook-Levin<\/strong>：SAT 是第一个 NPC；3-CNF-SAT、团、顶点覆盖、哈密顿回路、TSP、子集和都是 NPC。\n<\/li><li>\n<strong>多项式归约<\/strong>：把 A 的输入多项式变换成 B 的输入，A 的答案从 B 的答案读出。\n<\/li><li>\n<strong>P=NP?<\/strong>：未决；主流猜想不等。\n<\/ul>\n<p>类比：NPC 像「难题俱乐部」——入门条件是「能把任意 NP 难题翻译成你的问题」。SAT 是第一个会员。失效边界：归约必须多项式时间且等价；指数放大不算。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为「NP = 非多项式」——实际上 NP = Nondeterministic Polynomial（猜+验证）。\n<\/li><li>\n别以为「NPC 证明要设计多项式算法」——实际上是反过来证明它难。\n<\/li><li>\n别以为「P=NP 已被证伪」——实际上未决。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>ch34<\/td><td>P/NP/NPC<\/td><td>归约与 Cook-Levin<\/td><\/tr><tr><td>ch35<\/td><td>近似算法<\/td><td>NPC 问题退而求其次的质量保证<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：渐近记号（多项式定义）。\n<\/li><li>\n后续：近似算法（ρ 近似比）。\n<\/ul>", "__path__": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：算法入门<\/strong><br>阅读：<a href=\"#/chapter/ch01\">第 1 章：算法在计算中的作用<\/a><br>检查点：通过该章自测题（≥80%）<\/li><li class='path-step' id='path-02'><strong>步骤 02：算法基础与归并<\/strong><br>阅读：<a href=\"#/chapter/ch02\">第 2 章：算法基础<\/a><br>检查点：通过该章自测题（≥80%）<\/li><li class= s='quiz-item' data-qid='q034' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 证明新问题是 NPC 靠什么？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q034' value='0'> 设计多项式算法<\/label><label class='quiz-opt'><input type='radio' name='q034' value='1'> 多项式时间归约<\/label><label class='quiz-opt'><input type='radio' name='q034' value='2'> 随机化<\/label><label class='quiz-opt'><input type='radio' name='q034' value='3'> 排序<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch35__": "<h1>测验：第 35 章：近似算法<\/h1><div class='quiz-item' data-qid='q035' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 顶点覆盖 2-近似算法的近似比是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q035' value='0'> 1<\/label><label class='quiz-opt'><input type='radio' name='q035' value='1'> 2<\/label><label class='quiz-opt'><input type='radio' name='q035' value='2'> lg n<\/label><label class='quiz-opt'><input type='radio' name='q035' value='3'> n<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch36__": "<h1>测验：附录 A：求和<\/h1><div class='quiz-item' data-qid='q036' data-type='single'><p class='quiz-q'><b>Q1.<\/b> Σ_{k=1}^{n} k 的渐近阶是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q036' value='0'> Θ(n)<\/label><label class='quiz-opt'><input type='radio' name='q036' value='1'> Θ(n²)<\/label><label class='quiz-opt'><input type='radio' name='q036' value='2'> Θ(n³)<\/label><label class='quiz-opt'><input type='radio' name='q036' value='3'> Θ(lg n)<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch37__": "<h1>测验：附录 B：集合、关系、函数、图、树<\/h1><div class='quiz-item' data-qid='q037' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 自反+对称+传递的关系叫？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q037' value='0'> 偏序<\/label><label class='quiz-opt'><input type='radio' name='q037' value='1'> 等价关系<\/label><label class='quiz-opt'><input type='radio' name='q037' value='2'> 函数<\/label><label class='quiz-opt'><input type='radio' name='q037' value='3'> 空关系<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch38__": "<h1>测验：附录 C：计数与概率<\/h1><div class='quiz-item' data-qid='q038' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 期望线性 E[X+Y]=E[X]+E[Y] 要求什么？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q038' value='0'> X、Y 独立<\/label><label class='quiz-opt'><input type='radio' name='q038' value='1'> 无要求<\/label><label class='quiz-opt'><input type='radio' name='q038' value='2'> X、Y 同分布<\/label><label class='quiz-opt'><input type='radio' name='q038' value='3'> X、Y 不相关<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch39__": "<h1>测验：附录 D：矩阵<\/h1><div class='quiz-item' data-qid='q039' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 矩阵 A 可逆当且仅当？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q039' value='0'> A=Aᵀ<\/label><label class='quiz-opt'><input type='radio' name='q039' value='1'> det(A)≠0<\/label><label class='quiz-opt'><input type='radio' name='q039' value='2'> A 全为正<\/label><label class='quiz-opt'><input type='radio' name='q039' value='3'> A 是 3×3<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__cards__": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "__glossary__": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='算法'>算法 — 把输入映射到输出的确定性指令序列 <span class=glossary-ref>（第 1 章：算法在计算中的作用）<\/span><\/li><li data-term='θ/o/ω'>Θ/O/Ω — 渐近精确阶/上界/下界 <span class=glossary-ref>（第 3 章：函数的增长）<\/span><\/li><li data-term='主方法'>主方法 — 给 T(n)=aT(n/b)+f(n) 定阶的三情况表 <span class=glossary-ref>（第 4 章：分治策略）<\/span><\/li><li data-term='分治'>分治 — 切分子问题、递归解、合并 <span class=glossary-ref>（第 4 章：分治策略）<\/span><\/li><li data-term='指示器随机变量'>指示器随机变量 — 取值 0/1 的随机变量，用于算期望 <span class=glossary-ref>（第 5 章：概率分析和随机算法）<\/span><\/li><li data-term='堆'>堆 — 父键≥子键的完全二叉树数组 <span class=glossary-ref>（第 6 章：堆排序）<\/span><\/li><li data-term='优先队列'>优先队列 — 支持取最大/最小的队列 <span class=glossary-ref>（第 6 章：堆排序）<\/span><\/li><li data-term='计数排序'>计数排序 — 用计数桶的线性时间排序 <span class=glossary-ref>（第 8 章：线性时间排序）<\/span><\/li><li data-term='栈'>栈 — 后进先出 LIFO <span class=glossary-ref>（第 10 章：基本数据结构）<\/span><\/li><li data-term='队列'>队列 — 先进先出 FIFO <span class=glossary-ref>（第 10 章：基本数据结构）<\/span><\/li><li data-term='散列函数'>散列函数 — 把 key 映射到数组下标的函数 <span class=glossary-ref>（第 11 章：散列表）<\/span><\/li><li data-term='碰撞'>碰撞 — 不同 key 映到同一槽 <span class=glossary-ref>（第 11 章：散列表）<\/span><\/li><li data-term='装载因子'>装载因子 — 元素数/槽数 <span class=glossary-ref>（第 11 章：散列表）<\/span><\/li><li data-term='二叉搜索树'>二叉搜索树 — 左&lt;根&lt;右的二叉树 <span class=glossary-ref>（第 12 章：二叉搜索树）<\/span><\/li><li data-term='红黑树'>红黑树 — 5 条性质保平衡的 BST <span class=glossary-ref>（第 13 章：红黑树）<\/span><\/li><li data-term='旋转'>旋转 — 调整树结构保平衡的操作 <span class=glossary-ref>（第 13 章：红黑树）<\/span><\/li><li data-term='最优子结构'>最优子结构 — 全局最优含子问题最优 <span class=glossary-ref>（第 15 章：动态规划）<\/span><\/li><li data-term='重叠子问题'>重叠子问题 — 递归反复用到同一小问题 <span class=glossary-ref>（第 15 章：动态规划）<\/span><\/li><li data-term='动态规划'>动态规划 — 存子问题答案自底向上填表 <span class=glossary-ref>（第 15 章：动态规划）<\/span><\/li><li data-term='贪心选择性质'>贪心选择性质 — 局部最优可推全局最优 <span class=glossary-ref>（第 16 章：贪心算法）<\/span><\/li><li data-term='摊还分析'>摊还分析 — 一整段操作的平均代价 <span class=glossary-ref>（第 17 章：摊还分析）<\/span><\/li><li data-term='b 树'>B 树 — 多路平衡查找树，磁盘友好 <span class=glossary-ref>（第 18 章：B 树）<\/span><\/li><li data-term='斐波那契堆'>斐波那契堆 — 松弛堆，decrease-key 均摊 O(1) <span class=glossary-ref>（第 19 章：斐波那契堆）<\/span><\/li><li data-term='并查集'>并查集 — 支持 UNION/FIND-SET 的结构 <span class=glossary-ref>（第 21 章：用于不相交集合的数据结构）<\/span><\/li><li data-term='路径压缩'>路径压缩 — 查找时把节点直接挂到根 <span class=glossary-ref>（第 21 章：用于不相交集合的数据结构）<\/span><\/li><li data-term='按秩合并'>按秩合并 — 把矮树挂到高树根下 <span class=glossary-ref>（第 21 章：用于不相交集合的数据结构）<\/span><\/li><li data-term='bfs'>BFS — 广度优先，队列按层扩 <span class=glossary-ref>（第 22 章：基本的图算法）<\/span><\/li><li data-term='dfs'>DFS — 深度优先，栈一条路走到底 <span class=glossary-ref>（第 22 章：基本的图算法）<\/span><\/li><li data-term='拓扑排序'>拓扑排序 — DAG 顶点按完成时间逆序 <span class=glossary-ref>（第 22 章：基本的图算法）<\/span><\/li><li data-term='强连通分量'>强连通分量 — 互相可达的最大顶点集 <span class=glossary-ref>（第 22 章：基本的图算法）<\/span><\/li><li data-term='生成树'>生成树 — 连通所有顶点的无环边集 <span class=glossary-ref>（第 23 章：最小生成树）<\/span><\/li><li data-term='切分'>切分 — 把 V 分成 S 与 V−S <span class=glossary-ref>（第 23 章：最小生成树）<\/span><\/li><li data-term='松弛'>松弛 — d[u]+w(u,v)&lt;d[v] 就更新 <span class=glossary-ref>（第 24 章：单源最短路径）<\/span><\/li><li data-term='负权回路'>负权回路 — 总权为负的环，最短路不存在 <span class=glossary-ref>（第 24 章：单源最短路径）<\/span><\/li><li data-term='残留网络'>残留网络 — 还能前进+可退流的图 <span class=glossary-ref>（第 26 章：最大流）<\/span><\/li><li data-term='增广路'>增广路 — 残留网络中 s→t 路径 <span class=glossary-ref>（第 26 章：最大流）<\/span><\/li><li data-term='最大流-最小割'>最大流-最小割 — 最大流值=最小 s-t 割容量 <span class=glossary-ref>（第 26 章：最大流）<\/span><\/li><li data-term='工作量 t₁'>工作量 T₁ — 并行算法全部指令之和 <span class=glossary-ref>（第 27 章：多线程算法）<\/span><\/li><li data-term='持续时间 t∞'>持续时间 T∞ — 关键路径长度 <span class=glossary-ref>（第 27 章：多线程算法）<\/span><\/li><li data-term='lup 分解'>LUP 分解 — PA=LU 三角分解 <span class=glossary-ref>（第 28 章：矩阵运算）<\/span><\/li><li data-term='选主元'>选主元 — 换行把最大绝对值换到主元位 <span class=glossary-ref>（第 28 章：矩阵运算）<\/span><\/li><li data-term='对称正定矩阵'>对称正定矩阵 — A=Aᵀ 且 xᵀAx&gt;0 <span class=glossary-ref>（第 28 章：矩阵运算）<\/span><\/li><li data-term='标准型 lp'>标准型 LP — max cᵀx, Ax≤b, x≥0 <span class=glossary-ref>（第 29 章：线性规划）<\/span><\/li><li data-term='单纯形法'>单纯形法 — 沿可行域顶点爬坡 <span class=glossary-ref>（第 29 章：线性规划）<\/span><\/li><li data-term='对偶'>对偶 — LP 的配对问题，最优值相等 <span class=glossary-ref>（第 29 章：线性规划）<\/span><\/li><li data-term='dft/fft'>DFT/FFT — 离散傅里叶变换/快速算法 <span class=glossary-ref>（第 30 章：多项式与快速傅里叶变换）<\/span><\/li><li data-term='欧几里得算法'>欧几里得算法 — 辗转相除求 gcd <span class=glossary-ref>（第 31 章：数论算法）<\/span><\/li><li data-term='模逆元'>模逆元 — ax≡1 mod n 的 x <span class=glossary-ref>（第 31 章：数论算法）<\/span><\/li><li data-term='反复平方'>反复平方 — O(lg b) 算 aᵇ mod n <span class=glossary-ref>（第 31 章：数论算法）<\/span><\/li><li data-term='rsa'>RSA — 大素数公钥加密 <span class=glossary-ref>（第 31 章：数论算法）<\/span><\/li><li data-term='前缀函数 π'>前缀函数 π — KMP 中前 q 字符的最长真前后缀 <span class=glossary-ref>（第 32 章：字符串匹配）<\/span><\/li><li data-term='rabin-karp'>Rabin-Karp — 滚动哈希字符串匹配 <span class=glossary-ref>（第 32 章：字符串匹配）<\/span><\/li><li data-term='叉积'>叉积 — x₁y₂−x₂y₁，符号表转向 <span class=glossary-ref>（第 33 章：计算几何学）<\/span><\/li><li data-term='凸包'>凸包 — 包住所有点的最小凸多边形 <span class=glossary-ref>（第 33 章：计算几何学）<\/span><\/li><li data-term='p'>P — 多项式时间可解类 <span class=glossary-ref>（第 34 章：NP 完全性）<\/span><\/li><li data-term='np'>NP — 多项式时间可验证答案类 <span class=glossary-ref>（第 34 章：NP 完全性）<\/span><\/li><li data-term='npc'>NPC — NP 中最难，所有 NP 可归约到它 <span class=glossary-ref>（第 34 章：NP 完全性）<\/span><\/li><li data-term='多项式归约'>多项式归约 — A 输入多项式变 B 输入 <span class=glossary-ref>（第 34 章：NP 完全性）<\/span><\/li><li data-term='cook-levin'>Cook-Levin — SAT 是首个 NPC 证明 <span class=glossary-ref>（第 34 章：NP 完全性）<\/span><\/li><li data-term='近似比 ρ'>近似比 ρ — 算法解/最优解的最坏比值 <span class=glossary-ref>（第 35 章：近似算法）<\/span><\/li><li data-term='fptas'>FPTAS — 完全多项式近似方案 <span class=glossary-ref>（第 35 章：近似算法）<\/span><\/li><li data-term='等比级数'>等比级数 — Σ xᵏ 求和公式 <span class=glossary-ref>（附录 A：求和）<\/span><\/li><li data-term='等价关系'>等价关系 — 自反+对称+传递 <span class=glossary-ref>（附录 B：集合、关系、函数、图、树）<\/span><\/li><li data-term='双射'>双射 — 既单又满的函数 <span class=glossary-ref>（附录 B：集合、关系、函数、图、树）<\/span><\/li><li data-term='二项分布'>二项分布 — n 次伯努利成功 k 次 <span class=glossary-ref>（附录 C：计数与概率）<\/span><\/li><li data-term='期望线性'>期望线性 — E[aX+bY]=aE[X]+bE[Y] <span class=glossary-ref>（附录 C：计数与概率）<\/span><\/li><li data-term='行列式'>行列式 — 可逆当且仅当 det≠0 <span class=glossary-ref>（附录 D：矩阵）<\/span><\/li><\/ul>", "__patterns__": "<h1>模式与框架库<\/h1>\n<h2>框架：算法分析四步<\/h2>\n<ol><li>\n<strong>写递归式<\/strong>：把算法写成 T(n)=aT(n/b)+f(n) 或直接计数操作。\n<\/li><li>\n<strong>定渐近阶<\/strong>：用主方法/递归树/积分夹逼给出 Θ/O。\n<\/li><li>\n<strong>看最坏与期望<\/strong>：区分 worst-case 与 average-case（快排是典型）。\n<\/li><li>\n<strong>找常数与实现<\/strong>：渐近阶相同时常数决定谁更快（如快排 vs 归并）。\n<\/ol>\n<h2>框架：设计算法三范式<\/h2>\n<ul><li>\n<strong>分治<\/strong>：子问题不重叠 → 递归+合并。\n<\/li><li>\n<strong>动态规划<\/strong>：子问题重叠 + 最优子结构 → 填表。\n<\/li><li>\n<strong>贪心<\/strong>：再叠加「贪心选择性质」→ 每步选当前最优不回头。\n<\/ul>\n<h2>决策规则<\/h2>\n<h3>该用哪个排序？<\/h3>\n<ul><li>\n数据小、基本有序：插入排序。\n<\/li><li>\n通用、内存够：快排（期望 O(n lg n)）。\n<\/li><li>\n要求稳定且最坏 O(n lg n)：归并排序。\n<\/li><li>\n数据在 [0,k] 范围：计数/基数排序 O(n+k)。\n<\/li><li>\n需要实时取最大/最小：堆排序/优先队列。\n<\/ul>\n<h3>该用哪个最短路？<\/h3>\n<ul><li>\n边权非负：Dijkstra O(E lg V)。\n<\/li><li>\n可含负权边：Bellman-Ford O(VE)。\n<\/li><li>\nDAG：拓扑序松弛 O(V+E)。\n<\/li><li>\n所有点对：稠密图 Floyd-Warshall O(n³)；稀疏图 Johnson。\n<\/ul>\n<h3>问题是 NPC 怎么办？<\/h3>\n<ol><li>\n先确认是否真在 NP 内。\n<\/li><li>\n找已知 NPC 问题做多项式归约。\n<\/li><li>\n若确认 NPC：放弃精确多项式，转向近似算法（证明 ρ）、启发式、或指数级但实用（分支定界）。\n<\/ol>\n<h2>反模式<\/h2>\n<h3>反模式 1：把「平均情况」当「最坏情况」<\/h3>\n<p>快排平均 O(n lg n)，但最坏 O(n²)（已排序输入+选首元素为枢轴）。<strong>替代<\/strong>：随机化选枢轴，把最坏变成概率意义上的小概率事件。<\/p>\n<h3>反模式 2：用朴素递归不存子问题<\/h3>\n<p>写 Fibonacci 递归 f(n)=f(n−1)+f(n−2) 是指数的；<strong>替代<\/strong>：记忆化或自底向上 DP 表，O(n)。<\/p>\n<h3>反模式 3：Dijkstra 用在负权边图上<\/h3>\n<p>「先定死最小 d」在负权边图上会被后续负权边推翻。<strong>替代<\/strong>：负权边用 Bellman-Ford；负权回路不存在最短路。<\/p>\n<h3>反模式 4：忽略摊还分析被单次最坏吓到<\/h3>\n<p>动态表单次扩张 Θ(n)，但均摊 O(1)。<strong>替代<\/strong>：看一整段操作的总成本，而不是单次峰值。<\/p>\n<h3>反模式 5：归约时放大输入规模<\/h3>\n<p>NPC 证明中把 A 输入指数变换成 B 输入，不算多项式归约。<strong>替代<\/strong>：保证变换是多项式时间且等价。<\/p>\n<h3>反模式 6：把 NPC 问题硬磕精确多项式<\/h3>\n<p>找不到就怀疑自己。<strong>替代<\/strong>：先查它是不是已知 NPC（SAT/团/顶点覆盖/哈密顿/TSP/子集和），若是就走近似或指数路线。<\/p>", "__cheatsheet__": "<h1>速查表<\/h1>\n<h2>算法复杂度速查<\/h2>\n<table><thead><tr><th>算法<\/th><th>最坏<\/th><th>期望<\/th><th>备注<\/th><\/tr><\/thead><tbody><tr><td>插入排序<\/td><td>Θ(n²)<\/td><td>—<\/td><td>小数据/基本有序快<\/td><\/tr><tr><td>归并排序<\/td><td>Θ(n lg n)<\/td><td>—<\/td><td>稳定，需 O(n) 额外空间<\/td><\/tr><tr><td>堆排序<\/td><td>O(n lg n)<\/td><td>—<\/td><td>原地，不稳定<\/td><\/tr><tr><td>快速排序<\/td><td>Θ(n²)<\/td><td>Θ(n lg n)<\/td><td>随机化枢轴<\/td><\/tr><tr><td>计数排序<\/td><td>O(n+k)<\/td><td>—<\/td><td>数据范围 [0,k]<\/td><\/tr><tr><td>基数排序<\/td><td>O(d(n+k))<\/td><td>—<\/td><td>d 位、每位 [0,k]<\/td><\/tr><tr><td>顺序统计(最坏线性)<\/td><td>Θ(n)<\/td><td>—<\/td><td>BFPRT 选中位数<\/td><\/tr><tr><td>BFS / DFS<\/td><td>O(V+E)<\/td><td>—<\/td><td>—<\/td><\/tr><tr><td>拓扑排序<\/td><td>O(V+E)<\/td><td>—<\/td><td>DAG<\/td><\/tr><tr><td>Kruskal<\/td><td>O(E lg V)<\/td><td>—<\/td><td>并查集<\/td><\/tr><tr><td>Prim (二叉堆)<\/td><td>O(E lg V)<\/td><td>—<\/td><td>斐波那契堆 O(E+V lg V)<\/td><\/tr><tr><td>Bellman-Ford<\/td><td>O(VE)<\/td><td>—<\/td><td>容负权边<\/td><\/tr><tr><td>Dijkstra<\/td><td>O(E lg V)<\/td><td>—<\/td><td>不容负权边<\/td><\/tr><tr><td>Floyd-Warshall<\/td><td>Θ(n³)<\/td><td>—<\/td><td>所有点对<\/td><\/tr><tr><td>Johnson<\/td><td>O(V² lg V+VE)<\/td><td>—<\/td><td>稀疏图+负权边<\/td><\/tr><tr><td>Edmonds-Karp<\/td><td>O(VE²)<\/td><td>—<\/td><td>BFS 增广<\/td><\/tr><tr><td>Push-relabel<\/td><td>O(V³)<\/td><td>—<\/td><td>前置重贴标签<\/td><\/tr><\/tbody><\/table>\n<h2>主方法三情况（T(n)=aT(n/b)+f(n)）<\/h2>\n<table><thead><tr><th>情况<\/th><th>条件<\/th><th>解<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>f(n)=O(n^{log_b a−ε})<\/td><td>Θ(n^{log_b a})<\/td><\/tr><tr><td>2<\/td><td>f(n)=Θ(n^{log_b a})<\/td><td>Θ(n^{log_b a}·lg n)<\/td><\/tr><tr><td>3<\/td><td>f(n)=Ω(n^{log_b a+ε}) 且正则<\/td><td>Θ(f(n))<\/td><\/tr><\/tbody><\/table>\n<h2>常用求和<\/h2>\n<table><thead><tr><th>求和<\/th><th>结果<\/th><\/tr><\/thead><tbody><tr><td>Σ_{k=1}^{n} k<\/td><td>n(n+1)/2 = Θ(n²)<\/td><\/tr><tr><td>Σ_{k=1}^{n} k²<\/td><td>n(n+1)(2n+1)/6 = Θ(n³)<\/td><\/tr><tr><td>Σ_{k=0}^{n} xᵏ (x≠1)<\/td><td>(x^{n+1}−1)/(x−1)<\/td><\/tr><tr><td>Σ_{k=0}^{∞} xᵏ (\\<\/td><td>x\\<\/td><td>&lt;1)<\/td><td>1/(1−x)<\/td><\/tr><tr><td>Hₙ = Σ1/k<\/td><td>Θ(lg n)<\/td><\/tr><\/tbody><\/table>\n<h2>数据结构操作复杂度<\/h2>\n<table><thead><tr><th>结构<\/th><th>查找<\/th><th>插入<\/th><th>删除<\/th><\/tr><\/thead><tbody><tr><td>有序数组<\/td><td>O(lg n)<\/td><td>O(n)<\/td><td>O(n)<\/td><\/tr><tr><td>链表<\/td><td>O(n)<\/td><td>O(1)<\/td><td>O(1)（给定结点）<\/td><\/tr><tr><td>散列表<\/td><td>期望 O(1)<\/td><td>期望 O(1)<\/td><td>期望 O(1)<\/td><\/tr><tr><td>二叉搜索树<\/td><td>O(n) 最坏<\/td><td>O(n)<\/td><td>O(n)<\/td><\/tr><tr><td>红黑树<\/td><td>O(lg n)<\/td><td>O(lg n)<\/td><td>O(lg n)<\/td><\/tr><tr><td>B 树<\/td><td>O(lg n) I/O<\/td><td>O(lg n)<\/td><td>O(lg n)<\/td><\/tr><tr><td>斐波那契堆<\/td><td>—<\/td><td>均摊 O(1)<\/td><td>均摊 O(lg n)<\/td><\/tr><tr><td>并查集<\/td><td>近似 O(α(n))<\/td><td>—<\/td><td>—<\/td><\/tr><\/tbody><\/table>\n<h2>数论工具<\/h2>\n<table><thead><tr><th>工具<\/th><th>结论<\/th><\/tr><\/thead><tbody><tr><td>gcd(a,b)<\/td><td>欧几里得 gcd(b, a mod b)，O(lg a)<\/td><\/tr><tr><td>模逆元<\/td><td>扩展欧几里得求 ax+by=gcd，gcd=1 时 x 即逆元<\/td><\/tr><tr><td>快速幂<\/td><td>aᵇ mod n，O(lg b) 次模乘<\/td><\/tr><tr><td>CRT<\/td><td>n=∏nᵢ 互素 ⇔ 模 n 与模各 nᵢ 一一对应<\/td><\/tr><tr><td>RSA<\/td><td>公钥 (e,n) 加密 mᵉ；私钥 d 解密 cᵈ<\/td><\/tr><\/tbody><\/table>\n<h2>NPC 经典问题清单<\/h2>\n<p>SAT → 3-CNF-SAT → 团 / 顶点覆盖 / 哈密顿回路 / TSP（判定）/ 子集和。<\/p>"}};
const pages = DATA.rendered;
const manifest = DATA.manifest;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SLUG = manifest.slug || 'book';
const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem(SLUG+':'+k)||'null') }catch(e){ return null } },
  set(k,v){ try{ localStorage.setItem(SLUG+':'+k, JSON.stringify(v)) }catch(e){} }
};
let state = { visited: store.get('visited')||[], quiz: store.get('quiz')||{}, cards: store.get('cards')||{} };

/* ---------- 导航 ---------- */
function renderNav(){
  const nav = $('#nav'); nav.innerHTML='';
  const build = items => items.forEach(it=>{
    if(it.children){
      const sec=document.createElement('div'); sec.className='nav-sec'; sec.textContent=it.label; nav.appendChild(sec);
      it.children.forEach(c=>{
        const a=document.createElement('a'); a.className='nav-item'; a.href=c.href; a.textContent=c.label;
        const id=routeId(c.href);
        if(state.visited.includes(id)) a.innerHTML = esc(c.label)+' <span class="done">✓</span>';
        nav.appendChild(a);
      });
    }else{
      const a=document.createElement('a'); a.className='nav-item'; a.href=it.href; a.textContent=it.label;
      const id=routeId(it.href);
      if(state.visited.includes(id)) a.innerHTML = esc(it.label)+' <span class="done">✓</span>';
      nav.appendChild(a);
    }
  });
  build(DATA.nav);
  updateProgress();
}
function routeId(href){ return href.replace('#/',''); }

/* ---------- 路由 ---------- */
function routeIdFromHash(){
  let h = location.hash.replace(/^#\//,'');
  if(!h) return 'path';
  if(h==='path') return 'path';
  const m = h.match(/^(chapter|concept)\/(.+)$/);
  if(m) return m[1]+'/'+m[2];
  return h; // quiz/all, quiz/ch01, cards, glossary, patterns, cheatsheet
}
function showPage(rid){
  const id = rid==='path' ? '__path__' : rid.startsWith('quiz/') ? '__quiz_'+rid.split('/')[1]+'__' : rid==='cards'?'__cards__':rid==='glossary'?'__glossary__':rid==='patterns'?'__patterns__':rid==='cheatsheet'?'__cheatsheet__':rid.startsWith('chapter/')?rid.split('/')[1]:rid.startsWith('concept/')?rid.split('/')[1]:rid;
  const html = pages[id] || '<div class="empty">页面不存在</div>';
  $('#view').innerHTML = html;
  document.querySelectorAll('.nav-item').forEach(a=>a.classList.toggle('active', routeId(a.getAttribute('href'))===rid));
  if(!state.visited.includes(rid) && (rid.startsWith('chapter/')||rid.startsWith('concept/'))){
    state.visited.push(rid); store.set('visited', state.visited); renderNav();
  }
  window.scrollTo(0,0);
  if(rid==='cards') initCards();
  if(rid==='glossary') initGlossary();
  if(rid.startsWith('quiz')) initQuizzes(rid);
  if(id==='__path__') updatePath();
  renderMermaid();
}

/* ---------- 进度 ---------- */
function updateProgress(){
  const chs = (manifest.chapters||[]).length;
  const done = (manifest.chapters||[]).filter(c=>state.visited.includes('chapter/'+c.id)).length;
  const pct = chs? Math.round(done/chs*100) : 0;
  $('#progress-fill').style.width = pct+'%';
  $('#progress-label').textContent = `进度 ${pct}% · 已学 ${done}/${chs} 章`;
}
function updatePath(){
  document.querySelectorAll('.path-step').forEach(el=>{
    const step = el.id.replace('path-','');
    const s = (manifest.learningPath||[]).find(x=>x.step===step);
    if(s && (s.chapterIds||[]).every(c=>state.visited.includes('chapter/'+c))){
      el.classList.add('passed');
      const lbl = el.querySelector('.checkpoint-ok'); if(!lbl){ const sp=document.createElement('span'); sp.className='done'; sp.textContent=' ✓ 已完成'; el.appendChild(sp); }
    }
  });
}

/* ---------- 测验 ---------- */
function initQuizzes(rid){
  document.querySelectorAll('.quiz-item').forEach(item=>{
    const btn = item.querySelector('.quiz-check');
    if(!btn || item.dataset.inited){ return }
    item.dataset.inited='1';
    btn.addEventListener('click', ()=>{
      const qid = item.dataset.qid; const type = item.dataset.type;
      const q = (manifest.quizzes||[]).find(x=>x.id===qid); if(!q) return;
      let user, correct=false, fb;
      if(type==='single'){
        const sel = item.querySelector('input:checked');
        user = sel? parseInt(sel.value) : null;
        correct = user===q.answer;
        fb = correct?'✓ 正确':'✗ 错误'+(user==null?'（未作答）':'');
      } else if(type==='multi'){
        user = Array.from(item.querySelectorAll('input:checked')).map(i=>parseInt(i.value)).sort();
        const ans = Array.isArray(q.answer)? q.answer.slice().sort(): [q.answer];
        correct = user.length>0 && JSON.stringify(user)===JSON.stringify(ans);
        fb = correct?'✓ 正确':'✗ 错误';
      } else if(type==='blank'){
        const v = (item.querySelector('.quiz-blank').value||'').trim().toLowerCase();
        const a = String(q.answer).trim().toLowerCase();
        correct = v===a;
        fb = correct?'✓ 正确':'✗ 错误'+(v?'':'（未作答）');
      }
      item.querySelectorAll('input:checked').forEach(i=>{
        const val=parseInt(i.value);
        if(Array.isArray(q.answer)? q.answer.includes(val) : val===q.answer) i.parentElement.style.color='var(--ok)';
        else i.parentElement.style.color='var(--bad)';
      });
      const feed = item.querySelector('.quiz-feedback');
      feed.className = 'quiz-feedback '+(correct?'fb-ok':'fb-bad');
      feed.textContent = fb;
      let ex = item.querySelector('.quiz-explain');
      if(!ex){ ex=document.createElement('div'); ex.className='quiz-explain'; item.appendChild(ex); }
      ex.innerHTML = '解析：' + esc(q.explain||'');
      // 记录成绩（按章聚合）
      const ch = q.chapterId||'__all__';
      if(!state.quiz[ch]) state.quiz[ch]={done:0,total:0};
      state.quiz[ch].done = Math.min(state.quiz[ch].total+1, state.quiz[ch].done+1);
      state.quiz[ch].total += 1;
      store.set('quiz', state.quiz);
    });
  });
}

/* ---------- 抽认卡 ---------- */
let cardIdx = 0, cardList = [];
function initCards(){
  const cards = manifest.flashcards||[];
  cardList = cards.slice();
  cardIdx = 0;
  const sel = $('#card-filter');
  sel.innerHTML = '<option value="">全部</option>';
  [...new Set(cards.map(c=>c.chapterId).filter(Boolean))].forEach(c=>{
    const o=document.createElement('option'); o.value=c; o.textContent=manifestChTitle(c); sel.appendChild(o);
  });
  sel.onchange = ()=>{ const v=sel.value; cardList = v? cards.filter(c=>c.chapterId===v): cards.slice(); cardIdx=0; showCard(); };
  $('#flashcard').onclick = ()=>$('#flashcard').classList.toggle('flip');
  $('#card-known-btn').onclick = ()=>{ markCard(true); };
  $('#card-again-btn').onclick = ()=>{ markCard(false); };
  showCard();
}
function showCard(){
  updateCardCounts();
  if(cardIdx>=cardList.length){ $('#card-stage').innerHTML='<div class="empty">本组卡片已全部复习完 🎉</div>'; return; }
  const c = cardList[cardIdx];
  document.querySelector('.fc-front').textContent = c.front;
  document.querySelector('.fc-back').textContent = c.back;
  $('#flashcard').classList.remove('flip');
}
function markCard(known){
  const c = cardList[cardIdx]; if(!c) return;
  state.cards[c.id] = known?'known':'again';
  store.set('cards', state.cards);
  cardIdx++; showCard();
}
function updateCardCounts(){
  const known = Object.values(state.cards).filter(v=>v==='known').length;
  const again = Object.values(state.cards).filter(v=>v==='again').length;
  $('#card-known').textContent = known;
  $('#card-again').textContent = again;
  $('#card-left').textContent = Math.max(0, cardList.length-cardIdx);
}
function manifestChTitle(id){
  const c=(manifest.chapters||[]).find(x=>x.id===id); return c? c.title : id;
}

/* ---------- 术语表 ---------- */
function initGlossary(){
  const input = $('#glossary-filter');
  if(!input || input.dataset.inited) return;
  input.dataset.inited='1';
  input.oninput = ()=>{
    const v = input.value.trim().toLowerCase();
    document.querySelectorAll('#glossary-list li').forEach(li=>{
      li.style.display = (!v || li.dataset.term.includes(v)) ? '' : 'none';
    });
  };
}

/* ---------- 搜索 ---------- */
let searchIndex = null;
function buildSearchIndex(){
  if(searchIndex) return searchIndex;
  searchIndex = [];
  Object.entries(pages).forEach(([id, htmlText])=>{
    if(id.startsWith('__')) return;
    const text = htmlText.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ');
    searchIndex.push({id, text});
  });
  return searchIndex;
}
$('#q').addEventListener('input', e=>{
  const v = e.target.value.trim().toLowerCase();
  if(!v){ showPage(routeIdFromHash()); return; }
  buildSearchIndex();
  const hits = searchIndex.filter(p=>p.text.toLowerCase().includes(v)).slice(0,20);
  const label = id => id.startsWith('chapter/')? ('章节：'+manifestChTitle(id.split('/')[1])) : id.startsWith('concept/')? ('概念：'+id.split('/')[1]) : id;
  $('#view').innerHTML = '<h1>搜索结果：'+esc(v)+'</h1>' +
    (hits.length? hits.map(h=>`<div class="search-hit"><a href="#/${h.id}">${esc(label(h.id))}</a><br><span class="sub">${esc(h.text.slice(0,180))}</span></div>`).join('')
                 : '<div class="empty">未找到相关页面，试试章节名/概念名/术语。</div>');
});

/* ---------- Mermaid 懒加载（联网渲染，离线显示源码） ---------- */
function renderMermaid(){
  if(!document.querySelector('.mermaid')) return;
  const s=document.createElement('script');
  s.src='https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js';
  s.onload=()=>{ try{
    mermaid.initialize({startOnLoad:false, theme: matchMedia('(prefers-color-scheme: dark)').matches?'dark':'default'});
    document.querySelectorAll('.mermaid').forEach(el=>{
      const code=el.textContent;
      mermaid.render('mm'+Math.random().toString(36).slice(2), code)
        .then(({svg})=>{ el.innerHTML=svg; })
        .catch(()=>{ el.textContent=code; });
    });
  }catch(e){} };
  document.head.appendChild(s);
}

/* ---------- 深色模式 ---------- */
const themeBtn=$('#theme-btn');
themeBtn.onclick=()=>{
  const d = document.body.dataset.theme==='dark';
  document.body.dataset.theme = d? '' : 'dark';
  themeBtn.textContent = d? '🌙 深色' : '☀️ 浅色';
};

/* ---------- 启动 ---------- */
renderNav();
window.addEventListener('hashchange', ()=>showPage(routeIdFromHash()));
showPage(routeIdFromHash());
</script>
