iz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch10__": "<h1>测验：第 10 章：搜索（二分查找）<\/h1><div class='quiz-item' data-qid='q18' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 二分查找的时间复杂度是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q18' value='0'> O(1)<\/label><label class='quiz-opt'><input type='radio' name='q18' value='1'> O(log n)<\/label><label class='quiz-opt'><input type='radio' name='q18' value='2'> O(n)<\/label><label class='quiz-opt'><input type='radio' name='q18' value='3'> O(n log n)<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q19' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 100 万条有序记录用二分最多比较约多少次？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q19' value='0'> 100 万<\/label><label class='quiz-opt'><input type='radio' name='q19' value='1'> 1 万<\/label><label class='quiz-opt'><input type='radio' name='q19' value='2'> 20<\/label><label class='quiz-opt'><input type='radio' name='q19' value='3'> 1000<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q33' data-type='single'><p class='quiz-q'><b>Q3.<\/b> 对 1 亿条无序数据快速判断某 key 是否存在，最佳选择？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q33' value='0'> 全排序后二分<\/label><label class='quiz-opt'><input type='radio' name='q33' value='1'> 哈希集合<\/label><label class='quiz-opt'><input type='radio' name='q33' value='2'> 线性遍历<\/label><label class='quiz-opt'><input type='radio' name='q33' value='3'> 二叉搜索树<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch11__": "<h1>测验：第 11 章：排序<\/h1><div class='quiz-item' data-qid='q20' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 下列哪种排序是稳定的？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q20' value='0'> 快速排序<\/label><label class='quiz-opt'><input type='radio' name='q20' value='1'> 选择排序<\/label><label class='quiz-opt'><input type='radio' name='q20' value='2'> 归并排序<\/label><label class='quiz-opt'><input type='radio' name='q20' value='3'> 堆排序<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q21' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 基于比较的排序理论最优时间复杂度是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q21' value='0'> O(n)<\/label><label class='quiz-opt'><input type='radio' name='q21' value='1'> O(n log n)<\/label><label class='quiz-opt'><input type='radio' name='q21' value='2'> O(n²)<\/label><label class='quiz-opt'><input type='radio' name='q21' value='3'> O(log n)<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch12__": "<h1>测验：第 12 章：分治<\/h1><div class='quiz-item' data-qid='q22' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 分治的两个阶段是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q22' value='0'> 递归与迭代<\/label><label class='quiz-opt'><input type='radio' name='q22' value='1'> 分与治<\/label><label class='quiz-opt'><input type='radio' name='q22' value='2'> 入栈与出栈<\/label><label class='quiz-opt'><input type='radio' name='q22' value='3'> 拆分与排序<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q23' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 分治与动态规划的关键区别？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q23' value='0'> 分治子问题独立不重叠<\/label><label class='quiz-opt'><input type='radio' name='q23' value='1'> DP 子问题独立<\/label><label class='quiz-opt'><input type='radio' name='q23' value='2'> 无区别<\/label><label class='quiz-opt'><input type='radio' name='q23' value='3'> 分治总是更快<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch13__": "<h1>测验：第 13 章：回溯<\/h1><div class='quiz-item' data-qid='q24' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 回溯算法的三大动作是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q24' value='0'> 分治合并<\/label><label class='quiz-opt'><input type='radio' name='q24' value='1'> 尝试/回退/剪枝<\/label><label class='quiz-opt'><input type='radio' name='q24' value='2'> 入队出队<\/label><label class='quiz-opt'><input type='radio' name='q24' value='3'> 建堆堆化<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q25' data-type='single'><p class='quiz-q'><b>Q2.<\/b> n 皇后剪枝三数组不包含哪种约束？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q25' value='0'> 同列<\/label><label class='quiz-opt'><input type='radio' name='q25' value='1'> 同主对角线<\/label><label class='quiz-opt'><input type='radio' name='q25' value='2'> 同次对角线<\/label><label class='quiz-opt'><input type='radio' name='q25' value='3'> 同色<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q32' data-type='single'><p class='quiz-q'><b>Q3.<\/b> 下面哪种情况应该用回溯而不是 DP？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q32' value='0'> 求背包最大价值<\/label><label class='quiz-opt'><input type='radio' name='q32' value='1'> 列出所有 n 皇后摆法<\/label><label class='quiz-opt'><input type='radio' name='q32' value='2'> 求最短路长度<\/label><label class='quiz-opt'><input type='radio' name='q32' value='3'> 求编辑距离<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch14__": "<h1>测验：第 14 章：动态规划<\/h1><div class='quiz-item' data-qid='q26' data-type='blank'><p class='quiz-q'><b>Q1.<\/b> 爬楼梯的状态转移方程 dp[i] = ?<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q27' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 0-1 背包一维优化时容量 c 应怎样遍历？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q27' value='0'> 正序<\/label><label class='quiz-opt'><input type='radio' name='q27' value='1'> 倒序<\/label><label class='quiz-opt'><input type='radio' name='q27' value='2'> 随机<\/label><label class='quiz-opt'><input type='radio' name='q27' value='3'> 双层正序<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q28' data-type='single'><p class='quiz-q'><b>Q3.<\/b> 动态规划三大特性不包括？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q28' value='0'> 重叠子问题<\/label><label class='quiz-opt'><input type='radio' name='q28' value='1'> 最优子结构<\/label><label class='quiz-opt'><input type='radio' name='q28' value='2'> 无后效性<\/label><label class='quiz-opt'><input type='radio' name='q28' value='3'> 子问题独立<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q31' data-type='multi'><p class='quiz-q'><b>Q4.<\/b> 下列哪些问题的子问题是重叠的（适合 DP）？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='checkbox' name='q31' value='0'> 归并排序<\/label><label class='quiz-opt'><input type='checkbox' name='q31' value='1'> 爬楼梯<\/label><label class='quiz-opt'><input type='checkbox' name='q31' value='2'> 0-1 背包<\/label><label class='quiz-opt'><input type='checkbox' name='q31' value='3'> 二分查找<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch15__": "<h1>测验：第 15 章：贪心<\/h1><div class='quiz-item' data-qid='q29' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 分数背包的贪心策略按什么从高到低装？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q29' value='0'> 重量<\/label><label class='quiz-opt'><input type='radio' name='q29' value='1'> 价值<\/label><label class='quiz-opt'><input type='radio' name='q29' value='2'> 单位价值<\/label><label class='quiz-opt'><input type='radio' name='q29' value='3'> 体积<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q30' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 零钱兑换在哪个硬币组合下贪心会错？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q30' value='0'> [1,5,10]<\/label><label class='quiz-opt'><input type='radio' name='q30' value='1'> [1,20,50] 凑 60<\/label><label class='quiz-opt'><input type='radio' name='q30' value='2'> [1,2,5]<\/label><label class='quiz-opt'><input type='radio' name='q30' value='3'> [10,20,50]<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__cards__": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "__glossary__": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='算法'>算法 — 解决特定问题的有限清晰操作步骤序列 <span class=glossary-ref>（第 1 章：初识算法）<\/span><\/li><li data-term='时间复杂度'>时间复杂度 — 基本操作次数随输入规模 n 的增长趋势 <span class=glossary-ref>（第 2 章：复杂度分析）<\/span><\/li><li data-term='空间复杂度'>空间复杂度 — 额外内存随 n 的增长趋势 <span class=glossary-ref>（第 2 章：复杂度分析）<\/span><\/li><li data-term='大 o 记号'>大 O 记号 — 描述复杂度渐近上界，只留最高阶丢系数 <span class=glossary-ref>（第 2 章：复杂度分析）<\/span><\/li><li data-term='递归'>递归 — 函数自己调用自己，带终止条件 <span class=glossary-ref>（第 2 章：复杂度分析）<\/span><\/li><li data-term='迭代'>迭代 — 用循环一步步推进 <span class=glossary-ref>（第 2 章：复杂度分析）<\/span><\/li><li data-term='调用栈'>调用栈 — 每层未返回递归函数占用的内存栈帧 <span class=glossary-ref>（第 2 章：复杂度分析）<\/span><\/li><li data-term='数组'>数组 — 连续内存中同类型元素的集合 <span class=glossary-ref>（第 4 章：数组与链表）<\/span><\/li><li data-term='链表'>链表 — 节点分散存储、靠指针串联的数据结构 <span class=glossary-ref>（第 4 章：数组与链表）<\/span><\/li><li data-term='动态数组'>动态数组 — 可自动扩容的数组（如 Python list） <span class=glossary-ref>（第 4 章：数组与链表）<\/span><\/li><li data-term='缓存'>缓存 — CPU 为加速而缓存的相邻数据块 <span class=glossary-ref>（第 4 章：数组与链表）<\/span><\/li><li data-term='栈'>栈 — 后进先出的线性结构 <span class=glossary-ref>（第 5 章：栈与队列）<\/span><\/li><li data-term='队列'>队列 — 先进先出的线性结构 <span class=glossary-ref>（第 5 章：栈与队列）<\/span><\/li><li data-term='双向队列'>双向队列 — 两端都能进出的队列 <span class=glossary-ref>（第 5 章：栈与队列）<\/span><\/li><li data-term='哈希表'>哈希表 — 键值查表，用哈希函数把 key 映射到桶 <span class=glossary-ref>（第 6 章：哈希表）<\/span><\/li><li data-term='哈希冲突'>哈希冲突 — 不同 key 算出同一桶编号 <span class=glossary-ref>（第 6 章：哈希表）<\/span><\/li><li data-term='负载因子'>负载因子 — 元素数÷桶数，过高需扩容 <span class=glossary-ref>（第 6 章：哈希表）<\/span><\/li><li data-term='二叉树'>二叉树 — 每节点最多两个子节点的树 <span class=glossary-ref>（第 7 章：树（二叉树））<\/span><\/li><li data-term='二叉搜索树'>二叉搜索树 — 左&lt;根&lt;右的二叉树，中序有序 <span class=glossary-ref>（第 7 章：树（二叉树））<\/span><\/li><li data-term='平衡因子'>平衡因子 — 节点左右子树高度差 <span class=glossary-ref>（第 7 章：树（二叉树））<\/span><\/li><li data-term='堆'>堆 — 父≥子（大顶）或父≤子（小顶）的完全二叉树 <span class=glossary-ref>（第 8 章：堆）<\/span><\/li><li data-term='堆化'>堆化 — 调整节点使其恢复堆性质 <span class=glossary-ref>（第 8 章：堆）<\/span><\/li><li data-term='优先队列'>优先队列 — 每次取最高优先级元素的结构（堆实现） <span class=glossary-ref>（第 8 章：堆）<\/span><\/li><li data-term='图'>图 — 顶点+边组成的网状结构 <span class=glossary-ref>（第 9 章：图）<\/span><\/li><li data-term='bfs'>BFS — 广度优先搜索，队列逐层扩展 <span class=glossary-ref>（第 9 章：图）<\/span><\/li><li data-term='dfs'>DFS — 深度优先搜索，递归/栈走到底 <span class=glossary-ref>（第 9 章：图）<\/span><\/li><li data-term='二分查找'>二分查找 — 有序数组每次砍半的 O(log n) 查找 <span class=glossary-ref>（第 10 章：搜索（二分查找））<\/span><\/li><li data-term='稳定性'>稳定性 — 排序后相等元素相对顺序不变 <span class=glossary-ref>（第 11 章：排序）<\/span><\/li><li data-term='分治'>分治 — 拆成独立子问题再合并解 <span class=glossary-ref>（第 12 章：分治）<\/span><\/li><li data-term='回溯'>回溯 — 带尝试/回退/剪枝的穷举 <span class=glossary-ref>（第 13 章：回溯）<\/span><\/li><li data-term='剪枝'>剪枝 — 提前剪掉无效搜索分支 <span class=glossary-ref>（第 13 章：回溯）<\/span><\/li><li data-term='动态规划'>动态规划 — 用 dp 表记忆重叠子问题求最优 <span class=glossary-ref>（第 14 章：动态规划）<\/span><\/li><li data-term='最优子结构'>最优子结构 — 原问题最优解由子问题最优解构造 <span class=glossary-ref>（第 14 章：动态规划）<\/span><\/li><li data-term='无后效性'>无后效性 — 未来只与当前状态有关，与历史路径无关 <span class=glossary-ref>（第 14 章：动态规划）<\/span><\/li><li data-term='贪心'>贪心 — 每步选局部最优、不回看 <span class=glossary-ref>（第 15 章：贪心）<\/span><\/li><\/ul>", "__patterns__": "<h1>模式与框架库<\/h1>\n<h2>框架：算法效率选型（作者反复使用的判断框架）<\/h2>\n<p>拿到一个问题，作者按这个顺序判断：<\/p>\n<ol><li>\n数据是否有序/有索引？→ 有序用二分 O(log n)；只判存在用哈希 O(1)。\n<\/li><li>\n是否能用数据结构直接命中？→ 栈解决配对/后退，队列解决排队/BFS。\n<\/li><li>\n是否可拆独立子问题？→ 分治（归并、快排）。\n<\/li><li>\n是否要求枚举所有解/满足约束？→ 回溯 + 剪枝。\n<\/li><li>\n是否求最优且子问题重叠？→ DP 填表。\n<\/li><li>\n是否每步局部最优即可？→ 贪心（须验证贪心选择性质）。\n<\/ol>\n<h2>决策规则：用哪种排序？<\/h2>\n<ul><li>\n数据量小 / 基本有序 → 插入排序（常数小、自适应）。\n<\/li><li>\n通用大数据量 → 快速排序（缓存友好，实际最快）。\n<\/li><li>\n需要稳定 + 链表排序 → 归并排序。\n<\/li><li>\n要原地 O(n log n) → 堆排序。\n<\/li><li>\n数据量大、范围小的非负整数 → 计数/基数排序。\n<\/ul>\n<h2>决策规则：回溯 vs DP<\/h2>\n<ul><li>\n要列出所有满足约束的解（全排列、n 皇后）→ 回溯。\n<\/li><li>\n只求一个最优值（背包最大价值）→ DP。\n<\/li><li>\n子问题是否重叠：重叠 → DP；独立 → 分治。\n<\/ul>\n<h2>反模式<\/h2>\n<ol><li>\n<strong>&quot;递归 = 优雅高效&quot;<\/strong> —— 实际上无缓存的递归（裸斐波那契）是 O(2ⁿ) 灾难。替代：先记忆化或改递推。\n<\/li><li>\n<strong>&quot;O(n log n) 总比 O(n²) 快&quot;<\/strong> —— 实际上 n 很小时插入排序因常数小反而更快。替代：短区间回退插入排序。\n<\/li><li>\n<strong>&quot;贪心代码短就对&quot;<\/strong> —— 实际上零钱兑换在 [1,20,50] 下贪心得到 11 枚，DP 是 3 枚。替代：找反例检验贪心选择性质。\n<\/li><li>\n<strong>&quot;用 list.pop(0) 当队列&quot;<\/strong> —— 实际上头部删除 O(n)。替代：用 deque.popleft()。\n<\/li><li>\n<strong>&quot;BST 天然 O(log n)&quot;<\/strong> —— 实际上有序插入退化成斜链 O(n)。替代：AVL/红黑树平衡。\n<\/li><li>\n<strong>&quot;哈希查找永远 O(1)&quot;<\/strong> —— 实际上哈希函数差/负载因子高时退化成 O(n)。替代：控制负载因子、扩容重哈希。\n<\/ol>", "__cheatsheet__": "<h1>速查表<\/h1>\n<h2>复杂度阶序（从快到慢）<\/h2>\n<p>O(1) 常数 &lt; O(log n) 对数 &lt; O(n) 线性 &lt; O(n log n) &lt; O(n²) 平方 &lt; O(2ⁿ) 指数 &lt; O(n!) 阶乘<\/p>\n<h2>数据结构操作复杂度<\/h2>\n<table><thead><tr><th>结构<\/th><th>按下标查<\/th><th>头部插<\/th><th>尾部插<\/th><th>中间插<\/th><th>备注<\/th><\/tr><\/thead><tbody><tr><td>数组<\/td><td>O(1)<\/td><td>O(n)<\/td><td>O(n)<\/td><td>O(n)<\/td><td>连续内存<\/td><\/tr><tr><td>动态数组(list)<\/td><td>O(1)<\/td><td>O(n)<\/td><td>均摊O(1)<\/td><td>O(n)<\/td><td>自动扩容<\/td><\/tr><tr><td>链表<\/td><td>O(n)<\/td><td>O(1)<\/td><td>O(n)<\/td><td>定位后O(1)<\/td><td>指针串联<\/td><\/tr><tr><td>栈<\/td><td>—<\/td><td>—<\/td><td>O(1) push<\/td><td>—<\/td><td>LIFO<\/td><\/tr><tr><td>队列<\/td><td>—<\/td><td>O(1) 入队<\/td><td>—<\/td><td>—<\/td><td>FIFO, deque<\/td><\/tr><tr><td>哈希表<\/td><td>O(1) 平均<\/td><td>—<\/td><td>—<\/td><td>O(1)<\/td><td>key→value<\/td><\/tr><tr><td>BST(平衡)<\/td><td>O(log n)<\/td><td>O(log n)<\/td><td>O(log n)<\/td><td>O(log n)<\/td><td>左&lt;根&lt;右<\/td><\/tr><tr><td>堆<\/td><td>O(1) 看顶<\/td><td>—<\/td><td>O(log n) 入堆<\/td><td>—<\/td><td>取极值O(log n)<\/td><\/tr><\/tbody><\/table>\n<h2>排序算法对比<\/h2>\n<table><thead><tr><th>算法<\/th><th>平均<\/th><th>空间<\/th><th>稳定<\/th><th>关键特性<\/th><\/tr><\/thead><tbody><tr><td>冒泡<\/td><td>O(n²)<\/td><td>O(1)<\/td><td>是<\/td><td>flag 后最佳 O(n)<\/td><\/tr><tr><td>选择<\/td><td>O(n²)<\/td><td>O(1)<\/td><td>否<\/td><td>总 O(n²)<\/td><\/tr><tr><td>插入<\/td><td>O(n²)<\/td><td>O(1)<\/td><td>是<\/td><td>小数据最快<\/td><\/tr><tr><td>快速<\/td><td>O(n log n)<\/td><td>O(n)<\/td><td>否<\/td><td>实际最快，最坏O(n²)<\/td><\/tr><tr><td>归并<\/td><td>O(n log n)<\/td><td>O(n)<\/td><td>是<\/td><td>稳定，需辅助数组<\/td><\/tr><tr><td>堆<\/td><td>O(n log n)<\/td><td>O(1)<\/td><td>否<\/td><td>原地<\/td><\/tr><tr><td>桶/计数/基数<\/td><td>O(n+k)<\/td><td>O(n+k)<\/td><td>视实现<\/td><td>非比较，范围受限<\/td><\/tr><\/tbody><\/table>\n<h2>经典问题解法速记<\/h2>\n<table><thead><tr><th>问题<\/th><th>方法<\/th><th>核心<\/th><\/tr><\/thead><tbody><tr><td>爬楼梯<\/td><td>DP<\/td><td>dp[i]=dp[i-1]+dp[i-2]<\/td><\/tr><tr><td>最小路径和<\/td><td>DP<\/td><td>dp[i][j]=min(上,左)+grid[i][j]<\/td><\/tr><tr><td>0-1 背包<\/td><td>DP<\/td><td>max(不拿, 拿)；一维倒序<\/td><\/tr><tr><td>完全背包<\/td><td>DP<\/td><td>一维正序<\/td><\/tr><tr><td>编辑距离<\/td><td>DP<\/td><td>末尾相同继承左上，否则三者min+1<\/td><\/tr><tr><td>全排列<\/td><td>回溯<\/td><td>selected 剪枝<\/td><\/tr><tr><td>子集和<\/td><td>回溯<\/td><td>start 去重 + 排序剪枝<\/td><\/tr><tr><td>n 皇后<\/td><td>回溯<\/td><td>行列/双斜线三数组剪枝<\/td><\/tr><tr><td>Top-k<\/td><td>堆<\/td><td>大小 k 的小顶堆<\/td><\/tr><tr><td>最大容量<\/td><td>贪心<\/td><td>双指针移短板<\/td><\/tr><\/tbody><\/table>\n<h2>Python 常用工具<\/h2>\n<ul><li>\n栈：<code>list.append()<\/code> / <code>list.pop()<\/code>\n<\/li><li>\n队列：<code>collections.deque()<\/code>，<code>append()<\/code> / <code>popleft()<\/code>\n<\/li><li>\n堆：<code>heapq.heappush()<\/code> / <code>heappop()<\/code>\n<\/li><li>\n哈希：<code>dict<\/code> / <code>set<\/code>\n<\/ul>"}};
const pages = DATA.rendered;
const manifest = DATA.manifest;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SLUG = manifest.slug || 'book';
const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem(SLUG+':'+k)||'null') }catch(e){ return null } },
  set(k,v){ try{ localStorage.setItem(SLUG+':'+k, JSON.stringify(v)) }catch(e){} }
};
let state = { visited: store.get('visited')||[], quiz: store.get('quiz')||{}, cards: store.get('cards')||{} };

/* ---------- 导航 ---------- */
function renderNav(){
  const nav = $('#nav'); nav.innerHTML='';
  const build = items => items.forEach(it=>{
    if(it.children){
      const sec=document.createElement('div'); sec.className='nav-sec'; sec.textContent=it.label; nav.appendChild(sec);
      it.children.forEach(c=>{
        const a=document.createElement('a'); a.className='nav-item'; a.href=c.href; a.textContent=c.label;
        const id=routeId(c.href);
        if(state.visited.includes(id)) a.innerHTML = esc(c.label)+' <span class="done">✓</span>';
        nav.appendChild(a);
      });
    }else{
      const a=document.createElement('a'); a.className='nav-item'; a.href=it.href; a.textContent=it.label;
      const id=routeId(it.href);
      if(state.visited.includes(id)) a.innerHTML = esc(it.label)+' <span class="done">✓</span>';
      nav.appendChild(a);
    }
  });
  build(DATA.nav);
  updateProgress();
}
function routeId(href){ return href.replace('#/',''); }

/* ---------- 路由 ---------- */
function routeIdFromHash(){
  let h = location.hash.replace(/^#\//,'');
  if(!h) return 'path';
  if(h==='path') return 'path';
  const m = h.match(/^(chapter|concept)\/(.+)$/);
  if(m) return m[1]+'/'+m[2];
  return h; // quiz/all, quiz/ch01, cards, glossary, patterns, cheatsheet
}
function showPage(rid){
  const id = rid==='path' ? '__path__' : rid.startsWith('quiz/') ? '__quiz_'+rid.split('/')[1]+'__' : rid==='cards'?'__cards__':rid==='glossary'?'__glossary__':rid==='patterns'?'__patterns__':rid==='cheatsheet'?'__cheatsheet__':rid.startsWith('chapter/')?rid.split('/')[1]:rid.startsWith('concept/')?rid.split('/')[1]:rid;
  const html = pages[id] || '<div class="empty">页面不存在</div>';
  $('#view').innerHTML = html;
  document.querySelectorAll('.nav-item').forEach(a=>a.classList.toggle('active', routeId(a.getAttribute('href'))===rid));
  if(!state.visited.includes(rid) && (rid.startsWith('chapter/')||rid.startsWith('concept/'))){
    state.visited.push(rid); store.set('visited', state.visited); renderNav();
  }
  window.scrollTo(0,0);
  if(rid==='cards') initCards();
  if(rid==='glossary') initGlossary();
  if(rid.startsWith('quiz')) initQuizzes(rid);
  if(id==='__path__') updatePath();
  renderMermaid();
}

/* ---------- 进度 ---------- */
function updateProgress(){
  const chs = (manifest.chapters||[]).length;
  const done = (manifest.chapters||[]).filter(c=>state.visited.includes('chapter/'+c.id)).length;
  const pct = chs? Math.round(done/chs*100) : 0;
  $('#progress-fill').style.width = pct+'%';
  $('#progress-label').textContent = `进度 ${pct}% · 已学 ${done}/${chs} 章`;
}
function updatePath(){
  document.querySelectorAll('.path-step').forEach(el=>{
    const step = el.id.replace('path-','');
    const s = (manifest.learningPath||[]).find(x=>x.step===step);
    if(s && (s.chapterIds||[]).every(c=>state.visited.includes('chapter/'+c))){
      el.classList.add('passed');
      const lbl = el.querySelector('.checkpoint-ok'); if(!lbl){ const sp=document.createElement('span'); sp.className='done'; sp.textContent=' ✓ 已完成'; el.appendChild(sp); }
    }
  });
}

/* ---------- 测验 ---------- */
function initQuizzes(rid){
  document.querySelectorAll('.quiz-item').forEach(item=>{
    const btn = item.querySelector('.quiz-check');
    if(!btn || item.dataset.inited){ return }
    item.dataset.inited='1';
    btn.addEventListener('click', ()=>{
      const qid = item.dataset.qid; const type = item.dataset.type;
      const q = (manifest.quizzes||[]).find(x=>x.id===qid); if(!q) return;
      let user, correct=false, fb;
      if(type==='single'){
        const sel = item.querySelector('input:checked');
        user = sel? parseInt(sel.value) : null;
        correct = user===q.answer;
        fb = correct?'✓ 正确':'✗ 错误'+(user==null?'（未作答）':'');
      } else if(type==='multi'){
        user = Array.from(item.querySelectorAll('input:checked')).map(i=>parseInt(i.value)).sort();
        const ans = Array.isArray(q.answer)? q.answer.slice().sort(): [q.answer];
        correct = user.length>0 && JSON.stringify(user)===JSON.stringify(ans);
        fb = correct?'✓ 正确':'✗ 错误';
      } else if(type==='blank'){
        const v = (item.querySelector('.quiz-blank').value||'').trim().toLowerCase();
        const a = String(q.answer).trim().toLowerCase();
        correct = v===a;
        fb = correct?'✓ 正确':'✗ 错误'+(v?'':'（未作答）');
      }
      item.querySelectorAll('input:checked').forEach(i=>{
        const val=parseInt(i.value);
        if(Array.isArray(q.answer)? q.answer.includes(val) : val===q.answer) i.parentElement.style.color='var(--ok)';
        else i.parentElement.style.color='var(--bad)';
      });
      const feed = item.querySelector('.quiz-feedback');
      feed.className = 'quiz-feedback '+(correct?'fb-ok':'fb-bad');
      feed.textContent = fb;
      let ex = item.querySelector('.quiz-explain');
      if(!ex){ ex=document.createElement('div'); ex.className='quiz-explain'; item.appendChild(ex); }
      ex.innerHTML = '解析：' + esc(q.explain||'');
      // 记录成绩（按章聚合）
      const ch = q.chapterId||'__all__';
      if(!state.quiz[ch]) state.quiz[ch]={done:0,total:0};
      state.quiz[ch].done = Math.min(state.quiz[ch].total+1, state.quiz[ch].done+1);
      state.quiz[ch].total += 1;
      store.set('quiz', state.quiz);
    });
  });
}

/* ---------- 抽认卡 ---------- */
let cardIdx = 0, cardList = [];
function initCards(){
  const cards = manifest.flashcards||[];
  cardList = cards.slice();
  cardIdx = 0;
  const sel = $('#card-filter');
  sel.innerHTML = '<option value="">全部</option>';
  [...new Set(cards.map(c=>c.chapterId).filter(Boolean))].forEach(c=>{
    const o=document.createElement('option'); o.value=c; o.textContent=manifestChTitle(c); sel.appendChild(o);
  });
  sel.onchange = ()=>{ const v=sel.value; cardList = v? cards.filter(c=>c.chapterId===v): cards.slice(); cardIdx=0; showCard(); };
  $('#flashcard').onclick = ()=>$('#flashcard').classList.toggle('flip');
  $('#card-known-btn').onclick = ()=>{ markCard(true); };
  $('#card-again-btn').onclick = ()=>{ markCard(false); };
  showCard();
}
function showCard(){
  updateCardCounts();
  if(cardIdx>=cardList.length){ $('#card-stage').innerHTML='<div class="empty">本组卡片已全部复习完 🎉</div>'; return; }
  const c = cardList[cardIdx];
  document.querySelector('.fc-front').textContent = c.front;
  document.querySelector('.fc-back').textContent = c.back;
  $('#flashcard').classList.remove('flip');
}
function markCard(known){
  const c = cardList[cardIdx]; if(!c) return;
  state.cards[c.id] = known?'known':'again';
  store.set('cards', state.cards);
  cardIdx++; showCard();
}
function updateCardCounts(){
  const known = Object.values(state.cards).filter(v=>v==='known').length;
  const again = Object.values(state.cards).filter(v=>v==='again').length;
  $('#card-known').textContent = known;
  $('#card-again').textContent = again;
  $('#card-left').textContent = Math.max(0, cardList.length-cardIdx);
}
function manifestChTitle(id){
  const c=(manifest.chapters||[]).find(x=>x.id===id); return c? c.title : id;
}

/* ---------- 术语表 ---------- */
function initGlossary(){
  const input = $('#glossary-filter');
  if(!input || input.dataset.inited) return;
  input.dataset.inited='1';
  input.oninput = ()=>{
    const v = input.value.trim().toLowerCase();
    document.querySelectorAll('#glossary-list li').forEach(li=>{
      li.style.display = (!v || li.dataset.term.includes(v)) ? '' : 'none';
    });
  };
}

/* ---------- 搜索 ---------- */
let searchIndex = null;
function buildSearchIndex(){
  if(searchIndex) return searchIndex;
  searchIndex = [];
  Object.entries(pages).forEach(([id, htmlText])=>{
    if(id.startsWith('__')) return;
    const text = htmlText.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ');
    searchIndex.push({id, text});
  });
  return searchIndex;
}
$('#q').addEventListener('input', e=>{
  const v = e.target.value.trim().toLowerCase();
  if(!v){ showPage(routeIdFromHash()); return; }
  buildSearchIndex();
  const hits = searchIndex.filter(p=>p.text.toLowerCase().includes(v)).slice(0,20);
  const label = id => id.startsWith('chapter/')? ('章节：'+manifestChTitle(id.split('/')[1])) : id.startsWith('concept/')? ('概念：'+id.split('/')[1]) : id;
  $('#view').innerHTML = '<h1>搜索结果：'+esc(v)+'</h1>' +
    (hits.length? hits.map(h=>`<div class="search-hit"><a href="#/${h.id}">${esc(label(h.id))}</a><br><span class="sub">${esc(h.text.slice(0,180))}</span></div>`).join('')
                 : '<div class="empty">未找到相关页面，试试章节名/概念名/术语。</div>');
});

/* ---------- Mermaid 懒加载（联网渲染，离线显示源码） ---------- */
function renderMermaid(){
  if(!document.querySelector('.mermaid')) return;
  const s=document.createElement('script');
  s.src='https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js';
  s.onload=()=>{ try{
    mermaid.initialize({startOnLoad:false, theme: matchMedia('(prefers-color-scheme: dark)').matches?'dark':'default'});
    document.querySelectorAll('.mermaid').forEach(el=>{
      const code=el.textContent;
      mermaid.render('mm'+Math.random().toString(36).slice(2), code)
        .then(({svg})=>{ el.innerHTML=svg; })
        .catch(()=>{ el.textContent=code; });
    });
  }catch(e){} };
  document.head.appendChild(s);
}

/* ---------- 深色模式 ---------- */
const themeBtn=$('#theme-btn');
themeBtn.onclick=()=>{
  const d = document.body.dataset.theme==='dark';
  document.body.dataset.theme = d? '' : 'dark';
  themeBtn.textContent = d? '🌙 深色' : '☀️ 浅色';
};

/* ---------- 启动 ---------- */
renderNav();
window.addEventListener('hashchange', ()=>showPage(routeIdFromHash()));
showPage(routeIdFromHash());
</script>
