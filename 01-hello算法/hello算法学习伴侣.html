<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hello 算法 点化学习系统</title>
<style>
:root{
  --bg:#f7f7f8; --panel:#ffffff; --text:#1f2328; --muted:#6b7280;
  --accent:#2563eb; --accent-soft:#dbeafe; --border:#e5e7eb;
  --ok:#16a34a; --bad:#dc2626; --code-bg:#f3f4f6;
}
[data-theme="dark"]{
  --bg:#111318; --panel:#1a1d24; --text:#e5e7eb; --muted:#9ca3af;
  --accent:#60a5fa; --accent-soft:#1e3a5f; --border:#2d333d;
  --ok:#4ade80; --bad:#f87171; --code-bg:#20242c;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);line-height:1.7;font-size:15px}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
.layout{display:flex;min-height:100vh}
.sidebar{width:290px;flex:none;background:var(--panel);border-right:1px solid var(--border);
  padding:14px;position:sticky;top:0;height:100vh;overflow-y:auto}
.sidebar h1{font-size:17px;margin:2px 0 2px}
.sidebar .sub{font-size:12px;color:var(--muted);margin-bottom:10px}
#q{width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);margin-bottom:10px}
.nav-sec{font-size:12px;color:var(--muted);margin:12px 0 4px;text-transform:uppercase;letter-spacing:.4px}
.nav-item{display:block;padding:5px 10px;border-radius:6px;color:var(--text);font-size:14px}
.nav-item:hover{background:var(--accent-soft);text-decoration:none}
.nav-item.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav-item .done{float:right;color:var(--ok);font-size:12px}
.main{flex:1;min-width:0;padding:28px 40px 80px;max-width:920px}
.page h1{font-size:26px;border-bottom:2px solid var(--border);padding-bottom:8px;margin-top:0}
.page h2{font-size:20px;margin-top:26px}
.page h3{font-size:17px;margin-top:22px}
.page table{border-collapse:collapse;width:100%;margin:12px 0;font-size:14px}
.page th,.page td{border:1px solid var(--border);padding:6px 10px;text-align:left}
.page th{background:var(--code-bg)}
.page code{background:var(--code-bg);padding:2px 5px;border-radius:4px;font-size:.9em}
.page pre{background:var(--code-bg);padding:12px;border-radius:8px;overflow-x:auto;font-size:13px}
.page pre code{background:none;padding:0}
.page blockquote{border-left:4px solid var(--accent);margin:12px 0;padding:6px 14px;background:var(--accent-soft);border-radius:0 6px 6px 0}
.page blockquote blockquote{border-color:var(--muted)}
.page img{max-width:100%}
.mermaid{background:var(--code-bg);padding:14px;border-radius:8px;overflow-x:auto;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;white-space:pre;color:var(--muted)}
.mermaid-hint{font-size:12px;color:var(--muted);margin:4px 0 14px}
svg{max-width:100%;height:auto}
.quiz-item{border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin:14px 0;background:var(--panel)}
.quiz-q{margin:0 0 8px;font-weight:500}
.quiz-opts label{display:block;padding:4px 0;cursor:pointer}
.quiz-blank{width:60%;padding:6px 10px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text)}
.quiz-check{margin-top:10px;padding:6px 16px;border:none;border-radius:6px;background:var(--accent);color:#fff;cursor:pointer}
.quiz-feedback{margin-left:12px;font-size:13px}
.fb-ok{color:var(--ok)}.fb-bad{color:var(--bad)}
.quiz-explain{margin-top:8px;font-size:13px;color:var(--muted);border-top:1px dashed var(--border);padding-top:6px}
.flashcard{perspective:1200px;margin:24px auto;max-width:520px;cursor:pointer;user-select:none}
.fc-inner{position:relative;width:100%;height:240px;transform-style:preserve-3d;transition:transform .5s}
.flashcard.flip .fc-inner{transform:rotateY(180deg)}
.fc-front,.fc-back{position:absolute;inset:0;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;
  padding:22px;border-radius:14px;border:1px solid var(--border);background:var(--panel);font-size:16px;text-align:center}
.fc-back{transform:rotateY(180deg);background:var(--accent-soft);color:var(--text)}
.card-controls{display:flex;gap:14px;align-items:center;margin:12px 0;flex-wrap:wrap}
.card-actions{display:flex;gap:12px;justify-content:center}
.card-actions button{padding:8px 22px;border:none;border-radius:8px;cursor:pointer;font-size:14px}
#card-known-btn{background:var(--ok);color:#fff}
#card-again-btn{background:var(--bad);color:#fff}
.card-counts{color:var(--muted);font-size:13px}
.path-step{margin:8px 0;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:var(--panel)}
.path-step.passed{border-color:var(--ok)}
#glossary-filter{width:100%;max-width:380px;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);margin-bottom:10px}
#glossary-list li{padding:6px 0;border-bottom:1px dashed var(--border)}
.glossary-ref{color:var(--muted);font-size:12px}
.search-hit{margin:10px 0}
.topbar{position:sticky;top:0;background:var(--bg);padding:8px 0;display:flex;justify-content:flex-end;z-index:10}
#theme-btn{border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:8px;padding:5px 12px;cursor:pointer}
#progress-bar{height:5px;background:var(--border);border-radius:3px;margin:8px 0;overflow:hidden}
#progress-bar>div{height:100%;width:0;background:var(--accent);transition:width .3s}
.empty{color:var(--muted);padding:20px 0}
@media print{.sidebar,.topbar,.quiz-actions,.card-actions,.card-controls{display:none!important}.main{max-width:none;padding:0}}
@media (max-width:760px){.sidebar{width:100%;height:auto;position:static}.layout{flex-direction:column}.main{padding:16px}}
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <h1>Hello 算法 点化学习系统</h1>
    <div class="sub">面向零基础的算法与数据结构完整自学伴侣</div>
    <div id="progress-bar"><div id="progress-fill"></div></div>
    <div class="sub" id="progress-label">进度 0%</div>
    <input id="q" type="search" placeholder="搜索章节 / 概念 / 术语 / 全文…">
    <nav id="nav"></nav>
  </aside>
  <main class="main">
    <div class="topbar"><button id="theme-btn">🌙 深色</button></div>
    <div id="view" class="page"></div>
  </main>
</div>

d": "f03", "chapterId": "ch02", "front": "大 O 记号怎么化简？", "back": "只保留最高阶项，丢系数和低阶项，描述 n 很大时的增长趋势。", "tags": ["复杂度"]}, {"id": "f04", "chapterId": "ch02", "front": "常见复杂度从快到慢的阶序？", "back": "O(1)<O(log n)<O(n)<O(n log n)<O(n²)<O(2ⁿ)<O(n!)。", "tags": ["阶序"]}, {"id": "f05", "chapterId": "ch02", "front": "递归函数两个必备要素？", "back": "递归关系 + 终止条件；缺终止条件会栈溢出。", "tags": ["递归"]}, {"id": "f06", "chapterId": "ch02", "front": "默认按哪种情况分析复杂度？", "back": "最坏情况，这样性能才有保证。", "tags": ["复杂度"]}, {"id": "f07", "chapterId": "ch04", "front": "数组随机访问为什么是 O(1)？", "back": "连续内存，直接用起始地址+下标算位置。", "tags": ["数组"]}, {"id": "f08", "chapterId": "ch04", "front": "链表查找为什么是 O(n)？", "back": "没有下标，只能从头顺指针逐个走。", "tags": ["链表"]}, {"id": "f09", "chapterId": "ch04", "front": "Python list 的 append 为什么均摊 O(1)？", "back": "底层连续数组偶尔扩容整体搬迁，摊到每次平均 O(1)。", "tags": ["动态数组"]}, {"id": "f10", "chapterId": "ch04", "front": "为什么数组遍历实际比链表快？", "back": "CPU 缓存把相邻数据一起载入，数组连续命中缓存；链表节点分散频繁未命中。", "tags": ["缓存"]}, {"id": "f11", "chapterId": "ch05", "front": "栈和队列的规则分别是？", "back": "栈后进先出 LIFO；队列先进先出 FIFO。", "tags": ["栈队列"]}, {"id": "f12", "chapterId": "ch05", "front": "BFS 用什么结构实现？", "back": "队列，按层先来后到扩展。", "tags": ["BFS"]}, {"id": "f13", "chapterId": "ch05", "front": "为什么不用 list.pop(0) 当队列？", "back": "list 头部删除要平移 O(n)；应用 deque.popleft()，O(1)。", "tags": ["队列"]}, {"id": "f14", "chapterId": "ch06", "front": "哈希表为什么 O(1) 查找？", "back": "哈希函数把 key 直接算成桶编号，直达目标。", "tags": ["哈希表"]}, {"id": "f15", "chapterId": "ch06", "front": "哈希冲突的两种解决办法？", "back": "链式地址（桶挂链表）与开放寻址（向后探测空桶）。", "tags": ["冲突"]}, {"id": "f16", "chapterId": "ch06", "front": "负载因子过大怎么办？", "back": "扩容（桶数翻倍）并重新哈希。", "tags": ["哈希表"]}, {"id": "f17", "chapterId": "ch07", "front": "二叉搜索树的性质？", "back": "左<根<右；中序遍历输出升序。", "tags": ["BST"]}, {"id": "f18", "chapterId": "ch07", "front": "四种树遍历顺序？", "back": "前序 根→左→右；中序 左→根→右；后序 左→右→根；层序 逐层。", "tags": ["遍历"]}, {"id": "f19", "chapterId": "ch07", "front": "BST 什么时候退化成 O(n)？", "back": "数据有序插入变成斜链，需 AVL 平衡树。", "tags": ["BST"]}, {"id": "f20", "chapterId": "ch08", "front": "大顶堆/小顶堆的定义？", "back": "大顶堆父≥子（堆顶最大）；小顶堆父≤子（堆顶最小）。", "tags": ["堆"]}, {"id": "f21", "chapterId": "ch08", "front": "堆化的时间复杂度？", "back": "沿树高调整，O(log n)。", "tags": ["堆"]}, {"id": "f22", "chapterId": "ch08", "front": "Top-k 问题怎么高效解？", "back": "维护大小 k 的小顶堆，遍历 O(n log k)。", "tags": ["堆"]}, {"id": "f23", "chapterId": "ch09", "front": "BFS 和 DFS 各用什么结构？", "back": "BFS 用队列；DFS 用栈/递归。", "tags": ["图遍历"]}, {"id": "f24", "chapterId": "ch09", "front": "图遍历为什么要 visited？", "back": "图有环，不记录会无限循环。", "tags": ["图"]}, {"id": "f25", "chapterId": "ch09", "front": "邻接矩阵和邻接表适用场景？", "back": "稠密图用矩阵 O(n²)；稀疏图用邻接表 O(n+m)。", "tags": ["图存储"]}, {"id": "f26", "chapterId": "ch10", "front": "二分查找的前提？", "back": "数组必须有序；每次比较中点砍半，O(log n)。", "tags": ["二分"]}, {"id": "f27", "chapterId": "ch10", "front": "100 万条记录二分最多比较几次？", "back": "约 20 次（log₂10⁶≈20）。", "tags": ["二分"]}, {"id": "f28", "chapterId": "ch10", "front": "只判存在用二分还是哈希？", "back": "无序判存在用哈希集合 O(1)；二分依赖有序。", "tags": ["搜索"]}, {"id": "f29", "chapterId": "ch11", "front": "评价排序的五个维度？", "back": "运行效率、原地性、稳定性、自适应性、是否基于比较。", "tags": ["排序"]}, {"id": "f30", "chapterId": "ch11", "front": "基于比较的排序理论最优复杂度？", "back": "O(n log n)，这是下界。", "tags": ["排序"]}, {"id": "f31", "chapterId": "ch11", "front": "小数据量且基本有序时用什么排序？", "back": "插入排序，常数小、自适应。", "tags": ["排序"]}, {"id": "f32", "chapterId": "ch11", "front": "快速排序最坏复杂度？怎么缓解？", "back": "最坏 O(n²)，用三数取中/随机基准降低概率。", "tags": ["排序"]}, {"id": "f33", "chapterId": "ch12", "front": "分治两阶段？", "back": "分（拆成独立子问题）+ 治（合并子问题解）。", "tags": ["分治"]}, {"id": "f34", "chapterId": "ch12", "front": "分治与 DP 的区别？", "back": "分治子问题独立不重叠；DP 子问题重叠。", "tags": ["分治"]}, {"id": "f35", "chapterId": "ch12", "front": "哪个排序是分治的典型应用？", "back": "归并排序（拆+合并）。", "tags": ["分治"]}, {"id": "f36", "chapterId": "ch13", "front": "回溯三大动作？", "back": "尝试（更新状态）、回退（撤销选择）、剪枝（提前停无效分支）。", "tags": ["回溯"]}, {"id": "f37", "chapterId": "ch13", "front": "回溯适合解决什么问题？", "back": "穷举所有满足约束的解（全排列、子集和、n 皇后）。", "tags": ["回溯"]}, {"id": "f38", "chapterId": "ch13", "front": "n 皇后用哪三个数组剪枝？", "back": "列、主对角线、次对角线。", "tags": ["回溯"]}, {"id": "f39", "chapterId": "ch14", "front": "DP 的三大特性？", "back": "重叠子问题、最优子结构、无后效性。", "tags": ["动态规划"]}, {"id": "f40", "chapterId": "ch14", "front": "爬楼梯的状态转移方程？", "back": "dp[i]=dp[i-1]+dp[i-2]。", "tags": ["DP"]}, {"id": "f41", "chapterId": "ch14", "front": "0-1 背包一维优化时容量怎么遍历？", "back": "倒序遍历，防止覆盖上一行未使用的值。", "tags": ["背包"]}, {"id": "f42", "chapterId": "ch14", "front": "记忆化搜索与 DP 递推的关系？", "back": "等价；前者从顶到底递归查表，后者从底到顶循环填表。", "tags": ["DP"]}, {"id": "f43", "chapterId": "ch15", "front": "贪心算法的基本思想？", "back": "每步选当前局部最优，不回看历史。", "tags": ["贪心"]}, {"id": "f44", "chapterId": "ch15", "front": "贪心保证最优需要哪两个性质？", "back": "贪心选择性质 + 最优子结构。", "tags": ["贪心"]}, {"id": "f45", "chapterId": "ch15", "front": "分数背包的贪心策略？", "back": "按单位价值从高到低装，不足按比例补满。", "tags": ["贪心"]}, {"id": "f46", "chapterId": "ch15", "front": "零钱兑换在什么硬币组合下贪心会错？", "back": "[1,20,50] 凑 60：贪心 11 枚，DP 最优 3 枚（20+20+20）。", "tags": ["贪心反例"]}]}, "pages": {"ch00": {"html": "<h1>第 0 章：前言与导读<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★☆☆ | <strong>预估学时<\/strong>：0.5 小时 | <strong>前置<\/strong>：无\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n说清这本书在教什么、按什么顺序学；\n<\/li><li>\n说出本书推荐的学习路径和每类读者该怎么读；\n<\/li><li>\n知道学习算法时&quot;多写代码、多画图&quot;的理由。\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>学算法不是背代码，而是学会&quot;用数据结构装数据、用复杂度选方法&quot;的一整套思维方式。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：这本书的定位（难度：基础）<\/h3>\n<p>《Hello 算法》是一本面向零基础的<strong>算法与数据结构<\/strong>入门书。它的目标不是让你背面试题，而是带你建立两件事：<\/p>\n<ol><li>\n<strong>数据结构<\/strong>——数据在计算机里是怎么&quot;摆&quot;的（数组、链表、栈、队列、哈希表、树、堆、图）；\n<\/li><li>\n<strong>算法效率分析<\/strong>——给定一个问题，怎么判断哪种解法快、快多少（时间/空间复杂度）。\n<\/ol>\n<p>全书用 Python 代码演示，代码都可以直接复制运行。<\/p>\n<h3>概念 2：推荐学习路径（难度：基础）<\/h3>\n<p>本书章节本身就是按认知顺序排好的，这就是一条推荐学习路径：<\/p>\n<ol><li>\n先学<strong>复杂度分析<\/strong>（第 2 章），建立&quot;快慢&quot;的尺子；\n<\/li><li>\n再学<strong>基本数据结构<\/strong>（数组链表 → 栈队列 → 哈希表 → 树 → 堆 → 图）；\n<\/li><li>\n然后学<strong>算法策略<\/strong>（搜索 → 排序 → 分治 → 回溯 → 动态规划 → 贪心）。\n<\/ol>\n<p>本书特别强调：算法和数据结构是&quot;一体两面&quot;——很多算法快，是因为用了合适的数据结构。<\/p>\n<h3>概念 3：怎么用这本书（难度：基础）<\/h3>\n<ul><li>\n<strong>动手跑代码<\/strong>：每段代码都亲手敲一遍、改一遍。看懂和写出来是两回事。\n<\/li><li>\n<strong>画图<\/strong>：树怎么遍历、递归怎么展开，光看文字容易晕，自己画一遍就通了。\n<\/li><li>\n<strong>联系生活<\/strong>：本书大量用&quot;摞盘子&quot;&quot;排队找零&quot;这类日常类比，别把它当废话，类比是帮你记牢概念的钩子。\n<\/ul>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n    A[复杂度分析&lt;br&gt;快慢的尺子] --&gt; B[数据结构&lt;br&gt;数据怎么摆]\n    A --&gt; C[算法策略&lt;br&gt;怎么解决问题]\n    B --&gt; C\n    C --&gt; D[写出更快的程序]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：这张图说明全书三大块的关系——复杂度是尺子，数据结构是地基，算法策略是盖楼；三者合起来，目标是&quot;写出更快的程序&quot;。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：学算法像学做菜。数据结构是厨具（锅、刀、砧板），算法是菜谱步骤，复杂度分析是评估&quot;这道菜几分钟能做好&quot;。<strong>失效边界<\/strong>：做菜可以凭感觉，算法必须靠公式算复杂度。\n<\/li><li>\n实例：想从 100 万条用户记录里找一个人——遍历找要看 100 万次（O(n)）；如果事先按名字建了哈希表，平均看 1 次就找到（O(1)）。这就是数据结构带来的效率差距。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;会写代码就等于会算法&quot;——实际上能跑和跑得快是两回事。同样的需求，O(n²) 的程序处理大数据量时会慢几百倍，工程上这就是事故。\n<\/li><li>\n别以为&quot;算法只对程序员有用&quot;——实际上复杂度思维能帮你判断任何&quot;规模翻倍后成本怎么涨&quot;的问题，包括日常排流程、做预算。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n（单选）本书推荐的学习起点是？ A. 动态规划 B. 复杂度分析 C. 红黑树 D. 面试题刷题（答案：B；解析：先建立&quot;快慢的尺子&quot;，后面学数据结构和算法时才有判断依据。）\n<\/li><li>\n（判断）数据结构和算法是互相独立、可以完全分开学习的两块内容。（答案：错误；解析：本书强调二者是一体两面，很多算法之所以快，正因为借助了合适的数据结构。）\n<\/li><li>\n（填空）评估一个算法快不快的量化工具是____分析。（答案：复杂度（时间/空间复杂度）。）\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n全书三件套：复杂度（尺子）、数据结构（地基）、算法策略（盖楼）。\n<\/li><li>\n学习路径：复杂度 → 基本数据结构 → 搜索/排序 → 分治/回溯/DP/贪心。\n<\/li><li>\n学法：亲手跑代码 + 画图 + 借助类比。\n<\/ul>", "kind": "chapter", "title": "第 0 章：前言与导读"}, "ch01": {"html": "<h1>第 1 章：初识算法<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★☆☆ | <strong>预估学时<\/strong>：1 小时 | <strong>前置<\/strong>：第 0 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n用自己的话说出&quot;算法&quot;是什么；\n<\/li><li>\n识别出生活中处处存在的算法；\n<\/li><li>\n看懂书中用斐波那契数列引出的&quot;为什么要学算法&quot;。\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>算法就是&quot;解决一个特定问题的、一系列清晰可执行的操作步骤&quot;。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：算法（algorithm）（难度：基础）<\/h3>\n<p><strong>算法<\/strong>是解决一个特定问题的有限操作序列：给你输入，它按固定步骤执行，最后给出输出。一个合格的算法要满足：有明确的输入输出、每一步含义清晰、步骤有限不会无限转下去。<\/p>\n<p>注意：算法不只是&quot;代码里的东西&quot;。你每天做的很多事本身就是算法：<\/p>\n<ul><li>\n<strong>泡方便面<\/strong>：烧水 → 放料 → 等 3 分钟 → 开吃。每一步有先后顺序。\n<\/li><li>\n<strong>导航 App<\/strong>：从你出发，一步一步算到目的地的路线。\n<\/ul>\n<h3>概念 2：本书的贯穿例子——斐波那契数列（难度：基础）<\/h3>\n<p><strong>斐波那契数列<\/strong>：1, 1, 2, 3, 5, 8, 13, … 从第 3 项起，每一项等于前两项之和。求第 n 项 F(n)：<\/p>\n<pre class=\"lang-python\"><code>def fib(n):\n    if n == 1 or n == 2:\n        return 1\n    return fib(n - 1) + fib(n - 2)<\/code><\/pre>\n<p>这个递归写法虽然短，但当 n 变大时会慢得离谱（后面会讲：它是指数级 O(2ⁿ)）。这个例子在第 2 章会被反复拿出来对比——同一个问题，写法不同，效率天差地别。这就是&quot;初识算法&quot;要种下的第一颗种子。<\/p>\n<h3>概念 3：为什么算法无处不在（难度：基础）<\/h3>\n<p>搜索推荐、外卖派单、地图导航、人脸识别……背后都是&quot;在海量数据里按某种规则快速找出最优解&quot;的问题。算法的本质作用是：<strong>用更少的步骤，得到正确的答案<\/strong>。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n    In[输入] --&gt; S1[步骤1] --&gt; S2[步骤2] --&gt; S3[步骤N] --&gt; Out[输出]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：算法的通用形态就是一条&quot;输入 → 一串明确步骤 → 输出&quot;的流水线。判断它是不是好算法，就看两件事：结果对不对、步骤多不多。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：算法像菜谱。食材是输入，步骤是算法，端上桌的菜是输出。<strong>失效边界<\/strong>：菜谱可以&quot;加盐少许&quot;这种模糊描述，计算机算法必须每一步精确到可执行。\n<\/li><li>\n实例：找&quot;从家到学校怎么走&quot;——你可以先走遍每条路再挑最短（暴力），也可以只沿大路估算（启发式）。选择哪种&quot;步骤序列&quot;，就是在选择算法。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为算法是数学家的专利——实际上它就是&quot;做事的固定步骤&quot;，你每天都在执行各种算法。\n<\/li><li>\n别以为&quot;能算出答案的就是好算法&quot;——实际上同一个斐波那契问题，递归版 n=50 时要算几小时，递推版几毫秒就出答案。算法的优劣体现在效率上。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n（单选）下列哪项最符合本书对算法的定义？ A. 一段能跑的代码 B. 解决特定问题的一系列清晰可执行的操作步骤 C. 一个数学公式 D. 一个软件界面（答案：B；解析：算法强调&quot;输入→有限步骤→输出&quot;，代码只是它的一种实现载体。）\n<\/li><li>\n（填空）斐波那契数列中，F(n) = ______（用前两项表示）。（答案：F(n-1) + F(n-2)；解析：从第 3 项起，每一项等于前两项之和。）\n<\/li><li>\n（判断）一个算法只要能得到正确答案，就是好算法。（答案：错误；解析：好算法还要看效率（时间/空间开销），这正是第 2 章的主题。）\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n算法 = 解决特定问题的有限清晰步骤序列。\n<\/li><li>\n同一个问题可以有多个算法，优劣看效率。\n<\/li><li>\n斐波那契递归例子预告了&quot;指数级慢&quot;的问题。\n<\/ul>", "kind": "chapter", "title": "第 1 章：初识算法"}, "ch02": {"html": "<h1>第 2 章：复杂度分析<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：2.5 小时 | <strong>前置<\/strong>：第 1 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n区分时间复杂度与空间复杂度，并用大 O 记号表示；\n<\/li><li>\n看懂迭代与递归代码，估算它们的复杂度；\n<\/li><li>\n记住常见复杂度的大小排序，并据此比较算法快慢；\n<\/li><li>\n理解最坏/最好/平均时间复杂度的区别。\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>复杂度是算法效率的&quot;度量衡&quot;：大 O 记号描述输入规模 n 变大时，运行时间或内存占用大致涨多快。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：为什么要复杂度分析（难度：基础）<\/h3>\n<p>同一问题可以写多个程序。直接拿秒表测时间不公平——换台电脑结果就变了。复杂度分析<strong>不看具体秒数，只看&quot;随输入规模 n 增长&quot;的趋势<\/strong>：当数据量从 1 万涨到 1 亿，时间是涨 1 万倍还是涨 1 亿倍？这个趋势与机器快慢无关，是算法本身的属性。<\/p>\n<h3>概念 2：时间复杂度（time complexity）（难度：基础）<\/h3>\n<p>统计代码里基本操作（一次赋值、一次比较）的执行次数，把它写成 n 的函数，然后<strong>只保留最高阶项、丢掉系数<\/strong>，就是大 O 时间复杂度。<\/p>\n<pre class=\"lang-python\"><code>def sum_n(n):\n    s = 0\n    for i in range(1, n + 1):   # 循环 n 次\n        s += i                  # 每次 1 次加法\n    return s<\/code><\/pre>\n<p>基本操作 ≈ n 次 → 时间复杂度 <strong>O(n)<\/strong>。<\/p>\n<pre class=\"lang-python\"><code>def sum_n2(n):\n    s = 0\n    for i in range(1, n + 1):\n        for j in range(1, n + 1):  # 外层 n 次 × 内层 n 次\n            s += 1\n    return s<\/code><\/pre>\n<p>基本操作 ≈ n×n = n² 次 → 时间复杂度 <strong>O(n²)<\/strong>。<\/p>\n<h3>概念 3：大 O / 大 Ω / 大 Θ（难度：进阶）<\/h3>\n<ul><li>\n<strong>大 O（渐近上界）<\/strong>：当 n 很大时，运行时间&quot;不超过&quot;某个量级。它描述<strong>最差情况下<\/strong>增长得有多快，是最常用的。\n<\/li><li>\n<strong>大 Ω（渐近下界）<\/strong>：运行时间&quot;至少&quot;达到某个量级。\n<\/li><li>\n<strong>大 Θ（渐近紧界）<\/strong>：运行时间&quot;恰好是&quot;这个量级，上下界一致。\n<\/ul>\n<p>日常分析里默认用大 O。<\/p>\n<h3>概念 4：常见时间复杂度排序（难度：基础，必须背）<\/h3>\n<p>从快到慢：<\/p>\n<p><strong>O(1) 常数 &lt; O(log n) 对数 &lt; O(n) 线性 &lt; O(n log n) &lt; O(n²) 平方 &lt; O(2ⁿ) 指数 &lt; O(n!) 阶乘<\/strong><\/p>\n<p>记忆锚点：n=10 亿时，O(n) 要算 10 亿次，O(log n) 只要约 30 次，O(n²) 要算 10¹⁸ 次——指数阶在 n 稍大时就完全不可行。<\/p>\n<h3>概念 5：迭代 vs 递归（难度：进阶）<\/h3>\n<ul><li>\n<strong>迭代（iteration）<\/strong>：用循环一步步推进。\n<\/li><li>\n<strong>递归（recursion）<\/strong>：函数自己调用自己，必须有一个<strong>终止条件<\/strong>，否则无限调用下去栈溢出。\n<\/li><li>\n<strong>调用栈<\/strong>：每一层未返回的递归函数都占一块内存；递归越深，栈占用越大。\n<\/li><li>\n<strong>尾递归<\/strong>：把递归调用放在函数最后一步，理论上可被优化；Python 默认不做尾递归优化，所以递归深度受栈大小限制。\n<\/ul>\n<p>斐波那契递归 <code>fib(n)=fib(n-1)+fib(n-2)<\/code> 展开成一棵重复子问题极多的递归树 → <strong>O(2ⁿ)<\/strong>；改成从 1 递推到 n 的循环 → <strong>O(n)<\/strong>。<\/p>\n<h3>概念 6：空间复杂度（space complexity）（难度：基础）<\/h3>\n<p>统计算法运行中额外占用的内存（数组大小、递归栈深度）随 n 的增长：<\/p>\n<pre class=\"lang-python\"><code>def array(n):\n    nums = [0] * n     # 开了 n 个元素的数组\n    return nums<\/code><\/pre>\n<p>→ 空间复杂度 <strong>O(n)<\/strong>。若只用几个变量，不开数组、不深递归 → <strong>O(1)<\/strong>（原地/常数空间）。<\/p>\n<p>常见空间复杂度排序：O(1) &lt; O(log n) &lt; O(n) &lt; O(n²) &lt; O(2ⁿ)。<\/p>\n<h3>概念 7：最坏 / 最好 / 平均时间复杂度（难度：进阶）<\/h3>\n<ul><li>\n<strong>最坏<\/strong>：输入最不利时（比如要找的数正好在数组末尾），复杂度上界——最关心。\n<\/li><li>\n<strong>最好<\/strong>：输入最有利时。\n<\/li><li>\n<strong>平均<\/strong>：所有可能输入的期望。\n<p>大多数工程问题默认按最坏情况做复杂度分析，这样性能才有保证。<\/p>\n<\/ul>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">xychart-beta\n    title &quot;常见时间复杂度增长对比（n 从 1 到 100）&quot;\n    x-axis [1, 10, 20, 50, 100]\n    y-axis &quot;操作次数（对数感受）&quot; 0 --&gt; 10000\n    line &quot;O(log n)&quot; [0, 3, 4, 6, 7]\n    line &quot;O(n)&quot; [1, 10, 20, 50, 100]\n    line &quot;O(n log n)&quot; [1, 33, 86, 282, 664]\n    line &quot;O(n^2)&quot; [1, 100, 400, 2500, 10000]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：同样输入规模 n，O(n²) 的操作数随 n 暴涨，O(log n) 几乎是平的。这就是&quot;选对算法&quot;的价值。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：复杂度像&quot;打车计价的增长规律&quot;。O(n) 是按公里线性跳表；O(n²) 是公里数翻倍、钱翻四倍；O(2ⁿ) 是公里数翻倍、钱翻一倍再乘自己——这种表你根本不敢上。<strong>失效边界<\/strong>：大 O 只管大 n 的趋势，数据量极小时 O(n²) 可能因为代码简单反而比 O(n log n) 快（常数项胜出）。\n<\/li><li>\n实例：在 100 万条记录里查一条。顺序查找 O(n)≈100 万次；二分查找 O(log n)≈20 次；斐波那契暴力递归 O(2ⁿ) 则完全跑不动。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;代码短就快&quot;——实际上递归版斐波那契只有两行，却是 O(2ⁿ) 的灾难；递推版多写几行，却是 O(n)。\n<\/li><li>\n别以为大 O 是精确运行时间——实际上它只保留最高阶、丢系数，O(2n) 和 O(n) 都是 O(n)。\n<\/li><li>\n别以为递归一定优雅高效——实际上每一层都占调用栈内存，且没有尾递归优化时深度大了会栈溢出。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n（单选）双重循环各执行 n 次的代码，时间复杂度是？ A. O(n) B. O(2n) C. O(n²) D. O(n³)（答案：C；解析：n×n=n²，大 O 丢系数后为 O(n²)。）\n<\/li><li>\n（排序）把下列复杂度按从快到慢排列：O(n!)、O(log n)、O(2ⁿ)、O(n)、O(1)。（答案：O(1) &lt; O(log n) &lt; O(n) &lt; O(2ⁿ) &lt; O(n!)；解析：这是必须背熟的复杂度阶序。）\n<\/li><li>\n（单选）分析算法复杂度时最常默认看哪种情况？ A. 最好 B. 最坏 C. 平均 D. 随机（答案：B；解析：按最坏情况分析，性能才有保证。）\n<\/li><li>\n（填空）递归函数必须有______条件，否则会无限调用导致栈溢出。（答案：终止/基线；解析：这是递归成立的前提。）\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n大 O 只留最高阶、丢系数，描述 n 很大时的增长趋势。\n<\/li><li>\n阶序口诀：常数 &lt; 对数 &lt; 线性 &lt; n log n &lt; 平方 &lt; 指数 &lt; 阶乘。\n<\/li><li>\n递归 = 自己调自己 + 终止条件；每层占调用栈。\n<\/li><li>\n默认按最坏情况分析复杂度。\n<\/ul>", "kind": "chapter", "title": "第 2 章：复杂度分析"}, "ch03": {"html": "<h1>第 3 章：数据结构<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★☆☆ | <strong>预估学时<\/strong>：1.5 小时 | <strong>前置<\/strong>：第 2 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n说出数据结构的两大类及其区别；\n<\/li><li>\n认识计算机最基本的数据类型；\n<\/li><li>\n理解为什么要区分&quot;数据结构&quot;这个概念本身。\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>数据结构是数据在计算机里的&quot;摆放方式&quot;——不同摆法决定了增删查改各自的快慢。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：数据结构的两大分类（难度：基础）<\/h3>\n<p><strong>数据结构<\/strong>指一组数据的组织与存储方式。本书把它分为两大类：<\/p>\n<ol><li>\n<strong>逻辑结构<\/strong>：数据之间&quot;逻辑上&quot;的关系，与具体存储无关。包括：\n<ul>\n<li>\n线性结构（数组、链表、栈、队列）：数据排成一条线；\n<\/li><li>\n非线性结构（树、图、堆、哈希表）：数据是层次或网状关系。\n<\/li><li>\n<strong>物理结构（存储结构）<\/strong>：数据在内存里&quot;实际怎么放&quot;，分两种：\n<\/li><li>\n<strong>连续内存<\/strong>（如数组）：元素紧挨在一起，靠下标直接算位置；\n<\/li><li>\n<strong>分散内存 + 指针串联<\/strong>（如链表）：元素各处存放，每个元素记着下一个在哪。\n<\/ul>\n<\/ol>\n<p>同一种逻辑结构可以用不同物理方式存。<\/p>\n<h3>概念 2：基本数据类型（难度：基础）<\/h3>\n<p>程序里最底层的数据单位：整数 int、浮点数 float、字符 char、布尔 bool。它们由编程语言直接提供，占固定字节数。理解它们是理解&quot;编码&quot;（数字怎么转二进制、字符怎么编码）的起点。<\/p>\n<h3>概念 3：数字编码与字符编码（难度：进阶）<\/h3>\n<ul><li>\n整数在计算机里以<strong>补码<\/strong>存储（负数用补码表示），这样加减法统一。\n<\/li><li>\n字符用编码表映射成数字：英文字符用 ASCII，中文用 Unicode/UTF-8。\n<p>这些是&quot;懂底层&quot;的加分项，但不是本书主线——主线是用这些基本类型去搭更复杂的数据结构。<\/p>\n<\/ul>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">mindmap\n  root((数据结构))\n    逻辑结构\n      线性\n        数组\n        链表\n        栈\n        队列\n      非线性\n        树\n        堆\n        图\n        哈希表\n    物理结构\n      连续内存 数组\n      分散内存+指针 链表<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：左半边是&quot;数据之间什么关系&quot;（逻辑），右半边是&quot;在内存里怎么放&quot;（物理）。后面每章学的都是一个具体成员。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：数据结构像整理衣柜。叠好竖放进格（连续内存）拿一件快但不好塞新的；一件件挂起来（链表）增减灵活但找一件要从头顺着挂钩摸。<strong>失效边界<\/strong>：真实衣柜可以随手塞，计算机内存分配必须规整。\n<\/li><li>\n实例：全班成绩——要快速按学号第 37 名找人，用数组（连续存储、下标直达）最合适；要频繁在中间插入新同学名单，链表更省事。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;数据结构就是数组和链表&quot;——实际上数组链表只是线性存储，树、图、哈希表都属于数据结构大家族。\n<\/li><li>\n别以为逻辑结构和存储结构是一回事——实际上&quot;一条线&quot;这个逻辑可以用连续内存存，也可以用指针串起来存。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n（单选）下列哪种属于非线性数据结构？ A. 数组 B. 链表 C. 树 D. 队列（答案：C；解析：树是层次关系，其余三者都是线性结构。）\n<\/li><li>\n（填空）数组在内存中用______内存存储，链表用分散内存加______串联。（答案：连续；指针；解析：这是两种物理结构的典型代表。）\n<\/li><li>\n（判断）同一种逻辑结构只能用一种物理结构存储。（答案：错误；解析：逻辑结构与物理结构是两个维度，可自由组合。）\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n数据结构 = 逻辑结构（线性/非线性）× 物理结构（连续/指针）。\n<\/li><li>\n基本数据类型是搭一切的积木。\n<\/li><li>\n选数据结构 = 选&quot;哪种操作快&quot;。\n<\/ul>", "kind": "chapter", "title": "第 3 章：数据结构"}, "ch04": {"html": "<h1>第 4 章：数组与链表<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：2.5 小时 | <strong>前置<\/strong>：第 3 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n说出数组和链表各自的增删查改复杂度；\n<\/li><li>\n解释为什么数组随机访问快、插入删除慢；\n<\/li><li>\n理解动态数组（列表）是怎么&quot;自动扩容&quot;的；\n<\/li><li>\n了解缓存为什么让连续内存更快。\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>数组靠下标直达、查找快但插入慢；链表靠指针串联、插入快但查找慢——两者用空间布局的差异换来了不同操作的快慢。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：数组（array）（难度：基础）<\/h3>\n<p><strong>数组<\/strong>是连续内存中存放的一组相同类型元素。因为连续，计算机只要用&quot;起始地址 + 下标 × 元素大小&quot;就能算出任意元素的位置：<\/p>\n<pre class=\"lang-python\"><code>arr = [10, 20, 30, 40]\nprint(arr[2])   # 直接定位到第 3 个元素：30，O(1)<\/code><\/pre>\n<ul><li>\n<strong>随机访问<\/strong>：按下标取元素 O(1)，极快。\n<\/li><li>\n<strong>插入/删除<\/strong>：要把后面所有元素平移挪位置，平均 O(n)。\n<\/li><li>\n长度固定时无法追加；放不下就得整块搬到更大的新数组。\n<\/ul>\n<h3>概念 2：链表（linked list）（难度：基础）<\/h3>\n<p><strong>链表<\/strong>的元素叫<strong>节点<\/strong>，分散在内存各处，每个节点除了存数据，还存着下一个节点的指针：<\/p>\n<pre class=\"lang-python\"><code>class ListNode:\n    def __init__(self, val):\n        self.val = val      # 节点存的数据\n        self.next = None    # 指向下一个节点<\/code><\/pre>\n<ul><li>\n<strong>插入/删除<\/strong>：改两个指针就行，找到位置后 O(1)。\n<\/li><li>\n<strong>查找<\/strong>：没有下标，只能从头一个一个顺着指针走，O(n)。\n<\/ul>\n<h3>概念 3：动态数组（dynamic array / 列表）（难度：进阶）<\/h3>\n<p>Python 的 <code>list<\/code> 就是动态数组：底层是连续数组，放不下时<strong>自动扩容<\/strong>（分配一块更大的新内存，把旧元素整体搬过去）。所以你可以自由 append。扩容是偶尔发生的 O(n) 搬迁，但均摊到每次 append 上，平均仍是 O(1)（均摊复杂度）。<\/p>\n<pre class=\"lang-python\"><code>lst = [1, 2, 3]\nlst.append(4)   # 自动扩容，平均 O(1)<\/code><\/pre>\n<h3>概念 4：内存与缓存（cache）（难度：进阶）<\/h3>\n<p>CPU 读内存时，会把相邻的一块数据一起搬进高速缓存。数组连续存放，访问一个元素后，后面的元素很可能已在缓存里 → 遍历时飞快。链表节点分散，每次都可能&quot;缓存未命中&quot; → 即使都是 O(n)，数组遍历实际也快得多。这解释了为什么工程上数组常常比链表更受欢迎。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n    subgraph 数组[&quot;数组（连续内存）&quot;]\n        A1[&quot;10&quot;] --- A2[&quot;20&quot;] --- A3[&quot;30&quot;] --- A4[&quot;40&quot;]\n    end\n    subgraph 链表[&quot;链表（分散+指针）&quot;]\n        B1[&quot;10 |···→&quot;] -.-&gt; B2[&quot;20 |···→&quot;] -.-&gt; B3[&quot;30 |···→&quot;] -.-&gt; B4[&quot;40 | ∅&quot;]\n    end<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：上排是数组——格子紧挨，靠下标直接跳；下排是链表——节点四散，靠箭头指引下一个。这就是两者所有性能差异的根源。<\/p>\n<table><thead><tr><th>操作<\/th><th>数组<\/th><th>链表<\/th><\/tr><\/thead><tbody><tr><td>按下标查<\/td><td>O(1)<\/td><td>O(n)<\/td><\/tr><tr><td>头部插入<\/td><td>O(n)<\/td><td>O(1)<\/td><\/tr><tr><td>尾部插入<\/td><td>动态数组均摊 O(1)<\/td><td>需遍历到尾 O(n)<\/td><\/tr><tr><td>中间插入<\/td><td>O(n)<\/td><td>定位后 O(1)<\/td><\/tr><\/tbody><\/table>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：数组像一排编好号的储物柜，开 37 号直接走过去（随机访问快）；但要在中间插入一格，后面所有柜子编号都得重排。链表像寻宝游戏，每个地点写着下一个地点的地址——加一个点只要改一句提示，可你要找第 37 个点只能从头一个个找。<strong>失效边界<\/strong>：数组长度固定后不能原地变长，扩容要整块搬迁。\n<\/li><li>\n实例：统计全班成绩总和——数组连续遍历，缓存命中快；如果成绩存在一个链表文件里，虽然也是 O(n)，实际慢好几倍。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;链表插入删除总是 O(1)&quot;——实际上找到插入位置本身就要 O(n)，O(1) 只是&quot;找到之后&quot;的指针改动。\n<\/li><li>\n别以为动态数组 append 永远瞬间完成——实际上偶尔要整体搬迁扩容（O(n)），只是均摊后平均 O(1)。\n<\/li><li>\n别以为复杂度相同就一样快——实际上数组因缓存命中，遍历常数比链表小得多。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n（单选）数组按下标随机访问的时间复杂度是？ A. O(1) B. O(log n) C. O(n) D. O(n²)（答案：A；解析：连续内存直接算地址。）\n<\/li><li>\n（单选）在链表中根据序号查找第 k 个节点的复杂度是？ A. O(1) B. O(log n) C. O(n) D. O(n²)（答案：C；解析：链表无下标，只能顺指针逐个走。）\n<\/li><li>\n（填空）Python 的 list 是______数组，放不下时会自动______。（答案：动态；扩容（整体搬迁到更大内存）；解析：这是均摊 O(1) append 的原理。）\n<\/li><li>\n（简答）为什么连续内存的数组遍历比链表快？（答案：CPU 缓存会把相邻数据一起载入，数组连续命中缓存；链表节点分散频繁缓存未命中。）\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n数组：连续内存，随机访问 O(1)，插入删除 O(n)。\n<\/li><li>\n链表：节点+指针，插入 O(1)，查找 O(n)。\n<\/li><li>\n动态数组 = 固定数组 + 自动扩容，均摊 O(1)。\n<\/li><li>\n缓存让连续内存更划算。\n<\/ul>", "kind": "chapter", "title": "第 4 章：数组与链表"}, "ch05": {"html": "<h1>第 5 章：栈与队列<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★☆☆ | <strong>预估学时<\/strong>：1.5 小时 | <strong>前置<\/strong>：第 4 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n说出栈&quot;后进先出&quot;和队列&quot;先进先出&quot;的规则；\n<\/li><li>\n知道栈和队列分别适合解决什么问题；\n<\/li><li>\n理解双向队列的特点；\n<\/li><li>\n看懂栈在递归（函数调用）中的作用。\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>栈是&quot;后进先出&quot;的一摞盘子，队列是&quot;先进先出&quot;的排队通道——它们是加了访问限制的线性结构。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：栈（stack）（难度：基础）<\/h3>\n<p><strong>栈<\/strong>只允许在同一端（<strong>栈顶<\/strong>）放入和取出，规则是<strong>后进先出（LIFO, Last In First Out）<\/strong>：<\/p>\n<pre class=\"lang-python\"><code>stack = []\nstack.append(1)   # 入栈\nstack.append(2)\nstack.pop()       # 出栈：取出 2（最后放的最先走）<\/code><\/pre>\n<ul><li>\n入栈 push、出栈 pop 都只动栈顶，O(1)。\n<\/li><li>\n应用：浏览器&quot;后退&quot;、括号匹配、函数调用栈（每层函数就是一个栈帧）。\n<\/ul>\n<h3>概念 2：队列（queue）（难度：基础）<\/h3>\n<p><strong>队列<\/strong>在一端（<strong>队尾<\/strong>）进、另一端（<strong>队首<\/strong>）出，规则是<strong>先进先出（FIFO, First In First Out）<\/strong>：<\/p>\n<pre class=\"lang-python\"><code>from collections import deque\nq = deque()\nq.append(1)   # 入队（队尾）\nq.append(2)\nq.popleft()   # 出队（队首）：取出 1<\/code><\/pre>\n<ul><li>\n应用：排队叫号、消息缓冲、BFS 广度优先搜索（后面第 9 章会用到）。\n<\/ul>\n<h3>概念 3：双向队列（deque）（难度：进阶）<\/h3>\n<p><strong>双向队列<\/strong>两端都能进出，是栈和队列的合体。Python 的 <code>collections.deque<\/code> 就是它，头尾增删都是 O(1)，比 list 在头部删除（O(n)）高效。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TB\n    subgraph 栈[&quot;栈：后进先出（从顶端进出）&quot;]\n        direction LR\n        T[&quot;栈顶 ← 最新&quot;] --- M[&quot;...&quot;] --- B[&quot;栈底 ← 最早&quot;]\n    end\n    subgraph 队列[&quot;队列：先进先出（尾进首出）&quot;]\n        direction LR\n        F[&quot;队首 ← 最先进&quot;] --- Q1[&quot;...&quot;] --- R[&quot;队尾 ← 最新进&quot;]\n    end<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：栈只有一个开口（顶端），后放的先拿；队列有两个开口，先排的先服务。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：栈像一摞叠好的盘子——你只能从最上面拿走一个，最后放上去的最先被拿走。队列像高铁站检票口——先到的先检票。<strong>失效边界<\/strong>：盘子摞太高会塌，栈太深会栈溢出（递归过深）。\n<\/li><li>\n实例：浏览器点&quot;后退&quot;，就是把访问过的页面压栈，后退时弹栈。函数 A 调用 B 调用 C，C 结束后回到 B、再回到 A——这正是调用栈的 LIFO 顺序。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为栈和队列是两种全新的内存结构——实际上它们通常就是用数组或链表&quot;加限制&quot;实现的，限制的是&quot;只能在哪端动&quot;。\n<\/li><li>\n别以为 list 的 append/pop 可以高效当队列用——实际上 list 在头部删除（pop(0)）是 O(n)，队列应该用 deque。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n（单选）栈的访问规则是？ A. 先进先出 B. 后进先出 C. 随机访问 D. 双向进出（答案：B；解析：LIFO。）\n<\/li><li>\n（单选）广度优先搜索（BFS）通常借助哪种结构实现？ A. 栈 B. 队列 C. 哈希表 D. 树（答案：B；解析：BFS 按层先来后到地展开，天然是 FIFO 队列。）\n<\/li><li>\n（填空）函数 A 调 B 调 C，C 执行完后先回到______，这是调用栈的______规则。（答案：B；后进先出/LIFO；解析：最后压栈的函数先返回。）\n<\/li><li>\n（判断）用 Python list 的 pop(0) 模拟队列是高效做法。（答案：错误；解析：list 头部删除要平移 O(n)，队列应使用 deque.popleft()，O(1)。）\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n栈 LIFO：后进先出，用于括号匹配、后退、函数调用。\n<\/li><li>\n队列 FIFO：先进先出，用于排队、BFS。\n<\/li><li>\ndeque 两端都能 O(1) 进出。\n<\/ul>", "kind": "chapter", "title": "第 5 章：栈与队列"}, "ch06": {"html": "<h1>第 6 章：哈希表<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：2 小时 | <strong>前置<\/strong>：第 4 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n说清哈希表为什么能做到 O(1) 查找；\n<\/li><li>\n理解哈希冲突及两种解决办法；\n<\/li><li>\n知道负载因子与扩容的关系；\n<\/li><li>\n识别哈希表的典型应用场景。\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>哈希表用&quot;哈希函数把键映射成桶编号&quot;，把查找从 O(n) 降到平均 O(1)，代价是要处理碰撞。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：哈希表（hash table）（难度：基础）<\/h3>\n<p><strong>哈希表<\/strong>存的是&quot;键值对&quot;（key → value）。它有一个数组（若干<strong>桶<\/strong>），外加一个<strong>哈希函数<\/strong>：给它一个 key，它算出一个桶编号，把 value 放进去：<\/p>\n<pre class=\"lang-python\"><code>hmap = {&quot;张三&quot;: 98, &quot;李四&quot;: 87}\nprint(hmap[&quot;张三&quot;])   # 直接算出&quot;张三&quot;在哪个桶 → 98，平均 O(1)<\/code><\/pre>\n<p>查找时同样算一次哈希函数，直达那个桶，不用逐个翻——这就是 O(1) 的来源。<\/p>\n<h3>概念 2：哈希冲突（hash collision）（难度：进阶）<\/h3>\n<p>不同的 key 算出同一个桶编号，就是<strong>哈希冲突<\/strong>。两种主流解决办法：<\/p>\n<ol><li>\n<strong>链式地址<\/strong>：每个桶挂一条链表，冲突的元素都链在同一桶里。\n<\/li><li>\n<strong>开放寻址<\/strong>：冲突时按规则向后探测下一个空桶放进去。\n<\/ol>\n<h3>概念 3：负载因子与扩容（难度：进阶）<\/h3>\n<p><strong>负载因子<\/strong> = 元素总数 ÷ 桶总数。装太满，冲突变多，查找退化。一般设定一个阈值（如 2/3），超过就扩容（桶数翻倍、重新哈希）。这和动态数组扩容是一个思路：用偶尔的大开销，换长期的平均高效。<\/p>\n<h3>概念 4：好的哈希函数（难度：进阶）<\/h3>\n<p>目标：让 key 均匀分布到各个桶，减少冲突。简单做法如&quot;把 key 的字符编码加起来再对桶数取模&quot;。过于聚集的哈希函数会让大量 key 挤进少数桶。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n    K[&quot;key: 张三&quot;] --&gt; H[&quot;哈希函数&lt;br&gt;hash(张三) mod 桶数 = 2&quot;]\n    H --&gt; B2[&quot;桶2: (张三,98)→(王五,76)→∅&quot;]\n    B0[&quot;桶0: 空&quot;]\n    B1[&quot;桶1: (李四,87)&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：哈希函数把&quot;张三&quot;直接算到桶 2，查找时再算一次就能定位；桶 2 里挂了两个元素（发生过冲突，用链表串起来）。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：哈希表像图书索引卡片柜。每个书名经过索引规则算出抽屉编号，卡片就塞进那个抽屉——找书时不用翻遍所有抽屉。<strong>失效边界<\/strong>：两本书算出同一抽屉号（冲突），就得在同一抽屉里挂多张卡片（链地址），查找退化成 O(链表长度)。\n<\/li><li>\n实例：统计一篇文章每个单词出现几次——字典 hmap[word] += 1，O(1) 每次，比双重循环两两比较快得多。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为哈希表查找&quot;永远&quot;O(1)——实际上若哈希函数很烂，所有 key 挤进一个桶，就退化成 O(n) 遍历链表。\n<\/li><li>\n别以为冲突是 bug——实际上冲突不可避免，哈希表设计的核心恰恰就是怎么处理冲突。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n（单选）哈希表平均查找一个键值对的复杂度是？ A. O(1) B. O(log n) C. O(n) D. O(n²)（答案：A；解析：哈希函数直达桶。）\n<\/li><li>\n（填空）不同 key 算出同一桶编号叫______，常见解法有链式地址和______寻址。（答案：哈希冲突；开放；解析：两者是教材给的两大方案。）\n<\/li><li>\n（判断）负载因子越大，哈希表查找越快。（答案：错误；解析：负载因子过大导致冲突增多、查找退化，需要扩容。）\n<\/li><li>\n（简答）为什么说哈希表是&quot;用空间换时间&quot;？（答案：它要开足够多的桶并预留空闲（负载因子 &lt; 1），牺牲一部分内存换取 O(1) 直达查找。）\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n哈希表 = 数组桶 + 哈希函数，键值对 O(1) 直达。\n<\/li><li>\n冲突必然发生：链式地址 / 开放寻址。\n<\/li><li>\n负载因子超阈值就扩容重哈希。\n<\/ul>", "kind": "chapter", "title": "第 6 章：哈希表"}, "ch07": {"html": "<h1>第 7 章：树（二叉树）<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：3.5 小时 | <strong>前置<\/strong>：第 4 章、第 5 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n说出二叉树的基本术语与形态；\n<\/li><li>\n写出前/中/后序、层序四种遍历；\n<\/li><li>\n理解二叉搜索树的性质与查找复杂度；\n<\/li><li>\n知道平衡树（AVL）为什么重要。\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>树是层次结构：每个节点最多两个子节点就是二叉树；四种遍历按&quot;根&quot;的位置区分；二叉搜索树让查找变成 O(log n)。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：二叉树（binary tree）（难度：基础）<\/h3>\n<p><strong>树<\/strong>由节点和边组成，有一个<strong>根节点<\/strong>，每个节点有零个或多个子节点。<strong>二叉树<\/strong>规定每个节点最多两个子节点（左子节点、右子节点）。没有子节点的叫<strong>叶节点<\/strong>。<\/p>\n<pre class=\"lang-python\"><code>class TreeNode:\n    def __init__(self, val):\n        self.val = val\n        self.left = None    # 左子节点\n        self.right = None   # 右子节点<\/code><\/pre>\n<p>相关术语：<strong>层<\/strong>（根是第 0 层）、<strong>高度<\/strong>（到最远叶节点的边数）、<strong>度<\/strong>（子节点个数）。特殊形态：完美二叉树、完全二叉树、满二叉树、平衡二叉树。<\/p>\n<h3>概念 2：四种遍历（难度：进阶）<\/h3>\n<p>遍历就是&quot;按什么顺序访问每个节点一次&quot;：<\/p>\n<ul><li>\n<strong>前序遍历<\/strong>：根 → 左 → 右\n<\/li><li>\n<strong>中序遍历<\/strong>：左 → 根 → 右\n<\/li><li>\n<strong>后序遍历<\/strong>：左 → 右 → 根\n<\/li><li>\n<strong>层序遍历<\/strong>：从上到下、每层从左到右（用队列）\n<\/ul>\n<pre class=\"lang-python\"><code>def preorder(node, res):\n    if node is None:\n        return\n    res.append(node.val)      # 根\n    preorder(node.left, res)  # 左\n    preorder(node.right, res) # 右<\/code><\/pre>\n<p>中序遍历二叉搜索树会得到一个升序序列——这是后面用它做查找的关键。<\/p>\n<h3>概念 3：二叉树的数组表示（难度：进阶）<\/h3>\n<p>完全二叉树可以紧凑地存在数组里：节点 i 的左孩子是 2i+1，右孩子是 2i+2。下一章的堆就是这样存的。<\/p>\n<h3>概念 4：二叉搜索树（binary search tree, BST）（难度：进阶）<\/h3>\n<p><strong>二叉搜索树<\/strong>规定：左子树所有节点值 &lt; 根 &lt; 右子树所有节点值。查找时和目标比大小，每次砍掉一半子树 → O(log n)。<\/p>\n<pre><code>        4\n       / \\\n      2   6\n     / \\ / \\\n    1  3 5  7<\/code><\/pre>\n<p>找 5：4→6→5，三次定位。但如果树严重倾斜（退化成链表），就退化回 O(n)。<\/p>\n<h3>概念 5：AVL 树与平衡（难度：高难）<\/h3>\n<p><strong>AVL 树<\/strong>是一种自平衡二叉搜索树：任何节点的左右子树高度差（平衡因子）不超过 1，插入删除时通过旋转自动重新平衡。这样查找稳定在 O(log n)。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    R[&quot;根节点 4&quot;] --&gt; L[&quot;左 2&quot;] --&gt; L1[&quot;1&quot;]\n    R --&gt; Rr[&quot;右 6&quot;] --&gt; R1[&quot;5&quot;]\n    L --&gt; L2[&quot;3&quot;]\n    Rr --&gt; R2[&quot;7&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：这是一棵二叉搜索树。中序遍历它得到 1,2,3,4,5,6,7——有序。查找任意值最多走 3 层 = O(log n)。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：二叉树像家谱树或公司组织架构图——一个领导管两个副手，副手再各管两个。<strong>失效边界<\/strong>：真实组织可以一个人管十几个人，二叉树规定最多两个孩子。\n<\/li><li>\n实例：查字典用二叉搜索树——每翻一页砍掉一半候选页，log n 步内定位。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;树就是复杂的东西所以一定慢&quot;——实际上平衡树每次砍掉一半，比链表逐个找快得多。\n<\/li><li>\n别以为二叉搜索树永远 O(log n)——实际上插入数据有序时它会退化成一条斜链，变成 O(n)，这就是需要 AVL 这类平衡树的原因。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n（单选）中序遍历二叉搜索树得到的序列是？ A. 降序 B. 升序 C. 随机 D. 与结构无关（答案：B；解析：左&lt;根&lt;右的性质使中序输出天然有序。）\n<\/li><li>\n（填空）前序遍历的顺序是______、左、______。（答案：根；右；解析：按&quot;根&quot;访问位置区分前中后序。）\n<\/li><li>\n（单选）平衡二叉搜索树（AVL）查找的时间复杂度是？ A. O(1) B. O(log n) C. O(n) D. O(n log n)（答案：B；解析：高度保持对数级。）\n<\/li><li>\n（判断）二叉搜索树在任何插入顺序下都是 O(log n) 查找。（答案：错误；解析：数据有序插入会退化成斜链 O(n)，需平衡树保证。）\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n二叉树：每节点 ≤2 子节点；前/中/后/层序四种遍历。\n<\/li><li>\nBST：左&lt;根&lt;右，中序有序，查找 O(log n)（平衡时）。\n<\/li><li>\nAVL 通过旋转维持平衡因子 ≤1。\n<\/ul>", "kind": "chapter", "title": "第 7 章：树（二叉树）"}, "ch08": {"html": "<h1>第 8 章：堆<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：2 小时 | <strong>前置<\/strong>：第 7 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n说清大顶堆/小顶堆的定义与数组表示；\n<\/li><li>\n理解堆化（sift down）的过程；\n<\/li><li>\n用堆解决 Top-k 问题；\n<\/li><li>\n知道堆与优先队列的关系。\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>堆是一棵&quot;父节点总是 ≥（或 ≤）子节点&quot;的完全二叉树，用数组存储，能在 O(log n) 内取出当前最大/最小元素。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：堆（heap）（难度：基础）<\/h3>\n<p><strong>堆<\/strong>是一种特殊的完全二叉树，分两种：<\/p>\n<ul><li>\n<strong>大顶堆<\/strong>：每个父节点 ≥ 其子节点，堆顶是全局最大；\n<\/li><li>\n<strong>小顶堆<\/strong>：每个父节点 ≤ 其子节点，堆顶是全局最小。\n<\/ul>\n<p>它存在数组里（完全二叉树紧凑表示）：节点 i 的左孩子 2i+1、右孩子 2i+2。<\/p>\n<pre class=\"lang-python\"><code>import heapq\nmin_heap = []\nheapq.heappush(min_heap, 3)   # 入堆 O(log n)\nheapq.heappush(min_heap, 1)\nheapq.heappop(min_heap)       # 弹出最小 1，O(log n)<\/code><\/pre>\n<h3>概念 2：堆化（heapify / sift down）（难度：进阶）<\/h3>\n<p>当某节点违反堆性质时，把它和它两个孩子中&quot;最大/最小者&quot;交换，并向下继续，直到满足性质。插入是从底部上浮（sift up），删除堆顶是与末尾交换后向下堆化。每次调整沿树高走 → O(log n)。<\/p>\n<h3>概念 3：堆与优先队列（priority queue）（难度：基础）<\/h3>\n<p><strong>优先队列<\/strong>每次取出&quot;优先级最高&quot;的元素，堆正是它的高效实现：堆顶永远是极值。任务调度、Top-k 都是它的典型场景。<\/p>\n<h3>概念 4：Top-k 问题（难度：进阶）<\/h3>\n<p>从海量数据里找最大的 k 个元素。维护一个大小为 k 的小顶堆：遍历数据，比堆顶大就替换堆顶并堆化。最后堆里就是最大的 k 个，全程 O(n log k)，不用把全部数据排序。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    R[&quot;堆顶(最小) 1&quot;] --&gt; A[&quot;3&quot;] &amp; B[&quot;6&quot;]\n    A --&gt; A1[&quot;5&quot;] &amp; A2[&quot;4&quot;]\n    B --&gt; B1[&quot;8&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：小顶堆——堆顶 1 是全局最小，每个父节点都 ≤ 孩子。用数组按层填入即可。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：堆像&quot;摇号机&quot;——最大的球永远浮到最上面（大顶堆），你每次直接从最上面拿。<strong>失效边界<\/strong>：它只保证堆顶是极值，不保证整棵树有序。\n<\/li><li>\n实例：100 万个数找前 10 大——用大小 10 的小顶堆扫一遍即可，不必全排序 O(n log n)。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为堆是排序好的数组——实际上堆只保证&quot;父≥子&quot;这一条局部性质，兄弟节点之间没有大小关系。\n<\/li><li>\n别以为取出极值要 O(n)——实际上堆把&quot;找最值+维护&quot;压到 O(log n)，这正是它比数组排序再取顶快的地方。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n（单选）小顶堆的堆顶元素是？ A. 全局最大 B. 全局最小 C. 随机 D. 中间值（答案：B；解析：父≤子，堆顶即最小。）\n<\/li><li>\n（填空）插入或删除堆元素后做堆化，时间复杂度是______（沿树高走）。（答案：O(log n)；解析：树高为 log n。）\n<\/li><li>\n（单选）从 100 万数据里找最大的 k 个，高效做法是？ A. 全排序 B. 大小 k 的小顶堆 C. 随机抽样 D. 遍历两遍（答案：B；解析：维护 k 大小堆，O(n log k)。）\n<\/li><li>\n（判断）堆中兄弟节点之间有固定大小顺序。（答案：错误；解析：堆只约束父子关系，兄弟无序。）\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n堆 = 完全二叉树 + 父≥子（大顶）/父≤子（小顶），数组存储。\n<\/li><li>\n堆化沿树高 O(log n)。\n<\/li><li>\n堆是优先队列的实现；Top-k 用大小 k 的堆。\n<\/ul>", "kind": "chapter", "title": "第 8 章：堆"}, "ch09": {"html": "<h1>第 9 章：图<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：2.5 小时 | <strong>前置<\/strong>：第 5 章、第 7 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n说清图的顶点、边、有向/无向、权重等概念；\n<\/li><li>\n比较邻接矩阵与邻接表两种存储；\n<\/li><li>\n写出 BFS 和 DFS 两种图遍历；\n<\/li><li>\n理解图能建模什么现实问题。\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>图是顶点和边组成的网状结构；用邻接表存储，用 BFS（队列）或 DFS（栈/递归）遍历。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：图（graph）基本概念（难度：基础）<\/h3>\n<p><strong>图<\/strong>由一组<strong>顶点<\/strong>和连接顶点的<strong>边<\/strong>组成：<\/p>\n<ul><li>\n<strong>无向图<\/strong>：边没有方向（朋友关系）；\n<\/li><li>\n<strong>有向图<\/strong>：边有方向（粉丝关注）；\n<\/li><li>\n<strong>有权图<\/strong>：边带权重（路程、费用）；\n<\/li><li>\n与顶点相关：<strong>度<\/strong>（连出的边数；有向图分入度/出度）；<strong>路径<\/strong>（一串相连的顶点）。\n<\/ul>\n<h3>概念 2：图的存储（难度：进阶）<\/h3>\n<ol><li>\n<strong>邻接矩阵<\/strong>：n×n 数组，matrix[i][j] 表示 i 与 j 之间是否有边。查边快 O(1)，但占 O(n²) 空间，适合稠密图。\n<\/li><li>\n<strong>邻接表<\/strong>：每个顶点维护一个它直接相连的顶点列表。省空间 O(n+m)，适合稀疏图，工程上更常用。\n<\/ol>\n<h3>概念 3：图的遍历（难度：进阶）<\/h3>\n<ul><li>\n<strong>广度优先搜索 BFS<\/strong>：从起点出发，先访问近邻，再一层层向外扩。用<strong>队列<\/strong>实现，天然求&quot;最少步数&quot;类问题。\n<\/li><li>\n<strong>深度优先搜索 DFS<\/strong>：一条路走到底，走不通再回退。用<strong>栈/递归<\/strong>实现。\n<\/ul>\n<p>两者都要用一个 visited 集合记录已访问顶点，否则会在环里死循环。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n    A((1)) --- B((2))\n    A --- C((3))\n    B --- D((4))\n    C --- D<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：4 个顶点、5 条边的无向图。BFS 从 1 出发会先访问 2、3，再访问 4；DFS 会先走 1→2→4 这条到底。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：图像城市地图——顶点是路口，边是马路。BFS 是从家一圈圈向外找最近的咖啡店；DFS 是沿着一条小巷钻到底再换一条。<strong>失效边界<\/strong>：地图可以走回头路，图遍历必须记录 visited 否则绕圈。\n<\/li><li>\n实例：朋友圈&quot;六人关系链&quot;、地铁换乘最少站数，都是图上的 BFS/DFS 问题。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为图就是&quot;复杂&quot;——实际上它是最一般化的数据结构，数组/树都可看成特殊的图。\n<\/li><li>\n别以为遍历图不用记 visited——实际上图有环，不标记会无限循环。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n（单选）BFS 通常借助哪种结构实现？ A. 栈 B. 队列 C. 堆 D. 哈希表（答案：B；解析：按层先来后到展开。）\n<\/li><li>\n（填空）图的两种存储方式是邻接______和邻接______。（答案：矩阵；表；解析：稠密用矩阵、稀疏用表。）\n<\/li><li>\n（单选）在图遍历中必须用 visited 记录已访问顶点，是因为图存在？ A. 权重 B. 环 C. 方向 D. 叶子（答案：B；解析：不标记会在环里死循环。）\n<\/li><li>\n（判断）邻接矩阵对稀疏图最省空间。（答案：错误；解析：邻接矩阵固定 O(n²)，稀疏图用邻接表更省。）\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n图 = 顶点 + 边；分有向/无向/有权。\n<\/li><li>\n存储：邻接矩阵（稠密）vs 邻接表（稀疏）。\n<\/li><li>\n遍历：BFS 用队列，DFS 用栈/递归，都要 visited。\n<\/ul>", "kind": "chapter", "title": "第 9 章：图"}, "ch10": {"html": "<h1>第 10 章：搜索（二分查找）<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：2 小时 | <strong>前置<\/strong>：第 2 章、第 4 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n写出在有序数组上的二分查找；\n<\/li><li>\n说明二分查找为什么是 O(log n)；\n<\/li><li>\n处理&quot;插入点&quot;&quot;边界&quot;等二分查找的变形；\n<\/li><li>\n知道什么时候用哈希优化代替暴力搜索。\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>在有序数组上，每次比较中间元素就能砍掉一半区间，把查找从 O(n) 压到 O(log n)。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：二分查找（binary search）（难度：基础）<\/h3>\n<p><strong>前提<\/strong>：数组已经排好序。取区间中点，与目标比大小：目标小就去左半区，目标大就去右半区，每次砍掉一半。<\/p>\n<pre class=\"lang-python\"><code>def binary_search(nums, target):\n    i, j = 0, len(nums) - 1\n    while i &lt;= j:\n        m = (i + j) // 2      # 中点\n        if nums[m] &lt; target:\n            i = m + 1         # 去右半区\n        elif nums[m] &gt; target:\n            j = m - 1         # 去左半区\n        else:\n            return m          # 命中\n    return -1<\/code><\/pre>\n<p>每次区间减半 → 最多 log₂n 次 → <strong>O(log n)<\/strong>。100 万数据只要约 20 次比较。<\/p>\n<h3>概念 2：二分查找的变形（难度：进阶）<\/h3>\n<ul><li>\n<strong>查找插入点<\/strong>：目标不存在时，找出它应该插入的下标；\n<\/li><li>\n<strong>查找边界<\/strong>：有重复元素时，找第一个/最后一个等于目标的位置。\n<p>关键是在循环里控制 i、j 的收缩方向，别漏掉边界。<\/p>\n<\/ul>\n<h3>概念 3：哈希优化策略（难度：进阶）<\/h3>\n<p>如果不需要有序、只需要&quot;快速判断存不存在&quot;，直接用哈希集合 O(1) 查找，比二分的 O(log n) 还快。搜索算法分两类：<\/p>\n<ul><li>\n暴力遍历 O(n)；\n<\/li><li>\n利用有序性/索引：二分 O(log n)、哈希 O(1)。\n<\/ul>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    S[&quot;区间 [0,9]&quot;] --&gt; C{&quot;中点值 vs 目标?&quot;}\n    C -- &quot;目标小&quot; --&gt; L[&quot;只留左半 [0,4]&quot;]\n    C -- &quot;目标大&quot; --&gt; R[&quot;只留右半 [5,9]&quot;]\n    L --&gt; C2{&quot;再取中点…&quot;}\n    R --&gt; C2\n    C2 --&gt; Hit[&quot;命中 / 区间为空&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：每一步比较中点后排除一半，区间长度按 2 的幂缩小，所以是对数级。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：猜数字游戏（1~100）——&quot;是 50 吗？大了。是 25 吗？小了。&quot;每次猜中间值、听反馈缩范围，7 次内必中。<strong>失效边界<\/strong>：这个玩法只在&quot;有序/单调&quot;时成立，乱序数组不能二分。\n<\/li><li>\n实例：在已排序的成绩表里找某分数，20 次比较内定位 100 万条记录。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为二分查找适用所有数组——实际上它<strong>要求数组有序<\/strong>，无序数组只能 O(n) 遍历。\n<\/li><li>\n别以为 O(log n) 比 O(1) 快——实际上哈希查找才是 O(1)；二分是&quot;有序数据&quot;的工具，哈希是&quot;快速判存在&quot;的工具。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n（单选）二分查找的时间复杂度是？ A. O(1) B. O(log n) C. O(n) D. O(n log n)（答案：B；解析：每次砍半。）\n<\/li><li>\n（填空）二分查找的前提是数组已经______。（答案：有序/排好序；解析：否则不能用大小关系砍半。）\n<\/li><li>\n（单选）100 万条有序记录用二分查找最多比较约多少次？ A. 100 万 B. 1 万 C. 20 D. 1000（答案：C；解析：log₂10⁶≈20。）\n<\/li><li>\n（判断）只需要快速判断&quot;某元素在不在&quot;时，二分查找总比哈希集合好。（答案：错误；解析：无序只判存在时哈希集合 O(1) 更快；二分依赖有序。）\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n二分查找：有序数组，每次砍半，O(log n)。\n<\/li><li>\n变形：插入点、左右边界，靠控制 i/j 收缩方向。\n<\/li><li>\n搜索效率阶梯：暴力 O(n) &lt; 二分 O(log n) &lt; 哈希 O(1)。\n<\/ul>", "kind": "chapter", "title": "第 10 章：搜索（二分查找）"}, "ch11": {"html": "<h1>第 11 章：排序<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：4 小时 | <strong>前置<\/strong>：第 4 章、第 8 章、第 10 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n说清评价排序算法的五个维度；\n<\/li><li>\n列出常见排序算法的复杂度与稳定性；\n<\/li><li>\n解释快排为什么快、归并为什么稳；\n<\/li><li>\n知道桶/计数/基数排序为什么能达到线性。\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>排序把混乱数据变有序；评价它看运行效率、原地性、稳定性、自适应性、是否基于比较——没有一种算法全胜。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：评价维度（难度：基础）<\/h3>\n<p>评价排序算法看五点：<\/p>\n<ol><li>\n<strong>运行效率<\/strong>：时间复杂度尽量低；\n<\/li><li>\n<strong>原地性<\/strong>：能否不开额外数组直接在原数组上排；\n<\/li><li>\n<strong>稳定性<\/strong>：相等元素排序后相对顺序不变；\n<\/li><li>\n<strong>自适应性<\/strong>：能否利用已有顺序加速；\n<\/li><li>\n<strong>是否基于比较<\/strong>：基于比较的排序理论最优 O(n log n)。\n<\/ol>\n<h3>概念 2：O(n²) 家族（难度：基础）<\/h3>\n<ul><li>\n<strong>冒泡排序<\/strong>：相邻两两比较交换，大的一步步&quot;冒&quot;到末尾。加 flag 后最佳 O(n)。稳定、原地。\n<\/li><li>\n<strong>选择排序<\/strong>：每轮选最小放到已排序末尾。不稳定、原地。\n<\/li><li>\n<strong>插入排序<\/strong>：像整理手牌，把新元素插入已排序段的正确位置。数据量小时最快，稳定、原地。\n<\/ul>\n<h3>概念 3：O(n log n) 家族（难度：进阶）<\/h3>\n<ul><li>\n<strong>快速排序<\/strong>：选基准 pivot，把比它小的放左、大的放右（哨兵划分），再递归两边。平均 O(n log n)，最坏 O(n²)（可用三数取中/随机基准避免）。缓存友好所以实际很快。不稳定、原地。\n<\/li><li>\n<strong>归并排序<\/strong>：先对半拆到单元素，再两两合并成有序段。稳定、O(n log n)，但要 O(n) 辅助数组。\n<\/li><li>\n<strong>堆排序<\/strong>：建成大顶堆后反复把堆顶换到底部并堆化。原地 O(n log n)，不稳定。\n<\/ul>\n<h3>概念 4：线性排序（难度：高难）<\/h3>\n<p>不基于比较，可达 O(n)：<\/p>\n<ul><li>\n<strong>桶排序<\/strong>：把数据分到若干桶，桶内各自排序再合并；\n<\/li><li>\n<strong>计数排序<\/strong>：统计每个数字出现次数，天然有序回填（适合数据量大、范围小的非负整数）；\n<\/li><li>\n<strong>基数排序<\/strong>：按低位到高位逐位做计数排序（学号、定长数字）。\n<\/ul>\n<h2>排序算法对比表<\/h2>\n<table><thead><tr><th>算法<\/th><th>平均时间<\/th><th>空间<\/th><th>稳定<\/th><th>备注<\/th><\/tr><\/thead><tbody><tr><td>冒泡<\/td><td>O(n²)<\/td><td>O(1)<\/td><td>是<\/td><td>flag 后最佳 O(n)<\/td><\/tr><tr><td>选择<\/td><td>O(n²)<\/td><td>O(1)<\/td><td>否<\/td><td>总是 O(n²)<\/td><\/tr><tr><td>插入<\/td><td>O(n²)<\/td><td>O(1)<\/td><td>是<\/td><td>小数据量最快<\/td><\/tr><tr><td>快速<\/td><td>O(n log n)<\/td><td>O(n) 栈<\/td><td>否<\/td><td>实际最快<\/td><\/tr><tr><td>归并<\/td><td>O(n log n)<\/td><td>O(n)<\/td><td>是<\/td><td>稳定，需辅助数组<\/td><\/tr><tr><td>堆<\/td><td>O(n log n)<\/td><td>O(1)<\/td><td>否<\/td><td>原地<\/td><\/tr><tr><td>桶/计数/基数<\/td><td>O(n+k)<\/td><td>O(n+k)<\/td><td>视实现<\/td><td>非比较<\/td><\/tr><\/tbody><\/table>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：排序像整理扑克牌——插入排序就是理手牌；快速排序像把牌按&quot;比某张小/大&quot;分成两堆再各自理。<strong>失效边界<\/strong>：扑克牌能随手抽，数组划分要严格按位置。\n<\/li><li>\n实例：稳定排序是多级排序的前提——先按姓名排，再按年龄排；若不稳定，相同年龄的人姓名顺序会被打乱。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;快排永远最快&quot;——实际上它最坏 O(n²)，靠基准优化把坏情况概率压低。\n<\/li><li>\n别以为 O(n log n) 一定比 O(n²) 快——实际上 n 很小时插入排序因常数小反而更快，Java/Python 内置排序在短区间就回退到插入排序。\n<\/li><li>\n别以为线性排序通用——实际上计数/基数排序要求数据能映射成小范围非负整数。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n（单选）下列哪种排序是稳定的？ A. 快速排序 B. 选择排序 C. 归并排序 D. 堆排序（答案：C；解析：归并合并时相等元素次序保持。）\n<\/li><li>\n（填空）基于比较的排序，理论最优时间复杂度是______。（答案：O(n log n)；解析：这是比较排序的下界。）\n<\/li><li>\n（单选）数据量小、且基本有序时，通常最快的是？ A. 归并排序 B. 插入排序 C. 堆排序 D. 基数排序（答案：B；解析：插入排序自适应+常数小。）\n<\/li><li>\n（判断）计数排序适合任意类型数据。（答案：错误；解析：它要求数据是可映射的小范围非负整数。）\n<\/li><li>\n（简答）为什么多级排序必须用稳定排序？（答案：不稳定会打乱上一级已经排好的同键元素相对顺序，破坏多级结果。）\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n五维度：效率/原地/稳定/自适应/是否基于比较。\n<\/li><li>\nO(n²)：冒泡、选择、插入；O(n log n)：快排、归并、堆排。\n<\/li><li>\n线性：桶、计数、基数（非比较、范围受限）。\n<\/ul>", "kind": "chapter", "title": "第 11 章：排序"}, "ch12": {"html": "<h1>第 12 章：分治<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：2 小时 | <strong>前置<\/strong>：第 2 章、第 7 章、第 11 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n说清分治的&quot;分—治&quot;两阶段；\n<\/li><li>\n判断一个问题是否适合分治；\n<\/li><li>\n用分治思想理解归并排序、二分查找、汉诺塔；\n<\/li><li>\n解释分治为什么能提升效率。\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>分治 = 把大问题拆成互相独立的小问题，分别解决后合并答案；归并排序是它最典型的样板。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：分治（divide and conquer）两阶段（难度：基础）<\/h3>\n<ol><li>\n<strong>分<\/strong>：递归地把原问题拆成两个或多个规模更小的同类子问题，直到小到一眼能解；\n<\/li><li>\n<strong>治<\/strong>：从最小子问题开始，从底向上把子问题的解合并成原问题的解。\n<\/ol>\n<p>归并排序：数组对半拆到只剩 1 个元素，再两两合并成有序段。<\/p>\n<h3>概念 2：分治的判断依据（难度：进阶）<\/h3>\n<p>一个问题适不适合分治，看三条：<\/p>\n<ol><li>\n能拆成同类小子问题；\n<\/li><li>\n子问题之间<strong>相互独立<\/strong>（不重叠、不依赖）；\n<\/li><li>\n子问题的解能合并成原问题的解。\n<\/ol>\n<h3>概念 3：分治为什么快（难度：进阶）<\/h3>\n<ul><li>\n<strong>操作数减少<\/strong>：把 O(n²) 的冒泡拆成两半，操作数从 n² 降到约 n²/2+2n；\n<\/li><li>\n<strong>可并行<\/strong>：子问题独立，多核可同时算。\n<\/ul>\n<p>二分查找也是分治：每轮砍掉一半候选，只是它&quot;无须合并答案&quot;。<\/p>\n<h3>概念 4：典型例子——汉诺塔（难度：高难）<\/h3>\n<p>把 n 个圆盘从 A 移到 C（小圆盘必须在大圆盘上）：<\/p>\n<ul><li>\n先把上面 n-1 个借 C 移到 B；\n<\/li><li>\n把最底下 1 个移到 C；\n<\/li><li>\n再把 B 上 n-1 个借 A 移到 C。\n<p>时间复杂度 O(2ⁿ)。<\/p>\n<\/ul>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    P[&quot;原问题（排序整段）&quot;] --&gt; S1[&quot;子问题A（左半）&quot;]\n    P --&gt; S2[&quot;子问题B（右半）&quot;]\n    S1 --&gt; M1[&quot;最小子问题&quot;]\n    S2 --&gt; M2[&quot;最小子问题&quot;]\n    M1 --&gt; Me[&quot;合并子问题解&quot;]\n    M2 --&gt; Me\n    Me --&gt; Ans[&quot;原问题解&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：自上而下&quot;分&quot;，自下而上&quot;治&quot;，中间是合并。这就是分治的骨架。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：分治像&quot;大工程拆包&quot;——一本厚书要校对，拆成上下两册分给两个人，校完再合订。<strong>失效边界<\/strong>：两个子任务必须互不干扰；如果它们共用同一页纸（子问题重叠），那就不是分治，而是动态规划。\n<\/li><li>\n实例：二分查找每次把搜索区间砍半——也是分治，只是答案直接由唯一幸存的区间给出。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为分治和动态规划是一回事——实际上分治的子问题相互独立不重叠；动态规划的子问题大量重叠。\n<\/li><li>\n别以为分治一定更快——实际上它先减少常数项，反复拆才把 O(n²) 降到 O(n log n)。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n（单选）分治的两个阶段是？ A. 递归与迭代 B. 分与治 C. 入栈与出栈 D. 拆分与排序（答案：B；解析：先拆成子问题，再合并解。）\n<\/li><li>\n（填空）分治要求子问题之间相互______，这是它与动态规划的关键区别。（答案：独立/不重叠；解析：DP 子问题重叠。）\n<\/li><li>\n（单选）下列哪个是分治的典型应用？ A. 哈希表 B. 归并排序 C. 栈 D. 队列（答案：B；解析：归并排序 = 拆 + 合并。）\n<\/li><li>\n（判断）二分查找属于分治，但不需要&quot;合并子问题解&quot;。（答案：正确；解析：每轮只保留一个幸存区间，命中即得解。）\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n分治：分（拆成独立子问题）→ 治（合并解）。\n<\/li><li>\n判断三依据：可拆、独立、可合并。\n<\/li><li>\n典型：归并排序、快速排序、二分查找、汉诺塔。\n<\/ul>", "kind": "chapter", "title": "第 12 章：分治"}, "ch13": {"html": "<h1>第 13 章：回溯<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：3 小时 | <strong>前置<\/strong>：第 5 章、第 7 章、第 12 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n说清回溯的&quot;尝试—回退—剪枝&quot;框架；\n<\/li><li>\n用回溯写出全排列、子集和、n 皇后；\n<\/li><li>\n理解剪枝为什么能大幅提速；\n<\/li><li>\n区分回溯与分治/动态规划。\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>回溯是带着约束的穷举：一条路走到底，走不通就撤销上一步（回退）换条路，并在过程中提前剪掉无效分支。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：回溯框架（难度：基础）<\/h3>\n<p><strong>回溯算法<\/strong>用深度优先搜索穷举解空间，三件套：<\/p>\n<ul><li>\n<strong>尝试<\/strong>：做一个选择，更新当前状态；\n<\/li><li>\n<strong>回退<\/strong>：走不通就撤销这个选择，回到上一状态；\n<\/li><li>\n<strong>剪枝<\/strong>：遇到不满足约束的分支，提前停下，不再往下试。\n<\/ul>\n<p>通用框架：<\/p>\n<pre class=\"lang-python\"><code>def backtrack(state, choices, res):\n    if is_solution(state):\n        res.append(list(state))\n        return\n    for choice in choices:\n        if is_valid(state, choice):      # 剪枝\n            make_choice(state, choice)  # 尝试\n            backtrack(state, choices, res)\n            undo_choice(state, choice)  # 回退<\/code><\/pre>\n<h3>概念 2：全排列（难度：进阶）<\/h3>\n<p>给定 [1,2,3]，列出所有排列。用一个 selected 数组记录&quot;这个元素是否已选&quot;，避免重复选；结果是 n! 种。<\/p>\n<h3>概念 3：子集和（难度：进阶）<\/h3>\n<p>从数组里选出和为 target 的子集。关键技巧：用 start 变量规定&quot;下一轮只能从后面选&quot;，从而避免 [4,5] 和 [5,4] 这种重复子集。<\/p>\n<h3>概念 4：n 皇后（难度：高难）<\/h3>\n<p>在 n×n 棋盘放 n 个皇后，使其互不攻击（同行/同列/同斜线都不行）。逐行放，用三个布尔数组做列约束和两条对角线约束的剪枝。<\/p>\n<h3>概念 5：回溯 vs 分治 vs DP（难度：进阶）<\/h3>\n<ul><li>\n分治：子问题独立，一次拆完；\n<\/li><li>\n回溯：穷举所有解，靠剪枝提速；\n<\/li><li>\nDP：子问题重叠，靠记忆避免重复算。\n<p>很多组合优化问题（0-1 背包、旅行商）先用回溯能解，但 DP/贪心更高效。<\/p>\n<\/ul>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    Root[&quot;根(空状态)&quot;] --&gt; A[&quot;选1&quot;] --&gt; B[&quot;选2&quot;] --&gt; C[&quot;选3 → 解[1,2,3]&quot;]\n    A --&gt; D[&quot;选3&quot;] --&gt; E[&quot;选2 → 解[1,3,2]&quot;]\n    Root --&gt; F[&quot;选2&quot;] --&gt; G[&quot;选1&quot;] --&gt; H[&quot;选3 → 解[2,1,3]&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：全排列的递归树——每条根到叶路径是一个排列；遇到已选元素就剪枝。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：回溯像走迷宫——每条岔路都试着走，撞墙了就退回到上一个岔口换方向（回退），看到墙上写着&quot;此路不通&quot;就不再走（剪枝）。<strong>失效边界<\/strong>：迷宫只有有限岔路；回溯的解空间可能指数爆炸，必须剪枝。\n<\/li><li>\n实例：n 皇后 n=8 有 92 个解，全排列 n=9 就有 36 万种——不剪枝算不动。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为回溯就是&quot;暴力枚举&quot;——实际上好的剪枝能砍掉绝大部分无效分支，远快于无脑穷举。\n<\/li><li>\n别以为找到一个解就够——实际上很多问题（全排列、n 皇后）要的是<strong>所有<\/strong>解，要继续遍历完。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n（单选）回溯算法的三大动作是？ A. 分、治、合并 B. 尝试、回退、剪枝 C. 入队、出队、遍历 D. 建堆、堆化、弹出（答案：B；解析：这是回溯框架核心。）\n<\/li><li>\n（填空）用 start 变量约束下一轮选择的起点，是为了避免______子集。（答案：重复（顺序不同但元素相同）；解析：如 [4,5] 与 [5,4]。）\n<\/li><li>\n（单选）n 皇后问题用三个布尔数组做剪枝，不包含哪种约束？ A. 同列 B. 同主对角线 C. 同次对角线 D. 同色（答案：D；解析：行列/双斜线是皇后攻击范围。）\n<\/li><li>\n（判断）回溯是解决所有组合优化问题的最优方法。（答案：错误；解析：DP/贪心往往更高效，回溯是通用但较慢的兜底。）\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n回溯 = DFS 穷举 + 尝试/回退/剪枝。\n<\/li><li>\n典型：全排列、子集和、n 皇后。\n<\/li><li>\n与分治/DP 的区别在子问题是否重叠、是否求所有解。\n<\/ul>", "kind": "chapter", "title": "第 13 章：回溯"}, "ch14": {"html": "<h1>第 14 章：动态规划<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：4 小时 | <strong>前置<\/strong>：第 2 章、第 12 章、第 13 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n说清动态规划（DP）的三大特性；\n<\/li><li>\n写出爬楼梯、最小路径和、0-1 背包、编辑距离的状态转移方程；\n<\/li><li>\n区分&quot;记忆化搜索（从顶到底）&quot;与&quot;递推（从底到顶）&quot;；\n<\/li><li>\n理解滚动变量/数组的空间优化。\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>DP 把重叠子问题的解存进 dp 表，从最小子问题一步步推到原问题，把指数级暴力压成多项式级。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：从爬楼梯说起（难度：基础）<\/h3>\n<p>n 阶楼梯，每次上 1 或 2 阶，问有几种走法。设 dp[i] = 到第 i 阶的方案数。因为到 i 只能从 i-1 或 i-2 跨上来：<\/p>\n<p><strong>dp[i] = dp[i-1] + dp[i-2]<\/strong>，初值 dp[1]=1, dp[2]=2。<\/p>\n<pre class=\"lang-python\"><code>def climbing_stairs_dp(n):\n    dp = [0] * (n + 1)\n    dp[1], dp[2] = 1, 2\n    for i in range(3, n + 1):\n        dp[i] = dp[i - 1] + dp[i - 2]\n    return dp[n]<\/code><\/pre>\n<h3>概念 2：DP 的三大特性（难度：进阶）<\/h3>\n<ol><li>\n<strong>重叠子问题<\/strong>：递归求解时大量重复算同一个子问题（暴力递归 O(2ⁿ)），用 dp 表记忆后 O(n)。\n<\/li><li>\n<strong>最优子结构<\/strong>：原问题最优解可由子问题最优解构造（如最小路径和取 min）。\n<\/li><li>\n<strong>无后效性<\/strong>：当前状态一旦确定，未来怎么走只与它有关，与怎么走到它的无关。\n<\/ol>\n<h3>概念 3：从顶到底 vs 从底到顶（难度：进阶）<\/h3>\n<ul><li>\n<strong>记忆化搜索（从顶到底）<\/strong>：从原问题递归往下拆，碰到算过的子问题就查表。\n<\/li><li>\n<strong>动态规划递推（从底到顶）<\/strong>：从最小子问题的已知解出发，填表到原问题。\n<p>两者等价，DP 通常写成自底向上的循环。<\/p>\n<\/ul>\n<h3>概念 4：0-1 背包（难度：高难）<\/h3>\n<p>n 个物品（各有重量 wgt[i]、价值 val[i]），背包容量 cap，每件最多拿一次，求最大价值。状态 dp[i][c] = 前 i 个物品、容量 c 下的最大价值：<\/p>\n<p><strong>dp[i][c] = max(dp[i-1][c], dp[i-1][c-wgt[i-1]] + val[i-1])<\/strong>（拿或不拿取较大者）<\/p>\n<p>空间优化：用一维数组<strong>倒序<\/strong>遍历，避免覆盖上一行还没用过的值。<\/p>\n<h3>概念 5：编辑距离（难度：高难）<\/h3>\n<p>把字符串 s 改成 t，允许插入/删除/替换，求最少步数。dp[i][j] = 把 s 前 i 个改成 t 前 j 个的最少步数：末尾字符相同就继承左上；不同就取三种操作（插/删/替）的最小值 +1。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n    subgraph 暴力[&quot;暴力递归 O(2^n)&quot;]\n        Dn[&quot;dp[n]&quot;] --&gt; D1[&quot;dp[n-1]&quot;] &amp; D2[&quot;dp[n-2]&quot;]\n        D1 --&gt; D2\n    end\n    subgraph DP[&quot;DP 填表 O(n)&quot;]\n        T1[&quot;dp1=1&quot;] --&gt; T2[&quot;dp2=2&quot;] --&gt; T3[&quot;dp3=3&quot;] --&gt; T4[&quot;dp4=5&quot;] --&gt; T5[&quot;…dp[n]&quot;]\n    end<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：左边递归树里 dp[n-2] 被重复算无数次；右边 DP 每个子问题只算一次，顺着填到答案。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：DP 像&quot;记账递推&quot;——你不求一步登天，而是把每个台阶/格子的最优答案记下来，后面的答案只查前面的账本。<strong>失效边界<\/strong>：这要求&quot;过去怎么走到这格&quot;不影响未来（无后效性）；如果约束让你必须记得所有历史路径，DP 就失效。\n<\/li><li>\n实例：最小路径和——机器人从左上到右下只能向右/下，dp[i][j] = min(上方, 左方) + 当前格代价。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 DP 就是&quot;递归加个缓存&quot;——实际上二者等价，但递推写法避免递归栈，更省空间。\n<\/li><li>\n别以为背包优化成一维是正序遍历——实际上 0-1 背包必须<strong>倒序<\/strong>遍历容量，否则同一物品被重复拿。\n<\/li><li>\n别以为所有最优化问题都能 DP——实际上不满足无后效性时（如带历史依赖的问题），DP 无解，只能用启发式方法。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n（填空）爬楼梯的状态转移方程是 dp[i] = ______。（答案：dp[i-1] + dp[i-2]；解析：只能跨 1 或 2 阶。）\n<\/li><li>\n（单选）DP 的三大特性不包括？ A. 重叠子问题 B. 最优子结构 C. 无后效性 D. 子问题独立（答案：D；解析：子问题独立是分治的特征，DP 子问题重叠。）\n<\/li><li>\n（单选）0-1 背包一维空间优化时，容量 c 应怎样遍历？ A. 正序 B. 倒序 C. 随机 D. 双层正序（答案：B；解析：倒序防止覆盖上一行尚未使用的值。）\n<\/li><li>\n（简答）记忆化搜索与动态规划递推的关系？（答案：等价，前者从顶到底递归查表，后者从底到顶循环填表，结果一致。）\n<\/li><li>\n（判断）编辑距离中两字符串末尾字符相同时，需要做一次替换。（答案：错误；解析：相同则直接继承 dp[i-1][j-1]，无需编辑。）\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\nDP = dp 表 + 状态转移方程 + 初始状态。\n<\/li><li>\n三特性：重叠子问题、最优子结构、无后效性。\n<\/li><li>\n经典模型：爬楼梯、背包、编辑距离；空间用滚动数组优化。\n<\/ul>", "kind": "chapter", "title": "第 14 章：动态规划"}, "ch15": {"html": "<h1>第 15 章：贪心<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：2 小时 | <strong>前置<\/strong>：第 14 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n说清贪心算法的基本思想；\n<\/li><li>\n判断贪心选择性质是否成立；\n<\/li><li>\n用贪心解分数背包、最大容量、最大切分乘积；\n<\/li><li>\n知道贪心与 DP 的取舍。\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>贪心每一步都选&quot;当前看起来最好&quot;的局部最优，不回头——只要问题有贪心选择性质，它就是又快又简单的最优解。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：贪心（greedy algorithm）（难度：基础）<\/h3>\n<p><strong>贪心算法<\/strong>在每个决策阶段，只选当前最划算的一步，一路向前，期望拼出全局最优解。它不回看历史决策，比 DP 更轻。<\/p>\n<h3>概念 2：两个前提（难度：进阶）<\/h3>\n<p>贪心要保证得到最优解，问题须满足：<\/p>\n<ol><li>\n<strong>贪心选择性质<\/strong>：每步局部最优选择最终能通向全局最优；\n<\/li><li>\n<strong>最优子结构<\/strong>：原问题最优解包含子问题最优解。\n<\/ol>\n<p>零钱兑换反例：硬币 [1,20,50]、目标 60，贪心选 50+10×1（11 枚），但 DP 能找到 20+20+20（3 枚）——说明该硬币组合下贪心选择性质不成立。<\/p>\n<h3>概念 3：典型例子（难度：进阶）<\/h3>\n<ul><li>\n<strong>分数背包<\/strong>：物品可拆分，按&quot;单位价值 = 价值/重量&quot;从高到低装，装不下就按比例补满。反证法可证明贪心最优。\n<\/li><li>\n<strong>最大容量（盛水容器）<\/strong>：双指针从两端向内，每次移动短板（动长板面积一定更小），O(n)。\n<\/li><li>\n<strong>最大切分乘积<\/strong>：把 n 拆成若干正整数使乘积最大——尽量拆成 3（3+3 优于 2+2+2），余数为 1 时换成 2+2。\n<\/ul>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n    S[&quot;当前状态&quot;] --&gt; G[&quot;选局部最优&quot;] --&gt; N[&quot;问题规模变小&quot;]\n    N --&gt; G\n    N --&gt; Done[&quot;到达全局解&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：与 DP 的区别——贪心每步只选一个方向、不保留其他分支；DP 会保留所有可能状态再择优。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：贪心像&quot;走路只选眼前最陡上坡&quot;——有时能登顶（简单凸问题），有时会困在小山包上错过主峰（贪心选择性质不成立）。<strong>失效边界<\/strong>：遇到需要回头权衡的问题，贪心就不是最优。\n<\/li><li>\n实例：分数背包——先装最值钱/单位重量的物品，剩余容量按比例取次优物品，得到全局最大价值。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为贪心代码短就一定对——实际上它常常&quot;部分正确&quot;，必须用反例检验或数学证明。\n<\/li><li>\n别以为贪心和 DP 是竞争关系——实际上对满足贪心选择性质的问题，贪心是 DP 的高效近似；否则老实用 DP。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n（单选）贪心算法与 DP 的核心区别是？ A. 贪心不回头选局部最优，DP 保留多状态择优 B. 贪心只能解排序 C. DP 不做决策 D. 二者完全相同（答案：A；解析：贪心每步一条路，DP 记录所有可能。）\n<\/li><li>\n（填空）贪心保证最优解需要______性质和最优子结构。（答案：贪心选择；解析：局部最优能通向全局最优。）\n<\/li><li>\n（单选）分数背包的贪心策略是按什么从高到低装？ A. 重量 B. 价值 C. 单位价值（价值/重量） D. 体积（答案：C；解析：单位价值最高者优先。）\n<\/li><li>\n（判断）零钱兑换在任何硬币组合下贪心都最优。（答案：错误；解析：如 [1,20,50] 凑 60 时贪心得到 11 枚，最优是 3 枚。）\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n贪心 = 每步局部最优、不回看。\n<\/li><li>\n前提：贪心选择性质 + 最优子结构。\n<\/li><li>\n经典：分数背包、最大容量（双指针移短板）、最大切分乘积（尽量拆 3）。\n<\/ul>", "kind": "chapter", "title": "第 15 章：贪心"}, "ch16": {"html": "<h1>第 16 章：附录（环境与术语速览）<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★☆☆ | <strong>预估学时<\/strong>：0.5 小时 | <strong>前置<\/strong>：全书\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n搭好本书推荐的 VS Code + Python 环境；\n<\/li><li>\n掌握算法与数据结构核心术语的中英文对照；\n<\/li><li>\n知道本书是开源项目、可以参与贡献。\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>附录是&quot;工具箱说明书 + 术语对照表&quot;，让你把代码跑起来、把术语叫准确。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：编程环境（难度：基础）<\/h3>\n<p>推荐 <strong>VS Code<\/strong> 作为编辑器，安装 Python 扩展包；Python 建议 3.10 以上。本书所有代码都能在这个环境里直接运行调试。可选装 <code>black<\/code> 做代码格式化。<\/p>\n<h3>概念 2：核心术语速览（难度：基础）<\/h3>\n<table><thead><tr><th>英文<\/th><th>中文<\/th><\/tr><\/thead><tbody><tr><td>algorithm<\/td><td>算法<\/td><\/tr><tr><td>data structure<\/td><td>数据结构<\/td><\/tr><tr><td>time/space complexity<\/td><td>时间/空间复杂度<\/td><\/tr><tr><td>recursion / iteration<\/td><td>递归 / 迭代<\/td><\/tr><tr><td>array / linked list<\/td><td>数组 / 链表<\/td><\/tr><tr><td>stack / queue / deque<\/td><td>栈 / 队列 / 双向队列<\/td><\/tr><tr><td>hash table / collision<\/td><td>哈希表 / 哈希冲突<\/td><\/tr><tr><td>binary tree / BST<\/td><td>二叉树 / 二叉搜索树<\/td><\/tr><tr><td>heap / priority queue<\/td><td>堆 / 优先队列<\/td><\/tr><tr><td>graph / BFS / DFS<\/td><td>图 / 广度优先搜索 / 深度优先搜索<\/td><\/tr><tr><td>binary search<\/td><td>二分查找<\/td><\/tr><tr><td>sorting（quick/merge/heap/bucket/counting/radix）<\/td><td>排序（快/归并/堆/桶/计数/基数）<\/td><\/tr><tr><td>divide and conquer / backtracking<\/td><td>分治 / 回溯<\/td><\/tr><tr><td>dynamic programming<\/td><td>动态规划<\/td><\/tr><tr><td>greedy algorithm<\/td><td>贪心算法<\/td><\/tr><\/tbody><\/table>\n<h3>概念 3：开源协作（难度：基础）<\/h3>\n<p>本书是开源项目，发现笔误可在 GitHub 上提 Pull Request 修正——这也是巩固学习的一种方式。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n    VS[&quot;VS Code&quot;] --&gt; Py[&quot;Python 3.10+&quot;]\n    Py --&gt; Run[&quot;运行本书代码&quot;]\n    Run --&gt; Contribute[&quot;看懂→改错→提 PR&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：环境 → 跑代码 → 参与贡献，形成学习闭环。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：附录像&quot;家电说明书的最后几页&quot;——平时不看，真要配环境/查名词时翻它。\n<\/li><li>\n实例：看到英文文献里 &quot;knapsack problem&quot;，查表即知是&quot;背包问题&quot;。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为环境配置不重要——实际上跑不起来代码，算法学习就是纸上谈兵。\n<\/li><li>\n别以为术语中文叫法就够——实际上看英文资料时，算法术语英文是绕不开的。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n（填空）本书推荐的编辑器是______，语言版本建议 Python ______以上。（答案：VS Code；3.10；解析：见 16.1。）\n<\/li><li>\n（匹配）BFS 对应中文是______，DFS 对应______。（答案：广度优先搜索；深度优先搜索；解析：见术语表。）\n<\/li><li>\n（判断）本书是开源项目，可以提 Pull Request 修正内容。（答案：正确；解析：16.2 节专门介绍。）\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\nVS Code + Python 3.10+ 跑通所有示例。\n<\/li><li>\n术语中英对照要眼熟。\n<\/li><li>\n开源协作是深化学习的途径。\n<\/ul>", "kind": "chapter", "title": "第 16 章：附录（环境与术语速览）"}, "c01": {"html": "<h1>复杂度度量（大 O 记号）<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 2 章，并贯穿全书\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>复杂度度量是&quot;当输入规模 n 变大时，算法运行时间或内存占用大致涨多快&quot;的数学尺子，用大 O 记号表示。<\/p>\n<h2>为什么重要<\/h2>\n<p>它是全书判断&quot;哪个算法更好&quot;的统一语言。没有它，你只能凭感觉说&quot;这个快那个慢&quot;；有了它，才能客观比较排序、搜索、DP 之间的取舍。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n    A[输入规模 n] --&gt; B[基本操作次数] --&gt; C[只留最高阶丢系数] --&gt; D[大 O 复杂度]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：估复杂度就是&quot;数操作次数 → 化简趋势&quot;。<\/p>\n<h2>详解<\/h2>\n<ul><li>\n<strong>时间复杂度<\/strong>：数基本操作随 n 的增长。常见阶序：O(1) &lt; O(log n) &lt; O(n) &lt; O(n log n) &lt; O(n²) &lt; O(2ⁿ) &lt; O(n!)。\n<\/li><li>\n<strong>空间复杂度<\/strong>：额外内存随 n 的增长。O(1) 是原地，O(n) 需开数组或深递归。\n<\/li><li>\n大 O 只管 n 很大时的上界趋势；n 很小时常数项可能主导（插入排序反而比快排快）。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为大 O 是精确秒数——实际上它丢系数、丢低阶项。\n<\/li><li>\n别以为递归一定比循环慢——实际上斐波那契递归慢是因为重复子问题（O(2ⁿ)），不是递归本身。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 2 章<\/td><td>引入大 O/Ω/Θ<\/td><td>只保留最高阶<\/td><\/tr><tr><td>第 4 章<\/td><td>数组 vs 链表<\/td><td>随机访问 O(1) vs O(n)<\/td><\/tr><tr><td>第 11 章<\/td><td>排序对比<\/td><td>O(n log n) 是比较排序下界<\/td><\/tr><tr><td>第 14 章<\/td><td>DP<\/td><td>把 O(2ⁿ) 压成 O(n)~O(n²)<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：算法定义（第 1 章）；后续：所有数据结构与算法章节。\n<\/ul>", "kind": "concept", "title": "复杂度度量（大 O 记号）"}, "c02": {"html": "<h1>递归<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 2、7、12、13、14 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>递归是函数直接或间接调用自身，把大问题拆成同形的小问题，直到碰到&quot;一眼能解&quot;的终止条件。<\/p>\n<h2>为什么重要<\/h2>\n<p>递归是分治、回溯、树遍历、动态规划共用的&quot;工具&quot;。理解它，等于拿到打开大半本书的钥匙。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    F[&quot;f(n)&quot;] --&gt; F1[&quot;f(n-1)&quot;] --&gt; F2[&quot;f(n-2)&quot;] --&gt; Base[&quot;f(1) 已知(终止条件)&quot;]\n    Base --&gt; Back[&quot;逐层返回合并&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：向下&quot;递&quot;到终止条件，再向上&quot;归&quot;回来——这就是递归树。<\/p>\n<h2>详解<\/h2>\n<ul><li>\n<strong>两个要素<\/strong>：终止条件 + 递归关系。缺终止条件会栈溢出。\n<\/li><li>\n<strong>调用栈<\/strong>：每层未返回的函数占一块栈帧；递归越深栈越大。\n<\/li><li>\n<strong>与三种算法的关系<\/strong>：\n<ul>\n<li>\n分治：子问题独立不重叠；\n<\/li><li>\n回溯：穷举 + 回退 + 剪枝；\n<\/li><li>\nDP/记忆化：子问题重叠，用表缓存避免重复算。\n<\/ul>\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为递归都优雅高效——实际上不缓存的递归（如斐波那契）是指数级灾难。\n<\/li><li>\n别以为 Python 会自动优化尾递归——实际上不会，递归深度受栈限制。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 2 章<\/td><td>迭代 vs 递归<\/td><td>递归=自己调自己+终止条件<\/td><\/tr><tr><td>第 7 章<\/td><td>树遍历<\/td><td>前/中/后序都是递归<\/td><\/tr><tr><td>第 12 章<\/td><td>分治<\/td><td>汉诺塔 O(2ⁿ)<\/td><\/tr><tr><td>第 14 章<\/td><td>DP<\/td><td>记忆化把递归压成 O(n)<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：复杂度度量；后续：分治、回溯、动态规划。\n<\/ul>", "kind": "concept", "title": "递归"}, "c03": {"html": "<h1>树与二叉搜索树<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 7、8、9、12 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>树是层次化的节点结构；二叉搜索树通过&quot;左&lt;根&lt;右&quot;的排序性质，把查找变成每次砍半的 O(log n)。<\/p>\n<h2>为什么重要<\/h2>\n<p>树是连接&quot;线性结构&quot;和&quot;图&quot;的桥梁；堆、BST、文件系统、数据库索引都是树的变体。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    R[&quot;根&quot;] --&gt; A[&quot;左子树(&lt;根)&quot;] &amp; B[&quot;右子树(&gt;根)&quot;]\n    A --&gt; A1 &amp; A2\n    B --&gt; B1 &amp; B2<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：每次比较目标与根，决定去左还是去右，区间减半。<\/p>\n<h2>详解<\/h2>\n<ul><li>\n<strong>二叉树<\/strong>：每节点 ≤2 子节点；四种遍历（前/中/后/层序）。\n<\/li><li>\n<strong>BST<\/strong>：中序遍历输出升序；查找平均 O(log n)，退化成斜链时 O(n)。\n<\/li><li>\n<strong>平衡树（AVL）<\/strong>：旋转维持平衡因子 ≤1，保证对数级查找。\n<\/li><li>\n<strong>堆<\/strong>：完全二叉树的特例，父子约束极值，数组存储。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 BST 天然 O(log n)——实际上有序插入会退化成链表，需要平衡。\n<\/li><li>\n别以为树和图无关——实际上树是无环连通的特殊图。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 7 章<\/td><td>二叉树/BST/AVL<\/td><td>中序有序、查找 O(log n)<\/td><\/tr><tr><td>第 8 章<\/td><td>堆<\/td><td>父子极值、数组存储<\/td><\/tr><tr><td>第 9 章<\/td><td>图<\/td><td>树是无环图<\/td><\/tr><tr><td>第 12 章<\/td><td>由遍历重建树<\/td><td>分治划分左右子树<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：递归、数组/链表；后续：图、堆排序。\n<\/ul>", "kind": "concept", "title": "树与二叉搜索树"}, "c04": {"html": "<h1>哈希<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 6、10 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>哈希用函数把 key 映射成桶编号，实现键值对的 O(1) 平均查找。<\/p>\n<h2>为什么重要<\/h2>\n<p>它是把&quot;判存在/查表&quot;从 O(n) 拉到 O(1) 的关键手段，几乎所有高频查询系统背后都有哈希。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n    K[key] --&gt; H[哈希函数] --&gt; B[桶编号] --&gt; V[value]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：一次哈希计算直达目标桶。<\/p>\n<h2>详解<\/h2>\n<ul><li>\n<strong>冲突<\/strong>：不同 key 落到同桶 → 链式地址 / 开放寻址。\n<\/li><li>\n<strong>负载因子<\/strong>：太满则冲突增多，需扩容重哈希。\n<\/li><li>\n<strong>应用<\/strong>：字典、集合、缓存、去重、计数统计。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为哈希查找恒为 O(1)——实际上哈希函数差时退化成 O(n)。\n<\/li><li>\n别以为哈希和排序冲突——实际上哈希不保留顺序，要顺序输出得配合排序。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 6 章<\/td><td>哈希表<\/td><td>O(1) 查找、冲突处理<\/td><\/tr><tr><td>第 10 章<\/td><td>哈希优化搜索<\/td><td>比二分 O(log n) 更快判存在<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：数组；后续：图的邻接表、缓存。\n<\/ul>", "kind": "concept", "title": "哈希"}, "c05": {"html": "<h1>图遍历：BFS 与 DFS<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 9、13 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>BFS 用队列一层一层向外扩展，DFS 用栈/递归一条路走到底——两者都要记录已访问顶点避免绕环。<\/p>\n<h2>为什么重要<\/h2>\n<p>它们是搜索图、树、迷宫、网络的通用引擎；&quot;最少步数&quot;问题天然归 BFS。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n    Start((起点)) --&gt; N1((近邻1)) &amp; N2((近邻2))\n    N1 --&gt; N3((次层))\n    N2 --&gt; N3<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：BFS 按距离分层；DFS 会先沿 Start→N1→N3 走到底再换 N2。<\/p>\n<h2>详解<\/h2>\n<ul><li>\n<strong>BFS<\/strong>：队列 + visited；适合最短路径（无权图最少边数）。\n<\/li><li>\n<strong>DFS<\/strong>：递归/栈 + visited；适合探索所有路径、连通性判断。\n<\/li><li>\n二者时间都是 O(V+E)（遍历所有顶点和边）。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 DFS 一定找到最短路——实际上 BFS 才保证无权图最短。\n<\/li><li>\n别以为图可以不标 visited——实际上有环会死循环。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 9 章<\/td><td>图的遍历<\/td><td>BFS 队列、DFS 递归<\/td><\/tr><tr><td>第 13 章<\/td><td>回溯<\/td><td>回溯本质是在解空间树上 DFS<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：队列、栈、递归；后续：最短路径、网络分析。\n<\/ul>", "kind": "concept", "title": "图遍历：BFS 与 DFS"}, "c06": {"html": "<h1>分治、回溯与动态规划<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 12、13、14 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>三种都基于递归拆问题，但区别在子问题是否重叠、是否求所有解：分治独立合并、回溯穷举剪枝、DP 记忆重叠子问题。<\/p>\n<h2>为什么重要<\/h2>\n<p>这是全书最难的概念分水岭——选错策略，要么慢到爆炸，要么漏解。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    P[递归拆问题] --&gt; Q1{子问题重叠?}\n    Q1 -- 不重叠 --&gt; DC[分治: 独立求解+合并]\n    Q1 -- 重叠 --&gt; Q2{求所有解?}\n    Q2 -- 求所有/约束满足 --&gt; BK[回溯: 穷举+剪枝]\n    Q2 -- 求最优 --&gt; DP[动态规划: dp表记忆]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：这张决策树帮你在三道门之间选对门。<\/p>\n<h2>详解<\/h2>\n<table><thead><tr><th>策略<\/th><th>子问题<\/th><th>目标<\/th><th>代表<\/th><\/tr><\/thead><tbody><tr><td>分治<\/td><td>独立不重叠<\/td><td>合并出解<\/td><td>归并排序、二分<\/td><\/tr><tr><td>回溯<\/td><td>（在解空间树上）<\/td><td>列出所有满足约束的解<\/td><td>全排列、n 皇后<\/td><\/tr><tr><td>动态规划<\/td><td>重叠<\/td><td>求最优解<\/td><td>背包、编辑距离<\/td><\/tr><\/tbody><\/table>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为三者都是&quot;递归&quot;就通用——实际上重叠子问题用分治会重复算爆炸，求最优用回溯会枚举爆炸。\n<\/li><li>\n别以为 DP 是万能最优解——实际上不满足无后效性时 DP 失效。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 12 章<\/td><td>分治<\/td><td>拆+治、子问题独立<\/td><\/tr><tr><td>第 13 章<\/td><td>回溯<\/td><td>尝试/回退/剪枝<\/td><\/tr><tr><td>第 14 章<\/td><td>DP<\/td><td>三特性、dp 表<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：递归、复杂度；后续：贪心（第 15 章）。\n<\/ul>", "kind": "concept", "title": "分治、回溯与动态规划"}, "c07": {"html": "<h1>动态规划与贪心<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 14、15 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>DP 保留所有可能状态再择优，贪心只选当前一步最优——后者更简单更快，但必须满足贪心选择性质。<\/p>\n<h2>为什么重要<\/h2>\n<p>它们都解最优化问题；选错（该 DP 用贪心）会得到次优甚至很差的解。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n    DP[DP: 记录所有状态&lt;br&gt;dp[i][c] 取 max] --&gt; Sol[最优解]\n    GR[贪心: 每步局部最优&lt;br&gt;不回看] --&gt; Sol<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：DP 权衡多条路；贪心一条路走到底。<\/p>\n<h2>详解<\/h2>\n<ul><li>\n<strong>DP<\/strong>：考虑过去所有决策，状态转移填表；适合无后效性的重叠子问题。\n<\/li><li>\n<strong>贪心<\/strong>：不回看，每步选局部最优；前提是贪心选择性质 + 最优子结构。\n<\/li><li>\n<strong>取舍<\/strong>：证明不了贪心选择性质时，用 DP 兜底。零钱兑换是经典反例。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为代码短的贪心就对——实际上零钱兑换在 [1,20,50] 下贪心得到 11 枚，DP 只要 3 枚。\n<\/li><li>\n别以为贪心一定比 DP 差——实际上满足性质时，贪心 O(n) 完胜 DP 的 O(n·cap)。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 14 章<\/td><td>DP<\/td><td>三特性、状态转移<\/td><\/tr><tr><td>第 15 章<\/td><td>贪心<\/td><td>贪心选择性质、反例<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：动态规划；后续：工程选型。\n<\/ul>", "kind": "concept", "title": "动态规划与贪心"}, "__path__": {"html": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：导读与算法入门<\/strong><br>阅读：<a href=\"#/chapter/ch00\">第 0 章：前言与导读<\/a>、<a href=\"#/chapter/ch01\">第 1 章：初识算法<\/a><br>检查点：通过 ch00/ch01 自测<\/li><li class='path-step' id='path-02'><strong>步骤 02：建立复杂度尺子<\/strong><br>阅读：<a href=\"#/chapter/ch02\">第 2 章：复杂度分析<\/a><br>检查点：通过 ch02 自测，背熟阶序<\/li><li class='path-step' id='path-03'><strong>步骤 03：数据结构总览<\/strong><br>阅读：<a href=\"#/chapter/ch03\">第 3 章：数据结构<\/a><br>检查点：通过 ch03 自测<\/li><li class='path-step' id='path-04'><strong>步骤 04：线性结构：数组/链表/栈/队列<\/strong><br>阅读：<a href=\"#/chapter/ch04\">第 4 章：数组与链表<\/a>、<a href=\"#/chapter/ch05\">第 5 章：栈与队列<\/a><br>检查点：通过 ch04/ch05 自测<\/li><li class='path-step' id='path-05'><strong>步骤 05：哈希表<\/strong><br>阅读：<a href=\"#/chapter/ch06\">第 6 章：哈希表<\/a><br>检查点：通过 ch06 自测<\/li><li class='path-step' id='path-06'><strong>步骤 06：树与堆<\/strong><br>阅读：<a href=\"#/chapter/ch07\">第 7 章：树（二叉树）<\/a>、<a href=\"#/chapter/ch08\">第 8 章：堆<\/a><br>检查点：通过 ch07/ch08 自测<\/li><li class='path-step' id='path-07'><strong>步骤 07：图与搜索<\/strong><br>阅读：<a href=\"#/chapter/ch09\">第 9 章：图<\/a>、<a href=\"#/chapter/ch10\">第 10 章：搜索（二分查找）<\/a><br>检查点：通过 ch09/ch10 自测<\/li><li class='path-step' id='path-08'><strong>步骤 08：排序<\/strong><br>阅读：<a href=\"#/chapter/ch11\">第 11 章：排序<\/a><br>检查点：通过 ch11 自测<\/li><li class='path-step' id='path-09'><strong>步骤 09：分治<\/strong><br>阅读：<a href=\"#/chapter/ch12\">第 12 章：分治<\/a><br>检查点：通过 ch12 自测<\/li><li class='path-step' id='path-10'><strong>步骤 10：回溯<\/strong><br>阅读：<a href=\"#/chapter/ch13\">第 13 章：回溯<\/a><br>检查点：通过 ch13 自测<\/li><li class='path-step' id='path-11'><strong>步骤 11：动态规划<\/strong><br>阅读：<a href=\"#/chapter/ch14\">第 14 章：动态规划<\/a><br>检查点：通过 ch14 自测<\/li><li class='path-step' id='path-12'><strong>步骤 12：贪心与附录<\/strong><br>阅读：<a href=\"#/chapter/ch15\">第 15 章：贪心<\/a>、<a href=\"#/chapter/ch16\">第 16 章：附录（环境与术语速览）<\/a><br>检查点：通过 ch15/ch16 自测 + 完成最终检验<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "kind": "path", "title": "学习路径"}, "__quiz_all__": {"html": "<p>（无综合题）<\/p>", "kind": "quiz", "title": "综合测验"}, "__quiz_ch01__": {"html": "<h1>测验：第 1 章：初识算法<\/h1><div class='quiz-item' data-qid='q01' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 本书对算法的定义是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q01' value='0'> 一段能运行的代码<\/label><label class='quiz-opt'><input type='radio' name='q01' value='1'> 解决特定问题的一系列清晰可执行的操作步骤<\/label><label class='quiz-opt'><input type='radio' name='q01' value='2'> 一个数学定理<\/label><label class='quiz-opt'><input type='radio' name='q01' value='3'> 一个软件<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q02' data-type='blank'><p class='quiz-q'><b>Q2.<\/b> 斐波那契数列从第 3 项起，每一项等于什么？<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch02__": {"html": "<h1>测验：第 2 章：复杂度分析<\/h1><div class='quiz-item' data-qid='q03' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 双重循环各执行 n 次，时间复杂度是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q03' value='0'> O(n)<\/label><label class='quiz-opt'><input type='radio' name='q03' value='1'> O(2n)<\/label><label class='quiz-opt'><input type='radio' name='q03' value='2'> O(n²)<\/label><label class='quiz-opt'><input type='radio' name='q03' value='3'> O(n³)<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q04' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 分析算法复杂度最常默认看哪种情况？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q04' value='0'> 最好<\/label><label class='quiz-opt'><input type='radio' name='q04' value='1'> 最坏<\/label><label class='quiz-opt'><input type='radio' name='q04' value='2'> 平均<\/label><label class='quiz-opt'><input type='radio' name='q04' value='3'> 随机<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q05' data-type='single'><p class='quiz-q'><b>Q3.<\/b> 递归函数必须有什么否则栈溢出？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q05' value='0'> 循环<\/label><label class='quiz-opt'><input type='radio' name='q05' value='1'> 终止条件<\/label><label class='quiz-opt'><input type='radio' name='q05' value='2'> 返回值<\/label><label class='quiz-opt'><input type='radio' name='q05' value='3'> 参数<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch04__": {"html": "<h1>测验：第 4 章：数组与链表<\/h1><div class='quiz-item' data-qid='q06' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 数组按下标随机访问的复杂度？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q06' value='0'> O(1)<\/label><label class='quiz-opt'><input type='radio' name='q06' value='1'> O(log n)<\/label><label class='quiz-opt'><input type='radio' name='q06' value='2'> O(n)<\/label><label class='quiz-opt'><input type='radio' name='q06' value='3'> O(n²)<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q07' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 链表查找第 k 个节点的复杂度？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q07' value='0'> O(1)<\/label><label class='quiz-opt'><input type='radio' name='q07' value='1'> O(log n)<\/label><label class='quiz-opt'><input type='radio' name='q07' value='2'> O(n)<\/label><label class='quiz-opt'><input type='radio' name='q07' value='3'> O(n²)<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch05__": {"html": "<h1>测验：第 5 章：栈与队列<\/h1><div class='quiz-item' data-qid='q08' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 栈的访问规则是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q08' value='0'> 先进先出<\/label><label class='quiz-opt'><input type='radio' name='q08' value='1'> 后进先出<\/label><label class='quiz-opt'><input type='radio' name='q08' value='2'> 随机<\/label><label class='quiz-opt'><input type='radio' name='q08' value='3'> 双向<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q09' data-type='single'><p class='quiz-q'><b>Q2.<\/b> BFS 通常用哪种结构实现？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q09' value='0'> 栈<\/label><label class='quiz-opt'><input type='radio' name='q09' value='1'> 队列<\/label><label class='quiz-opt'><input type='radio' name='q09' value='2'> 堆<\/label><label clas
